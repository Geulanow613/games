<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<meta name="description" content="Mitzvah Dash - four fast arcade minigames that teach real Halacha.">
<title>Mitzvah Dash</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;-ms-touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #stage{display:block;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
  #safeprobe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);}
  #fatal{position:fixed;inset:0;display:none;padding:24px;background:#12060a;color:#ffb4b4;
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;z-index:10;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="safeprobe"></div>
<pre id="fatal"></pre>
<script>
"use strict";
/* ==========================================================================
   MITZVAH DASH  v1.0.0
   Four-in-one mobile arcade suite with an embedded Halacha learning engine.
   Single self-contained file. Canvas2D renderer, fixed-timestep 60fps loop,
   full multi-touch gesture stack, procedural WebAudio, no external assets.
   Runs as a mobile web app or inside a Capacitor / WKWebView / Android
   WebView native shell for iOS + Android (see README.md).
   ========================================================================== */

/* ---------------------------------------------------------------- 0. BOOT */
window.addEventListener('error', function (e) {
  try {
    var f = document.getElementById('fatal');
    f.style.display = 'block';
    f.textContent = 'Mitzvah Dash hit an error:\n\n' + (e.message || e) +
      '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n' +
      (e.error && e.error.stack ? e.error.stack : '');
  } catch (_) {}
});

/* ------------------------------------------------------- 1. CONFIG / MATH */
var CFG = {
  W: 720, H: 1280,           // logical design resolution (locked 9:16)
  STEP: 1 / 60,              // fixed simulation step
  MAX_FRAME: 0.25,           // clamp for tab-switch spikes
  VERSION: '1.0.0',
  SAVE_KEY: 'mitzvahdash.profile.v1'
};

var C = {
  sky0:'#05070f', sky1:'#0b1026', sky2:'#1a2450', sky3:'#2b3a72',
  gold:'#ffcf5c', gold2:'#ffab26', gold3:'#7a5411',
  flame:'#ff8a3d', flameHot:'#fff2b0',
  cream:'#f6ecd6', parch:'#f3e3bd', ink:'#241d12',
  teal:'#35d6c4', blue:'#4aa3ff', red:'#ff5b5b', redDark:'#8d2020',
  green:'#52e08a', purple:'#a883ff', grey:'#93a0b5', greyDark:'#39415a',
  meat:'#e2604f', dairy:'#7fc8ff', pareve:'#8ee06a', trash:'#8a7f95',
  road:'#2b2f3d', roadLine:'#e9e2c9', grass:'#2f7d4f', grass2:'#3b8f5b',
  water:'#2f6fa8', shul:'#c9a86a'
};

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function chance(p) { return Math.random() < p; }
function dist2(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function distance(x1, y1, x2, y2) { return Math.sqrt(dist2(x1, y1, x2, y2)); }
function approach(v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t * t; }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function pulse(t, speed) { return 0.5 + 0.5 * Math.sin(t * (speed || 1) * TAU); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = randInt(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
/* shortest distance from a point to a line segment */
function segDist(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 === 0 ? 0 : clamp(((px - x1) * dx + (py - y1) * dy) / len2, 0, 1);
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function fmt(n) { n = Math.floor(n); return n >= 1000 ? n.toLocaleString('en-US') : String(n); }
function pad2(n) { return (n < 10 ? '0' : '') + Math.floor(n); }
function mmss(sec) { sec = Math.max(0, sec); return Math.floor(sec / 60) + ':' + pad2(sec % 60); }

/* ------------------------------------------------------------ 2. STORAGE */
/* Memory-first store; localStorage is a best-effort mirror only, so the game
   stays fully playable inside sandboxed webviews and private-mode browsers. */
var Store = (function () {
  var memory = {};
  var usable = false;
  try {
    var k = '__md_probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    usable = true;
  } catch (e) { usable = false; }
  return {
    available: function () { return usable; },
    read: function (key) {
      if (key in memory) return memory[key];
      if (usable) { try { return window.localStorage.getItem(key); } catch (e) {} }
      return null;
    },
    write: function (key, value) {
      memory[key] = value;
      if (usable) { try { window.localStorage.setItem(key, value); } catch (e) {} }
    }
  };
})();

/* ------------------------------------------------------- 3. PLAYER PROFILE */
var Profile = {
  data: null,
  blank: function () {
    return {
      v: 1,
      mitzvahPoints: 0,
      badges: {},
      cardsSeen: {},
      high: { menorah: 0, shul: 0, kosher: 0, matzah: 0 },
      /* the furthest chapter you have unlocked in each game - finish one and
         the next opens, so you never have to walk the whole run again */
      reached: { menorah: 1, tzedaka: 1 },
      best: { nights: 0, blocks: 0, streak: 0, crossings: 0, sliced: 0 },
      plays: 0,
      opts: { sound: true, music: true, haptics: true }
    };
  },
  load: function () {
    var raw = Store.read(CFG.SAVE_KEY);
    var d = null;
    if (raw) { try { d = JSON.parse(raw); } catch (e) { d = null; } }
    var base = Profile.blank();
    if (d && typeof d === 'object') {
      base.mitzvahPoints = d.mitzvahPoints | 0;
      if (d.badges) base.badges = d.badges;
      if (d.cardsSeen) base.cardsSeen = d.cardsSeen;
      if (d.high) for (var k in base.high) if (d.high[k] != null) base.high[k] = d.high[k] | 0;
      if (d.reached) for (var rk in base.reached) if (d.reached[rk] != null) base.reached[rk] = Math.max(1, d.reached[rk] | 0);
      if (d.best) for (var b in base.best) if (d.best[b] != null) base.best[b] = d.best[b] | 0;
      base.plays = d.plays | 0;
      if (d.opts) {
        base.opts.sound = d.opts.sound !== false;
        base.opts.music = d.opts.music !== false;
        base.opts.haptics = d.opts.haptics !== false;
      }
    }
    Profile.data = base;
    return base;
  },
  save: function () { try { Store.write(CFG.SAVE_KEY, JSON.stringify(Profile.data)); } catch (e) {} },
  addPoints: function (n) { Profile.data.mitzvahPoints += Math.max(0, Math.floor(n)); Profile.save(); },
  reached: function (game) {
    var r = Profile.data && Profile.data.reached;
    return Math.max(1, (r && r[game]) | 0);
  },
  /* finishing chapter n opens n+1, and nothing ever closes again */
  unlockLevel: function (game, n) {
    if (!Profile.data.reached) Profile.data.reached = {};
    var was = Profile.reached(game);
    if (n <= was) return false;
    Profile.data.reached[game] = n;
    Profile.save();
    return true;
  },
  hasBadge: function (id) { return !!Profile.data.badges[id]; },
  unlockBadge: function (id) {
    if (!id || Profile.data.badges[id]) return false;
    Profile.data.badges[id] = Date.now();
    Profile.save();
    return true;
  },
  badgeCount: function () { var n = 0; for (var k in Profile.data.badges) n++; return n; },
  seeCard: function (id) {
    if (Profile.data.cardsSeen[id]) return false;
    Profile.data.cardsSeen[id] = true;
    Profile.save();
    return true;
  },
  cardSeenCount: function () { var n = 0; for (var k in Profile.data.cardsSeen) n++; return n; },
  submitScore: function (gameId, score) {
    var d = Profile.data.high;
    if (d[gameId] === undefined) d[gameId] = 0;
    var isBest = score > d[gameId];
    if (isBest) d[gameId] = Math.floor(score);
    Profile.data.plays++;
    Profile.save();
    return isBest;
  },
  noteBest: function (key, value) {
    if (value > (Profile.data.best[key] || 0)) { Profile.data.best[key] = Math.floor(value); Profile.save(); }
  }
};

/* ------------------------------------------------------------ 4. HAPTICS */
var Haptics = {
  can: (typeof navigator !== 'undefined' && !!navigator.vibrate),
  fire: function (pattern) {
    if (!Haptics.can) return;
    if (!Profile.data || !Profile.data.opts.haptics) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  },
  light:  function () { Haptics.fire(12); },
  medium: function () { Haptics.fire(28); },
  heavy:  function () { Haptics.fire(55); },
  double: function () { Haptics.fire([18, 40, 18]); },
  fail:   function () { Haptics.fire([40, 60, 90]); },
  win:    function () { Haptics.fire([16, 50, 16, 50, 40]); }
};

/* ----------------------------------------------- 5. AUDIO (procedural) */
var Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  ready: false, musicTimer: null, musicStep: 0, currentTune: null,
  init: function () {
    if (Sound.ready) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      Sound.ctx = new AC();
      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = 0.9;
      Sound.master.connect(Sound.ctx.destination);
      Sound.sfxGain = Sound.ctx.createGain();
      Sound.sfxGain.gain.value = 0.55;
      Sound.sfxGain.connect(Sound.master);
      Sound.musicGain = Sound.ctx.createGain();
      Sound.musicGain.gain.value = 0.15;
      Sound.musicGain.connect(Sound.master);
      Sound.ready = true;
    } catch (e) { Sound.ready = false; }
  },
  resume: function () {
    if (!Sound.ready) Sound.init();
    if (Sound.ready && Sound.ctx.state === 'suspended') { try { Sound.ctx.resume(); } catch (e) {} }
  },
  on: function () { return Sound.ready && Profile.data && Profile.data.opts.sound; },
  tone: function (opt) {
    if (!Sound.on()) return;
    try {
      var ctx = Sound.ctx, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = opt.type || 'square';
      o.frequency.setValueAtTime(Math.max(20, opt.f || 440), t);
      var dur = opt.dur || 0.15;
      if (opt.f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f2), t + dur);
      var vol = (opt.vol == null ? 0.3 : opt.vol);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(opt.bus === 'music' ? Sound.musicGain : Sound.sfxGain);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise: function (dur, vol, filterFreq, sweep) {
    if (!Sound.on()) return;
    try {
      var ctx = Sound.ctx, t = ctx.currentTime;
      dur = dur || 0.2;
      var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource(); src.buffer = buf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(filterFreq || 1200, t);
      if (sweep) bp.frequency.exponentialRampToValueAtTime(Math.max(60, sweep), t + dur);
      var g = ctx.createGain();
      g.gain.setValueAtTime(vol == null ? 0.3 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(g); g.connect(Sound.sfxGain);
      src.start(t); src.stop(t + dur + 0.02);
    } catch (e) {}
  },
  seq: function (freqs, gap, dur, vol, type) {
    freqs.forEach(function (f, i) {
      setTimeout(function () { Sound.tone({ f: f, dur: dur, vol: vol, type: type }); }, i * gap);
    });
  },
  sfx: function (name) {
    if (!Sound.ready) Sound.init();
    switch (name) {
      case 'tap':     Sound.tone({ f: 660, f2: 880, dur: 0.07, vol: 0.18, type: 'triangle' }); break;
      case 'ui':      Sound.tone({ f: 520, f2: 700, dur: 0.09, vol: 0.22, type: 'square' }); break;
      case 'back':    Sound.tone({ f: 420, f2: 260, dur: 0.10, vol: 0.20, type: 'square' }); break;
      case 'pour':    Sound.tone({ f: 300, f2: 620, dur: 0.22, vol: 0.22, type: 'sine' });
                      Sound.noise(0.18, 0.10, 900, 2200); break;
      case 'light':   Sound.tone({ f: 880, f2: 1320, dur: 0.18, vol: 0.22, type: 'triangle' }); break;
      case 'whoosh':  Sound.noise(0.26, 0.22, 500, 2600); break;
      case 'wind':    Sound.noise(0.70, 0.16, 380, 160); break;
      case 'slice':   Sound.noise(0.14, 0.28, 2600, 700);
                      Sound.tone({ f: 1400, f2: 500, dur: 0.10, vol: 0.12, type: 'sawtooth' }); break;
      case 'splat':   Sound.noise(0.30, 0.28, 420, 120); break;
      case 'hop':     Sound.tone({ f: 520, f2: 780, dur: 0.09, vol: 0.20, type: 'square' }); break;
      case 'coin':    Sound.seq([990, 1320], 60, 0.09, 0.20, 'square'); break;
      case 'good':    Sound.tone({ f: 700, f2: 1050, dur: 0.12, vol: 0.22, type: 'triangle' }); break;
      case 'bad':     Sound.tone({ f: 240, f2: 90, dur: 0.28, vol: 0.28, type: 'sawtooth' }); break;
      case 'hurt':    Sound.tone({ f: 180, f2: 60, dur: 0.40, vol: 0.32, type: 'square' });
                      Sound.noise(0.30, 0.22, 300, 90); break;
      case 'shield':  Sound.tone({ f: 420, f2: 1200, dur: 0.35, vol: 0.22, type: 'sine' }); break;
      case 'levelup': Sound.seq([523, 659, 784, 1047], 90, 0.16, 0.22, 'triangle'); break;
      case 'lose':    Sound.seq([392, 311, 233], 150, 0.30, 0.24, 'square'); break;
      case 'badge':   Sound.seq([659, 784, 988, 1175, 1568], 70, 0.14, 0.20, 'triangle'); break;
    }
  },
  /* Original chiptune loops with a freylach / niggun flavour. MIDI numbers, 0 = rest. */
  tunes: {
    menu:  { bpm: 108, notes: [69,0,72,74,76,0,74,72,69,0,71,72,74,0,72,71,
                               69,0,72,74,76,77,76,74,72,0,71,69,69,0,0,0] },
    play:  { bpm: 132, notes: [57,64,60,64,57,64,60,64,55,62,58,62,55,62,58,62,
                               53,60,57,60,53,60,57,60,55,62,59,62,64,62,59,55] },
    tense: { bpm: 152, notes: [50,57,53,57,50,57,53,57,48,55,51,55,48,55,51,55] }
  },
  playMusic: function (name) {
    if (!Sound.ready) Sound.init();
    if (!Sound.ready) return;
    if (Sound.currentTune === name) return;
    Sound.stopMusic();
    Sound.currentTune = name;
    var tune = Sound.tunes[name];
    if (!tune) return;
    Sound.musicStep = 0;
    var interval = 60000 / tune.bpm / 2;
    Sound.musicTimer = setInterval(function () {
      if (!Profile.data || !Profile.data.opts.music || !Profile.data.opts.sound) return;
      if (!Sound.ctx || Sound.ctx.state === 'suspended') return;
      var n = tune.notes[Sound.musicStep % tune.notes.length];
      Sound.musicStep++;
      if (!n) return;
      var f = 440 * Math.pow(2, (n - 69) / 12);
      Sound.tone({ f: f, dur: interval / 1000 * 0.9, vol: 0.20, type: 'square', bus: 'music' });
      if (Sound.musicStep % 4 === 1) {
        Sound.tone({ f: f / 4, dur: interval / 1000 * 1.6, vol: 0.16, type: 'triangle', bus: 'music' });
      }
    }, interval);
  },
  stopMusic: function () {
    if (Sound.musicTimer) { clearInterval(Sound.musicTimer); Sound.musicTimer = null; }
    Sound.currentTune = null;
  }
};

/* ------------------------------------------ 6. VIEWPORT / LETTERBOX VIEW */
var View = {
  canvas: null, ctx: null,
  dpr: 1, scale: 1, ox: 0, oy: 0,
  cssW: 0, cssH: 0,
  safe: { t: 0, r: 0, b: 0, l: 0 },
  init: function () {
    View.canvas = document.getElementById('stage');
    View.ctx = View.canvas.getContext('2d', { alpha: false, desynchronized: true });
    View.resize();
    window.addEventListener('resize', View.resize, false);
    window.addEventListener('orientationchange', function () { setTimeout(View.resize, 120); }, false);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', View.resize, false);
  },
  resize: function () {
    var cw = Math.max(1, window.innerWidth);
    var ch = Math.max(1, window.innerHeight);
    if (window.visualViewport) {
      cw = Math.max(1, Math.round(window.visualViewport.width));
      ch = Math.max(1, Math.round(window.visualViewport.height));
    }
    View.cssW = cw; View.cssH = ch;
    View.dpr = Math.min(window.devicePixelRatio || 1, 3);
    View.canvas.width = Math.round(cw * View.dpr);
    View.canvas.height = Math.round(ch * View.dpr);
    View.canvas.style.width = cw + 'px';
    View.canvas.style.height = ch + 'px';
    View.scale = Math.min(cw / CFG.W, ch / CFG.H);
    View.ox = (cw - CFG.W * View.scale) / 2;
    View.oy = (ch - CFG.H * View.scale) / 2;
    /* safe-area insets, expressed in game units inside the letterboxed stage */
    var t = 0, r = 0, b = 0, l = 0;
    var probe = document.getElementById('safeprobe');
    if (probe) {
      var cs = window.getComputedStyle(probe);
      t = parseFloat(cs.paddingTop) || 0;
      r = parseFloat(cs.paddingRight) || 0;
      b = parseFloat(cs.paddingBottom) || 0;
      l = parseFloat(cs.paddingLeft) || 0;
    }
    var s = View.scale || 1;
    View.safe.t = Math.max(0, (t - View.oy) / s);
    View.safe.b = Math.max(0, (b - View.oy) / s);
    View.safe.l = Math.max(0, (l - View.ox) / s);
    View.safe.r = Math.max(0, (r - View.ox) / s);
  },
  /* client (CSS px) -> game space */
  toGame: function (clientX, clientY) {
    var rect = View.canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - View.ox) / View.scale,
      y: (clientY - rect.top - View.oy) / View.scale
    };
  },
  begin: function () {
    var ctx = View.ctx;
    ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, View.cssW, View.cssH);
    ctx.save();
    ctx.translate(View.ox, View.oy);
    ctx.scale(View.scale, View.scale);
    ctx.beginPath();
    ctx.rect(0, 0, CFG.W, CFG.H);
    ctx.clip();
  },
  end: function () { View.ctx.restore(); }
};

/* --------------------------------------------- 7. INPUT / GESTURE ENGINE */
var Input = {
  pointers: {},          // id -> pointer record (live, for drag / steering)
  count: 0,
  events: [],            // consumed once per frame by the active scene
  lastSwipeAt: -10,
  lastSwipe: null,
  /* anything that travelled further than a tap is a swipe - there must be no
     dead band in between, or short deliberate flicks do nothing at all */
  SWIPE_MIN: 22,
  TAP_MAX_MOVE: 22,
  TAP_MAX_TIME: 0.42,
  init: function () {
    var el = View.canvas;
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', Input._down, { passive: false });
      el.addEventListener('pointermove', Input._move, { passive: false });
      el.addEventListener('pointerup', Input._up, { passive: false });
      el.addEventListener('pointercancel', Input._up, { passive: false });
      el.addEventListener('pointerleave', Input._up, { passive: false });
    } else {
      el.addEventListener('touchstart', Input._touch(Input._down), { passive: false });
      el.addEventListener('touchmove', Input._touch(Input._move), { passive: false });
      el.addEventListener('touchend', Input._touch(Input._up), { passive: false });
      el.addEventListener('touchcancel', Input._touch(Input._up), { passive: false });
      el.addEventListener('mousedown', Input._down, { passive: false });
      el.addEventListener('mousemove', Input._move, { passive: false });
      el.addEventListener('mouseup', Input._up, { passive: false });
    }
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
    /* Desktop keyboard shim, handy for QA and for playing in a browser. */
    window.addEventListener('keydown', Input._key, false);
  },
  _touch: function (fn) {
    return function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        fn({ pointerId: t.identifier, clientX: t.clientX, clientY: t.clientY, preventDefault: function () {} });
      }
    };
  },
  _key: function (e) {
    var k = e.key;
    var cx = CFG.W / 2, cy = CFG.H / 2;
    var map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
    if (map[k]) {
      e.preventDefault();
      var dir = map[k];
      var v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
      Input.events.push({
        type: 'swipe', id: -1, dir: dir, x: cx, y: cy,
        x2: cx + v[0] * 160, y2: cy + v[1] * 160,
        dx: v[0] * 160, dy: v[1] * 160, len: 160, speed: 1600, keyboard: true
      });
    } else if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      Input.events.push({ type: 'tap', id: -1, x: cx, y: cy, keyboard: true });
    } else if (k === 'Escape' || k === 'p' || k === 'P') {
      Input.events.push({ type: 'escape' });
    }
  },
  _down: function (e) {
    if (e.preventDefault) e.preventDefault();
    Sound.resume();
    var p = View.toGame(e.clientX, e.clientY);
    var rec = {
      id: e.pointerId == null ? 0 : e.pointerId,
      sx: p.x, sy: p.y, x: p.x, y: p.y, px: p.x, py: p.y,
      t0: Game.time, tLast: Game.time,
      vx: 0, vy: 0, moved: false, maxMove: 0,
      trail: [{ x: p.x, y: p.y, t: Game.time }]
    };
    Input.pointers[rec.id] = rec;
    Input.count++;
    Input.events.push({ type: 'down', id: rec.id, x: p.x, y: p.y });
  },
  _move: function (e) {
    if (e.preventDefault) e.preventDefault();
    var id = e.pointerId == null ? 0 : e.pointerId;
    var rec = Input.pointers[id];
    if (!rec) return;
    var p = View.toGame(e.clientX, e.clientY);
    var dt = Math.max(0.001, Game.time - rec.tLast);
    rec.px = rec.x; rec.py = rec.y;
    rec.x = p.x; rec.y = p.y;
    var dx = rec.x - rec.px, dy = rec.y - rec.py;
    rec.vx = lerp(rec.vx, dx / dt, 0.5);
    rec.vy = lerp(rec.vy, dy / dt, 0.5);
    rec.tLast = Game.time;
    var moveTotal = distance(rec.sx, rec.sy, rec.x, rec.y);
    if (moveTotal > rec.maxMove) rec.maxMove = moveTotal;
    if (moveTotal > Input.TAP_MAX_MOVE) rec.moved = true;
    rec.trail.push({ x: rec.x, y: rec.y, t: Game.time });
    if (rec.trail.length > 24) rec.trail.shift();
    Input.events.push({
      type: 'move', id: id, x: rec.x, y: rec.y, px: rec.px, py: rec.py,
      dx: dx, dy: dy, speed: Math.hypot(rec.vx, rec.vy)
    });
  },
  _up: function (e) {
    if (e.preventDefault) e.preventDefault();
    var id = e.pointerId == null ? 0 : e.pointerId;
    var rec = Input.pointers[id];
    if (!rec) return;
    delete Input.pointers[id];
    Input.count = Math.max(0, Input.count - 1);
    var dur = Game.time - rec.t0;
    var dx = rec.x - rec.sx, dy = rec.y - rec.sy;
    var len = Math.hypot(dx, dy);
    Input.events.push({ type: 'up', id: id, x: rec.x, y: rec.y, dur: dur, len: len });
    if (!rec.moved && dur <= Input.TAP_MAX_TIME) {
      Input.events.push({ type: 'tap', id: id, x: rec.x, y: rec.y });
      return;
    }
    if (len >= Input.SWIPE_MIN) {
      var dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      var ev = {
        type: 'swipe', id: id, dir: dir,
        x: rec.sx, y: rec.sy, x2: rec.x, y2: rec.y,
        dx: dx, dy: dy, len: len, dur: dur, speed: len / Math.max(0.03, dur),
        trail: rec.trail.slice()
      };
      Input.events.push(ev);
      var near = Input.lastSwipe && distance(Input.lastSwipe.x, Input.lastSwipe.y, ev.x, ev.y) < 340;
      if (Input.lastSwipe && near && Game.time - Input.lastSwipeAt < 0.25) {
        Input.events.push({
          type: 'multiswipe', count: 2, a: Input.lastSwipe, b: ev,
          x: (Input.lastSwipe.x2 + ev.x2) / 2, y: (Input.lastSwipe.y2 + ev.y2) / 2
        });
        Input.lastSwipeAt = -10; Input.lastSwipe = null;
      } else {
        Input.lastSwipeAt = Game.time; Input.lastSwipe = ev;
      }
    }
  },
  /* Returns and clears this frame's gesture queue. */
  drain: function () { var e = Input.events; Input.events = []; return e; },
  /* Live helpers */
  anyPointerIn: function (x, y, w, h) {
    for (var id in Input.pointers) {
      var p = Input.pointers[id];
      if (p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h) return p;
    }
    return null;
  },
  first: function () { for (var id in Input.pointers) return Input.pointers[id]; return null; },
  clear: function () { Input.pointers = {}; Input.count = 0; Input.events.length = 0; }
};

/* --------------------------------------------------- 8. FX / PARTICLES */
var FX = {
  parts: [], texts: [], slashes: [],
  shakeAmt: 0, shakeT: 0, flashColor: null, flashT: 0, flashDur: 0.3,
  reset: function () { FX.parts.length = 0; FX.texts.length = 0; FX.slashes.length = 0; FX.shakeAmt = 0; FX.flashT = 0; },
  burst: function (x, y, opts) {
    opts = opts || {};
    var n = opts.n || 12;
    for (var i = 0; i < n; i++) {
      var a = opts.angle != null ? opts.angle + rand(-0.6, 0.6) : rand(0, TAU);
      var sp = rand(opts.spdMin || 60, opts.spdMax || 320);
      FX.parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opts.lift || 0),
        life: rand(opts.lifeMin || 0.3, opts.lifeMax || 0.9), age: 0,
        r: rand(opts.rMin || 3, opts.rMax || 9),
        color: opts.color || C.gold, grav: opts.grav == null ? 520 : opts.grav,
        shape: opts.shape || 'circle', spin: rand(-8, 8), rot: rand(0, TAU),
        fade: opts.fade !== false
      });
    }
  },
  ring: function (x, y, color, radius) {
    FX.parts.push({ x: x, y: y, vx: 0, vy: 0, life: 0.45, age: 0, r: radius || 20,
      color: color || C.gold, grav: 0, shape: 'ring', spin: 0, rot: 0, fade: true, grow: (radius || 20) * 3 });
  },
  text: function (x, y, str, color, size, life) {
    var span = life == null ? 1.1 : life;
    FX.texts.push({ x: x, y: y, str: str, color: color || C.gold, size: size || 34, age: 0, life: span });
  },
  slash: function (pts, color) {
    if (!pts || pts.length < 2) return;
    FX.slashes.push({ pts: pts.slice(-12), color: color || '#ffffff', age: 0, life: 0.28 });
  },
  shake: function (amt, dur) { FX.shakeAmt = Math.max(FX.shakeAmt, amt); FX.shakeT = Math.max(FX.shakeT, dur || 0.3); },
  flash: function (color, dur) { FX.flashColor = color; FX.flashT = dur || 0.3; FX.flashDur = dur || 0.3; },
  update: function (dt) {
    var i, p;
    for (i = FX.parts.length - 1; i >= 0; i--) {
      p = FX.parts[i];
      p.age += dt;
      if (p.age >= p.life) { FX.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.grav * dt;
      p.vx *= (1 - 1.2 * dt);
      p.rot += p.spin * dt;
    }
    for (i = FX.texts.length - 1; i >= 0; i--) {
      var t = FX.texts[i];
      t.age += dt;
      if (t.age >= t.life) { FX.texts.splice(i, 1); continue; }
      t.y -= 70 * (1.1 / Math.max(t.life, 1.1)) * dt;
    }
    for (i = FX.slashes.length - 1; i >= 0; i--) {
      var s = FX.slashes[i];
      s.age += dt;
      if (s.age >= s.life) FX.slashes.splice(i, 1);
    }
    if (FX.shakeT > 0) { FX.shakeT -= dt; if (FX.shakeT <= 0) FX.shakeAmt = 0; }
    if (FX.flashT > 0) FX.flashT -= dt;
  },
  applyShake: function (ctx) {
    if (FX.shakeT > 0 && FX.shakeAmt > 0) {
      var k = FX.shakeAmt * (FX.shakeT / 0.3);
      ctx.translate(rand(-k, k), rand(-k, k));
    }
  },
  render: function (ctx) {
    var i, p;
    for (i = 0; i < FX.parts.length; i++) {
      p = FX.parts[i];
      var k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = p.fade ? clamp(k, 0, 1) : 1;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;
      if (p.shape === 'ring') {
        ctx.lineWidth = 5 * k + 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, lerp(p.r, p.grow, 1 - k), 0, TAU);
        ctx.stroke();
      } else if (p.shape === 'square') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      } else if (p.shape === 'spark') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r * 2, -p.r * 0.35, p.r * 4, p.r * 0.7);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * clamp(k + 0.25, 0.2, 1.2), 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    for (i = 0; i < FX.slashes.length; i++) {
      var s = FX.slashes[i];
      var a = 1 - s.age / s.life;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = s.color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = 14 * a + 2;
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (var j = 1; j < s.pts.length; j++) ctx.lineTo(s.pts[j].x, s.pts[j].y);
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < FX.texts.length; i++) {
      var t2 = FX.texts[i];
      var k2 = 1 - t2.age / t2.life;
      ctx.save();
      ctx.globalAlpha = clamp(k2 * 1.6, 0, 1);
      Draw.textSafe(ctx, t2.str, t2.x, t2.y, {
        size: t2.size * (1 + (1 - k2) * 0.15), color: t2.color,
        weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 6
      });
      ctx.restore();
    }
  },
  renderFlash: function (ctx) {
    if (FX.flashT > 0 && FX.flashColor) {
      ctx.save();
      ctx.globalAlpha = clamp(FX.flashT / FX.flashDur, 0, 1) * 0.55;
      ctx.fillStyle = FX.flashColor;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.restore();
    }
  }
};

/* ------------------------------------------------------ 9. DRAW HELPERS */
var Draw = {
  font: function (size, weight) {
    return (weight || '700') + ' ' + Math.round(size) + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
  },
  rr: function (ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  },
  text: function (ctx, str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.font = o.font || Draw.font(o.size || 28, o.weight || '700');
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'middle';
    if (o.shadow) {
      ctx.shadowColor = o.shadow;
      ctx.shadowBlur = o.shadowBlur || 12;
      ctx.shadowOffsetY = o.shadowY || 2;
    }
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = o.stroke;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || C.cream;
    ctx.fillText(str, x, y);
    ctx.restore();
  },
  /* draw a single line, shrinking the type until it fits maxW */
  textFit: function (ctx, str, x, y, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var w = Draw.measure(ctx, str, size, o.weight || '700');
    if (w > maxW && w > 0) size = Math.max(size * 0.5, size * (maxW / w));
    var oo = {};
    for (var k in o) oo[k] = o[k];
    oo.size = size;
    Draw.text(ctx, str, x, y, oo);
    return size;
  },
  /* centred text that shrinks if it is too wide and slides inward so it can
     never run off the edge of the stage */
  textSafe: function (ctx, str, x, y, o) {
    o = o || {};
    var size = o.size || 24;
    var maxW = o.maxW || (CFG.W - 40);
    var w = Draw.measure(ctx, str, size, o.weight || '700');
    if (w > maxW && w > 0) { size = Math.max(size * 0.5, size * (maxW / w)); w = maxW; }
    var half = w / 2;
    var oo = {};
    for (var k in o) oo[k] = o[k];
    oo.size = size;
    oo.align = 'center';
    Draw.text(ctx, str, clamp(x, 20 + half, CFG.W - 20 - half), y, oo);
    return size;
  },
  measure: function (ctx, str, size, weight) {
    ctx.save();
    ctx.font = Draw.font(size, weight);
    var w = ctx.measureText(str).width;
    ctx.restore();
    return w;
  },
  wrap: function (ctx, str, maxW, size, weight) {
    ctx.save();
    ctx.font = Draw.font(size, weight || '600');
    var paras = String(str).split('\n');
    var out = [];
    for (var p = 0; p < paras.length; p++) {
      var words = paras[p].split(' ');
      var line = '';
      for (var i = 0; i < words.length; i++) {
        var test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = words[i]; }
        else line = test;
      }
      out.push(line);
    }
    ctx.restore();
    return out;
  },
  para: function (ctx, str, x, y, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var lh = o.lineHeight || size * 1.38;
    var lines = Draw.wrap(ctx, str, maxW, size, o.weight || '600');
    for (var i = 0; i < lines.length; i++) {
      Draw.text(ctx, lines[i], x, y + i * lh, o);
    }
    return y + lines.length * lh;
  },
  paraHeight: function (ctx, str, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var lh = o.lineHeight || size * 1.38;
    return Draw.wrap(ctx, str, maxW, size, o.weight || '600').length * lh;
  },
  panel: function (ctx, x, y, w, h, o) {
    o = o || {};
    ctx.save();
    if (o.glow) {
      ctx.shadowColor = o.glow;
      ctx.shadowBlur = o.glowBlur || 26;
    }
    Draw.rr(ctx, x, y, w, h, o.radius == null ? 22 : o.radius);
    ctx.fillStyle = o.fill || 'rgba(12,17,38,.94)';
    ctx.fill();
    ctx.shadowBlur = 0;
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 3;
      ctx.strokeStyle = o.stroke;
      ctx.stroke();
    }
    ctx.restore();
  },
  meter: function (ctx, x, y, w, h, pct, o) {
    o = o || {};
    pct = clamp(pct, 0, 1);
    ctx.save();
    Draw.rr(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = o.bg || 'rgba(0,0,0,.55)';
    ctx.fill();
    if (pct > 0.001) {
      ctx.save();
      Draw.rr(ctx, x, y, w, h, h / 2);
      ctx.clip();
      ctx.fillStyle = o.fg || C.gold;
      ctx.fillRect(x, y, w * pct, h);
      if (o.gloss !== false) {
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.fillRect(x, y, w * pct, h * 0.42);
      }
      ctx.restore();
    }
    ctx.lineWidth = o.borderW || 2.5;
    ctx.strokeStyle = o.border || 'rgba(255,255,255,.32)';
    Draw.rr(ctx, x, y, w, h, h / 2);
    ctx.stroke();
    ctx.restore();
  },
  heart: function (ctx, x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 20, s / 20);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-14, -6, -9, -18, 0, -10);
    ctx.bezierCurveTo(9, -18, 14, -6, 0, 6);
    ctx.closePath();
    ctx.fillStyle = filled ? C.red : 'rgba(255,255,255,.16)';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = filled ? '#ffd0d0' : 'rgba(255,255,255,.35)';
    ctx.stroke();
    ctx.restore();
  },
  hearts: function (ctx, x, y, cur, max, size) {
    size = size || 30;
    for (var i = 0; i < max; i++) Draw.heart(ctx, x + i * (size + 8), y, size, i < cur);
  },
  star: function (ctx, x, y, r, points, inner) {
    points = points || 5;
    inner = inner || r * 0.46;
    ctx.beginPath();
    for (var i = 0; i < points * 2; i++) {
      var rad = i % 2 === 0 ? r : inner;
      var a = (i / (points * 2)) * TAU - Math.PI / 2;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  },
  magenDavid: function (ctx, x, y, r, color, lw) {
    ctx.save();
    ctx.strokeStyle = color || C.gold;
    ctx.lineWidth = lw || 4;
    ctx.lineJoin = 'round';
    for (var t = 0; t < 2; t++) {
      ctx.beginPath();
      for (var i = 0; i < 3; i++) {
        var a = -Math.PI / 2 + t * Math.PI / 3 + i * TAU / 3;
        var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  },
  flame: function (ctx, x, y, size, t, alive) {
    if (!alive) return;
    var w = size * (0.85 + 0.15 * Math.sin(t * 9 + x));
    var h = size * (1.9 + 0.28 * Math.sin(t * 7.3 + x * 0.4));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x, y - h * 0.35, 1, x, y - h * 0.3, h * 1.5);
    g.addColorStop(0, 'rgba(255,240,180,.95)');
    g.addColorStop(0.35, 'rgba(255,150,50,.55)');
    g.addColorStop(1, 'rgba(255,110,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - h * 0.3, h * 1.4, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.quadraticCurveTo(x + w, y - h * 0.42, x + w * 0.55, y);
    ctx.quadraticCurveTo(x, y + size * 0.22, x - w * 0.55, y);
    ctx.quadraticCurveTo(x - w, y - h * 0.42, x, y - h);
    ctx.closePath();
    ctx.fillStyle = C.flame;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.66);
    ctx.quadraticCurveTo(x + w * 0.44, y - h * 0.24, x, y - size * 0.05);
    ctx.quadraticCurveTo(x - w * 0.44, y - h * 0.24, x, y - h * 0.66);
    ctx.closePath();
    ctx.fillStyle = C.flameHot;
    ctx.fill();
    ctx.restore();
  },
  vGradient: function (ctx, x, y, w, h, stops) {
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  },
  scrim: function (ctx, alpha) {
    ctx.save();
    ctx.fillStyle = 'rgba(3,5,12,' + (alpha == null ? 0.72 : alpha) + ')';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.restore();
  }
};

/* ------------------------------------------ 10. CLOUDS (shared backdrop) */
/* The sky in this game is deliberately plain: no sun, moon or stars anywhere.
   Drifting cloud banks give the backdrops depth instead. */
var Clouds = {
  list: null,
  ensure: function () {
    if (Clouds.list) return;
    Clouds.list = [];
    for (var i = 0; i < 9; i++) {
      var puffs = [];
      var n = randInt(4, 6);
      for (var p = 0; p < n; p++) {
        puffs.push({ dx: rand(-76, 76), dy: rand(-13, 13), r: rand(24, 46) });
      }
      Clouds.list.push({
        x: rand(-180, CFG.W + 180),
        y: rand(70, 560),
        sp: rand(4, 13) * (chance(0.5) ? 1 : -1),
        scale: rand(0.65, 1.45),
        alpha: rand(0.5, 1),
        puffs: puffs
      });
    }
  },
  render: function (ctx, t, color, alphaMul) {
    Clouds.ensure();
    var span = CFG.W + 460;
    ctx.save();
    for (var i = 0; i < Clouds.list.length; i++) {
      var c = Clouds.list[i];
      var x = ((c.x + t * c.sp) % span + span) % span - 230;
      ctx.globalAlpha = c.alpha * (alphaMul == null ? 1 : alphaMul);
      ctx.fillStyle = color || 'rgba(206,220,244,1)';
      /* one compound path, one fill - overlapping puffs must not darken */
      ctx.beginPath();
      for (var p = 0; p < c.puffs.length; p++) {
        var pu = c.puffs[p];
        var px = x + pu.dx * c.scale, py = c.y + pu.dy * c.scale, pr = pu.r * c.scale;
        ctx.moveTo(px + pr, py);
        ctx.arc(px, py, pr, 0, TAU);
      }
      ctx.fill();
    }
    ctx.restore();
  }
};

/* -------------------------------------------------------- 11. UI BUTTONS */
function Button(x, y, w, h, label, onTap, opts) {
  this.x = x; this.y = y; this.w = w; this.h = h;
  this.label = label; this.onTap = onTap;
  opts = opts || {};
  this.fill = opts.fill || 'rgba(255,207,92,.96)';
  this.textColor = opts.textColor || C.ink;
  this.stroke = opts.stroke || 'rgba(255,255,255,.5)';
  this.size = opts.size || 30;
  this.radius = opts.radius == null ? 18 : opts.radius;
  this.icon = opts.icon || null;
  this.sub = opts.sub || null;
  this.disabled = !!opts.disabled;
  this.press = 0;
  this.data = opts.data || null;
  this.pad = opts.pad == null ? 14 : opts.pad;   // extra touch slop
  /* a hit target the screen draws for itself - the button is only the tap */
  this.invisible = !!opts.invisible;
}
Button.prototype.contains = function (x, y) {
  return x >= this.x - this.pad && x <= this.x + this.w + this.pad &&
         y >= this.y - this.pad && y <= this.y + this.h + this.pad;
};
Button.prototype.draw = function (ctx, t) {
  var k = this.press;
  var x = this.x + k * 2, y = this.y + k * 3, w = this.w - k * 4, h = this.h - k * 4;
  ctx.save();
  ctx.globalAlpha = this.disabled ? 0.45 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  Draw.rr(ctx, this.x + 3, this.y + 6, this.w, this.h, this.radius);
  ctx.fill();
  Draw.rr(ctx, x, y, w, h, this.radius);
  ctx.fillStyle = this.fill;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = this.stroke;
  ctx.stroke();
  ctx.save();
  Draw.rr(ctx, x, y, w, h, this.radius);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fillRect(x, y, w, h * 0.4);
  ctx.restore();
  var cy = y + h / 2 + (this.sub ? -10 : 0);
  var label = (this.icon ? this.icon + '  ' : '') + this.label;
  Draw.text(ctx, label, x + w / 2, cy, {
    size: this.size, color: this.textColor, align: 'center', weight: '900'
  });
  if (this.sub) {
    Draw.text(ctx, this.sub, x + w / 2, cy + 26, {
      size: this.size * 0.55, color: this.textColor, align: 'center', weight: '700'
    });
  }
  ctx.restore();
};
Button.prototype.update = function (dt) {
  this.press = approach(this.press, 0, dt * 8);
};

var UI = {
  handle: function (list, ev) {
    if (!list) return false;
    if (ev.type === 'down') {
      for (var i = 0; i < list.length; i++) {
        if (!list[i].disabled && list[i].contains(ev.x, ev.y)) { list[i].press = 1; }
      }
      return false;
    }
    if (ev.type !== 'tap') return false;
    for (var j = 0; j < list.length; j++) {
      var b = list[j];
      if (b.disabled) continue;
      if (b.contains(ev.x, ev.y)) {
        b.press = 1;
        Sound.sfx('ui');
        Haptics.light();
        if (b.onTap) b.onTap(b);
        return true;
      }
    }
    return false;
  },
  drawAll: function (ctx, list, t, dt) {
    for (var i = 0; i < list.length; i++) {
      list[i].update(dt || 0);
      if (!list[i].invisible) list[i].draw(ctx, t);
    }
  }
};

  byId: function (id) {
    for (var i = 0; i < Halacha.cards.length; i++) if (Halacha.cards[i].id === id) return Halacha.cards[i];
    return null;
  },
  badgeById: function (id) {
    for (var i = 0; i < Halacha.badges.length; i++) if (Halacha.badges[i].id === id) return Halacha.badges[i];
    return null;
  },
  forGame: function (game) {
    return Halacha.cards.filter(function (c) { return c.game === game; });
  },
  /* Prefer a card the player has not read yet, otherwise cycle. */
  next: function (game, index) {
    var pool = Halacha.forGame(game);
    if (!pool.length) pool = Halacha.cards;
    for (var i = 0; i < pool.length; i++) {
      if (!Profile.data.cardsSeen[pool[i].id]) return pool[i];
    }
    return pool[(index | 0) % pool.length];
  },
  totalCards: function () { return Halacha.cards.length; }
};

    hoof: function (ctx) {

      ctx.moveTo(-8, -34); ctx.quadraticCurveTo(-34, 0, -18, 34); ctx.quadraticCurveTo(-4, 20, -4, -6);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, -34); ctx.quadraticCurveTo(34, 0, 18, 34); ctx.quadraticCurveTo(4, 20, 4, -6);
      ctx.closePath(); ctx.stroke();
    },
    stamp: function (ctx) {
      ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-16, 2); ctx.lineTo(-4, 16); ctx.lineTo(18, -14); ctx.stroke();
    },
    bug: function (ctx) {
      ctx.beginPath(); ctx.ellipse(0, 4, 20, 28, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, 32); ctx.stroke();
      [-1, 1].forEach(function (s) {
        ctx.beginPath(); ctx.moveTo(s * 18, -10); ctx.lineTo(s * 38, -20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s * 20, 6); ctx.lineTo(s * 40, 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s * 18, 20); ctx.lineTo(s * 36, 32); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s * 8, -26); ctx.lineTo(s * 18, -40); ctx.stroke();
      });
    },
    candle: function (ctx) {
      ctx.beginPath(); ctx.rect(-12, -8, 24, 44); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -40); ctx.quadraticCurveTo(14, -22, 0, -12);
      ctx.quadraticCurveTo(-14, -22, 0, -40); ctx.closePath(); ctx.fill();
    },
    scroll: function (ctx) {
      ctx.beginPath(); ctx.rect(-26, -32, 52, 64); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-14, -14); ctx.lineTo(14, -14);
      ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
      ctx.moveTo(-14, 14); ctx.lineTo(4, 14);
      ctx.stroke();
    },
    matzah: function (ctx) {
      ctx.beginPath(); ctx.rect(-34, -34, 68, 68); ctx.stroke();
      for (var i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 13, -30); ctx.lineTo(i * 13, 30);
        ctx.setLineDash([6, 8]); ctx.lineWidth = 5; ctx.stroke();
      }
      ctx.setLineDash([]);
    },
    ban: function (ctx) {
      ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-24, -24); ctx.lineTo(24, 24); ctx.stroke();
    },
    slice: function (ctx) {
      ctx.beginPath(); ctx.moveTo(-40, 30); ctx.quadraticCurveTo(0, -34, 40, -30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, -34); ctx.lineTo(40, -30); ctx.lineTo(30, -10); ctx.stroke();
    },
    cloud: function (ctx) {
      ctx.beginPath();
      ctx.arc(-16, 4, 18, Math.PI * 0.5, Math.PI * 1.5);
      ctx.arc(2, -12, 22, Math.PI, 0);
      ctx.arc(20, 4, 18, Math.PI * 1.5, Math.PI * 0.5);
      ctx.closePath(); ctx.stroke();
    },
    truck: function (ctx) {
      ctx.beginPath(); ctx.rect(-40, -18, 46, 34); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, -4); ctx.lineTo(24, -4); ctx.lineTo(38, 8); ctx.lineTo(38, 16); ctx.lineTo(6, 16);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-22, 22, 9, 0, TAU); ctx.moveTo(35, 22); ctx.arc(26, 22, 9, 0, TAU); ctx.stroke();
    },
    dreidel: function (ctx) {
      ctx.beginPath();
      ctx.moveTo(-26, -20); ctx.lineTo(26, -20); ctx.lineTo(26, 8);
      ctx.lineTo(0, 36); ctx.lineTo(-26, 8); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -38); ctx.stroke();
    },
    /* a rosette, not a star - the sky in this game has no celestial bodies */
    coin: function (ctx) {
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
      /* milled edge, so it reads as a coin and not a monogram */
      ctx.lineWidth = 6;
      for (var i = 0; i < 12; i++) {
        var a = i * TAU / 12;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32);
        ctx.lineTo(Math.cos(a) * 40, Math.sin(a) * 40);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    },
    pushka: function (ctx) {
      ctx.lineWidth = 8;
      ctx.strokeRect(-34, -8, 68, 50);
      ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(16, -8); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -34, 13, 0, TAU); ctx.fill();
    },
    hand: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-34, 6);
      ctx.quadraticCurveTo(-40, 34, -6, 42);
      ctx.quadraticCurveTo(30, 46, 36, 18);
      ctx.lineTo(36, 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-34, 6); ctx.lineTo(-34, -12);
      ctx.moveTo(-11, 4); ctx.lineTo(-11, -26);
      ctx.moveTo(12, 4); ctx.lineTo(12, -22);
      ctx.moveTo(34, 6); ctx.lineTo(34, -8);
      ctx.stroke();
    },
    seter: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-42, 0);
      ctx.quadraticCurveTo(0, -34, 42, 0);
      ctx.quadraticCurveTo(0, 34, -42, 0);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-38, 30); ctx.lineTo(38, -30); ctx.stroke();
    },
    lift: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-40, 30); ctx.quadraticCurveTo(-14, 30, -6, 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(40, 30); ctx.quadraticCurveTo(14, 30, 6, 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(0, -36); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-20, -18); ctx.lineTo(0, -40); ctx.lineTo(20, -18); ctx.stroke();
    },
    sling: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(0, 4); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(-28, -26);
      ctx.moveTo(0, 6); ctx.lineTo(28, -26);
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-28, -26); ctx.quadraticCurveTo(0, 6, 28, -26); ctx.stroke();
    },
    heart: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(0, 40);
      ctx.quadraticCurveTo(-44, 8, -44, -12);
      ctx.arc(-22, -12, 22, Math.PI, 0);
      ctx.arc(22, -12, 22, Math.PI, 0);
      ctx.quadraticCurveTo(44, 8, 0, 40);
      ctx.closePath(); ctx.stroke();
    },
    rosette: function (ctx) {
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, TAU);
      ctx.fill();
      for (var i = 0; i < 6; i++) {
        var a = i * TAU / 6;
        ctx.save();
        ctx.translate(Math.cos(a) * 24, Math.sin(a) * 24);
        ctx.rotate(a);
        ctx.beginPath();
        ctx.ellipse(0, 0, 17, 10, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, TAU);
      ctx.stroke();
    }
  }
};

/* ==========================================================================
   14. GAME CORE - STATE MACHINE, LOOP, HUD, POPUPS, BADGE AWARDS
   States: MENU / GALLERY / INTRO / PLAYING / PAUSED / HALACHA_POPUP / GAME_OVER
   ========================================================================== */
var Game = {
  time: 0, dt: 0, fps: 60,
  state: 'MENU', prevState: null,
  scene: null,
  popup: null,
  gameover: null,
  toasts: [],
  accum: 0, lastTs: 0, running: false,
  pauseBtn: null,
  stateT: 0,

  /* ------------------------------------------------------------- setup */
  init: function () {
    Profile.load();
    View.init();
    Input.init();
    Clouds.ensure();
    Screens.init();
    Game.pauseBtn = new Button(0, 0, 68, 68, '', function () { Game.pause(); },
      { fill: 'rgba(10,16,36,.85)', stroke: 'rgba(255,255,255,.45)', radius: 20, icon: null });
    Game.setState('MENU');
    Game.running = true;
    Game.lastTs = performance.now();
    requestAnimationFrame(Game.loop);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (Game.state === 'PLAYING') Game.pause();
        Sound.stopMusic();
      } else if (Game.state === 'MENU' || Game.state === 'GALLERY') {
        Sound.playMusic('menu');
      }
    }, false);
  },

  setState: function (s) {
    Game.prevState = Game.state;
    Game.state = s;
    Game.stateT = 0;
    if (s === 'MENU' || s === 'GALLERY') Sound.playMusic('menu');
    if (s === 'PLAYING') Sound.playMusic('play');
    if (s === 'GAME_OVER') Sound.stopMusic();
  },

  /* ------------------------------------------------------ game lifecycle */
  startGame: function (id) {
    FX.reset();
    Input.clear();
    var ctor = { menorah: MenorahKeeper, shul: ShulCrossing, kosher: KosherSort,
                 matzah: MatzahHavoc, tzedaka: TzedakaBlast }[id];
    Game.scene = new ctor();
    Game.scene.reset();
    Game.gameover = null;
    Screens.buildIntro(Game.scene);
    Game.setState('INTRO');
  },

  beginPlay: function () {
    Input.clear();
    /* start wherever the picker was left - chapter 1 unless you chose another
       one you have already earned */
    var s = Game.scene;
    if (s && s.startAt && s.chapters) {
      var ch = s.chapters();
      var n = clamp(s.startLevel || 1, 1, Math.min(ch.count, Profile.reached(ch.key)));
      s.startLevel = n;
      s.startAt(n);
    }
    Game.setState('PLAYING');
  },

  pause: function () {
    if (Game.state !== 'PLAYING') return;
    Game.setState('PAUSED');
    Sound.sfx('back');
    Screens.buildPause();
  },
  resume: function () {
    if (Game.state !== 'PAUSED') return;
    Input.clear();
    Game.setState('PLAYING');
  },
  quitToMenu: function () {
    Sound.stopMusic();
    Game.scene = null;
    Game.popup = null;
    FX.reset();
    Input.clear();
    Screens.buildMenu();
    Game.setState('MENU');
  },

  endGame: function (scene, reason, cardId) {
    if (!scene || Game.state === 'GAME_OVER') return;
    var isBest = Profile.submitScore(scene.id, scene.score);
    var earned = Math.max(1, Math.round(scene.score / 10) + scene.level * 5);
    Profile.addPoints(earned);
    if (Profile.data.mitzvahPoints >= 1000) Game.award('b_1000');
    if (Profile.cardSeenCount() >= Halacha.totalCards()) Game.award('b_scholar');
    Game.gameover = {
      id: scene.id, name: scene.name, score: Math.floor(scene.score),
      best: Profile.data.high[scene.id], isBest: isBest, points: earned,
      reason: reason || scene.failReason || 'Run complete',
      victory: !!scene.victory,
      level: scene.level, stats: scene.stats ? scene.stats() : [],
      helped: scene.helped || 0
    };
    if (scene.victory) { Sound.seq([784, 988, 1175, 1568], 130, 0.3, 0.28, 'triangle'); Haptics.win(); }
    else { Sound.sfx('lose'); Haptics.fail(); }
    if (scene.victory && scene.id === 'tzedaka') {
      Screens.buildGameOver();
      Game.setState('GAME_OVER');
      return;
    }
    var card = (cardId && Halacha.byId(cardId)) || Halacha.next(scene.id, scene.level);
    Game.showCard(card, function () {
      Screens.buildGameOver();
      Game.setState('GAME_OVER');
    });
  },

  /* ------------------------------------------------- halacha flash cards */
  showCard: function (card, onClose) {
    if (typeof card === 'string') card = Halacha.byId(card);
    if (!card) { if (onClose) onClose(); return; }
    var isNew = Profile.seeCard(card.id);
    Game.popup = { card: card, onClose: onClose || null, t: 0, isNew: isNew,
      scroll: 0, dragging: false, vel: 0, maxScroll: 0 };
    Screens.buildPopup();
    Game.prevPlayState = Game.state;
    Game.setState('HALACHA_POPUP');
    Sound.sfx('levelup');
    Haptics.medium();
    if (Profile.cardSeenCount() >= Halacha.totalCards()) Game.award('b_scholar');
  },
  closeCard: function () {
    var cb = Game.popup ? Game.popup.onClose : null;
    Game.popup = null;
    Input.clear();
    if (cb) cb();
    else Game.setState(Game.prevPlayState === 'HALACHA_POPUP' ? 'PLAYING' : (Game.prevPlayState || 'PLAYING'));
  },

  /* ------------------------------------------------------------- badges */
  award: function (badgeId) {
    if (!badgeId) return false;
    if (!Profile.unlockBadge(badgeId)) return false;
    var b = Halacha.badgeById(badgeId);
    Game.toast('Badge unlocked: ' + (b ? b.name : badgeId), b ? b.icon : 'rosette', C.gold);
    Sound.sfx('badge');
    Haptics.win();
    return true;
  },
  toast: function (text, icon, color) {
    Game.toasts.push({ text: text, icon: icon || 'rosette', color: color || C.gold, age: 0, life: 3.0 });
    if (Game.toasts.length > 3) Game.toasts.shift();
  },

  /* --------------------------------------------------------------- input */
  handle: function (ev) {
    if (ev.type === 'escape') {
      if (Game.state === 'PLAYING') Game.pause();
      else if (Game.state === 'PAUSED') Game.resume();
      else if (Game.state === 'GALLERY') { Screens.buildMenu(); Game.setState('MENU'); }
      return;
    }
    switch (Game.state) {
      case 'MENU':          Screens.menu.handle(ev); break;
      case 'GALLERY':       Screens.gallery.handle(ev); break;
      case 'INTRO':         UI.handle(Screens.introBtns, ev); break;
      case 'PAUSED':        UI.handle(Screens.pauseBtns, ev); break;
      case 'HALACHA_POPUP': Screens.popupHandle(ev); break;
      case 'GAME_OVER':     UI.handle(Screens.overBtns, ev); break;
      case 'PLAYING':
        if (ev.type === 'tap' && Game.pauseBtn.contains(ev.x, ev.y)) {
          Sound.sfx('ui'); Haptics.light(); Game.pause(); return;
        }
        if (ev.type === 'down' && Game.pauseBtn.contains(ev.x, ev.y)) { Game.pauseBtn.press = 1; return; }
        if (Game.scene) Game.scene.handle(ev);
        break;
    }
  },

  /* -------------------------------------------------------------- update */
  update: function (dt) {
    Game.stateT += dt;
    var evs = Input.drain();
    for (var i = 0; i < evs.length; i++) Game.handle(evs[i]);
    if (Game.state === 'PLAYING' && Game.scene) Game.scene.update(dt);
    if (Game.state === 'MENU') Screens.menu.update(dt);
    if (Game.state === 'GALLERY') Screens.gallery.update(dt);
    if (Game.state === 'HALACHA_POPUP') Screens.popupUpdate(dt);
    if (Game.popup) Game.popup.t += dt;
    Game.pauseBtn.update(dt);
    FX.update(dt);
    for (var j = Game.toasts.length - 1; j >= 0; j--) {
      Game.toasts[j].age += dt;
      if (Game.toasts[j].age >= Game.toasts[j].life) Game.toasts.splice(j, 1);
    }
  },

  /* -------------------------------------------------------------- render */
  render: function () {
    var ctx = View.ctx;
    View.begin();
    ctx.save();
    if (Game.state === 'PLAYING' || Game.state === 'PAUSED' ||
        Game.state === 'HALACHA_POPUP' || Game.state === 'INTRO' || Game.state === 'GAME_OVER') {
      ctx.save();
      FX.applyShake(ctx);
      if (Game.scene) Game.scene.render(ctx);
      FX.render(ctx);
      ctx.restore();
      FX.renderFlash(ctx);
      if (Game.state === 'PLAYING' || Game.state === 'PAUSED') Game.renderHud(ctx);
      if (Game.state === 'INTRO') Screens.renderIntro(ctx);
      if (Game.state === 'PAUSED') Screens.renderPause(ctx);
      if (Game.state === 'HALACHA_POPUP') Screens.renderPopup(ctx);
      if (Game.state === 'GAME_OVER') Screens.renderGameOver(ctx);
    } else if (Game.state === 'MENU') {
      Screens.menu.render(ctx);
    } else if (Game.state === 'GALLERY') {
      Screens.gallery.render(ctx);
    }
    Game.renderToasts(ctx);
    ctx.restore();
    View.end();
  },

  renderHud: function (ctx) {
    var s = Game.scene;
    if (!s) return;
    var top = View.safe.t;
    var lx = 26 + View.safe.l;
    ctx.save();
    /* soft top scrim so the HUD stays readable over any scene */
    var g = ctx.createLinearGradient(0, 0, 0, top + 260);
    g.addColorStop(0, 'rgba(3,5,12,.88)');
    g.addColorStop(0.55, 'rgba(3,5,12,.55)');
    g.addColorStop(1, 'rgba(3,5,12,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, top + 260);

    Draw.text(ctx, fmt(s.score), lx, top + 44, { size: 52, color: C.gold, weight: '900', stroke: 'rgba(0,0,0,.65)', strokeW: 6 });
    Draw.text(ctx, 'BEST ' + fmt(Profile.data.high[s.id] || 0), lx + 2, top + 82, { size: 21, color: 'rgba(255,255,255,.62)', weight: '700' });
    Draw.hearts(ctx, lx + 8, top + 118, s.lives, s.maxLives, 26);

    /* pause button */
    Game.pauseBtn.x = CFG.W - 94 - View.safe.r;
    Game.pauseBtn.y = top + 16;
    Game.pauseBtn.draw(ctx, Game.time);
    var px = Game.pauseBtn.x + 34, py = Game.pauseBtn.y + 34;
    ctx.fillStyle = C.cream;
    ctx.fillRect(px - 12, py - 15, 8, 30);
    ctx.fillRect(px + 4, py - 15, 8, 30);

    if (s.combo >= 3) {
      var cw = 1 + 0.1 * pulse(Game.time, 3);
      ctx.save();
      ctx.translate(CFG.W / 2, top + 52);
      ctx.scale(cw, cw);
      Draw.text(ctx, 'x' + s.combo + ' COMBO', 0, 0, {
        size: 30, color: C.teal, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.6)', strokeW: 5
      });
      ctx.restore();
    }
    ctx.restore();
    if (s.renderHud) s.renderHud(ctx, top + 150);
  },

  renderToasts: function (ctx) {
    var baseY = CFG.H - 130 - View.safe.b;
    var stackY = baseY;
    for (var i = 0; i < Game.toasts.length; i++) {
      var t = Game.toasts[i];
      var k = t.age < 0.3 ? easeOut(t.age / 0.3) : (t.age > t.life - 0.4 ? (t.life - t.age) / 0.4 : 1);
      var w = 640, x = (CFG.W - w) / 2;
      var textX = x + 84, textW = w - 108;
      var lines = Draw.wrap(ctx, t.text, textW, 22, '800');
      if (lines.length > 3) lines = lines.slice(0, 3);
      var h = Math.max(68, 28 + lines.length * 28);
      var top = stackY - h;
      stackY = top - 12;
      ctx.save();
      ctx.globalAlpha = clamp(k, 0, 1);
      Draw.panel(ctx, x, top, w, h, { fill: 'rgba(14,20,44,.96)', stroke: t.color, radius: 18, glow: t.color, glowBlur: 20 });
      Icons.draw(ctx, t.icon, x + 46, top + h / 2, 38, t.color);
      for (var L = 0; L < lines.length; L++) {
        Draw.text(ctx, lines[L], textX, top + h / 2 - (lines.length - 1) * 14 + L * 28, {
          size: 22, color: C.cream, weight: '800'
        });
      }
      ctx.restore();
    }
  },

  /* ---------------------------------------------------------------- loop */
  loop: function (ts) {
    if (!Game.running) return;
    requestAnimationFrame(Game.loop);
    var raw = (ts - Game.lastTs) / 1000;
    Game.lastTs = ts;
    if (!isFinite(raw) || raw < 0) raw = 0;
    if (raw > CFG.MAX_FRAME) raw = CFG.MAX_FRAME;
    Game.fps = lerp(Game.fps, 1 / Math.max(0.001, raw), 0.05);
    Game.accum += raw;
    var steps = 0;
    while (Game.accum >= CFG.STEP && steps < 5) {
      Game.time += CFG.STEP;
      Game.dt = CFG.STEP;
      Game.update(CFG.STEP);
      Game.accum -= CFG.STEP;
      steps++;
    }
    if (steps === 0) { Game.time += raw; }
    Game.render();
  }
};

/* ==========================================================================
   15. MINIGAME BASE CLASS
   ========================================================================== */
function MiniGame(id, name) {
  this.id = id;
  this.name = name;
  this.score = 0;
  this.lives = 3;
  this.maxLives = 3;
  this.combo = 0;
  this.bestCombo = 0;
  this.level = 1;
  this.elapsed = 0;
  this.mult = 1;
  this.failReason = '';
  this.tips = [];
  this.cardIndex = 0;
}
MiniGame.prototype.reset = function () {};
MiniGame.prototype.update = function (dt) { this.elapsed += dt; };
MiniGame.prototype.render = function (ctx) {};
MiniGame.prototype.handle = function (ev) {};
MiniGame.prototype.stats = function () { return []; };

MiniGame.prototype.award = function (badgeId) { return Game.award(badgeId); };
MiniGame.prototype.addScore = function (n, x, y, label, color) {
  n = Math.round(n * this.mult);
  this.score += n;
  if (x != null) FX.text(x, y, (label || '+' + n), color || C.gold, label ? 32 : 34);
  return n;
};
MiniGame.prototype.hitCombo = function () {
  this.combo++;
  if (this.combo > this.bestCombo) this.bestCombo = this.combo;
};
MiniGame.prototype.breakCombo = function () { this.combo = 0; };
MiniGame.prototype.damage = function (reason, x, y) {
  this.lives--;
  this.breakCombo();
  this.failReason = reason || this.failReason;
  FX.shake(16, 0.35);
  FX.flash(C.red, 0.25);
  Sound.sfx('hurt');
  Haptics.heavy();
  if (x != null) FX.text(x, y, reason || 'Oops', C.red, 30);
  if (this.lives <= 0) { this.lives = 0; this.finish(reason); }
};
MiniGame.prototype.finish = function (reason, cardId) {
  Game.endGame(this, reason, cardId);
};
/* Interstitial Halacha flash card between levels. */
MiniGame.prototype.interstitial = function (cb) {
  var card = Halacha.next(this.id, this.cardIndex++);
  Game.showCard(card, cb || function () { Game.setState('PLAYING'); Input.clear(); });
};

/* ==========================================================================
   16. SCREENS - MAIN MENU + HALACHA GALLERY
   ========================================================================== */
var GAMES = [
  { id:'menorah', name:'Menorah Keeper', tag:'Chanukah survival',   icon:'lamp',  color:'#ffcf5c' },
  { id:'shul',    name:'Shul Crossing',  tag:'Beat the zman',       icon:'run',   color:'#7fc8ff' },
  { id:'kosher',  name:'Kosher Sort',    tag:'Conveyor matcher',    icon:'split', color:'#8ee06a' },
  { id:'matzah',  name:'Matzah Havoc',   tag:'Chametz chopper',     icon:'truck', color:'#ff8a6b' },
  { id:'tzedaka', name:'Tzedaka Blast',  tag:'Into their hands',    icon:'coin',  color:'#c9adff' }
];

var Screens = {
  introBtns: [], pauseBtns: [], overBtns: [], popupBtns: [],
  init: function () {
    Screens.buildMenu();
    Screens.buildGallery();
  },

  /* ------------------------------------------------------------ backdrop */
  backdrop: function (ctx, t) {
    Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, [
      [0, '#04060e'], [0.35, '#0a1128'], [0.72, '#16204a'], [1, '#251a3c']
    ]);
    Clouds.render(ctx, t, 'rgba(188,205,238,1)', 0.15);
    /* skyline silhouette */
    ctx.save();
    ctx.fillStyle = '#070a18';
    ctx.beginPath();
    ctx.moveTo(0, CFG.H);
    var seed = 0;
    for (var x = 0; x <= CFG.W; x += 60) {
      seed = (x * 9301 + 49297) % 233280;
      var h = 120 + (seed / 233280) * 190;
      ctx.lineTo(x, CFG.H - h);
      ctx.lineTo(x + 60, CFG.H - h);
    }
    ctx.lineTo(CFG.W, CFG.H);
    ctx.closePath();
    ctx.fill();
    /* lit windows */
    ctx.fillStyle = 'rgba(255,207,92,.30)';
    for (var i = 0; i < 40; i++) {
      var wx = ((i * 137) % 700) + 10;
      var wy = CFG.H - 40 - ((i * 53) % 210);
      if ((i * 7) % 3 === 0) ctx.fillRect(wx, wy, 8, 12);
    }
    ctx.restore();
  },

  /* ---------------------------------------------------------- MAIN MENU */
  menu: {
    t: 0,
    btns: [],
    update: function (dt) { Screens.menu.t += dt; },
    handle: function (ev) { UI.handle(Screens.menu.btns, ev); },
    render: function (ctx) {
      var t = Screens.menu.t;
      Screens.backdrop(ctx, t);
      var top = View.safe.t;

      /* decorative menorah behind the title */
      ctx.save();
      ctx.globalAlpha = 0.16;
      Screens.drawMiniMenorah(ctx, CFG.W / 2, top + 292, 300, t);
      ctx.restore();

      Draw.text(ctx, 'MITZVAH', CFG.W / 2, top + 132, {
        size: 78, color: C.gold, align: 'center', weight: '900',
        stroke: 'rgba(0,0,0,.6)', strokeW: 8, shadow: 'rgba(255,180,40,.55)', shadowBlur: 28
      });
      Draw.text(ctx, 'DASH', CFG.W / 2, top + 206, {
        size: 78, color: C.cream, align: 'center', weight: '900',
        stroke: 'rgba(0,0,0,.6)', strokeW: 8, shadow: 'rgba(120,200,255,.4)', shadowBlur: 24
      });
      Draw.text(ctx, 'Five arcade minigames. Real halacha.', CFG.W / 2, top + 258, {
        size: 24, color: 'rgba(255,255,255,.72)', align: 'center', weight: '600'
      });

      /* profile chips */
      var chipY = top + 308;
      Screens.chip(ctx, CFG.W / 2 - 210, chipY, 200, 54, 'rosette', fmt(Profile.data.mitzvahPoints) + ' MP', C.gold);
      Screens.chip(ctx, CFG.W / 2 + 10, chipY, 200, 54, 'stamp',
        Profile.badgeCount() + '/' + Halacha.badges.length + ' badges', C.teal);

      for (var i = 0; i < Screens.menu.btns.length; i++) {
        var b = Screens.menu.btns[i];
        if (b.kind === 'game') Screens.drawGameCard(ctx, b, t);
      }
      UI.drawAll(ctx, Screens.menu.btns.filter(function (b) { return b.kind !== 'game'; }), t, 1 / 60);

      Draw.text(ctx, 'v' + CFG.VERSION + (Store.available() ? '' : '  (session save only)'),
        CFG.W / 2, CFG.H - 34 - View.safe.b, { size: 18, color: 'rgba(255,255,255,.32)', align: 'center', weight: '600' });
    }
  },

  chip: function (ctx, x, y, w, h, icon, label, color) {
    Draw.panel(ctx, x, y, w, h, { fill: 'rgba(8,12,30,.8)', stroke: 'rgba(255,255,255,.18)', radius: h / 2 });
    Icons.draw(ctx, icon, x + 30, y + h / 2, 30, color);
    Draw.text(ctx, label, x + 54, y + h / 2, { size: 23, color: C.cream, weight: '800' });
  },

  drawGameCard: function (ctx, b, t) {
    var g = b.data;
    var k = b.press;
    var x = b.x + k * 2, y = b.y + k * 3, w = b.w - k * 4, h = b.h - k * 4;
    var best = Profile.data.high[g.id] || 0;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    Draw.rr(ctx, b.x + 4, b.y + 8, b.w, b.h, 24);
    ctx.fill();
    Draw.rr(ctx, x, y, w, h, 24);
    var grd = ctx.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, 'rgba(24,32,66,.98)');
    grd.addColorStop(1, 'rgba(10,14,34,.98)');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = g.color;
    ctx.stroke();
    ctx.save();
    Draw.rr(ctx, x, y, w, h, 24); ctx.clip();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.arc(x + w, y, w * 0.7, 0, TAU); ctx.fill();
    ctx.restore();

    if (b.wide) {
      var mid = y + h / 2;
      Icons.draw(ctx, g.icon, x + 76, mid, 64, g.color);
      Draw.textFit(ctx, g.name, x + 132, mid - 10, w - 320,
        { size: 26, color: C.cream, weight: '900' });
      Draw.textFit(ctx, g.tag, x + 132, mid + 20, w - 320,
        { size: 18, color: 'rgba(255,255,255,.55)', weight: '600' });
      Draw.panel(ctx, x + w - 186, mid - 21, 160, 42, { fill: 'rgba(0,0,0,.4)', radius: 12 });
      Draw.text(ctx, 'BEST  ' + fmt(best), x + w - 106, mid, {
        size: 20, color: best > 0 ? C.gold : 'rgba(255,255,255,.4)', align: 'center', weight: '800'
      });
    } else {
      Icons.draw(ctx, g.icon, x + w / 2, y + 62, 66, g.color);
      Draw.textFit(ctx, g.name, x + w / 2, y + 120, w - 34,
        { size: 24, color: C.cream, align: 'center', weight: '900' });
      Draw.textFit(ctx, g.tag, x + w / 2, y + 148, w - 34,
        { size: 18, color: 'rgba(255,255,255,.55)', align: 'center', weight: '600' });
      Draw.panel(ctx, x + 26, y + h - 52, w - 52, 36, { fill: 'rgba(0,0,0,.4)', radius: 12 });
      Draw.text(ctx, 'BEST  ' + fmt(best), x + w / 2, y + h - 34, {
        size: 19, color: best > 0 ? C.gold : 'rgba(255,255,255,.4)', align: 'center', weight: '800'
      });
    }
    ctx.restore();
  },

  drawMiniMenorah: function (ctx, cx, cy, w, t) {
    ctx.save();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    var arm = w / 8;
    for (var i = -4; i <= 4; i++) {
      if (i === 0) continue;
      var x = cx + i * arm;
      var hgt = 90 - Math.abs(i) * 6;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(x, cy - Math.abs(i) * 22, x, cy - hgt);
      ctx.stroke();
      Draw.flame(ctx, x, cy - hgt - 6, 9, t + i, true);
    }
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 130);
    ctx.stroke();
    Draw.flame(ctx, cx, cy - 136, 11, t, true);
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + 40);
    ctx.moveTo(cx - 48, cy + 44); ctx.lineTo(cx + 48, cy + 44);
    ctx.stroke();
    ctx.restore();
  },
