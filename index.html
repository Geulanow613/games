    size: 20, color: k > 0.8 ? C.red : 'rgba(255,255,255,.7)', align: 'center', weight: '800'
  });

  /* the hat + distance */
  var by = y + 76;
  var dryHat = this.hat >= 0.999;
  Draw.text(ctx, dryHat ? 'DRY HAT' : 'WET HAT', x, by, {
    size: 17, color: dryHat ? 'rgba(255,255,255,.6)' : '#7fc8ff', weight: '800'
  });
  Draw.meter(ctx, x + 190, by - 9, 180, 18, this.hat, {
    fg: dryHat ? C.cream : (this.hat > 0.3 ? '#7fc8ff' : C.red)
  });
  var togo = Math.max(0, this.goalRow - Math.round(this.py));
  Draw.text(ctx, togo + ' to shul', x + w, by, { size: 19, color: C.gold, align: 'right', weight: '900' });
  if (this.mult > 1) {
    Draw.text(ctx, 'x' + this.mult.toFixed(1) + ' mitzvah multiplier', x + w, by + 26,
      { size: 17, color: C.teal, align: 'right', weight: '800' });
  }
};

ShulCrossing.prototype.stats = function () {
  return [
    ['Arrivals at shul', this.arrivals],
    ['Forward hops', this.hops],
    ['Kosher truck rides', this.rides],
    ['Spotless arrivals', this.dry]
  ];
};

      ctx.fillStyle = '#8a7f95';
      Draw.rr(ctx, -32, -40, 64, 80, 8); ctx.fill();
      ctx.fillStyle = '#cfc7d8';
      Draw.rr(ctx, -24, -28, 48, 30, 5); ctx.fill();
      ctx.strokeStyle = '#5c5468'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 18, 14, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(10, 28); ctx.stroke();
    }
  }
};

function KosherSort() {
  MiniGame.call(this, 'kosher', 'Kosher Sort');
  this.tips = [
    'Swipe LEFT for meat (fleishig), RIGHT for dairy (milchig), DOWN for pareve - food that is neither one nor the other.',
    'Anything that mixes meat and milk together - basar b’chalav - or is not kosher at all gets flicked UP into the chute.',
    'Some dishes turn up hidden under a lid. TAP to lift it, because you cannot decide about food you cannot see. A dish that reaches the end still covered counts as a strike.',
    'Nothing may fall off the end of the belt unsorted. When the KASHRUS RUSH starts the belts speed right up and every call is worth double.'
  ];
}
KosherSort.prototype = Object.create(MiniGame.prototype);
KosherSort.prototype.constructor = KosherSort;

KosherSort.BELT_X = [210, 510];
KosherSort.BELT_W = 180;
KosherSort.TOP = 330;
KosherSort.END = 1050;

KosherSort.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.level = 1; this.elapsed = 0;
  this.items = [];
  this.flying = [];
  this.spawnT = 0.8;
  this.sortedThisLevel = 0;
  this.sortedTotal = 0;
  this.correct = 0; this.wrong = 0; this.missed = 0;
  this.pareveOk = 0; this.mixedOk = 0; this.treifOk = 0;
  this.beltPhase = 0;
  this.hint = null;
  this.uncovered = 0;
  this.grabs = {};
  this.rushT = 0;
  this.rushTimer = 16;
  this.rushes = 0;
  this.binFlash = { left: 0, right: 0, down: 0, up: 0 };
};

KosherSort.prototype.rushEvery = function () { return Math.max(13, 26 - this.level * 1.3); };

KosherSort.prototype.speed = function () {
  return (100 + Math.min(this.level, 14) * 24) * (this.rushT > 0 ? 1.55 : 1);
};
KosherSort.prototype.interval = function () {
  return Math.max(0.55, 1.55 - this.level * 0.085) * (this.rushT > 0 ? 0.6 : 1);
};

KosherSort.prototype.spawn = function () {
  var pool = Foods.list;
  var weights = { meat: 1, dairy: 1, pareve: 1, mixed: 0.55 + this.level * 0.05, treif: 0.55 + this.level * 0.05 };
  var candidates = [];
  for (var i = 0; i < pool.length; i++) {
    var w = weights[pool[i].k] || 1;
    if (Math.random() < w) candidates.push(pool[i]);
  }
  var f = pick(candidates.length ? candidates : pool);
  var belt = randInt(0, 1);
  this.items.push({
    food: f, belt: belt, x: KosherSort.BELT_X[belt] + rand(-24, 24),
    y: KosherSort.TOP - 30, r: 52, rot: rand(-0.2, 0.2), spin: rand(-0.5, 0.5), wob: rand(0, TAU),
    covered: this.level >= 2 && chance(Math.min(0.34, 0.10 + this.level * 0.03)),
    reveal: 0
  });
};

/* Direction of a sorting swipe.

   The bins are LEFT and RIGHT of a conveyor that runs DOWNWARD, so a flick
   toward a side bin almost always drifts down on the way - the thumb arcs,
   and the player is chasing an item that is itself moving down. Deciding by
   "whichever axis is bigger" therefore turns honest left-flicks into pareve.
   Horizontal gets a wider sector: it wins unless the stroke is clearly
   vertical (steeper than about 56 degrees). */
KosherSort.HORIZONTAL_BIAS = 1.5;
KosherSort.MIN_SWIPE = 12;

/* The item under your finger when the stroke STARTED is the item that moves.
   Nothing else can steal it - a downward flick sweeps over every item below
   the one you grabbed, so scoring by the path picked the wrong dish. */
KosherSort.GRAB_RADIUS = 120;

KosherSort.prototype.itemAt = function (x, y, backSeconds) {
  var lift = (backSeconds || 0) * this.speed();
  var best = null, bd = 1e9;
  for (var i = 0; i < this.items.length; i++) {
    var it = this.items[i];
    var d = distance(x, y, it.x, it.y - lift);
    if (d < bd) { bd = d; best = it; }
  }
  return bd <= KosherSort.GRAB_RADIUS ? best : null;
};

KosherSort.prototype.dirFromSwipe = function (item, dx, dy) {
  if (Math.hypot(dx, dy) < KosherSort.MIN_SWIPE) return null;
  if (Math.abs(dx) * KosherSort.HORIZONTAL_BIAS >= Math.abs(dy)) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'down' : 'up';
};

KosherSort.prototype.correctDir = function (kind) {
  return kind === 'meat' ? 'left' : kind === 'dairy' ? 'right' : kind === 'pareve' ? 'down' : 'up';
};

KosherSort.prototype.sortItem = function (item, dir) {
  var want = this.correctDir(item.food.k);
  var idx = this.items.indexOf(item);
  if (idx >= 0) this.items.splice(idx, 1);
  var target = { left: { x: -60, y: item.y }, right: { x: CFG.W + 60, y: item.y },
                 down: { x: 360, y: CFG.H + 60 }, up: { x: 360, y: -60 } }[dir];
  this.flying.push({
    food: item.food, x: item.x, y: item.y, tx: target.x, ty: target.y,
    t: 0, dur: 0.34, ok: dir === want, r: item.r
  });
  this.binFlash[dir] = 0.4;
  if (dir === want) {
    this.correct++; this.sortedTotal++; this.sortedThisLevel++;
    this.hitCombo();
    if (this.combo >= 20) this.award('b_streak');
    if (item.food.k === 'pareve') { this.pareveOk++; if (this.pareveOk >= 30) this.award('b_pareve'); }
    if (item.food.k === 'mixed') { this.mixedOk++; if (this.mixedOk >= 10) this.award('b_bbc'); }
    if (item.food.k === 'treif') { this.treifOk++; if (this.treifOk >= 15) this.award('b_treif'); }
    var base = (item.food.k === 'mixed' || item.food.k === 'treif') ? 40 : 25;
    var pts = base + Math.min(this.combo, 20) * 2;
    this.addScore(pts, item.x, item.y - 40, '+' + pts, Foods.colorFor(item.food.k));
    /* the pitch climbs with the streak - the whole loop lives on this */
    Sound.tone({ f: 560 + Math.min(this.combo, 16) * 46, dur: 0.10, vol: 0.22, type: 'triangle' });
    Haptics.light();
    if (this.combo > 0 && this.combo % 10 === 0) {
      var streakBonus = this.combo * 12;
      this.score += streakBonus;
      FX.text(CFG.W / 2, 620, 'MEHADRIN STREAK x' + this.combo + '  +' + streakBonus, C.gold, 34);
      FX.flash(C.gold, 0.25);
      Sound.sfx('badge'); Haptics.win();
    }
    FX.burst(item.x, item.y, { n: 8, color: Foods.colorFor(item.food.k), spdMax: 200, lifeMax: 0.5 });
    Profile.noteBest('streak', this.combo);
    if (this.sortedThisLevel >= 12) this.levelUp();
  } else {
    this.wrong++;
    this.showHint(item.food);
    this.damage('Wrong bin', item.x, item.y - 40);
  }
};

KosherSort.prototype.showHint = function (food) {
  this.hint = { text: food.name + ': ' + food.hint, t: 0, life: 3.2 };
};

KosherSort.prototype.levelUp = function () {
  var self = this;
  this.sortedThisLevel = 0;
  this.level++;
  if (this.level >= 5) this.award('b_mash');
  var bonus = 120 * this.level;
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.green, 0.35);
  FX.text(CFG.W / 2, 620, 'SHIFT ' + this.level + '  +' + bonus, C.green, 36);
  this.interstitial(function () { Input.clear(); Game.setState('PLAYING'); });
};

/* ---------------------------------------------------------------- input */
KosherSort.prototype.handle = function (ev) {
  var i, it;
  if (ev.type === 'down') {
    var grabbed = this.itemAt(ev.x, ev.y, 0);
    if (grabbed) this.grabs[ev.id] = grabbed;
    else delete this.grabs[ev.id];
    return;
  }
  if (ev.type === 'tap') {
    for (i = this.items.length - 1; i >= 0; i--) {
      it = this.items[i];
      if (it.covered && distance(ev.x, ev.y, it.x, it.y) < 76) {
        it.covered = false;
        it.reveal = 0.35;
        this.uncovered++;
        this.addScore(10, it.x, it.y - 62, 'UNCOVERED', C.cream);
        Sound.sfx('ui'); Haptics.light();
        FX.burst(it.x, it.y - 20, { n: 10, color: '#cfd8e8', spdMax: 200, grav: 260 });
        return;
      }
    }
    return;
  }
  if (ev.type !== 'swipe') return;
  var best = this.grabs[ev.id];
  delete this.grabs[ev.id];
  if (best && this.items.indexOf(best) < 0) best = null;
  if (!best) {
    /* no recorded touch (keyboard shim, or the grab expired): fall back to the
       stroke's start point, rewound by however far the belt moved meanwhile */
    best = this.itemAt(ev.x, ev.y, ev.dur || 0);
  }
  if (!best) return;
  if (best.covered) {
    FX.text(best.x, best.y - 62, 'TAP TO UNCOVER IT', C.gold, 26);
    Sound.sfx('back');
    return;
  }
  var dir = this.dirFromSwipe(best, ev.x2 - ev.x, ev.y2 - ev.y);
  if (!dir) return;
  this.sortItem(best, dir);
};

/* --------------------------------------------------------------- update */
KosherSort.prototype.update = function (dt) {
  this.elapsed += dt;
  this.beltPhase = (this.beltPhase + this.speed() * dt) % 40;
  var i;
  for (var key in this.binFlash) if (this.binFlash[key] > 0) this.binFlash[key] -= dt;
  if (this.hint) { this.hint.t += dt; if (this.hint.t > this.hint.life) this.hint = null; }

  /* the Kashrus Rush: belts surge and every call counts double */
  if (this.rushT > 0) {
    this.rushT -= dt;
    if (this.rushT <= 0) { this.rushT = 0; this.mult = 1; Sound.sfx('back'); }
  } else {
    this.rushTimer -= dt;
    if (this.rushTimer <= 0) {
      this.rushTimer = this.rushEvery() + rand(-2, 4);
      this.rushT = 8;
      this.rushes++;
      this.mult = 2;
      Sound.sfx('levelup'); Haptics.double();
      FX.flash(C.gold, 0.3);
      FX.text(CFG.W / 2, 560, 'KASHRUS RUSH!', C.gold, 44);
      Game.toast('Kashrus rush - the belts surge and every call counts double.', 'stamp', C.gold);
    }
  }

  for (var gid in this.grabs) {
    if (this.items.indexOf(this.grabs[gid]) < 0) delete this.grabs[gid];
  }

  this.spawnT -= dt;
  if (this.spawnT <= 0) { this.spawnT = this.interval() * rand(0.85, 1.2); this.spawn(); }

  var sp = this.speed();
  for (i = this.items.length - 1; i >= 0; i--) {
    var it = this.items[i];
    it.y += sp * dt;
    it.rot += it.spin * dt;
    it.wob += dt * 3;
    if (it.reveal > 0) it.reveal -= dt;
    if (it.y > KosherSort.END) {
      this.items.splice(i, 1);
      this.missed++;
      if (it.covered) {
        this.hint = { text: 'You never looked under that lid - it was ' + it.food.name + '. ' + it.food.hint, t: 0, life: 3.4 };
        this.damage('Left covered to the end', it.x, KosherSort.END - 40);
      } else {
        this.showHint(it.food);
        this.damage('Reached the end unsorted', it.x, KosherSort.END - 40);
      }
      if (this.lives <= 0) return;
    }
  }
  for (i = this.flying.length - 1; i >= 0; i--) {
    var fl = this.flying[i];
    fl.t += dt;
    if (fl.t >= fl.dur) this.flying.splice(i, 1);
  }
};

/* --------------------------------------------------------------- render */
KosherSort.prototype.render = function (ctx) {
  var i, t = this.elapsed;
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, [
    [0, '#101728'], [0.5, '#18213a'], [1, '#0d1322']
  ]);
  /* tiled kitchen wall */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 2;
  for (i = 0; i < CFG.W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CFG.H); ctx.stroke(); }
  for (i = 0; i < CFG.H; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CFG.W, i); ctx.stroke(); }
  ctx.restore();

  /* bins */
  this.drawSideBin(ctx, 8, 430, 98, 420, C.meat, 'MEAT', 'left');
  this.drawSideBin(ctx, CFG.W - 106, 430, 98, 420, C.dairy, 'DAIRY', 'right');
  this.drawChute(ctx, 300, KosherSort.END + 26 - View.safe.b, 120, 130, C.pareve, 'PAREVE', 'down');
  this.drawChute(ctx, 300, KosherSort.TOP - 114, 120, 106, C.trash, 'DISPOSAL', 'up');

  /* belts */
  for (var b = 0; b < 2; b++) {
    var bx = KosherSort.BELT_X[b] - KosherSort.BELT_W / 2;
    ctx.save();
    ctx.fillStyle = '#232a3f';
    Draw.rr(ctx, bx - 8, KosherSort.TOP - 10, KosherSort.BELT_W + 16, KosherSort.END - KosherSort.TOP + 30, 18);
    ctx.fill();
    ctx.fillStyle = '#39415a';
    Draw.rr(ctx, bx, KosherSort.TOP, KosherSort.BELT_W, KosherSort.END - KosherSort.TOP + 10, 12);
    ctx.fill();
    ctx.save();
    Draw.rr(ctx, bx, KosherSort.TOP, KosherSort.BELT_W, KosherSort.END - KosherSort.TOP + 10, 12);
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 6;
    for (var y = KosherSort.TOP - 40 + this.beltPhase; y < KosherSort.END + 20; y += 40) {
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + KosherSort.BELT_W, y); ctx.stroke();
    }
    ctx.restore();
    /* danger line */
    ctx.strokeStyle = 'rgba(255,91,91,.75)';
    ctx.lineWidth = 5;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(bx, KosherSort.END); ctx.lineTo(bx + KosherSort.BELT_W, KosherSort.END);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* the rush surge - tint and streaks over the belts */
  if (this.rushT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.05 * pulse(t, 4);
    ctx.fillStyle = C.gold;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,207,92,.7)';
    ctx.lineWidth = 3;
    for (var q = 0; q < 14; q++) {
      var sy = KosherSort.TOP - 40 + ((q * 97 + this.beltPhase * 6) % (KosherSort.END - KosherSort.TOP + 120));
      var sx = (q % 2) ? KosherSort.BELT_X[0] : KosherSort.BELT_X[1];
      ctx.beginPath();
      ctx.moveTo(sx - 70, sy); ctx.lineTo(sx - 70, sy + 46);
      ctx.moveTo(sx + 70, sy + 30); ctx.lineTo(sx + 70, sy + 76);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* items */
  for (i = 0; i < this.items.length; i++) {
    var it = this.items[i];
    this.drawItem(ctx, it.food, it.x, it.y + Math.sin(it.wob) * 2, it.r, it.rot, 1, it);
  }
  for (i = 0; i < this.flying.length; i++) {
    var fl = this.flying[i];
    var k = fl.t / fl.dur;
    var fx = lerp(fl.x, fl.tx, easeIn(k));
    var fy = lerp(fl.y, fl.ty, easeIn(k));
    ctx.save();
    ctx.globalAlpha = 1 - k * 0.6;
    this.drawItem(ctx, fl.food, fx, fy, fl.r * (1 - k * 0.4), k * 6 * (fl.ok ? 1 : -1), fl.ok ? 1 : 0.6);
    ctx.restore();
  }

  /* rush banner */
  if (this.rushT > 0) {
    var ba = clamp(Math.min(this.rushT / 0.4, (8 - this.rushT) / 0.3), 0, 1);
    ctx.save();
    ctx.globalAlpha = ba;
    /* sits beside the shift panel and clear of the disposal chute */
    var bx = 296, bw = CFG.W - bx - 24, by = View.safe.t + 144;
    var bcx = bx + bw / 2;
    ctx.translate(bcx, by + 28);
    ctx.rotate(Math.sin(t * 6) * 0.02);
    ctx.translate(-bcx, -(by + 28));
    Draw.panel(ctx, bx, by, bw, 56, {
      fill: 'rgba(60,38,6,.95)', stroke: C.gold, strokeW: 3, radius: 16,
      glow: 'rgba(255,207,92,.6)', glowBlur: 26
    });
    Draw.textSafe(ctx, 'KASHRUS RUSH  x2', bcx, by + 24, {
      size: 25, maxW: bw - 26, color: C.gold, weight: '900'
    });
    Draw.meter(ctx, bx + 16, by + 42, bw - 32, 7, this.rushT / 8, { fg: C.gold, gloss: false });
    ctx.restore();
  }

  /* hint ribbon */
  if (this.hint) {
    var a = clamp(Math.min(this.hint.t / 0.25, (this.hint.life - this.hint.t) / 0.4), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    var lines = Draw.wrap(ctx, this.hint.text, 560, 22, '700');
    var hh = 30 + lines.length * 28;
    var hy = KosherSort.END - hh - 26;
    Draw.panel(ctx, 60, hy, 600, hh, { fill: 'rgba(6,9,22,.98)', stroke: C.gold, strokeW: 3, radius: 18, glow: 'rgba(255,207,92,.55)', glowBlur: 26 });
    for (var L = 0; L < lines.length; L++) {
      Draw.text(ctx, lines[L], 360, hy + 24 + L * 28, { size: 22, color: C.cream, align: 'center', weight: '700' });
    }
    ctx.restore();
  }
};

KosherSort.prototype.drawItem = function (ctx, food, x, y, r, rot, alpha, item) {
  if (item && item.covered) { this.drawCovered(ctx, x, y, r); return; }
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.72, r * 0.75, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, TAU); ctx.fill();
  ctx.strokeStyle = Foods.colorFor(food.k);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, TAU); ctx.stroke();
  ctx.restore();
  Foods.draw(ctx, food.shape, x, y - 2, r * 2.15);
  Draw.textSafe(ctx, food.name, x, y + r + 16, {
    size: 18, maxW: 230, color: C.cream, weight: '800', stroke: 'rgba(0,0,0,.75)', strokeW: 5
  });
  /* the lid flying off, right after you uncover it */
  if (item && item.reveal > 0) {
    var k = 1 - item.reveal / 0.35;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    this.drawDome(ctx, x, y - k * 70, r, 1 + k * 0.25);
    ctx.restore();
  }
};

KosherSort.prototype.drawDome = function (ctx, x, y, r, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale || 1, scale || 1);
  var g = ctx.createLinearGradient(0, -r, 0, r * 0.4);
  g.addColorStop(0, '#e8eef7');
  g.addColorStop(0.5, '#aab6c8');
  g.addColorStop(1, '#7c8899');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, r * 0.28, r * 0.98, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.stroke();
  ctx.fillStyle = '#cfd8e8';
  Draw.rr(ctx, -r * 0.16, -r * 0.92, r * 0.32, r * 0.2, r * 0.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.34, -r * 0.24, r * 0.16, r * 0.34, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
};

KosherSort.prototype.drawCovered = function (ctx, x, y, r) {
  var t = this.elapsed;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.72, r * 0.8, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.restore();
  /* the tray it sits on */
  ctx.save();
  ctx.fillStyle = '#59637a';
  Draw.rr(ctx, x - r, y + r * 0.24, r * 2, r * 0.24, r * 0.12); ctx.fill();
  ctx.restore();
  this.drawDome(ctx, x, y, r, 1);
  Draw.text(ctx, '?', x, y - r * 0.12, {
    size: r * 0.8, color: 'rgba(40,50,66,.75)', align: 'center', weight: '900'
  });
  Draw.text(ctx, 'TAP TO UNCOVER', x, y + r + 16, {
    size: 17, color: 'rgba(255,207,92,' + (0.5 + 0.5 * pulse(t, 2.2)) + ')',
    align: 'center', weight: '900', stroke: 'rgba(0,0,0,.75)', strokeW: 5
  });
};

KosherSort.prototype.drawSideBin = function (ctx, x, y, w, h, color, label, dir) {
  ctx.save();
  var fl = clamp(this.binFlash[dir] / 0.4, 0, 1);
  Draw.rr(ctx, x, y, w, h, 18);
  ctx.fillStyle = 'rgba(10,14,28,.9)';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = color;
  ctx.stroke();
  if (fl > 0) {
    ctx.save();
    ctx.globalAlpha = fl;
    ctx.shadowColor = color; ctx.shadowBlur = 30;
    Draw.rr(ctx, x, y, w, h, 18); ctx.stroke();
    ctx.restore();
  }
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(dir === 'left' ? -Math.PI / 2 : Math.PI / 2);
  Draw.text(ctx, label, 0, 0, { size: 30, color: color, align: 'center', weight: '900' });
  ctx.restore();
  /* arrow */
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.5 + 0.5 * pulse(this.elapsed, 0.8);
  var ax = dir === 'left' ? x + w + 22 : x - 22;
  var s = dir === 'left' ? -1 : 1;
  ctx.beginPath();
  ctx.moveTo(ax + s * 16, y + h / 2);
  ctx.lineTo(ax - s * 8, y + h / 2 - 16);
  ctx.lineTo(ax - s * 8, y + h / 2 + 16);
  ctx.closePath(); ctx.fill();
  ctx.restore();
};

KosherSort.prototype.drawChute = function (ctx, x, y, w, h, color, label, dir) {
  ctx.save();
  var fl = clamp(this.binFlash[dir] / 0.4, 0, 1);
  Draw.rr(ctx, x, y, w, h, 18);
  ctx.fillStyle = 'rgba(10,14,28,.9)';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = color;
  ctx.stroke();
  if (fl > 0) {
    ctx.save();
    ctx.globalAlpha = fl;
    ctx.shadowColor = color; ctx.shadowBlur = 30;
    Draw.rr(ctx, x, y, w, h, 18); ctx.stroke();
    ctx.restore();
  }
  Draw.text(ctx, label, x + w / 2, y + h - 22, { size: 19, color: color, align: 'center', weight: '900' });
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.5 * pulse(this.elapsed, 0.8);
  ctx.fillStyle = color;
  var cy = y + (dir === 'up' ? 42 : h - 62);
  var s = dir === 'up' ? -1 : 1;
  ctx.beginPath();
  ctx.moveTo(x + w / 2, cy + s * 20);
  ctx.lineTo(x + w / 2 - 18, cy - s * 8);
  ctx.lineTo(x + w / 2 + 18, cy - s * 8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
};

KosherSort.prototype.renderHud = function (ctx, y) {
  var w = 250, x = 26 + View.safe.l;
  Draw.panel(ctx, x, y - 6, w, 56, { fill: 'rgba(6,10,26,.8)', radius: 16, stroke: 'rgba(255,255,255,.14)' });
  Draw.text(ctx, 'SHIFT ' + this.level, x + 16, y + 22, {
    size: 22, color: this.rushT > 0 ? C.gold : C.green, weight: '900'
  });
  Draw.text(ctx, this.sortedThisLevel + '/12', x + w - 16, y + 22, {
    size: 20, color: 'rgba(255,255,255,.7)', align: 'right', weight: '800'
  });
  Draw.meter(ctx, x + 16, y + 36, w - 32, 8, this.sortedThisLevel / 12, { fg: C.green, gloss: false });
};

KosherSort.prototype.stats = function () {
  return [
    ['Sorted correctly', this.correct],
    ['Best streak', this.bestCombo],
    ['Dishes uncovered', this.uncovered],
    ['Kashrus rushes', this.rushes],
    ['Wrong bin', this.wrong],
    ['Reached the end', this.missed]
  ];
};

/* ==========================================================================
   GAME 4 - MATZAH DELIVERY HAVOC  (Chametz Chopper)
   Steer the shemura matzah truck with the left-thumb slider while your other
   hand slices the flying chametz out of the air before the fourth hour.
   ========================================================================== */
function MatzahHavoc() {
  MiniGame.call(this, 'matzah', 'Matzah Delivery Havoc');
  this.tips = [
    'Drag the slider at the bottom left (or grab the truck itself) to steer between lanes.',
    'Slash across flying loaves and challos with your free hand to cut them in half. Bread that rose is chametz, and it has to be gone before Pesach.',
    'Giant croissants are tough - three cuts, or one two-finger combo swipe.',
    'Tap yeast clouds again and again to blow them away, and grab the golden Afikoman shield when it appears.'
  ];
}
MatzahHavoc.prototype = Object.create(MiniGame.prototype);
MatzahHavoc.prototype.constructor = MatzahHavoc;

MatzahHavoc.ROAD_L = 74;
MatzahHavoc.ROAD_R = 646;
MatzahHavoc.TRUCK_Y = 1000;

MatzahHavoc.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.level = 1; this.elapsed = 0;
  this.truckX = 360; this.targetX = 360;
  this.dist = 0;
  this.goal = 13500;
  this.hourMax = 62; this.hour = 62;
  this.cargo = 1;
  this.shield = 0;
  this.chametz = [];
  this.obstacles = [];
  this.clouds = [];
  this.pickups = [];
  this.roadPhase = 0;
  this.spawnAir = 1.2;
  this.spawnRoad = 2.0;
  this.spawnCloud = 7;
  this.spawnPickup = 12;
  this.sliced = 0; this.giants = 0; this.cloudsBusted = 0; this.shieldsTaken = 0; this.deliveries = 0;
  this.steer = null;
  this.tornado = 0;
  this.trails = {};
  this.hitFlash = 0;
};

MatzahHavoc.prototype.speed = function () { return 300 + Math.min(this.level, 10) * 45; };

/* The truck's actual body, pulled in slightly so a near miss stays a miss.
   The drawn box is x +/-82 and y -118..+106; this is a touch smaller. */
MatzahHavoc.prototype.truckRect = function () {
  return { x: this.truckX - 68, y: MatzahHavoc.TRUCK_Y - 104, w: 136, h: 196 };
};
MatzahHavoc.circleRect = function (cx, cy, r, R) {
  var nx = clamp(cx, R.x, R.x + R.w);
  var ny = clamp(cy, R.y, R.y + R.h);
  return dist2(cx, cy, nx, ny) < r * r;
};
MatzahHavoc.rectRect = function (a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
};
MatzahHavoc.prototype.sliderRect = function () {
  var y = CFG.H - 96 - View.safe.b;
  return { x: 44, y: y - 40, w: 300, h: 80, cy: y };
};

/* ---------------------------------------------------------------- input */
MatzahHavoc.prototype.handle = function (ev) {
  var sl = this.sliderRect();
  var i;
  if (ev.type === 'down') {
    var inSlider = ev.x >= sl.x - 30 && ev.x <= sl.x + sl.w + 30 && ev.y >= sl.y - 30 && ev.y <= sl.y + sl.h + 40;
    var onTruck = Math.abs(ev.x - this.truckX) < 90 && Math.abs(ev.y - MatzahHavoc.TRUCK_Y) < 110;
    if (inSlider) { this.steer = { id: ev.id, mode: 'slider' }; this.setSlider(ev.x); return; }
    if (onTruck) { this.steer = { id: ev.id, mode: 'direct' }; this.targetX = ev.x; return; }
    /* tap on a yeast cloud */
    for (i = this.clouds.length - 1; i >= 0; i--) {
      var cl = this.clouds[i];
      if (distance(ev.x, ev.y, cl.x, cl.y) < cl.r + 24) {
        cl.taps++;
        cl.shake = 0.2;
        Sound.sfx('tap'); Haptics.light();
        FX.burst(ev.x, ev.y, { n: 5, color: '#e6dfd0', spdMax: 130, grav: 40 });
        if (cl.taps >= cl.need) {
          this.clouds.splice(i, 1);
          this.cloudsBusted++;
          if (this.cloudsBusted >= 10) this.award('b_yeast');
          this.addScore(60, cl.x, cl.y, 'DISPERSED +60', C.cream);
          this.hitCombo();
          Sound.sfx('whoosh'); Haptics.medium();
          FX.burst(cl.x, cl.y, { n: 22, color: '#efe7d6', spdMax: 300, grav: 60 });
        }
        return;
      }
    }
    return;
  }

  if (ev.type === 'up') {
    if (this.steer && this.steer.id === ev.id) this.steer = null;
    delete this.trails[ev.id];
    return;
  }

  if (ev.type === 'move') {
    if (this.steer && this.steer.id === ev.id) {
      if (this.steer.mode === 'slider') this.setSlider(ev.x);
      else this.targetX = clamp(ev.x, MatzahHavoc.MIN_X, MatzahHavoc.MAX_X);
      return;
    }
    /* slicing */
    var sp = Math.hypot(ev.dx, ev.dy);
    if (sp < 6) return;
    var tr = this.trails[ev.id] || (this.trails[ev.id] = []);
    tr.push({ x: ev.x, y: ev.y });
    if (tr.length > 10) tr.shift();
    if (tr.length > 1) FX.slash(tr, 'rgba(255,255,255,.95)');
    var power = Input.count >= 2 ? 2 : 1;
    this.sliceSegment(ev.px, ev.py, ev.x, ev.y, power);
    return;
  }

  if (ev.type === 'multiswipe') {
    /* two-finger combo: heavy damage in a radius */
    for (i = this.chametz.length - 1; i >= 0; i--) {
      var c = this.chametz[i];
      if (distance(ev.x, ev.y, c.x, c.y) < 220) this.cutChametz(c, 3, true);
    }
    FX.ring(ev.x, ev.y, C.gold, 60);
    Sound.sfx('slice');
    return;
  }

  if (ev.type === 'swipe') {
    this.sliceSegment(ev.x, ev.y, ev.x2, ev.y2, ev.speed > 1400 ? 2 : 1);
  }
};

MatzahHavoc.MIN_X = MatzahHavoc.ROAD_L + 46;
MatzahHavoc.MAX_X = MatzahHavoc.ROAD_R - 46;

MatzahHavoc.prototype.setSlider = function (x) {
  var sl = this.sliderRect();
  var k = clamp((x - sl.x) / sl.w, 0, 1);
  this.targetX = lerp(MatzahHavoc.MIN_X, MatzahHavoc.MAX_X, k);
};

MatzahHavoc.prototype.sliceSegment = function (x1, y1, x2, y2, power) {
  for (var i = this.chametz.length - 1; i >= 0; i--) {
    var c = this.chametz[i];
    if (MatzahHavoc.segCircle(x1, y1, x2, y2, c.x, c.y, c.r + 10)) {
      this.cutChametz(c, power || 1, false);
    }
  }
};

MatzahHavoc.segCircle = function (x1, y1, x2, y2, cx, cy, r) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 === 0 ? 0 : clamp(((cx - x1) * dx + (cy - y1) * dy) / len2, 0, 1);
  var px = x1 + dx * t, py = y1 + dy * t;
  return dist2(px, py, cx, cy) <= r * r;
};

MatzahHavoc.prototype.cutChametz = function (c, power, combo) {
  if (c.dead) return;
  /* one cut per stroke: a single swipe generates many move samples, so a
     short cooldown keeps a giant croissant from dying to one flick */
  if (!combo && c.cool > 0) return;
  c.cool = 0.22;
  c.hp -= power;
  c.flash = 0.16;
  if (c.hp > 0) {
    Sound.sfx('slice');
    FX.burst(c.x, c.y, { n: 6, color: '#e6c58a', spdMax: 180 });
    return;
  }
  c.dead = true;
  var idx = this.chametz.indexOf(c);
  if (idx >= 0) this.chametz.splice(idx, 1);
  this.sliced++;
  Profile.noteBest('sliced', this.sliced);
  if (this.sliced >= 50) this.award('b_slice');
  if (c.giant) {
    this.giants++;
    if (this.giants >= 10) this.award('b_giant');
  }
  var pts = c.giant ? 120 : 30;
  if (combo) pts += 40;
  this.hitCombo();
  this.addScore(pts + Math.min(this.combo, 15) * 2, c.x, c.y, '+' + pts, c.giant ? C.gold : C.cream);
  Sound.sfx('slice');
  Haptics.light();
  FX.burst(c.x, c.y, { n: c.giant ? 26 : 14, color: '#e8c68d', spdMax: c.giant ? 420 : 260, shape: 'square', rMax: 7 });
  FX.ring(c.x, c.y, 'rgba(255,255,255,.8)', c.r * 0.6);
};

/* --------------------------------------------------------------- update */
MatzahHavoc.prototype.update = function (dt) {
  this.elapsed += dt;
  var i, sp = this.speed();
  this.roadPhase = (this.roadPhase + sp * dt) % 120;
  this.dist += sp * dt;
  this.hour -= dt;
  if (this.hitFlash > 0) this.hitFlash -= dt;
  if (this.shield > 0) this.shield -= dt;
  if (this.tornado > 0) this.tornado -= dt;

  this.truckX = approach(this.truckX, this.targetX, 900 * dt);
  this.truckX = clamp(this.truckX, MatzahHavoc.MIN_X, MatzahHavoc.MAX_X);

  this.score += dt * 6;

  /* ---- spawn flying chametz (the Chametz Tornado) ---- */
  this.spawnAir -= dt;
  if (this.spawnAir <= 0) {
    this.spawnAir = Math.max(0.42, 1.25 - this.level * 0.075) * rand(0.8, 1.25);
    this.spawnChametz();
    if (this.level >= 3 && chance(0.25)) this.spawnChametz();
  }
  if (this.tornado <= 0 && chance(dt * 0.035) && this.level >= 2) {
    this.tornado = 4.5;
    Game.toast('Chametz Tornado!', 'cloud', C.red);
    Sound.sfx('wind');
    for (i = 0; i < 4; i++) this.spawnChametz();
  }

  for (i = this.chametz.length - 1; i >= 0; i--) {
    var c = this.chametz[i];
    if (c.flash > 0) c.flash -= dt;
    if (c.cool > 0) c.cool -= dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += 130 * dt;
    c.rot += c.spin * dt;
    if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx); }
    if (c.x > CFG.W - c.r) { c.x = CFG.W - c.r; c.vx = -Math.abs(c.vx); }
    if (this.shield > 0) {
      /* the aura disintegrates anything that reaches it, and while it is up
         nothing can touch the cargo at all */
      if (distance(c.x, c.y, this.truckX, MatzahHavoc.TRUCK_Y) < 150 + c.r * 0.6) {
        c.cool = 0;
        this.cutChametz(c, 99, false);
      }
      continue;
    }
    if (MatzahHavoc.circleRect(c.x, c.y, c.r * 0.78, this.truckRect())) {
      this.chametz.splice(i, 1);
      this.cargoHit(0.2, 'Chametz on the cargo!', c.x, c.y);
      if (this.lives <= 0) return;
      continue;
    }
    if (c.y > CFG.H + 120) this.chametz.splice(i, 1);
  }

  /* ---- road obstacles ---- */
  this.spawnRoad -= dt;
  if (this.spawnRoad <= 0) {
    this.spawnRoad = Math.max(0.65, 2.1 - this.level * 0.13) * rand(0.8, 1.2);
    var lane = randInt(0, 3);
    var kind = chance(0.35) ? 'pothole' : 'car';
    this.obstacles.push({
      x: MatzahHavoc.ROAD_L + 72 + lane * 143, y: -120,
      w: kind === 'car' ? 118 : 96, h: kind === 'car' ? 190 : 60,
      kind: kind, color: ShulCrossing.paint('car'), rel: kind === 'car' ? rand(0.35, 0.6) : 1
    });
  }
  for (i = this.obstacles.length - 1; i >= 0; i--) {
    var o = this.obstacles[i];
    o.y += sp * o.rel * dt;
    if (o.y > CFG.H + 200) { this.obstacles.splice(i, 1); continue; }
    var oBox = { x: o.x - o.w / 2 + 14, y: o.y - o.h / 2 + 14, w: o.w - 28, h: o.h - 28 };
    if (this.shield > 0 && MatzahHavoc.rectRect(oBox, this.truckRect())) {
      this.obstacles.splice(i, 1);
      this.addScore(o.kind === 'car' ? 60 : 25, o.x, o.y, 'SHIELDED', C.gold);
      Sound.sfx('shield');
      FX.burst(o.x, o.y, { n: 18, color: C.gold, spdMax: 300 });
      continue;
    }
    if (this.shield <= 0 && MatzahHavoc.rectRect(oBox, this.truckRect())) {
      this.obstacles.splice(i, 1);
      this.damage(o.kind === 'car' ? 'Crashed into traffic' : 'Hit a pothole', this.truckX, MatzahHavoc.TRUCK_Y - 90);
      this.hitFlash = 0.4;
      if (this.lives <= 0) return;
    }
  }

  /* ---- yeast dust clouds ---- */
  this.spawnCloud -= dt;
  if (this.spawnCloud <= 0) {
    this.spawnCloud = Math.max(4, 9 - this.level * 0.6) * rand(0.85, 1.2);
    this.clouds.push({
      x: rand(140, CFG.W - 140), y: -90, r: 74,
      vy: rand(70, 105) + this.level * 5, taps: 0, need: 4 + Math.min(3, (this.level / 2) | 0),
      wob: rand(0, TAU), shake: 0
    });
  }
  for (i = this.clouds.length - 1; i >= 0; i--) {
    var cl = this.clouds[i];
    cl.y += cl.vy * dt;
    cl.wob += dt * 2;
    if (cl.shake > 0) cl.shake -= dt;
    if (this.shield > 0) {
      if (distance(cl.x, cl.y, this.truckX, MatzahHavoc.TRUCK_Y) < 210) {
        this.clouds.splice(i, 1);
        this.addScore(40, cl.x, cl.y, '+40', C.gold);
      }
      continue;
    }
    if (MatzahHavoc.circleRect(cl.x, cl.y, 52, this.truckRect())) {
      this.clouds.splice(i, 1);
      this.cargoHit(0.3, 'Yeast on the shemura!', cl.x, cl.y);
      if (this.lives <= 0) return;
    } else if (cl.y > CFG.H + 120) this.clouds.splice(i, 1);
  }

  /* ---- Afikoman golden shield ---- */
  this.spawnPickup -= dt;
  if (this.spawnPickup <= 0) {
    this.spawnPickup = rand(13, 20);
    this.pickups.push({ x: rand(MatzahHavoc.ROAD_L + 70, MatzahHavoc.ROAD_R - 70), y: -80, r: 40, rot: 0 });
  }
  for (i = this.pickups.length - 1; i >= 0; i--) {
    var pk = this.pickups[i];
    pk.y += sp * 0.75 * dt;
    pk.rot += dt * 2;
    if (distance(pk.x, pk.y, this.truckX, MatzahHavoc.TRUCK_Y) < 100) {
      this.pickups.splice(i, 1);
      this.shield = 6.5;
      this.shieldsTaken++;
      if (this.shieldsTaken >= 5) this.award('b_afik');
      this.addScore(80, pk.x, pk.y, 'AFIKOMAN SHIELD!', C.gold);
      Sound.sfx('shield'); Haptics.win();
      FX.ring(this.truckX, MatzahHavoc.TRUCK_Y, C.gold, 60);
      continue;
    }
    if (pk.y > CFG.H + 120) this.pickups.splice(i, 1);
  }

  /* ---- the fourth hour ---- */
  if (this.hour <= 0) {
    this.hour = this.hourMax * 0.65;
    if (this.shield > 0) {
      FX.text(this.truckX, MatzahHavoc.TRUCK_Y - 120, 'THE AFIKOMAN HELD THE HOUR', C.gold, 26);
    } else {
      this.damage('The fourth hour passed', this.truckX, MatzahHavoc.TRUCK_Y - 120);
      if (this.lives <= 0) return;
    }
  }

  /* ---- delivery complete ---- */
  if (this.dist >= this.goal) this.deliver();
};

MatzahHavoc.prototype.cargoHit = function (amount, msg, x, y) {
  this.cargo -= amount;
  this.breakCombo();
  FX.shake(12, 0.3);
  Sound.sfx('bad');
  Haptics.double();
  FX.text(x, y, msg, C.red, 26);
  FX.burst(x, y, { n: 16, color: '#d8c9a8', spdMax: 240 });
  if (this.cargo <= 0) {
    this.cargo = 0.6;
    this.damage('Shemura matzah ruined', this.truckX, MatzahHavoc.TRUCK_Y - 90);
  }
};

MatzahHavoc.prototype.deliver = function () {
  var self = this;
  this.deliveries++;
  var inTime = this.hour > 0;
  if (inTime) this.award('b_deliver');
  var bonus = 400 + this.level * 150 + Math.round(this.hour * 8) + Math.round(this.cargo * 200);
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.gold, 0.45);
  FX.text(CFG.W / 2, 560, 'DELIVERED!  +' + bonus, C.gold, 40);
  for (var i = 0; i < 30; i++) FX.burst(rand(100, 620), rand(400, 800), { n: 1, color: pick([C.gold, C.cream]), spdMax: 320 });
  this.level++;
  this.dist = 0;
  this.goal = 12000 + this.level * 1500;
  this.hourMax = Math.max(38, 64 - this.level * 2);
  this.hour = this.hourMax;
  this.cargo = Math.min(1, this.cargo + 0.3);
  this.chametz.length = 0; this.obstacles.length = 0; this.clouds.length = 0;
  this.interstitial(function () { Input.clear(); Game.setState('PLAYING'); });
};

MatzahHavoc.prototype.spawnChametz = function () {
  var giant = chance(0.14 + this.level * 0.012);
  var side = chance(0.5) ? -1 : 1;
  var kinds = giant ? ['croissant'] : ['loaf', 'challah', 'bagel', 'pretzel', 'baguette'];
  var kind = pick(kinds);
  this.chametz.push({
    kind: kind, giant: giant,
    x: side < 0 ? rand(-40, 120) : rand(CFG.W - 120, CFG.W + 40),
    y: rand(View.safe.t + 220, 520),
    vx: side < 0 ? rand(90, 210) : -rand(90, 210),
    vy: rand(-40, 40),
    r: giant ? 78 : 44,
    rot: rand(0, TAU), spin: rand(-3, 3),
    hp: giant ? 3 : 1, flash: 0, cool: 0, dead: false
  });
};

/* --------------------------------------------------------------- render */
MatzahHavoc.prototype.render = function (ctx) {
  var i, t = this.elapsed;
  /* sky + desert */
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, [
    [0, '#f2b26a'], [0.22, '#e8dcc0'], [0.45, '#cbb894'], [1, '#b39c73']
  ]);
  ctx.fillStyle = '#c2a97f';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  /* roadside */
  ctx.fillStyle = '#b09571';
  ctx.fillRect(0, 0, MatzahHavoc.ROAD_L, CFG.H);
  ctx.fillRect(MatzahHavoc.ROAD_R, 0, CFG.W - MatzahHavoc.ROAD_R, CFG.H);
  ctx.fillStyle = 'rgba(120,96,64,.35)';
  for (i = 0; i < 12; i++) {
    var ry = ((i * 160 + this.roadPhase * 1.4) % (CFG.H + 200)) - 100;
    ctx.beginPath(); ctx.arc(34, ry, 14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(CFG.W - 40, ry + 80, 11, 0, TAU); ctx.fill();
  }
  /* asphalt */
  ctx.fillStyle = '#3a3f4d';
  ctx.fillRect(MatzahHavoc.ROAD_L, 0, MatzahHavoc.ROAD_R - MatzahHavoc.ROAD_L, CFG.H);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillRect(MatzahHavoc.ROAD_L, 0, 6, CFG.H);
  ctx.fillRect(MatzahHavoc.ROAD_R - 6, 0, 6, CFG.H);
  ctx.save();
  ctx.strokeStyle = 'rgba(240,236,215,.7)';
  ctx.lineWidth = 6;
  ctx.setLineDash([56, 64]);
  ctx.lineDashOffset = -this.roadPhase;
  for (i = 1; i < 4; i++) {
    var lx = MatzahHavoc.ROAD_L + i * (MatzahHavoc.ROAD_R - MatzahHavoc.ROAD_L) / 4;
    ctx.beginPath(); ctx.moveTo(lx, -50); ctx.lineTo(lx, CFG.H + 50); ctx.stroke();
  }
  ctx.restore();

  /* obstacles */
  for (i = 0; i < this.obstacles.length; i++) {
    var o = this.obstacles[i];
    if (o.kind === 'pothole') {
      ctx.save();
      ctx.fillStyle = '#1a1d26';
      ctx.beginPath(); ctx.ellipse(o.x, o.y, o.w / 2, o.h / 2, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      Draw.rr(ctx, o.x - o.w / 2 + 6, o.y - o.h / 2 + 10, o.w, o.h, 16); ctx.fill();
      ctx.fillStyle = '#191c26';
      Draw.rr(ctx, o.x - o.w / 2 - 9, o.y - o.h / 2 + 24, 18, 46, 7); ctx.fill();
      Draw.rr(ctx, o.x + o.w / 2 - 9, o.y - o.h / 2 + 24, 18, 46, 7); ctx.fill();
      Draw.rr(ctx, o.x - o.w / 2 - 9, o.y + o.h / 2 - 70, 18, 46, 7); ctx.fill();
      Draw.rr(ctx, o.x + o.w / 2 - 9, o.y + o.h / 2 - 70, 18, 46, 7); ctx.fill();
      ctx.fillStyle = o.color;
      Draw.rr(ctx, o.x - o.w / 2, o.y - o.h / 2, o.w, o.h, 18); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      Draw.rr(ctx, o.x - o.w / 2 + 8, o.y - o.h / 2 + 6, o.w - 16, o.h - 12, 14); ctx.fill();
      ctx.fillStyle = 'rgba(20,30,55,.78)';
      Draw.rr(ctx, o.x - o.w / 2 + 14, o.y - o.h / 2 + 16, o.w - 28, 40, 9); ctx.fill();
      Draw.rr(ctx, o.x - o.w / 2 + 14, o.y + o.h / 2 - 60, o.w - 28, 40, 9); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      Draw.rr(ctx, o.x - o.w / 2 + 16, o.y - 12, o.w - 32, 24, 8); ctx.fill();
      ctx.fillStyle = '#ff6b5c';
      ctx.fillRect(o.x - o.w / 2 + 12, o.y + o.h / 2 - 14, 24, 9);
      ctx.fillRect(o.x + o.w / 2 - 36, o.y + o.h / 2 - 14, 24, 9);
      ctx.restore();
    }
  }

  /* pickups */
  for (i = 0; i < this.pickups.length; i++) {
    var pk = this.pickups[i];
    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(Math.sin(pk.rot) * 0.3);
    ctx.shadowColor = C.gold; ctx.shadowBlur = 28;
    ctx.fillStyle = '#f6d97a';
    Draw.rr(ctx, -38, -38, 76, 76, 10); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#c79a2f'; ctx.lineWidth = 4;
    Draw.rr(ctx, -38, -38, 76, 76, 10); ctx.stroke();
    ctx.setLineDash([5, 7]); ctx.lineWidth = 3;
    for (var q = -2; q <= 2; q++) {
      ctx.beginPath(); ctx.moveTo(q * 14, -32); ctx.lineTo(q * 14, 32); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
    Draw.text(ctx, 'AFIKOMAN', pk.x, pk.y + 58, { size: 17, color: '#7a5411', align: 'center', weight: '900' });
  }

  /* yeast clouds */
  for (i = 0; i < this.clouds.length; i++) {
    var cl = this.clouds[i];
    var jitter = cl.shake > 0 ? rand(-4, 4) : 0;
    ctx.save();
    ctx.translate(cl.x + jitter, cl.y + jitter);
    ctx.fillStyle = 'rgba(238,231,214,.92)';
    var puffs = [[-38, 6, 34], [0, -16, 42], [38, 6, 34], [-14, 22, 28], [18, 22, 28]];
    for (var pI = 0; pI < puffs.length; pI++) {
      ctx.beginPath();
      ctx.arc(puffs[pI][0], puffs[pI][1] + Math.sin(cl.wob + pI) * 3, puffs[pI][2], 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(150,132,96,.5)';
    for (var d = 0; d < 8; d++) {
      var a = cl.wob + d;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 30, Math.sin(a * 1.4) * 18, 4, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    var left = cl.need - cl.taps;
    Draw.text(ctx, 'TAP x' + left, cl.x, cl.y + 4, {
      size: 26, color: '#6b5a38', align: 'center', weight: '900'
    });
  }

  /* flying chametz */
  for (i = 0; i < this.chametz.length; i++) this.drawChametz(ctx, this.chametz[i]);

  /* truck */
  this.drawTruck(ctx);

  /* shield aura */
  if (this.shield > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(this.shield / 6.5, 0.2, 1) * (0.5 + 0.3 * pulse(t, 2));
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 7;
    ctx.shadowColor = C.gold; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(this.truckX, MatzahHavoc.TRUCK_Y, 150, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (this.hitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = this.hitFlash;
    ctx.strokeStyle = C.red; ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, CFG.W - 12, CFG.H - 12);
    ctx.restore();
  }

  /* steering slider */
  this.drawSlider(ctx);
};

MatzahHavoc.prototype.drawChametz = function (ctx, c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  if (c.flash > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 26; }
  var s = c.r / 44;
  ctx.scale(s, s);
  ctx.lineJoin = 'round';
  if (c.kind === 'loaf') {
    ctx.fillStyle = '#c98d4a';
    ctx.beginPath();
    ctx.moveTo(-44, 18);
    ctx.quadraticCurveTo(-48, -30, 0, -32);
    ctx.quadraticCurveTo(48, -30, 44, 18);
    ctx.quadraticCurveTo(44, 32, 0, 32);
    ctx.quadraticCurveTo(-44, 32, -44, 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9c6a2f'; ctx.lineWidth = 5; ctx.stroke();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-22, -16); ctx.lineTo(-12, 0);
    ctx.moveTo(-2, -22); ctx.lineTo(8, -6);
    ctx.moveTo(18, -18); ctx.lineTo(28, -2);
    ctx.stroke();
  } else if (c.kind === 'challah') {
    ctx.fillStyle = '#d99b4d';
    for (var i = -1; i <= 1; i++) {
      ctx.save();
      ctx.rotate(i * 0.25);
      ctx.beginPath(); ctx.ellipse(0, i * 12, 44, 15, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#a86f2c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 44, 26, 0, 0, TAU); ctx.stroke();
  } else if (c.kind === 'bagel') {
    ctx.fillStyle = '#cf9a55';
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#a06f30'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.stroke();
  } else if (c.kind === 'pretzel') {
    ctx.strokeStyle = '#b8802f'; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-16, 4, 18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(16, 4, 18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22, -14); ctx.quadraticCurveTo(0, -34, 22, -14); ctx.stroke();
  } else if (c.kind === 'baguette') {
    ctx.fillStyle = '#d5a05a';
    ctx.beginPath(); ctx.ellipse(0, 0, 52, 17, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8752f'; ctx.lineWidth = 4;
    for (var j = -3; j <= 3; j++) {
      ctx.beginPath(); ctx.moveTo(j * 12 - 5, -9); ctx.lineTo(j * 12 + 5, 3); ctx.stroke();
    }
  } else { /* croissant */
    ctx.fillStyle = '#e0aa5b';
    ctx.beginPath();
    ctx.arc(0, 10, 46, Math.PI * 1.05, Math.PI * 1.95);
    ctx.quadraticCurveTo(0, 44, -44, -6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#b07a2c'; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-18, -22); ctx.lineTo(-12, 6);
    ctx.moveTo(4, -28); ctx.lineTo(4, 4);
    ctx.moveTo(24, -20); ctx.lineTo(18, 6);
    ctx.stroke();
  }
  ctx.restore();
  if (c.giant) {
    var hpw = 90;
    Draw.meter(ctx, c.x - hpw / 2, c.y + c.r + 12, hpw, 10, c.hp / 3, { fg: C.red, gloss: false });
    Draw.text(ctx, 'COMBO SWIPE', c.x, c.y + c.r + 38, {
      size: 16, color: '#5c4318', align: 'center', weight: '900'
    });
  }
};

MatzahHavoc.prototype.drawTruck = function (ctx) {
  var x = this.truckX, y = MatzahHavoc.TRUCK_Y;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  Draw.rr(ctx, x - 76, y - 108, 156, 216, 18); ctx.fill();
  /* box */
  ctx.fillStyle = '#f4ead4';
  Draw.rr(ctx, x - 82, y - 118, 164, 200, 16); ctx.fill();
  ctx.strokeStyle = '#b9a87f'; ctx.lineWidth = 5;
  Draw.rr(ctx, x - 82, y - 118, 164, 200, 16); ctx.stroke();
  /* matzah pattern on the box */
  ctx.save();
  ctx.strokeStyle = 'rgba(160,130,80,.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([5, 8]);
  for (var i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(x + i * 30, y - 104); ctx.lineTo(x + i * 30, y + 22); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
  Draw.text(ctx, 'SHEMURA', x, y - 44, { size: 20, color: '#8a6a2f', align: 'center', weight: '900' });
  Draw.text(ctx, 'MATZAH', x, y - 20, { size: 20, color: '#8a6a2f', align: 'center', weight: '900' });
  /* cab */
  ctx.fillStyle = '#2f6fa8';
  Draw.rr(ctx, x - 74, y + 30, 148, 76, 14); ctx.fill();
  ctx.fillStyle = 'rgba(180,225,255,.85)';
  Draw.rr(ctx, x - 58, y + 42, 116, 34, 8); ctx.fill();
  /* wheels */
  ctx.fillStyle = '#191c26';
  Draw.rr(ctx, x - 96, y - 70, 20, 60, 8); ctx.fill();
  Draw.rr(ctx, x + 76, y - 70, 20, 60, 8); ctx.fill();
  Draw.rr(ctx, x - 90, y + 40, 20, 56, 8); ctx.fill();
  Draw.rr(ctx, x + 70, y + 40, 20, 56, 8); ctx.fill();
  ctx.restore();
  /* cargo meter above the truck */
  Draw.meter(ctx, x - 84, y - 152, 168, 18, this.cargo, {
    fg: this.cargo > 0.6 ? C.cream : (this.cargo > 0.3 ? C.gold : C.red)
  });
  Draw.text(ctx, 'SHEMURA CARGO', x, y - 174, { size: 17, color: C.cream, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 5 });
};

MatzahHavoc.prototype.drawSlider = function (ctx) {
  var sl = this.sliderRect();
  ctx.save();
  ctx.globalAlpha = 0.92;
  Draw.rr(ctx, sl.x, sl.cy - 26, sl.w, 52, 26);
  ctx.fillStyle = 'rgba(10,14,28,.8)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.3)';
  ctx.stroke();
  var k = (this.targetX - MatzahHavoc.MIN_X) / (MatzahHavoc.MAX_X - MatzahHavoc.MIN_X);
  var kx = sl.x + clamp(k, 0, 1) * sl.w;
  ctx.fillStyle = C.gold;
  ctx.shadowColor = C.gold; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(kx, sl.cy, 30, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(kx - 9, sl.cy - 11, 4, 22);
  ctx.fillRect(kx - 1, sl.cy - 11, 4, 22);
  ctx.fillRect(kx + 7, sl.cy - 11, 4, 22);
  ctx.restore();
  Draw.text(ctx, 'STEER', sl.x + sl.w / 2, sl.cy - 44, {
    size: 17, color: 'rgba(255,255,255,.7)', align: 'center', weight: '900'
  });
  Draw.text(ctx, 'SLASH THE CHAMETZ', CFG.W - 40, sl.cy - 44, {
    size: 17, color: 'rgba(255,255,255,.7)', align: 'right', weight: '900'
  });
};

MatzahHavoc.prototype.renderHud = function (ctx, y) {
  var w = 300, x = (CFG.W - w) / 2;

    size: 20, color: late ? C.red : 'rgba(255,255,255,.75)', align: 'right', weight: '800'

    fg: late ? C.red : C.teal, gloss: false
  });

};

/* ==========================================================================
   GAME 5 - TZEDAKA BLAST  (Get it into their hands)
   You lean out of your window over a market street. Pull BACK like a
   slingshot - drag left or right to aim, pull up for zip - and let go.
   Gravity draws a real arc, so somebody off to the side is still reachable.
   The dotted line is that arc, wind and all.

   Nothing here costs a life and nothing flashes red at you. Missing is just
   missing. Every target is a real opening you can see - a palm, the slot in a
   pushka, the mouth of a sack, a cart tray. Nothing invisible, nothing to
   judge. The halacha lives in what scores well and on the cards afterwards;
   the banners during play stay short and plain.
   ========================================================================== */
function TzedakaBlast() {
  MiniGame.call(this, 'tzedaka', 'Tzedaka Blast');
  this.tips = [
    'Pull BACK like a slingshot. Drag sideways from the window to aim - it stays.',
    'Pull UP for a hard drop. Pull DOWN to lob the coin up in the air.',
    'Fancy coat + no hand out = he already ate. Save it for an open palm!',
    'People walk. Throw where he is GOING, not where he is.',
    'Toss too fast and you overheat. Chill a sec and the bar climbs back.'
  ];
}
TzedakaBlast.prototype = Object.create(MiniGame.prototype);
TzedakaBlast.prototype.constructor = TzedakaBlast;

/* Chapters: the streets you can jump straight to once you have walked them.
   Street 1 is always open; finishing a street opens the next one for good. */
TzedakaBlast.prototype.chapters = function () {
  return { count: TzedakaBlast.STREETS, word: 'STREET', key: 'tzedaka' };
};
TzedakaBlast.prototype.startAt = function (n) {
  this.level = clamp(n | 0, 1, TzedakaBlast.STREETS);
  this.setupStreet();
};

/* -------------------------------------------------- per-street difficulty */
/* Twelve streets. Everything below is a straight line in the street number, so
   the curve is readable and every step is provable in the audit. */
TzedakaBlast.STREETS = 12;

TzedakaBlast.prototype.tune = function () {
  var n = clamp(this.level, 1, TzedakaBlast.STREETS);
  var purim = n >= TzedakaBlast.STREETS;
  var late = Math.max(0, n - 4);                       /* 0 until street 5  */
  return {
    /* The street is not a crowd of poor people any more. There are only ever
       two or three walking at once, so every one of them counts and the quota
       has to come down to match - what makes it hard is landing the coin, not
       finding somebody to land it on. */
    /* One poor man crossing at a time from street 5 on, two before that and
       two again on Purim. He is the only one who needs you, so he is the whole
       point of the street, and the quota comes down to match. */
    goal:      Math.round(2.5 + n * 0.28) + (purim ? 7 : 0),             /* people to help     */
    maxPoor:   (n <= 4 || purim || n >= 11) ? 2 : 1,
    gentMax:   n >= 10 ? 8 : (n >= 7 ? 7 : (n >= 4 ? 5 : 4)),
    dur:       74 + (n > 6 ? 8 : 0) + (n >= 10 ? 4 : 0),
    spawnEvery: Math.max(1.05, 3.4 - n * 0.19),
    /* They get properly quick, and by a step every single street. From street 5
       the cobbles pick up a bit extra; the audit still holds the street-8
       release window above a fifth of a second. */
    walkMin:   46 + n * 6.0 + late * 2.2,
    walkMax:   72 + n * 7.6 + late * 2.8,
    patience:  Math.max(6.2, 15.5 - n * 0.72),
    /* Hold one direction for a long stretch. Strength can puff up and down;
       flipping left-to-right is rare and only starts later. */
    windEvery: Math.max(12, 22 - n * 0.7),
    windMax:   34 + n * 11 + late * 3,
    gustFrom:  5,                                      /* visible wave bands  */
    /* Heavy-duty gun pacing: chill between throws and coins drip back in.
       Spam until empty, then six seconds for a full reload. */
    pouchMax:  purim ? 12 : (n >= 8 ? 10 : 8),
    refillDry: 6,
    refillTick: 2.6,
    pigeon:    n >= 5 ? Math.max(5.2, 20 - n * 1.15) : 999,
    pigeonMax: n >= 10 ? 3 : (n >= 7 ? 2 : 1),
    pigeonDive: n >= 8,
    /* a big wagon standing in the near road. It rolls, so it is a thing to
       time rather than a wall - and it is IN the street, which is the only
       kind of obstacle that makes any sense from a window above one. */
    wagon:     n >= 2 ? Math.max(8.5, 26 - n * 1.15) : 999,
    wagonMax:  n >= 8 ? 2 : 1,
    ice:       n === 7,
    umbrellas: n >= 9,
    /* Regular people walk every street, including the first. Finding the open
       hand in a pavement of good coats IS the early game - easy on street 1
       because they stroll, and they still bounce a coin if you hit the near lane. */
    gentEvery: Math.max(0.62, 2.55 - n * 0.16),
    kinds:     TzedakaBlast.prototype.kindsFor(n),
    purim:     purim,
    mult:      purim ? 2 : 1
  };
};

/* one new way of giving per street - nothing ever gets taken away */
TzedakaBlast.prototype.kindsFor = function (n) {
  var k = ['hand', 'hand', 'pushka'];
  if (n >= 2) k.push('pushka', 'basket');
  if (n >= 3) k.push('hand');
  if (n >= 4) k.push('pushka', 'basket');
  if (n >= 5) k.push('basket', 'hand');
  if (n >= 6) k.push('kupah');
  if (n >= 7) k.push('loan');
  if (n >= 8) k.push('kupah', 'hand');
  if (n >= 9) k.push('loan', 'basket');
  if (n >= 10) k.push('hand', 'pushka');
  if (n >= 11) k.push('basket', 'kupah');
  if (n >= 12) k = k.concat(['hand', 'pushka', 'hand', 'basket', 'pushka']);
  return k;
};
/* --------------------------------------------------------------- new run */
TzedakaBlast.prototype.reset = function () {
  this.score = 0; this.combo = 0;
  /* Nothing in Tzedaka Blast costs a life. The only thing that ends a run is
     the clock running out before you land enough coins. */
  this.lives = 1; this.maxLives = 0;
  this.level = 1; this.elapsed = 0; this.mult = 1;
  this.helped = 0; this.handed = 0; this.seterGiven = 0; this.unasked = 0;
  this.kupahGiven = 0; this.loansMade = 0; this.wordsSaid = 0;
  this.clutchSaves = 0; this.stoops = 0; this.streets = 0; this.windGiven = 0;
  this.hungry = false; this.drySaid = false;
  this.gentHits = 0; this.cleanStreets = 0;
  this.missed = 0; this.missedTotal = 0;
  this.purimClean = false;
  this.introduced = {};
  this.setupStreet();
};

TzedakaBlast.prototype.setupStreet = function () {
  var t = this.tune();
  this.cfg = t;
  this.left = t.dur;
  this.need = t.goal;
  this.served = 0;
  this.people = [];
  this.coins = [];
  this.pigeons = [];
  this.gents = [];
  this.wagons = [];
  this.flakes = [];
  this.motes = [];
  this.pouchMax = t.pouchMax;
  this.pouchReserve = t.pouchMax;
  this.refillT = t.refillTick;
  this.dryLock = false;
  this.windDir = chance(0.5) ? 1 : -1;
  this.windTarget = this.windDir * rand(t.windMax * 0.4, t.windMax * 0.85);
  this.wind = this.windTarget;
  this.windT = rand(t.windEvery * 0.75, t.windEvery * 1.1);
  this.missed = 0;   /* per street - the Purim bonus asks about THIS street */
  this.charge = 0; this.chargeDir = 1;
  this.aim = null;
  this.fever = 0;
  this.banner = null;
  this.walkCycle = 0;
  this.personId = 0;
  this.mult = t.mult;
  if (t.purim) this.purimTotal = 0;
  this.seeding = true;
  this.spawnPerson();
  this.spawnT = rand(0.9, 1.6);
  this.pigeonT = t.pigeon;
  this.wagonT = rand(t.wagon * 0.45, t.wagon);
  var gi, wantGents = this.level <= 2 ? 2 : 3;
  for (gi = 0; gi < wantGents; gi++) this.spawnGent();
  this.gentT = rand(0.7, 1.4);
  this.seeding = false;
  this.streetGentHits = 0;
  var wt = this.scene().weather;
  if (wt) {
    for (var f = 0; f < (wt === 'snow' ? 140 : 90); f++) {
      this.flakes.push({ x: rand(-40, CFG.W + 40), y: rand(0, CFG.H),
        sp: wt === 'snow' ? rand(26, 62) : rand(420, 700),
        sw: rand(0, TAU), r: wt === 'snow' ? rand(1.6, 3.4) : rand(0.9, 1.6) });
    }
  }
  this.hungry = false;
  this.drySaid = false;
  if (this.gents.length) this.metGent = true;
  var sc = this.scene();
  var sub = sc.hook || sc.sub;
  this.say(sc.name, sub, C.gold, 3);
};

/* Nothing hangs over the road. An awning on a shopfront cannot stop a coin
   thrown into the street, and pretending otherwise was only ever a way of
   making the throw harder without making it more interesting.

   What CAN be in the way is whatever is genuinely standing in the street with
   you: the wind, the birds, a big wagon rolling through the near lane, and the
   gentlemen in good coats who are walking the same pavement as everybody else.
   All four move. None of them is a wall. */

/* ==========================================================================
   SPAWNING
   ========================================================================== */
TzedakaBlast.prototype.spawnPerson = function () {
  var t = this.cfg;
  var kind = pick(t.kinds);
  if (kind === 'loan' && this.people.filter(function (p) { return p.kind === 'loan'; }).length) kind = 'pushka';
  if (kind === 'kupah' && this.people.filter(function (p) { return p.kind === 'kupah'; }).length) kind = 'basket';
  var def = TzedakaBlast.KINDS[kind];
  var dir = chance(0.5) ? 1 : -1;
  var lane = this.freeLane(dir);
  if (lane < 0) return null;
  var sp = rand(t.walkMin, t.walkMax) * (kind === 'kupah' ? 1.35 : 1);
  var p = {
    id: ++this.personId,
    kind: kind, def: def,
    lane: lane, y: TzedakaBlast.LANES[lane],
    dir: dir,
    x: dir > 0 ? -90 : CFG.W + 90,
    sp: sp,
    ch: randInt(0, TzedakaBlast.PEOPLE.length - 1),
    sz: rand(TzedakaBlast.SIZE_MIN, TzedakaBlast.SIZE_MAX),
    phase: rand(0, TAU),
    patience: t.patience, maxPat: t.patience,
    served: false, gone: false, shamed: false,
    flash: 0, joy: 0, pending: 0, hint: 0,
    ice: !!t.ice, slip: 0, slipT: t.ice ? rand(0.7, 2.2) : 999
  };
  if (kind === 'loan') { p.sp *= 0.55; p.patience = p.maxPat = t.patience * 1.7; }
  this.people.push(p);
  if (!this.introduced[kind]) {
    this.introduced[kind] = true;
    this.introduce(kind);
  }
  return p;
};

/* pick the lane whose entry side is clearest, so nobody walks into a pile-up */
TzedakaBlast.prototype.freeLane = function (dir, need) {
  var A = TzedakaBlast, best = -1, bestGap = -1;
  /* gentlemen walk the same pavement, so they count for spacing too */
  var walking = this.people.concat(this.gents || []);
  for (var l = 0; l < A.LANES.length; l++) {
    var gap = 1e9;
    for (var i = 0; i < walking.length; i++) {
      var p = walking[i];
      if (p.lane !== l) continue;
      var d = dir > 0 ? p.x + 90 : CFG.W + 90 - p.x;
      if (d < gap) gap = d;
    }
    if (gap > bestGap) { bestGap = gap; best = l; }
  }
  return bestGap < (need || 190) ? -1 : best;
};

TzedakaBlast.prototype.introduce = function (kind) {
  var lines = {
    hand:   ['OPEN HAND!', 'that is the jackpot - drop it in the palm'],
    pushka: ['A PUSHKA!', 'tiny slot. clink!'],
    basket: ['GIANT SACK!', 'wide open. dunk it!'],
    kupah:  ['TOWN CART!', 'one box for the whole street - drop it in'],
    loan:   ['BROKEN CART!', 'lend him GOLD. he pays you back. top move!']
  };
  var l = lines[kind];
  if (l) this.say(l[0], l[1], C.gold, 3);
};

/* A quiet, warm aside. Never red, never shaken onto the screen - this game
   teaches by explaining, not by startling you. */
TzedakaBlast.prototype.note = function (title, sub, color) {
  this.banner = { title: title, sub: sub || '', color: color || C.teal, t: 3.0, max: 3.0, soft: true };
};

TzedakaBlast.prototype.say = function (title, sub, color, dur) {
  this.banner = { title: title, sub: sub || '', color: color || C.gold, t: dur || 3, max: dur || 3 };
};

/* The one thing that gets between your window and his hand. Deliberately slow:
   you are meant to see it coming, count it, and throw around it - not be
   ambushed by it. Higher streets only. */
TzedakaBlast.prototype.spawnPigeon = function () {
  var t = this.cfg || this.tune();
  var dir = chance(0.5) ? 1 : -1;
  var fast = t.pigeonDive ? rand(64, 96) : rand(52, 84);
  this.pigeons.push({
    x: dir > 0 ? -70 : CFG.W + 70, y: rand(470, 760),
    dir: dir, sp: fast, flap: rand(0, TAU),
    carrying: null, dead: false, dive: false
  });
  if (!this.metPigeon) {
    this.metPigeon = true;
    this.say('PIGEON ALERT!', 'tap him or he eats your coin for lunch', C.gold, 3);
  } else if (t.pigeonDive && !this.metDive) {
    this.metDive = true;
    this.say('DIVE BOMB!', 'now they swoop - tap fast!', C.gold, 3);
  }
};

/* --------------------------------------------------------- the gentlemen */
/* Not everybody walking the street needs your coin. These men are doing fine:
   good coat, silk hat, stick, both hands busy. They never put a hand out, so

   and is gone. They make the street crowded, which is the point of them. */
TzedakaBlast.GENTS = [
  { coat:'#20263a', hat:'#0e1220', skin:'#f0c39a', trim:'#c9a24a' },
  { coat:'#33202c', hat:'#180d14', skin:'#f6d3ae', trim:'#b9903c' },
  { coat:'#1e3028', hat:'#0c1712', skin:'#c98d63', trim:'#cbb06a' },
  { coat:'#2c2438', hat:'#140f1e', skin:'#f7d9bb', trim:'#a89050' },
  { coat:'#3a2a20', hat:'#160f0a', skin:'#e2b085', trim:'#d8bb70' },
  { coat:'#182c3a', hat:'#0a141c', skin:'#d29a6e', trim:'#9fb4c8' },
  { coat:'#302038', hat:'#150c1a', skin:'#f4d2ac', trim:'#c2a0d8' },
  { coat:'#1a2e2c', hat:'#0b1614', skin:'#c58a5e', trim:'#8fc4b4' },
  { coat:'#3c2430', hat:'#1a0e16', skin:'#f2cba4', trim:'#e0a8b8' },
  { coat:'#26303c', hat:'#10161c', skin:'#d9a377', trim:'#b8c6d4' },
  { coat:'#342c1e', hat:'#17130c', skin:'#f5d6b4', trim:'#e6cc84' },
  { coat:'#221a2e', hat:'#0e0a16', skin:'#e8b489', trim:'#a294c8' }
];TzedakaBlast.GENT_W = 54;   /* his shoulders, and the whole of the blocker */
TzedakaBlast.GENT_TOP = 156;
TzedakaBlast.GENT_BOT = 6;

TzedakaBlast.GENT_QUIPS = [
  'I DRIVE A PORSCHE',
  'I\'M RICH, RICH I TELL YOU!',
  'I\'M THE CEO',
  'I DON\'T EVEN PUMP MY OWN GAS',
  'I\'M LATE FOR MY POLO GAME',
  'I DON\'T LOOK AT PRICE TAGS',
  'SORRY, MY YACHT IS WAITING',
  'I DON\'T CARRY COINS',

  'I SUMMER IN THE HAMPTONS',
