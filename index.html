  toggleBtn: function (x, y, w, label, key) {
    var btn = new Button(x, y, w, 66, label, null, {
      fill: 'rgba(12,18,40,.9)', textColor: C.cream, stroke: 'rgba(255,255,255,.3)', size: 22, radius: 16
    });
    btn.onTap = function () {
      Profile.data.opts[key] = !Profile.data.opts[key];
      Profile.save();
      if (key === 'music') {
        if (Profile.data.opts.music) Sound.playMusic(Game.state === 'PLAYING' ? 'play' : 'menu');
        else Sound.stopMusic();
      }
      Screens.refreshToggles();
    };
    btn.key = key;
    Screens.applyToggle(btn);
    return btn;
  },
  applyToggle: function (btn) {
    var on = Profile.data.opts[btn.key];
    btn.sub = on ? 'ON' : 'OFF';
    btn.fill = on ? 'rgba(53,214,196,.9)' : 'rgba(12,18,40,.9)';
    btn.textColor = on ? '#04231f' : 'rgba(255,255,255,.6)';
  },
  refreshToggles: function () {
    [Screens.menu.btns, Screens.pauseBtns].forEach(function (list) {
      for (var i = 0; i < list.length; i++) if (list[i].key) Screens.applyToggle(list[i]);
    });
  },

  /* ------------------------------------------------------ HALACHA GALLERY */
  gallery: {
    t: 0, scroll: 0, maxScroll: 0, btns: [], cells: [], dragging: false, lastY: 0, vel: 0,
    update: function (dt) {
      var g = Screens.gallery;
      g.t += dt;
      if (!g.dragging) {
        g.scroll += g.vel * dt;
        g.vel *= 0.90;
        if (Math.abs(g.vel) < 4) g.vel = 0;
      }
      g.scroll = clamp(g.scroll, 0, g.maxScroll);
    },
    handle: function (ev) {
      var g = Screens.gallery;
      if (UI.handle(g.btns, ev)) return;
      if (ev.type === 'down') { g.dragging = true; g.lastY = ev.y; g.vel = 0; }
      else if (ev.type === 'move' && g.dragging) {
        g.scroll = clamp(g.scroll - ev.dy, -40, g.maxScroll + 40);
        g.vel = -ev.dy * 24;
      } else if (ev.type === 'up') {
        g.dragging = false;
      } else if (ev.type === 'tap') {
        for (var i = 0; i < g.cells.length; i++) {
          var c = g.cells[i];
          if (ev.x >= c.x && ev.x <= c.x + c.w && ev.y >= c.y - g.scroll && ev.y <= c.y + c.h - g.scroll) {
            Sound.sfx('ui'); Haptics.light();
            var badge = c.badge;
            if (Profile.hasBadge(badge.id)) {
              Game.showCard(badge.card, function () { Game.setState('GALLERY'); });
            } else {
              Game.toast(badge.how, badge.icon, 'rgba(255,255,255,.65)');
              Sound.sfx('back');
            }
            return;
          }
        }
      }
    },
    render: function (ctx) {
      var g = Screens.gallery;
      Screens.backdrop(ctx, g.t);
      Draw.scrim(ctx, 0.35);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, View.safe.t + 190, CFG.W, CFG.H - View.safe.t - 190);
      ctx.clip();
      if (g.headers) {
        for (var h = 0; h < g.headers.length; h++) {
          var hd = g.headers[h];
          var hy = hd.y - g.scroll + 10;
          if (hy > -40 && hy < CFG.H + 40) {
            Draw.text(ctx, hd.text.toUpperCase(), 40, hy, {
              size: 22, color: C.teal, weight: '900'
            });
            ctx.save();
            ctx.strokeStyle = 'rgba(53,214,196,.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(40 + Draw.measure(ctx, hd.text.toUpperCase(), 22, '900') + 16, hy);
            ctx.lineTo(CFG.W - 40, hy);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
      for (var i = 0; i < g.cells.length; i++) Screens.drawBadgeCell(ctx, g.cells[i], g.scroll, g.t);
      ctx.restore();

      /* header */
      var grd = ctx.createLinearGradient(0, 0, 0, View.safe.t + 200);
      grd.addColorStop(0, 'rgba(4,6,14,.98)');
      grd.addColorStop(1, 'rgba(4,6,14,.0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, CFG.W, View.safe.t + 200);
      Draw.text(ctx, 'HALACHA GALLERY', CFG.W / 2, View.safe.t + 78, {
        size: 40, color: C.gold, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.6)', strokeW: 6
      });
      Draw.text(ctx, Profile.badgeCount() + ' / ' + Halacha.badges.length + ' badges  •  ' +
        Profile.cardSeenCount() + ' / ' + Halacha.totalCards() + ' cards read',
        CFG.W / 2, View.safe.t + 122, { size: 22, color: 'rgba(255,255,255,.7)', align: 'center', weight: '700' });
      Draw.text(ctx, 'Tap an earned badge to re-read its halacha.', CFG.W / 2, View.safe.t + 158,
        { size: 19, color: 'rgba(255,255,255,.45)', align: 'center', weight: '600' });
      UI.drawAll(ctx, g.btns, g.t, 1 / 60);
    }
  },

  drawBadgeCell: function (ctx, c, scroll, t) {
    var y = c.y - scroll;
    if (y > CFG.H + 60 || y + c.h < -60) return;
    var owned = Profile.hasBadge(c.badge.id);
    ctx.save();
    Draw.rr(ctx, c.x, y, c.w, c.h, 18);
    ctx.fillStyle = owned ? 'rgba(26,34,70,.96)' : 'rgba(12,15,28,.9)';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = owned ? C.gold : 'rgba(255,255,255,.12)';
    ctx.stroke();
    if (owned) {
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.15 * pulse(t * 0.5 + c.x, 0.5);
      ctx.shadowColor = C.gold; ctx.shadowBlur = 18;
      Draw.rr(ctx, c.x, y, c.w, c.h, 18); ctx.stroke();
      ctx.restore();
    }
    Icons.draw(ctx, c.badge.icon, c.x + c.w / 2, y + 50, 46, owned ? C.gold : 'rgba(255,255,255,.16)');
    var lines = Draw.wrap(ctx, c.badge.name, c.w - 10, 15, '800');
    for (var i = 0; i < Math.min(2, lines.length); i++) {
      Draw.text(ctx, lines[i], c.x + c.w / 2, y + 87 + i * 18, {
        size: 15, color: owned ? C.cream : 'rgba(255,255,255,.35)', align: 'center', weight: '800'
      });
    }
    if (!owned) {
      Draw.text(ctx, 'LOCKED', c.x + c.w / 2, y + c.h - 13, {
        size: 13, color: 'rgba(255,255,255,.28)', align: 'center', weight: '800'
      });
    } else {
      Draw.text(ctx, 'READ', c.x + c.w / 2, y + c.h - 13, {
        size: 13, color: C.teal, align: 'center', weight: '900'
      });
    }
    ctx.restore();
  },

  buildGallery: function () {
    var g = Screens.gallery;
    g.cells = [];
    var cols = 5, cw = 124, chh = 148, gap = 12;
    var x0 = (CFG.W - (cols * cw + (cols - 1) * gap)) / 2;
    var y0 = View.safe.t + 214;
    var groups = ['menorah', 'shul', 'kosher', 'matzah', 'tzedaka', 'general'];
    var titles = { menorah: 'Chanukah', shul: 'Tefillah & Zmanim', kosher: 'Kashrus', matzah: 'Pesach', tzedaka: 'Tzedakah', general: 'General' };
    var y = y0, idx = 0;
    g.headers = [];
    for (var gi = 0; gi < groups.length; gi++) {
      var list = Halacha.badges.filter(function (b) { return b.game === groups[gi]; });
      if (!list.length) continue;
      g.headers.push({ y: y, text: titles[groups[gi]] });
      y += 44;
      for (var i = 0; i < list.length; i++) {
        var col = i % cols, row = (i / cols) | 0;
        g.cells.push({ x: x0 + col * (cw + gap), y: y + row * (chh + gap), w: cw, h: chh, badge: list[i] });
      }
      y += Math.ceil(list.length / cols) * (chh + gap) + 12;
    }
    g.contentH = y;
    g.maxScroll = Math.max(0, y + 60 - CFG.H + View.safe.b);
    g.scroll = 0;
    g.btns = [
      new Button(20 + View.safe.l, View.safe.t + 20, 96, 56, 'BACK',
        function () { Screens.buildMenu(); Game.setState('MENU'); },
        { fill: 'rgba(12,18,40,.92)', textColor: C.cream, stroke: 'rgba(255,255,255,.35)', size: 20, radius: 16 })
    ];
  }
};

/* ==========================================================================
   17. OVERLAYS - INTRO / PAUSE / HALACHA FLASH CARD / GAME OVER
   ========================================================================== */
/* ---------------------------------------------------- the chapter picker */
/* A game that has chapters shows them as a grid of numbers on its own start
   screen. Everything you have finished is open and stays open, so you can go
   straight to the hard one instead of walking the whole run again. */
Screens.CHIP_H = 62;

/* Wide runs get more, narrower chips so a whole game still fits two rows. */
Screens.chipGrid = function (count) {
  if (count > 10) return { cols: 6, w: 88, gap: 10 };
  if (count > 6)  return { cols: 4, w: 116, gap: 14 };
  return { cols: count, w: 96, gap: 14 };
};

Screens.chapterRows = function (n) {
  return Math.ceil(n / Screens.chipGrid(n).cols);
};

Screens.chipRect = function (L, i, count) {
  var g = Screens.chipGrid(count);
  var row = Math.floor(i / g.cols);
  var inRow = Math.min(g.cols, count - row * g.cols);
  var rowW = inRow * g.w + (inRow - 1) * g.gap;
  var x0 = L.x + (L.w - rowW) / 2;
  return {
    x: x0 + (i % g.cols) * (g.w + g.gap),
    y: L.chapY + row * (Screens.CHIP_H + g.gap),
    w: g.w, h: Screens.CHIP_H
  };
};

Screens.introLayout = function (scene) {
  var ctx = View.ctx;
  var w = 620, x = (CFG.W - w) / 2;
  var tipW = w - 118;
  var ch = scene.chapters ? scene.chapters() : null;
  var chapH = 0;
  if (ch) chapH = 40 + Screens.chapterRows(ch.count) * (Screens.CHIP_H + Screens.chipGrid(ch.count).gap) + 10;
  var avail = CFG.H - View.safe.t - View.safe.b;

  /* A start screen with a chapter picker on it has a lot to say, and the
     screen it has to say it on is whatever the phone gives us. Step the tip
     text down until the last button fits - never let it run off the bottom. */
  var sizes = [22, 21, 20, 19, 18, 17], best = null, si;
  for (si = 0; si < sizes.length; si++) {
    var size = sizes[si], lh = Math.round(size * 1.32);
    var tips = [], total = 0, i;
    for (i = 0; i < scene.tips.length; i++) {
      var hh = Draw.paraHeight(ctx, scene.tips[i], tipW, { size: size, lineHeight: lh, weight: '600' });
      tips.push(hh);
      total += hh + (size > 19 ? 16 : 12);
    }
    var h = 262 + total + chapH + 56;
    var btnH = size > 19 ? 92 : 80, backH = size > 19 ? 72 : 64;
    var btnBlock = 30 + btnH + 16 + backH;
    best = { x: x, w: w, tipW: tipW, h: h, tips: tips, chap: ch,
      size: size, lineHeight: lh, gap: size > 19 ? 16 : 12,
      btnH: btnH, backH: backH, btnBlock: btnBlock, total: total };
    if (h + btnBlock <= avail) break;
  }
  var topY = View.safe.t + Math.max(14, (avail - (best.h + best.btnBlock)) / 2);
  /* if even the smallest still overhangs, pull the whole card up to the top */
  if (topY + best.h + best.btnBlock > CFG.H - View.safe.b) {
    topY = Math.max(View.safe.t + 8, CFG.H - View.safe.b - best.h - best.btnBlock - 8);
  }
  best.topY = topY;
  best.chapY = topY + 262 + best.total + 34;
  best.btnY = topY + best.h + 30;
  return best;
};

Screens.buildIntro = function (scene) {
  var L = Screens.introLayout(scene);
  var btns = [];
  if (L.chap) {
    var open = Profile.reached(L.chap.key);
    /* PLAY always means start at the beginning. Skipping ahead is a thing you
       choose by tapping a number, never something the game does for you. */
    if (!scene.startLevel) scene.startLevel = 1;
    if (scene.startLevel > open) scene.startLevel = open;
    for (var i = 0; i < L.chap.count; i++) {
      (function (n) {
        var r = Screens.chipRect(L, n - 1, L.chap.count);
        var locked = n > open;
        var b = new Button(r.x, r.y, r.w, r.h, String(n), function () {
          if (locked) { Sound.sfx('back'); return; }
          scene.startLevel = n;
          Sound.sfx('tap');
          Screens.buildIntro(scene);
        }, { fill: 'rgba(12,18,40,.92)', textColor: C.cream, size: 26,
             invisible: true, pad: 4 });
        b.chapter = n;
        b.locked = locked;
        b.picked = (n === scene.startLevel);
        btns.push(b);
      })(i + 1);
    }
  }
  btns.push(new Button(L.x + 10, L.btnY, L.w - 20, L.btnH, 'PLAY', function () { Game.beginPlay(); },
    { fill: C.gold, textColor: C.ink, size: L.btnH > 84 ? 36 : 32 }));
  btns.push(new Button(L.x + 10, L.btnY + L.btnH + 16, L.w - 20, L.backH, 'BACK TO MENU', function () { Game.quitToMenu(); },
    { fill: 'rgba(12,18,40,.92)', textColor: C.cream, stroke: 'rgba(255,255,255,.35)', size: 24 }));
  Screens.introBtns = btns;
};

/* a small padlock, for the chapters you have not reached yet */
Screens.drawLock = function (ctx, cx, cy, sz, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, sz * 0.16);
  ctx.beginPath();
  ctx.arc(cx, cy - sz * 0.18, sz * 0.30, Math.PI, 0);
  ctx.stroke();
  ctx.fillStyle = color;
  Draw.rr(ctx, cx - sz * 0.42, cy - sz * 0.16, sz * 0.84, sz * 0.62, sz * 0.14);
  ctx.fill();
  ctx.restore();
};

Screens.renderIntro = function (ctx) {
  var s = Game.scene;
  if (!s) return;
  var meta = null;
  for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === s.id) meta = GAMES[i];
  var accent = meta ? meta.color : C.gold;
  Draw.scrim(ctx, 0.84);
  var L = Screens.introLayout(s);
  var x = L.x, w = L.w, topY = L.topY, h = L.h;
  Draw.panel(ctx, x, topY, w, h, {
    fill: 'rgba(10,15,34,.98)', stroke: accent, strokeW: 3,
    radius: 28, glow: accent, glowBlur: 30
  });
  Icons.draw(ctx, meta ? meta.icon : 'rosette', CFG.W / 2, topY + 84, 74, accent);
  Draw.textFit(ctx, s.name, CFG.W / 2, topY + 154, w - 72, { size: 36, color: C.cream, align: 'center', weight: '900' });
  Draw.text(ctx, meta ? meta.tag.toUpperCase() : '', CFG.W / 2, topY + 190,
    { size: 19, color: 'rgba(255,255,255,.5)', align: 'center', weight: '800' });
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 46, topY + 218); ctx.lineTo(x + w - 46, topY + 218); ctx.stroke();
  ctx.restore();

  var ty = topY + 250;
  for (var j = 0; j < s.tips.length; j++) {
    ctx.save();
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(x + 48, ty + 11, 6, 0, TAU);
    ctx.fill();
    ctx.restore();
    Draw.para(ctx, s.tips[j], x + 70, ty, L.tipW, {
      size: L.size, lineHeight: L.lineHeight, color: 'rgba(255,255,255,.88)', weight: '600', baseline: 'top'
    });
    ty += L.tips[j] + L.gap;
  }
  if (L.chap) {
    var open = Profile.reached(L.chap.key);
    Draw.text(ctx, L.chap.word + 'S  -  ' + open + ' OF ' + L.chap.count + ' OPEN',
      CFG.W / 2, L.chapY - 20, { size: 18, color: 'rgba(255,255,255,.55)', align: 'center', weight: '800' });
    for (var q = 0; q < L.chap.count; q++) {
      var n = q + 1;
      var r2 = Screens.chipRect(L, q, L.chap.count);
      var locked = n > open;
      var picked = (n === s.startLevel);
      Draw.panel(ctx, r2.x, r2.y, r2.w, r2.h, {
        fill: picked ? accent : (locked ? 'rgba(255,255,255,.05)' : 'rgba(12,18,40,.92)'),
        stroke: picked ? accent : (locked ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.3)'),
        strokeW: picked ? 3 : 2, radius: 14,
        glow: picked ? accent : null, glowBlur: 18
      });
      if (locked) {
        Screens.drawLock(ctx, r2.x + r2.w / 2, r2.y + r2.h / 2, 26, 'rgba(255,255,255,.3)');
      } else {
        Draw.text(ctx, String(n), r2.x + r2.w / 2, r2.y + r2.h / 2 + 1, {
          size: 27, color: picked ? C.ink : C.cream, align: 'center', weight: '900'
        });
      }
    }
    Draw.text(ctx, 'Finish one and the next opens. Tap any open ' + L.chap.word.toLowerCase() + ' to start there.',
      CFG.W / 2, topY + h - 32, { size: 18, color: C.teal, align: 'center', weight: '700' });
  } else {
    Draw.text(ctx, 'Halacha cards appear as you progress.', CFG.W / 2, topY + h - 32,
      { size: 19, color: C.teal, align: 'center', weight: '700' });
  }
  UI.drawAll(ctx, Screens.introBtns, Game.time, 1 / 60);
};

/* ------------------------------------------------- HALACHA FLASH CARD */
Screens.popupLayout = function (ctx, card) {
  var w = 620, x = (CFG.W - w) / 2;
  var bodyW = w - 88;
  var titleLines = Draw.wrap(ctx, card.title, bodyW, 33, '900');
  var titleBlockH = 44 + titleLines.length * 38 + 16 + 28;

  var bodyH = Draw.paraHeight(ctx, card.body, bodyW, { size: 25, lineHeight: 35, weight: '600' });
  var noteInnerH = 0, noteBoxH = 0;
  if (card.note) {
    noteInnerH = Draw.paraHeight(ctx, card.note, bodyW - 28, { size: 21, lineHeight: 29, weight: '700' });
    noteBoxH = noteInnerH + 22;
  }
  var termsH = 0, ti;
  if (card.terms && card.terms.length) {
    termsH = 14;
    for (ti = 0; ti < card.terms.length; ti++) {
      termsH += Draw.paraHeight(ctx, card.terms[ti][0] + ' - ' + card.terms[ti][1],
        bodyW - 30, { size: 20, lineHeight: 27, weight: '700' }) + 6;
    }
    termsH += 14;
  }
  var sourceH = Draw.paraHeight(ctx, card.source, w - 72, { size: 20, lineHeight: 26, weight: '700' }) + 20;

  var scrollContentH = 28 + bodyH;
  if (termsH) scrollContentH += 12 + termsH;
  if (noteBoxH) scrollContentH += 12 + noteBoxH;
  scrollContentH += sourceH;

  var headerH = 74;
  var fixedH = headerH + titleBlockH;
  var btnH = 92, btnGap = 28;
  var avail = CFG.H - View.safe.t - View.safe.b - btnH - btnGap - 12;
  var panelH = Math.min(fixedH + scrollContentH + 10, avail);
  var scrollH = panelH - fixedH - 6;
  var maxScroll = Math.max(0, scrollContentH - scrollH);
  var totalBlock = panelH + btnGap + btnH;
  var y = View.safe.t + Math.max(8, (CFG.H - View.safe.t - View.safe.b - totalBlock) / 2);

  return {
    x: x, w: w, y: y, h: panelH, bodyW: bodyW, titleLines: titleLines,
    fixedH: fixedH, scrollTop: y + fixedH + 4, scrollH: scrollH,
    scrollContentH: scrollContentH, maxScroll: maxScroll,
    bodyH: bodyH, termsH: termsH, noteInnerH: noteInnerH, noteBoxH: noteBoxH,
    btnY: y + panelH + btnGap
  };
};

Screens.renderPopupScroll = function (ctx, card, L, scroll) {
  var x = L.x, w = L.w, bodyW = L.bodyW;
  var ty = L.scrollTop + 28 - scroll;
  ty = Draw.para(ctx, card.body, x + 44, ty, bodyW, {
    size: 25, lineHeight: 35, color: '#33291a', weight: '600', baseline: 'top'
  });
  var ti;
  if (card.terms && card.terms.length) {
    ty += 12;
    var th = L.termsH;
    ctx.save();
    Draw.rr(ctx, x + 44, ty, bodyW, th, 12);
    ctx.fillStyle = 'rgba(53,140,124,.14)';
    ctx.fill();
    ctx.fillStyle = '#2f7f70';
    Draw.rr(ctx, x + 44, ty, 5, th, 2.5);
    ctx.fill();
    ctx.restore();
    var wy2 = ty + 9;
    for (ti = 0; ti < card.terms.length; ti++) {
      var lab = card.terms[ti][0];
      var labW = Draw.measure(ctx, lab, 20, '900') + 8;
      Draw.text(ctx, lab, x + 62, wy2 + 12, { size: 20, color: '#1f6a5c', weight: '900' });
      wy2 = Draw.para(ctx, '\u2014 ' + card.terms[ti][1], x + 62 + labW, wy2, bodyW - 46 - labW, {
        size: 20, lineHeight: 27, color: '#3d4f42', weight: '700', baseline: 'top'
      }) + 6;
    }
    ty += th;
  }
  if (card.note) {
    ty += 12;
    var nh = L.noteInnerH;
    ctx.save();
    Draw.rr(ctx, x + 44, ty, bodyW, nh + 22, 12);
    ctx.fillStyle = 'rgba(120,88,28,.13)';
    ctx.fill();
    ctx.fillStyle = '#8a6a2f';
    Draw.rr(ctx, x + 44, ty, 5, nh + 22, 2.5);
    ctx.fill();
    ctx.restore();
    Draw.para(ctx, card.note, x + 44 + 18, ty + 11, bodyW - 28, {
      size: 21, lineHeight: 29, color: '#5c4a24', weight: '700', baseline: 'top'
    });
    ty += nh + 22;
  }
  ty += 8;
  Draw.para(ctx, card.source, x + 44, ty, bodyW, {
    size: 20, lineHeight: 26, color: '#7a5a22', weight: '700', baseline: 'top'
  });
};

Screens.buildPopup = function () {
  var w = 560, x = (CFG.W - w) / 2;
  Screens.popupBtns = [
    new Button(x, 0, w, 92, 'CONTINUE', function () { Game.closeCard(); },
      { fill: C.gold, textColor: C.ink, size: 32 })
  ];
};
Screens.popupUpdate = function (dt) {
  var p = Game.popup;
  if (!p) return;
  if (!p.dragging) {
    p.scroll += p.vel * dt;
    p.vel *= 0.90;
    if (Math.abs(p.vel) < 4) p.vel = 0;
  }
  p.scroll = clamp(p.scroll, 0, p.maxScroll || 0);
};
Screens.popupHandle = function (ev) {
  var p = Game.popup;
  if (!p) return;
  if (UI.handle(Screens.popupBtns, ev)) return;
  if (ev.type === 'down') { p.dragging = true; p.lastY = ev.y; p.vel = 0; }
  else if (ev.type === 'move' && p.dragging) {
    p.scroll = clamp(p.scroll - ev.dy, -36, (p.maxScroll || 0) + 36);
    p.vel = -ev.dy * 24;
  } else if (ev.type === 'up') {
    p.dragging = false;
  }
};
Screens.renderPopup = function (ctx) {
  var p = Game.popup;
  if (!p) return;
  var card = p.card;
  var appear = clamp(p.t / 0.32, 0, 1);
  Draw.scrim(ctx, 0.86 * appear);

  var L = Screens.popupLayout(ctx, card);
  p.maxScroll = L.maxScroll;
  var scroll = p.scroll || 0;
  scroll = clamp(scroll, 0, L.maxScroll);
  p.scroll = scroll;

  var x = L.x, w = L.w, y = L.y, h = L.h;

  ctx.save();
  var sc = lerp(0.86, 1, easeOut(appear));
  ctx.translate(CFG.W / 2, y + h / 2);
  ctx.scale(sc, sc);
  ctx.translate(-CFG.W / 2, -(y + h / 2));
  ctx.globalAlpha = appear;

  Draw.panel(ctx, x, y, w, h, { fill: C.parch, stroke: '#8a6a2f', strokeW: 4, radius: 26, glow: 'rgba(255,207,92,.5)', glowBlur: 40 });
  ctx.save();
  Draw.rr(ctx, x, y, w, h, 26); ctx.clip();
  ctx.fillStyle = 'rgba(140,105,45,.10)';
  for (var i = 0; i < 26; i++) ctx.fillRect(x, y + i * 26 + 12, w, 1.5);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(x + w, y, w * 0.5, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  Draw.rr(ctx, x, y, w, 74, 26); ctx.clip();
  ctx.fillStyle = '#2a1f10';
  ctx.fillRect(x, y, w, 74);
  ctx.restore();
  Icons.draw(ctx, card.icon, x + 46, y + 37, 40, C.gold);
  Draw.text(ctx, 'HALACHA CARD', x + 76, y + 37, { size: 22, color: C.gold, weight: '900' });
  if (p.isNew) {
    Draw.panel(ctx, x + w - 106, y + 18, 82, 38, { fill: C.teal, radius: 12 });
    Draw.text(ctx, 'NEW', x + w - 65, y + 37, { size: 20, color: '#04231f', align: 'center', weight: '900' });
  }

  var ty = y + 118;
  Draw.text(ctx, card.hebrew, x + w / 2, ty, { size: 34, color: '#5c4318', align: 'center', weight: '700' });
  ty += 46;
  var titleLines = L.titleLines;
  for (var t2 = 0; t2 < titleLines.length; t2++) {
    Draw.text(ctx, titleLines[t2], x + w / 2, ty + t2 * 38, { size: 33, color: C.ink, align: 'center', weight: '900' });
  }
  ty += titleLines.length * 38 + 16;
  ctx.save();
  ctx.strokeStyle = 'rgba(90,66,24,.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 60, ty); ctx.lineTo(x + w - 60, ty); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 24, L.scrollTop, w - 48, L.scrollH);
  ctx.clip();
  Screens.renderPopupScroll(ctx, card, L, scroll);
  ctx.restore();

  if (L.maxScroll > 0) {
    if (scroll > 6) {
      var tg = ctx.createLinearGradient(0, L.scrollTop, 0, L.scrollTop + 28);
      tg.addColorStop(0, 'rgba(244,232,196,.92)');
      tg.addColorStop(1, 'rgba(244,232,196,0)');
      ctx.fillStyle = tg;
      ctx.fillRect(x + 24, L.scrollTop, w - 48, 28);
    }
    if (scroll < L.maxScroll - 6) {
      var bg = ctx.createLinearGradient(0, L.scrollTop + L.scrollH - 34, 0, L.scrollTop + L.scrollH);
      bg.addColorStop(0, 'rgba(244,232,196,0)');
      bg.addColorStop(1, 'rgba(244,232,196,.94)');
      ctx.fillStyle = bg;
      ctx.fillRect(x + 24, L.scrollTop + L.scrollH - 34, w - 48, 34);
      Draw.text(ctx, 'scroll for more', x + w / 2, L.scrollTop + L.scrollH - 12, {
        size: 16, color: '#7a5a22', align: 'center', weight: '700'
      });
    }
    var trackH = L.scrollH - 10;
    var thumbH = Math.max(28, trackH * (L.scrollH / L.scrollContentH));
    var thumbY = L.scrollTop + 5 + (L.maxScroll ? (scroll / L.maxScroll) * (trackH - thumbH) : 0);
    ctx.fillStyle = 'rgba(90,66,24,.14)';
    Draw.rr(ctx, x + w - 16, L.scrollTop + 5, 5, trackH, 2.5); ctx.fill();
    ctx.fillStyle = 'rgba(90,66,24,.42)';
    Draw.rr(ctx, x + w - 16, thumbY, 5, thumbH, 2.5); ctx.fill();
  }

  ctx.restore();

  var btn = Screens.popupBtns[0];
  btn.x = x + (w - btn.w) / 2;
  btn.y = L.btnY;
  if (btn.y + btn.h > CFG.H - View.safe.b - 8) btn.y = CFG.H - View.safe.b - 8 - btn.h;
  ctx.save();
  ctx.globalAlpha = appear;
  UI.drawAll(ctx, Screens.popupBtns, Game.time, 1 / 60);
  ctx.restore();
};

    Draw.panel(ctx, -110, -22, 220, 44, { fill: C.teal, radius: 14 });
    Draw.text(ctx, 'NEW BEST!', 0, 0, { size: 24, color: '#04231f', align: 'center', weight: '900' });
    ctx.restore();
  } else {
    Draw.text(ctx, 'BEST  ' + fmt(o.best), CFG.W / 2, y + 258, { size: 24, color: 'rgba(255,255,255,.6)', align: 'center', weight: '800' });
  }

  var ry = y + 312;
  var rows = [['Mitzvah Points earned', '+' + fmt(o.points)], ['Level reached', String(o.level)]].concat(o.stats || []);
  for (var i = 0; i < rows.length && ry < y + h - 30; i++) {
    var valW = Draw.measure(ctx, String(rows[i][1]), 22, '800');
    Draw.textFit(ctx, rows[i][0], x + 46, ry, w - 112 - valW, { size: 22, color: 'rgba(255,255,255,.62)', weight: '600' });
    Draw.text(ctx, String(rows[i][1]), x + w - 46, ry, { size: 22, color: C.cream, align: 'right', weight: '800' });
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 40, ry + 18); ctx.lineTo(x + w - 40, ry + 18); ctx.stroke();
    ctx.restore();
    ry += 40;
  }
  Draw.text(ctx, 'Total  ' + fmt(Profile.data.mitzvahPoints) + ' MP  •  ' +
    Profile.badgeCount() + '/' + Halacha.badges.length + ' badges',
    CFG.W / 2, y + h - 30, { size: 21, color: C.gold, align: 'center', weight: '800' });

  UI.drawAll(ctx, Screens.overBtns, Game.time, 1 / 60);
};

/* ==========================================================================
   GAME 1 - MENORAH KEEPER  (Chanukah survival)
   Keep every light burning for the full half hour after nightfall.
     - one olive-oil jug sits directly beneath the light it feeds
     - wind gusts drift across; swipe AGAINST the wind to push them back the
       way they came. One gust that lands makes a flame sputter, a second on a
       sputtering flame puts it out
     - boys run past squirting sufganiyah jelly onto the glass; three globs
       stacked over one light drip down and douse it
     - oily potato latkes land on a cup and start a grease fire; if the glass
       overheats it cracks and that light is gone for the rest of the night
     - a dark light can only be relit from the shamash: double-tap it off its
       pin, then hold it over the wick
   Every night is graded: Kosher L'Mehadrin, Kosher, or Me'ikkar HaDin.
   ========================================================================== */
function MenorahKeeper() {
  MiniGame.call(this, 'menorah', 'Menorah Keeper');
  this.tips = [
    'Every light has its own little oil jug right underneath it. Tap the jug (or the light) to top it up.',
    'A gust blowing in? Swipe ACROSS THE FLAMES against it and the window slams shut. Wind that gets in drinks the oil and leaves a flame SPUTTERING - pour fresh oil in fast or it dies on its own.',
    'Wipe sufganiyah jelly off the glass. Three blobs over one light and it drips down and drowns the flame. Swipe flying latkes off fast too, or the glass cracks and that light is finished.',
    'A dark light can only be relit from the shamash - the helper candle that does the lighting. TAP it to pick it up, drag it onto the dark wick and hold. Fill the cup first: a flame will not catch on a dry wick.'
  ];
}
MenorahKeeper.prototype = Object.create(MiniGame.prototype);
MenorahKeeper.prototype.constructor = MenorahKeeper;

/* Chapters: the nights you can jump straight to once you have kept them.
   Night 1 is always open; getting through a night opens the next one. */
MenorahKeeper.NIGHTS = 8;
MenorahKeeper.prototype.chapters = function () {
  return { count: MenorahKeeper.NIGHTS, word: 'NIGHT', key: 'menorah' };
};
MenorahKeeper.prototype.startAt = function (n) {
  this.night = clamp(n | 0, 1, MenorahKeeper.NIGHTS);
  this.level = this.night;
  this.setupNight();
};

MenorahKeeper.CX = 360;
MenorahKeeper.ARM = 70;
MenorahKeeper.BASE_Y = 960;
MenorahKeeper.CUP_OUTER = 710;
MenorahKeeper.CUP_SHAM = 640;
MenorahKeeper.JUG_Y = 1120;
MenorahKeeper.NIGHT_SECONDS = 90;      // one halachic half hour, played fast
MenorahKeeper.GLASS_TOP = 300;
MenorahKeeper.BAND_TOP = 540;          // the flame band a shielding swipe must cross
MenorahKeeper.BAND_BOT = 940;
MenorahKeeper.ORDER = [8, 7, 6, 5, 3, 2, 1, 0];   // lights are placed from the right

MenorahKeeper.BOYS = [
  { kippah:'#6f9ff2', hair:'#33241a', shirt:'#2f5fbf', vest:'#1b2a4d', skin:'#f0c39a' },
  { kippah:'#f08a8a', hair:'#8a4a20', shirt:'#8a2f3f', vest:'#4a1c24', skin:'#f6d3ae' },
  { kippah:'#7fe0a8', hair:'#141414', shirt:'#1c5c40', vest:'#123024', skin:'#c98d63' },
  { kippah:'#f0c33c', hair:'#c96b2a', shirt:'#4a3f7a', vest:'#2e2650', skin:'#f7d9bb' },
  { kippah:'#c9adff', hair:'#54381c', shirt:'#37707c', vest:'#1f454d', skin:'#e8b489' }
];

/* --------------------------------------------------- per-night difficulty */
/* Every hazard is present from night 1 - just slow, rare and well telegraphed. */
MenorahKeeper.prototype.tune = function () {
  var n = Math.min(this.night, 12);
  return {
    drain:      0.0175 + n * 0.0030,                 // night 1: a full cup lasts ~49s
    jugCool:    1.7 + n * 0.13,
    grace:      Math.max(8, 16 - n),                 // seconds a dark light is tolerated
    gustEvery:  Math.max(4.2, 20 - n * 2.4),
    gustSpeed:  86 + n * 42,                         // night 1 ~7s to cross, night 8 ~1.7s
    gustWarn:   Math.max(0.9, 2.6 - n * 0.22),
    gustOil:    0.16 + n * 0.012,                    // a gust that lands eats oil too
    gutter:     Math.max(6.5, 13.5 - n * 0.85),   // how long you have to steady it
    sputterDrain: 2.2,                            // a struggling flame guzzles oil
    twinFrom:   4,                                   // gusts from both sides at once
    boyEvery:   Math.max(4.5, 20 - n * 2.0),
    dreidEvery: Math.max(6.0, 32 - n * 3.2),
    latkeEvery: Math.max(7.0, 36 - n * 3.6),
    crackTime:  Math.max(4.0, 10.5 - n * 0.8),       // night 1: ~9.7s of grease fire
    bigLatkeFrom: 5,
    catFrom:    4,                                   // the cat that stalks the oil jugs
    catEvery:   Math.max(9.0, 34 - n * 2.4),
    mothFrom:   5,                                   // moths that dive at the flames
    mothEvery:  Math.max(5.5, 30 - n * 2.8),
    mothSpeed:  84 + n * 10,
    strongFrom: 7                                    // gusts that take two swipes
  };
};

MenorahKeeper.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.night = 1; this.level = 1; this.elapsed = 0;
  this.nightTime = 0;
  this.nightDuration = MenorahKeeper.NIGHT_SECONDS;
  this.candles = [];
  this.jugs = [];
  this.boys = [];
  this.shots = [];
  this.dreidels = [];
  this.flyingLatkes = [];
  this.cats = [];
  this.moths = [];
  this.gusts = [];
  this.gustWave = 0;
  this.waveKills = 0;
  this.introduced = {};
  this.catTimer = 30;
  this.mothTimer = 30;
  this.shooed = 0; this.swatted = 0; this.steadied = 0;
  this.boss = null; this.victory = false; this.bossSliced = 0;
  this.gustTimer = 8;
  this.boyTimer = 12;
  this.dreidelTimer = 16;
  this.latkeTimer = 20;
  this.boyCycle = 0;
  this.handSweep = null;
  this.blocks = 0; this.wipes = 0; this.stopped = 0; this.nightsDone = 0;
  this.relights = 0; this.doused = 0; this.latkesOff = 0; this.cracked = 0;
  this.grades = { mehadrin: 0, kosher: 0, ikkar: 0, none: 0 };
  this.lastGrade = null;
  this.cleanNight = true;
  this.lastTapT = -10;
  this.lastTapOnSham = false;
  this.prompt = null;
  this.sham = { out: false, held: false, pointer: null, x: 0, y: 0, progress: 0, target: null,
                returning: 0, wobble: 0, dry: null, warnedOut: false, justLifted: 0,
                moved: false, pressT: 0 };
  for (var i = 0; i < 9; i++) {
    var isSham = (i === 4);
    this.candles.push({
      i: i, sham: isSham,
      x: MenorahKeeper.CX + (i - 4) * MenorahKeeper.ARM,
      y: isSham ? MenorahKeeper.CUP_SHAM : MenorahKeeper.CUP_OUTER,
      active: false, oil: 0, lit: false, dark: 0, gutter: 0, gutterMax: 1, gutterWave: 0, broken: 0,
      jelly: [], latke: null, dripT: 0, pourT: 0, flick: rand(0, 10), justLit: 0
    });
  }
  this.setupNight();
};

MenorahKeeper.prototype.setupNight = function () {
  var n = Math.min(8, this.night);
  this.level = this.night;
  this.nightTime = 0;
  this.cleanNight = true;
  var placed = MenorahKeeper.ORDER.slice(0, n);
  var i;
  for (i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    c.active = (i === 4) || placed.indexOf(i) >= 0;
    c.oil = c.active ? 1 : 0;
    c.lit = c.active;
    c.dark = 0; c.gutter = 0; c.gutterWave = 0; c.dripT = 0; c.broken = 0; c.latke = null;
    c.nagged = false;
    c.jelly.length = 0;
  }
  this.jugs.length = 0;
  var active = this.activeCandles();
  var xs = active.map(function (c) { return c.x; }).sort(function (a, b) { return a - b; });
  var minGap = 1e9;
  for (i = 1; i < xs.length; i++) minGap = Math.min(minGap, xs[i] - xs[i - 1]);
  if (!isFinite(minGap)) minGap = 200;
  var jw = clamp(minGap - 10, 46, 76);
  for (i = 0; i < active.length; i++) {
    this.jugs.push({
      ci: active[i].i, x: active[i].x, y: MenorahKeeper.JUG_Y,
      w: jw, fill: 1, cool: 0, spill: 0, pop: 0, stream: 0
    });
  }
  this.boys.length = 0; this.shots.length = 0; this.dreidels.length = 0;
  this.flyingLatkes.length = 0; this.gusts.length = 0;
  this.cats.length = 0; this.moths.length = 0;
  this.handSweep = null;
  this.boss = null;
  this.sham.out = false; this.sham.held = false; this.sham.progress = 0;
  this.sham.dry = null; this.sham.warnedOut = false; this.sham.target = null;
  this.sham.target = null; this.sham.returning = 0;
  /* the night opens straight away - staggered so it is readable, not empty */
  this.gustTimer = 1.1;
  this.boyTimer = 2.8;
  this.latkeTimer = 5.0;
  this.dreidelTimer = 7.0;
  this.catTimer = 8.5;
  this.mothTimer = 10.0;
  this.gustWave = 0;
  this.waveKills = 0;
  this.prompt = null;
};

/* one-off toast the first time a new attacker shows up in a run */
MenorahKeeper.prototype.introduce = function (key, text, icon, color) {
  if (this.introduced[key]) return;
  this.introduced[key] = 1;
  Game.toast(text, icon, color || C.gold);
};

MenorahKeeper.prototype.activeCandles = function () {
  return this.candles.filter(function (c) { return c.active; });
};
MenorahKeeper.prototype.liveCandles = function () {
  return this.candles.filter(function (c) { return c.active && !c.broken; });
};
MenorahKeeper.prototype.shamash = function () { return this.candles[4]; };
MenorahKeeper.prototype.jugFor = function (ci) {
  for (var i = 0; i < this.jugs.length; i++) if (this.jugs[i].ci === ci) return this.jugs[i];
  return null;
};
MenorahKeeper.prototype.colWidth = function () {
  return this.jugs.length ? this.jugs[0].w + 8 : 74;
};
MenorahKeeper.prototype.jugY = function () { return MenorahKeeper.JUG_Y - View.safe.b; };
MenorahKeeper.prototype.say = function (msg) { this.prompt = { text: msg, t: 2.6 }; };

/* ------------------------------------------------------------------ pour */
MenorahKeeper.prototype.pour = function (candle) {
  if (!candle || !candle.active) return false;
  if (candle.broken) { Sound.sfx('back'); FX.text(candle.x, candle.y - 60, 'the glass is cracked', C.red, 20); return false; }
  if (candle.latke) { Sound.sfx('back'); this.say('Never pour oil onto a grease fire! Swipe the latke off first'); return false; }
  var jug = this.jugFor(candle.i);
  if (!jug) return false;
  if (jug.spill > 0) { Sound.sfx('back'); FX.text(jug.x, this.jugY() - 90, 'spilled!', C.red, 22); return false; }
  if (jug.fill < 0.99) { Sound.sfx('back'); return false; }
  var steadying = candle.gutter > 0;
  if (candle.oil > 0.93 && !steadying) {
    Sound.sfx('back');
    FX.text(candle.x, candle.y - 60, 'still full', 'rgba(255,255,255,.65)', 20);
    return false;
  }
  jug.fill = 0; jug.cool = this.tune().jugCool; jug.pop = 1; jug.stream = 1;
  candle.oil = clamp(candle.oil + 0.8, 0, 1);
  candle.pourT = 0.45;
  Sound.sfx('pour');
  Haptics.light();
  FX.burst(candle.x, candle.y + 14, { n: 8, color: '#d9b25a', spdMax: 140, lifeMax: 0.5, rMax: 5 });
  if (steadying) {
    /* fresh oil settles the wick - this is the whole answer to a sputter */
    candle.gutter = 0;
    this.steadied++;
    this.addScore(45, candle.x, candle.y - 60, 'STEADIED +45', C.teal);
    Sound.sfx('good');
    Haptics.medium();
    FX.ring(candle.x, candle.y - 20, C.teal, 26);
  } else {
    this.addScore(10, candle.x, candle.y - 46, '+10', C.gold);
  }
  this.hitCombo();
  return true;
};

/* --------------------------------------------------------------- update */
MenorahKeeper.prototype.update = function (dt) {
  /* once Jelly-Zilla is on screen the night is over and he is the whole game */
  if (this.boss) { this.elapsed += dt; this.updateBoss(dt); return; }
  this.elapsed += dt;
  this.nightTime += dt;
  var T = this.tune();
  this.updateCandles(dt, T);
  this.updateJugs(dt);
  this.updateShamash(dt);
  this.updateGusts(dt, T);
  this.updateBoys(dt, T);
  this.updateJelly(dt);
  this.updateLatkes(dt, T);
  if (this.lives <= 0) return;
  this.updateCats(dt, T);
  this.updateMoths(dt, T);
  this.updateDreidels(dt, T);
  if (this.handSweep) { this.handSweep.t -= dt; if (this.handSweep.t <= 0) this.handSweep = null; }
  if (this.prompt) { this.prompt.t -= dt; if (this.prompt.t <= 0) this.prompt = null; }
  if (this.nightTime >= this.nightDuration && this.lives > 0) this.completeNight();
};

MenorahKeeper.prototype.updateCandles = function (dt, T) {
  var lit = 0;
  for (var i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (c.pourT > 0) c.pourT -= dt;
    if (c.justLit > 0) c.justLit -= dt;
    if (!c.active || c.broken) { c.gutter = 0; continue; }
    if (c.lit) {
      lit++;
      /* a shamash carried in the open burns down twice as fast, and a
         sputtering flame drinks its cup faster still */
      var rate = T.drain * ((c.sham && this.sham.out) ? 2 : 1) * (c.gutter > 0 ? T.sputterDrain : 1);
      c.oil -= rate * dt;
      /* a flame the wind caught dies unless you steady it with fresh oil */
      if (c.gutter > 0) {
        c.gutter -= dt;
        if (c.gutter <= 0) {
          c.gutter = 0;
          c.lit = false; c.dark = 0;
          if (!c.sham) this.cleanNight = false;
          this.breakCombo();
          Sound.sfx('bad'); Haptics.double();
          FX.burst(c.x, c.y - 24, { n: 12, color: '#8e99b5', spdMax: 150, grav: -50 });
          FX.text(c.x, c.y - 76, 'IT DIED DOWN', C.red, 26);
          if (!c.sham) this.say('A sputtering flame gives up unless you pour fresh oil in');
          continue;
        }
      }
      if (c.oil <= 0) {
        c.oil = 0; c.lit = false; c.dark = 0; c.gutter = 0;
        if (!c.sham) this.cleanNight = false;
        Sound.sfx('back');
        FX.burst(c.x, c.y - 26, { n: 9, color: '#8e99b5', spdMax: 90, grav: -40, lifeMax: 1.1 });
        FX.text(c.x, c.y - 70, 'out of oil', C.red, 22);
        if (!c.sham) this.say('Refill it, then relight it from the shamash');
      }
    } else {
      c.gutter = 0;
      /* The shamash is not one of the Chanukah lights. If it goes out nothing
         is lost - the mitzvah lights carry on burning, you simply have nothing
         to relight a dark wick FROM until you light it again. No penalty. */
      if (c.sham) { c.dark = 0; continue; }
      /* A light that has gone out costs you the grade, not a life. The mitzvah
         is judged at the end of the half hour: one light still burning is
         me'ikkar hadin and the night stands. Only a menorah that is completely
         dark at the end has not been fulfilled. */
      c.dark += dt;
      this.cleanNight = false;
      if (c.dark > T.grace && !c.nagged) {
        c.nagged = true;
        this.say(c.oil > 0.1 ? 'Tap the shamash, carry it over and hold it on the wick'
                             : 'Fill its jug first, then relight it from the shamash');
      }
    }
  }
  this.score += lit * dt * 2;
};

MenorahKeeper.prototype.updateJugs = function (dt) {
  for (var i = 0; i < this.jugs.length; i++) {
    var j = this.jugs[i];
    if (j.pop > 0) j.pop -= dt * 3;
    if (j.stream > 0) j.stream -= dt * 2.2;
    if (this.candles[j.ci].broken) { j.fill = 0; continue; }
    if (j.spill > 0) { j.spill -= dt; if (j.spill <= 0) j.cool = 1.2; continue; }
    if (j.cool > 0) { j.cool -= dt; j.fill = clamp(1 - j.cool / this.tune().jugCool, 0, 1); }
    else j.fill = 1;
  }
};

/* ------------------------------------------------------------- shamash */
/* Long enough to be a deliberate act, short enough to do while the wind is
   coming. Three seconds was unplayable. */
MenorahKeeper.RELIGHT_HOLD = 1.7;
MenorahKeeper.RELIGHT_MIN_OIL = 0.08;

MenorahKeeper.prototype.shamashTip = function () {
  var sh = this.sham, c = this.shamash();
  if (!sh.out) return { x: c.x, y: c.y - 26 };
  return { x: sh.x, y: sh.y - 26 };
};

MenorahKeeper.prototype.liftShamash = function () {
  var c = this.shamash();
  if (c.broken) { this.say('The shamash cup cracked - nothing to relight from tonight'); Sound.sfx('back'); return; }
  if (!c.lit) { this.say('Light the shamash first - it is the helper candle you carry the flame with'); Sound.sfx('back'); return; }
  var sh = this.sham;
  sh.out = true; sh.held = false; sh.pointer = null;
  sh.x = c.x; sh.y = c.y; sh.progress = 0; sh.target = null; sh.returning = 0;
  /* a second tap arriving right behind the first must not undo the lift */
  sh.justLifted = 0.5;
  Sound.sfx('light'); Haptics.medium();
  FX.ring(c.x, c.y, C.gold, 34);
  this.say('Now drag the shamash onto a dark wick. Careful - out in the open it burns twice as fast');
};

MenorahKeeper.prototype.returnShamash = function () {
  var sh = this.sham;
  if (!sh.out) return;
  sh.held = false; sh.pointer = null; sh.progress = 0; sh.target = null; sh.dry = null;
  sh.returning = 0.45;
};

MenorahKeeper.prototype.updateShamash = function (dt) {
  var sh = this.sham, home = this.shamash();
  if (!sh.out) return;
  sh.wobble += dt;
  if (sh.justLifted > 0) sh.justLifted -= dt;
  /* A pause, a resume or any Input.clear() drops the pointer without ever
     sending an 'up'. Without this the shamash stays "held" for the rest of the
     night and silently eats every swipe you make. */
  if (sh.held && (sh.pointer == null || !Input.pointers[sh.pointer])) {
    sh.held = false; sh.pointer = null;
  }
  if (sh.held) sh.pressT += dt;
  if (sh.returning > 0) {
    sh.returning -= dt;
    var k = clamp(1 - sh.returning / 0.45, 0, 1);
    sh.x = lerp(sh.x, home.x, easeOut(k) * 0.5 + 0.12);
    sh.y = lerp(sh.y, home.y, easeOut(k) * 0.5 + 0.12);
    if (sh.returning <= 0) { sh.out = false; Sound.sfx('tap'); }
    return;
  }
  var tip = this.shamashTip();
  var best = null, bd = 78;
  for (var i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (!c.active || c.sham || c.lit || c.broken) continue;
    var d = distance(tip.x, tip.y, c.x, c.y - 18);
    if (d < bd) { bd = d; best = c; }
  }
  /* the flame you are carrying has to still be alight */
  if (!home.lit) {
    sh.target = null; sh.progress = 0;
    if (!sh.warnedOut) {
      sh.warnedOut = true;
      this.say('The shamash burned out in your hand. Put it back, fill it and light it again');
      Sound.sfx('back');
    }
    this.returnShamash();
    return;
  }
  sh.warnedOut = false;
  if (!best) { sh.target = null; sh.progress = 0; sh.dry = null; return; }
  /* an empty cup cannot take a flame - say so on the cup, not in a prompt that
     scrolls away before you have read it */
  if (best.oil <= MenorahKeeper.RELIGHT_MIN_OIL) {
    if (sh.dry !== best) { sh.dry = best; Sound.sfx('back'); }
    sh.target = best; sh.progress = 0;
    return;
  }
  sh.dry = null;
  if (sh.target !== best) { sh.target = best; sh.progress = 0; }
  sh.progress += dt;
  if (Math.random() < dt * 8) FX.burst(best.x, best.y - 22, { n: 1, color: C.flame, spdMax: 40, grav: -60, lifeMax: 0.5, rMax: 3 });
  if (sh.progress >= MenorahKeeper.RELIGHT_HOLD) {
    best.lit = true; best.dark = 0; best.gutter = 0; best.justLit = 0.8; best.nagged = false;
    this.relights++;
    this.addScore(70, best.x, best.y - 60, 'RELIT +70', C.gold);
    this.hitCombo();
    Sound.sfx('light'); Haptics.win();
    FX.ring(best.x, best.y - 20, C.gold, 30);
    FX.burst(best.x, best.y - 24, { n: 16, color: C.flame, spdMax: 220 });
    this.returnShamash();
  }
};

/* ---------------------------------------------------------------- gusts */
MenorahKeeper.prototype.spawnGust = function (dir, T, strong) {
  this.gusts.push({
    dir: dir,
    need: dir > 0 ? 'left' : 'right',     // swipe against the wind
    x: dir > 0 ? -150 : CFG.W + 150,
    warn: T.gustWarn, speed: T.gustSpeed * (strong ? 0.82 : 1),
    hit: {}, reversed: false, y: rand(-10, 10), lane: 0,
    wave: this.gustWave,
    strength: strong ? 2 : 1, maxStrength: strong ? 2 : 1
  });
  if (strong) this.introduce('strong', 'A hard gust - it takes two swipes to shut the window on it.', 'wind', C.blue);
};

MenorahKeeper.prototype.updateGusts = function (dt, T) {
  var i, k;
  this.gustTimer -= dt;
  if (this.gustTimer <= 0 && this.gusts.length === 0) {
    this.gustTimer = T.gustEvery + rand(-1.2, 2.0);
    this.gustWave++;          /* one wave, however many gusts are in it */
    this.waveKills = 0;
    var twin = this.night >= T.twinFrom && chance(0.3);
    var strong = this.night >= T.strongFrom && chance(0.35);
    this.spawnGust(chance(0.5) ? 1 : -1, T, strong);
    if (twin) {
      this.spawnGust(-this.gusts[0].dir, T);
      this.gusts[0].lane = -1;
      this.gusts[1].lane = 1;
      Game.toast('Draft from both sides!', 'wind', C.blue);
    }
    Sound.sfx('wind');
  }
  for (i = this.gusts.length - 1; i >= 0; i--) {
    var g = this.gusts[i];
    if (g.warn > 0) { g.warn -= dt; continue; }
    g.x += g.dir * g.speed * dt;
    if (!g.reversed) {
      for (k = 0; k < this.candles.length; k++) {
        var c = this.candles[k];
        if (!c.active || c.broken || g.hit[k]) continue;
        if (c.sham && this.sham.out) continue;
        var passed = g.dir > 0 ? (g.x >= c.x) : (g.x <= c.x);
        if (!passed) continue;
        g.hit[k] = true;
        if (!c.lit) continue;
        /* wind always costs oil, blown out or not */
        c.oil = Math.max(0, c.oil - T.gustOil);
        /* a flame can only be blown out by a LATER wave than the one that set
           it sputtering - otherwise twin gusts wipe the whole menorah at once -
           and no single wave may take more than two lights */
        var alreadySputtering = c.gutter > 0 && c.gutterWave !== g.wave;
        if (alreadySputtering && this.waveKills < 2) {
          this.waveKills++;
          c.lit = false; c.dark = 0; c.gutter = 0;
          if (!c.sham) this.cleanNight = false;
          this.breakCombo();
          Sound.sfx('bad'); Haptics.double();
          FX.shake(9, 0.28);
          FX.burst(c.x, c.y - 24, { n: 12, color: '#8e99b5', spdMax: 170, grav: -50 });
          FX.text(c.x, c.y - 76, 'BLOWN OUT', C.red, 26);
        } else {
          c.gutter = T.gutter;
          c.gutterMax = T.gutter;
          c.gutterWave = g.wave;
          Sound.sfx('whoosh');
          Haptics.light();
          FX.text(c.x, c.y - 76, 'SPUTTERING - POUR!', C.gold, 24);
          this.introduce('sputter', 'A sputtering flame dies on its own - pour fresh oil in to steady it.', 'oil', C.gold);
        }
      }
    }
    if (g.x < -300 || g.x > CFG.W + 300) this.gusts.splice(i, 1);
  }
};

/* Swipe against the wind: reverses the gust and sends it back out. */
MenorahKeeper.prototype.trySwipeBack = function (dir, x, y) {
  if (y < MenorahKeeper.BAND_TOP || y > MenorahKeeper.BAND_BOT) return false;
  var live = [], i;
  for (i = 0; i < this.gusts.length; i++) {
    if (!this.gusts[i].reversed && this.gusts[i].warn <= 0) live.push(this.gusts[i]);
  }
  if (!live.length) return false;
  for (i = 0; i < live.length; i++) {
    if (live[i].need !== dir) continue;
    var g = live[i];
    g.strength--;
    if (g.strength > 0) {
      /* a hard gust only slows on the first push - swipe again */
      g.speed *= 0.5;
      this.handSweep = { dir: dir, t: 0.5, y: 690 + g.lane * 70 };
      this.addScore(30, CFG.W / 2, 620, 'AGAIN!', C.blue);
      Sound.sfx('whoosh'); Haptics.light();
      return true;
    }
    g.reversed = true;
    g.dir = -g.dir;
    g.speed *= 1.45;
    this.handSweep = { dir: dir, t: 0.5, y: 690 + g.lane * 70 };
    this.blocks++;
    Profile.noteBest('blocks', this.blocks);
    if (this.blocks >= 10) this.award('b_shield');
    this.addScore(70, CFG.W / 2, 620, 'WINDOW CLOSED! +70', C.teal);
    this.hitCombo();
    Sound.sfx('shield'); Haptics.medium();
    FX.ring(g.x, 690 + g.lane * 70, C.teal, 60);
    FX.flash('rgba(120,200,255,.5)', 0.18);
    return true;
  }
  /* right band, wrong way */
  this.handSweep = { dir: dir, t: 0.35, y: 690, wrong: true };
  this.say('Wrong way - swipe ' + (live[0].need === 'left' ? 'RIGHT to LEFT' : 'LEFT to RIGHT'));
  Sound.sfx('back');
  return false;
};

/* -------------------------------------------------- boys and the jelly */
MenorahKeeper.prototype.globSlotY = function (c, k) { return c.y - 152 - k * 76; };

MenorahKeeper.prototype.updateBoys = function (dt, T) {
  var i;
  this.boyTimer -= dt;
  if (this.boyTimer <= 0) {
    this.boyTimer = T.boyEvery + rand(-2, 3);
    var pool = this.liveCandles().filter(function (c) { return c.jelly.length < 3; });
    if (pool.length) {
      var target = pick(pool);
      var dir = chance(0.5) ? 1 : -1;
      this.boys.push({
        ch: (this.boyCycle++) % MenorahKeeper.BOYS.length,
        dir: dir,
        x: dir > 0 ? -110 : CFG.W + 110,
        y: rand(MenorahKeeper.GLASS_TOP + 90, 540),
        speed: rand(250, 330) + this.night * 8,
        target: target, state: 'run', squirt: 0, phase: rand(0, TAU), squeeze: 0
      });
      Sound.sfx('tap');
    }
  }
  for (i = this.boys.length - 1; i >= 0; i--) {
    var b = this.boys[i];
    b.phase += dt * 12;
    if (b.squeeze > 0) b.squeeze -= dt * 2.4;
    if (b.state === 'run') {
      b.x += b.dir * b.speed * dt;
      var reached = b.dir > 0 ? (b.x >= b.target.x) : (b.x <= b.target.x);
      if (reached) { b.state = 'squirt'; b.squirt = 0.42; b.squeeze = 1; }
    } else if (b.state === 'squirt') {
      b.squirt -= dt;
      if (b.squirt <= 0.24 && !b.fired) {
        b.fired = true;
        var k = b.target.jelly.length;
        this.shots.push({
          x: b.x + b.dir * 54, y: b.y + 6,
          tx: b.target.x + rand(-12, 12), ty: this.globSlotY(b.target, k),
          t: 0, dur: 0.42, col: b.target
        });
        Sound.sfx('splat');
      }
      if (b.squirt <= 0) b.state = 'exit';
    } else {
      b.x += b.dir * b.speed * 1.25 * dt;
      if (b.x < -180 || b.x > CFG.W + 180) this.boys.splice(i, 1);
    }
  }
  for (i = this.shots.length - 1; i >= 0; i--) {
    var s = this.shots[i];
    s.t += dt;
    if (s.t >= s.dur) {
      this.shots.splice(i, 1);
      var c = s.col;
      if (c.jelly.length >= 3 || c.broken) continue;
      var idx = c.jelly.length;
      c.jelly.push({
        x: s.tx, y: this.globSlotY(c, idx) - 40, ty: this.globSlotY(c, idx),
        r: this.colWidth() * rand(0.34, 0.44), wipe: 1, born: 0,
        blobs: (function () { var a = []; for (var q = 0; q < 5; q++) a.push({ a: rand(0, TAU), d: rand(0.3, 0.68), s: rand(0.22, 0.36) }); return a; })()
      });
      Sound.sfx('splat');
      Haptics.medium();
      FX.burst(s.tx, this.globSlotY(c, idx), { n: 10, color: '#d4304f', spdMax: 180 });
      FX.text(s.tx, this.globSlotY(c, idx) - 58, 'DONUT JELLY ON THE WINDOW!', '#ef5a78', 26);
      FX.shake(5, 0.18);
    }
  }
};

MenorahKeeper.prototype.updateJelly = function (dt) {
  for (var i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (!c.active) continue;
    for (var k = c.jelly.length - 1; k >= 0; k--) {
      var g = c.jelly[k];
      g.born += dt;
      g.ty = this.globSlotY(c, k);
      g.y = lerp(g.y, g.ty, clamp(dt * 9, 0, 1));
      if (g.wipe <= 0) {
        c.jelly.splice(k, 1);
        this.wipes++;
        if (this.wipes >= 15) this.award('b_clean');
        this.addScore(25, g.x, g.y, '+25', C.cream);
        Sound.sfx('whoosh'); Haptics.light();
        FX.burst(g.x, g.y, { n: 12, color: '#c8324f', spdMax: 200 });
      }
    }
    if (c.jelly.length >= 3 && c.dripT <= 0 && c.lit && !c.broken) {
      c.dripT = 0.8;
      Sound.sfx('bad');
      FX.text(c.x, c.y - 120, 'THE JELLY IS DRIPPING!', C.red, 26);
    }
    if (c.dripT > 0) {
      c.dripT -= dt;
      if (c.dripT <= 0) {
        c.jelly.length = 0;
        if (c.lit && !c.broken) {
          c.lit = false; c.dark = 0; c.gutter = 0;
          if (!c.sham) { this.doused++; this.cleanNight = false; }
          this.breakCombo();
          Sound.sfx('hurt'); Haptics.fail();
          FX.shake(14, 0.35);
          FX.burst(c.x, c.y - 20, { n: 20, color: '#c8324f', spdMax: 240 });
          FX.text(c.x, c.y - 76, 'DOUSED BY JELLY', C.red, 26);
        }
      }
    }
  }
};

/* ---------------------------------------------- latkes and grease fires */
MenorahKeeper.prototype.updateLatkes = function (dt, T) {
  var i;
  this.latkeTimer -= dt;
  if (this.latkeTimer <= 0) {
    this.latkeTimer = T.latkeEvery + rand(-2, 4);
    var pool = this.liveCandles().filter(function (c) { return !c.latke; });
    if (pool.length) {
      var target = pick(pool);
      var side = chance(0.5) ? -1 : 1;
      this.flyingLatkes.push({
        x: side < 0 ? -70 : CFG.W + 70, y: rand(380, 560),
        tx: target.x, ty: target.y + 8,
        t: 0, dur: 0.72, rot: 0, spin: rand(-7, 7),
        big: this.night >= T.bigLatkeFrom && chance(0.35),
        target: target
      });
      Sound.sfx('whoosh');
      Haptics.light();
      var fl = this.flyingLatkes[this.flyingLatkes.length - 1];
      FX.text(fl.x < 0 ? 150 : CFG.W - 150, fl.y - 60, 'FLYING LATKE!', '#ffb04a', 32);
    }
  }
  for (i = this.flyingLatkes.length - 1; i >= 0; i--) {
    var f = this.flyingLatkes[i];
    f.t += dt;
    f.rot += f.spin * dt;
    if (f.t >= f.dur) {
      this.flyingLatkes.splice(i, 1);
      var c = f.target;
      if (!c.active || c.broken || c.latke) continue;
      c.latke = { stuck: f.big ? 2.2 : 1, max: f.big ? 2.2 : 1, heat: 0, wob: rand(0, TAU), big: f.big };
      Sound.sfx('bad'); Haptics.double();
      FX.shake(8, 0.25);
      FX.burst(c.x, c.y, { n: 16, color: '#e8a03c', spdMax: 220 });
      FX.text(c.x, c.y - 96, 'GREASE FIRE!', '#ff8a3d', 26);
      this.say('Swipe the latke off before the glass cracks');
    }
  }
  for (i = 0; i < this.candles.length; i++) {
    var cc = this.candles[i];
    if (!cc.active || !cc.latke || cc.broken) continue;
    var L = cc.latke;
    L.wob += dt * 4;
    L.heat += dt / T.crackTime;
    if (Math.random() < dt * 14) {
      FX.burst(cc.x + rand(-22, 22), cc.y - 6, { n: 1, color: pick(['#ff8a3d', '#ffcf5c', '#ff5b5b']), spdMax: 90, grav: -130, lifeMax: 0.7, rMax: 5 });
    }
    if (L.heat >= 1) {
      cc.latke = null;
      this.crackCup(cc);
      if (this.lives <= 0) return;
    }
  }
};

MenorahKeeper.prototype.crackCup = function (c) {
  c.broken = 1;
  c.lit = false;
  c.oil = 0;
  c.dark = 0;
  c.jelly.length = 0;
  this.cracked++;
  this.breakCombo();
  var jug = this.jugFor(c.i);
  if (jug) { jug.fill = 0; jug.cool = 0; }
  Sound.sfx('hurt'); Haptics.fail();
  FX.shake(20, 0.5);
  FX.burst(c.x, c.y + 14, { n: 26, color: '#bcd6f0', spdMax: 320, shape: 'square', rMax: 6 });
  if (c.sham) {
    /* the shamash is not one of the lights: no life lost, no clean night
       spoiled - you have simply lost the flame you relight the others from */
    FX.text(c.x, c.y - 80, 'SHAMASH CUP CRACKED', C.gold, 26);
    this.say('No relighting from it tonight - what counts is the lights still burning');
    return;
  }
  this.cleanNight = false;
  FX.flash(C.red, 0.35);
  FX.text(c.x, c.y - 80, 'THE GLASS CRACKED', C.red, 28);
  this.say('That light is gone for the rest of the night');
  this.damage('A cup cracked from the heat', c.x, c.y - 120);
};

MenorahKeeper.prototype.flingLatke = function (c) {
  var L = c.latke;
  if (!L) return;
  c.latke = null;
  this.latkesOff++;
  if (this.latkesOff >= 10) this.award('b_latke');
  var pts = L.big ? 90 : 55;
  this.addScore(pts, c.x, c.y - 60, 'FIRE OUT +' + pts, C.teal);
  this.hitCombo();
  Sound.sfx('slice'); Haptics.medium();
  FX.burst(c.x, c.y, { n: 18, color: '#e8a03c', spdMax: 300 });
  FX.ring(c.x, c.y, C.teal, 40);
};

/* ------------------------------------------- the cat that stalks the oil */
/* the cat prowls along the windowsill, in front of the menorah base */
MenorahKeeper.prototype.catY = function () { return MenorahKeeper.BASE_Y + 8; };

MenorahKeeper.prototype.updateCats = function (dt, T) {
  var i;
  if (this.night < T.catFrom) return;
  this.catTimer -= dt;
  if (this.catTimer <= 0 && !this.cats.length && this.jugs.length > 1) {
    this.catTimer = T.catEvery + rand(-2, 4);
    var dir = chance(0.5) ? 1 : -1;
    this.cats.push({
      dir: dir, x: dir > 0 ? -90 : CFG.W + 90, y: this.catY(),
      speed: 74 + this.night * 7, state: 'creep', phase: rand(0, TAU),
      target: pick(this.jugs)
    });
    this.introduce('cat', 'The cat is after the oil jugs - swipe it away.', 'dreidel', C.purple);
    Sound.sfx('back');
  }
  for (i = this.cats.length - 1; i >= 0; i--) {
    var c = this.cats[i];
    c.phase += dt * 7;
    c.y = this.catY();
    if (c.state === 'flee') {
      c.x += c.dir * c.speed * 3 * dt;
      if (c.x < -160 || c.x > CFG.W + 160) this.cats.splice(i, 1);
      continue;
    }
    c.x += c.dir * c.speed * dt;
    var reached = c.dir > 0 ? (c.x >= c.target.x) : (c.x <= c.target.x);
    if (reached) {
      /* knocks its target jug and the one beside it */
      var idx = this.jugs.indexOf(c.target);
      var hit = [this.jugs[idx], this.jugs[idx + (c.dir > 0 ? 1 : -1)] || this.jugs[idx - (c.dir > 0 ? 1 : -1)]];
      for (var k = 0; k < hit.length; k++) {
        var j = hit[k];
        if (!j || this.candles[j.ci].broken) continue;
        j.spill = 5; j.fill = 0; j.cool = 0;
        FX.burst(j.x, this.jugY(), { n: 14, color: '#c79a3d', spdMax: 220 });
      }
      this.cats.splice(i, 1);
      this.breakCombo();
      Sound.sfx('hurt'); Haptics.double();
      FX.shake(12, 0.3);
      for (var pw = 0; pw < 10; pw++) {
        FX.burst(c.target.x + rand(-40, 40), lerp(this.catY(), this.jugY(), pw / 10),
          { n: 1, color: '#c79a3d', spdMax: 120, lifeMax: 0.5 });
      }
      FX.text(c.target.x, this.jugY() - 110, 'THE CAT GOT THE OIL', C.red, 24);
      continue;
    }
    if (c.x < -200 || c.x > CFG.W + 200) this.cats.splice(i, 1);
  }
};

MenorahKeeper.prototype.shooCat = function (cat) {
  cat.state = 'flee';
  cat.dir = -cat.dir;
  this.shooed++;
  this.addScore(60, cat.x, cat.y - 60, 'SHOOED +60', C.purple);
  this.hitCombo();
  Sound.sfx('whoosh'); Haptics.light();
  FX.burst(cat.x, cat.y, { n: 12, color: C.purple, spdMax: 240 });
};

/* -------------------------------------------- moths that dive at a flame */
MenorahKeeper.prototype.updateMoths = function (dt, T) {
  var i;
  if (this.night < T.mothFrom) return;
  this.mothTimer -= dt;
  if (this.mothTimer <= 0) {
    this.mothTimer = T.mothEvery + rand(-1.5, 3);
    var pool = this.liveCandles().filter(function (c) { return c.lit; });
    if (pool.length) {
      var side = chance(0.5) ? -1 : 1;
      this.moths.push({
        x: side < 0 ? -40 : CFG.W + 40, y: rand(360, 680),
        target: pick(pool), phase: rand(0, TAU), sp: T.mothSpeed
      });
      this.introduce('moth', 'Moths are diving for the flames - tap them out of the air.', 'bug', '#cfd8e8');
    }
  }
  for (i = this.moths.length - 1; i >= 0; i--) {
    var m = this.moths[i];
    m.phase += dt * 16;
    var tc = m.target;
    if (!tc || !tc.lit || tc.broken) {
      var pool2 = this.liveCandles().filter(function (c) { return c.lit; });
      if (!pool2.length) { this.moths.splice(i, 1); continue; }
      m.target = pick(pool2);
      tc = m.target;
    }
    var tx = tc.x, ty = tc.y - 24;
    var dx = tx - m.x, dy = ty - m.y;
    var d = Math.max(1, Math.hypot(dx, dy));
    /* fluttering, not a straight line */
    var px = -dy / d, py = dx / d;
    var flut = Math.sin(m.phase) * 46;
    m.x += (dx / d * m.sp + px * flut) * dt;
    m.y += (dy / d * m.sp + py * flut) * dt;
    if (d < 28) {
      this.moths.splice(i, 1);
      if (!tc.lit) continue;
      if (tc.gutter > 0) {
        tc.lit = false; tc.dark = 0; tc.gutter = 0;
        if (!tc.sham) this.cleanNight = false;
        this.breakCombo();
        Sound.sfx('bad'); Haptics.double();
        FX.burst(tc.x, tc.y - 24, { n: 12, color: '#8e99b5', spdMax: 170, grav: -50 });
        FX.text(tc.x, tc.y - 76, 'MOTH PUT IT OUT', C.red, 24);
      } else {
        tc.gutter = T.gutter;
        tc.gutterMax = T.gutter;
        tc.gutterWave = -1;
        Sound.sfx('whoosh');
        FX.text(tc.x, tc.y - 76, 'SPUTTERING - POUR!', C.gold, 24);
        this.introduce('sputter', 'A sputtering flame dies on its own - pour fresh oil in to steady it.', 'oil', C.gold);
      }
      FX.burst(tc.x, tc.y - 24, { n: 8, color: '#cfd8e8', spdMax: 140 });
    }
  }
};

/* ------------------------------------------------------------ dreidels */
MenorahKeeper.prototype.updateDreidels = function (dt, T) {
  this.dreidelTimer -= dt;
  if (this.dreidelTimer <= 0 && this.jugs.length) {
    this.dreidelTimer = T.dreidEvery + rand(0, 3);
    var side = chance(0.5) ? -1 : 1;
    this.dreidels.push({
      x: side < 0 ? -50 : CFG.W + 50, y: rand(980, 1080),
      vx: side < 0 ? rand(120, 190) : -rand(120, 190),
      vy: rand(-210, -130), spin: rand(6, 14), rot: 0, r: 34,
      target: pick(this.jugs),
      letter: pick(['נ', 'ג', 'ה', 'ש'])
    });
  }
  var floor = 1210 - View.safe.b;
  for (var i = this.dreidels.length - 1; i >= 0; i--) {
    var d = this.dreidels[i];
    d.rot += d.spin * dt;
    d.vy += 900 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.y > floor) { d.y = floor; d.vy = -Math.abs(d.vy) * 0.72 - 120; }
    if (d.x < -90 || d.x > CFG.W + 90) { this.dreidels.splice(i, 1); continue; }
    if (d.target && d.target.spill <= 0 && !this.candles[d.target.ci].broken &&
        distance(d.x, d.y, d.target.x, this.jugY()) < 58) {
      d.target.spill = 3.5; d.target.fill = 0; d.target.cool = 0;
      this.dreidels.splice(i, 1);
      Sound.sfx('bad'); Haptics.double();
      FX.burst(d.target.x, this.jugY(), { n: 14, color: '#c79a3d', spdMax: 220 });
      FX.text(d.target.x, this.jugY() - 80, 'OIL SPILLED', C.red, 24);
      this.breakCombo();
    }
  }
};

/* ---------------------------------------- night complete + halachic grade */
MenorahKeeper.prototype.gradeNight = function () {
  var lights = this.candles.filter(function (c) { return c.active && !c.sham; });
  var burning = lights.filter(function (c) { return c.lit && !c.broken; }).length;
  var total = lights.length;
  if (burning === total) return { key: 'mehadrin', name: 'KOSHER L\'MEHADRIN', mult: 1,
    note: 'Every light still burning - the way almost every family keeps Chanukah.', color: C.gold, burning: burning, total: total };
  if (burning >= 2) return { key: 'kosher', name: 'KOSHER', mult: 0.6,
    note: burning + ' of ' + total + ' still burning - the mitzvah was kept.', color: C.teal, burning: burning, total: total };
  if (burning === 1) return { key: 'ikkar', name: 'ME\'IKKAR HADIN', mult: 0.35,
    note: 'One light left - by the letter of the law that still fulfils the mitzvah.', color: '#ffab26', burning: burning, total: total };
  return { key: 'none', name: 'NOT FULFILLED', mult: 0,
    note: 'Every light was dark by the end of the half hour.', color: C.red, burning: 0, total: total };
};

MenorahKeeper.prototype.completeNight = function () {
  var self = this;
  /* Night 8 is graded first and only THEN turns into the Jelly-Pocalypse. A
     menorah that went dark has not been kept, and no boss fight can rescue a
     half hour that already ended with nothing burning. */
  var grade = this.gradeNight();
  this.grades[grade.key]++;
  this.lastGrade = grade;
  if (this.night >= 8) {
    if (grade.key === 'none') {
      this.lives = 0;
      this.failReason = 'Night 8 ran out with every light dark';
      FX.text(CFG.W / 2, 470, grade.name, grade.color, 44);
      Sound.sfx('lose');
      Haptics.fail();
      this.finish(this.failReason);
      return;
    }
    if (this.cleanNight) this.award('b_30min');
    this.startBoss();
    return;
  }
  /* a night that was not fulfilled is not a night you completed */
  if (grade.key !== 'none') {
    this.nightsDone++;
    Profile.noteBest('nights', this.nightsDone);
  }
  var bonus = Math.round((200 + this.night * 110) * grade.mult);
  if (grade.key === 'mehadrin') bonus += 250;
  this.score += bonus;
  Sound.sfx(grade.key === 'none' ? 'bad' : 'levelup');
  Haptics.win();
  FX.flash(grade.key === 'none' ? C.red : C.gold, 0.4);
  FX.text(CFG.W / 2, 470, grade.name, grade.color, 44);
  FX.text(CFG.W / 2, 530, 'Night ' + this.night + '  +' + bonus, C.cream, 30);
  if (grade.key !== 'none') {
    for (var i = 0; i < 36; i++) {
      FX.burst(rand(80, 640), rand(460, 880), { n: 1, color: pick([C.gold, C.flame, C.cream]), spdMax: 260 });
    }
  }
  Game.toast(grade.name + ' - ' + grade.note, 'lamp', grade.color);

  /* Not fulfilled is not a bad night, it is the end of the run. The half hour
     passed with nothing burning, and there is no partial credit for that. */
  if (grade.key === 'none') {
    this.lives = 0;
    this.failReason = 'Night ' + this.night + ' ran out with every light dark';
    Sound.sfx('lose');
    Haptics.fail();
    this.finish(this.failReason);
    return;
  }

  if (grade.key === 'mehadrin' && this.night >= 3) this.award('b_mehadrin');
  if (this.cleanNight) this.award('b_30min');
  /* you kept this night - the next one is yours to jump straight to */
  if (Profile.unlockLevel('menorah', this.night + 1) && this.night + 1 <= MenorahKeeper.NIGHTS) {
    FX.text(CFG.W / 2, 596, 'NIGHT ' + (this.night + 1) + ' UNLOCKED', C.teal, 28);
  }
  this.night++;
  this.interstitial(function () {
    self.setupNight();
    Input.clear();
    Game.setState('PLAYING');
  });
};

/* ---------------------------------------------------------------- input */
MenorahKeeper.prototype.handle = function (ev) {
  var i, c, sh = this.sham;
  if (this.boss) { this.handleBoss(ev); return; }

  if (ev.type === 'down') {
    /* Generous, but not the whole screen: a finger anywhere near the carried
       shamash picks it up, while a tap on a distant jug still pours oil rather
       than yanking the flame across the window. */
    if (sh.out && sh.returning <= 0 && distance(ev.x, ev.y + 26, sh.x, sh.y) < 150) {
      sh.held = true; sh.pointer = ev.id;
      sh.moved = false; sh.pressT = 0;
      sh.x = clamp(ev.x, 40, CFG.W - 40);
      sh.y = clamp(ev.y + 26, MenorahKeeper.GLASS_TOP, MenorahKeeper.BASE_Y);
      Haptics.light();
    }
    return;
  }

  if (ev.type === 'up') {
    /* letting go leaves it where you put it - it keeps burning down out here,
       so it is still costing you something, but the relight is not cancelled */
    if (sh.held && sh.pointer === ev.id) {
      sh.held = false; sh.pointer = null;
      /* a carry that actually went somewhere must not also register as a tap
         on the shamash, or releasing over the wick snaps it straight home */
      if (sh.moved || sh.pressT > 0.3) sh.justLifted = 0.3;
    }
    return;
  }

  if (ev.type === 'move') {
    if (sh.held && sh.pointer === ev.id) {
      if (distance(ev.x, ev.y + 26, sh.x, sh.y) > 6) sh.moved = true;
      sh.x = clamp(ev.x, 40, CFG.W - 40);
      sh.y = clamp(ev.y + 26, MenorahKeeper.GLASS_TOP, MenorahKeeper.BASE_Y);
      return;
    }
    /* shoo the cat off the shelf */
    for (i = 0; i < this.cats.length; i++) {
      var cat = this.cats[i];
      if (cat.state === 'creep' && distance(ev.x, ev.y, cat.x, cat.y) < 104) { this.shooCat(cat); return; }
    }
    /* fling a burning latke off a cup */
    for (i = 0; i < this.candles.length; i++) {
      c = this.candles[i];
      if (!c.latke) continue;
      if (distance(ev.x, ev.y, c.x, c.y + 6) < 66) {
        c.latke.stuck -= clamp(Math.hypot(ev.dx, ev.dy) / 22, 0.01, 0.3);
        if (c.latke.stuck <= 0) this.flingLatke(c);
        return;
      }
    }
    /* wipe the jelly off the glass */
    for (i = 0; i < this.candles.length; i++) {
      c = this.candles[i];
      for (var k = 0; k < c.jelly.length; k++) {
        var g = c.jelly[k];
        if (distance(ev.x, ev.y, g.x, g.y) < g.r + 10) {
          g.wipe -= clamp(Math.hypot(ev.dx, ev.dy) / 24, 0.01, 0.22);
          return;
        }
      }
    }
    return;
  }

  if (ev.type === 'swipe') {
    /* only the finger that is carrying the shamash is busy - the other hand is
       still free to shut the window on a gust */
    if (sh.held && sh.pointer === ev.id) return;
    if ((ev.dir === 'left' || ev.dir === 'right') && ev.len >= 70) {
      this.trySwipeBack(ev.dir, (ev.x + ev.x2) / 2, (ev.y + ev.y2) / 2);
    }
    return;
  }

  if (ev.type !== 'tap') return;

  /* swat a moth out of the air */
  for (i = this.moths.length - 1; i >= 0; i--) {
    var mo = this.moths[i];
    if (distance(ev.x, ev.y, mo.x, mo.y) < 52) {
      this.moths.splice(i, 1);
      this.swatted++;
      this.addScore(30, mo.x, mo.y - 20, '+30', '#cfd8e8');
      this.hitCombo();
      Sound.sfx('tap'); Haptics.light();
      FX.burst(mo.x, mo.y, { n: 8, color: '#cfd8e8', spdMax: 180 });
      return;
    }
  }

  for (i = this.dreidels.length - 1; i >= 0; i--) {
    var d = this.dreidels[i];
    if (distance(ev.x, ev.y, d.x, d.y) < d.r + 28) {
      this.dreidels.splice(i, 1);
      this.stopped++;
      if (this.stopped >= 20) this.award('b_dreidel');
      this.addScore(15, d.x, d.y - 30, '+15', C.purple);
      this.hitCombo();
      Sound.sfx('tap'); Haptics.light();
      FX.burst(d.x, d.y, { n: 10, color: C.purple, spdMax: 220 });
      return;
    }
  }

  var shc = this.shamash();
  var shHalf = Math.min(46, this.colWidth() / 2);
  var onSham = sh.out
    ? distance(ev.x, ev.y, sh.x, sh.y) < 96
    : (Math.abs(ev.x - shc.x) < shHalf && ev.y > shc.y - 100 && ev.y < shc.y + 96);
  if (onSham) {
    var isDouble = this.lastTapOnSham && (Game.time - this.lastTapT) < 0.5;
    this.lastTapT = Game.time;
    this.lastTapOnSham = true;
    if (isDouble) {
      this.lastTapOnSham = false;
      if (sh.out) { if (sh.justLifted <= 0) this.returnShamash(); }
      else this.liftShamash();
      return;
    }
    /* a single tap is enough - a hidden double tap is a gesture nobody finds */
    if (sh.out) { if (sh.justLifted > 0) return; this.returnShamash(); return; }
    if (!sh.out && shc.lit && !shc.broken) { this.liftShamash(); return; }
    if (!sh.out && shc.broken) {
      this.say('The shamash cup cracked - nothing to relight from tonight');
      Sound.sfx('back');
      return;
    }
    if (!sh.out && !shc.lit) {
      if (shc.oil > 0.05) {
        shc.lit = true; shc.dark = 0; shc.justLit = 0.8; shc.nagged = false;
        Sound.sfx('light'); Haptics.medium();
        FX.ring(shc.x, shc.y - 20, C.gold, 26);
        this.addScore(20, shc.x, shc.y - 60, 'SHAMASH LIT', C.gold);
      } else {
        this.say('The shamash needs oil - tap its jug');
        Sound.sfx('back');
      }
    }
    return;
  }
  this.lastTapOnSham = false;

  var jy = this.jugY();
  var half = this.colWidth() / 2;
  for (i = 0; i < this.jugs.length; i++) {
    var j = this.jugs[i];
    if (Math.abs(ev.x - j.x) < half && ev.y > jy - 86 && ev.y < jy + 96) {
      this.pour(this.candles[j.ci]);
      return;
    }
  }

  for (i = 0; i < this.candles.length; i++) {
    c = this.candles[i];
    if (!c.active || c.sham) continue;
    if (Math.abs(ev.x - c.x) < half && ev.y > c.y - 92 && ev.y < c.y + 86) {
      if (c.broken) { this.say('That cup cracked - it is out for the night'); Sound.sfx('back'); return; }
      if (c.latke) { this.say('Swipe the latke off - do not pour oil on a grease fire'); Sound.sfx('back'); return; }
      if (!c.lit) { this.say('Relight it from the shamash - double-tap the shamash'); Sound.sfx('back'); return; }
      this.pour(c);
      return;
    }
  }
};

MenorahKeeper.prototype.stats = function () {
  return [
    ['Nights completed', this.nightsDone],
    ['Kosher L\'Mehadrin nights', this.grades.mehadrin],
    ['Windows closed on gusts', this.blocks],
    ['Sputtering flames steadied', this.steadied],
    ['Latke fires put out', this.latkesOff],
    ['Cats shooed / moths swatted', this.shooed + ' / ' + this.swatted],
    ['Cups cracked', this.cracked],
    ['Relit from the shamash', this.relights],
    ['Sufganiyot sliced from Jelly-Zilla', this.boss ? this.boss.sliced : this.bossSliced]
  ];
};

/* --------------------------------------------------------------- render */
MenorahKeeper.prototype.render = function (ctx) {
  var t = this.elapsed, i;
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, [
    [0, '#03050c'], [0.4, '#081027'], [0.75, '#101a3c'], [1, '#1b1330']
  ]);
  Clouds.render(ctx, t, 'rgba(176,194,228,1)', 0.14);

  this.drawWindow(ctx);
  this.drawPourStreams(ctx);
  this.drawMenorah(ctx);
  for (i = 0; i < 9; i++) this.drawCandle(ctx, this.candles[i], t);
  this.drawLatkes(ctx, t);
  this.drawJugs(ctx, t);
  this.drawJelly(ctx, t);
  this.drawCats(ctx, t);
  this.drawMoths(ctx, t);
  this.drawBoys(ctx, t);
  this.drawGusts(ctx, t);
  this.drawHand(ctx);
  this.drawDreidels(ctx);
  this.drawCarriedShamash(ctx, t);
  if (this.boss) {
    if (this.boss.phase === 'fight' || this.boss.phase === 'flask') {
      ctx.save();
      ctx.fillStyle = 'rgba(6,8,20,.5)';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.restore();
    }
    this.renderBoss(ctx, t);
    return;
  }
  this.drawPrompts(ctx, t);
};

MenorahKeeper.prototype.drawWindow = function (ctx) {
  ctx.save();
  ctx.fillStyle = '#2a1c12';
  ctx.fillRect(0, 0, 22, CFG.H);
  ctx.fillRect(CFG.W - 22, 0, 22, CFG.H);
  ctx.fillStyle = '#3a2718';
  ctx.fillRect(0, MenorahKeeper.BASE_Y + 46, CFG.W, 26);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(0, MenorahKeeper.BASE_Y + 46, CFG.W, 6);
  ctx.fillStyle = 'rgba(150,205,255,.045)';
  ctx.fillRect(22, MenorahKeeper.GLASS_TOP, CFG.W - 44, MenorahKeeper.BASE_Y - MenorahKeeper.GLASS_TOP + 10);
  ctx.strokeStyle = 'rgba(170,215,255,.12)';
  ctx.lineWidth = 3;
  ctx.strokeRect(22, MenorahKeeper.GLASS_TOP, CFG.W - 44, MenorahKeeper.BASE_Y - MenorahKeeper.GLASS_TOP + 10);
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 40;
  ctx.beginPath();
  ctx.moveTo(120, MenorahKeeper.GLASS_TOP); ctx.lineTo(340, MenorahKeeper.BASE_Y);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
};

/* The jug, its light and its jelly stack all share one invisible column.
   Nothing is drawn for it - only the oil travelling up on a pour. */
MenorahKeeper.prototype.drawPourStreams = function (ctx) {
  var jy = this.jugY();
  for (var i = 0; i < this.jugs.length; i++) {
    var j = this.jugs[i];
    if (j.stream <= 0) continue;
    var c = this.candles[j.ci];
    var k = 1 - j.stream;
    ctx.save();
    ctx.globalAlpha = clamp(j.stream, 0, 1);
    ctx.fillStyle = '#f7d979';
    ctx.beginPath();
    ctx.ellipse(c.x, lerp(jy - 60, c.y + 30, easeOut(k)), 9, 22, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
};

MenorahKeeper.prototype.drawMenorah = function (ctx) {
  var cx = MenorahKeeper.CX, by = MenorahKeeper.BASE_Y;
  var cupY = MenorahKeeper.CUP_OUTER + 18;
  var i;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a6117';
  ctx.lineWidth = 15;
  for (i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cupY, i * MenorahKeeper.ARM, 38 + i * 46, 0, 0, Math.PI);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx, by + 8); ctx.lineTo(cx, MenorahKeeper.CUP_SHAM + 18);
  ctx.stroke();
  ctx.strokeStyle = '#e8bc4e';
  ctx.lineWidth = 9;
  for (i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cupY, i * MenorahKeeper.ARM, 38 + i * 46, 0, 0, Math.PI);
    ctx.stroke();
  }
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(cx, by + 8); ctx.lineTo(cx, MenorahKeeper.CUP_SHAM + 18);
  ctx.stroke();
  ctx.fillStyle = '#e8bc4e';
  for (i = 1; i <= 4; i++) {
    ctx.beginPath(); ctx.arc(cx, cupY + 38 + i * 46, 9, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#c99a31';
  Draw.rr(ctx, cx - 88, by + 4, 176, 24, 11); ctx.fill();
  Draw.rr(ctx, cx - 122, by + 26, 244, 22, 11); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  Draw.rr(ctx, cx - 84, by + 7, 168, 7, 4); ctx.fill();
  ctx.restore();
};

MenorahKeeper.prototype.drawCup = function (ctx, x, y, cw, oil) {
  var chh = 58;
  Draw.rr(ctx, x - cw / 2, y - 10, cw, chh, 8);
  ctx.fillStyle = 'rgba(210,235,255,.16)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(220,240,255,.5)';
  ctx.stroke();
  if (oil > 0.001) {
    ctx.save();
    Draw.rr(ctx, x - cw / 2, y - 10, cw, chh, 8); ctx.clip();
    var oh = (chh - 8) * oil;
    var og = ctx.createLinearGradient(0, y + chh - 10 - oh, 0, y + chh - 10);
    og.addColorStop(0, '#f7d979');
    og.addColorStop(1, '#c98f20');
    ctx.fillStyle = og;
    ctx.fillRect(x - cw / 2, y + chh - 10 - oh, cw, oh);
    ctx.restore();
  }
};

MenorahKeeper.prototype.drawBrokenCup = function (ctx, c, cw) {
  ctx.save();
  ctx.globalAlpha = 0.75;
  Draw.rr(ctx, c.x - cw / 2, c.y - 10, cw, 58, 8);
  ctx.fillStyle = 'rgba(120,132,152,.18)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(180,196,220,.55)';
  ctx.stroke();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = 'rgba(226,240,255,.85)';
  var seeds = [[-0.4, 0.1], [0.15, -0.2], [0.3, 0.35]];
  for (var s = 0; s < seeds.length; s++) {
    var sx = c.x + seeds[s][0] * cw, sy = c.y + 18 + seeds[s][1] * 40;
    ctx.beginPath();
    ctx.moveTo(sx, c.y - 8);
    ctx.lineTo(sx + 6, sy);
    ctx.lineTo(sx - 5, sy + 12);
    ctx.lineTo(sx + 3, c.y + 46);
    ctx.stroke();
  }
  ctx.restore();
  Draw.text(ctx, 'CRACKED', c.x, c.y - 44, {
    size: 15, color: 'rgba(200,214,236,.85)', align: 'center', weight: '900',
    stroke: 'rgba(0,0,0,.6)', strokeW: 4
  });
};

MenorahKeeper.prototype.drawCandle = function (ctx, c, t) {
  var carried = c.sham && this.sham.out;
  var cw = c.sham ? 54 : 48;
  if (c.broken) { this.drawBrokenCup(ctx, c, cw); return; }
  ctx.save();
  if (!c.active) ctx.globalAlpha = 0.26;
  if (carried) ctx.globalAlpha = 0.35;
  this.drawCup(ctx, c.x, c.y, cw, carried ? 0 : c.oil);
  ctx.strokeStyle = c.lit ? '#3a2a16' : '#59564f';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - 4); ctx.lineTo(c.x, c.y - 22);
  ctx.stroke();
  ctx.restore();
  if (!c.active || carried) return;

  var sput = c.gutter > 0;
  if (c.lit) {
    var size = c.sham ? 17 : 15;
    if (sput) size *= 0.55 + 0.18 * Math.sin(t * 22 + c.i);
    Draw.flame(ctx, c.x, c.y - 24, size, t + c.flick, true);
    if (sput) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * pulse(t, 3);
      ctx.fillStyle = '#9aa8c4';
      for (var s = 0; s < 3; s++) {
        ctx.beginPath();
        ctx.arc(c.x + Math.sin(t * 2 + s) * 8, c.y - 58 - s * 20, 7 - s * 1.6, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      /* the countdown you are racing: pour before this ring empties */
      var left = clamp(c.gutter / Math.max(0.001, c.gutterMax), 0, 1);
      ctx.save();
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath(); ctx.arc(c.x, c.y - 24, 31, 0, TAU); ctx.stroke();
      ctx.strokeStyle = left < 0.35 ? C.red : '#ffab26';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(c.x, c.y - 24, 31, -Math.PI / 2, -Math.PI / 2 + left * TAU);
      ctx.stroke();
      ctx.restore();
      /* a compact marker - a word over every flame turns into noise at night 8 */
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * pulse(t, 2.4);
      ctx.fillStyle = '#ffab26';
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - 96);
