<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sukkah Architect</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0e14; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    display: block; background: #0b0e14;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
/* ==========================================================================
   SUKKAH ARCHITECT
   Single self-contained Canvas2D file, no CDN, no build step, no fonts to
   fetch. Runs offline from a file:// URL, in a plain browser, or hosted in
   the Mitz Mode Play tab (window.MITZ_MODE / MITZ_LANG / MITZ_NUSACH).
   No sun, moon, or star imagery anywhere - shade is shown as a floor
   coverage map, never a drawn light source. See HALACHA.md for the sourced
   halacha every rule in this file implements.
   ========================================================================== */
var SA = {};
SA.VERSION = '1.0.0';
</script>
<script>
/* ---------------------------------------------- 1. HOST + CONFIG + MEASURE */
SA.Host = {
  inApp: function () { return window.MITZ_MODE === true; },
  langFromHost: function () {
    var v = window.MITZ_LANG;
    if (v == null) return '';
    var s = String(v).trim().toLowerCase();
    return (s === 'he' || s === 'iw' || s.indexOf('he-') === 0) ? 'he' : 'en';
  }
};

/* Grid unit = 1 tefach. Two shiurim on offer for the on-screen ruler only;
   every game threshold below is in whole tefachim/amos and never changes
   with the shiur toggle. See HALACHA.md section 4. */
SA.Shiur = {
  NAEH: { id: 'naeh', tefachCm: 8, label: 'Rav Chaim Naeh' },
  CHAZON_ISH: { id: 'chazonish', tefachCm: 9.6, label: 'Chazon Ish' },
  current: 'naeh',
  cm: function (tefachim) {
    var s = SA.Shiur.current === 'chazonish' ? SA.Shiur.CHAZON_ISH : SA.Shiur.NAEH;
    return Math.round(tefachim * s.tefachCm * 10) / 10;
  }
};

/* All thresholds are halacha l'Moshe miSinai / Shulchan Aruch measures in
   tefachim (amos expressed as tefachim*6). See HALACHA.md section 6. */
SA.Rule = {
  WALL_MIN_HEIGHT: 10,          // OC 633:8
  WALL_MIN_FULL_LEN: 7,         // OC 634:1 / 630:2
  THIRD_WALL_PERP: 1,           // OC 630:2 (afilu tefach, rendered as 2 to read as "just over")
  THIRD_WALL_PARALLEL: 5,       // OC 630:3 (just over 4 tefachim)
  LAVUD: 3,                     // OC 630:1,10 - strictly LESS than this bridges
  GROUND_GAP_MAX: 3,            // OC 630:9-10
  FLOOR_MIN: 7,                 // OC 634:1
  FLOOR_MAX: 28,                // sandbox cap, not a halachic ceiling
  ROOF_MIN: 10,                 // OC 633:8
  ROOF_MAX_KOSHER: 120,         // 20 amos * 6 tefachim - OC 633:1
  ROOF_MAX_SLIDER: 130,
  DOFEN_AKUMAH_AMOS: 4 * 6,     // OC 632:1 - pasul schach AT a wall
  PASUL_MIDDLE: 4,              // OC 632:1 - pasul schach in the middle
  AVIR: 3,                      // OC 632:2 - open air, anywhere
  SMALL_SUKKAH_AREA: 49,        // 7x7, OC 632:1
  GEZEIRAS_TIKRAH_WIDTH: 4,     // OC 629:18
  DECOR_CLEARANCE: 4,           // OC 627:4
  DECOR_WIDE: 4,                // OC 627:4 / MB 627:12
  OPENING_TZURAS_HAPESACH: 60,  // 10 amos, OC 630:5 - unreachable at FLOOR_MAX=28, kept for completeness
  SHADE_MIN: 0.5                // OC 631:1 - strictly greater than half
};

/* ---------------------------------------------- 1b. CANVAS / DPR / LOOP */
SA.View = {
  canvas: null, ctx: null,
  w: 0, h: 0, dpr: 1,
  safe: { t: 0, r: 0, b: 0, l: 0 }
};

SA.View.resize = function () {
  var c = SA.View.canvas;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var w = window.innerWidth, h = window.innerHeight;
  SA.View.w = w; SA.View.h = h; SA.View.dpr = dpr;
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  c.style.width = w + 'px';
  c.style.height = h + 'px';
  SA.View.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var ss = (window.visualViewport && window.visualViewport.__saInsets) || null;
  SA.View.safe.t = 12; SA.View.safe.b = 12; SA.View.safe.l = 8; SA.View.safe.r = 8;
};

SA.Loop = {
  running: false, last: 0, acc: 0, step: 1000 / 60,
  update: function () {}, render: function () {},
  frame: function (t) {
    if (!SA.Loop.running) return;
    if (!SA.Loop.last) SA.Loop.last = t;
    var dt = Math.min(t - SA.Loop.last, 250);
    SA.Loop.last = t;
    SA.Loop.acc += dt;
    var guard = 0;
    while (SA.Loop.acc >= SA.Loop.step && guard < 6) {
      SA.Loop.update(SA.Loop.step / 1000);
      SA.Loop.acc -= SA.Loop.step;
      guard++;
    }
    SA.Loop.render();
    requestAnimationFrame(SA.Loop.frame);
  },
  start: function () {
    if (SA.Loop.running) return;
    SA.Loop.running = true;
    SA.Loop.last = 0;
    requestAnimationFrame(SA.Loop.frame);
  },
  pause: function () { SA.Loop.running = false; }
};

SA.boot = function () {
  SA.View.canvas = document.getElementById('stage');
  SA.View.ctx = SA.View.canvas.getContext('2d', { alpha: false });
  SA.View.resize();
  window.addEventListener('resize', SA.View.resize);
  window.addEventListener('orientationchange', SA.View.resize);
};
</script>
<script>
/* ---------------------------------------------- 2. LANGUAGE (en + he) */
/* Every user-facing string goes through Lang.t. English is the key, exactly
   as in mitzvah-dash.html. Catalogs with combinatorial names (wall
   materials: family x form x finish) are not given one dictionary line per
   combo - instead each *token* (family, form, finish, color) is hand
   translated once with a grammatical gender tag, and Lang.composeHe()
   assembles the Hebrew phrase. That is still 100% hand-written Hebrew, just
   assembled from parts instead of duplicated hundreds of times. Every fixed
   string (UI, cards, backgrounds, schach, animals, decorations, levels) gets
   its own direct entry. qa.js scans that both mechanisms cover every string
   actually shown on screen. */
SA.Lang = {
  id: 'en',
  lockedFromHost: false,
  he: {},
  add: function (dict) { for (var k in dict) SA.Lang.he[k] = dict[k]; },
  parse: function (v) { return v === 'he' ? 'he' : 'en'; },
  boot: function () {
    var fromHost = SA.Host.langFromHost();
    if (SA.Host.inApp() && fromHost) {
      SA.Lang.lockedFromHost = true;
      SA.Lang.id = fromHost;
      return fromHost;
    }
    try {
      var saved = localStorage.getItem('sukkah_architect.lang');
      if (saved) SA.Lang.id = SA.Lang.parse(saved);
    } catch (e) {}
    return SA.Lang.id;
  },
  locked: function () { return SA.Lang.lockedFromHost && SA.Host.inApp(); },
  set: function (id) {
    if (SA.Lang.locked()) return SA.Lang.id;
    SA.Lang.id = SA.Lang.parse(id);
    try { localStorage.setItem('sukkah_architect.lang', SA.Lang.id); } catch (e) {}
    document.documentElement.lang = SA.Lang.id;
    return SA.Lang.id;
  },
  isHe: function () { return SA.Lang.id === 'he'; },
  t: function (s) {
    if (!SA.Lang.isHe()) return s;
    var v = SA.Lang.he[s];
    return v == null ? s : v;
  },
  hasHebrew: function (s) { return /[\u0590-\u05FF]/.test(String(s)); },
  /* Translate a {placeholder} template, then fill it in - so a dynamic
     number never has to be baked into the dictionary key (matches the
     existing {place}/${...} template convention). */
  fmt: function (template, vars) {
    var out = SA.Lang.t(template);
    for (var k in vars) out = out.split('{' + k + '}').join(String(vars[k]));
    return out;
  }
};

/* Token dictionaries for the combinatorial wall-material catalog (p05).
   gender: 'm' | 'f', used to pick the matching finish adjective form. */
SA.Lang.familyWords = {};   // filled in p05 alongside the family catalog
SA.Lang.formWords = {};     // filled in p05
SA.Lang.finishWords = {};   // filled in p05

SA.Lang.composeMaterialName = function (family, form, finish) {
  if (!SA.Lang.isHe()) return finish.en + ' ' + family.en + ' ' + form.en;
  var adj = family.gender === 'f' ? finish.he_f : finish.he_m;
  return form.he + ' ' + family.he + ' ' + adj;
};

/* ---------------------------------------------- 2a. Core UI vocabulary */
SA.Lang.add({
  'SUKKAH ARCHITECT': 'אדריכל הסוכה',
  'Design a kosher sukkah, piece by piece.': 'תכננו סוכה כשרה, חלק אחר חלק.',
  'Sandbox': 'מגרש חופשי',
  'Halacha Challenges': 'משימות הלכה',
  'Continue Building': 'המשך בנייה',
  'New Sukkah': 'סוכה חדשה',
  'Choose a Site': 'בחרו מקום',
  'Choose Materials': 'בחרו חומרים',
  'PLAY': 'שחק',
  'BACK': 'חזרה',
  'BACK TO MENU': 'לתפריט',
  'MENU': 'תפריט',
  'PAUSED': 'הפסקה',
  'RESUME': 'המשך',
  'MORE GAMES': 'עוד משחקים',
  'HOW TO BUILD': 'איך בונים',
  'Share': 'שיתוף',
  'Share your Sukkah': 'שתפו את הסוכה שלכם',
  'Cards': 'כרטיסי הלכה',
  'Halacha Cards': 'כרטיסי הלכה',
  'Locked': 'נעול',
  'Unlocked!': 'נפתח!',
  'Level': 'שלב',
  'Next Level': 'השלב הבא',
  'Level Complete': 'השלב הושלם',
  'Try Again': 'ננסה שוב',
  'Skip': 'דלג',
  'Read the Card': 'קראו את הכרטיס',
  'Continue': 'המשך',

  'Walls': 'קירות',
  'Schach': 'סכך',
  'Decorations': 'קישוטים',
  'Front Wall': 'קיר קדמי',
  'Back Wall': 'קיר אחורי',
  'Left Wall': 'קיר שמאלי',
  'Right Wall': 'קיר ימני',
  'FILL WALL': 'מלאו קיר',
  'ERASE': 'מחיקה',
  'Eraser': 'מחק',
  'Tie Down': 'קשרו',
  'Untie': 'שחררו',
  'Tied': 'קשור',
  'Untied': 'לא קשור',
  'Alive': 'עומד',
  'Fallen': 'שוכב',
  'Footprint': 'שטח הסוכה',
  'Width': 'רוחב',
  'Depth': 'עומק',
  'Roof Height': 'גובה הסכך',
  'Rotate': 'סבבו',
  'Zoom In': 'התקרבו',
  'Zoom Out': 'התרחקו',
  'Step Inside': 'היכנסו לסוכה',
  'Step Outside': 'צאו מהסוכה',

  'KOSHER': 'כָּשֵׁר',
  'NOT KOSHER YET': 'עדיין לא כשר',
  'PASUL': 'פָּסוּל',
  'Shade': 'צל',
  'Sun': 'שמש',
  'Issues': 'הערות',
  'Measurements': 'מידות',
  'Diagnostic Overlay': 'שכבת בדיקה',
  'Show Overlay': 'הצג שכבת בדיקה',
  'Hide Overlay': 'הסתר שכבת בדיקה',
  'Tefachim': 'טפחים',
  'Amos': 'אמות',
  'Shiur': 'שיעור',

  'New material unlocked:': 'חומר חדש נפתח:',
  'New site unlocked:': 'מקום חדש נפתח:',
  'New decoration unlocked:': 'קישוט חדש נפתח:',
  'Goal': 'המשימה',
  'Hint': 'רמז'
});
</script>
<script>
/* ---------------------------------------------- 3. ISOMETRIC PROJECTION */
/* World space: x = across the footprint (tefachim), z = into the footprint
   (tefachim), y = up (tefachim). Camera orbits in 90-degree steps so every
   side of the sukkah can be viewed square-on ("view from all 4 sides"),
   plus a continuous drag-rotate and a step-inside mode that looks up at the
   schach from the floor. No sun/moon/star draw calls anywhere in this file
   or any other - see qa.js "no celestial imagery" scan. */
SA.Camera = {
  angle: 0,            // degrees, continuous
  targetAngle: 0,
  zoom: 1, minZoom: 0.45, maxZoom: 2.6,
  pan: { x: 0, y: 0 },
  tilt: 0.62,           // vertical foreshortening factor (0..1)
  inside: false,
  insideLookUp: 0,      // 0..1, how far the step-inside view tips upward
  insideFocusY: 8,       // tefachim - set from the live roof height each frame (p16)
  update: function (dt) {
    var d = SA.Camera.targetAngle - SA.Camera.angle;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    SA.Camera.angle += d * Math.min(1, dt * 6);
    var targetLook = SA.Camera.inside ? 1 : 0;
    SA.Camera.insideLookUp += (targetLook - SA.Camera.insideLookUp) * Math.min(1, dt * 5);
  },
  rotateStep: function (dir) {
    SA.Camera.targetAngle += dir * 90;
  },
  faceLabel: function () {
    var a = ((Math.round(SA.Camera.targetAngle / 90) % 4) + 4) % 4;
    return ['Front Wall', 'Right Wall', 'Back Wall', 'Left Wall'][a];
  }
};

SA.Iso = {
  tileW: 26,
  tileH: 15,
  originX: 0,
  originY: 0,
  setViewport: function (w, h) {
    SA.Iso.originX = w / 2 + SA.Camera.pan.x;
    SA.Iso.originY = h * 0.42 + SA.Camera.pan.y;
  },
  /* Rotate a plan point around the footprint center by the camera angle. */
  rotate: function (x, z, cx, cz) {
    var rad = SA.Camera.angle * Math.PI / 180;
    var dx = x - cx, dz = z - cz;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    return { x: cx + dx * cos - dz * sin, z: cz + dx * sin + dz * cos };
  },
  project: function (x, y, z, cx, cz) {
    var r = SA.Iso.rotate(x, z, cx, cz);
    var lookUp = SA.Camera.inside ? SA.Camera.insideLookUp : 0;
    var tiltNow = SA.Camera.tilt * (1 - 0.35 * lookUp);
    var scale = SA.Camera.zoom * (SA.Camera.inside ? (1.4 + lookUp * 0.6) : 1);
    var sx = (r.x - r.z) * SA.Iso.tileW * scale;
    /* Stepping inside re-centers the vertical frame on the ceiling instead
       of the floor - without this, "look up" only zoomed in on the same
       floor-centered crop and the schach stayed a sliver at the top edge. */
    var yFocus = lookUp * SA.Camera.insideFocusY * 0.8;
    var sy = (r.x + r.z) * SA.Iso.tileH * scale * tiltNow - (y - yFocus) * SA.Iso.tileH * 1.7 * scale;
    return { sx: SA.Iso.originX + sx, sy: SA.Iso.originY + sy };
  },
  depthKey: function (x, y, z, cx, cz) {
    var r = SA.Iso.rotate(x, z, cx, cz);
    return (r.x + r.z) * 1000 - y;
  }
};

/* ---------------------------------------------- 3a. DRAW PRIMITIVES */
SA.Draw = {
  poly: function (ctx, pts, fill, stroke, lineWidth) {
    if (pts.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].sx, pts[0].sy);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth || 1; ctx.stroke(); }
  },
  text: function (ctx, str, x, y, o) {
    o = o || {};
    str = SA.Lang.t(str);
    ctx.save();
    ctx.direction = SA.Lang.hasHebrew(str) ? 'rtl' : 'ltr';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = o.baseline || 'middle';
    ctx.font = (o.weight || '600') + ' ' + (o.size || 16) + 'px "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif';
    if (o.shadow) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(str, x + 1, y + 1.5);
    }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    ctx.restore();
  },
  roundRect: function (ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
};

/* Long dock labels ("Step Inside", "Hide Overlay" / the even longer Hebrew
   "הצג שכבת בדיקה") at narrow cell widths would otherwise overflow into the
   neighboring button - shrink the font, and if a multi-word label still
   does not fit even at the smallest readable size, wrap it onto two lines
   instead of letting it visually merge with the next button. */
SA.Draw.fitFontSize = function (ctx, str, maxW, size, minSize) {
  var s = size;
  ctx.font = '600 ' + s + 'px "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif';
  while (s > minSize && ctx.measureText(str).width > maxW) {
    s -= 1;
    ctx.font = '600 ' + s + 'px "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif';
  }
  return s;
};

SA.Draw.splitTwoLines = function (str) {
  var words = str.split(' ');
  if (words.length < 2) return null;
  var best = 1, bestDiff = Infinity;
  for (var i = 1; i < words.length; i++) {
    var diff = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
};

SA.Draw.button = function (ctx, x, y, w, h, label, active) {
  SA.Draw.roundRect(ctx, x, y, w, h, 10);
  ctx.fillStyle = active === false ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.14)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  var str = SA.Lang.t(label);
  var maxW = w - 10;
  var size = SA.Draw.fitFontSize(ctx, str, maxW, 15, 11);
  ctx.font = '600 ' + size + 'px "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif';
  var lines = ctx.measureText(str).width > maxW ? SA.Draw.splitTwoLines(str) : null;
  if (lines) {
    var s2 = Math.min(SA.Draw.fitFontSize(ctx, lines[0], maxW, size, 8), SA.Draw.fitFontSize(ctx, lines[1], maxW, size, 8));
    SA.Draw.text(ctx, lines[0], x + w / 2, y + h / 2 - s2 * 0.62, { size: s2, color: '#fff' });
    SA.Draw.text(ctx, lines[1], x + w / 2, y + h / 2 + s2 * 0.62, { size: s2, color: '#fff' });
  } else {
    SA.Draw.text(ctx, label, x + w / 2, y + h / 2, { size: size, color: '#fff' });
  }
};
</script>
<script>
/* ---------------------------------------------- 4. BACKGROUND ENGINE */
/* Every background is a flat-color sky (no sun/moon/star disc, ever) plus a
   handful of cached silhouette layers built once from a seeded PRNG so the
   same site always looks the same and nothing recomputes a path per frame
   (see siddur-performance's "cheap gate first / no per-frame recompute"
   pattern, applied here to game art instead of liturgy). p05 lists the 24
   sites; this file only holds the reusable shape generators. */
SA.BG = { cache: {}, list: [] };

function saMulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

SA.BG.jaggedRidge = function (rnd, baseFrac, ampFrac, points, roughness) {
  var pts = [{ x: 0, y: baseFrac }];
  var y = baseFrac;
  for (var i = 1; i < points; i++) {
    y += (rnd() - 0.5) * roughness;
    y = Math.max(baseFrac - ampFrac, Math.min(baseFrac + ampFrac * 0.2, y));
    pts.push({ x: i / (points - 1), y: y });
  }
  pts.push({ x: 1, y: baseFrac + ampFrac * 0.3 });
  pts.push({ x: 1, y: 1 });
  pts.push({ x: 0, y: 1 });
  return pts;
};

SA.BG.drawRidge = function (ctx, view, pts, color) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x * view.w, pts[0].y * view.h);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x * view.w, pts[i].y * view.h);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
};

SA.BG.treeShape = function (kind, rnd) {
  var s = 0.7 + rnd() * 0.6;
  return { kind: kind, s: s };
};

SA.BG.drawTree = function (ctx, x, y, s, kind, color) {
  ctx.fillStyle = color;
  if (kind === 'pine') {
    ctx.beginPath();
    ctx.moveTo(x, y - 34 * s); ctx.lineTo(x - 13 * s, y); ctx.lineTo(x + 13 * s, y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y - 22 * s); ctx.lineTo(x - 10 * s, y + 8 * s); ctx.lineTo(x + 10 * s, y + 8 * s);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'palm') {
    ctx.strokeStyle = color; ctx.lineWidth = 3 * s; ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + 2 * s, y - 26 * s); ctx.stroke();
    for (var i = 0; i < 5; i++) {
      var a = (-1.3 + i * 0.65);
      ctx.beginPath();
      ctx.moveTo(x + 2 * s, y - 26 * s);
      ctx.quadraticCurveTo(x + 2 * s + Math.cos(a) * 16 * s, y - 26 * s + Math.sin(a) * 8 * s - 6 * s,
        x + 2 * s + Math.cos(a) * 22 * s, y - 26 * s + Math.sin(a) * 12 * s);
      ctx.lineWidth = 2.4 * s; ctx.stroke();
    }
  } else if (kind === 'olive') {
    ctx.beginPath(); ctx.ellipse(x, y - 14 * s, 15 * s, 11 * s, 0, 0, 7); ctx.fill();
    ctx.fillRect(x - 1.5 * s, y - 4 * s, 3 * s, 6 * s);
  } else if (kind === 'bamboo') {
    ctx.strokeStyle = color; ctx.lineWidth = 2.2 * s;
    for (var b = -1; b <= 1; b++) {
      ctx.beginPath(); ctx.moveTo(x + b * 5 * s, y); ctx.lineTo(x + b * 5 * s - 2 * s, y - 30 * s); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.arc(x, y - 16 * s, 13 * s, 0, 7); ctx.fill();
    ctx.fillRect(x - 1.5 * s, y - 4 * s, 3 * s, 5 * s);
  }
};

SA.BG.buildingShape = function (ctx, x, baseY, w, h, color, style, rnd) {
  ctx.fillStyle = color;
  ctx.fillRect(x, baseY - h, w, h);
  if (style === 'stone') {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (var r = 0; r < h / 10; r++) ctx.fillRect(x, baseY - h + r * 10, w, 1);
  } else if (style === 'brownstone') {
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for (var wi = 0; wi < w - 6; wi += 9) ctx.fillRect(x + wi + 2, baseY - h + 6, 4, h - 12);
  }
};

/* ---------------------------------------------- 4a. LAYER FACTORIES */
SA.BG.mkGround = function (color, topFrac) {
  return function (ctx, view) {
    ctx.fillStyle = color;
    ctx.fillRect(0, view.h * topFrac, view.w, view.h * (1 - topFrac));
  };
};

SA.BG.mkRidge = function (seed, baseFrac, ampFrac, color, points, roughness) {
  var rnd = saMulberry32(seed);
  var pts = SA.BG.jaggedRidge(rnd, baseFrac, ampFrac, points || 9, roughness == null ? 0.05 : roughness);
  return function (ctx, view) { SA.BG.drawRidge(ctx, view, pts, color); };
};

SA.BG.mkSnowCaps = function (seed, baseFrac, ampFrac, color) {
  var rnd = saMulberry32(seed + 99);
  var peaks = [];
  for (var i = 0; i < 5; i++) peaks.push({ x: 0.06 + i * 0.22 + rnd() * 0.06, y: baseFrac - ampFrac * (0.55 + rnd() * 0.35) });
  return function (ctx, view) {
    ctx.fillStyle = color;
    for (var p = 0; p < peaks.length; p++) {
      var cx = peaks[p].x * view.w, cy = peaks[p].y * view.h;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx - 16, cy + 26);
      ctx.lineTo(cx + 16, cy + 26);
      ctx.closePath();
      ctx.fill();
    }
  };
};

SA.BG.mkTreeLine = function (seed, baseFrac, count, kind, color) {
  var rnd = saMulberry32(seed + 7);
  var trees = [];
  for (var i = 0; i < count; i++) {
    trees.push({ x: (i + 0.5) / count + (rnd() - 0.5) * (0.9 / count), yj: (rnd() - 0.5) * 0.02, s: 0.7 + rnd() * 0.7 });
  }
  return function (ctx, view) {
    for (var i = 0; i < trees.length; i++) {
      var t = trees[i];
      SA.BG.drawTree(ctx, t.x * view.w, (baseFrac + t.yj) * view.h, t.s * (view.w / 720), kind, color);
    }
  };
};

SA.BG.mkBuildingRow = function (seed, baseFrac, count, color, style) {
  var rnd = saMulberry32(seed + 13);
  var b = [];
  var x = 0;
  for (var i = 0; i < count; i++) {
    var w = 0.06 + rnd() * 0.07;
    b.push({ x: x, w: w, h: 0.05 + rnd() * 0.11 });
    x += w * (0.7 + rnd() * 0.5);
    if (x > 1) x -= 1;
  }
  return function (ctx, view) {
    for (var i = 0; i < b.length; i++) {
      SA.BG.buildingShape(ctx, b[i].x * view.w, baseFrac * view.h, b[i].w * view.w, b[i].h * view.h, color, style, rnd);
    }
  };
};

SA.BG.mkWater = function (color, topFrac) {
  return function (ctx, view) {
    ctx.fillStyle = color;
    ctx.fillRect(0, view.h * topFrac, view.w, view.h * (1 - topFrac));
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (var i = 0; i < 6; i++) {
      var y = view.h * topFrac + (i + 0.5) * (view.h * (1 - topFrac)) / 6;
      ctx.fillRect(0, y, view.w, 1.5);
    }
  };
};

SA.BG.mkPaving = function (color, topFrac, seamColor) {
  return function (ctx, view) {
    ctx.fillStyle = color;
    ctx.fillRect(0, view.h * topFrac, view.w, view.h * (1 - topFrac));
    ctx.strokeStyle = seamColor || 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 1;
    var step = 34;
    for (var x = 0; x < view.w; x += step) {
      ctx.beginPath(); ctx.moveTo(x, view.h * topFrac); ctx.lineTo(x, view.h); ctx.stroke();
    }
  };
};

SA.BG.mkFieldStripes = function (colorA, colorB, topFrac) {
  return function (ctx, view) {
    var rows = 7;
    for (var i = 0; i < rows; i++) {
      var y0 = view.h * topFrac + (i / rows) * view.h * (1 - topFrac);
      var y1 = view.h * topFrac + ((i + 1) / rows) * view.h * (1 - topFrac);
      ctx.fillStyle = i % 2 === 0 ? colorA : colorB;
      ctx.fillRect(0, y0, view.w, y1 - y0 + 1);
    }
  };
};

SA.BG.mkOverhangSilhouette = function (color, kind) {
  return function (ctx, view) {
    ctx.fillStyle = color;
    if (kind === 'canopy') {
      ctx.beginPath();
      ctx.ellipse(view.w * 0.5, view.h * 0.18, view.w * 0.42, view.h * 0.10, 0, 0, 7);
      ctx.fill();
    } else {
      ctx.fillRect(0, 0, view.w, view.h * 0.14);
      ctx.fillRect(0, view.h * 0.14, view.w, view.h * 0.02);
    }
  };
};

/* Build once, cache by background id; called again only if the id changes. */
SA.BG.get = function (id) {
  if (SA.BG.cache[id]) return SA.BG.cache[id];
  var def = SA.BG.byId[id];
  if (!def) return null;
  var plan = def.build();
  plan.def = def;
  SA.BG.cache[id] = plan;
  return plan;
};

SA.BG.render = function (ctx, view, id) {
  var plan = SA.BG.get(id);
  if (!plan) return;
  var g = ctx.createLinearGradient(0, 0, 0, view.h);
  g.addColorStop(0, plan.def.skyTop);
  g.addColorStop(1, plan.def.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, view.w, view.h);
  for (var i = 0; i < plan.layers.length; i++) {
    var layer = plan.layers[i];
    layer(ctx, view);
  }
};

};

(function buildWallCatalog() {
  var dict = {};
  var fam = SA.Mat.families, forms = SA.Mat.forms, fin = SA.Mat.finishes;
  for (var fid in fam) {
    var f = fam[fid];
    dict[f.en] = f.he;
    for (var fo = 0; fo < f.forms.length; fo++) {
      var form = forms[f.forms[fo]];
      dict[form.en] = form.he;
      for (var fi = 0; fi < f.finishes.length; fi++) {
        var finish = fin[f.finishes[fi]];
        dict[finish.en] = finish.he_m;
        var id = 'wall_' + fid + '_' + form.id + '_' + finish.id;
        var entry = {
          id: id, kind: 'wall', matKind: f.kind,
          family: f, form: form, finish: finish,
          en: finish.en + ' ' + f.en + ' ' + form.en,
          widthTefachim: form.w, heightTefachim: form.h,
          swaysInWind: !!f.swaysInWind,
          canTieDown: !!f.swaysInWind
        };
        SA.Mat.WALL.push(entry);
        SA.Mat.byId[id] = entry;
      }
    }
  }
  SA.Lang.add(dict);
})();

SA.Mat.wallName = function (entry) {
  return SA.Lang.composeMaterialName(entry.family, entry.form, entry.finish);
};

/* ---------------------------------------------- 6a. WALL TEXTURES */
/* Cheap per-panel decoration on top of a flat fill - a handful of strokes
   per kind, no per-frame path caching needed at this scale (a sukkah has at
   most a few dozen wall panels on screen). See siddur-performance's "cheap
   gate first" applied to draw calls instead of string scans. */
function saLerpPt(a, b, t) { return { sx: a.sx + (b.sx - a.sx) * t, sy: a.sy + (b.sy - a.sy) * t }; }

SA.Draw.wallPanel = function (ctx, quad, entry, tintOverride) {
  var tl = quad[0], tr = quad[1], br = quad[2], bl = quad[3];
  var base = tintOverride || entry.family.base;
  SA.Draw.poly(ctx, [tl, tr, br, bl], base, 'rgba(0,0,0,0.35)', 1);
  var kind = entry.family.kind;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tl.sx, tl.sy); ctx.lineTo(tr.sx, tr.sy); ctx.lineTo(br.sx, br.sy); ctx.lineTo(bl.sx, bl.sy);
  ctx.closePath(); ctx.clip();

  if (kind === 'wood') {
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
    for (var i = 1; i < 4; i++) {
      var t = i / 4;
      var p0 = saLerpPt(tl, bl, t), p1 = saLerpPt(tr, br, t);
      ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.stroke();
    }
  } else if (kind === 'metal') {
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    for (var j = 1; j < 8; j++) {
      var tj = j / 8;
      var q0 = saLerpPt(tl, tr, tj), q1 = saLerpPt(bl, br, tj);
      ctx.beginPath(); ctx.moveTo(q0.sx, q0.sy); ctx.lineTo(q1.sx, q1.sy); ctx.stroke();
    }
  } else if (kind === 'fabric') {
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
    for (var k = 1; k < 5; k++) {
      var tk = k / 5;
      var r0 = saLerpPt(tl, tr, tk), r1 = saLerpPt(bl, br, tk);
      ctx.beginPath(); ctx.moveTo(r0.sx, r0.sy); ctx.lineTo(r1.sx, r1.sy); ctx.stroke();
    }
  } else if (kind === 'masonry') {
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 1;
    for (var m = 1; m < 5; m++) {
      var tm = m / 5;
      var s0 = saLerpPt(tl, bl, tm), s1 = saLerpPt(tr, br, tm);
      ctx.beginPath(); ctx.moveTo(s0.sx, s0.sy); ctx.lineTo(s1.sx, s1.sy); ctx.stroke();
    }
  } else if (kind === 'glass') {
    var g0 = saLerpPt(tl, br, 0.3), g1 = saLerpPt(tl, br, 0.7);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g0.sx, g0.sy); ctx.lineTo(g1.sx, g1.sy); ctx.stroke();
  } else if (kind === 'fence') {
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
    for (var n = 1; n < 6; n++) {
      var tn = n / 6;
      var u0 = saLerpPt(tl, tr, tn), u1 = saLerpPt(bl, br, tn);
      ctx.beginPath(); ctx.moveTo(u0.sx, u0.sy); ctx.lineTo(u1.sx, u1.sy); ctx.stroke();
    }
  }
  ctx.restore();
};
</script>
<script>
/* ---------------------------------------------- 7. LIVE-ANIMAL WALLS */
/* Sukkah 23a: Rabbi Meir invalidates an animal wall (lest it die / lest it
   flee), Rabbi Yehuda validates it; halacha follows the "lest it flee"
   concern, so a live animal wall must be TIED (Shulchan Aruch OC 630:11,
   Mishnah Berurah 630:53). The one exception the Gemara spells out: a TIED
   elephant is kosher even fallen over dead, because its carcass is still
   ten tefachim - so only the elephant's fallenHeight clears the 10-tefach
   minimum on its own. See HALACHA.md 1.11. */
SA.Mat.ANIMALS = [
  { id: 'wall_animal_elephant', en: 'Elephant', he: 'פיל', widthTefachim: 4, standHeight: 30, fallenHeight: 11, tone: '#7c8288' },
  { id: 'wall_animal_camel', en: 'Camel', he: 'גמל', widthTefachim: 3, standHeight: 22, fallenHeight: 7, tone: '#c8a06a' },
  { id: 'wall_animal_cow', en: 'Cow', he: 'פרה', widthTefachim: 2, standHeight: 15, fallenHeight: 6, tone: '#a9836a' },
  { id: 'wall_animal_ox', en: 'Ox', he: 'שור', widthTefachim: 2, standHeight: 16, fallenHeight: 6, tone: '#6e5a4c' },
  { id: 'wall_animal_horse', en: 'Horse', he: 'סוס', widthTefachim: 2, standHeight: 17, fallenHeight: 6, tone: '#5c4636' }
];
SA.Mat.ANIMAL_BY_ID = {};
(function () {
  var dict = {};
  for (var i = 0; i < SA.Mat.ANIMALS.length; i++) {
    var a = SA.Mat.ANIMALS[i];
    a.kind = 'wall'; a.matKind = 'animal'; a.form = { w: a.widthTefachim, h: a.standHeight };
    a.widthTefachim = a.widthTefachim;
    SA.Mat.ANIMAL_BY_ID[a.id] = a;
    dict[a.en] = a.he;
  }
  SA.Lang.add(dict);
})();

SA.Draw.animalPanel = function (ctx, quad, entry, panelState) {
  var tl = quad[0], tr = quad[1], br = quad[2], bl = quad[3];
  var fallen = panelState && panelState.posture === 'fallen';
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tl.sx, tl.sy); ctx.lineTo(tr.sx, tr.sy); ctx.lineTo(br.sx, br.sy); ctx.lineTo(bl.sx, bl.sy);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = 'rgba(150,170,150,0.18)';
  ctx.fill();

  var cx = (tl.sx + tr.sx + bl.sx + br.sx) / 4;
  var cy = (tl.sy + tr.sy + bl.sy + br.sy) / 4;
  var w = Math.hypot(tr.sx - tl.sx, tr.sy - tl.sy);
  var h = Math.hypot(bl.sx - tl.sx, bl.sy - tl.sy);
  ctx.translate(cx, cy);
  if (fallen) ctx.rotate(Math.PI / 2 * 0.92);
  var s = Math.min(w, h) / 46;
  ctx.fillStyle = entry.tone;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.2;

  ctx.beginPath();
  ctx.ellipse(0, 4 * s, 19 * s, 13 * s, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-16 * s, -6 * s, 9 * s, 9 * s, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillRect(-19 * s, 10 * s, 4 * s, 12 * s);
  ctx.fillRect(-2 * s, 10 * s, 4 * s, 12 * s);
  ctx.fillRect(13 * s, 10 * s, 4 * s, 12 * s);
  ctx.fillRect(-32 * s, 10 * s, 4 * s, 12 * s);

  if (entry.id.indexOf('elephant') >= 0) {
    ctx.beginPath();
    ctx.moveTo(-24 * s, -4 * s);
    ctx.quadraticCurveTo(-30 * s, 6 * s, -22 * s, 12 * s);
    ctx.lineWidth = 3 * s; ctx.strokeStyle = entry.tone; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-13 * s, -12 * s, 6 * s, 8 * s, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fill();
  } else if (entry.id.indexOf('camel') >= 0) {
    ctx.beginPath();
    ctx.ellipse(0, -6 * s, 9 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else if (entry.id.indexOf('cow') >= 0 || entry.id.indexOf('ox') >= 0) {
    ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(-20 * s, -12 * s); ctx.lineTo(-24 * s, -18 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12 * s, -13 * s); ctx.lineTo(-9 * s, -19 * s); ctx.stroke();
  } else if (entry.id.indexOf('horse') >= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(-16 * s, -10 * s, 3 * s, 9 * s, 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  if (panelState && panelState.tied) {
    ctx.save();
    ctx.strokeStyle = 'rgba(90,60,30,0.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(bl.sx, bl.sy); ctx.lineTo(br.sx, br.sy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
};
</script>
<script>
/* ---------------------------------------------- 8. SCHACH CATALOG */
/* Ten kosher options and ten teaching-pasul options (HALACHA.md section 2).
   reasonCode is null when the only possible problem is board width
   (gezeiras tikrah, checked live against widthTefachim by the engine in
   p12); otherwise it names which of the three base conditions fails -
   gidulo (didn't grow from the ground), talush (still attached), or tumah

SA.Mat.SCHACH = [
  { id: 'sch_palm_fronds', en: 'Palm Fronds', he: 'ענפי לולב', category: 'kosher', widthTefachim: 0, tex: 'frond', tone: '#7a9a4a' },
  { id: 'sch_bamboo_poles', en: 'Bamboo Poles', he: 'מוטות במבוק', category: 'kosher', widthTefachim: 0, tex: 'pole', tone: '#c7b25b' },
  { id: 'sch_bamboo_mat', en: 'Kosher Bamboo Mat', he: 'מחצלת במבוק כשרה', category: 'kosher', widthTefachim: 0, tex: 'mat', tone: '#c9b568' },
  { id: 'sch_reed_mat', en: 'Reed Mat', he: 'מחצלת קנים', category: 'kosher', widthTefachim: 0, tex: 'mat', tone: '#b7a95e' },
  { id: 'sch_evergreen', en: 'Evergreen Branches', he: 'ענפי אורן', category: 'kosher', widthTefachim: 0, tex: 'branch', tone: '#3f6b3c' },
  { id: 'sch_willow', en: 'Willow Branches', he: 'ענפי ערבה', category: 'kosher', widthTefachim: 0, tex: 'branch', tone: '#7fa15c' },
  { id: 'sch_corn_stalks', en: 'Corn Stalks', he: 'קלחי תירס', category: 'kosher', widthTefachim: 0, tex: 'stalk', tone: '#c2b563' },
  { id: 'sch_bulrushes', en: 'Bulrushes', he: 'סוף וגומא', category: 'kosher', widthTefachim: 0, tex: 'stalk', tone: '#8a9a5a' },
  { id: 'sch_narrow_slats', en: 'Narrow Wood Slats', he: 'שריגי עץ צרים', category: 'kosher', widthTefachim: 2, tex: 'wood', tone: '#b8935e' },
  { id: 'sch_loose_straw', en: 'Loose Straw', he: 'קש רפוי', category: 'kosher', widthTefachim: 0, tex: 'stalk', tone: '#d6c179' },

  { id: 'sch_wide_boards', en: 'Wide Wood Boards', he: 'לוחות עץ רחבים', category: 'teaching-pasul', reasonCode: null, widthTefachim: 5, tex: 'wood', tone: '#a9834f' },
  { id: 'sch_old_ladder', en: 'An Old Ladder', he: 'סולם ישן', category: 'teaching-pasul', reasonCode: 'tumah', widthTefachim: 4, tex: 'ladder', tone: '#8a6a45' },
  { id: 'sch_old_door', en: 'An Old Door', he: 'דלת ישנה', category: 'teaching-pasul', reasonCode: 'tumah', widthTefachim: 6, tex: 'door', tone: '#7a5a3c' },
  { id: 'sch_sleeping_mat', en: 'A Sleeping Mat', he: 'מחצלת לשכיבה', category: 'teaching-pasul', reasonCode: 'tumah', widthTefachim: 0, tex: 'mat', tone: '#a99568' },
  { id: 'sch_plastic_tarp', en: 'Plastic Tarp', he: 'יריעת פלסטיק', category: 'teaching-pasul', reasonCode: 'gidulo', widthTefachim: 0, tex: 'tarp', tone: '#7a8f96' },
  { id: 'sch_sheet_metal', en: 'Sheet Metal', he: 'לוח מתכת', category: 'teaching-pasul', reasonCode: 'gidulo', widthTefachim: 5, tex: 'metal', tone: '#aab2b8' },
  { id: 'sch_plastic_sheet', en: 'Plastic Sheeting', he: 'יריעת ניילון', category: 'teaching-pasul', reasonCode: 'gidulo', widthTefachim: 0, tex: 'plastic', tone: '#cfe0df' },
  { id: 'sch_attached_branches', en: 'Branches Still on the Tree', he: 'ענפים המחוברים לעץ', category: 'teaching-pasul', reasonCode: 'talush', widthTefachim: 0, tex: 'branch', tone: '#4a6a3a' },
  { id: 'sch_fruit', en: 'Fruit', he: 'פירות', category: 'teaching-pasul', reasonCode: 'tumah', widthTefachim: 0, tex: 'fruit', tone: '#a3402f' },
  { id: 'sch_metal_poles', en: 'Bare Metal Poles', he: 'מוטות מתכת חשופים', category: 'teaching-pasul', reasonCode: 'gidulo', widthTefachim: 0, tex: 'pole_metal', tone: '#8b939a' }
];
SA.Mat.SCHACH_BY_ID = {};
(function () {

  for (var i = 0; i < SA.Mat.SCHACH.length; i++) {

SA.Draw.schachTile = function (ctx, quad, entry) {
  var tl = quad[0], tr = quad[1], br = quad[2], bl = quad[3];
  SA.Draw.poly(ctx, [tl, tr, br, bl], entry.tone, 'rgba(0,0,0,0.25)', 1);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tl.sx, tl.sy); ctx.lineTo(tr.sx, tr.sy); ctx.lineTo(br.sx, br.sy); ctx.lineTo(bl.sx, bl.sy);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
  var tex = entry.tex;
  if (tex === 'pole' || tex === 'pole_metal' || tex === 'stalk' || tex === 'wood') {
    for (var i = 1; i < 6; i++) {
      var t = i / 6;
      var p0 = saLerpPt(tl, tr, t), p1 = saLerpPt(bl, br, t);
      ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.stroke();
    }
  } else if (tex === 'mat') {
    for (var a = 1; a < 5; a++) {
      var ta = a / 5;
      var q0 = saLerpPt(tl, tr, ta), q1 = saLerpPt(bl, br, ta);
      ctx.beginPath(); ctx.moveTo(q0.sx, q0.sy); ctx.lineTo(q1.sx, q1.sy); ctx.stroke();
    }
    for (var b = 1; b < 5; b++) {
      var tb = b / 5;
      var r0 = saLerpPt(tl, bl, tb), r1 = saLerpPt(tr, br, tb);
      ctx.beginPath(); ctx.moveTo(r0.sx, r0.sy); ctx.lineTo(r1.sx, r1.sy); ctx.stroke();
    }
  } else if (tex === 'frond') {
    var cx = (tl.sx + br.sx) / 2, cy = (tl.sy + br.sy) / 2;
    for (var f = -2; f <= 2; f++) {
      var e0 = saLerpPt(tl, tr, 0.5 + f * 0.12);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(e0.sx, e0.sy); ctx.stroke();
    }
  } else if (tex === 'branch') {
    for (var g = 0; g < 5; g++) {
      var gx0 = saLerpPt(tl, bl, g / 5), gx1 = saLerpPt(tr, br, (g + 0.6) / 5);
      ctx.beginPath(); ctx.moveTo(gx0.sx, gx0.sy);
      ctx.quadraticCurveTo((gx0.sx + gx1.sx) / 2, (gx0.sy + gx1.sy) / 2 - 3, gx1.sx, gx1.sy);
      ctx.stroke();
    }
  } else if (tex === 'ladder') {
    var l0 = saLerpPt(tl, bl, 0.15), l1 = saLerpPt(tr, br, 0.15);
    var l2 = saLerpPt(tl, bl, 0.85), l3 = saLerpPt(tr, br, 0.85);
    ctx.beginPath(); ctx.moveTo(l0.sx, l0.sy); ctx.lineTo(l1.sx, l1.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(l2.sx, l2.sy); ctx.lineTo(l3.sx, l3.sy); ctx.stroke();
    for (var r = 1; r < 5; r++) {
      var rt = r / 5;
      var rp0 = saLerpPt(tl, tr, rt), rp1 = saLerpPt(bl, br, rt);
      ctx.beginPath(); ctx.moveTo(rp0.sx, rp0.sy); ctx.lineTo(rp1.sx, rp1.sy); ctx.stroke();
    }
  } else if (tex === 'door') {
    ctx.strokeRect ? null : null;
    var m0 = saLerpPt(tl, br, 0.3), m1 = saLerpPt(tr, bl, 0.3);
    ctx.beginPath(); ctx.arc(m0.sx, m0.sy, 2, 0, 7); ctx.fillStyle = '#3a2f22'; ctx.fill();
  } else if (tex === 'tarp' || tex === 'plastic' || tex === 'metal') {
    var d0 = saLerpPt(tl, br, 0.25), d1 = saLerpPt(tl, br, 0.75);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(d0.sx, d0.sy); ctx.lineTo(d1.sx, d1.sy); ctx.stroke();
  } else if (tex === 'fruit') {
    for (var fx = 0.25; fx < 1; fx += 0.25) {
      for (var fz = 0.3; fz < 1; fz += 0.4) {
        var fp = saLerpPt(saLerpPt(tl, tr, fx), saLerpPt(bl, br, fx), fz);
        ctx.beginPath(); ctx.arc(fp.sx, fp.sy, 2.4, 0, 7);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
      }
    }
  }
  ctx.restore();
};

<script>
/* ---------------------------------------------- 9. DECORATIONS (~80) */
/* Hard exclusion, enforced here and re-checked by qa.js: no star or sun
   ornaments, ever - real sukkahs are full of foil stars, so this is the
   single likeliest slip (see the plan and FRUM-GAME-RULES section 7).
   hang=true items are checked against HALACHA.md 3.1 (4-tefach clearance,
   4-tefach width) by the engine in p12; everything else just decorates. */
SA.Mat.DECOR_CATEGORIES = [
  { id: 'fruit', en: 'Fruit & Harvest', he: 'פירות ויבול' },
  { id: 'chain', en: 'Chains & Garlands', he: 'שרשראות וקישוטי תלייה' },

  if (entry.category === 'fruit') {

    ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.stroke();
  } else if (entry.category === 'chain') {

    for (var i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 6, 0, 4, 0, 7); ctx.stroke(); }
  } else if (entry.category === 'light') {
    ctx.fillStyle = '#e0c56a';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 7, 0, 0, 7); ctx.fill(); ctx.stroke();
  } else if (entry.category === 'sign') {
    ctx.fillStyle = '#cbb98a';

  } else if (entry.category === 'textile') {

    ctx.fillRect(-8, -2, 16, 3);
    ctx.fillRect(-7, 1, 2, 6); ctx.fillRect(5, 1, 2, 6);
  } else {
    ctx.fillStyle = '#5f7a4a';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
  }

<script>
/* ---------------------------------------------- 10. BUILD STATE */
/* The data the halacha engine (p12) reads. Grid unit = 1 tefach everywhere.
   Walls are column x row occupancy grids (plan section 3: "walls are width
   x height cell arrays holding material ids"); schach is a flat x/z grid,
   one material per cell, since a real sukkah roof is a single plane and the
   player controls its height with one slider (roofHeight) rather than
   sculpting height per cell. */
SA.WALL_GRID_ROWS = SA.Rule.ROOF_MAX_SLIDER + 6;
SA.WALL_SIDES = ['N', 'E', 'S', 'W'];

var saUidSeq = 1;
function saUid() { return 'u' + (saUidSeq++); }

SA.State = {};

SA.State.wallLength = function (state, side) {
  return (side === 'N' || side === 'S') ? state.footprint.w : state.footprint.d;
};

SA.State.newWall = function () { return { panels: [], occ: {} }; };

SA.State.rebuildOcc = function (wall) {
  wall.occ = {};
  for (var i = 0; i < wall.panels.length; i++) {
    var p = wall.panels[i];
    for (var c = p.col; c < p.col + p.w; c++) {
      for (var r = p.row; r < p.row + p.h; r++) {
        wall.occ[c + '_' + r] = p.uid;
      }
    }
  }
};

SA.State.create = function (w, d, roofHeight, siteId) {
  var st = {
    footprint: { w: w || 10, d: d || 10 },
    roofHeight: roofHeight || 11,
    siteId: siteId || 'meadow',
    support: 'wood_on_metal',
    walls: { N: SA.State.newWall(), S: SA.State.newWall(), E: SA.State.newWall(), W: SA.State.newWall() },
    schach: [],
    decor: [],
    buildOrderWarning: false,
    overlayOn: true
  };
  SA.State.rebuildSchachGrid(st);
  return st;
};

SA.State.rebuildSchachGrid = function (st) {
  var grid = [];
  for (var x = 0; x < st.footprint.w; x++) {
    var col = [];
    for (var z = 0; z < st.footprint.d; z++) col.push(null);
    grid.push(col);
  }
  st.schach = grid;
};

SA.State.setFootprint = function (st, w, d) {
  st.footprint.w = Math.max(SA.Rule.FLOOR_MIN, Math.min(SA.Rule.FLOOR_MAX, w));
  st.footprint.d = Math.max(SA.Rule.FLOOR_MIN, Math.min(SA.Rule.FLOOR_MAX, d));
  st.walls = { N: SA.State.newWall(), S: SA.State.newWall(), E: SA.State.newWall(), W: SA.State.newWall() };
  SA.State.rebuildSchachGrid(st);
  st.decor = [];
  st.buildOrderWarning = false;
};

SA.State.setRoofHeight = function (st, h) {
  st.roofHeight = Math.max(1, Math.min(SA.Rule.ROOF_MAX_SLIDER, Math.round(h)));
};

/* -------------------------------------------------------- wall panels */
SA.State.totalWallPanelCount = function (st) {
  var n = 0;
  for (var i = 0; i < SA.WALL_SIDES.length; i++) n += st.walls[SA.WALL_SIDES[i]].panels.length;
  return n;
};

SA.State.notePlacement = function (st, kind) {
  if (kind === 'schach' && SA.State.totalWallPanelCount(st) === 0) {
    st.buildOrderWarning = true; // HALACHA.md 2.4 - schach before any wall
  }
};

SA.State.placeWallPanel = function (st, side, col, matEntry) {
  var wall = st.walls[side];
  var length = SA.State.wallLength(st, side);
  var w = matEntry.widthTefachim || (matEntry.form ? matEntry.form.w : 1);
  var h = matEntry.heightTefachim || matEntry.standHeight || (matEntry.form ? matEntry.form.h : 10);
  col = Math.max(0, Math.min(length - 1, col));
  var kept = [];
  for (var i = 0; i < wall.panels.length; i++) {
    var p = wall.panels[i];
    var overlaps = !(p.col + p.w <= col || p.col >= col + w);
    if (overlaps) continue;
    kept.push(p);
  }
  wall.panels = kept;
  var panel = {
    uid: saUid(), matId: matEntry.id, col: col, row: 0, w: w, h: h,
    tied: false, posture: 'standing'
  };
  wall.panels.push(panel);
  SA.State.rebuildOcc(wall);
  SA.State.notePlacement(st, 'wall');
  return panel;
};

SA.State.fillWall = function (st, side, matEntry) {
  var length = SA.State.wallLength(st, side);
  var w = matEntry.widthTefachim || (matEntry.form ? matEntry.form.w : 1);
  st.walls[side] = SA.State.newWall();
  for (var col = 0; col < length; col += w) {
    SA.State.placeWallPanel(st, side, col, matEntry);
  }
};

SA.State.eraseWallAt = function (st, side, col) {
  var wall = st.walls[side];
  var kept = [];
  for (var i = 0; i < wall.panels.length; i++) {
    var p = wall.panels[i];
    if (col >= p.col && col < p.col + p.w) continue;
    kept.push(p);
  }
  wall.panels = kept;
  SA.State.rebuildOcc(wall);
};

SA.State.clearWall = function (st, side) {
  st.walls[side] = SA.State.newWall();
};

SA.State.findPanel = function (st, side, uid) {
  var wall = st.walls[side];
  for (var i = 0; i < wall.panels.length; i++) if (wall.panels[i].uid === uid) return wall.panels[i];
  return null;
};

SA.State.setPanelTied = function (st, side, uid, tied) {
  var p = SA.State.findPanel(st, side, uid);
  if (p) p.tied = !!tied;
};

SA.State.setPanelPosture = function (st, side, uid, posture) {
  var p = SA.State.findPanel(st, side, uid);
  if (p) p.posture = posture;
};

/* -------------------------------------------------------- schach */
SA.State.placeSchach = function (st, x, z, matEntry) {
  if (x < 0 || z < 0 || x >= st.footprint.w || z >= st.footprint.d) return;
  st.schach[x][z] = { matId: matEntry.id };
  SA.State.notePlacement(st, 'schach');
};

SA.State.fillSchach = function (st, matEntry) {
  for (var x = 0; x < st.footprint.w; x++) {
    for (var z = 0; z < st.footprint.d; z++) st.schach[x][z] = { matId: matEntry.id };
  }
  SA.State.notePlacement(st, 'schach');
};

SA.State.eraseSchach = function (st, x, z) {
  if (x < 0 || z < 0 || x >= st.footprint.w || z >= st.footprint.d) return;
  st.schach[x][z] = null;
};

/* -------------------------------------------------------- decorations */
SA.State.placeDecor = function (st, matEntry, x, z, opts) {
  opts = opts || {};
  var d = {
    uid: saUid(), matId: matEntry.id, x: x, z: z,
    hang: !!matEntry.hang, clearance: opts.clearance != null ? opts.clearance : 2,
    wallSide: opts.wallSide || null
  };
  st.decor.push(d);
  return d;
};

SA.State.removeDecor = function (st, uid) {
  st.decor = st.decor.filter(function (d) { return d.uid !== uid; });
};

SA.State.setDecorClearance = function (st, uid, tefachim) {
  for (var i = 0; i < st.decor.length; i++) {
    if (st.decor[i].uid === uid) { st.decor[i].clearance = Math.max(0, tefachim); return; }
  }
};

/* -------------------------------------------------------- material lookup */
SA.State.materialById = function (id) {
  if (SA.Mat.byId[id]) return SA.Mat.byId[id];
  if (SA.Mat.ANIMAL_BY_ID[id]) return SA.Mat.ANIMAL_BY_ID[id];
  if (SA.Mat.SCHACH_BY_ID[id]) return SA.Mat.SCHACH_BY_ID[id];
  if (SA.Mat.DECOR_BY_ID[id]) return SA.Mat.DECOR_BY_ID[id];
  return null;
};

<script>
/* ---------------------------------------------- 11. PICKING + PLACEMENT */
/* The scene renderer (p16) rebuilds SA.Pick.list every frame as it draws,
   recording each placeable cell's projected screen quad. Tap handling then
   hit-tests that list back-to-front (topmost drawn = checked first) instead
   of inverse-projecting isometric math, which keeps hit testing exact even
   while the camera is mid-rotation. */
SA.Pick = { list: [] };
SA.Pick.reset = function () { SA.Pick.list = []; };
SA.Pick.add = function (kind, payload, quad) { SA.Pick.list.push({ kind: kind, payload: payload, quad: quad }); };
/* 2D HUD buttons reuse the same point-in-quad hit test as the 3D scene, so
   there is exactly one hit-testing code path in the whole game. */
SA.Pick.addRect = function (kind, payload, x, y, w, h) {
  SA.Pick.add(kind, payload, [
    { sx: x, sy: y }, { sx: x + w, sy: y }, { sx: x + w, sy: y + h }, { sx: x, sy: y + h }
  ]);
};

SA.Pick.pointInQuad = function (px, py, quad) {
  var inside = false;
  for (var i = 0, j = quad.length - 1; i < quad.length; j = i++) {
    var xi = quad[i].sx, yi = quad[i].sy, xj = quad[j].sx, yj = quad[j].sy;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
};

SA.Pick.hitTest = function (px, py) {
  for (var i = SA.Pick.list.length - 1; i >= 0; i--) {
    var e = SA.Pick.list[i];
    if (SA.Pick.pointInQuad(px, py, e.quad)) return e;
  }
  return null;
};

/* ---------------------------------------------- 11a. TOOL STATE */
SA.Tool = {
  category: 'wall',        // 'wall' | 'schach' | 'decor' | 'footprint' | 'erase'
  materialId: null,
  wallSide: 'N'
};

SA.Tool.currentMaterial = function () {
  if (!SA.Tool.materialId) return null;
  return SA.State.materialById(SA.Tool.materialId);
};

/* ---------------------------------------------- 11b. ACTIONS */
/* Thin wrappers so the input layer (p17) and UI buttons (p16) share one
   place that also marks the profile dirty for autosave (p19). */
SA.Act = {};

SA.Act.placeWall = function (st, side, col) {
  var mat = SA.Tool.currentMaterial();
  if (!mat) return;
  SA.State.placeWallPanel(st, side, col, mat);
  SA.Progress.onAction('place_wall', mat.id);
  SA.Save.markDirty();
};

SA.Act.fillWall = function (st, side) {
  var mat = SA.Tool.currentMaterial();
  if (!mat) return;
  SA.State.fillWall(st, side, mat);
  SA.Progress.onAction('fill_wall', mat.id);
  SA.Save.markDirty();
};

SA.Act.eraseWall = function (st, side, col) {
  SA.State.eraseWallAt(st, side, col);
  SA.Save.markDirty();
};

SA.Act.tieToggle = function (st, side, uid) {
  var p = SA.State.findPanel(st, side, uid);
  if (!p) return;
  SA.State.setPanelTied(st, side, uid, !p.tied);
  SA.Save.markDirty();
};

SA.Act.postureToggle = function (st, side, uid) {
  var p = SA.State.findPanel(st, side, uid);
  if (!p) return;
  SA.State.setPanelPosture(st, side, uid, p.posture === 'fallen' ? 'standing' : 'fallen');
  SA.Save.markDirty();
};

SA.Act.placeSchach = function (st, x, z) {
  var mat = SA.Tool.currentMaterial();
  if (!mat) return;
  SA.State.placeSchach(st, x, z, mat);
  SA.Progress.onAction('place_schach', mat.id);
  SA.Save.markDirty();
};

SA.Act.fillSchach = function (st) {
  var mat = SA.Tool.currentMaterial();
  if (!mat) return;
  SA.State.fillSchach(st, mat);
  SA.Progress.onAction('fill_schach', mat.id);
  SA.Save.markDirty();
};

SA.Act.eraseSchach = function (st, x, z) { SA.State.eraseSchach(st, x, z); SA.Save.markDirty(); };

SA.Act.placeDecor = function (st, x, z) {
  var mat = SA.Tool.currentMaterial();
  if (!mat) return;
  SA.State.placeDecor(st, mat, x, z, { wallSide: SA.Tool.wallSide });
  SA.Progress.onAction('place_decor', mat.id);
  SA.Save.markDirty();
};

SA.Act.setFootprint = function (st, w, d) { SA.State.setFootprint(st, w, d); SA.Save.markDirty(); };
SA.Act.setRoofHeight = function (st, h) { SA.State.setRoofHeight(st, h); SA.Save.markDirty(); };
SA.Act.setSupport = function (st, kind) { st.support = kind; SA.Save.markDirty(); };
</script>
<script>
/* ---------------------------------------------- 12. HALACHA ENGINE */
/* SA.Halacha.evaluate(state) -> { kosher, status, issues[], shadeRatio,
   measurements }. Every threshold cites HALACHA.md; the section number is
   in each comment so a fix can go straight back to the source. Severities:
   'pasul' (genuinely invalidating), 'incomplete' (still building, nothing
   wrong yet), 'lchatchila' (best-practice, never fails the sukkah),
   'tip' (pure teaching note). Three-state verdict only - no screen shake,
   no red flash anywhere in this file or the renderer (plan section 4). */
SA.Halacha = {};

function saMergeLavud(intervals, gapMax) {
  if (!intervals.length) return [];
  intervals.sort(function (a, b) { return a[0] - b[0]; });
  var out = [intervals[0].slice()];
  for (var i = 1; i < intervals.length; i++) {
    var last = out[out.length - 1];
    var cur = intervals[i];
    if (cur[0] - last[1] < gapMax) last[1] = Math.max(last[1], cur[1]);
    else out.push(cur.slice());
  }
  return out;
}

function saPanelEffectiveHeight(panel, entry) {
  if (!entry) return 0;
  if (entry.matKind === 'animal') {
    if (!panel.tied) return 0; // Sukkah 23a / OC 630:11 - untied, doesn't count
    return panel.posture === 'fallen' ? entry.fallenHeight : entry.standHeight;
  }
  if (entry.swaysInWind && !panel.tied) return 0; // OC 630:10-11 - not secured against ordinary wind
  return panel.h;
}

/* -------------------------------------------------------- 12a. WALLS */
SA.Halacha.evaluateWalls = function (state, issues, measurements) {
  var sideLongest = {}, sideRuns = {}, lavudBridges = [];
  for (var s = 0; s < SA.WALL_SIDES.length; s++) {
    var side = SA.WALL_SIDES[s];
    var length = SA.State.wallLength(state, side);
    var wall = state.walls[side];
    var colIntervals = [];
    for (var c = 0; c < length; c++) colIntervals.push([]);
    for (var i = 0; i < wall.panels.length; i++) {
      var p = wall.panels[i];
      var entry = SA.State.materialById(p.matId);
      var effH = saPanelEffectiveHeight(p, entry);
      if (entry && entry.matKind === 'animal' && !p.tied) {
        issues.push({ severity: 'tip', code: 'untie_needed_animal', anchor: { side: side, col: p.col },
          en: 'Tie this animal to the wall - an unsecured live wall does not count (Sukkah 23a).', cardId: 'sk_elephant' });
      } else if (entry && entry.swaysInWind && !p.tied) {
        issues.push({ severity: 'tip', code: 'untie_needed_fabric', anchor: { side: side, col: p.col },
          en: 'Tie or pole this fabric wall so ordinary wind cannot open a gap (OC 630:10-11).', cardId: 'sk_ruach' });
      } else if (entry && entry.matKind === 'animal' && p.tied && p.posture === 'fallen' && entry.fallenHeight >= SA.Rule.WALL_MIN_HEIGHT) {
        issues.push({ severity: 'tip', code: 'elephant_carcass_ok', anchor: { side: side, col: p.col },
          en: 'Even fallen, a tied elephant is still ten tefachim tall - the wall still counts (Sukkah 23a).', cardId: 'sk_elephant' });
      }
      if (effH <= 0) continue;
      for (var cc = Math.max(0, p.col); cc < Math.min(length, p.col + p.w); cc++) {
        colIntervals[cc].push([p.row, p.row + effH]);
      }
    }
    var colStanding = [];
    for (var c2 = 0; c2 < length; c2++) {
      var merged = saMergeLavud(colIntervals[c2], SA.Rule.LAVUD);
      var top = 0;
      for (var m = 0; m < merged.length; m++) {
        if (merged[m][0] < SA.Rule.GROUND_GAP_MAX) top = Math.max(top, merged[m][1]);
      }
      colStanding.push(top >= SA.Rule.WALL_MIN_HEIGHT);
    }
    /* horizontal lavud: a gap under 3 tefachim between two standing columns
       is itself treated as standing (HALACHA.md 1.8). */
    var bridged = colStanding.slice();
    var gapStart = -1;
    for (var c3 = 0; c3 <= length; c3++) {
      var standing = c3 < length && colStanding[c3];
      if (!standing) { if (gapStart < 0) gapStart = c3; }
      else {
        if (gapStart >= 0) {
          var gapLen = c3 - gapStart;
          if (gapStart > 0 && gapLen < SA.Rule.LAVUD) {
            for (var g = gapStart; g < c3; g++) bridged[g] = true;
            lavudBridges.push({ side: side, colStart: gapStart, colEnd: c3 });
          }
          gapStart = -1;
        }
      }
    }
    var longest = 0, runStart = -1, runs = [];
    var curLen = 0, curStart = 0;
    for (var c4 = 0; c4 <= length; c4++) {
      if (c4 < length && bridged[c4]) { if (curLen === 0) curStart = c4; curLen++; }
      else { if (curLen > 0) runs.push({ start: curStart, len: curLen }); longest = Math.max(longest, curLen); curLen = 0; }
    }
    sideLongest[side] = longest;
    sideRuns[side] = runs;
  }
  measurements.wallRunTefachim = sideLongest;
  measurements.lavudBridges = lavudBridges;

  var full = {};
  for (var si = 0; si < SA.WALL_SIDES.length; si++) {
    full[SA.WALL_SIDES[si]] = sideLongest[SA.WALL_SIDES[si]] >= SA.Rule.WALL_MIN_FULL_LEN;
  }
  var fullCount = SA.WALL_SIDES.filter(function (k) { return full[k]; }).length;
  var corners = [['N', 'E'], ['N', 'W'], ['S', 'E'], ['S', 'W']];
  var parallels = [['N', 'S'], ['E', 'W']];
  var hasCornerPair = corners.some(function (pr) { return full[pr[0]] && full[pr[1]]; });
  var hasParallelPair = !hasCornerPair && parallels.some(function (pr) { return full[pr[0]] && full[pr[1]]; });

  var thirdWallOk = false;
  if (hasCornerPair || hasParallelPair) {
    var requiredLen = hasCornerPair ? SA.Rule.THIRD_WALL_PERP : SA.Rule.THIRD_WALL_PARALLEL;
    for (var sj = 0; sj < SA.WALL_SIDES.length; sj++) {
      var sideId = SA.WALL_SIDES[sj];
      if (full[sideId]) continue;
      var len = SA.State.wallLength(state, sideId);
      var runsHere = sideRuns[sideId];
      for (var rk = 0; rk < runsHere.length; rk++) {
        var run = runsHere[rk];
        if (run.len < requiredLen) continue;
        var nearStart = run.start < SA.Rule.LAVUD;
        var nearEnd = (run.start + run.len) > len - SA.Rule.LAVUD;
        if (nearStart || nearEnd) thirdWallOk = true;
      }
    }
  }
  var wallsOk = fullCount >= 3 || hasCornerPair && thirdWallOk || hasParallelPair && thirdWallOk;
  if (!wallsOk) {
    issues.push({ severity: fullCount >= 2 ? 'incomplete' : 'incomplete', code: 'walls_incomplete',
      en: 'Needs two full walls that meet (or are parallel) plus a short third wall near the corner.', cardId: 'sk_two_walls' });
  }
  measurements.fullWallCount = fullCount;
  return { wallsOk: wallsOk };
};

/* -------------------------------------------------------- 12b. SCHACH */
function saFloodComponents(w, d, cls) {
  var visited = {};
  var comps = [];
  function key(x, z) { return x + '_' + z; }
  for (var x = 0; x < w; x++) {
    for (var z = 0; z < d; z++) {
      var k = key(x, z);
      if (visited[k]) continue;
      var t = cls[x][z].type;
      visited[k] = true;
      if (t === 'kosher') continue;
      var stack = [[x, z]], cells = [];
      var minX = x, maxX = x, minZ = z, maxZ = z, touchesWall = false;
      var reasons = {};
      while (stack.length) {
        var cur = stack.pop();
        var cx = cur[0], cz = cur[1];
        cells.push(cur);
        if (cx === 0 || cx === w - 1 || cz === 0 || cz === d - 1) touchesWall = true;
        minX = Math.min(minX, cx); maxX = Math.max(maxX, cx);
        minZ = Math.min(minZ, cz); maxZ = Math.max(maxZ, cz);
        if (cls[cx][cz].reason) reasons[cls[cx][cz].reason] = true;
        var nbrs = [[cx - 1, cz], [cx + 1, cz], [cx, cz - 1], [cx, cz + 1]];
        for (var n = 0; n < nbrs.length; n++) {
          var nx = nbrs[n][0], nz = nbrs[n][1];
          if (nx < 0 || nz < 0 || nx >= w || nz >= d) continue;
          var nk = key(nx, nz);
          if (visited[nk]) continue;
          if (cls[nx][nz].type !== t) continue;
          visited[nk] = true;
          stack.push([nx, nz]);
        }
      }
      comps.push({
        type: t, cells: cells, touchesWall: touchesWall,
        bboxW: maxX - minX + 1, bboxD: maxZ - minZ + 1,
        measure: Math.min(maxX - minX + 1, maxZ - minZ + 1),
        reasons: Object.keys(reasons),
        anchor: { x: cells[0][0] + 0.5, z: cells[0][1] + 0.5 }
      });
    }
  }
  return comps;
}

SA.Halacha.hazardCells = function (state) {
  var bg = SA.BG.byId[state.siteId];
  var set = {};
  if (!bg || !bg.hazard) return set;
  var f = bg.hazard.frac;
  var w = state.footprint.w, d = state.footprint.d;
  var x0 = Math.floor(f.x0 * w), x1 = Math.ceil(f.x1 * w);
  var z0 = Math.floor(f.z0 * d), z1 = Math.ceil(f.z1 * d);
  for (var x = x0; x < x1; x++) for (var z = z0; z < z1; z++) set[x + '_' + z] = true;
  return set;
};

SA.Halacha.evaluateSchach = function (state, issues, measurements) {
  var w = state.footprint.w, d = state.footprint.d;
  var isSmall = (w === SA.Rule.FLOOR_MIN && d === SA.Rule.FLOOR_MIN);
  var hazardSet = SA.Halacha.hazardCells(state);
  var cls = [];
  var kosherCount = 0;
  for (var x = 0; x < w; x++) {
    var col = [];
    for (var z = 0; z < d; z++) {
      if (hazardSet[x + '_' + z]) { col.push({ type: 'pasul', reason: 'overhead' }); continue; }
      var cell = state.schach[x][z];
      if (!cell) { col.push({ type: 'avir' }); continue; }
      var entry = SA.Mat.SCHACH_BY_ID[cell.matId];
      var widthFail = entry.widthTefachim >= SA.Rule.GEZEIRAS_TIKRAH_WIDTH;
      var baseFail = entry.reasonCode != null;
      if (widthFail || baseFail) col.push({ type: 'pasul', reason: baseFail ? entry.reasonCode : 'width', matId: entry.id });
      else { col.push({ type: 'kosher' }); kosherCount++; }
    }
    cls.push(col);
  }
  var totalCells = w * d;
  var shadeRatio = totalCells ? kosherCount / totalCells : 0;
  measurements.shadeRatio = shadeRatio;
  measurements.cellClass = cls; // per-cell kosher/avir/pasul, for the overlay's floor coverage map (never a drawn sun)
  var shadeOk = shadeRatio > SA.Rule.SHADE_MIN;
  if (!shadeOk) {
    issues.push({ severity: kosherCount === 0 ? 'incomplete' : 'pasul', code: 'shade_not_majority',
      en: 'The schach must shade more than half the floor (tzilata merubah, OC 631:1).', cardId: 'sk_shade' });
  }

  var heightOk = true;
  if (state.roofHeight < SA.Rule.ROOF_MIN) {
    heightOk = false;
    issues.push({ severity: 'incomplete', code: 'roof_too_low',
      en: 'The sukkah must be at least ten tefachim tall inside (OC 633:8).', cardId: 'sk_height' });
  } else if (state.roofHeight > SA.Rule.ROOF_MAX_KOSHER) {
    heightOk = false;
    issues.push({ severity: 'pasul', code: 'roof_too_high',
      en: 'Above twenty amos tall, a sukkah is pasul no matter how it is built (OC 633:1).', cardId: 'sk_height' });
  }

  var floorOk = w >= SA.Rule.FLOOR_MIN && d >= SA.Rule.FLOOR_MIN;
  if (!floorOk) {
    issues.push({ severity: 'pasul', code: 'floor_too_small',
      en: 'The floor must be at least seven by seven tefachim (OC 634:1).', cardId: 'sk_floor' });
  }

  var comps = saFloodComponents(w, d, cls);
  for (var i = 0; i < comps.length; i++) {
    var comp = comps[i];
    if (comp.type === 'avir') {
      if (comp.measure >= SA.Rule.AVIR) {
        issues.push({ severity: 'pasul', code: 'avir_too_wide', anchor: { x: comp.anchor.x, z: comp.anchor.z },
          en: SA.Lang.fmt('Open sky {n} tefachim wide invalidates the sukkah here (OC 632:2).', { n: comp.measure }), cardId: 'sk_avir' });
      } else if (comp.measure > 0) {
        issues.push({ severity: 'tip', code: 'avir_ok_lavud', anchor: { x: comp.anchor.x, z: comp.anchor.z },
          en: 'A gap under three tefachim is nullified into the schach around it (lavud).', cardId: 'sk_lavud' });
      }
      continue;
    }
    var threshold = isSmall ? SA.Rule.AVIR : (comp.touchesWall ? SA.Rule.DOFEN_AKUMAH_AMOS : SA.Rule.PASUL_MIDDLE);
    var reasonCode = comp.reasons[0] || 'width';
    var cardId = comp.reasons.indexOf('overhead') >= 0 ? 'sk_overhead'
      : comp.touchesWall ? 'sk_dofen_akumah' : (reasonCode === 'width' ? 'sk_gezeiras_tikrah' : 'sk_schach_conditions');
    if (comp.measure >= threshold) {
      issues.push({ severity: 'pasul', code: comp.touchesWall ? 'dofen_akumah_exceeded' : 'pasul_schach_too_wide',
        anchor: { x: comp.anchor.x, z: comp.anchor.z },
        en: comp.touchesWall
          ? SA.Lang.fmt('Invalid schach at the wall is {n} tefachim wide - past four amos, dofen akumah no longer saves it (OC 632:1).', { n: comp.measure })
          : SA.Lang.fmt('Invalid schach in the middle is {n} tefachim wide, at least four (OC 632:1).', { n: comp.measure }),
        cardId: cardId });
    } else if (comp.touchesWall && comp.measure >= SA.Rule.DECOR_CLEARANCE) {
      issues.push({ severity: 'tip', code: 'no_sit_dofen_akumah', anchor: { x: comp.anchor.x, z: comp.anchor.z },
        en: 'The sukkah stays kosher, but do not sit directly under this bent-wall strip (dofen akumah, OC 632:1).', cardId: 'sk_dofen_akumah' });
    }
  }
  return { shadeOk: shadeOk, heightOk: heightOk && floorOk, shadeRatio: shadeRatio };
};

/* -------------------------------------------------------- 12c. DECOR / MAAMID / BUILD ORDER */
SA.Halacha.evaluateDecor = function (state, issues) {
  for (var i = 0; i < state.decor.length; i++) {
    var d = state.decor[i];
    if (!d.hang) continue;
    var entry = SA.Mat.DECOR_BY_ID[d.matId];
    if (!entry) continue;
    if (d.clearance > SA.Rule.DECOR_CLEARANCE) {
      if (entry.widthTefachim >= SA.Rule.DECOR_WIDE) {
        issues.push({ severity: 'pasul', code: 'decor_interposing_ceiling', anchor: { x: d.x, z: d.z },
          en: 'This hangs more than four tefachim below the schach and is wide enough to be its own ceiling (OC 627:4).', cardId: 'sk_decor' });
      } else {
        issues.push({ severity: 'tip', code: 'decor_below_custom', anchor: { x: d.x, z: d.z },
          en: 'Custom is to keep decorations within four tefachim of the schach, even narrow ones (Rema, MB 627:15).', cardId: 'sk_decor' });
      }
    }
  }
};

SA.Halacha.evaluateMaamid = function (state, issues) {
  if (state.support === 'bare_metal') {
    issues.push({ severity: 'lchatchila', code: 'maamid_lchatchila',
      en: 'Resting schach directly on bare metal is an l\'chatchila concern only - bediavad it is fine (MB 629:22).', cardId: 'sk_maamid' });
  }
};

SA.Halacha.evaluateBuildOrder = function (state, issues) {
  if (state.buildOrderWarning) {
    issues.push({ severity: 'tip', code: 'build_order_schach_first',
      en: 'L\'chatchila, put up the walls before the schach (ta\'aseh v\'lo min he\'asuy, OC 626:2).', cardId: 'sk_build_order' });
  }
};

/* -------------------------------------------------------- 12d. TOP LEVEL */
SA.Halacha.evaluate = function (state) {
  var issues = [];
  var measurements = {};
  var wallsRes = SA.Halacha.evaluateWalls(state, issues, measurements);
  var schachRes = SA.Halacha.evaluateSchach(state, issues, measurements);
  SA.Halacha.evaluateDecor(state, issues);
  SA.Halacha.evaluateMaamid(state, issues);
  SA.Halacha.evaluateBuildOrder(state, issues);

  var hasPasul = issues.some(function (it) { return it.severity === 'pasul'; });
  var kosher = !hasPasul && wallsRes.wallsOk && schachRes.heightOk && schachRes.shadeOk;
  var status = kosher ? 'kosher' : (hasPasul ? 'pasul' : 'incomplete');
  return { kosher: kosher, status: status, issues: issues, shadeRatio: schachRes.shadeRatio, measurements: measurements };
};

<script>
/* ---------------------------------------------- 13. DIAGNOSTIC OVERLAY */
/* Called by the scene renderer (p16) after it draws the real materials, so
   the overlay is a translucent wash + markers on top - never a substitute
   for the art, and never a drawn sun/light source (shade is read straight
   off schach coverage, HALACHA.md 2.7). Tap targets go through the same
   SA.Pick list as placement so one hit-test code path covers both. */
SA.Overlay = {};

SA.Overlay.roofCellTint = function (ctx, quad, cls) {
  var color = cls.type === 'kosher' ? 'rgba(70,200,110,0.35)'
    : cls.type === 'avir' ? 'rgba(120,170,220,0.28)'
    : 'rgba(220,90,70,0.38)';
  SA.Draw.poly(ctx, quad, color, null);
};

SA.Overlay.lavudBeam = function (ctx, a, b) {
  ctx.save();
  ctx.strokeStyle = 'rgba(70,220,230,0.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
};

SA.Overlay.issueMarker = function (ctx, sx, sy, severity) {
  var color = severity === 'pasul' ? '#e05b46' : severity === 'incomplete' ? '#e0b23c' : '#4fb7c9';
  ctx.save();
  ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 7);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  SA.Draw.text(ctx, '!', sx, sy + 0.5, { size: 12, color: '#1b1b1b', weight: '800' });
  ctx.restore();
