<script>
/* ---------------------------------------------- 16. 3D SCENE RENDERER */
/* Painter's algorithm: every drawable (floor cell, wall panel, schach tile,
   decoration) gets a depth key from SA.Iso.depthKey and is drawn back to
   front. SA.Pick.list is rebuilt here every frame with the exact quad each
   drawable used, so tap hit-testing (p18) is always pixel-exact, even
   mid-rotation. Step-inside mode (p03 SA.Camera.inside) hides the walls so
   the player can look straight up at the schach - never a drawn sun. */
SA.Scene = {};

function saQuadFloor(x, z, cx, cz) {
  return [
    SA.Iso.project(x, 0, z, cx, cz), SA.Iso.project(x + 1, 0, z, cx, cz),
    SA.Iso.project(x + 1, 0, z + 1, cx, cz), SA.Iso.project(x, 0, z + 1, cx, cz)
  ];
}
function saQuadSchach(x, z, y, cx, cz) {
  return [
    SA.Iso.project(x, y, z, cx, cz), SA.Iso.project(x + 1, y, z, cx, cz),
    SA.Iso.project(x + 1, y, z + 1, cx, cz), SA.Iso.project(x, y, z + 1, cx, cz)
  ];
}
function saQuadWall(side, col, w, row, h, footprint, cx, cz) {
  var W = footprint.w, D = footprint.d;
  if (side === 'N') return [SA.Iso.project(col, row + h, 0, cx, cz), SA.Iso.project(col + w, row + h, 0, cx, cz),
    SA.Iso.project(col + w, row, 0, cx, cz), SA.Iso.project(col, row, 0, cx, cz)];
  if (side === 'S') return [SA.Iso.project(W - col, row + h, D, cx, cz), SA.Iso.project(W - col - w, row + h, D, cx, cz),
    SA.Iso.project(W - col - w, row, D, cx, cz), SA.Iso.project(W - col, row, D, cx, cz)];
  if (side === 'E') return [SA.Iso.project(W, row + h, col, cx, cz), SA.Iso.project(W, row + h, col + w, cx, cz),
    SA.Iso.project(W, row, col + w, cx, cz), SA.Iso.project(W, row, col, cx, cz)];
  return [SA.Iso.project(0, row + h, D - col, cx, cz), SA.Iso.project(0, row + h, D - col - w, cx, cz),
    SA.Iso.project(0, row, D - col - w, cx, cz), SA.Iso.project(0, row, D - col, cx, cz)];
}
function saWallCellWorld(side, col, footprint) {
  var W = footprint.w, D = footprint.d;
  if (side === 'N') return { x: col + 0.5, z: 0 };
  if (side === 'S') return { x: W - col - 0.5, z: D };
  if (side === 'E') return { x: W, z: col + 0.5 };
  return { x: 0, z: D - col - 0.5 };
}

SA.Scene.render = function (ctx, state, result) {
  var view = SA.View;
  SA.BG.render(ctx, view, state.siteId || 'meadow');
  SA.Iso.setViewport(view.w, view.h);
  SA.Camera.insideFocusY = state.roofHeight;
  SA.Pick.reset();

  var w = state.footprint.w, d = state.footprint.d;
  var cx = w / 2, cz = d / 2;
  var jobs = [];
  var cls = result && result.measurements && result.measurements.cellClass;

  /* floor */
  for (var x = 0; x < w; x++) {
    for (var z = 0; z < d; z++) {
      var quad = saQuadFloor(x, z, cx, cz);
      var depth = SA.Iso.depthKey(x + 0.5, 0, z + 0.5, cx, cz);
      jobs.push({ depth: depth, draw: (function (q, xx, zz) {
        return function () {
          var checker = (xx + zz) % 2 === 0;
          SA.Draw.poly(ctx, q, checker ? 'rgba(196,178,140,0.9)' : 'rgba(179,161,124,0.9)', 'rgba(0,0,0,0.12)', 1);
          SA.Pick.add('floor_cell', { x: xx, z: zz }, q);
        };
      })(quad, x, z) });
    }
  }

  /* walls (hidden entirely in step-inside mode so the schach is unobstructed) */
  if (!SA.Camera.inside) {
    for (var si = 0; si < SA.WALL_SIDES.length; si++) {
      var side = SA.WALL_SIDES[si];
      var wall = state.walls[side];
      for (var pi = 0; pi < wall.panels.length; pi++) {
        var p = wall.panels[pi];
        var entry = SA.State.materialById(p.matId);
        if (!entry) continue;
        (function (side2, p2, entry2) {
          var wq = saQuadWall(side2, p2.col, p2.w, p2.row, p2.h, state.footprint, cx, cz);
          var wc = saWallCellWorld(side2, p2.col + p2.w / 2, state.footprint);
          var depth2 = SA.Iso.depthKey(wc.x, p2.row + p2.h / 2, wc.z, cx, cz);
          jobs.push({ depth: depth2, draw: function () {
            if (entry2.matKind === 'animal') SA.Draw.animalPanel(ctx, wq, entry2, p2);
            else SA.Draw.wallPanel(ctx, wq, entry2);
            SA.Pick.add('wall_cell', { side: side2, col: p2.col, uid: p2.uid }, wq);
          } });
        })(side, p, entry);
      }
      /* thin empty-cell pick targets, so a bare wall column can still be tapped to place */
      var length = SA.State.wallLength(state, side);
      for (var c = 0; c < length; c++) {
        if (wall.occ[c + '_0']) continue;
        (function (side3, col3) {
          var eq = saQuadWall(side3, col3, 1, 0, SA.Rule.WALL_MIN_HEIGHT, state.footprint, cx, cz);
          var wc3 = saWallCellWorld(side3, col3 + 0.5, state.footprint);
          var depth3 = SA.Iso.depthKey(wc3.x, SA.Rule.WALL_MIN_HEIGHT / 2, wc3.z, cx, cz);
          jobs.push({ depth: depth3, draw: function () {
            SA.Draw.poly(ctx, eq, 'rgba(255,255,255,0.03)', null);
            SA.Pick.add('wall_cell', { side: side3, col: col3, uid: null }, eq);
          } });
        })(side, c);
      }
    }
  }

  /* schach */
  for (var sx = 0; sx < w; sx++) {
    for (var sz = 0; sz < d; sz++) {
      var cell = state.schach[sx][sz];
      var sq = saQuadSchach(sx, sz, state.roofHeight, cx, cz);
      var sdepth = SA.Iso.depthKey(sx + 0.5, state.roofHeight, sz + 0.5, cx, cz);
      (function (q4, xx4, zz4, cell4) {
        jobs.push({ depth: sdepth, draw: function () {
          if (cell4) {
            var sEntry = SA.Mat.SCHACH_BY_ID[cell4.matId];
            if (sEntry) SA.Draw.schachTile(ctx, q4, sEntry);
          } else {
            SA.Draw.poly(ctx, q4, 'rgba(140,180,220,0.10)', 'rgba(255,255,255,0.06)', 1);
          }
          if (state.overlayOn && cls && cls[xx4] && cls[xx4][zz4]) {
            SA.Overlay.roofCellTint(ctx, q4, cls[xx4][zz4]);
          }
          SA.Pick.add('schach_cell', { x: xx4, z: zz4 }, q4);
        } });
      })(sq, sx, sz, cell);
    }
  }

  /* decorations */
  for (var di = 0; di < state.decor.length; di++) {
    var dec = state.decor[di];
    var dEntry = SA.Mat.DECOR_BY_ID[dec.matId];
    if (!dEntry) continue;
    (function (dec5, dEntry5) {
      var y5 = dec5.hang ? Math.max(0.3, state.roofHeight - dec5.clearance) : 0.6;
      var pt5 = SA.Iso.project(dec5.x + 0.5, y5, dec5.z + 0.5, cx, cz);
      var depth5 = SA.Iso.depthKey(dec5.x + 0.5, y5, dec5.z + 0.5, cx, cz);
      var half = 11;
      var iconQuad = [
        { sx: pt5.sx - half, sy: pt5.sy - half }, { sx: pt5.sx + half, sy: pt5.sy - half },
        { sx: pt5.sx + half, sy: pt5.sy + half }, { sx: pt5.sx - half, sy: pt5.sy + half }
      ];
      jobs.push({ depth: depth5, draw: function () {
        SA.Draw.decorIcon(ctx, pt5.sx, pt5.sy, 1, dEntry5);
        SA.Pick.add('decor_item', { uid: dec5.uid }, iconQuad);
      } });
    })(dec, dEntry);
  }

  jobs.sort(function (a, b) { return a.depth - b.depth; });
  for (var ji = 0; ji < jobs.length; ji++) jobs[ji].draw();

  /* overlay extras, drawn last so they float on top of the real materials */
  if (state.overlayOn && result) {
    SA.Scene.drawDofenAkumahBand(ctx, state, cx, cz);
    SA.Scene.drawTwentyAmosLine(ctx, state, cx, cz);
    SA.Scene.drawLavudBeams(ctx, state, result, cx, cz);
    SA.Scene.drawIssueMarkers(ctx, state, result, cx, cz);
  }
  if (!SA.Camera.inside && !(SA.Game.level && SA.Game.level.lockFootprint) && !SA.Game.modal) {
    SA.Scene.drawFootprintHandles(ctx, state, cx, cz);
  }
};

/* Amber wash 4 tefachim deep along the inside of every wall - the zone where
   dofen akumah could apply (HALACHA.md 1.9); a reference band, not tied to
   whether that strip currently has any pasul schach in it. */
SA.Scene.drawDofenAkumahBand = function (ctx, state, cx, cz) {
  var w = state.footprint.w, d = state.footprint.d, band = Math.min(SA.Rule.DECOR_CLEARANCE, Math.floor(Math.min(w, d) / 2));
  if (band <= 0) return;
  var y = state.roofHeight;
  var rects = [
    [0, 0, w, band], [0, d - band, w, band],
    [0, 0, band, d], [w - band, 0, band, d]
  ];
  ctx.save();
  for (var i = 0; i < rects.length; i++) {
    var r = rects[i];
    var q = [
      SA.Iso.project(r[0], y, r[1], cx, cz), SA.Iso.project(r[0] + r[2], y, r[1], cx, cz),
      SA.Iso.project(r[0] + r[2], y, r[1] + r[3], cx, cz), SA.Iso.project(r[0], y, r[1] + r[3], cx, cz)
    ];
    SA.Draw.poly(ctx, q, SA.Overlay.dofenAkumahBandColor, 'rgba(230,150,60,0.35)', 1);
  }
  ctx.restore();
};

SA.Scene.drawTwentyAmosLine = function (ctx, state, cx, cz) {
  var w = state.footprint.w, d = state.footprint.d, y = SA.Rule.ROOF_MAX_KOSHER;
  if (state.roofHeight < y - 20) return; // only worth showing once the player is getting close
  var a = SA.Iso.project(0, y, 0, cx, cz), b = SA.Iso.project(w, y, 0, cx, cz);
  var c = SA.Iso.project(w, y, d, cx, cz), e = SA.Iso.project(0, y, d, cx, cz);
  ctx.save();
  ctx.strokeStyle = SA.Overlay.twentyAmosColor; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(e.sx, e.sy); ctx.lineTo(a.sx, a.sy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  SA.Draw.text(ctx, '20 Amos - the height ceiling', a.sx, a.sy - 14, { size: 11, color: SA.Overlay.twentyAmosColor });
};

SA.Scene.drawLavudBeams = function (ctx, state, result, cx, cz) {
  var bridges = result.measurements && result.measurements.lavudBridges;
  if (!bridges) return;
  for (var i = 0; i < bridges.length; i++) {
    var br = bridges[i];
    var y = SA.Rule.LAVUD / 2;
    var a = saWallCellWorld(br.side, br.colStart, state.footprint);
    var b = saWallCellWorld(br.side, br.colEnd, state.footprint);
    var pa = SA.Iso.project(a.x, y, a.z, cx, cz), pb = SA.Iso.project(b.x, y, b.z, cx, cz);
    SA.Overlay.lavudBeam(ctx, pa, pb);
  }
};

SA.Scene.drawFootprintHandles = function (ctx, state, cx, cz) {
  var h = SA.Scene.footprintHandles(state);
  var pts = [h.width, h.depth];
  for (var i = 0; i < pts.length; i++) {
    ctx.save();
    ctx.beginPath(); ctx.arc(pts[i].sx, pts[i].sy, 11, 0, 7);
    ctx.fillStyle = 'rgba(240,217,138,0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
  SA.Draw.text(ctx, SA.Lang.fmt('{n} tefachim', { n: state.footprint.w }), h.width.sx, h.width.sy - 18, { size: 11, color: '#fff', shadow: true });
  SA.Draw.text(ctx, SA.Lang.fmt('{n} tefachim', { n: state.footprint.d }), h.depth.sx, h.depth.sy - 18, { size: 11, color: '#fff', shadow: true });
};

SA.Scene.drawIssueMarkers = function (ctx, state, result, cx, cz) {
  var seen = {};
  for (var i = 0; i < result.issues.length; i++) {
    var it = result.issues[i];
    if (!it.anchor || it.severity === 'lchatchila') continue;
    var wx, wz, wy;
    if (it.anchor.side) {
      var wc = saWallCellWorld(it.anchor.side, it.anchor.col + 0.5, state.footprint);
      wx = wc.x; wz = wc.z; wy = SA.Rule.WALL_MIN_HEIGHT * 0.6;
    } else {
      wx = it.anchor.x; wz = it.anchor.z; wy = state.roofHeight;
    }
    var key = Math.round(wx * 4) + '_' + Math.round(wz * 4) + '_' + Math.round(wy);
    if (seen[key]) continue;
    seen[key] = true;
    var pt = SA.Iso.project(wx, wy, wz, cx, cz);
    SA.Overlay.issueMarker(ctx, pt.sx, pt.sy, it.severity);
    SA.Pick.add('issue_marker', { issue: it }, [
      { sx: pt.sx - 10, sy: pt.sy - 10 }, { sx: pt.sx + 10, sy: pt.sy - 10 },
      { sx: pt.sx + 10, sy: pt.sy + 10 }, { sx: pt.sx - 10, sy: pt.sy + 10 }
    ]);
  }
};

/* Footprint resize handles - brute-force nearest-integer search over the
   live camera projection, so dragging works correctly at any rotation
   without inverting the iso+rotation matrix by hand. */
SA.Scene.footprintHandles = function (state) {
  var w = state.footprint.w, d = state.footprint.d, cx = w / 2, cz = d / 2;
  return {
    width: SA.Iso.project(w, 0, 0, cx, cz),
    depth: SA.Iso.project(0, 0, d, cx, cz)
  };
};

SA.Scene.nearestWidthForPoint = function (state, px, py) {
  var d = state.footprint.d, cz = d / 2, best = state.footprint.w, bestDist = Infinity;
  for (var wv = SA.Rule.FLOOR_MIN; wv <= SA.Rule.FLOOR_MAX; wv++) {
    var pt = SA.Iso.project(wv, 0, 0, wv / 2, cz);
    var dx = pt.sx - px, dy = pt.sy - py;
    var dist = dx * dx + dy * dy;
    if (dist < bestDist) { bestDist = dist; best = wv; }
  }
  return best;
};

SA.Scene.nearestDepthForPoint = function (state, px, py) {
  var w = state.footprint.w, cx = w / 2, best = state.footprint.d, bestDist = Infinity;
  for (var dv = SA.Rule.FLOOR_MIN; dv <= SA.Rule.FLOOR_MAX; dv++) {
    var pt = SA.Iso.project(0, 0, dv, cx, dv / 2);
    var dx = pt.sx - px, dy = pt.sy - py;
    var dist = dx * dx + dy * dy;
    if (dist < bestDist) { bestDist = dist; best = dv; }
  }
  return best;
};
</script>
<script>
/* ---------------------------------------------- 17. GAME STATE + 2D UI */
/* Title / Sandbox / Halacha Challenges / Cards, plus every HUD and modal.
   Every button goes through SA.UI.btn, which draws with the shared
   SA.Draw.button and registers exactly one SA.Pick rect - one hit-testing
   path for the whole game (p11). Sandbox is the main mode (locked answer);
   levels are a guided on-ramp that hands back into it. */
SA.Game = {
  screen: 'title',
  state: null,
  level: null,
  levelDone: false,
  modal: null,
  modalCard: null,
  modalScroll: 0,
  selectedPanel: null,
  selectedDecor: null,
  lastResult: null,
  pendingReward: null
};

SA.Game.goTitle = function () { SA.Game.screen = 'title'; SA.Game.modal = null; SA.Game.modalCard = null; };

SA.Game.newSandbox = function (siteId) {
  SA.Game.level = null;
  SA.Game.levelDone = false;
  SA.Game.state = SA.State.create(10, 10, 11, siteId || 'meadow');
  SA.Game.screen = 'sandbox';
  SA.Game.modal = null;
  SA.Game.modalCard = null;
  SA.Tool.category = 'wall';
  SA.Tool.materialId = null;
  SA.Save.markDirty();
};

SA.Game.continueSandbox = function () {
  var loaded = SA.Save.load();
  if (loaded) { SA.Game.state = loaded; SA.Game.level = null; SA.Game.screen = 'sandbox'; SA.Game.modal = null; }
  else SA.Game.newSandbox('meadow');
};

SA.Game.goLevels = function () { SA.Game.screen = 'levels'; SA.Game.modal = null; SA.Game.modalCard = null; };
SA.Game.goCards = function () { SA.Game.screen = 'cards'; SA.Game.modal = 'card_list'; SA.Game.modalCard = null; SA.Game.modalScroll = 0; };

SA.Game.startLevel = function (levelId) {
  var lvl = SA.Levels.byId[levelId];
  if (!lvl) return;
  SA.Game.level = lvl;
  SA.Game.levelDone = false;
  SA.Game.state = SA.State.create(lvl.footprint.w, lvl.footprint.d, 11, lvl.site || 'meadow');
  if (lvl.grantElephant) { /* nothing to pre-place; the elephant just appears in the picker for this level */ }
  SA.Game.screen = 'sandbox';
  SA.Game.modal = null;
  SA.Game.modalCard = null;
  SA.Tool.category = 'wall';
  SA.Tool.materialId = null;
};

SA.Game.checkLevelGoal = function (result) {
  if (!SA.Game.level || SA.Game.levelDone) return;
  if (SA.Levels.checkGoal(SA.Game.level, result)) {
    SA.Game.levelDone = true;
    var reward = SA.Progress.rewardPools[SA.Game.level.id];
    SA.Progress.grant(reward);
    SA.Progress.markLevelDone(SA.Game.level.id);
    SA.Game.pendingReward = reward;
    SA.Game.modal = 'level_complete';
  }
};

/* ---------------------------------------------- 17a. LAYOUT HELPERS */
SA.UI = {};
SA.UI.btn = function (ctx, x, y, w, h, label, kind, payload, active) {
  SA.Draw.button(ctx, x, y, w, h, label, active);
  SA.Pick.addRect(kind || 'ui_noop', payload, x, y, w, h);
};

SA.UI.backdrop = function (ctx) {
  ctx.fillStyle = 'rgba(6,8,12,0.72)';
  ctx.fillRect(0, 0, SA.View.w, SA.View.h);
  SA.Pick.addRect('modal_backdrop', {}, 0, 0, SA.View.w, SA.View.h);
};

SA.UI.panel = function (ctx, x, y, w, h) {
  SA.Draw.roundRect(ctx, x, y, w, h, 16);
  ctx.fillStyle = '#181c26'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1.5; ctx.stroke();
};

/* ---------------------------------------------- 17b. TITLE SCREEN */
SA.UI.renderTitle = function (ctx) {
  SA.Pick.reset();
  var w = SA.View.w, h = SA.View.h, safe = SA.View.safe;
  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#243044'); g.addColorStop(1, '#0e1420');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  SA.Draw.text(ctx, 'SUKKAH ARCHITECT', w / 2, h * 0.22, { size: 30, color: '#f0d98a', weight: '800' });
  SA.Draw.text(ctx, 'Design a kosher sukkah, piece by piece.', w / 2, h * 0.22 + 34, { size: 15, color: 'rgba(255,255,255,0.75)' });

  var bw = Math.min(320, w - 48), bx = (w - bw) / 2;
  var by = h * 0.42;
  SA.UI.btn(ctx, bx, by, bw, 64, 'Sandbox', 'title_sandbox', {});
  SA.UI.btn(ctx, bx, by + 78, bw, 64, 'Halacha Challenges', 'title_levels', {});
  SA.UI.btn(ctx, bx, by + 156, bw, 54, 'Halacha Cards', 'title_cards', {});

  var row = by + 156 + 66;
  if (SA.Host.inApp()) {
    SA.UI.btn(ctx, bx, row, bw, 54, 'MORE GAMES', 'title_more_games', {});
    row += 66;
  }
  if (!SA.Lang.locked()) {
    SA.UI.btn(ctx, bx, row, bw, 44, SA.Lang.isHe() ? 'English' : 'עברית', 'title_lang', {});
  }
  var shiur = safe.b + 18;
  SA.Draw.text(ctx, SA.Shiur.current === 'naeh' ? 'Rav Chaim Naeh' : 'Chazon Ish', w - 70, h - shiur, { size: 12, color: 'rgba(255,255,255,0.55)' });
  SA.Pick.addRect('title_shiur', {}, w - 130, h - shiur - 16, 120, 30);
};

SA.UI.onTitleTap = function (hit) {
  if (hit.kind === 'title_sandbox') SA.Game.continueSandbox();
  else if (hit.kind === 'title_levels') SA.Game.goLevels();
  else if (hit.kind === 'title_cards') SA.Game.goCards();
  else if (hit.kind === 'title_more_games') { try { location.href = 'mitz://game/dash'; } catch (e) {} }
  else if (hit.kind === 'title_lang') SA.Lang.set(SA.Lang.isHe() ? 'en' : 'he');
  else if (hit.kind === 'title_shiur') SA.Shiur.current = SA.Shiur.current === 'naeh' ? 'chazonish' : 'naeh';
};

/* ---------------------------------------------- 17c. LEVEL SELECT */
SA.UI.renderLevels = function (ctx) {
  SA.Pick.reset();
  var w = SA.View.w, h = SA.View.h, safe = SA.View.safe;
  ctx.fillStyle = '#12151d'; ctx.fillRect(0, 0, w, h);
  SA.UI.btn(ctx, safe.l + 8, safe.t + 8, 70, 40, 'BACK', 'levels_back', {});
  SA.Draw.text(ctx, 'Halacha Challenges', w / 2, safe.t + 30, { size: 20, color: '#fff', weight: '700' });

  var top = safe.t + 64, cols = 4;
  var cell = Math.min(84, (w - safe.l - safe.r - 24) / cols);
  var gridW = cell * cols;
  var startX = (w - gridW) / 2;
  for (var i = 0; i < SA.Levels.length; i++) {
    var lvl = SA.Levels[i];
    var row = Math.floor(i / cols), col = i % cols;
    var x = startX + col * cell + 4, y = top + row * (cell + 10) + 4;
    var size = cell - 8;
    var done = !!SA.Progress.completed[lvl.id];
    SA.Draw.roundRect(ctx, x, y, size, size, 12);
    ctx.fillStyle = done ? 'rgba(90,190,110,0.28)' : 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = done ? 'rgba(120,220,140,0.8)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5; ctx.stroke();
    SA.Draw.text(ctx, String(i + 1), x + size / 2, y + size / 2 - 6, { size: 18, color: '#fff', weight: '700' });
    if (done) SA.Draw.text(ctx, '\u2713', x + size / 2, y + size / 2 + 16, { size: 13, color: '#9ee6ac' });
    SA.Pick.addRect('level_node', { id: lvl.id }, x, y, size, size);
  }
  var lastY = top + Math.ceil(SA.Levels.length / cols) * (cell + 10) + 10;
  SA.Draw.text(ctx, 'Tap a level to see its title and start.', w / 2, lastY + 10, { size: 12, color: 'rgba(255,255,255,0.55)' });
};

SA.UI.onLevelsTap = function (hit) {
  if (hit.kind === 'levels_back') SA.Game.goTitle();
  else if (hit.kind === 'level_node') SA.Game.startLevel(hit.payload.id);
};

/* ---------------------------------------------- 17d. CARDS BROWSER */
SA.UI.renderCards = function (ctx) {
  SA.Pick.reset();
  var w = SA.View.w, h = SA.View.h, safe = SA.View.safe;
  ctx.fillStyle = '#12151d'; ctx.fillRect(0, 0, w, h);
  SA.UI.btn(ctx, safe.l + 8, safe.t + 8, 70, 40, 'BACK', 'cards_back', {});
  SA.Draw.text(ctx, 'Halacha Cards', w / 2, safe.t + 30, { size: 20, color: '#fff', weight: '700' });

  if (SA.Game.modalCard) { SA.UI.renderCardDetail(ctx, SA.Cards.byId[SA.Game.modalCard]); return; }

  var top = safe.t + 64, rowH = 62;
  var listX = safe.l + 12, listW = w - safe.l - safe.r - 24;
  ctx.save();
  ctx.beginPath(); ctx.rect(listX, top, listW, h - top - safe.b - 8); ctx.clip();
  var yy = top - SA.Game.modalScroll;
  for (var i = 0; i < SA.Cards.length; i++) {
    var c = SA.Cards[i];
    if (yy + rowH > top && yy < h - safe.b) {
      SA.Draw.roundRect(ctx, listX, yy + 4, listW, rowH - 8, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; ctx.stroke();
      SA.Draw.text(ctx, c.title, listX + 16, yy + rowH / 2, { size: 15, color: '#fff', align: 'left' });
      SA.Pick.addRect('card_row', { id: c.id }, listX, yy + 4, listW, rowH - 8);
    }
    yy += rowH;
  }
  ctx.restore();
  SA.Game.modalScrollMax = Math.max(0, SA.Cards.length * rowH - (h - top - safe.b - 8));
};

SA.UI.renderCardDetail = function (ctx, card) {
  var w = SA.View.w, h = SA.View.h, safe = SA.View.safe;
  var px = safe.l + 16, py = safe.t + 70, pw = w - safe.l - safe.r - 32, ph = h - py - safe.b - 16;
  SA.UI.panel(ctx, px, py, pw, ph);
  var cy = py + 30;
  SA.Draw.text(ctx, card.title, px + pw / 2, cy, { size: 18, color: '#f0d98a', weight: '700' });
  cy += 34;
  ctx.direction = 'rtl';
  SA.Draw.text(ctx, card.hebrew, px + pw / 2, cy, { size: 17, color: '#fff' });
  cy += 40;
  var lines = SA.UI.wrapText(ctx, SA.Lang.t(card.body), pw - 32, 14);
  for (var i = 0; i < lines.length; i++) { SA.Draw.text(ctx, lines[i], px + pw / 2, cy, { size: 14, color: 'rgba(255,255,255,0.88)' }); cy += 20; }
  cy += 8;
  for (var t = 0; t < card.terms.length; t++) {
    SA.Draw.text(ctx, card.terms[t][0] + ' - ' + card.terms[t][1], px + pw / 2, cy, { size: 12, color: 'rgba(210,200,160,0.9)' });
    cy += 18;
  }
  cy += 6;
  SA.Draw.text(ctx, card.source, px + pw / 2, cy, { size: 12, color: 'rgba(255,255,255,0.5)' });
  SA.UI.btn(ctx, px + pw / 2 - 60, py + ph - 52, 120, 40, 'Close', 'card_close', {});
};

SA.UI.wrapText = function (ctx, text, maxW, size) {
  ctx.font = '500 ' + size + 'px "Segoe UI", Arial, sans-serif';
  var words = text.split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
};

SA.UI.onCardsTap = function (hit) {
  if (hit.kind === 'cards_back') { if (SA.Game.modalCard) { SA.Game.modalCard = null; } else SA.Game.goTitle(); }

};

/* ---------------------------------------------- 17e. SANDBOX HUD */
SA.UI.KOSHER_COLOR = { kosher: '#4fbf6a', incomplete: '#e0b23c', pasul: '#e05b46' };

  var row1 = [

    ['Schach', 'sb_tab_schach', SA.Tool.category === 'schach'],

/* ---------------------------------------------- 17f. MATERIAL AVAILABILITY */
SA.Game.availableMaterials = function (category) {
  var lvl = SA.Game.level;
  if (category === 'wall') {
    var list = [];
    for (var i = 0; i < SA.Mat.WALL.length; i++) {
      var m = SA.Mat.WALL[i];
      if (lvl && lvl.familyWhitelist && lvl.familyWhitelist.indexOf(m.family.id) < 0) continue;
      if (lvl && lvl.formWhitelist && lvl.formWhitelist.indexOf(m.form.id) < 0) continue;
      if (!lvl && SA.Progress.unlocked.families.indexOf(m.family.id) < 0) continue;
      list.push(m);
    }
    var animals = SA.Mat.ANIMALS.filter(function (a) {
      return lvl ? true : SA.Progress.unlocked.animals.indexOf(a.id) >= 0;
    });
    return list.concat(animals);
  }
  if (category === 'schach') return SA.Mat.SCHACH.slice();
  if (category === 'decor') {
    return SA.Mat.DECOR.filter(function (d) {
      return lvl ? true : SA.Progress.unlocked.decorCats.indexOf(d.category) >= 0;
    });
  }
  return [];
};

SA.UI.materialSwatchColor = function (m) {
  if (m.matKind === 'animal') return m.tone;
  if (m.family) return m.family.base;
  if (m.tone) return m.tone;
  return '#888';
};
SA.UI.materialLabel = function (m) {
  if (m.family && m.form && m.finish) return SA.Mat.wallName(m);
  return m.en;
};

SA.UI.renderSandboxModal = function (ctx, result) {

  } else if (m === 'level_complete') {

  }
};

SA.UI.renderMaterialPicker = function (ctx, category) {
  SA.UI.backdrop(ctx);
  var w = SA.View.w, h = SA.View.h, safe = SA.View.safe;
  var px = safe.l + 10, py = safe.t + 60, pw = w - safe.l - safe.r - 20, ph = h - py - safe.b - 20;
  SA.UI.panel(ctx, px, py, pw, ph);
  var title = category === 'wall' ? 'Walls' : (category === 'schach' ? 'Schach' : 'Decorations');
  SA.Draw.text(ctx, title, px + pw / 2, py + 26, { size: 17, color: '#fff', weight: '700' });
  SA.UI.btn(ctx, px + pw - 70, py + 8, 56, 36, 'Close', 'modal_close', {});

  var list = SA.Game.availableMaterials(category);
  var cols = pw > 460 ? 4 : 3;
  var cellW = (pw - 24) / cols, cellH = 96;
  var gridTop = py + 46;
  ctx.save();
  ctx.beginPath(); ctx.rect(px, gridTop, pw, ph - 46 - 20); ctx.clip();
  var yy = gridTop - SA.Game.modalScroll;
  for (var i = 0; i < list.length; i++) {
    var mat = list[i];
    var col = i % cols, row = Math.floor(i / cols);
    var cx2 = px + 12 + col * cellW, cy2 = yy + row * cellH;
    if (cy2 + cellH > gridTop && cy2 < py + ph - 20) {
      var active = SA.Tool.category === category && SA.Tool.materialId === mat.id;
      SA.Draw.roundRect(ctx, cx2 + 4, cy2 + 4, cellW - 8, cellH - 12, 10);
      ctx.fillStyle = active ? 'rgba(240,217,138,0.22)' : 'rgba(255,255,255,0.05)'; ctx.fill();
      ctx.strokeStyle = active ? 'rgba(240,217,138,0.9)' : 'rgba(255,255,255,0.16)'; ctx.lineWidth = active ? 2 : 1; ctx.stroke();
      if (category === 'decor') SA.Draw.decorIcon(ctx, cx2 + cellW / 2 - 4, cy2 + 28, 1.3, mat);
      else {
        ctx.fillStyle = SA.UI.materialSwatchColor(mat);
        SA.Draw.roundRect(ctx, cx2 + cellW / 2 - 22, cy2 + 10, 44, 32, 6);
        ctx.fill();
      }
      var lbl = SA.UI.materialLabel(mat);
      SA.Draw.text(ctx, lbl, cx2 + cellW / 2 - 4, cy2 + cellH - 18, { size: 10.5, color: '#fff' });
      SA.Pick.addRect('material_pick', { category: category, id: mat.id }, cx2 + 4, cy2 + 4, cellW - 8, cellH - 12);
    }
    yy = yy; // no-op, row advances via loop math
  }
  ctx.restore();
  var rows = Math.ceil(list.length / cols);
  SA.Game.modalScrollMax = Math.max(0, rows * cellH - (ph - 46 - 20));
};

SA.UI.renderSizeModal = function (ctx) {

SA.UI.renderIssuesModal = function (ctx, result) {

SA.UI.renderLevelCompleteModal = function (ctx) {

/* ---------------------------------------------- 17h. SANDBOX TAP DISPATCH */
SA.UI.onSandboxTap = function (hit) {
  var st = SA.Game.state;
  if (hit.kind === 'modal_close' || hit.kind === 'card_close') { SA.Game.modal = null; SA.Game.modalCard = null; return; }
  if (hit.kind === 'modal_backdrop') { SA.Game.modal = null; SA.Game.modalCard = null; return; }
  if (hit.kind === 'sb_back') { SA.Save.markDirty(); SA.Save.flush(); SA.Game.screen = SA.Game.level ? 'levels' : 'title'; return; }
  if (hit.kind === 'sb_meter') { SA.Game.modal = 'issues'; SA.Game.modalScroll = 0; return; }
  if (hit.kind === 'sb_hint') return;
  if (hit.kind === 'sb_tab_wall') { SA.Tool.category = 'wall'; SA.Game.modal = 'materials_wall'; SA.Game.modalScroll = 0; return; }
  if (hit.kind === 'sb_tab_schach') { SA.Tool.category = 'schach'; SA.Game.modal = 'materials_schach'; SA.Game.modalScroll = 0; return; }
  if (hit.kind === 'sb_tab_decor') { SA.Tool.category = 'decor'; SA.Game.modal = 'materials_decor'; SA.Game.modalScroll = 0; return; }
  if (hit.kind === 'sb_tab_erase') { SA.Tool.category = SA.Tool.category === 'erase' ? 'wall' : 'erase'; return; }
  if (hit.kind === 'sb_fill') {
    if (SA.Tool.category === 'schach') SA.Act.fillSchach(st);
    else if (SA.Tool.materialId) SA.Act.fillWall(st, SA.Tool.wallSide);
    return;
  }
  if (hit.kind === 'sb_rotate') { SA.Camera.rotateStep(1); return; }
  if (hit.kind === 'sb_inside') { SA.Camera.inside = !SA.Camera.inside; return; }
  if (hit.kind === 'sb_overlay') { st.overlayOn = !st.overlayOn; return; }
  if (hit.kind === 'sb_size') { SA.Game.modal = 'size'; return; }
  if (hit.kind === 'sb_share') { SA.Share.shareSukkah(st, SA.Game.lastResult); return; }

  if (hit.kind === 'material_pick') {
    SA.Tool.category = hit.payload.category;
    SA.Tool.materialId = hit.payload.id;
    SA.Game.modal = null;
    return;
  }

  if (hit.kind === 'floor_cell') return;
  if (hit.kind === 'wall_cell') { SA.UI.onWallCellTap(st, hit.payload); return; }
  if (hit.kind === 'schach_cell') { SA.UI.onSchachCellTap(st, hit.payload); return; }
  if (hit.kind === 'decor_item') { SA.Game.selectedDecor = hit.payload.uid; SA.Game.selectedPanel = null; return; }
  if (hit.kind === 'issue_marker') { if (hit.payload.issue.cardId) { SA.Game.modal = 'card'; SA.Game.modalCard = hit.payload.issue.cardId; } return; }
  if (hit.kind === 'issue_row') { if (hit.payload.cardId) { SA.Game.modal = 'card'; SA.Game.modalCard = hit.payload.cardId; } return; }

  if (hit.kind === 'sb_tie') { SA.Act.tieToggle(st, SA.Game.selectedPanel.side, SA.Game.selectedPanel.uid); return; }
  if (hit.kind === 'sb_posture') { SA.Act.postureToggle(st, SA.Game.selectedPanel.side, SA.Game.selectedPanel.uid); return; }
  if (hit.kind === 'sb_panel_erase') { SA.Act.eraseWall(st, SA.Game.selectedPanel.side, SA.State.findPanel(st, SA.Game.selectedPanel.side, SA.Game.selectedPanel.uid).col); SA.Game.selectedPanel = null; return; }
  if (hit.kind === 'sb_dec_less' || hit.kind === 'sb_dec_more') {
    var dec = null;
    for (var i = 0; i < st.decor.length; i++) if (st.decor[i].uid === SA.Game.selectedDecor) dec = st.decor[i];
    if (dec) SA.State.setDecorClearance(st, dec.uid, dec.clearance + (hit.kind === 'sb_dec_more' ? 1 : -1));
    SA.Save.markDirty();
    return;
  }
  if (hit.kind === 'sb_dec_erase') { SA.State.removeDecor(st, SA.Game.selectedDecor); SA.Game.selectedDecor = null; SA.Save.markDirty(); return; }

  if (hit.kind === 'size_w_minus') SA.Act.setFootprint(st, st.footprint.w - 1, st.footprint.d);
  if (hit.kind === 'size_w_plus') SA.Act.setFootprint(st, st.footprint.w + 1, st.footprint.d);
  if (hit.kind === 'size_d_minus') SA.Act.setFootprint(st, st.footprint.w, st.footprint.d - 1);
  if (hit.kind === 'size_d_plus') SA.Act.setFootprint(st, st.footprint.w, st.footprint.d + 1);
  if (hit.kind === 'size_h_minus') SA.Act.setRoofHeight(st, st.roofHeight - 1);
  if (hit.kind === 'size_h_plus') SA.Act.setRoofHeight(st, st.roofHeight + 1);

  if (hit.kind === 'levelc_card') { SA.Game.modal = 'card'; SA.Game.modalCard = SA.Game.level.cardId; }
  if (hit.kind === 'levelc_next') {
    var idx = SA.Levels.indexOf(SA.Game.level);
    SA.Game.modal = null;
    if (idx >= 0 && idx < SA.Levels.length - 1) SA.Game.startLevel(SA.Levels[idx + 1].id);
    else SA.Game.goLevels();
  }
};

SA.UI.onWallCellTap = function (st, payload) {
  SA.Tool.wallSide = payload.side;
  if (SA.Tool.category === 'erase') { SA.Act.eraseWall(st, payload.side, payload.col); return; }
  var entry = payload.uid ? SA.State.materialById(SA.State.findPanel(st, payload.side, payload.uid).matId) : null;
  if (payload.uid && entry && (entry.matKind === 'animal' || entry.swaysInWind)) {
    SA.Game.selectedPanel = { side: payload.side, uid: payload.uid };
    SA.Game.selectedDecor = null;
    return;
  }
  if (SA.Tool.category === 'wall' && SA.Tool.materialId) SA.Act.placeWall(st, payload.side, payload.col);
};

SA.UI.onSchachCellTap = function (st, payload) {
  if (SA.Tool.category === 'erase') { SA.Act.eraseSchach(st, payload.x, payload.z); return; }
  if (SA.Tool.category === 'schach' && SA.Tool.materialId) { SA.Act.placeSchach(st, payload.x, payload.z); return; }
  if (SA.Tool.category === 'decor' && SA.Tool.materialId) SA.Act.placeDecor(st, payload.x, payload.z);
};

SA.UI.onTap = function (px, py) {
  var hit = SA.Pick.hitTest(px, py);
  if (!hit) { if (SA.Game.modal && SA.Game.screen === 'sandbox') SA.Game.modal = null; return; }
  if (SA.Game.screen === 'title') SA.UI.onTitleTap(hit);
  else if (SA.Game.screen === 'levels') SA.UI.onLevelsTap(hit);
  else if (SA.Game.screen === 'cards') SA.UI.onCardsTap(hit);
  else if (SA.Game.screen === 'sandbox') SA.UI.onSandboxTap(hit);
};

SA.Lang.add({
  'Sukkah Size': 'גודל הסוכה',
  '{n} tefachim': '{n} טפחים',
  'Tap a level to see its title and start.': 'הקישו על שלב כדי לראות את הכותרת שלו ולהתחיל.',
  'No open issues right now.': 'אין כרגע הערות פתוחות.'
});

</script>
<script>
/* ---------------------------------------------- 18. POINTER INPUT */
/* One canvas, pointer events only (works for mouse, touch and pen alike).
   A single active pointer does tap-or-drag (footprint handle resize, or a
   modal's scroll list); a second simultaneous pointer switches to pinch
   zoom. Tap-vs-drag is decided by total movement, not by gesture velocity,
   so a slow careful placement never gets misread as a scroll. */
SA.Input = {
  pointers: {},
  primaryId: null,
  moved: false,
  dragMode: null,     // null | 'footprint_w' | 'footprint_d' | 'scroll'
  startX: 0, startY: 0,
  lastX: 0, lastY: 0,
  scrollBase: 0,
  pinchDist0: 0,
  pinchZoom0: 1
};

SA.Input.countPointers = function () {
  var n = 0;
  for (var k in SA.Input.pointers) n++;
  return n;
};

SA.Input.handleFootprintZone = function (x, y) {
  if (SA.Game.screen !== 'sandbox' || SA.Game.modal) return null;
  if (SA.Game.level && SA.Game.level.lockFootprint) return null;
  var handles = SA.Scene.footprintHandles(SA.Game.state);
  var dw = Math.hypot(x - handles.width.sx, y - handles.width.sy);
  var dd = Math.hypot(x - handles.depth.sx, y - handles.depth.sy);
  if (dw < 28 && dw <= dd) return 'footprint_w';
  if (dd < 28) return 'footprint_d';
  return null;
};

SA.Input.onDown = function (x, y) {
  SA.Input.moved = false;
  SA.Input.startX = x; SA.Input.startY = y;
  SA.Input.lastX = x; SA.Input.lastY = y;
  SA.Input.dragMode = SA.Input.handleFootprintZone(x, y);
  if (!SA.Input.dragMode && SA.Game.modal) {
    SA.Input.dragMode = 'scroll';
    SA.Input.scrollBase = SA.Game.modalScroll;
  }
};

SA.Input.onMove = function (x, y) {
  var dx = x - SA.Input.startX, dy = y - SA.Input.startY;
  if (Math.hypot(dx, dy) > 8) SA.Input.moved = true;
  if (!SA.Input.moved) { SA.Input.lastX = x; SA.Input.lastY = y; return; }
  if (SA.Input.dragMode === 'footprint_w') {
    SA.Act.setFootprint(SA.Game.state, SA.Scene.nearestWidthForPoint(SA.Game.state, x, y), SA.Game.state.footprint.d);
  } else if (SA.Input.dragMode === 'footprint_d') {
    SA.Act.setFootprint(SA.Game.state, SA.Game.state.footprint.w, SA.Scene.nearestDepthForPoint(SA.Game.state, x, y));
  } else if (SA.Input.dragMode === 'scroll') {
    var totalDy = y - SA.Input.startY;
    var next = SA.Input.scrollBase - totalDy;
    var max = SA.Game.modalScrollMax || 0;
    SA.Game.modalScroll = Math.max(0, Math.min(max, next));
  }
  SA.Input.lastX = x; SA.Input.lastY = y;
};

SA.Input.onUp = function (x, y) {
  if (!SA.Input.moved) SA.UI.onTap(x, y);
  SA.Input.dragMode = null;
};

SA.Input.pinchUpdate = function () {
  var ids = Object.keys(SA.Input.pointers);
  if (ids.length !== 2) return;
  var a = SA.Input.pointers[ids[0]], b = SA.Input.pointers[ids[1]];
  var dist = Math.hypot(a.x - b.x, a.y - b.y);
  if (!SA.Input.pinchDist0) { SA.Input.pinchDist0 = dist; SA.Input.pinchZoom0 = SA.Camera.zoom; return; }
  var ratio = dist / Math.max(1, SA.Input.pinchDist0);
  SA.Camera.zoom = Math.max(SA.Camera.minZoom, Math.min(SA.Camera.maxZoom, SA.Input.pinchZoom0 * ratio));
};

SA.Input.toLocal = function (e) {
  var rect = SA.View.canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
};

SA.Input.bind = function () {
  var cv = SA.View.canvas;
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = SA.Input.toLocal(e);
    SA.Input.pointers[e.pointerId] = p;
    var n = SA.Input.countPointers();
    if (n === 1) { SA.Input.primaryId = e.pointerId; SA.Input.onDown(p.x, p.y); }
    else if (n === 2) { SA.Input.pinchDist0 = 0; SA.Input.dragMode = null; }
  }, { passive: false });

  cv.addEventListener('pointermove', function (e) {
    if (!(e.pointerId in SA.Input.pointers)) return;
    var p = SA.Input.toLocal(e);
    SA.Input.pointers[e.pointerId] = p;
    var n = SA.Input.countPointers();
    if (n >= 2) SA.Input.pinchUpdate();
    else if (n === 1 && e.pointerId === SA.Input.primaryId) SA.Input.onMove(p.x, p.y);
  }, { passive: false });

  function release(e) {
    if (!(e.pointerId in SA.Input.pointers)) return;
    var wasPrimary = e.pointerId === SA.Input.primaryId;
    var p = SA.Input.toLocal(e);
    delete SA.Input.pointers[e.pointerId];
    SA.Input.pinchDist0 = 0;
    if (wasPrimary) {
      SA.Input.onUp(p.x, p.y);
      SA.Input.primaryId = null;
      var remaining = Object.keys(SA.Input.pointers);
      if (remaining.length) { SA.Input.primaryId = Number(remaining[0]); SA.Input.onDown(SA.Input.pointers[remaining[0]].x, SA.Input.pointers[remaining[0]].y); }
    }
  }
  cv.addEventListener('pointerup', release, { passive: false });
  cv.addEventListener('pointercancel', release, { passive: false });

  cv.addEventListener('wheel', function (e) {
    if (SA.Game.screen !== 'sandbox') return;
    e.preventDefault();
    var delta = e.deltaY < 0 ? 1.06 : 0.94;
    SA.Camera.zoom = Math.max(SA.Camera.minZoom, Math.min(SA.Camera.maxZoom, SA.Camera.zoom * delta));
  }, { passive: false });

  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
};
</script>
<script>
/* ---------------------------------------------- 19. PROGRESS + AUTOSAVE */
/* Sandbox is the main mode; the ladder in p15 only ever ADDS to what the
   sandbox can already do. Unlocks and the current build both live in
   localStorage - there is no account/server anywhere in this game. */
SA.Progress.unlocked = {
  families: SA.Progress.STARTER_FAMILIES.slice(),
  sites: SA.Progress.STARTER_SITES.slice(),
  decorCats: SA.Progress.STARTER_DECOR_CATS.slice(),
  animals: SA.Progress.STARTER_ANIMALS.slice()
};
SA.Progress.completed = {};
SA.Progress.STORE_KEY = 'sukkah_architect.progress';

SA.Progress.grant = function (reward) {
  if (!reward) return;
  var keys = ['families', 'sites', 'decorCats', 'animals'];
  for (var k = 0; k < keys.length; k++) {
    var list = reward[keys[k]] || [];
    for (var i = 0; i < list.length; i++) {
      if (SA.Progress.unlocked[keys[k]].indexOf(list[i]) < 0) SA.Progress.unlocked[keys[k]].push(list[i]);
    }
  }
  SA.Progress.save();
};

SA.Progress.markLevelDone = function (id) { SA.Progress.completed[id] = true; SA.Progress.save(); };

/* Hook point for the tool layer (p11 SA.Act.*) - currently no scoring or
   analytics hangs off it, so it stays a cheap no-op rather than doing any
   per-action work (siddur-performance's "cheap gate first", applied here
   even though this file predates that codebase). */
SA.Progress.onAction = function (kind, materialId) {};

SA.Progress.save = function () {
  try { localStorage.setItem(SA.Progress.STORE_KEY, JSON.stringify({ unlocked: SA.Progress.unlocked, completed: SA.Progress.completed })); } catch (e) {}
};

SA.Progress.load = function () {
  try {
    var raw = localStorage.getItem(SA.Progress.STORE_KEY);
    if (!raw) return;
    var obj = JSON.parse(raw);
    if (obj && obj.unlocked) SA.Progress.unlocked = obj.unlocked;
    if (obj && obj.completed) SA.Progress.completed = obj.completed;
  } catch (e) {}
};

/* ---------------------------------------------- 19a. SANDBOX AUTOSAVE */
SA.Save = {
  KEY: 'sukkah_architect.sandbox',
  dirty: false
};

SA.Save.markDirty = function () {
  SA.Save.dirty = true;
  SA.Save.flush();
};

SA.Save.flush = function () {
  if (!SA.Save.dirty || !SA.Game.state || SA.Game.level) { SA.Save.dirty = false; return; }
  try { localStorage.setItem(SA.Save.KEY, JSON.stringify(SA.Game.state)); } catch (e) {}
  SA.Save.dirty = false;
};

SA.Save.load = function () {
  try {
    var raw = localStorage.getItem(SA.Save.KEY);
    if (!raw) return null;
    var st = JSON.parse(raw);
    if (!st || !st.footprint || !st.walls || !st.schach) return null;
    return st;
  } catch (e) { return null; }
};
</script>
<script>
/* ---------------------------------------------- 20. SHARE */
/* Renders a postcard PNG on an offscreen canvas (never touches the live
   #stage), then hands it to the host. Contract with the Kotlin side (see
   PlatformLocalHtmlWebView.evaluate): right before navigating, this sets
   window.__mitzShare = { png: <full data: URL>, text: <one-line summary> }.
   A data: URL is far too long for the host to read off the URL itself, so
   mitz://share/sukkah is only a doorbell - the host pulls the payload back
   with evaluateJavascript('JSON.stringify(window.__mitzShare||null)') and
   strips the "data:image/png;base64," prefix itself before writing bytes. */
SA.Share = {};

SA.Share.summaryText = function (state, result) {
  var verdict = result.status === 'kosher' ? SA.Lang.t('KOSHER') : (result.status === 'pasul' ? SA.Lang.t('PASUL') : SA.Lang.t('NOT KOSHER YET'));
  return SA.Lang.t('I built a sukkah in Sukkah Architect!') + ' ' + verdict + ' - ' +
    SA.Lang.fmt('{w}x{d} tefachim, {p}% shaded.', { w: state.footprint.w, d: state.footprint.d, p: Math.round((result.shadeRatio || 0) * 100) });
};

SA.Share.render = function (state, result) {
  var W = 800, H = 1000;
  var off = document.createElement('canvas');
  off.width = W; off.height = H;
  var octx = off.getContext('2d', { alpha: false });

  var savedCanvas = SA.View.canvas, savedCtx = SA.View.ctx, savedW = SA.View.w, savedH = SA.View.h;
  var savedAngle = SA.Camera.angle, savedTarget = SA.Camera.targetAngle, savedZoom = SA.Camera.zoom;
  var savedPan = { x: SA.Camera.pan.x, y: SA.Camera.pan.y }, savedInside = SA.Camera.inside;
  var savedOverlay = state.overlayOn;

  SA.View.canvas = off; SA.View.ctx = octx; SA.View.w = W; SA.View.h = H;
  SA.Camera.pan.x = 0; SA.Camera.pan.y = -80;
  SA.Camera.angle = 35; SA.Camera.targetAngle = 35; SA.Camera.inside = false;
  state.overlayOn = false;
  SA.Camera.zoom = 1;
  SA.Iso.setViewport(W, H - 170);
  SA.Camera.zoom = SA.Share.fitZoom(state, W * 0.78, (H - 170) * 0.7);
  SA.Iso.setViewport(W, H - 170);
  SA.Scene.render(octx, state, result);

  SA.View.canvas = savedCanvas; SA.View.ctx = savedCtx; SA.View.w = savedW; SA.View.h = savedH;
  SA.Camera.angle = savedAngle; SA.Camera.targetAngle = savedTarget; SA.Camera.zoom = savedZoom;
  SA.Camera.pan = savedPan; SA.Camera.inside = savedInside;
  state.overlayOn = savedOverlay;

  SA.Share.drawStamp(octx, W, H, state, result);
  return off.toDataURL('image/png');
};

SA.Share.fitZoom = function (state, availW, availH) {
  var w = state.footprint.w, d = state.footprint.d, cx = w / 2, cz = d / 2;
  var corners = [
    [0, 0, 0], [w, 0, 0], [0, 0, d], [w, 0, d],
    [0, state.roofHeight, 0], [w, state.roofHeight, 0], [0, state.roofHeight, d], [w, state.roofHeight, d]
  ];
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (var i = 0; i < corners.length; i++) {
    var p = SA.Iso.project(corners[i][0], corners[i][1], corners[i][2], cx, cz);
    var rx = p.sx - SA.Iso.originX, ry = p.sy - SA.Iso.originY;
    minX = Math.min(minX, rx); maxX = Math.max(maxX, rx);
    minY = Math.min(minY, ry); maxY = Math.max(maxY, ry);
  }
  var spanW = Math.max(1, maxX - minX), spanH = Math.max(1, maxY - minY);
  return Math.max(0.25, Math.min(3.2, Math.min(availW / spanW, availH / spanH)));
};

SA.Share.drawStamp = function (ctx, W, H, state, result) {
  var bandY = H - 170;
  ctx.fillStyle = '#141821';
  ctx.fillRect(0, bandY, W, 170);
  var color = SA.UI.KOSHER_COLOR[result.status];
  var label = result.status === 'kosher' ? 'KOSHER' : (result.status === 'pasul' ? 'PASUL' : 'NOT KOSHER YET');
  SA.Draw.roundRect(ctx, W / 2 - 130, bandY + 18, 260, 46, 23);
  ctx.fillStyle = color; ctx.fill();
  SA.Draw.text(ctx, label, W / 2, bandY + 42, { size: 20, color: '#111', weight: '800' });
  SA.Draw.text(ctx, 'SUKKAH ARCHITECT', W / 2, bandY + 84, { size: 16, color: '#f0d98a', weight: '700' });
  SA.Draw.text(ctx, SA.Lang.fmt('{w}x{d} tefachim', { w: state.footprint.w, d: state.footprint.d }) +
    '  \u2022  ' + SA.Lang.fmt('{p}% shaded', { p: Math.round((result.shadeRatio || 0) * 100) }),
    W / 2, bandY + 116, { size: 14, color: 'rgba(255,255,255,0.82)' });
  SA.Draw.text(ctx, SA.Lang.t('Design a kosher sukkah, piece by piece.'), W / 2, bandY + 144, { size: 12, color: 'rgba(255,255,255,0.55)' });
};

SA.Share.shareSukkah = function (state, result) {
  var dataUrl = SA.Share.render(state, result);
  var text = SA.Share.summaryText(state, result);
  if (SA.Host.inApp()) {
    window.__mitzShare = { png: dataUrl, text: text };
    try { location.href = 'mitz://share/sukkah'; } catch (e) {}
    return;
  }
  SA.Share.webFallback(dataUrl, text);
};

SA.Share.webFallback = function (dataUrl, text) {
  if (!navigator.share) { SA.Share.download(dataUrl); return; }
  fetch(dataUrl).then(function (res) { return res.blob(); }).then(function (blob) {
    var file = new File([blob], 'sukkah-architect.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: text, title: 'Sukkah Architect' }).catch(function () { SA.Share.download(dataUrl); });
    } else {
      SA.Share.download(dataUrl);
    }
  }).catch(function () { SA.Share.download(dataUrl); });
};

SA.Share.download = function (dataUrl) {
  var a = document.createElement('a');
  a.href = dataUrl; a.download = 'sukkah-architect.png';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
};

SA.Lang.add({
  'I built a sukkah in Sukkah Architect!': 'בניתי סוכה במשחק אדריכל הסוכה!',
  '{w}x{d} tefachim, {p}% shaded.': '{w}x{d} טפחים, {p}% מוצל.',
  '{w}x{d} tefachim': '{w}x{d} טפחים',
  '{p}% shaded': '{p}% מוצל',
  '20 Amos - the height ceiling': 'עשרים אמה - תקרת הגובה'
});
</script>
<script>
/* ---------------------------------------------- 21. BOOT + GAME LOOP */
SA.Loop.update = function (dt) {
  SA.Camera.update(dt);
};

SA.Loop.render = function () {
  var ctx = SA.View.ctx;
  if (SA.Game.screen === 'sandbox') {
    var result = SA.Halacha.evaluate(SA.Game.state);
    SA.Game.lastResult = result;
    SA.Scene.render(ctx, SA.Game.state, result);
    SA.UI.renderSandbox(ctx, result);
    if (!SA.Game.modal) SA.Game.checkLevelGoal(result);
  } else if (SA.Game.screen === 'levels') {
    SA.UI.renderLevels(ctx);
  } else if (SA.Game.screen === 'cards') {
    SA.UI.renderCards(ctx);
  } else {
    SA.UI.renderTitle(ctx);
  }
};

SA.start = function () {
  SA.boot();
  SA.Lang.boot();
  SA.Progress.load();
  SA.Input.bind();
  SA.Game.screen = 'title';
  SA.Loop.start();
};

window.addEventListener('load', SA.start);
window.addEventListener('pagehide', function () { SA.Save.flush(); });
window.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') SA.Save.flush(); });
</script>
