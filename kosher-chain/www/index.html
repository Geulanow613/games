  ];
  var row = y + 108;
  if (!Nusach.locked()) {
    this.btns.push(new Button({ x: x, y: row, w: w, h: 74, label: 'MY NUSACH', color: PAL.teal, size: 24,
      sub: Nusach.current().name,
      onTap: function () { Game.go(new NusachPick(function () { Game.go(new Menu()); })); } }));
    row += 88;
  }
  this.btns.push(new Button({ x: x, y: row, w: w, h: 74, label: 'HOW TO PLAY', color: PAL.violet, size: 24,
    onTap: function () { Game.go(new Help()); } }));
  row += 88;
  if (MitzHost.inApp()) {
    this.btns.push(new Button({ x: x, y: row, w: w, h: 74, label: 'MORE GAMES', color: PAL.slate, size: 22,
      onTap: function () { MitzHost.openDash(); } }));
  }
  pushBtn(this.btns, langButton());
};
Menu.prototype.relayout = function () { this.build(); };
Menu.prototype.update = function (dt) { this.t += dt; };

/* ---------------------------------------------------------- the demo strip
   Plays a chain by itself and stops exactly where the player's own nusach
   says it must, so the title screen already teaches the one rule that
   changes from family to family. */
var DEMO_FOODS = ['Challah', 'Apple', 'Salmon', 'Cheese', 'Brisket'];

Menu.prototype.demoScript = function () {
  var foods = DEMO_FOODS.map(foodByName);
  var plate = emptyPlate();
  var okCount = 0, why = null;
  for (var i = 0; i < foods.length; i++) {
    var r = plateAccepts(plate, foods[i], Nusach.id);
    if (!r.ok) { why = r.why; break; }
    addToPlate(plate, foods[i]);
    okCount++;
  }
  var linkAt = 0.45;
  var tryAt = 0.4 + okCount * linkAt + 0.25;
  var serveAt = tryAt + 1.7;
  return {
    foods: foods, okCount: okCount, why: why, plate: plate,
    start: 0.4, linkAt: linkAt,
    tryAt: tryAt, serveAt: serveAt, resetAt: serveAt + 1.5,
    period: serveAt + 2.2
  };
};

Menu.prototype.drawDemo = function (ctx, t) {
  var s = this.demoScript();
  var cy = this.demoY;
  var n = s.foods.length;
  var size = Math.min(92, (CFG.W - 80) / n - 12);
  var sp = size + 14;
  var x0 = CFG.W / 2 - (n - 1) * sp / 2;
  var lt = t % s.period;

  /* how much of the chain is on the plate right now */
  var links = 0;
  if (lt >= s.start) links = Math.min(s.okCount, Math.floor((lt - s.start) / s.linkAt) + 1);
  var trying = lt >= s.tryAt && lt < s.serveAt && s.okCount < n;
  var served = lt >= s.serveAt && lt < s.resetAt;
  if (lt >= s.resetAt) links = 0;

  var color = plateColor(s.plate);
  var cord = links >= 2 && !served;

  /* Same trick as the board: a fat glow under the dishes, a thin bright core
     over them, so the link reads at arm's length. */
  var path = function () {
    ctx.beginPath();
    ctx.moveTo(x0, cy);
    ctx.lineTo(x0 + (links - 1) * sp, cy);
  };
  if (cord) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 26;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = size * 0.44;
    path(); ctx.stroke();
    ctx.restore();
  }

  for (var i = 0; i < n; i++) {
    var f = s.foods[i];
    var on = i < links && !served;
    var x = x0 + i * sp;
    var yy = cy;
    var sc = 1;
    var alpha = 1;
    if (served && i < s.okCount) {
      /* the plate leaves the strip */
      var k = (lt - s.serveAt) / 0.6;
      if (k < 1) { yy -= 40 * easeOut(k); alpha = 1 - k; sc = 1 + 0.4 * k; }
      else alpha = 0;
    }
    if (trying && i === s.okCount) { x += Math.sin(t * 40) * 4; }
    if (alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawDish(ctx, {
      x: x, y: yy, size: size, food: f, cat: f.cat, seed: 500 + i,
      selected: on, scale: sc * (on ? 1.06 : 1), glow: on ? 18 : 0
    });
    if (trying && i === s.okCount) {
      /* red, not the food's own colour - this one is being turned away */
      ctx.save();
      ctx.strokeStyle = PAL.red;
      ctx.shadowColor = PAL.red; ctx.shadowBlur = 18;
      ctx.lineWidth = 4;
      Draw.rr(ctx, x - size / 2, yy - size / 2, size, size, size * 0.28);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      var q = size * 0.24;
      ctx.beginPath();
      ctx.moveTo(x - q, yy - q); ctx.lineTo(x + q, yy + q);
      ctx.moveTo(x + q, yy - q); ctx.lineTo(x - q, yy + q);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  if (cord) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = size * 0.085;
    path(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = size * 0.028;
    path(); ctx.stroke();
    for (var b = 0; b < links; b++) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x0 + b * sp, cy, size * 0.045, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  /* the narration, which is the whole point of showing this */
  var cap, col;
  if (trying) { cap = s.why; col = PAL.red; }
  else if (served) { cap = plateName(s.plate); col = color; }
  else { cap = 'Drag through what goes together'; col = 'rgba(255,255,255,.72)'; }
  var cw = CFG.W - 70;
  var lines = Draw.wrap(ctx, cap, cw, 20, '800');
  for (var j = 0; j < lines.length; j++) {
    Draw.textFit(ctx, lines[j], CFG.W / 2, cy + size * 0.72 + 26 + j * 26, cw, {
      size: 20, color: col, align: 'center', weight: '800'
    });
  }
};
/* In the Play tab, back returns to the arcade menu. Standalone: leave. */
Menu.prototype.onBack = function () {
  if (MitzHost.openDash()) return true;
  return false;
};
Menu.prototype.handlers = function () {
  var self = this;
  return UI.bind(function () { return self.btns; });
};
Menu.prototype.render = function (ctx) {
  var t = this.t, safe = View.safe;
  Scene.drawHall(ctx, t);
  Scene.drawDrift(ctx, t);

  /* a live chain of foods as the logo */
  var demo = ['Challah', 'Brisket', 'Carrot'];
  var cy = this.logoY;
  var sp = 144, sx = CFG.W / 2 - sp;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = PAL.gold; ctx.globalAlpha = 0.5;
  ctx.lineWidth = 24; ctx.shadowColor = PAL.gold; ctx.shadowBlur = 26;
  ctx.beginPath();
  ctx.moveTo(sx, cy);
  ctx.lineTo(sx + sp * 2, cy);
  ctx.stroke();
  ctx.restore();
  for (var i = 0; i < 3; i++) {
    var f = foodByName(demo[i]);
    var bob = Math.sin(t * 1.6 + i * 0.8) * 7;
    drawDish(ctx, {
      x: sx + i * sp, y: cy + bob, size: 118, food: f, cat: f.cat,
      seed: 100 + i, selected: true, scale: 1, glow: 18
    });
  }

  Draw.textFit(ctx, 'CAMP KOSH', CFG.W / 2, cy + 186, CFG.W - 70, {
    size: 74, color: PAL.gold, align: 'center', weight: '900',
    stroke: 'rgba(0,0,0,.6)', strokeW: 8, shadow: PAL.goldDeep, shadowBlur: 26
  });
  Draw.text(ctx, Nusach.current().name, CFG.W / 2, cy + 232, {
    size: 28, color: '#ffe4a8', align: 'center', weight: '700', script: true
  });
  Draw.textFit(ctx, 'Feed the boys. Keep it kosher.', CFG.W / 2, cy + 268, CFG.W - 80, {
    size: 22, color: 'rgba(255,255,255,.72)', align: 'center', weight: '700'
  });

  var stars = Progress.totalStars();
  if (stars > 0) {
    drawStar(ctx, CFG.W / 2 - 36, cy + 318, 16, true);
    Draw.text(ctx, String(stars), CFG.W / 2 + 6, cy + 318, {
      size: 25, color: PAL.gold, align: 'left', weight: '900'
    });
  }

  if (this.demoY) this.drawDemo(ctx, t);

  Draw.vignette(ctx, 0.4);
  for (i = 0; i < this.btns.length; i++) this.btns[i].draw(ctx, t);
};

/* ------------------------------------------------------------ NUSACH PICK */
function NusachPick(onDone) {

NusachPick.prototype.render = function (ctx) {

  });

  for (var i = 0; i < this.cards.length; i++) {
    var c = this.cards[i];
    var on = c.nu.id === Nusach.id;
    var b = this.btns[i];
    ctx.save();
    if (b.press) {
      ctx.translate(c.x + c.w / 2, c.y + c.h / 2);

    });

    });
    Draw.textFit(ctx, c.nu.note, c.x + 100, c.y + 76, c.w - 130, {
      size: 16, color: on ? PAL.teal : 'rgba(255,255,255,.52)', weight: '700'
    });
    if (on) {
      ctx.strokeStyle = PAL.teal; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x + c.w - 46, c.y + 54);
      ctx.lineTo(c.x + c.w - 34, c.y + 66);
      ctx.lineTo(c.x + c.w - 14, c.y + 40);

  Draw.vignette(ctx, 0.4);
  this.btns[this.btns.length - 1].draw(ctx, t);

};

/* ------------------------------------------------------------- THE OPEN */
/* Shown once, before the first table: who you are and what the job is. */
var STORY = [
  { title: 'Welcome to Camp Kosh',
    body: 'The dining hall is yours this summer. Two hundred hungry boys, three meals a day, and one kitchen.' },
  { title: 'Feed them',

  { title: 'Six weeks',

];
var HE_STORY = {

for (var _hs in HE_STORY) HE[_hs] = HE_STORY[_hs];

function Story(onDone) {
  this.t = 0; this.i = 0; this.onDone = onDone;
  Scene.setWeek(0);
  this.build();
}
Story.prototype.build = function () {
  var self = this, safe = View.safe;
  var ctx = View.ctx;
  var page = STORY[this.i];
  this.w = Math.min(560, CFG.W - 60 - safe.l - safe.r);
  this.lines = Draw.wrap(ctx, page.body, this.w - 64, 23, '700');
  this.cardH = 150 + this.lines.length * 32;
  this.cardY = View.band(this.cardH + 44 + 88, 200, 60);
  var bw = Math.min(380, CFG.W - 130);
  var last = this.i >= STORY.length - 1;
  this.btns = [new Button({
    x: (CFG.W - bw) / 2, y: this.cardY + this.cardH + 44, w: bw, h: 88,
    label: last ? 'START THE WEEK' : 'NEXT', color: PAL.gold, size: last ? 26 : 30,
    onTap: function () {
      if (self.i >= STORY.length - 1) { self.finish(); return; }
      self.i++; self.t = 0; self.build();
      Input.handlers = self.handlers();
    }
  })];
};
Story.prototype.finish = function () {
  Progress.seenStory = true;
  Progress.save();
  this.onDone();
};
Story.prototype.relayout = function () { this.build(); };
Story.prototype.update = function (dt) { this.t += dt; };
Story.prototype.onBack = function () { this.finish(); };
Story.prototype.handlers = function () {
  var self = this;
  return UI.bind(function () { return self.btns; });
};
Story.prototype.render = function (ctx) {
  var t = this.t;
  Scene.drawHall(ctx, t);
  /* a hall full of boys waiting for you to get on with it */
  Story.demo(ctx, t);
  var page = STORY[this.i];
  var w = this.w, x = (CFG.W - w) / 2, y = this.cardY;
  var k = easeOut(Math.min(1, t / 0.3));
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(0, (1 - k) * 16);
  Draw.panel(ctx, x, y, w, this.cardH, {
    fill: 'rgba(8,12,26,.95)', stroke: PAL.gold, strokeW: 3, radius: 26,
    glow: PAL.goldDeep, glowBlur: 26
  });
  Draw.textFit(ctx, page.title, CFG.W / 2, y + 54, w - 60, {
    size: 34, color: PAL.gold, align: 'center', weight: '900'
  });
  ctx.strokeStyle = 'rgba(255,207,92,.35)'; ctx.lineWidth = 2;

/* ----------------------------------------------------------- LEVEL SELECT */
function LevelSelect() { this.t = 0; this.build(); }
LevelSelect.prototype.build = function () {
  var safe = View.safe;
  /* the hall behind the grid is the week the player is up to */
  Scene.setWeek(LEVELS[clamp(Progress.unlocked - 1, 0, LEVELS.length - 1)].week || 0);
  this.btns = [];
  this.cells = [];
  var cols = 3;
  /* a longer roster of tables needs smaller cards and a tighter header so
     the whole grid still lands inside the safe area on a short phone */
  var many = LEVELS.length > 12;
  var maxCell = many ? 132 : 170;
  var gap = many ? 14 : 24;
  var availW = CFG.W - 80 - safe.l - safe.r;
  var cw = Math.min(maxCell, (availW - gap * (cols - 1)) / cols);
  var ch = cw;
  var totalW = cw * cols + gap * (cols - 1);
  var x0 = safe.l + (CFG.W - safe.l - safe.r - totalW) / 2;
  /* three days to a week, and every week gets its own heading */
  var gridRows = Math.ceil(LEVELS.length / cols);
  var head = 30;
  var gridH = gridRows * (ch + gap + head) - gap;
  var y0 = View.band(gridH, many ? 140 : 200, many ? 104 : 150);
  this.titleY = y0 - 84;
  this.heads = [];
  for (var i = 0; i < LEVELS.length; i++) {
    var rowIdx = Math.floor(i / cols);
    var cx = x0 + (i % cols) * (cw + gap);
    var cy = y0 + rowIdx * (ch + gap + head) + head;
    var open = (i + 1) <= Progress.unlocked;
    if (i % cols === 0) {
      this.heads.push({
        x: x0, y: cy - head + 6, w: totalW,
        label: WEEKS[clamp(LEVELS[i].week, 0, WEEKS.length - 1)].name
      });
    }
    this.cells.push({ i: i, x: cx, y: cy, w: cw, h: ch, open: open });
    this.btns.push(new Button({
      x: cx, y: cy, w: cw, h: ch, label: '', enabled: open,
      onTap: (function (li) { return function () { Game.startLevel(li); }; })(i)
    }));
  }
  var bw = Math.min(300, CFG.W - 120);
  this.back = new Button({
    x: (CFG.W - bw) / 2, y: CFG.H - 108 - safe.b, w: bw, h: 74,
    label: 'BACK', color: PAL.slate, size: 22,
    onTap: function () { Game.go(new Menu()); }
  });
  this.btns.push(this.back);
};
LevelSelect.prototype.relayout = function () { this.build(); };
LevelSelect.prototype.update = function (dt) { this.t += dt; };
LevelSelect.prototype.onBack = function () { Game.go(new Menu()); };
LevelSelect.prototype.handlers = function () {
  var self = this;
  return UI.bind(function () { return self.btns; });
};
LevelSelect.prototype.render = function (ctx) {
  var t = this.t, safe = View.safe;
  Scene.drawHall(ctx, t);
  Scene.drawDrift(ctx, t);
  Draw.textFit(ctx, 'SIX WEEKS OF CAMP', CFG.W / 2, this.titleY, CFG.W - 80, {
    size: 42, color: PAL.gold, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.5)', strokeW: 6
  });
  for (var w = 0; w < this.heads.length; w++) {
    var hd = this.heads[w];
    Draw.text(ctx, hd.label, hd.x + 4, hd.y, {
      size: 18, color: 'rgba(255,255,255,.55)', weight: '900'
    });
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hd.x + 96, hd.y); ctx.lineTo(hd.x + hd.w, hd.y);
    ctx.stroke();
    ctx.restore();
  }
  for (var i = 0; i < this.cells.length; i++) {
    var c = this.cells[i];
    var b = this.btns[i];
    var st = Progress.stars[c.i] || 0;
    ctx.save();
    if (b.press) {
      ctx.translate(c.x + c.w / 2, c.y + c.h / 2);
      ctx.scale(0.96, 0.96);
      ctx.translate(-(c.x + c.w / 2), -(c.y + c.h / 2));
    }
    Draw.panel(ctx, c.x, c.y, c.w, c.h, {
      fill: c.open ? 'rgba(10,16,32,.9)' : 'rgba(14,16,26,.7)',
      stroke: c.open ? (st > 0 ? PAL.gold : PAL.teal) : 'rgba(255,255,255,.1)',
      strokeW: c.open ? 3 : 2, radius: 22,
      glow: c.open && c.i + 1 === Progress.unlocked ? PAL.teal : null,
      glowBlur: 12 + 10 * pulse(t, 0.9)
    });
    if (c.open) {
      Draw.text(ctx, String(c.i + 1), c.x + c.w / 2, c.y + c.h * 0.36, {
        size: 42, color: PAL.cream, align: 'center', weight: '900'
      });
      /* what this table is about, so the grid is not just numbers */
      var ords = LEVELS[c.i].orders;
      var iw = Math.min(34, c.w / (ords.length + 1));
      for (var k = 0; k < ords.length; k++) {
        var kx = c.x + c.w / 2 + (k - (ords.length - 1) / 2) * (iw + 4);
        drawFood(ctx, foodByName(orderFoodName(ords[k].kind)), kx, c.y + c.h * 0.62, iw, 40 + k);
      }
      for (var s = 0; s < 3; s++) {
        drawStar(ctx, c.x + c.w / 2 + (s - 1) * 28, c.y + c.h * 0.85, 12, s < st);
      }
    } else {
      /* padlock */
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      var lx = c.x + c.w / 2, ly = c.y + c.h / 2;
      ctx.beginPath(); ctx.arc(lx, ly - 8, 15, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      Draw.rr(ctx, lx - 22, ly - 8, 44, 34, 7); ctx.fill();
    }
    ctx.restore();
  }
  Draw.vignette(ctx, 0.4);
  this.back.draw(ctx, t);
};

function Teach(key, onDone) {
  this.t = 0; this.card = TEACH[key]; this.key = key; this.onDone = onDone;

}
Teach.prototype.build = function () {
  var self = this, safe = View.safe;
  var ctx = View.ctx;
  var bw = Math.min(360, CFG.W - 140);
  this.w = Math.min(560, CFG.W - 60 - safe.l - safe.r);

     under the card however long the Hebrew turns out to be */
  this.lines = Draw.wrap(ctx, this.card.body, this.w - 64, 24, '700');
  this.noteLines = Draw.wrap(ctx, this.card.note, this.w - 64, 19, '800');
  /* where it comes from, on the cards that are halacha and not game rules */
  this.srcLines = this.card.source
    ? Draw.wrap(ctx, this.card.source, this.w - 70, 17, '700') : [];

  this.cardH = 150 + this.artH + this.lines.length * 34 +
    this.srcLines.length * 26 + this.noteLines.length * 28;

};
Teach.prototype.render = function (ctx) {

  Scene.drawDrift(ctx, t);

  var x = (CFG.W - w) / 2;

  var artH = this.artH;
  var h = this.cardH;

    fill: 'rgba(8,12,26,.96)', stroke: PAL.gold, strokeW: 3, radius: 26,

  });

  });

  ctx.beginPath(); ctx.moveTo(x + 40, y + 84); ctx.lineTo(x + w - 40, y + 84); ctx.stroke();

  if (this.art.length) {
    var n = this.art.length;
    var sz = Math.min(88, (w - 80) / n - 10);
    var ay = y + 84 + artH / 2;
    for (var a = 0; a < n; a++) {

      drawDish(ctx, {

      });

      size: 24, color: PAL.cream, align: 'center', weight: '700'
    });

    });

      size: 19, color: PAL.teal, align: 'center', weight: '800'

/* ----------------------------------------------------------------- RESULT */
function Result(play) {
  this.t = 0; this.play = play; this.win = play.over === 'win';
  this.stars = 0;
  if (this.win) {
    var frac = play.moves / play.totalMoves;
    this.stars = 1 + (frac >= 0.2 ? 1 : 0) + (frac >= 0.38 ? 1 : 0);
    Progress.record(play.li, this.stars, play.score);
  }
  this.build();
}
Result.prototype.build = function () {
  var self = this, safe = View.safe;
  var w = Math.min(420, CFG.W - 120 - safe.l - safe.r);
  var x = (CFG.W - w) / 2;
  /* card and buttons travel together so neither drifts off a tall screen */
  this.panelY = View.band(380 + 42 + 178, 40, 40);
  var y = this.panelY + 422;
  this.btns = [];
  if (this.win) {
    var last = self.play.li >= LEVELS.length - 1;
    this.btns.push(new Button({
      x: x, y: y, w: w, h: 90, label: last ? 'TABLES' : 'NEXT TABLE',
      color: PAL.green, size: 28,
      onTap: function () {
        if (last) Game.go(new LevelSelect());
        else Game.startLevel(self.play.li + 1);
      }
    }));
  } else {
    this.btns.push(new Button({
      x: x, y: y, w: w, h: 90, label: 'RETRY', color: PAL.gold, size: 28,
      onTap: function () { Game.startLevel(self.play.li, true); }
    }));
  }
  this.btns.push(new Button({
    x: x, y: y + 104, w: w, h: 74, label: 'TABLES', color: PAL.slate, size: 22,
    onTap: function () { Game.go(new LevelSelect()); }
  }));
};
Result.prototype.relayout = function () { this.build(); };
Result.prototype.onBack = function () { Game.go(new LevelSelect()); };
Result.prototype.update = function (dt) {
  this.t += dt;
  if (this.win && this.t < 1.4 && chance(dt * 22)) {
    FX.burst(rand(60, CFG.W - 60), rand(200, 520), {
      n: 8, color: pick([PAL.gold, PAL.green, PAL.teal, PAL.violet]),
      spdMax: 260, lifeMax: 1.1, grav: 300
    });
  }
};
Result.prototype.handlers = function () {
  var self = this;
  return UI.bind(function () { return self.btns; });
};
Result.prototype.render = function (ctx) {
  var t = this.t, safe = View.safe;
  this.play.render(ctx);
  ctx.save();
  ctx.fillStyle = 'rgba(3,5,12,.84)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.restore();

  var k = easeOut(Math.min(1, t / 0.4));
  var w = Math.min(560, CFG.W - 50 - safe.l - safe.r);
  var x = (CFG.W - w) / 2;
  var y = this.panelY;
  ctx.save();
  ctx.translate(CFG.W / 2, y + 180);
  ctx.scale(0.88 + 0.12 * k, 0.88 + 0.12 * k);
  ctx.globalAlpha = k;
  ctx.translate(-CFG.W / 2, -(y + 180));

  var col = this.win ? PAL.gold : PAL.red;
  var starved = !this.win && this.play.overWhy === 'simcha';
  Draw.panel(ctx, x, y, w, 380, {
    fill: 'rgba(8,12,26,.96)', stroke: col, strokeW: 3, radius: 26, glow: col, glowBlur: 24
  });
  Draw.textFit(ctx, this.win ? 'TABLE CLEARED!' : (starved ? 'OUT OF SIMCHA' : 'OUT OF MOVES'),
    CFG.W / 2, y + 56, w - 60, {
      size: 38, color: col, align: 'center', weight: '900'
    });
  Draw.textFit(ctx, this.win ? 'You served every order'
      : (starved ? 'The boys lost all their simcha!' : 'The orders are not finished'),
    CFG.W / 2, y + 100, w - 70, {
      size: 19, color: 'rgba(255,255,255,.65)', align: 'center', weight: '700'
    });

  if (this.win) {
    for (var s = 0; s < 3; s++) {
      var pop = clamp((t - 0.35 - s * 0.18) / 0.3, 0, 1);
      var on = s < this.stars;
      /* each earned star lands with a little overshoot */
      var r = on ? 30 * (0.5 + 0.6 * easeOut(pop) - 0.1 * easeOut(pop) * (1 - pop)) : 30;
      drawStar(ctx, CFG.W / 2 + (s - 1) * 76, y + 176, r, on && pop > 0);
    }
  } else {
    /* show what is still missing so the retry has a plan */
    var miss = this.play.orders.filter(function (o) { return o.got < o.need; });
    for (var i = 0; i < Math.min(3, miss.length); i++) {
      var o = miss[i];
      var info = ORDER_INFO[o.kind];
      var ry = y + 150 + i * 52;
      drawFood(ctx, foodByName(orderFoodName(o.kind)), x + 60, ry, 40, 61 + i);
      Draw.textFit(ctx, info.label, x + 96, ry, w - 210, {
        size: 20, color: info.color, weight: '800'
      });
      Draw.text(ctx, o.got + '/' + o.need, x + w - 50, ry, {
        size: 20, color: PAL.cream, align: 'right', weight: '900'
      });
    }
  }

  Draw.text(ctx, 'SCORE', CFG.W / 2, y + 258, {
    size: 15, color: PAL.slate, align: 'center', weight: '800'
  });
  var shown = Math.round(this.play.score * clamp(t / 0.7, 0, 1));
  Draw.text(ctx, String(shown), CFG.W / 2, y + 300, {
    size: 46, color: PAL.cream, align: 'center', weight: '900'
  });
  var best = Progress.best[this.play.li] || 0;
  if (best > 0) {
    Draw.text(ctx, Lang.t('BEST') + ' ' + best, CFG.W / 2, y + 342, {
      size: 16, color: PAL.gold, align: 'center', weight: '800'
    });
  }
  ctx.restore();

  FX.draw(ctx);
  for (var b = 0; b < this.btns.length; b++) this.btns[b].draw(ctx, t);
};

/* =================================================================== GAME */
var Game = {
  screen: null,
  last: 0,
  acc: 0,
  running: false,

  go: function (screen) {
    Game.screen = screen;
    if (screen.relayout) screen.relayout();
    Input.clear();
    Input.handlers = screen.handlers();
  },

  /* language changed - screens cache laid-out labels, so rebuild in place */
  rebuild: function () {
    var s = Game.screen;
    if (s && s.build) { s.build(); Input.handlers = s.handlers(); }
  },

  relayout: function () {
    var s = Game.screen;
    if (!s) return;
    if (s.relayout) s.relayout();
    if (s.play && s.play.relayout) s.play.relayout();
  },

  startLevel: function (li, skipTeach) {
    li = clamp(li, 0, LEVELS.length - 1);
    var lv = LEVELS[li];
    /* the job is explained once, before the first week */
    if (!skipTeach && !Progress.seenStory) {
      Game.go(new Story(function () { Game.startLevel(li, skipTeach); }));
      return;
    }
    var start = function () {
      var play = new Play(li);
      play.relayout();
      FX.reset();
      Game.go(play);
    };
    /* a table may have more than one thing to say before it opens */
    var keys = (!skipTeach && lv.teach) ? [].concat(lv.teach) : [];
    keys = keys.filter(function (k) { return TEACH[k] && !Progress.seenTeach[k]; });
    var run = function (i) {
      if (i >= keys.length) { start(); return; }
      Game.go(new Teach(keys[i], function () { run(i + 1); }));
    };
    run(0);
  },

  pause: function (play) { Game.go(new Pause(play)); },
  finish: function (play) { Game.go(new Result(play)); },

  /* a rule card in the middle of a table. The week waits where it is - the
     boys do not get any hungrier while you are reading. */
  teach: function (key, play) {
    if (!TEACH[key]) return;
    Game.go(new Teach(key, function () { play.grace = 1.2; Game.go(play); }));
  },

  /* Android's back button and back gesture. Every screen says where back
     goes; only the menu answers false, which is where leaving is allowed. */
  back: function () {
    var s = Game.screen;
    return !!(s && s.onBack && s.onBack() !== false);
  },

  frame: function (now) {
    requestAnimationFrame(Game.frame);
    if (!Game.last) Game.last = now;
    var dt = (now - Game.last) / 1000;
    Game.last = now;
    if (dt > CFG.MAX_FRAME) dt = CFG.MAX_FRAME;   /* tab was hidden - do not lurch */
    Game.acc += dt;

    var guard = 0;
    while (Game.acc >= CFG.STEP && guard++ < 5) {
      Game.acc -= CFG.STEP;
      if (Game.screen && Game.screen.update) Game.screen.update(CFG.STEP);
      FX.update(CFG.STEP);
    }

    var ctx = View.ctx;
    View.begin();
    FX.preDraw(ctx);
    if (Game.screen && Game.screen.render) Game.screen.render(ctx);
    View.end();
  },

  boot: function () {
    Lang.boot();
    Nusach.boot();
    Progress.load();
    View.init();
    Input.init();
    Scene.initDrift();

    var boot = document.getElementById('boot');
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);

    window.addEventListener('resize', function () { setTimeout(Game.relayout, 60); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(Game.relayout, 200); }, { passive: true });
    document.addEventListener('visibilitychange', function () {
      /* leaving mid-drag on a phone is normal; do not leave a chain hanging */
      if (document.hidden) {
        Input.clear();
        var s = Game.screen;
        if (s && s.cancelChain) { s.cancelChain(); s.finger = null; }
        if (s instanceof Play && !s.over) Game.pause(s);
      } else {
        Game.last = 0;
        if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
      }
    });

    Game.initBack();
    Game.go(new Menu());
    requestAnimationFrame(Game.frame);
  },

  /* Android has a back button and a back swipe; iOS has neither, and a browser
     tab has the toolbar arrow. One spare history entry catches all of them, so
     back steps through the game instead of throwing the player out of it. */
  initBack: function () {
    try {
      history.replaceState({ kc: 'root' }, '');
      history.pushState({ kc: 'game' }, '');
    } catch (e) { return; }
    window.addEventListener('popstate', function () {
      var handled = Game.back();
      if (!handled) {
        var cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
        /* on the menu, back really does mean leave - but only in a real app */
        if (cap && cap.exitApp) { cap.exitApp(); return; }
      }
      try { history.pushState({ kc: 'game' }, ''); } catch (e) {}
    });
    /* a keyboard is not a phone, but Escape is free */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { Game.back(); e.preventDefault(); }
    });
  }
};

/* expose a little surface so tests and a host app can reach in */
window.KC = {
  Game: Game, Play: Play, Board: Board, Nusach: Nusach, Lang: Lang, View: View,
  FOODS: FOODS, LEVELS: LEVELS, Progress: Progress, TEACH: TEACH, NUSACHS: NUSACHS,
  WHY_CARD: WHY_CARD, KID_LINES: KID_LINES, KID_HUNGRY: KID_HUNGRY,
  CFG: CFG, Sprite: Sprite,
  plateAccepts: plateAccepts, emptyPlate: emptyPlate, addToPlate: addToPlate,
  plateSide: plateSide, foodByName: foodByName,
  /* the icon builder paints the same food art the game uses */
  paintFood: paintFood, PAL: PAL, Draw: Draw,
  /* Play tab pause: leave a live table paused instead of mid-drag */
  pause: function () {
    var s = Game.screen;
    if (!s) return;
    if (s.cancelChain) { s.cancelChain(); s.finger = null; }
    if (s.board && s.chain && !s.over) Game.pause(s);
  },
  ready: false
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { Game.boot(); window.KC.ready = true; });
} else {
  Game.boot();
  window.KC.ready = true;
}

/* Add to Home Screen, and play with no signal. Only over http(s) - a
   file:// or capacitor:// launch has no service worker and does not need one,
   since the files are already on the device. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
