  var self = this;
  var path = this.findHint();
  var needsButton = false;
  if (!path) {
    path = this.withFreeActions(function () { return self.findHint(); });
    needsButton = !!path;
  }
  this.hintCooldown = 180;
  if (path) {
    this.hint = path;
    this.hintT = 3.5;
    if (needsButton) {
      this.reason = {
        why: this.freeHintWhy(),
        age: 0, at: this.t, x: CFG.W / 2, y: this.board.by + this.board.bh / 2, calm: true
      };
    }
    Sound.tone({ f: 660, f2: 880, dur: 0.16, vol: 0.16, type: 'sine' });
  } else {
    this.reason = { why: 'No legal move right now - try again in a moment.', age: 0, at: this.t,
      x: CFG.W / 2, y: this.board.by + this.board.bh / 2, calm: true };
  }
};

/* Look at the board as it would be after the boys wash, drink and - if there
   is anything to bentch on - bentch. All three are free, so a plate they
   unlock is a plate that is really there. */
Play.prototype.withFreeActions = function (fn) {
  var w = this.washed, nw = this.needWash, nd = this.needDrink, nr = this.needRinse;
  var nf = this.needFishDrink, ms = this.mealSide;
  var nfr = this.needFishRinse, ndr = this.needDairyRinse;
  this.washed = true; this.needWash = false; this.needDrink = false;
  this.needFishDrink = false;
  this.needFishRinse = false; this.needDairyRinse = false;
  this.needRinse = this.needPareve;
  if (this.mealAte > 0) this.mealSide = null;
  var out = fn();
  this.washed = w; this.needWash = nw; this.needDrink = nd; this.needRinse = nr;
  this.needFishDrink = nf; this.mealSide = ms;
  this.needFishRinse = nfr; this.needDairyRinse = ndr;
  return out;
};

/* the button the player is missing, when a hint needs one first */
Play.prototype.freeHintWhy = function () {
  if (this.mealAte > 0 && this.mealSide === 'meat') return 'Bentch first - milchig needs its own meal';
  if (!this.washed) return 'Wash your hands before challah';
  if (this.needDrink) return 'Rinse between fish and meat';
  if (this.needFishDrink) return 'Rinse between meat and fish';
  if (this.needDairyRinse) return 'Rinse between fish and dairy';
  if (this.needFishRinse) return 'Rinse between dairy and fish';
  return 'Wash and drink first';
};

/* Is there anything at all the player could serve right now? The wait and the
   rinse can genuinely paint a board into a corner, and a phone game must
   never leave someone tapping at a dead board. */
Play.prototype.hasMove = function () {
  var self = this;
  if (this.findHint()) return true;
  return !!this.withFreeActions(function () { return self.findHint(); });
};

/* deal new food onto every open dish until there is something to serve */
Play.prototype.reshuffle = function () {
  var b = this.board, i, t;
  for (var attempt = 0; attempt < 40; attempt++) {
    for (i = 0; i < b.cells.length; i++) {
      t = b.cells[i];
      if (!t || t.covered) continue;
      t.f = b.rollFood();
      t.born = 0;
    }
    if (this.hasMove()) break;
  }
  /* last resort: a board that is mostly pareve always has a plate on it */
  if (!this.hasMove()) {
    var pareve = foodsOfCat('pareve');
    for (i = 0; i < b.cells.length; i++) {
      t = b.cells[i];
      if (!t || t.covered) continue;
      t.f = pick(pareve);
      t.born = 0;
    }
  }
  FX.flash(PAL.teal, 0.25);
  FX.shake(8, 0.3);
  FX.text(CFG.W / 2, b.by + b.bh / 2, 'FRESH DISHES', PAL.teal, 34, 1.4);
  this.reason = {
    why: 'Nothing left to serve - fresh dishes', age: 0, at: this.t,
    x: CFG.W / 2, y: b.by + b.bh / 2 - 70, calm: true
  };
  Sound.tone({ f: 420, f2: 840, dur: 0.3, vol: 0.18, type: 'triangle' });
  Haptics.light();
  this.busy = Math.max(this.busy, 0.35);
};

/* find any legal three-food plate, preferring one an order still wants */
Play.prototype.findHint = function () {
  var b = this.board, self = this;
  var wants = {};
  for (var i = 0; i < this.orders.length; i++) {
    if (this.orders[i].got < this.orders[i].need) wants[this.orders[i].kind] = true;
  }
  var best = null;
  var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function walk(path, plate) {
    if (path.length >= 3) {
      var side = plateSide(plate);
      var score = wants[side] ? 2 : 1;
      if (!best || score > best.score) best = { path: path.slice(), score: score };
      if (best.score === 2) return true;
    }
    if (path.length >= 4) return false;
    var last = path[path.length - 1];
    for (var d = 0; d < dirs.length; d++) {
      var nx = last.gx + dirs[d][0], ny = last.gy + dirs[d][1];
      if (self.inChainPath(path, nx, ny)) continue;
      var tile = b.get(nx, ny);
      if (!tile) continue;
      var save = self.plate;
      self.plate = plate;
      var gate = self.canJoin(tile);
      self.plate = save;
      if (!gate.ok) continue;
      var np = emptyPlate();
      for (var k in plate) np[k] = plate[k];
      addToPlate(np, tile.f);
      path.push(tile);
      if (walk(path, np)) return true;
      path.pop();
    }
    return false;
  }

  var starts = [];
  for (i = 0; i < b.cells.length; i++) if (b.joinable(b.cells[i])) starts.push(b.cells[i]);
  shuffle(starts);
  for (i = 0; i < starts.length; i++) {
    var t0 = starts[i];
    var save = this.plate;
    this.plate = emptyPlate();
    var gate0 = this.canJoin(t0);
    this.plate = save;
    if (!gate0.ok) continue;
    if (walk([t0], addToPlate(emptyPlate(), t0.f))) break;
  }
  return best ? best.path : null;
};
Play.prototype.inChainPath = function (path, gx, gy) {
  for (var i = 0; i < path.length; i++) if (path[i].gx === gx && path[i].gy === gy) return true;
  return false;
};

Play.prototype.handlers = function () {
  var self = this;
  return UI.bind(function () {
    return [self.pauseBtn, self.hintBtn, self.washBtn, self.rinseBtn, self.bentchBtn]
      .concat(self.orderBtns);
  }, {
    down: function (p) { self.onDown(p); },
    move: function (p) { self.onMove(p); },
    up: function (p) { self.onUp(p); },
    cancel: function () { self.finger = null; self.cancelChain(); }
  });
};

Play.prototype.onBack = function () {
  this.finger = null;
  this.cancelChain();
  if (!this.over) Game.pause(this);
  else Game.go(new LevelSelect());
};
</script>
<script>
'use strict';
/* =============================================================== SCENERY */
var Scene = {
  /* which week's hall is on screen. the menus show week one until a table
     is opened, and then the room keeps the week the player is in */
  week: 0,
  setWeek: function (w) { Scene.week = clamp(w, 0, WEEKS.length - 1); },

  /* The hall itself never moves, so it is painted once per week and blitted.
     Everything that breathes - the lights, the banner, the boys - goes on top. */
  /* vig bakes the corner shading into the hall itself. Two full-screen
     composites a frame is the single most expensive thing the play screen
     does, and the hall never moves, so the play screen asks for one. */
  drawHall: function (ctx, t, vig) {
    var wk = WEEKS[Scene.week];
    var key = 'hall|' + Scene.week + '|' + Nusach.id + '|' + Lang.id + (vig ? '|v' : '');
    var cv = Sprite.screen(key, function (c) {
      Scene.paintHall(c, wk);
      if (vig) {
        var g = c.createRadialGradient(CFG.W / 2, CFG.H * 0.44, CFG.W * 0.22,
                                       CFG.W / 2, CFG.H * 0.44, CFG.H * 0.78);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,.62)');
        c.fillStyle = g;
        c.fillRect(0, 0, CFG.W, CFG.H);
      }
    }, 0.66);
    ctx.drawImage(cv, 0, 0, CFG.W, CFG.H);
    Scene.drawLights(ctx, t, wk);
  },
  /* kept so old call sites keep working */
  drawKitchen: function (ctx, t) { Scene.drawHall(ctx, t); },

  paintHall: function (c, wk) {
    var W = CFG.W, H = CFG.H;
    var wall = wk.wall, wood = wk.wood;
    /* the back wall stops here and the floor runs out towards the camera */
    var seam = Math.round(H * 0.42);
    Scene.seamY = seam;
    /* evening light through the far wall */
    Draw.vGrad(c, 0, 0, W, H, [
      [0, tone(wall, -0.42)], [0.34, tone(wall, -0.55)], [1, '#070a12']
    ]);

    /* plank wall, warm and roughly sawn */
    var plank = 74;
    for (var y = 96; y < seam; y += plank) {
      var k = (y / H);
      c.fillStyle = tone(wood, -0.52 - k * 0.22);
      c.fillRect(0, y, W, Math.min(plank - 4, seam - y));
      c.fillStyle = 'rgba(255,225,180,.05)';
      c.fillRect(0, y, W, 2);
      c.fillStyle = 'rgba(0,0,0,.22)';
      if (y + plank - 6 < seam) c.fillRect(0, y + plank - 6, W, 4);
    }
    /* corner posts, so the room has walls and not wallpaper */
    Draw.vGrad(c, 0, 96, 44, seam - 96, [[0, tone(wood, -0.3)], [1, tone(wood, -0.62)]]);
    Draw.vGrad(c, W - 44, 96, 44, seam - 96, [[0, tone(wood, -0.3)], [1, tone(wood, -0.62)]]);

    /* the back wall, filled the way a camp dining room is: a window onto the
       grounds, the door the boys come in through, the notice boards nobody
       reads, and the servery with the washing station at the end of it */
    var band = seam - 96;
    Scene.window(c, 40, 96 + band * 0.20, 152, band * 0.44, wk);
    Scene.door(c, 212, seam, 132, band * 0.74, wk);
    Scene.notice(c, 356, 96 + band * 0.24, 140, 52, 'KASHRUS', wk);
    Scene.notice(c, 356, 96 + band * 0.44, 140, 52, 'SCHEDULE', wk);
    Scene.sink(c, W - 214, seam - 128, wk, seam + 6);

    /* the floor, boards running away from the camera */
    Scene.floor(c, wk, seam);

    /* the rest of the hall: long tables running back, full of boys. They are
       too far away to animate, so they are painted into the room itself. */
    Scene.farTables(c, wk, seam);

    /* lamp wash from the strings overhead */
    var g = c.createRadialGradient(W / 2, 40, 30, W / 2, 40, H * 0.72);
    g.addColorStop(0, 'rgba(255,206,120,.20)');
    g.addColorStop(1, 'rgba(255,206,120,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H * 0.8);

    Scene.banner(c, wk);
  },

  /* the floorboards, drawn to a vanishing point behind the servery */
  floor: function (c, wk, seam) {
    var W = CFG.W, H = CFG.H;
    c.save();
    c.beginPath(); c.rect(0, seam, W, H - seam); c.clip();
    Draw.vGrad(c, 0, seam, W, H - seam, [
      [0, tone(wk.wood, -0.5)], [0.55, tone(wk.wood, -0.66)], [1, '#0a0c12']
    ]);
    /* baseboard where wall meets floor */
    c.fillStyle = tone(wk.wood, -0.24);
    c.fillRect(0, seam - 12, W, 14);
    c.fillStyle = 'rgba(255,232,190,.10)';
    c.fillRect(0, seam - 12, W, 3);
    /* boards fanning out */
    for (var i = -7; i <= 7; i++) {
      var x0 = W / 2 + i * (W / 22), x1 = W / 2 + i * (W / 4.2);
      c.strokeStyle = 'rgba(0,0,0,.34)'; c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(x0, seam); c.lineTo(x1, H); c.stroke();
      c.strokeStyle = 'rgba(255,226,178,.05)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x0 + 3, seam); c.lineTo(x1 + 8, H); c.stroke();
    }
    /* cross joints, closer together the further back they are */
    var y = seam, step = 18;
    while (y < H) {
      c.fillStyle = 'rgba(0,0,0,.2)';
      c.fillRect(0, y, W, 2.5);
      step *= 1.3; y += step;
    }
    c.restore();
  },

  /* rows of tables in the middle distance, with the boys who are already
     eating. Cached with the room, so they cost nothing per frame. */
  farTables: function (c, wk, seam) {
    var W = CFG.W, H = CFG.H;
    var span = H * 0.30;
    var rows = [
      { y: seam + span * 0.14, s: 0.30, n: 10 },
      { y: seam + span * 0.52, s: 0.40, n: 8 },
      { y: seam + span * 1.02, s: 0.54, n: 6 }
    ];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var rnd = seedRnd(wk.seed + r * 733);
      var pad = W * (0.16 - r * 0.06);
      for (var i = 0; i < row.n; i++) {
        var x = pad + (W - pad * 2) * (i + 0.5) / row.n;
        Scene.farKid(c, x, row.y, row.s * (0.92 + rnd() * 0.16), rnd, wk);
      }
      /* the table they are sitting behind, and the bench in front of it */
      var th = 26 * row.s + 12;
      c.save();
      var tx = pad * 0.3, tw = W - pad * 0.6;
      Draw.vGrad(c, tx, row.y, tw, th, [
        [0, tone(wk.wood, -0.05)], [1, tone(wk.wood, -0.45)]
      ]);
      c.fillStyle = 'rgba(255,236,200,.12)';
      c.fillRect(tx, row.y, tw, 3);
      /* a few plates and cups left on it */
      var rnd2 = seedRnd(wk.seed + r * 91);
      for (var p = 0; p < 9; p++) {
        var px = tx + tw * rnd2();
        c.fillStyle = 'rgba(240,235,220,.5)';
        c.beginPath();
        c.ellipse(px, row.y + th * 0.45, 10 * row.s + 4, 3.6 * row.s + 1.6, 0, 0, TAU);
        c.fill();
      }
      /* bench, a plank on two legs */
      var by = row.y + th + 10 * row.s + 6;
      c.fillStyle = tone(wk.wood, -0.34);
      c.fillRect(tx + 10, by, tw - 20, 7 * row.s + 4);
      c.fillStyle = 'rgba(0,0,0,.3)';
      c.fillRect(tx + 40, by + 7 * row.s + 4, 7, 12 * row.s + 4);
      c.fillRect(tx + tw - 47, by + 7 * row.s + 4, 7, 12 * row.s + 4);
      c.restore();
    }
  },

  farKid: function (c, x, y, s, rnd, wk) {
    var skin = KID_SKIN[Math.floor(rnd() * KID_SKIN.length)];
    var shirt = KID_SHIRT[Math.floor(rnd() * KID_SHIRT.length)];
    var kip = KID_KIPPAH[Math.floor(rnd() * KID_KIPPAH.length)];
    var hair = KID_HAIR[Math.floor(rnd() * KID_HAIR.length)];
    c.save();
    c.translate(x, y + 6);
    c.scale(s, s);
    c.globalAlpha = 0.92;
    c.fillStyle = tone(shirt, -0.34);
    Draw.rr(c, -34, -58, 68, 66, 18); c.fill();
    c.fillStyle = tone(skin, -0.18);
    c.beginPath(); c.ellipse(0, -88, 25, 27, 0, 0, TAU); c.fill();
    c.fillStyle = tone(hair, -0.1);
    c.beginPath(); c.ellipse(0, -96, 25, 21, 0, Math.PI, TAU); c.fill();
    c.fillStyle = kip;
    c.beginPath(); c.ellipse(0, -108, 20, 12, 0, Math.PI, TAU); c.fill();
    c.fillStyle = 'rgba(20,16,12,.55)';
    c.beginPath(); c.arc(-8, -86, 2.6, 0, TAU); c.fill();
    c.beginPath(); c.arc(8, -86, 2.6, 0, TAU); c.fill();
    c.restore();
  },

  /* the door at the end of the hall, propped open on a summer evening. The
     boys walk in from this side, so the light comes from here. */
  door: function (c, x, seam, w, h, wk) {
    var y = seam - h;
    c.save();
    /* frame */
    c.fillStyle = tone(wk.wood, -0.16);
    Draw.rr(c, x - 8, y - 8, w + 16, h + 8, 6); c.fill();
    /* the doorway itself, with the grounds beyond */
    Draw.vGrad(c, x, y, w, h, [
      [0, tone(wk.light, -0.18)], [0.55, '#5b8a6c'], [1, '#233c2e']
    ]);
    /* a screen door, half open */
    c.globalAlpha = 0.85;
    c.fillStyle = tone(wk.wood, -0.28);
    Draw.rr(c, x + w * 0.52, y, w * 0.48, h, 4); c.fill();
    c.globalAlpha = 0.3;
    c.fillStyle = '#0d1a14';
    Draw.rr(c, x + w * 0.56, y + 10, w * 0.4, h - 20, 3); c.fill();
    c.globalAlpha = 1;
    /* light on the floor in front of it */
    var g = c.createLinearGradient(0, seam, 0, seam + h * 0.5);
    g.addColorStop(0, 'rgba(255,232,180,.22)');
    g.addColorStop(1, 'rgba(255,232,180,0)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, seam); c.lineTo(x + w, seam);
    c.lineTo(x + w * 1.5, seam + h * 0.5); c.lineTo(x - w * 0.5, seam + h * 0.5);
    c.closePath(); c.fill();
    c.restore();
  },

  window: function (c, x, y, w, h, wk) {
    c.save();
    Draw.rr(c, x - 6, y - 6, w + 12, h + 12, 8);
    c.fillStyle = tone(wk.wood, -0.2); c.fill();
    Draw.vGrad(c, x, y, w, h, [[0, tone(wk.light, -0.1)], [1, '#4d7a63']]);
    c.globalAlpha = 0.5;
    c.fillStyle = '#0d1a14';
    c.fillRect(x, y + h * 0.62, w, h * 0.38);
    c.globalAlpha = 1;
    c.strokeStyle = tone(wk.wood, -0.35); c.lineWidth = 6;
    c.beginPath();
    c.moveTo(x + w / 2, y); c.lineTo(x + w / 2, y + h);
    c.moveTo(x, y + h / 2); c.lineTo(x + w, y + h / 2);
    c.stroke();
    c.restore();
  },

  notice: function (c, x, y, w, h, label, wk) {
    c.save();
    Draw.rr(c, x, y, w, h, 6);
    c.fillStyle = 'rgba(246,238,214,.86)'; c.fill();
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.stroke();
    Draw.text(c, label, x + w / 2, y + 20, {
      size: 16, color: '#5c4326', align: 'center', weight: '900'
    });
    c.strokeStyle = 'rgba(92,67,38,.5)'; c.lineWidth = 2;
    for (var i = 0; i < 2; i++) {
      c.beginPath();
      c.moveTo(x + 16, y + 34 + i * 10); c.lineTo(x + w - 16, y + 34 + i * 10);
      c.stroke();
    }
    c.restore();
  },

  /* the draped banner over the servery: the camp on top, the nusach written
     underneath in somebody's marker pen */
  banner: function (c, wk) {
    var W = CFG.W;
    var x = W * 0.06, w = W * 0.88;
    /* the cloth hangs behind the score and moves cards, so the writing sits
       in its lower half where nothing covers it */
    var top = 4, sag = 26, h = 132;
    c.save();
    /* the rope it hangs from */
    c.strokeStyle = 'rgba(20,14,10,.8)'; c.lineWidth = 5;
    c.beginPath();
    c.moveTo(0, top + 6);
    c.quadraticCurveTo(W / 2, top + sag + 10, W, top + 6);
    c.stroke();

    /* the cloth, sagging in the middle the way cloth does */
    c.beginPath();
    c.moveTo(x, top);
    c.quadraticCurveTo(W / 2, top + sag, x + w, top);
    c.lineTo(x + w, top + h - 8);
    c.quadraticCurveTo(W / 2, top + h + sag, x, top + h - 8);
    c.closePath();
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, '#fdf7e6');
    g.addColorStop(0.6, '#f4e9cf');
    g.addColorStop(1, '#e2d2ae');
    c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(120,92,52,.45)'; c.lineWidth = 2; c.stroke();
    /* a fold of shadow so it is cloth and not cardboard */
    c.save();
    c.clip();
    c.globalAlpha = 0.12;
    c.fillStyle = '#6b5330';
    c.fillRect(x, top + h - 34, w, 34);
    c.globalAlpha = 0.08;
    for (var i = 1; i < 5; i++) {
      c.fillRect(x + w * i / 5, top, 10, h + 30);
    }
    c.restore();

    Draw.textFit(c, 'CAMP KOSH', W / 2, top + 84, w - 90, {
      size: 46, color: '#2f4f86', align: 'center', weight: '900'
    });
    Draw.text(c, Nusach.current().name, W / 2, top + 118, {
      size: 25, color: '#a4712a', align: 'center', weight: '700', script: true
    });
    /* pennants strung along the rope, like every camp hall */
    var cols = wk.bunting;
    for (i = 0; i < 3; i++) {
      Scene.pennant(c, 24 + i * 30, top + 12 + i * 5, cols[i % cols.length]);
      Scene.pennant(c, W - 24 - i * 30, top + 12 + i * 5, cols[(i + 1) % cols.length]);
    }
    c.restore();
  },

  pennant: function (c, x, y, col) {
    c.save();
    c.fillStyle = col;
    c.globalAlpha = 0.9;
    c.beginPath();
    c.moveTo(x - 13, y); c.lineTo(x + 13, y); c.lineTo(x, y + 30);
    c.closePath(); c.fill();
    c.restore();
  },

  /* the wash station: basin, tap, towel, and the two-handled cup on the ledge */
  sink: function (c, x, y, wk, floorY) {
    c.save();
    /* counter */
    Draw.rr(c, x, y, 200, 20, 5);
    c.fillStyle = tone(wk.wood, -0.12); c.fill();
    c.fillStyle = tone(wk.wood, -0.45);
    c.fillRect(x + 10, y + 20, 180, Math.max(74, (floorY || 0) - y - 20));
    /* basin */
    Draw.rr(c, x + 30, y + 2, 116, 16, 5);
    c.fillStyle = '#2b3648'; c.fill();
    /* tap */
    c.strokeStyle = '#c9d4e4'; c.lineWidth = 7; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x + 88, y - 4);
    c.lineTo(x + 88, y - 44);
    c.quadraticCurveTo(x + 88, y - 58, x + 106, y - 58);
    c.stroke();
    /* the cup, waiting on the ledge */
    drawWashCup(c, x + 166, y - 18, 40, 0);
    /* towel */
    c.fillStyle = '#e8ddc4';
    Draw.rr(c, x + 8, y - 46, 34, 44, 6); c.fill();
    c.restore();
  },

  /* string lights, the one thing in the room that flickers */
  drawLights: function (ctx, t, wk) {
    var W = CFG.W, n = 9;
    ctx.save();
    ctx.strokeStyle = 'rgba(24,18,12,.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10, 128);
    ctx.quadraticCurveTo(W / 2, 176, W + 10, 128);
    ctx.stroke();
    for (var i = 0; i <= n; i++) {
      var u = i / n;
      var x = -10 + (W + 20) * u;
      var y = 128 + Math.sin(Math.PI * u) * 46;
      var glow = 0.6 + 0.4 * pulse(t * 0.5 + i * 0.7, 0.6);
      ctx.globalAlpha = glow;
      ctx.fillStyle = wk.light;
      ctx.shadowColor = wk.light; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(x, y + 8, 6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  },

  /* small floating food silhouettes on the menus */
  drift: [],
  initDrift: function () {
    Scene.drift.length = 0;
    for (var i = 0; i < 9; i++) {
      Scene.drift.push({
        f: pick(FOODS.filter(function (f) { return f.cat !== 'treif' && f.cat !== 'mixed'; })),
        x: rand(40, CFG.W - 40), y: rand(120, CFG.H - 120),
        s: rand(46, 92), sp: rand(6, 20), ph: rand(0, TAU), seed: randInt(1, 9999)
      });
    }
  },
  drawDrift: function (ctx, t) {
    ctx.save();
    ctx.globalAlpha = 0.13;
    for (var i = 0; i < Scene.drift.length; i++) {
      var d = Scene.drift[i];
      var y = d.y - (t * d.sp) % (CFG.H + 200);
      if (y < -100) y += CFG.H + 200;
      ctx.save();
      ctx.translate(d.x + Math.sin(t * 0.4 + d.ph) * 22, y);
      ctx.rotate(Math.sin(t * 0.3 + d.ph) * 0.3);
      drawFood(ctx, d.f, 0, 0, d.s, d.seed);
      ctx.restore();
    }
    ctx.restore();
  }
};

/* ============================================================== THE BOYS */
/* A netilas yadayim cup: straight-sided, a handle on each side, and a rim you
   can pour a clean shtitzel of water off. Drawn everywhere the washing is. */
function drawWashCup(ctx, x, y, size, tilt) {
  var s = size / 40;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt || 0);
  ctx.scale(s, s);
  var body = ctx.createLinearGradient(-16, 0, 16, 0);
  body.addColorStop(0, '#8fa2bb');
  body.addColorStop(0.35, '#e6eef8');
  body.addColorStop(0.7, '#b8c6d9');
  body.addColorStop(1, '#7d8ea6');
  /* the two handles */
  ctx.strokeStyle = '#a9b8cc';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-19, -2, 9, -1.1, 1.1); ctx.stroke();
  ctx.beginPath(); ctx.arc(19, -2, 9, Math.PI - 1.1, Math.PI + 1.1, true); ctx.stroke();
  /* body */
  ctx.beginPath();
  ctx.moveTo(-15, -14);
  ctx.lineTo(15, -14);
  ctx.lineTo(12, 16);
  ctx.quadraticCurveTo(0, 21, -12, 16);
  ctx.closePath();
  ctx.fillStyle = body; ctx.fill();
  ctx.strokeStyle = 'rgba(30,40,58,.55)'; ctx.lineWidth = 2; ctx.stroke();
  /* rim */
  ctx.beginPath(); ctx.ellipse(0, -14, 15, 4.5, 0, 0, TAU);
  ctx.fillStyle = '#eef4fb'; ctx.fill();
  ctx.strokeStyle = 'rgba(30,40,58,.5)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -13, 10, 2.6, 0, 0, TAU);
  ctx.fillStyle = '#7fb6de'; ctx.fill();
  ctx.restore();
}

/* a glass of water for the RINSE side of the room */
function drawWaterGlass(ctx, x, y, size, tilt) {
  var s = size / 40;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt || 0);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-11, -15); ctx.lineTo(11, -15);
  ctx.lineTo(8, 17); ctx.quadraticCurveTo(0, 20, -8, 17);
  ctx.closePath();
  ctx.fillStyle = 'rgba(190,225,250,.45)'; ctx.fill();
  ctx.strokeStyle = 'rgba(225,245,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-9.4, -6); ctx.lineTo(9.4, -6);
  ctx.lineTo(8, 16); ctx.quadraticCurveTo(0, 19, -8, 16);
  ctx.closePath();
  ctx.fillStyle = '#6fc0e8'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -6, 9.4, 2.6, 0, 0, TAU);
  ctx.fillStyle = '#a9dcf4'; ctx.fill();
  ctx.restore();
}

/* a bentcher: the little booklet from somebody's bar mitzvah, gold on the edge */
function drawBentcher(ctx, x, y, size, alpha) {
  var s = size / 34;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.rotate(-0.1);
  ctx.fillStyle = '#7c2b34';
  Draw.rr(ctx, -15, -12, 30, 24, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = '#f4ecd8';
  Draw.rr(ctx, -12, -9, 24, 18, 2); ctx.fill();
  ctx.fillStyle = '#c9a13c';
  ctx.fillRect(-15, -12, 3.5, 24);
  ctx.strokeStyle = 'rgba(100,78,44,.55)'; ctx.lineWidth = 1;
  for (var i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-8, -5 + i * 4.4); ctx.lineTo(8, -5 + i * 4.4); ctx.stroke();
  }
  ctx.restore();
}

var KID_SKIN = ['#f2c8a4', '#e8b183', '#d99a68', '#b9744a', '#8d5433', '#6d3f26'];
var KID_HAIR = ['#2b1b12', '#4a2c18', '#7b4a22', '#a8702f', '#c8963f', '#1a1410'];
var KID_KIPPAH = ['#2f4f86', '#8e2f3e', '#1f6f52', '#5a3a86', '#0f0f14', '#b0842c', '#f6efdd'];
var KID_SHIRT = ['#3f74c4', '#4aa06a', '#d9722f', '#7a55b8', '#c74a5a', '#2f9aa8', '#d0a52c'];
var KID_LINES = ['More kugel!', 'Yum!', 'When is lunch?', 'Nu?'];
/* what a boy says once the simcha is nearly gone - nobody says Yum then */
var KID_HUNGRY = ['I am starving!', 'Nu, is there food?', 'We are still waiting!',
  'My stomach hurts', 'Did they forget us?'];
/* what one boy calls out when fish just rode in beside dairy - Ashkenaz and
   Sefard only, since that is the plate that just happened */
var KID_DUAL = ['Yay, we\'re Ashkenazim!', 'Fish and dairy, yum! Thanks, Rema!'];
/* how long each thing a boy does takes */
var KID_LEN = { wash: 2.4, eat: 1.7, bentch: 2.8, cheer: 1.2, drink: 1.2, wave: 1.2 };

/* tiny deterministic rng so week three has the same boys every time */
function seedRnd(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

var Kids = {
  /* The boys on this table: the same ones from the first plate to the last, so
     what they ate two hours ago still counts. Different boys next week. */
  build: function (play) {
    var wk = WEEKS[clamp(play.level.week, 0, WEEKS.length - 1)];
    var rnd = seedRnd(wk.seed * 31 + play.li * 7919);
    var n = clamp(wk.kids, 4, 7);
    play.kids = [];
    for (var i = 0; i < n; i++) {
      var k = {
        skin: KID_SKIN[Math.floor(rnd() * KID_SKIN.length)],
        hair: KID_HAIR[Math.floor(rnd() * KID_HAIR.length)],
        kippah: KID_KIPPAH[Math.floor(rnd() * KID_KIPPAH.length)],
        knit: rnd() < 0.45,
        peyos: rnd() < 0.5,
        glasses: rnd() < 0.22,
        shirt: KID_SHIRT[Math.floor(rnd() * KID_SHIRT.length)],
        stripe: rnd() < 0.5,
        ph: rnd() * TAU,
        line: KID_LINES[Math.floor(rnd() * KID_LINES.length)],
        hline: KID_HUNGRY[Math.floor(rnd() * KID_HUNGRY.length)],
        dualLine: null,
        pose: Math.floor(rnd() * 3),
        state: 'idle', st: 0, delay: 0, blink: rnd() * 4 + 1,
        bubble: 0, x: 0, home: 0, s: 1, base: 0, placed: false,
        crier: rnd() < 0.34
      };
      /* every shade this boy needs, worked out once. Six boys times a dozen
         colour conversions every frame is a frame budget on a cheap phone. */
      k.shirtLit = tone(k.shirt, 0.16);
      k.shirtDim = tone(k.shirt, -0.3);
      k.collar = tone(k.shirt, -0.45);
      k.print = tone(k.shirt, 0.42);
      k.skinLit = tone(k.skin, 0.14);
      k.skinDim = tone(k.skin, -0.22);
      k.ear = tone(k.skin, -0.08);
      k.hand = tone(k.skin, 0.08);
      k.hairDim = tone(k.hair, -0.1);
      k.kipDim = tone(k.kippah, -0.3);
      play.kids.push(k);
    }
    play.cup = { t: 0, x: 0, y: 0 };
  },

  layout: function (play) {
    if (!play.kids) Kids.build(play);
    var colX = View.colX(), colW = View.colW();
    /* the bottom of the room is anchored to the bottom of the screen, so a
       tall phone gets more hall and not a hole */
    var btnH = 78;
    var btnY = CFG.H - View.safe.b - 22 - btnH;
    play.btnY = btnY; play.btnH = btnH;
    play.tableY = btnY - 14;
    var station = 96;                       /* the sink at the end of the table */
    play.sinkX = colX + colW - station / 2 - 6;
    play.sinkY = play.tableY - 6;
    var n = play.kids.length;
    var room = colW - station - 16;
    var step = room / n;
    var s = clamp(step / 104, 0.58, 1);
    for (var i = 0; i < n; i++) {
      var k = play.kids[i];
      k.home = colX + 8 + step * (i + 0.5);
      if (!k.placed) { k.x = k.home; k.placed = true; }
      k.s = s * (0.94 + ((i % 3) * 0.05));
      k.base = play.tableY - 4 + ((i % 2) ? 3 : 0);
    }
    /* the three free actions, side by side under the table */
    var row = [play.washBtn, play.rinseBtn, play.bentchBtn];
    var gap = 11, side = 14;
    var bw = (colW - side * 2 - gap * 2) / 3;
    for (i = 0; i < row.length; i++) {
      if (!row[i]) continue;
      row[i].y = btnY; row[i].h = btnH;
      row[i].x = colX + side + i * (bw + gap);
      row[i].w = bw;
    }
  },

  /* everybody does the same thing, a beat apart, so it looks like a room of
     boys and not a chorus line */
  order: function (play, what, opts) {
    if (!play.kids) return;
    opts = opts || {};
    for (var i = 0; i < play.kids.length; i++) {
      var k = play.kids[i];
      k.state = (what === 'eat' && opts.big && i % 2 === 0) ? 'cheer' : what;
      /* washing is a queue, so the boys go one at a time, not in unison */
      k.st = -i * (what === 'wash' ? 0.24 : 0.09);
      k.food = opts.color || PAL.cream;
    }
    if (what === 'wash') play.cup.t = 0.001;
  },

  /* one boy, picked at random, calls out that this plate was a fish-and-dairy
     double - only while there is a bubble to say it in */
  sayDual: function (play) {
    if (!play.kids || !play.kids.length) return;
    var calm = play.kids.filter(function (k) { return k.state !== 'wash'; });
    var k = pick(calm.length ? calm : play.kids);
    k.dualLine = pick(KID_DUAL);
    k.bubble = 2.4;
  },

  update: function (dt, play) {
    if (!play.kids) return;
    var hungry = play.simcha < 26;
    for (var i = 0; i < play.kids.length; i++) {
      var k = play.kids[i];
      k.st += dt;
      k.blink -= dt;
      if (k.blink < -0.12) k.blink = rand(2, 6);
      if (k.bubble > 0) { k.bubble -= dt; if (k.bubble <= 0) k.dualLine = null; }
      var len = KID_LEN[k.state] || 1.2;
      if (k.state !== 'idle' && k.st > len) { k.state = 'idle'; k.st = 0; }
      /* the walk to the sink and back */
      var want = k.home;
      if (k.state === 'wash') {
        var u = clamp(k.st / 2.4, 0, 1);
        /* a line at the sink, far enough apart to still read as boys */
        var step2 = Math.min(58, (play.sinkX - View.colX() - 90) / Math.max(1, play.kids.length));
        var queue = play.sinkX - 66 - (play.kids.length - 1 - i) * step2;
        var go = u < 0.3 ? u / 0.3 : (u > 0.78 ? 1 - (u - 0.78) / 0.22 : 1);
        want = lerp(k.home, queue, easeOut(clamp(go, 0, 1)));
      }
      k.x += (want - k.x) * Math.min(1, dt * 9);
      /* a hungry boy fidgets */
      if (hungry && k.state === 'idle' && chance(dt * 0.25)) { k.bubble = 1.6; }
    }
    if (play.cup.t > 0) {
      play.cup.t += dt;
      if (play.cup.t > 2.6) play.cup.t = 0;
    }
  },

  /* a tap on a boy gets a wave and a word out of him */
  tap: function (play, x, y) {
    if (!play.kids) return false;
    for (var i = 0; i < play.kids.length; i++) {
      var k = play.kids[i];
      var w = 56 * k.s, h = 128 * k.s;
      if (x > k.x - w && x < k.x + w && y > k.base - h && y < k.base + 10) {
        k.bubble = 2.0;
        if (k.state === 'idle') { k.state = 'wave'; k.st = 0; }
        Sound.tone({ f: 620 + i * 40, f2: 900, dur: 0.1, vol: 0.1, type: 'triangle' });
        Haptics.tick();
        return true;
      }
    }
    return false;
  },

  draw: function (ctx, play, t) {
    if (!play.kids) return;
    var wk = WEEKS[clamp(play.level.week, 0, WEEKS.length - 1)];
    /* their faces are the honest read on the simcha bar, so they go glum
       well before it empties */
    var mood = play.simcha >= 60 ? 2 : (play.simcha >= 34 ? 1 : 0);

    /* the wash station at the end of the table */
    Kids.station(ctx, play, t);

    for (var i = 0; i < play.kids.length; i++) {
      drawKid(ctx, play.kids[i], t, mood, play);
    }

    /* the table they are sitting at, drawn over them so they are behind it.
       Nothing on it moves, so it is one cached strip. */
    Kids.table(ctx, play, wk);

    for (i = 0; i < play.kids.length; i++) {
      var k = play.kids[i];
      if (k.bubble > 0) drawBubble(ctx, k, k.bubble, mood);
    }
  },

  /* the near edge of the table with its place settings, painted once */
  table: function (ctx, play, wk) {
    var ty = Math.round(play.tableY);
    var h = CFG.H - ty;
    var colX = View.colX(), colW = View.colW();
    var key = 'hall-table|' + Scene.week + '|' + ty + '|' + Math.round(colX) +
      'x' + Math.round(colW) + '|' + play.kids.length +
      '|' + Math.round(CFG.W) + '|' + Math.round(View.scale * View.dpr * 100);
    var dw = Math.max(2, Math.round(CFG.W * View.scale * View.dpr));
    var dh = Math.max(2, Math.round(h * View.scale * View.dpr));
    var homes = play.kids.map(function (k) { return { x: k.home, s: k.s }; });
    var cv = Sprite.make(key, dw, dh, function (c) {
      c.scale(dw / CFG.W, dh / h);
      c.translate(0, -ty);
      Draw.vGrad(c, 0, ty, CFG.W, h, [
        [0, tone(wk.wood, 0.06)], [0.14, tone(wk.wood, -0.18)], [1, tone(wk.wood, -0.5)]
      ]);
      c.fillStyle = 'rgba(255,236,200,.16)';
      c.fillRect(0, ty, CFG.W, 4);
      c.save();
      c.globalAlpha = 0.18;
      c.strokeStyle = '#2a1c10'; c.lineWidth = 2;
      for (var g = 0; g < 5; g++) {
        var gx = colX + colW * (g + 0.5) / 5;
        c.beginPath(); c.moveTo(gx, ty + 6); c.lineTo(gx - 12, CFG.H); c.stroke();
      }
      c.restore();
      /* what is already laid in front of every boy */
      for (var i = 0; i < homes.length; i++) {
        c.save();
        c.translate(homes[i].x, ty + 10);
        c.scale(homes[i].s, homes[i].s);
        c.fillStyle = 'rgba(244,240,228,.9)';
        c.beginPath(); c.ellipse(0, 0, 26, 8, 0, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(120,100,74,.5)'; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = 'rgba(214,206,188,.9)';
        c.beginPath(); c.ellipse(0, -1, 16, 4.6, 0, 0, TAU); c.fill();
        c.fillStyle = 'rgba(190,225,250,.55)';
        Draw.rr(c, 30, -14, 13, 16, 3); c.fill();
        c.strokeStyle = 'rgba(230,245,255,.7)'; c.lineWidth = 1.3; c.stroke();
        if (i % 2 === 0) {
          c.strokeStyle = 'rgba(206,214,226,.75)'; c.lineWidth = 2; c.lineCap = 'round';
          c.beginPath(); c.moveTo(-34, -6); c.lineTo(-32, 4); c.stroke();
          c.beginPath(); c.moveTo(-29, -6); c.lineTo(-27, 4); c.stroke();
        }
        c.restore();
      }
    });
    ctx.drawImage(cv, 0, ty, CFG.W, h);
  },

  station: function (ctx, play, t) {
    var x = play.sinkX, y = play.sinkY;
    ctx.save();
    /* pedestal */
    ctx.fillStyle = 'rgba(28,34,46,.9)';
    Draw.rr(ctx, x - 34, y - 34, 68, 40, 8); ctx.fill();
    ctx.fillStyle = '#354055';
    Draw.rr(ctx, x - 30, y - 40, 60, 14, 5); ctx.fill();
    ctx.fillStyle = '#1d2432';
    Draw.rr(ctx, x - 22, y - 38, 44, 9, 4); ctx.fill();
    /* tap */
    ctx.strokeStyle = '#c3cfe0'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 26, y - 40); ctx.lineTo(x - 26, y - 62);
    ctx.quadraticCurveTo(x - 26, y - 72, x - 12, y - 72);
    ctx.stroke();
    /* the cup lives here unless the boys are using it */
    if (play.cup.t <= 0) drawWashCup(ctx, x + 12, y - 52, 34, 0.05);
    ctx.restore();
  }
};

/* one boy, from the chest up, on the far side of the table */
function drawKid(ctx, k, t, mood, play) {
  var s = k.s;
  var st = Math.max(0, k.st);
  var bob = Math.sin(t * 1.6 + k.ph) * 2.4;
  var hop = 0;
  if (k.state === 'cheer') hop = -Math.abs(Math.sin(st * 7)) * 12 * easeOut(1 - st / 1.2);
  if (mood === 0) bob *= 0.4;

  ctx.save();
  ctx.translate(k.x, k.base + bob + hop);
  ctx.scale(s, s);

  /* shadow under him on the bench */
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 6, 40, 9, 0, 0, TAU); ctx.fill();

  var lean = mood === 0 ? 5 : 0;
  ctx.translate(0, lean);

  /* Torso first, sleeves and all, so there is a shoulder for an arm to
     actually come out of. Arms go on top of it next - a raised hand has to
     reach past the collar, not vanish behind it - and anything held goes on
     last, in the drawn hand. */
  ctx.fillStyle = k.shirt;
  Draw.rr(ctx, -36, -60, 72, 70, 20); ctx.fill();
  ctx.fillStyle = k.shirtLit;
  Draw.rr(ctx, -34, -58, 68, 26, 16); ctx.fill();
  /* sleeves, wide enough to cover where the arm joins on */
  ctx.fillStyle = k.shirtDim;
  Draw.rr(ctx, -48, -58, 22, 30, 11); ctx.fill();
  Draw.rr(ctx, 26, -58, 22, 30, 11); ctx.fill();
  /* collar */
  ctx.strokeStyle = k.collar; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, -62, 15, 0.25, Math.PI - 0.25); ctx.stroke();
  /* camp t-shirt: a printed band across the chest. No jewellery on anybody. */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = k.print;
  Draw.rr(ctx, -26, -36, 52, 9, 4); ctx.fill();
  if (k.stripe) {
    ctx.globalAlpha = 0.3;
    Draw.rr(ctx, -20, -22, 40, 5, 2); ctx.fill();
  }
  ctx.restore();

  var chew = 0;
  var prop = null;
  if (k.state === 'eat') {
    var u = clamp(st / 1.7, 0, 1);
    var lift = Math.sin(u * Math.PI);
    chew = u > 0.45 ? Math.abs(Math.sin(st * 14)) : 0;
    kidArm(ctx, 28, -42, 16 - lift * 6, -44 - lift * 24, k.skin, k.hand);
    kidArm(ctx, -30, -42, -36, -6, k.skin, k.hand);
    prop = function () {
      ctx.save();
      ctx.translate(16 - lift * 6, -44 - lift * 26);
      ctx.rotate(-0.4 + lift * 0.3);
      ctx.strokeStyle = '#cdd7e6'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -8); ctx.stroke();
      ctx.fillStyle = k.food || '#e0b25c';
      ctx.beginPath(); ctx.arc(0, -11, 6, 0, TAU); ctx.fill();
      ctx.restore();
    };
  } else if (k.state === 'drink') {
    var d = clamp(st / 1.2, 0, 1);
    var up = Math.sin(d * Math.PI);
    kidArm(ctx, 26, -42, 14, -46 - up * 18, k.skin, k.hand);
    kidArm(ctx, -30, -42, -36, -6, k.skin, k.hand);
    prop = function () { drawWaterGlass(ctx, 14, -52 - up * 20, 26, up * 0.5); };
  } else if (k.state === 'wash') {
    var w = clamp(st / 2.4, 0, 1);
    var pour = w > 0.34 && w < 0.76;
    var side = Math.floor((w - 0.34) / 0.14) % 2 ? -1 : 1;
    kidArm(ctx, -26, -42, -16, -54, k.skin, k.hand);
    kidArm(ctx, 26, -42, 16, -54, k.skin, k.hand);
    prop = function () {
      if (!pour) return;
      drawWashCup(ctx, 24 * side, -76, 30, side * 0.7);
      ctx.save();
      ctx.strokeStyle = 'rgba(150,215,245,.85)'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(12 * side, -68);
      ctx.quadraticCurveTo(4 * side, -60, -2 * side, -50);
      ctx.stroke();
      ctx.fillStyle = 'rgba(150,215,245,.8)';
      for (var dp = 0; dp < 3; dp++) {
        var dy = ((t * 120 + dp * 14) % 26);
        ctx.beginPath(); ctx.arc(-4 * side, -50 + dy, 2.2, 0, TAU); ctx.fill();
      }
      ctx.restore();
    };
  } else if (k.state === 'bentch') {
    /* a bentcher in both hands, and the sway that goes with a niggun */
    var sway = Math.sin(st * 3.4 + k.ph) * 0.09;
    ctx.rotate(sway);
    kidArm(ctx, -28, -44, -14, -58, k.skin, k.hand);
    kidArm(ctx, 28, -44, 14, -58, k.skin, k.hand);
    prop = function () {
      ctx.save();
      ctx.translate(0, -62);
      ctx.rotate(-0.12);
      ctx.fillStyle = '#7c2b34';
      Draw.rr(ctx, -17, -13, 34, 26, 3); ctx.fill();
      ctx.fillStyle = '#f4ecd8';
      Draw.rr(ctx, -14, -10, 28, 20, 2); ctx.fill();
      ctx.fillStyle = '#c9a13c';
      ctx.fillRect(-17, -13, 4, 26);
      ctx.strokeStyle = 'rgba(90,70,40,.5)'; ctx.lineWidth = 1;
      for (var ln = 0; ln < 4; ln++) {
        ctx.beginPath();
        ctx.moveTo(-10, -6 + ln * 5); ctx.lineTo(10, -6 + ln * 5); ctx.stroke();
      }
      ctx.restore();
    };
  } else if (k.state === 'cheer') {
    kidArm(ctx, -28, -44, -40, -80, k.skin, k.hand);
    kidArm(ctx, 28, -44, 40, -80, k.skin, k.hand);
  } else if (k.state === 'wave') {
    var wv = Math.sin(st * 12) * 10;
    kidArm(ctx, 28, -44, 42 + wv, -82, k.skin, k.hand);
    kidArm(ctx, -30, -42, -36, -6, k.skin, k.hand);
  } else {
    /* resting on the table, one elbow out - not everybody sits the same */
    var fid = Math.sin(t * 1.1 + k.ph * 2) * 3;
    if (k.pose === 1) {
      kidArm(ctx, -30, -42, -42, -8 + fid, k.skin, k.hand);
      kidArm(ctx, 30, -42, 24, -62, k.skin, k.hand);       /* chin in hand */
    } else if (k.pose === 2) {
      kidArm(ctx, -30, -42, -28, -4, k.skin, k.hand);
      kidArm(ctx, 30, -42, 44, -10 - fid, k.skin, k.hand);
    } else {
      kidArm(ctx, -30, -42, -40, -6 + fid, k.skin, k.hand);
      kidArm(ctx, 30, -42, 40, -6 - fid, k.skin, k.hand);
    }
  }

  if (prop) prop();

  /* neck and head */
  ctx.fillStyle = k.skinDim;
  Draw.rr(ctx, -9, -74, 18, 18, 6); ctx.fill();
  ctx.fillStyle = k.skin;
  ctx.beginPath(); ctx.ellipse(0, -94, 26, 28, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = k.skinLit;
  ctx.beginPath(); ctx.ellipse(-7, -101, 15, 15, 0, 0, TAU); ctx.fill();
  /* ears */
  ctx.fillStyle = k.ear;
  ctx.beginPath(); ctx.ellipse(-26, -92, 5, 7, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(26, -92, 5, 7, 0, 0, TAU); ctx.fill();

  /* hair under the kippah, and peyos for those who wear them */
  ctx.fillStyle = k.hair;
  ctx.beginPath();
  ctx.ellipse(0, -102, 26, 22, 0, Math.PI * 1.02, Math.PI * 1.98);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(-22, -96, 6, 12, 0.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22, -96, 6, 12, -0.2, 0, TAU); ctx.fill();
  if (k.peyos) {
    ctx.strokeStyle = k.hair; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    for (var side2 = -1; side2 <= 1; side2 += 2) {
      ctx.beginPath();
      ctx.moveTo(side2 * 24, -96);
      ctx.quadraticCurveTo(side2 * 31, -86, side2 * 25, -78);
      ctx.quadraticCurveTo(side2 * 19, -70, side2 * 26, -64);
      ctx.stroke();
    }
  }

  /* kippah */
  ctx.save();
  ctx.fillStyle = k.kippah;
  ctx.beginPath();
  ctx.ellipse(0, -114, 21, 13, 0, Math.PI, TAU);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = k.kipDim;
  ctx.beginPath(); ctx.ellipse(0, -114, 21, 4.5, 0, 0, TAU); ctx.fill();
  if (k.knit) {
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, -114, 13, 8, 0, Math.PI, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -114, 6, 4, 0, Math.PI, TAU); ctx.stroke();
  }
  ctx.restore();

  /* face */
  var blink = k.blink < 0;
  var eyeY = -96;
  ctx.fillStyle = '#fdfdfd';
  if (!blink) {
    ctx.beginPath(); ctx.ellipse(-9, eyeY, 5.4, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, eyeY, 5.4, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#20242e';
    var look = Math.sin(t * 0.7 + k.ph) * 1.6;
    ctx.beginPath(); ctx.arc(-9 + look, eyeY + 1, 2.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(9 + look, eyeY + 1, 2.8, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#20242e'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13, eyeY); ctx.lineTo(-5, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, eyeY); ctx.lineTo(13, eyeY); ctx.stroke();
  }
  /* a hungry boy's eyes go heavy before anything else does */
  if (mood === 0 && !blink) {
    ctx.fillStyle = k.skin;
    ctx.beginPath();
    ctx.ellipse(-9, eyeY - 3.4, 6, 4.4, 0, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(9, eyeY - 3.4, 6, 4.4, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,44,.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-13, eyeY + 6); ctx.lineTo(-6, eyeY + 6.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, eyeY + 6.6); ctx.lineTo(13, eyeY + 6); ctx.stroke();
  }
  if (k.glasses) {
    ctx.strokeStyle = 'rgba(40,46,60,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-9, eyeY, 8, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, eyeY, 8, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, eyeY); ctx.lineTo(1, eyeY); ctx.stroke();
  }
  /* brows say more than the mouth does */
  ctx.strokeStyle = k.hairDim; ctx.lineWidth = 3; ctx.lineCap = 'round';
  var browTilt = mood === 0 ? 7 : (mood === 2 ? -1 : 1);
  ctx.beginPath();
  ctx.moveTo(-14, -106 + browTilt); ctx.lineTo(-4, -108); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, -108); ctx.lineTo(14, -106 + browTilt); ctx.stroke();

  /* mouth */
  ctx.strokeStyle = '#7a3b30'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  if (chew > 0 || k.state === 'cheer' || k.state === 'bentch') {
    var open = k.state === 'cheer' ? 7
      : (k.state === 'bentch' ? 3 + Math.abs(Math.sin(st * 4.2)) * 4 : 3 + chew * 4);
    ctx.fillStyle = '#7a3b30';
    ctx.beginPath(); ctx.ellipse(0, -80, 6, open, 0, 0, TAU); ctx.fill();
  } else if (mood === 0) {
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -71, 11, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
    /* and one of them is really taking it badly */
    if (k.crier) {
      var tk = (t * 0.5 + k.ph) % 1;
      ctx.globalAlpha = tk < 0.75 ? 1 : (1 - tk) * 4;
      ctx.fillStyle = '#9ed8ff';
      ctx.beginPath();
      ctx.ellipse(11, eyeY + 8 + tk * 16, 2.4, 3.6, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.beginPath(); ctx.arc(0, -84, 9, 0.25, Math.PI - 0.25); ctx.stroke();
  }
  if (mood === 2) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ff8f7a';
    ctx.beginPath(); ctx.ellipse(-17, -85, 6, 4, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, -85, 6, 4, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function kidArm(ctx, sx, sy, hx, hy, skin, hand) {
  ctx.save();
  ctx.strokeStyle = skin;
  ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo((sx + hx) / 2 + (sx > 0 ? 8 : -8), (sy + hy) / 2 + 6, hx, hy);
  ctx.stroke();
  ctx.fillStyle = hand || skin;
  ctx.beginPath(); ctx.arc(hx, hy, 7, 0, TAU); ctx.fill();
  ctx.restore();
}

function starPath(ctx, x, y, r) {
  ctx.beginPath();
  for (var i = 0; i < 2; i++) {
    for (var p = 0; p < 3; p++) {
      var a = -Math.PI / 2 + (i * Math.PI / 3) + p * (TAU / 3);
      var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
}

function drawBubble(ctx, k, life, mood) {
  var txt = k.dualLine || (mood === 0 ? k.hline : k.line);
  var a = clamp(life / 0.3, 0, 1) * clamp((2.1 - life) / 0.2, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  var size = 17;
  var w = Draw.measure(ctx, txt, size, '800') + 26;
  var h = 34;
  var x = clamp(k.x, 20 + w / 2, CFG.W - 20 - w / 2);
  var y = k.base - 132 * k.s - h;
  Draw.rr(ctx, x - w / 2, y, w, h, 12);
  ctx.fillStyle = 'rgba(252,246,232,.96)'; ctx.fill();
  ctx.strokeStyle = 'rgba(40,30,18,.35)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 8, y + h - 1); ctx.lineTo(x + 2, y + h + 11); ctx.lineTo(x + 8, y + h - 1);
  ctx.closePath();
  ctx.fillStyle = 'rgba(252,246,232,.96)'; ctx.fill();
  Draw.text(ctx, txt, x, y + h / 2, {
    size: size, color: '#42301a', align: 'center', weight: '800'
  });
  ctx.restore();
}

/* small category badge so the tiles read without relying on colour alone */
function catBadge(ctx, cat, x, y, r) {
  /* anything headed for the bin gets a red mark, not a polite grey one */
  var c = (cat === 'treif' || cat === 'mixed') ? PAL.red : CAT[cat].color;
  if (cat === 'treif' || cat === 'mixed') r *= 1.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(4,7,14,.8)';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.fillStyle = c;
  ctx.strokeStyle = c;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  var k = r * 0.58;
  if (cat === 'meat') {                       /* triangle */
    ctx.beginPath();
    ctx.moveTo(0, -k); ctx.lineTo(k, k * 0.8); ctx.lineTo(-k, k * 0.8);
    ctx.closePath(); ctx.fill();
  } else if (cat === 'dairy') {                /* drop */
    ctx.beginPath();
    ctx.moveTo(0, -k * 1.1);
    ctx.quadraticCurveTo(k, 0, 0, k);
    ctx.quadraticCurveTo(-k, 0, 0, -k * 1.1);
    ctx.fill();
  } else if (cat === 'fish') {                 /* wave */
    ctx.beginPath();
    ctx.moveTo(-k, k * 0.3);
    ctx.quadraticCurveTo(-k * 0.4, -k * 0.7, 0, k * 0.1);
    ctx.quadraticCurveTo(k * 0.4, k * 0.9, k, -k * 0.2);
    ctx.stroke();
  } else if (cat === 'pareve') {               /* leaf */
    ctx.beginPath();
    ctx.moveTo(-k * 0.8, k * 0.7);
    ctx.quadraticCurveTo(-k * 0.2, -k, k * 0.9, -k * 0.6);
    ctx.quadraticCurveTo(k * 0.2, k * 0.6, -k * 0.8, k * 0.7);
    ctx.fill();
  } else {                                     /* X for anything binned */
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(-k * 0.85, -k * 0.85); ctx.lineTo(k * 0.85, k * 0.85);
    ctx.moveTo(k * 0.85, -k * 0.85); ctx.lineTo(-k * 0.85, k * 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

/* --------------------------------------------------------------- a dish */
function drawDish(ctx, o) {
  var s = o.size, half = s / 2;
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.shake) ctx.translate(rand(-1, 1) * 5 * o.shake, 0);
  if (o.scale && o.scale !== 1) ctx.scale(o.scale, o.scale);
  if (o.rot) ctx.rotate(o.rot);

  if (o.glow) {
    ctx.shadowColor = CAT[o.food.cat].color;
    ctx.shadowBlur = o.glow;
  }
  Sprite.blit(ctx, Sprite.dish(o.food, s, o.selected, o.seed), 0, 0, s);
  ctx.shadowBlur = 0;

  /* dimmed while the kitchen is making it wait - light enough that you can
     still see which dish it is, because that is the whole point */
  if (o.blocked) {
    ctx.save();
    Draw.rr(ctx, -half, -half, s, s, s * 0.28);
    ctx.clip();
    ctx.fillStyle = 'rgba(6,9,18,.5)';
    ctx.fillRect(-half, -half, s, s);
    ctx.restore();
    /* little hourglass, tucked in the corner opposite the category badge */
    ctx.save();
    ctx.translate(-half + s * 0.19, half - s * 0.19);
    ctx.fillStyle = 'rgba(4,7,14,.85)';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.14, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.gold; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    ctx.stroke();
    var q = s * 0.062;
    ctx.beginPath();
    ctx.moveTo(-q, -q * 1.4); ctx.lineTo(q, -q * 1.4);
    ctx.lineTo(-q, q * 1.4); ctx.lineTo(q, q * 1.4);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawLid(ctx, x, y, s, t) {
  Sprite.blit(ctx, Sprite.lid(s), x, y, s);
  /* the knob breathes, so it has to stay live */
  ctx.save();
  ctx.translate(x, y);
  var k = 1 + 0.12 * pulse(t, 0.8);
  ctx.fillStyle = PAL.gold;
  ctx.beginPath();
  ctx.arc(0, s * 0.16 - s * 0.34 - s * 0.06, s * 0.075 * k, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ============================================================ PLAY DRAW */
Play.prototype.render = function (ctx) {
  var t = this.t, b = this.board, i;
  Scene.drawHall(ctx, t, true);
  /* the boys and their table, behind everything the kitchen puts on top */
  Kids.draw(ctx, this, t);

  /* board tray */
  Draw.panel(ctx, b.bx - 12, b.by - 12, b.bw + 24, b.bh + 24, {
    fill: 'rgba(6,10,20,.55)', stroke: 'rgba(255,255,255,.10)', strokeW: 2, radius: 26
  });

  /* the ribbon is painted twice: a wide glow beneath the dishes and a bright
     core over them, so the link is unmistakable at arm's length */
  this.drawRibbon(ctx, false);

  /* dishes */
  var selected = {};
  for (i = 0; i < this.chain.length; i++) selected[this.chain[i].tile.id] = i + 1;
  var sweep = {};
  if (this.loop) {
    for (i = 0; i < b.cells.length; i++) {
      var c = b.cells[i];
      if (c && !c.covered && c.f.cat === this.loopSide) sweep[c.id] = true;
    }
  }
  var hinted = {};
  if (this.hint) for (i = 0; i < this.hint.length; i++) hinted[this.hint[i].id] = true;

  var size = b.cell * 0.82;
  for (i = 0; i < b.cells.length; i++) {
    var tile = b.cells[i];
    if (!tile) continue;
    if (tile.covered) { drawLid(ctx, tile.px, tile.py, size, t); continue; }
    var sel = !!selected[tile.id];
    var sc = 1;
    if (sel) sc = 1.08;
    else if (sweep[tile.id]) sc = 1 + 0.06 * pulse(t, 2.4);
    else if (hinted[tile.id]) sc = 1 + 0.07 * pulse(t, 1.6);
    if (tile.born < 0.25) sc *= 0.7 + 0.3 * easeOut(tile.born / 0.25);
    drawDish(ctx, {
      x: tile.px, y: tile.py, size: size, food: tile.f, cat: tile.f.cat,
      seed: tile.seed, selected: sel, scale: sc,
      glow: sel ? 22 : (sweep[tile.id] || hinted[tile.id] ? 14 : 0),
      blocked: this.blocked(tile),
      shake: tile.shakeT > 0 ? tile.shakeT / 0.25 : 0
    });
  }

  /* the bright core of the ribbon, on top of the dishes */
  this.drawRibbon(ctx, true);

  /* how far along the plate each dish is, so the count is never a guess */
  for (i = 0; i < this.chain.length; i++) {
    var ct = this.chain[i].tile;
    Draw.text(ctx, String(i + 1), ct.px, ct.py + size * 0.44, {
      size: Math.max(14, size * 0.24), color: '#fff', align: 'center', weight: '900',
      stroke: 'rgba(0,0,0,.8)', strokeW: 5
    });
  }

  /* dishes leaving */
  for (i = 0; i < this.pops.length; i++) {
    var p = this.pops[i];
    if (p.age < 0) continue;
    var k = p.age / p.life;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.translate(p.x, p.y - 40 * easeOut(k));
    ctx.rotate((p.spin ? 3.2 : 0.9) * k);
    ctx.scale(1 + k * 0.7, 1 + k * 0.7);
    drawFood(ctx, p.f, 0, 0, p.size, p.seed);
    ctx.restore();
  }

  this.drawHUD(ctx);
  this.drawReason(ctx);
  FX.draw(ctx);
  FX.drawFlash(ctx);
  this.pauseBtn.draw(ctx, t);
  /* the pause glyph */
  ctx.save();
  ctx.fillStyle = PAL.slate;
  var px = this.pauseBtn.x + this.pauseBtn.w / 2, py = this.pauseBtn.y + this.pauseBtn.h / 2;
  Draw.rr(ctx, px - 11, py - 12, 7, 24, 3); ctx.fill();
  Draw.rr(ctx, px + 4, py - 12, 7, 24, 3); ctx.fill();
  ctx.restore();

  this.hintBtn.draw(ctx, t);
  /* the little bulb glyph */
  ctx.save();
  var hx = this.hintBtn.x + 20, hy = this.hintBtn.y + (this.hintBtn.sub ? 20 : 24);
  ctx.strokeStyle = this.hintBtn.enabled ? PAL.gold : PAL.slate;
  ctx.fillStyle = this.hintBtn.enabled ? 'rgba(255,214,102,.25)' : 'rgba(255,255,255,.08)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(hx, hy, 8, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx - 4, hy + 10); ctx.lineTo(hx + 4, hy + 10);
  ctx.stroke();
  ctx.restore();

  /* WASH, RINSE and BENTCH. Each glows when the halacha is waiting on it. */
  this.drawActions(ctx, t);

  if (this.explainKind) this.drawExplain(ctx);
};

/* the little card that opens when an order is tapped, so a kid never has
   to wonder what a "big plate" or a loop actually is */
Play.prototype.drawExplain = function (ctx) {
  var info = ORDER_INFO[this.explainKind];
  if (!info) return;
  var maxW = Math.min(CFG.W - 88, 560);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  var lines = Draw.wrap(ctx, info.desc, maxW - 56, 18, '700');
  var h = 190 + lines.length * 26;
  var w = maxW;
  var x = (CFG.W - w) / 2;
  var y = (CFG.H - h) / 2;
  Draw.panel(ctx, x, y, w, h, {
    fill: 'rgba(10,14,26,.97)', stroke: info.color, strokeW: 3, radius: 24,
    glow: info.color, glowBlur: 18
  });
  drawFood(ctx, foodByName(orderFoodName(this.explainKind)), x + w / 2, y + 66, 76, 3);
  Draw.textFit(ctx, info.label, x + w / 2, y + 122, w - 60, {
    size: 24, color: info.color, align: 'center', weight: '900'
  });
  for (var i = 0; i < lines.length; i++) {
    Draw.text(ctx, lines[i], x + w / 2, y + 156 + i * 26, {
      size: 18, color: 'rgba(255,255,255,.88)', align: 'center', weight: '700'
    });
  }
  Draw.text(ctx, 'TAP ANYWHERE TO CLOSE', x + w / 2, y + h - 22, {
    size: 13, color: 'rgba(255,255,255,.45)', align: 'center', weight: '800'
  });
  ctx.restore();
};

Play.prototype.drawRibbon = function (ctx, over) {
  if (!this.chain.length) return;
  var color = plateColor(this.plate);
  var cell = this.board.cell;
  var pts = [], i;
  for (i = 0; i < this.chain.length; i++) {
    var tl = this.chain[i].tile;
    pts.push([tl.px, tl.py]);
  }
  if (this.loop) pts.push([pts[0][0], pts[0][1]]);
  else if (this.finger) pts.push([this.finger.x, this.finger.y]);

  var trace = function () {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.stroke();
  };

  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!over) {
    /* wide soft glow beneath the dishes */
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = color;
    ctx.lineWidth = cell * 0.5;
    ctx.shadowColor = color; ctx.shadowBlur = 30;
    trace();
  } else {
    /* the cord itself, right over the dishes */
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = color;
    ctx.lineWidth = cell * 0.19;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    trace();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = cell * 0.07;
    ctx.strokeStyle = '#ffffff';
    trace();
    /* a bead on every link so each stop is readable */
    ctx.globalAlpha = 1;
    for (i = 0; i < this.chain.length; i++) {
      var b = this.chain[i].tile;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(b.px, b.py, cell * 0.1, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.px, b.py, cell * 0.045, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  if (!over) return;

  /* the plate so far, riding just above the finger */
  if (this.chain.length >= 2 && this.finger) {
    var label = String(this.chain.length);
    var lx = clamp(this.finger.x, 110, CFG.W - 110);
    var ly = clamp(this.finger.y - cell * 1.0, this.board.by - 44, CFG.H - 70);
    var name = this.loop ? 'THE WHOLE TRAY!' : plateName(this.plate);
    var w = Math.max(170, Draw.measure(ctx, name, 19, '900') + 84);
    Draw.panel(ctx, lx - w / 2, ly - 23, w, 46, {
      fill: 'rgba(6,10,20,.94)', stroke: color, strokeW: 2.5, radius: 23,
      glow: color, glowBlur: 16
    });
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(lx - w / 2 + 27, ly, 15, 0, TAU); ctx.fill();
    ctx.restore();
    Draw.text(ctx, label, lx - w / 2 + 27, ly + 1, {
      size: 20, color: '#08101c', align: 'center', weight: '900'
    });
    Draw.textFit(ctx, name, lx + 18, ly, w - 74, {
      size: 19, color: color, align: 'center', weight: '900'
    });
  }
};

Play.prototype.drawHUD = function (ctx) {
  var safe = View.safe, t = this.t, b = this.board;
  var top = 18 + safe.t;
  var colX = View.colX(), colW = View.colW();
  var edge = colX + 18;

  /* score, with the camp clock under it - a plate is two hours */
  Draw.panel(ctx, edge, top, 176, 58, {
    fill: 'rgba(6,10,20,.8)', stroke: 'rgba(255,255,255,.12)', strokeW: 2, radius: 18
  });
  Draw.text(ctx, 'SCORE', edge + 15, top + 16, { size: 11, color: PAL.slate, weight: '800' });
  Draw.textFit(ctx, String(this.score), edge + 15, top + 34, 100, {
    size: 22, color: PAL.gold, weight: '900'
  });
  Draw.textFit(ctx, Lang.t('DAY') + ' ' + this.day + '  ' + fmtCampTime(this.clock),
    edge + 15, top + 50, 96, {
      size: 13, color: 'rgba(255,255,255,.62)', weight: '800'
    });
  /* which sitting this is, so the clock means something on the screen */
  Draw.textFit(ctx, mealName(this.clock), edge + 168, top + 50, 62, {
    size: 11, color: PAL.gold, weight: '900', align: 'right'
  });

  /* moves - the pressure, so make it the loudest number */
  var mw = 140, mx = (CFG.W - mw) / 2;
  var low = this.moves <= 3;
  Draw.panel(ctx, mx, top, mw, 58, {
    fill: 'rgba(6,10,20,.8)',
    stroke: low ? PAL.red : 'rgba(255,255,255,.12)', strokeW: low ? 3 : 2, radius: 18,
    glow: low ? PAL.red : null, glowBlur: 10 + 12 * pulse(t, 1.6)
  });
  Draw.text(ctx, 'MOVES', mx + mw / 2, top + 17, {
    size: 12, color: low ? PAL.red : PAL.slate, align: 'center', weight: '800'
  });
  Draw.text(ctx, String(Math.max(0, this.moves)), mx + mw / 2, top + 40, {
    size: 27, color: low ? PAL.red : PAL.cream, align: 'center', weight: '900'
  });

  /* orders - geometry lives in this._ord, shared with the tap targets */
  var n = this.orders.length;
  for (var i = 0; i < n; i++) {
    var o = this.orders[i];
    var info = ORDER_INFO[o.kind];
    var r = this._ord[i];
    var x = r.x, oy = r.y, cw = r.w;
    var done = o.got >= o.need;
    var fl = o.flash > 0 ? o.flash / 0.6 : 0;
    ctx.save();
    if (fl) {
      ctx.translate(x + cw / 2, oy + 36);
      ctx.scale(1 + fl * 0.1, 1 + fl * 0.1);
      ctx.translate(-(x + cw / 2), -(oy + 36));
    }
    Draw.panel(ctx, x, oy, cw, 72, {
      fill: done ? 'rgba(18,44,28,.85)' : 'rgba(6,10,20,.8)',
      stroke: done ? PAL.green : info.color, strokeW: done ? 3 : 2, radius: 16,
      glow: fl ? info.color : null, glowBlur: 24 * fl
    });
    drawFood(ctx, foodByName(orderFoodName(o.kind)), x + 29, oy + 34, 40, 31 + i);
    Draw.text(ctx, o.got + '/' + o.need, x + cw - 11, oy + 26, {
      size: 20, color: done ? PAL.green : PAL.cream, align: 'right', weight: '900'
    });
    Draw.textFit(ctx, info.label, x + cw - 11, oy + 52, cw - 54, {
      size: 12, color: done ? PAL.green : 'rgba(255,255,255,.62)', align: 'right', weight: '800'
    });
    if (done) {
      ctx.strokeStyle = PAL.green; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 15, oy + 55); ctx.lineTo(x + 25, oy + 65); ctx.lineTo(x + 43, oy + 43);
      ctx.stroke();
    }
    /* a small "i" badge - tap the card to read what it wants */
    ctx.beginPath();
    ctx.arc(x + 13, oy + 13, 9, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
    Draw.text(ctx, 'i', x + 13, oy + 8, {
      size: 13, color: '#fff', align: 'center', weight: '900'
    });
    ctx.restore();
  }

  this.drawSimcha(ctx, colX + 18, top + 200, colW - 36);
  this.drawStatus(ctx, colX + 26, b.by + b.bh + 12, colW - 52);
};

/* how the boys are doing. It slides down the whole time you are thinking and
   jumps when a plate lands, so an empty room is always your own doing. */
Play.prototype.drawSimcha = function (ctx, x, y, w) {
  var t = this.t;
  var v = clamp(this.simcha / 100, 0, 1);
  var low = this.simcha < 26;
  var col = this.simcha >= 60 ? PAL.green : (this.simcha >= 26 ? PAL.gold : PAL.red);
  var h = 26;
  /* a hungrier room shakes the bar, which is what makes you hurry */
  if (low) {
    ctx.save();
    ctx.translate(Math.sin(t * 22) * 1.6, 0);
  }
  Draw.panel(ctx, x, y, w, h, {
    fill: 'rgba(6,10,20,.78)', stroke: low ? PAL.red : 'rgba(255,255,255,.12)',
    strokeW: 2, radius: 13,
    glow: low ? PAL.red : null, glowBlur: 6 + 10 * pulse(t, 1.4)
  });
  ctx.save();
  Draw.rr(ctx, x + 3, y + 3, Math.max(6, (w - 6) * v), h - 6, 10);
  ctx.clip();
  Draw.vGrad(ctx, x, y, w, h, [[0, tone(col, 0.25)], [1, col]]);
  if (this.simchaFlash > 0) {
    ctx.globalAlpha = clamp(this.simchaFlash, 0, 0.6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, w, h);
  }
  ctx.restore();
  Draw.text(ctx, 'SIMCHA', x + 14, y + h / 2, {
    size: 13, color: 'rgba(6,10,20,.85)', weight: '900'
  });
  /* a face on the end of the bar that falls as it empties */
  var fx = x + w - 18, fy = y + h / 2;
  ctx.save();
  ctx.fillStyle = low ? PAL.red : PAL.cream;
  ctx.beginPath(); ctx.arc(fx, fy, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0a0d16';
  ctx.beginPath(); ctx.arc(fx - 3.2, fy - 2, 1.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 3.2, fy - 2, 1.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#0a0d16'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  if (this.simcha >= 50) ctx.arc(fx, fy + 1, 4.4, 0.2, Math.PI - 0.2);
  else if (this.simcha >= 26) { ctx.moveTo(fx - 4, fy + 4); ctx.lineTo(fx + 4, fy + 4); }
  else ctx.arc(fx, fy + 6, 4.4, Math.PI + 0.2, TAU - 0.2);
  ctx.stroke();
  ctx.restore();
  if (low) ctx.restore();
};

/* one strip under the board: what the kitchen still owes, or the nusach */
Play.prototype.drawStatus = function (ctx, x, y, w) {
  var t = this.t, h = 42;
  if (this.waitLeft > 0) {
    Draw.panel(ctx, x, y, w, h, {
      fill: 'rgba(6,10,20,.9)', stroke: PAL.gold, strokeW: 2, radius: 21,
      glow: PAL.gold, glowBlur: 8 + 8 * pulse(t, 1.1)
    });
    Draw.textFit(ctx, 'Wait after meat before dairy', x + w / 2 - 34, y + 21, w - 130, {
      size: 17, color: PAL.gold, align: 'center', weight: '800'
    });
    Draw.text(ctx, fmtMeals(this.waitMoves), x + w - 16, y + 21, {
      size: 15, color: 'rgba(255,255,255,.7)', align: 'right', weight: '800'
    });
    return;
  }
  if (this.mealSide === 'meat') {
    /* the hours are up, but the meal is still a fleishig meal */
    Draw.panel(ctx, x, y, w, h, {
      fill: 'rgba(6,10,20,.9)', stroke: PAL.meat, strokeW: 2, radius: 21,
      glow: PAL.meat, glowBlur: 8 + 8 * pulse(t, 1.1)
    });
    Draw.textFit(ctx, 'Fleishig meal - bentch to start a milchig one', x + w / 2, y + 21, w - 40, {
      size: 16, color: PAL.gold, align: 'center', weight: '800'
    });
    return;
  }
  if (this.needWash || this.needPareve) {
    /* the three things owed after milchig, ticked off as they are done */
    Draw.panel(ctx, x, y, w, h, {
      fill: 'rgba(6,10,20,.9)', stroke: PAL.pareve, strokeW: 2, radius: 21
    });
    var steps = [
      { label: 'WASH', done: !this.needWash, col: PAL.teal },
      { label: 'RINSE', done: !this.needDrink, col: PAL.dairy },
      { label: 'PAREVE', done: !this.needPareve, col: PAL.pareve }
    ];
    var cw = (w - 24) / 3;
    for (var i = 0; i < 3; i++) {
      var sx = x + 12 + i * cw;
      var s = steps[i];
      ctx.save();
      ctx.globalAlpha = s.done ? 0.45 : 1;
      Draw.rr(ctx, sx + 4, y + 8, cw - 8, h - 16, 13);
      ctx.fillStyle = s.done ? 'rgba(92,227,143,.18)' : 'rgba(255,255,255,.06)';
      ctx.fill();
      ctx.strokeStyle = s.done ? PAL.green : s.col; ctx.lineWidth = 2; ctx.stroke();
      Draw.textFit(ctx, s.label, sx + cw / 2 + (s.done ? 7 : 0), y + 21, cw - 34, {
        size: 14, color: s.done ? PAL.green : s.col, align: 'center', weight: '900'
      });
      if (s.done) {
        ctx.strokeStyle = PAL.green; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx + 14, y + 21); ctx.lineTo(sx + 19, y + 26); ctx.lineTo(sx + 28, y + 15);
        ctx.stroke();
      }
      ctx.restore();
    }
    return;
  }
  if (this.needDrink || this.needFishDrink) {
    Draw.panel(ctx, x, y, w, h, {
      fill: 'rgba(6,10,20,.9)', stroke: PAL.dairy, strokeW: 2, radius: 21,
      glow: PAL.dairy, glowBlur: 8 + 8 * pulse(t, 1.1)
    });
    Draw.textFit(ctx, this.needDrink ? 'Rinse between fish and meat'
        : 'Rinse between meat and fish', x + w / 2, y + 21, w - 40, {
      size: 16, color: PAL.dairy, align: 'center', weight: '800'
    });
    return;
  }
  /* Edot HaMizrach only - fish and dairy went out separately and the mouth
     still owes a rinse between them, same idea, different pair */
  if (this.needFishRinse || this.needDairyRinse) {
    Draw.panel(ctx, x, y, w, h, {
      fill: 'rgba(6,10,20,.9)', stroke: PAL.fish, strokeW: 2, radius: 21,
      glow: PAL.fish, glowBlur: 8 + 8 * pulse(t, 1.1)
    });
    Draw.textFit(ctx, this.needDairyRinse ? 'Rinse between fish and dairy'
        : 'Rinse between dairy and fish', x + w / 2, y + 21, w - 40, {
      size: 16, color: PAL.fish, align: 'center', weight: '800'
    });
    return;
  }
  /* Unwashed hands are not something owed - it is only owed if bread is going
     out, and then the challah itself says so. Nothing owed: the meal on the
     table, and the nusach, which is what decides the odd plate. */
  var nu = Nusach.current();
  Draw.panel(ctx, x, y, w, h, {
    fill: 'rgba(6,10,20,.62)', stroke: 'rgba(255,255,255,.10)', strokeW: 2, radius: 21
  });
  var meal = Lang.t(mealName(this.clock));
  var mw = Draw.measure(ctx, meal, 13, '900') + 22;
  ctx.save();
  Draw.rr(ctx, x + 10, y + 10, mw, h - 20, 11);
  ctx.fillStyle = 'rgba(255,207,92,.14)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,207,92,.4)'; ctx.lineWidth = 1.6; ctx.stroke();
  Draw.text(ctx, meal, x + 10 + mw / 2, y + 21, {
    size: 13, color: PAL.gold, align: 'center', weight: '900'
  });
  ctx.restore();
  Draw.textFit(ctx, nu.note, x + mw + 24, y + 21, w - mw - 40, {
    size: 14, color: 'rgba(255,255,255,.68)', weight: '700'
  });
};

/* the three free actions, and the glow that tells you which one the halacha
   is waiting for */
Play.prototype.drawActions = function (ctx, t) {
  /* WASH only calls for attention when something is actually waiting on it:
     after milchig, or when a challah has just been turned away. */
  var needW = !!(this.needWash ||
    (!this.washed && this.reason && this.reason.why === 'Wash your hands before challah'));
  var needR = this.needDrink || this.needFishDrink ||
    this.needFishRinse || this.needDairyRinse;
  var needB = this.mealSide === 'meat' && this.mealAte > 0;
  this.bentchBtn.enabled = this.mealAte > 0;
  var row = [
    { b: this.washBtn, on: needW, col: PAL.teal },
    { b: this.rinseBtn, on: needR, col: PAL.dairy },
    { b: this.bentchBtn, on: needB, col: PAL.gold }
  ];
  for (var i = 0; i < row.length; i++) {
    var b = row[i].b;
    b.labelDY = 20;
    b.flat = !row[i].on;
    b.draw(ctx, t);
    var cx = b.x + b.w / 2, iy = b.y + 25;
    if (i === 0) drawWashCup(ctx, cx, iy + 4, 36, Math.sin(t * 2) * (needW ? 0.12 : 0.03));
    else if (i === 1) drawWaterGlass(ctx, cx, iy + 2, 32, 0);
    else drawBentcher(ctx, cx, iy + 2, 32, this.bentchBtn.enabled ? 1 : 0.4);
    if (!row[i].on) continue;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * pulse(t, 1.2);
    ctx.strokeStyle = row[i].col;
    ctx.lineWidth = 3;
    Draw.rr(ctx, b.x - 3, b.y - 3, b.w + 6, b.h + 6, 21);
    ctx.stroke();
    ctx.restore();
  }
};

function orderFoodName(kind) {
  return { meat: 'Brisket', dairy: 'Cheese', fish: 'Tuna', pareve: 'Apple',
           treif: 'Shrimp', big: 'Challah', loop: 'Egg' }[kind] || 'Apple';
}

Play.prototype.drawReason = function (ctx) {
  var r = this.reason;
  if (!r) return;
  var a = r.age < 0.12 ? r.age / 0.12 : (1 - Math.max(0, (r.age - 1.5) / 0.7));
  if (a <= 0) return;
  var col = r.calm ? PAL.gold : PAL.red;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  var maxW = CFG.W - 120;
  var lines = Draw.wrap(ctx, r.why, maxW - 40, 20, '800');
  var w = 0;
  for (var i = 0; i < lines.length; i++) w = Math.max(w, Draw.measure(ctx, lines[i], 20, '800'));
  w = Math.min(maxW, w + 40);
  var h = 26 + lines.length * 26;
  var x = clamp(r.x - w / 2, 20, CFG.W - w - 20);
  var y = clamp(r.y - h - this.board.cell * 0.6, View.safe.t + 250, CFG.H - h - 40);
  Draw.panel(ctx, x, y, w, h, {
    fill: 'rgba(10,6,12,.94)', stroke: col, strokeW: 2.5, radius: 16, glow: col, glowBlur: 16
  });
  for (i = 0; i < lines.length; i++) {
    Draw.text(ctx, lines[i], x + w / 2, y + 22 + i * 26, {
      size: 20, color: col, align: 'center', weight: '800'
    });
  }
  /* little tail pointing at the dish that caused it */
  ctx.fillStyle = 'rgba(10,6,12,.94)';
  ctx.beginPath();
  var tx = clamp(r.x, x + 22, x + w - 22);
  ctx.moveTo(tx - 11, y + h - 1);
  ctx.lineTo(tx + 11, y + h - 1);
  ctx.lineTo(tx, y + h + 14);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
};
</script>
<script>
'use strict';
/* =============================================================== PROGRESS */
var Progress = {
  unlocked: 1,
  stars: {},
  best: {},
  seenTeach: {},
  seenStory: false,
  load: function () {
    try {
      var raw = localStorage.getItem('kc_save');
      if (raw) {
        var d = JSON.parse(raw);
        Progress.unlocked = d.unlocked || 1;
        Progress.stars = d.stars || {};
        Progress.best = d.best || {};
        Progress.seenTeach = d.seenTeach || {};
        Progress.seenStory = !!d.seenStory;
      }
    } catch (e) {}
  },
  save: function () {
    try {
      localStorage.setItem('kc_save', JSON.stringify({
        unlocked: Progress.unlocked, stars: Progress.stars,
        best: Progress.best, seenTeach: Progress.seenTeach,
        seenStory: Progress.seenStory
      }));
    } catch (e) {}
  },
  record: function (li, stars, score) {
    if ((Progress.stars[li] || 0) < stars) Progress.stars[li] = stars;
    if ((Progress.best[li] || 0) < score) Progress.best[li] = score;
    if (li + 2 > Progress.unlocked) Progress.unlocked = Math.min(LEVELS.length, li + 2);
    Progress.save();
  },
  totalStars: function () {
    var n = 0;
    for (var k in Progress.stars) n += Progress.stars[k];
    return n;
  }
};

function drawStar(ctx, x, y, r, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = PAL.gold; ctx.fill();
    ctx.strokeStyle = PAL.goldDeep; ctx.lineWidth = 1.6; ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

/* ================================================================ SCREENS */
function langButton() {
  if (Lang.locked()) return null;
  var safe = View.safe;
  return new Button({
    x: CFG.W - 130 - 22 - safe.r, y: 22 + safe.t, w: 130, h: 54,

      Lang.set(Lang.isHe() ? 'en' : 'he');
      Game.rebuild();
    }

}

function pushBtn(list, btn) { if (btn) list.push(btn); }

/* ---------------------------------------------------------------- MENU */
function Menu() { this.t = 0; this.build(); }
Menu.prototype.build = function () {
  var safe = View.safe;
  var w = Math.min(440, CFG.W - 120 - safe.l - safe.r);
  var x = (CFG.W - w) / 2;
  /* In the Play tab we add MORE GAMES under the thumb stack, so reserve more
     floor. Above that, logo + demo share three equal gaps on a tall phone. */
  var floor = 336;
  if (MitzHost.inApp()) floor += 88;
  if (Nusach.locked()) floor -= 88;
  var y = CFG.H - safe.b - floor;
  var LOGO_H = Progress.totalStars() > 0 ? 404 : 342, DEMO_H = 175;
  var avail = y - safe.t;
  this.demoY = null;
  if (avail > 640) {
    var gap = (avail - LOGO_H - DEMO_H) / 3;
    this.logoY = safe.t + gap + 59;
    this.demoY = safe.t + gap + LOGO_H + gap + 46;
  } else {
    this.logoY = safe.t + (avail - LOGO_H) / 2 + 59;
  }
  this.btns = [
    new Button({ x: x, y: y, w: w, h: 92, label: 'PLAY', color: PAL.gold, size: 36,
