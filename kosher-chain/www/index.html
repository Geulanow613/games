<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #05070d;
    overflow: hidden;
    /* a phone game must never scroll, zoom, select or bounce */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; }
  #stage {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  /* shown only if the canvas never comes up */
  #boot {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #f6ecd6; font: 700 18px system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="boot">Loading the dining hall…</div>
<script>
'use strict';
/* ===========================================================================
   CAMP KOSH - the dining hall
   You run the kitchen at Camp Kosh. Drag through neighbouring foods to build
   one plate. The chain IS the plate, so it only continues while everything on
   it may be eaten together. Your nusach decides whether fish will sit beside
   dairy. The boys have to be fed - if the simcha runs out, so does the week.

   The clock is real: every plate you serve is two hours of camp, so the six
   hours between fleishig and milchig are six hours you can watch go by.

   Built for a phone first: one finger, big targets, no hover, no scroll.
   =========================================================================== */

/* ---------------------------------------------------------------- config */
/* The logical drawing space. Width is fixed so art and text keep their
   proportions; height stretches to whatever the phone actually is, because a
   letterboxed game with black bars looks broken next to real apps. On a wide
   or short screen it flips: height is pinned and the width grows instead. */
var CFG = {
  BASE_W: 720,
  MIN_H: 1150,
  W: 720, H: 1280,
  STEP: 1 / 60,
  MAX_FRAME: 0.2
};

var PAL = {
  ink: '#05070d',
  bg0: '#0a1020', bg1: '#141d38', bg2: '#0c1424',
  cream: '#f7efdd', gold: '#ffcf5c', goldDeep: '#c98f18',
  meat: '#f0705c', dairy: '#82c9ff', fish: '#4fd8c4', pareve: '#93e070',
  treif: '#8b8196', mixed: '#c98ce8', dual: '#ffcf5c',
  red: '#ff5f5f', green: '#5ce38f', teal: '#38dccb', violet: '#b494ff',
  slate: '#8fa0bd', slateDeep: '#2b3450'
};

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function chance(p) { return Math.random() < p; }
function pulse(t, hz) { return 0.5 + 0.5 * Math.sin(t * hz * TAU); }
function easeOut(k) { return 1 - Math.pow(1 - clamp(k, 0, 1), 3); }
function fmtClock(s) {
  s = Math.ceil(s);
  var m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
/* camp time. minutes past midnight -> "9:00 AM" in English, and the 24 hour
   clock in Hebrew, because that is how the sign would read in each */
function fmtCampTime(mins) {
  var h = Math.floor(mins / 60) % 24, m = Math.floor(mins % 60);
  var mm = (m < 10 ? '0' : '') + m;
  if (Lang.isHe()) return h + ':' + mm;
  var ampm = h < 12 ? 'AM' : 'PM';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + mm + ' ' + ampm;
}
/* a stretch of camp time as whole hours: "6 hours", "2 hours" */
function fmtHours(mins) {
  var h = Math.max(0, Math.round(mins / 60));
  return Lang.t(h + (h === 1 ? ' hour' : ' hours'));
}
/* the same wait, but said the way a kid actually gets it: not "4 hours,"
   but "how many more plates before milchig" */
function fmtMeals(n) {
  n = Math.max(0, n);
  return Lang.t(n + (n === 1 ? ' pareve meal to go' : ' pareve meals to go'));
}
/* which meal of the day the clock is in - breakfast, lunch, supper, and the
   night seder snack. It is the same boys at all of them. */
var MEALS = ['BREAKFAST', 'LUNCH', 'SUPPER', 'NIGHT SNACK'];
function mealSlot(mins) {
  var h = Math.floor(mins / 60) % 24;
  if (h >= 5 && h < 11) return 0;
  if (h >= 11 && h < 16) return 1;
  if (h >= 16 && h < 21) return 2;
  return 3;
}
function mealName(mins) { return MEALS[mealSlot(mins)]; }
function easeIn(k) { return Math.pow(clamp(k, 0, 1), 3); }
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

};

var Lang = {
  id: 'en',
  lockedFromHost: false,
  set: function (id) {
    if (Lang.lockedFromHost) return Lang.id;
    Lang.id = (id === 'he') ? 'he' : 'en';
    try { localStorage.setItem('kc_lang', Lang.id); } catch (e) {}
    return Lang.id;
  },
  t: function (s) {
    if (Lang.id !== 'he') return s;
    var v = HE[s];
    return (v == null) ? s : v;
  },
  isHe: function () { return Lang.id === 'he'; },
  hasHebrew: function (s) { return /[\u0590-\u05FF]/.test(s); },
  locked: function () { return !!Lang.lockedFromHost; },
  boot: function () {
    /* Play tab injects MITZ_LANG; standalone hosts may set KC_LANG */
    var host = window.MITZ_LANG || window.KC_LANG;
    if (window.MITZ_MODE === true && host) {
      Lang.lockedFromHost = true;
      Lang.id = host === 'he' ? 'he' : 'en';
      return;
    }
    Lang.lockedFromHost = false;
    if (window.KC_LANG) { Lang.id = window.KC_LANG === 'he' ? 'he' : 'en'; return; }
    var saved = null;
    try { saved = localStorage.getItem('kc_lang'); } catch (e) {}
    if (saved) { Lang.id = saved === 'he' ? 'he' : 'en'; return; }
    if (/^he\b/i.test(navigator.language || '')) Lang.id = 'he';
  }
};

/* Ask the Mitz Mode Play tab to swap back to the arcade menu. */
var MitzHost = {
  inApp: function () { return window.MITZ_MODE === true; },
  openDash: function () {
    if (!MitzHost.inApp()) return false;
    try { location.href = 'mitz://game/dash'; return true; } catch (e) { return false; }
  }
};

/* ================================================================== view
   One logical 720x1280 space, letterboxed into whatever phone shows up, at
   the device's real pixel density so the art stays crisp. */
var View = {
  canvas: null, ctx: null,
  scale: 1, ox: 0, oy: 0, dpr: 1,
  cssW: 0, cssH: 0,
  safe: { t: 0, r: 0, b: 0, l: 0 },

  init: function () {
    View.canvas = document.getElementById('stage');
    View.ctx = View.canvas.getContext('2d', { alpha: false });
    View.resize();
    window.addEventListener('resize', View.resize, { passive: true });
    window.addEventListener('orientationchange', function () {
      setTimeout(View.resize, 120);
    }, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', View.resize, { passive: true });
    }
  },

  readSafeArea: function () {
    /* env() insets are only reachable through a probe element */
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
      'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var t = parseFloat(cs.paddingTop) || 0;
    var r = parseFloat(cs.paddingRight) || 0;
    var b = parseFloat(cs.paddingBottom) || 0;
    var l = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(probe);
    return { t: t, r: r, b: b, l: l };
  },

  resize: function () {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
    var cssH = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    var dpr = clamp(window.devicePixelRatio || 1, 1, 3);
    View.cssW = cssW; View.cssH = cssH; View.dpr = dpr;

    View.canvas.style.width = cssW + 'px';
    View.canvas.style.height = cssH + 'px';
    View.canvas.width = Math.round(cssW * dpr);
    View.canvas.height = Math.round(cssH * dpr);

    /* fit the width and let the height run, unless that would make the space
       too short to lay out - then pin the height and let the width run */
    var s = cssW / CFG.BASE_W;
    var h = cssH / s;
    if (h < CFG.MIN_H) {
      s = cssH / CFG.MIN_H;
      CFG.H = CFG.MIN_H;
      CFG.W = cssW / s;
    } else {
      CFG.W = CFG.BASE_W;
      CFG.H = h;
    }
    View.scale = s;
    View.ox = (cssW - CFG.W * s) / 2;
    View.oy = (cssH - CFG.H * s) / 2;

    var raw = View.readSafeArea();
    /* convert CSS inset to logical units, and only keep what eats into the board */
    View.safe = {
      t: Math.max(0, (raw.t - View.oy) / s),
      r: Math.max(0, (raw.r - View.ox) / s),
      b: Math.max(0, (raw.b - View.oy) / s),
      l: Math.max(0, (raw.l - View.ox) / s)
    };
  },

  /* On a wide screen the logical space gets very broad, and a HUD stretched
     across a metre of tablet reads badly. Everything chrome-ish lives inside
     this centred column instead; only the backdrop uses the full width. */
  colW: function () {
    return Math.min(CFG.W - View.safe.l - View.safe.r, 780);
  },
  colX: function () {
    return View.safe.l + (CFG.W - View.safe.l - View.safe.r - View.colW()) / 2;
  },
  /* centre a block of content in the space between the chrome */
  band: function (contentH, headroom, footroom) {
    var a = View.safe.t + (headroom == null ? 0 : headroom);
    var b = CFG.H - View.safe.b - (footroom == null ? 0 : footroom);
    return a + Math.max(0, (b - a - contentH) / 2);
  },

  /* client (CSS) point -> logical point */
  toLogical: function (clientX, clientY) {
    var rect = View.canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - View.ox) / View.scale,
      y: (clientY - rect.top - View.oy) / View.scale
    };
  },

  begin: function () {
    var ctx = View.ctx;
    ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(0, 0, View.cssW, View.cssH);
    ctx.save();
    ctx.translate(View.ox, View.oy);
    ctx.scale(View.scale, View.scale);
    /* letterbox guard so nothing paints into the bezel */
    ctx.beginPath();
    ctx.rect(0, 0, CFG.W, CFG.H);
    ctx.clip();
  },
  end: function () { View.ctx.restore(); }
};

/* ================================================================= input
   Pointer Events cover touch, pen and mouse. Touch Events are kept as a
   fallback for the older iOS builds that still ship without pointers. */
var Input = {
  active: null,          /* the one finger we are following */
  handlers: null,        /* { down, move, up, cancel } from the current screen */

  init: function () {
    var cv = View.canvas;
    var usePointer = !!window.PointerEvent;

    if (usePointer) {
      cv.addEventListener('pointerdown', Input.onDown, { passive: false });
      cv.addEventListener('pointermove', Input.onMove, { passive: false });
      cv.addEventListener('pointerup', Input.onUp, { passive: false });
      cv.addEventListener('pointercancel', Input.onCancel, { passive: false });
      /* a finger leaving the canvas must not strand a chain */
      cv.addEventListener('lostpointercapture', Input.onCancel, { passive: false });
    } else {
      cv.addEventListener('touchstart', Input.onTouch(Input.onDown), { passive: false });
      cv.addEventListener('touchmove', Input.onTouch(Input.onMove), { passive: false });
      cv.addEventListener('touchend', Input.onTouch(Input.onUp), { passive: false });
      cv.addEventListener('touchcancel', Input.onTouch(Input.onCancel), { passive: false });
      cv.addEventListener('mousedown', Input.onDown, { passive: false });
      cv.addEventListener('mousemove', Input.onMove, { passive: false });
      cv.addEventListener('mouseup', Input.onUp, { passive: false });
    }

    /* kill every browser gesture that would fight the game */
    var stop = function (e) { e.preventDefault(); };
    document.addEventListener('contextmenu', stop);
    document.addEventListener('selectstart', stop);
    document.addEventListener('gesturestart', stop);
    document.addEventListener('gesturechange', stop);
    document.addEventListener('dblclick', stop);
    document.addEventListener('touchmove', function (e) {
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  },

  /* adapt a TouchEvent into the shape the pointer handlers expect */
  onTouch: function (fn) {
    return function (e) {
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      fn({
        pointerId: t.identifier,
        clientX: t.clientX,
        clientY: t.clientY,
        pointerType: 'touch',
        preventDefault: function () { if (e.cancelable) e.preventDefault(); },
        target: e.target
      });
      if (e.cancelable) e.preventDefault();
    };
  },

  point: function (e) {
    var p = View.toLogical(e.clientX, e.clientY);
    p.id = (e.pointerId == null) ? 'mouse' : e.pointerId;
    return p;
  },

  onDown: function (e) {
    if (e.preventDefault) e.preventDefault();
    Sound.unlock();
    if (Input.active !== null) return;          /* one finger only - no ghosts */
    var p = Input.point(e);
    Input.active = p.id;
    if (e.pointerId != null && View.canvas.setPointerCapture) {
      try { View.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (Input.handlers && Input.handlers.down) Input.handlers.down(p);
  },
  onMove: function (e) {
    if (e.preventDefault) e.preventDefault();
    var p = Input.point(e);
    if (Input.active !== p.id) return;
    if (Input.handlers && Input.handlers.move) Input.handlers.move(p);
  },
  onUp: function (e) {
    if (e.preventDefault) e.preventDefault();
    var p = Input.point(e);
    if (Input.active !== p.id) return;
    Input.active = null;
    if (Input.handlers && Input.handlers.up) Input.handlers.up(p);
  },
  onCancel: function (e) {
    if (e && e.preventDefault) e.preventDefault();
    var id = (e && e.pointerId != null) ? e.pointerId : 'mouse';
    if (Input.active !== id) return;
    Input.active = null;
    if (Input.handlers && Input.handlers.cancel) Input.handlers.cancel();
  },
  clear: function () { Input.active = null; }
};

/* =============================================================== haptics */
var Haptics = {
  on: true,
  buzz: function (ms) {
    if (!Haptics.on) return;
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  },
  tick: function () { Haptics.buzz(8); },
  light: function () { Haptics.buzz(14); },
  nope: function () { Haptics.buzz([0, 26, 40, 26]); },
  win: function () { Haptics.buzz([0, 18, 50, 34]); }
};

/* ================================================================= sound
   Tiny WebAudio bleeper. iOS will not make a sound until a real touch has
   resumed the context, so unlock() runs on the first pointerdown. */
var Sound = {
  ctx: null, master: null, ready: false, muted: false,

  unlock: function () {
    if (Sound.ready) {
      if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { Sound.ready = true; return; }
    try {
      Sound.ctx = new AC();
      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = 0.5;
      Sound.master.connect(Sound.ctx.destination);
      if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
      Sound.ready = true;
    } catch (e) { Sound.ready = true; }
  },

  tone: function (o) {
    if (Sound.muted || !Sound.ctx || !Sound.master) return;
    var t0 = Sound.ctx.currentTime;
    var osc = Sound.ctx.createOscillator();
    var g = Sound.ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + (o.dur || 0.1));
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(o.vol == null ? 0.2 : o.vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.dur || 0.1));
    osc.connect(g); g.connect(Sound.master);
    osc.start(t0);
    osc.stop(t0 + (o.dur || 0.1) + 0.02);
  },

  /* one step up the scale per link, so a long chain literally sings */
  link: function (n) {
    var semis = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
    var s = semis[Math.min(n, semis.length - 1)];
    Sound.tone({ f: 392 * Math.pow(2, s / 12), dur: 0.09, vol: 0.16, type: 'triangle' });
  },
  serve: function (len) {
    Sound.tone({ f: 523, f2: 1046, dur: 0.22, vol: 0.2, type: 'triangle' });
    if (len >= 6) Sound.tone({ f: 784, f2: 1568, dur: 0.3, vol: 0.15, type: 'sine' });
  },
  nope: function () { Sound.tone({ f: 190, f2: 120, dur: 0.16, vol: 0.2, type: 'sawtooth' }); },
  bin: function () { Sound.tone({ f: 300, f2: 90, dur: 0.2, vol: 0.18, type: 'sawtooth' }); },
  lid: function () { Sound.tone({ f: 900, f2: 1400, dur: 0.1, vol: 0.14, type: 'sine' }); },
  /* the boys bentching: a few notes of a camp niggun */
  bentch: function () {
    [392, 494, 587, 494].forEach(function (f, i) {
      setTimeout(function () {
        Sound.tone({ f: f, dur: 0.18, vol: 0.13, type: 'triangle' });
      }, i * 130);
    });
  },
  ui: function () { Sound.tone({ f: 660, f2: 880, dur: 0.07, vol: 0.15, type: 'triangle' }); },
  win: function () {
    [523, 659, 784, 1046].forEach(function (f, i) {
      setTimeout(function () { Sound.tone({ f: f, dur: 0.2, vol: 0.17, type: 'triangle' }); }, i * 90);
    });
  },
  lose: function () {
    [392, 330, 262].forEach(function (f, i) {
      setTimeout(function () { Sound.tone({ f: f, dur: 0.26, vol: 0.17, type: 'sine' }); }, i * 130);
    });
  }
};

/* ==================================================================== fx */
var FX = {
  parts: [], texts: [], rings: [],
  shakeAmt: 0, shakeT: 0, shakeMax: 0.3, flashColor: null, flashT: 0, flashMax: 0,

  reset: function () {
    FX.parts.length = 0; FX.texts.length = 0; FX.rings.length = 0;
    FX.shakeAmt = 0; FX.shakeT = 0; FX.flashT = 0;
  },
  burst: function (x, y, o) {
    o = o || {};
    var n = o.n || 10;
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), sp = rand(o.spdMin || 40, o.spdMax || 220);
      FX.parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.lift || 40),
        life: rand(o.lifeMin || 0.3, o.lifeMax || 0.7), age: 0,
        r: rand(o.rMin || 3, o.rMax || 8), color: o.color || PAL.gold,
        grav: o.grav == null ? 420 : o.grav
      });
    }
  },
  text: function (x, y, str, color, size, life) {
    FX.texts.push({
      x: x, y: y, str: str, color: color || PAL.gold,
      size: size || 30, age: 0, life: life == null ? 1.1 : life
    });
  },
  ring: function (x, y, color, r) {
    FX.rings.push({ x: x, y: y, r: r || 24, grow: (r || 24) * 3, color: color || PAL.gold, age: 0, life: 0.45 });
  },
  shake: function (amt, dur) {
    FX.shakeAmt = Math.max(FX.shakeAmt, amt);
    FX.shakeT = Math.max(FX.shakeT, dur || 0.3);
    FX.shakeMax = FX.shakeT;
  },
  flash: function (color, dur) {
    FX.flashColor = color; FX.flashT = dur || 0.25; FX.flashMax = FX.flashT;
  },

  update: function (dt) {
    var i, p;
    for (i = FX.parts.length - 1; i >= 0; i--) {
      p = FX.parts[i];
      p.age += dt;
      if (p.age >= p.life) { FX.parts.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = FX.texts.length - 1; i >= 0; i--) {
      p = FX.texts[i];
      p.age += dt;
      if (p.age >= p.life) FX.texts.splice(i, 1);
    }
    for (i = FX.rings.length - 1; i >= 0; i--) {
      p = FX.rings[i];
      p.age += dt;
      if (p.age >= p.life) FX.rings.splice(i, 1);
    }
    if (FX.shakeT > 0) {
      FX.shakeT -= dt;
      if (FX.shakeT <= 0) { FX.shakeT = 0; FX.shakeAmt = 0; }
    }
    if (FX.flashT > 0) FX.flashT -= dt;
  },

  preDraw: function (ctx) {
    if (FX.shakeT > 0 && FX.shakeAmt > 0) {
      var k = FX.shakeT / (FX.shakeMax || 0.3);
      ctx.translate(rand(-1, 1) * FX.shakeAmt * k, rand(-1, 1) * FX.shakeAmt * k);
    }
  },
  draw: function (ctx) {
    var i, p, k;
    for (i = 0; i < FX.parts.length; i++) {
      p = FX.parts[i];
      k = 1 - p.age / p.life;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * k, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < FX.rings.length; i++) {
      p = FX.rings[i];
      k = p.age / p.life;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 5 * (1 - k) + 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + (p.grow - p.r) * easeOut(k), 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < FX.texts.length; i++) {
      p = FX.texts[i];
      k = p.age / p.life;
      ctx.globalAlpha = k < 0.15 ? k / 0.15 : (1 - Math.max(0, (k - 0.6) / 0.4));
      Draw.text(ctx, p.str, p.x, p.y - 46 * easeOut(k), {
        size: p.size, color: p.color, align: 'center', weight: '900',
        stroke: 'rgba(0,0,0,.75)', strokeW: 5
      });
    }
    ctx.globalAlpha = 1;
  },
  drawFlash: function (ctx) {
    if (FX.flashT <= 0 || !FX.flashColor) return;
    ctx.save();
    ctx.globalAlpha = 0.5 * (FX.flashT / FX.flashMax);
    ctx.fillStyle = FX.flashColor;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.restore();
  }
};

/* ================================================================== draw */
var Draw = {
  font: function (size, weight) {
    return (weight || '700') + ' ' + Math.round(size) + 'px ' +
      '"Segoe UI","Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,Roboto,Arial,sans-serif';
  },
  /* the marker-pen hand that wrote the nusach under the banner */
  script: function (size, weight) {
    return 'italic ' + (weight || '600') + ' ' + Math.round(size) + 'px ' +
      '"Segoe Script","Bradley Hand","Snell Roundhand","Apple Chancery",' +
      '"Gurmukhi MN","Noto Sans Hebrew",cursive,system-ui,sans-serif';
  },
  rr: function (ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  },
  text: function (ctx, str, x, y, o) {
    o = o || {};
    str = Lang.t(String(str));
    ctx.save();
    ctx.font = o.script ? Draw.script(o.size || 24, o.weight) : Draw.font(o.size || 24, o.weight);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'middle';
    if (Lang.hasHebrew(str)) ctx.direction = 'rtl';
    if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur || 16; }
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 4;
      ctx.strokeStyle = o.stroke;
      ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || PAL.cream;
    ctx.fillText(str, x, y);
    ctx.restore();
  },
  measure: function (ctx, str, size, weight) {
    ctx.save();
    ctx.font = Draw.font(size, weight);
    var w = ctx.measureText(Lang.t(String(str))).width;
    ctx.restore();
    return w;
  },
  /* shrink to fit rather than overflow - Hebrew and English differ a lot */
  textFit: function (ctx, str, x, y, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var w = Draw.measure(ctx, str, size, o.weight);
    if (w > maxW && w > 0) size = Math.max(8, size * (maxW / w));
    var oo = {}; for (var k in o) oo[k] = o[k];
    oo.size = size;
    Draw.text(ctx, str, x, y, oo);
  },
  wrap: function (ctx, str, maxW, size, weight) {
    str = Lang.t(String(str));
    ctx.save();
    ctx.font = Draw.font(size, weight);
    var words = str.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    ctx.restore();
    return lines;
  },
  panel: function (ctx, x, y, w, h, o) {
    o = o || {};
    ctx.save();
    if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 20; }
    Draw.rr(ctx, x, y, w, h, o.radius == null ? 16 : o.radius);
    ctx.fillStyle = o.fill || 'rgba(8,12,24,.86)';
    ctx.fill();
    ctx.shadowBlur = 0;
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 2;
      ctx.strokeStyle = o.stroke;
      ctx.stroke();
    }
    ctx.restore();
  },
  meter: function (ctx, x, y, w, h, pct, o) {
    o = o || {};
    pct = clamp(pct, 0, 1);
    ctx.save();
    Draw.rr(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = o.bg || 'rgba(255,255,255,.12)';
    ctx.fill();
    if (pct > 0) {
      Draw.rr(ctx, x, y, Math.max(h, w * pct), h, h / 2);
      ctx.fillStyle = o.fg || PAL.green;
      ctx.fill();
    }
    ctx.restore();
  },
  vGrad: function (ctx, x, y, w, h, stops) {
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  },
  /* soft darkening at the edges - makes the board feel lit from above.
     One cached copy at full strength, faded to taste at blit time. */
  vignette: function (ctx, strength) {
    var cv = Sprite.screen('vignette', function (c) {
      var g = c.createRadialGradient(CFG.W / 2, CFG.H * 0.44, CFG.W * 0.22,
                                     CFG.W / 2, CFG.H * 0.44, CFG.H * 0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,1)');
      c.fillStyle = g;
      c.fillRect(0, 0, CFG.W, CFG.H);
    }, 0.34);
    ctx.save();
    ctx.globalAlpha = strength == null ? 0.55 : strength;
    ctx.drawImage(cv, 0, 0, CFG.W, CFG.H);
    ctx.restore();
  }
};

/* ================================================================ button */
function Button(o) {
  this.x = o.x; this.y = o.y; this.w = o.w; this.h = o.h;
  this.label = o.label;
  this.sub = o.sub || '';
  this.color = o.color || PAL.gold;
  this.fill = o.fill || 'rgba(10,16,32,.92)';
  this.onTap = o.onTap || function () {};
  this.size = o.size || 26;
  this.enabled = o.enabled !== false;
  this.press = 0;
}
Button.prototype.hit = function (p) {
  /* generous padding: fingers are not mice */
  var pad = 8;
  return this.enabled &&
    p.x >= this.x - pad && p.x <= this.x + this.w + pad &&
    p.y >= this.y - pad && p.y <= this.y + this.h + pad;
};
Button.prototype.draw = function (ctx, t) {
  var k = this.press;
  ctx.save();
  ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
  ctx.scale(1 - k * 0.04, 1 - k * 0.04);
  ctx.translate(-(this.x + this.w / 2), -(this.y + this.h / 2));
  Draw.panel(ctx, this.x, this.y, this.w, this.h, {
    fill: this.enabled ? this.fill : 'rgba(20,24,38,.7)',
    stroke: this.enabled ? this.color : 'rgba(255,255,255,.14)',
    strokeW: 3, radius: 18,
    /* the glow is a blurred shadow, which is the most expensive thing on the
       play screen. Buttons that sit there all game skip it. */
    glow: (this.enabled && !this.flat) ? this.color : null,
    glowBlur: 14 + 8 * pulse(t, 0.7)
  });
  var cy = this.sub ? this.y + this.h / 2 - 11 : this.y + this.h / 2;
  if (this.labelDY) cy += this.labelDY;
  Draw.textFit(ctx, this.label, this.x + this.w / 2, cy, this.w - 28, {
    size: this.size, color: this.enabled ? this.color : PAL.slate,
    align: 'center', weight: '900'
  });
  if (this.sub) {
    Draw.textFit(ctx, this.sub, this.x + this.w / 2, this.y + this.h / 2 + 15, this.w - 28, {
      size: 15, color: 'rgba(255,255,255,.6)', align: 'center', weight: '700'
    });
  }
  ctx.restore();
};

var UI = {
  /* buttons fire on release, and only if the finger stayed on them */
  bind: function (list, extra) {
    var pressed = null;
    return {
      down: function (p) {
        for (var i = 0; i < list().length; i++) {
          var b = list()[i];
          if (b.hit(p)) { pressed = b; b.press = 1; Sound.ui(); Haptics.tick(); return; }
        }
        pressed = null;
        if (extra && extra.down) extra.down(p);
      },
      move: function (p) {
        if (pressed) { pressed.press = pressed.hit(p) ? 1 : 0; return; }
        if (extra && extra.move) extra.move(p);
      },
      up: function (p) {
        if (pressed) {
          var b = pressed; pressed = null; b.press = 0;
          if (b.hit(p)) b.onTap();
          return;
        }
        if (extra && extra.up) extra.up(p);
      },
      cancel: function () {
        if (pressed) { pressed.press = 0; pressed = null; return; }
        if (extra && extra.cancel) extra.cancel();
      }
    };
  }
};

/* ---- put the halacha in one table, written out in plain words ---- */
var NUSACHS = [
  { id: 'ashkenaz', name: 'Ashkenaz',       note: 'Fish may be eaten with dairy' },
  { id: 'sefard',   name: 'Nusach Sefard',  note: 'Fish may be eaten with dairy' },
  { id: 'mizrach',  name: 'Edot HaMizrach', note: 'Fish may not be eaten with dairy' },
  { id: 'chabad',   name: 'Chabad',         note: 'Fish may not be eaten with milk' }
];

var Nusach = {
  id: 'ashkenaz',
  lockedFromHost: false,
  /* host tokens (Play tab uses sephardi) → our ids (mizrach) */
  parse: function (raw) {
    var s = String(raw || '').toLowerCase().replace(/[\s-]+/g, '_');
    if (s === 'ashkenaz' || s === 'ashkenazi') return 'ashkenaz';
    if (s === 'sefard' || s === 'nusach_sefard' || s === 'sefarad') return 'sefard';
    if (s === 'mizrach' || s === 'sephardi' || s === 'sephardim' || s === 'edot' ||
        s === 'edot_hamizrach' || s === 'edot_hamizrah' || s === 'mizrachi') return 'mizrach';
    if (s === 'chabad' || s === 'ari' || s === 'lubavitch') return 'chabad';
    return '';
  },
  set: function (id) {
    if (Nusach.lockedFromHost) return;
    var parsed = Nusach.parse(id) || id;
    for (var i = 0; i < NUSACHS.length; i++) {
      if (NUSACHS[i].id === parsed) {
        Nusach.id = parsed;
        try { localStorage.setItem('kc_nusach', parsed); } catch (e) {}
        return;
      }
    }
  },
  current: function () {
    for (var i = 0; i < NUSACHS.length; i++) if (NUSACHS[i].id === Nusach.id) return NUSACHS[i];
    return NUSACHS[0];
  },
  boot: function () {
    var host = window.KC_NUSACH || (window.MITZ_MODE === true ? window.MITZ_NUSACH : null);
    var fromHost = Nusach.parse(host);
    if (fromHost && (window.MITZ_MODE === true || window.KC_NUSACH)) {
      Nusach.lockedFromHost = true;
      Nusach.id = fromHost;
      return;
    }
    Nusach.lockedFromHost = false;
    var saved = null;
    try { saved = localStorage.getItem('kc_nusach'); } catch (e) {}
    if (saved) Nusach.set(saved);
  },
  locked: function () { return !!Nusach.lockedFromHost; }
};

/* ---- the foods. cat drives every rule; art is drawn, not loaded ---- */
var FOODS = [
  { name: 'Brisket',      cat: 'meat',   art: 'brisket' },
  { name: 'Chicken',      cat: 'meat',   art: 'chicken' },
  { name: 'Salami',       cat: 'meat',   art: 'salami' },

  { name: 'Milk',         cat: 'dairy',  art: 'milk',   liquidMilk: true },
  { name: 'Cheese',       cat: 'dairy',  art: 'cheese' },
  { name: 'Yogurt',       cat: 'dairy',  art: 'yogurt' },

  { name: 'Salmon',       cat: 'fish',   art: 'salmon' },

  { name: 'Apple',        cat: 'pareve', art: 'apple' },
  { name: 'Carrot',       cat: 'pareve', art: 'carrot' },
  /* bread is the one food that needs netilas yadayim before it is eaten */
  { name: 'Challah',      cat: 'pareve', art: 'challah', bread: true },
  { name: 'Egg',          cat: 'pareve', art: 'egg' },
  { name: 'Olive',        cat: 'pareve', art: 'olive' },

  { name: 'Shrimp',       cat: 'treif',  art: 'shrimp' },
  { name: 'Bacon',        cat: 'treif',  art: 'bacon' },
  { name: 'Cheeseburger', cat: 'mixed',  art: 'burger' }
];

function foodByName(n) {
  for (var i = 0; i < FOODS.length; i++) if (FOODS[i].name === n) return FOODS[i];
  return null;
}
function foodsOfCat(cat) {
  return FOODS.filter(function (f) { return f.cat === cat; });
}

var CAT = {
  meat:   { label: 'MEAT',   color: PAL.meat },
  dairy:  { label: 'DAIRY',  color: PAL.dairy },
  fish:   { label: 'FISH',   color: PAL.fish },
  pareve: { label: 'PAREVE', color: PAL.pareve },
  treif:  { label: 'TREIF',  color: PAL.treif },
  mixed:  { label: 'NOT TOGETHER', color: PAL.mixed }
};

/* =========================================================== THE HALACHA
   One function decides everything. A chain carries a running summary of what
   is already on the plate, and each new food is checked against that summary.
   Every refusal comes back with the reason, because the reason is the lesson.
   ========================================================================== */
function emptyPlate() {
  return { meat: 0, dairy: 0, fish: 0, pareve: 0, liquidMilk: 0, n: 0 };
}
function addToPlate(plate, food) {
  plate[food.cat] = (plate[food.cat] || 0) + 1;
  if (food.liquidMilk) plate.liquidMilk++;
  plate.n++;
  return plate;
}

/* returns { ok:true } or { ok:false, why:'<sentence a kid can read>' } */
function plateAccepts(plate, food, nusachId) {
  var n = nusachId || Nusach.id;

  if (food.cat === 'treif') return { ok: false, why: 'This is never kosher - throw it out' };
  if (food.cat === 'mixed') return { ok: false, why: 'Meat cooked with cheese - throw it out' };

  if (food.cat === 'meat') {
    if (plate.dairy) return { ok: false, why: 'Meat and milk never share a plate' };
    if (plate.fish)  return { ok: false, why: 'We do not put fish with meat' };
    return { ok: true };
  }

  if (food.cat === 'dairy') {
    if (plate.meat) return { ok: false, why: 'Meat and milk never share a plate' };
    if (plate.fish) {
      if (n === 'mizrach') return { ok: false, why: 'Your nusach keeps fish off dairy' };
      if (n === 'chabad' && food.liquidMilk) return { ok: false, why: 'Chabad: fish never with milk' };
    }
    return { ok: true };
  }

  if (food.cat === 'fish') {
    if (plate.meat) return { ok: false, why: 'We do not put fish with meat' };
    if (plate.dairy) {
      if (n === 'mizrach') return { ok: false, why: 'Your nusach keeps fish off dairy' };
      if (n === 'chabad' && plate.liquidMilk) return { ok: false, why: 'Chabad: fish never with milk' };
    }
    return { ok: true };
  }

  /* pareve goes with anything kosher */
  return { ok: true };
}

/* what to call the finished plate. Fish riding with dairy - Ashkenaz,
   Sefard, and a Chabad plate with no actual milk on it - gets its own
   call and its own colour, because it is really two orders at once */
function plateName(plate) {
  if (plate.meat) return 'FLEISHIG PLATE';
  if (plate.dairy && plate.fish) return 'FISH & DAIRY!';
  var side = plateSide(plate);
  if (side === 'dairy') return 'MILCHIG PLATE';
  if (side === 'fish') return 'FISH PLATE';
  return 'PAREVE PLATE';
}
function plateColor(plate) {
  if (plate.meat) return PAL.meat;
  if (plate.dairy && plate.fish) return PAL.dual;
  var side = plateSide(plate);
  if (side === 'dairy') return PAL.dairy;
  if (side === 'fish') return PAL.fish;
  return PAL.pareve;
}
/* which order does this plate fill, and what do we call it out loud? meat
   never shares a plate with dairy or fish, so it still wins outright. Dairy
   and fish, though, may ride together under a lenient nusach - and when they
   do, the one that is actually more of the plate is the one the boys (and
   the order card) call it. A plate of four salmon and one incidental cheese
   is a fish plate that happens to have cheese on it, not the other way
   round. A tie keeps the old habit of calling it milchig. */
function plateSide(plate) {
  if (plate.meat) return 'meat';
  if (plate.dairy && plate.fish) return plate.fish > plate.dairy ? 'fish' : 'dairy';
  if (plate.dairy) return 'dairy';
  if (plate.fish) return 'fish';
  return 'pareve';
}

<script>
'use strict';
/* ==================================================================== ART
   Every food is drawn by hand into a 100x100 box centred on (0,0), so it
   scales to any board size and any pixel density without a single asset
   download. Keeps the whole game one file, which matters on a phone.
   ==================================================================== */
var Art = {};

function shade(ctx, x, y, w, h, top, bottom) {
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g;
}
/* darken (k < 0) or lighten (k > 0) a #rrggbb by a fraction */
function tone(hex, k) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  var f = function (v) {
    return Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  };
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function radial(ctx, x, y, r, inner, outer) {
  var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g;
}
function blob(ctx, pts, close) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) {
    var p = pts[i];
    if (p.length === 4) ctx.quadraticCurveTo(p[0], p[1], p[2], p[3]);
    else ctx.lineTo(p[0], p[1]);

  if (close !== false) ctx.closePath();
}
function gloss(ctx, x, y, rx, ry, rot, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.35 : alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function outline(ctx, color, w) {
  ctx.lineWidth = w || 3;
  ctx.strokeStyle = color || 'rgba(0,0,0,.35)';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

  ctx.restore();

/* paint a food straight into a context, at a box of `size` centred on (x,y) */
function paintFood(ctx, food, x, y, size, seedKey) {
  var fn = Art[food.art];
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 100, size / 100);
  /* the speckle loops use Math.random; a fixed seed keeps a dish looking itself */
  var prev = Math.random;
  if (seedKey != null) {
    var s = (Math.abs(seedKey) * 2654435761 + 12345) % 4294967296;
    Math.random = function () {
      s = (s * 1664525 + 1013904223) % 4294967296;
      return s / 4294967296;
    };
  }
  if (fn) fn(ctx);
  Math.random = prev;
  ctx.restore();

/* ================================================================ SPRITES
   All of this art is vectors with gradients, and rebuilding sixty-odd of them
   every frame is what makes a phone hot. So each shape is painted once into an
   offscreen canvas at device resolution and then blitted. The look is
   identical; the cost drops to one drawImage per dish.
   ==================================================================== */
var Sprite = {
  cache: {},
  count: 0,

  /* device pixels for a logical length, quantised so the cache stays small */
  dev: function (logical) {
    var px = logical * View.scale * View.dpr;
    return Math.max(8, Math.round(px / 4) * 4);
  },

  make: function (key, wDev, hDev, paint) {
    var hit = Sprite.cache[key];
    if (hit) return hit;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(wDev));
    cv.height = Math.max(1, Math.ceil(hDev));
    var c = cv.getContext('2d');
    paint(c, cv.width, cv.height);
    Sprite.cache[key] = cv;
    Sprite.count++;
    /* a viewport change invalidates every size; keep a lid on it anyway */
    if (Sprite.count > 900) Sprite.clear();
    return cv;
  },

  clear: function () { Sprite.cache = {}; Sprite.count = 0; },

  /* just the food, transparent background */
  food: function (food, size, variant) {
    var d = Sprite.dev(size);
    var pad = Math.ceil(d * 0.14);
    var box = d + pad * 2;
    var v = ((variant || 0) % 3 + 3) % 3;
    var key = 'f|' + food.art + '|' + d + '|' + v;
    return {
      cv: Sprite.make(key, box, box, function (c) {
        c.translate(box / 2, box / 2);
        c.scale(d / 100, d / 100);
        paintFood(c, food, 0, 0, 100, 7 + v * 977);
      }),
      /* logical size of the padded box, so callers can centre it */
      box: size * (box / d)
    };
  },

  /* the whole dish: shadow, body, rim, wash, food, badge */
  dish: function (food, size, selected, variant) {
    var d = Sprite.dev(size);
    var pad = Math.ceil(d * 0.16);
    var box = d + pad * 2;
    var v = ((variant || 0) % 3 + 3) % 3;
    var key = 'd|' + food.art + '|' + d + '|' + (selected ? 1 : 0) + '|' + v;
    return {
      cv: Sprite.make(key, box, box, function (c) {
        c.translate(box / 2, box / 2);
        c.scale(d / 100, d / 100);
        paintDishBody(c, food, 100, selected, 7 + v * 977);
      }),
      box: size * (box / d)
    };
  },

  lid: function (size) {
    var d = Sprite.dev(size);
    var pad = Math.ceil(d * 0.16);
    var box = d + pad * 2;
    return {
      cv: Sprite.make('lid|' + d, box, box, function (c) {
        c.translate(box / 2, box / 2);
        c.scale(d / 100, d / 100);
        paintLidBody(c, 100);
      }),
      box: size * (box / d)
    };
  },

  /* full-screen backdrops. These are smooth, so they are cached below device
     resolution and stretched - a full-res copy of each would cost a phone
     tens of megabytes of canvas memory for no visible gain. */
  screen: function (key, paint, quality) {
    var q = quality || 1;
    var w = Math.max(2, Math.round(CFG.W * View.scale * View.dpr * q));
    var h = Math.max(2, Math.round(CFG.H * View.scale * View.dpr * q));
    return Sprite.make(key + '|' + w + 'x' + h, w, h, function (c) {
      c.scale(w / CFG.W, h / CFG.H);
      paint(c);
    });
  },

  blit: function (ctx, s, x, y, size, extraScale) {
    var b = s.box * (extraScale == null ? 1 : extraScale);
    ctx.drawImage(s.cv, x - b / 2, y - b / 2, b, b);
  }
};

/* keep the sprite sheet honest when the viewport changes density or size */
(function () {
  var baseResize = View.resize;
  var sig = function () {
    return View.scale + '|' + View.dpr + '|' + Math.round(CFG.W) + 'x' + Math.round(CFG.H);
  };
  View.resize = function () {
    var before = sig();
    baseResize();
    if (before !== sig()) Sprite.clear();
  };
})();

/* drawn once per sprite, in a 100-unit box centred on the origin */
function paintDishBody(ctx, food, s, selected, seed) {
  var half = s / 2;
  var rim = CAT[food.cat].color;

  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000';
  Draw.rr(ctx, -half + 3, -half + 7, s - 6, s - 4, s * 0.28);
  ctx.fill();
  ctx.restore();

  var g = ctx.createLinearGradient(0, -half, 0, half);
  g.addColorStop(0, selected ? 'rgba(58,74,116,.98)' : 'rgba(34,44,72,.96)');
  g.addColorStop(1, selected ? 'rgba(28,38,64,.98)' : 'rgba(18,25,44,.96)');
  ctx.fillStyle = g;
  Draw.rr(ctx, -half, -half, s, s, s * 0.28);
  ctx.fill();

  ctx.lineWidth = selected ? 5 : 3;
  ctx.strokeStyle = selected ? '#ffffff' : rim;
  ctx.globalAlpha = selected ? 0.95 : 0.75;
  Draw.rr(ctx, -half, -half, s, s, s * 0.28);
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* a wash of the category colour so a glance is enough */
  ctx.save();
  Draw.rr(ctx, -half, -half, s, s, s * 0.28);
  ctx.clip();
  ctx.globalAlpha = selected ? 0.3 : 0.16;
  var gg = ctx.createLinearGradient(0, -half, 0, half);
  gg.addColorStop(0, rim);
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gg;
  ctx.fillRect(-half, -half, s, s);
  ctx.restore();

  Art.plate(ctx, s * 0.4);
  paintFood(ctx, food, 0, -s * 0.02, s * 0.72, seed);
  catBadge(ctx, food.cat, half - s * 0.17, -half + s * 0.17, s * 0.13);
}

function paintLidBody(ctx, s) {
  var half = s / 2;
  ctx.save();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
  Draw.rr(ctx, -half + 3, -half + 7, s - 6, s - 4, s * 0.28);
  ctx.fill();
  ctx.restore();
  var g = ctx.createLinearGradient(0, -half, 0, half);
  g.addColorStop(0, '#cfd9e8');
  g.addColorStop(0.5, '#8b9ab4');
  g.addColorStop(1, '#5b6a85');
  ctx.fillStyle = g;
  Draw.rr(ctx, -half, -half, s, s, s * 0.28);
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(240,250,255,.55)';
  Draw.rr(ctx, -half, -half, s, s, s * 0.28);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath();
  ctx.arc(0, s * 0.16, s * 0.34, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(0, s * 0.16, s * 0.34, Math.PI, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s * 0.4, s * 0.16); ctx.lineTo(s * 0.4, s * 0.16);
  ctx.stroke();
  gloss(ctx, -s * 0.14, s * 0.02, s * 0.1, s * 0.05, -0.4, 0.3);
}

/* every caller goes through the cache */
function drawFood(ctx, food, x, y, size, seedKey) {
  Sprite.blit(ctx, Sprite.food(food, size, seedKey || 0), x, y, size);
}
</script>

/* ================================================================= BOARD */
function Board(level) {
  this.level = level;
  this.cols = level.cols;
  this.rows = level.rows;
  this.cells = [];
  this.nextId = 1;
  this.t = 0;
  this.layout();
  this.fill();
}

Board.prototype.layout = function () {
  var safe = View.safe;
  /* room is reserved for the between-courses banner even when it is not
     showing, so the board never jumps under the player's finger. Below the
     board: the banner, then WASH and RINSE, and the boys behind them. */
  var topUI = 262 + safe.t;
  var botUI = 200 + safe.b;
  var colW = View.colW();
  var availW = colW - 36;
  var availH = CFG.H - topUI - botUI;
  var cell = Math.floor(Math.min(availW / this.cols, availH / this.rows));
  this.cell = cell;
  this.bw = cell * this.cols;
  this.bh = cell * this.rows;
  this.bx = View.colX() + (colW - this.bw) / 2;
  /* The dishes are as wide as the column allows, so a tall phone has height
     to spare. Split it above and below rather than letting one big hole open
     up: the orders frame the gap above, the nusach plaque the gap below. */
  this.by = topUI + clamp((availH - this.bh) / 2, 0, 230);
};

Board.prototype.idx = function (gx, gy) { return gy * this.cols + gx; };
Board.prototype.get = function (gx, gy) {
  if (gx < 0 || gy < 0 || gx >= this.cols || gy >= this.rows) return null;
  return this.cells[this.idx(gx, gy)];
};
Board.prototype.set = function (gx, gy, tile) { this.cells[this.idx(gx, gy)] = tile; };

Board.prototype.cx = function (gx) { return this.bx + gx * this.cell + this.cell / 2; };
Board.prototype.cy = function (gy) { return this.by + gy * this.cell + this.cell / 2; };

/* the pool of foods this table serves. Weights are parts out of a whole,
   at double resolution so a half-step is possible (pareve is always two
   parts - the glue between plates). */
Board.prototype.foodWeights = function () {
  var cats = this.level.pool;
  var w = {};
  for (var i = 0; i < cats.length; i++) w[cats[i]] = (cats[i] === 'pareve') ? 4 : 2;
  /* A fish order is not the same table for everybody. Edot HaMizrach never
     lets fish ride with dairy, so a fish chain can only grow through more
     fish or pareve - move some of dairy's weight onto fish, or the table
     that is easy for Ashkenaz starves a Mizrach player out of moves.
     Ashkenaz and Sefard run the whole board and need nothing moved. Only do
     this when a fish order is on the table with no dairy order competing
     for the same board - a table that orders both still needs all the
     dairy it can get, so that gap is closed with a few extra moves instead
     (see LEVELS' moveBonus). */
  var wantsFish = this.level.orders.some(function (o) { return o.kind === 'fish'; });
  var wantsDairy = this.level.orders.some(function (o) { return o.kind === 'dairy'; });
  var wantsMeat = this.level.orders.some(function (o) { return o.kind === 'meat'; });
  if (w.fish && w.dairy && wantsFish && !wantsDairy && Nusach.id === 'mizrach') {
    w.dairy -= 1; w.fish += 1;
  } else if (w.fish && !wantsFish && (wantsMeat || wantsDairy) && Nusach.id === 'mizrach') {
    /* No fish order at all here, just fish sitting in the pool as filler.
       Nobody puts fish on a meat plate, so that was always dead weight for
       the fleishig order - but Ashkenaz and Sefard can still fold a fish
       tile into a milchig chain, so it was never dead weight for THEM.
       Edot HaMizrach cannot: with no order to aim it at and no dairy chain
       it may join, a fish tile is just clutter that thins out the board.
       Shrink it down and hand the room to whichever order is actually
       asking for it. */
    var give = w.fish - 0.5;
    w.fish = 0.5;
    var n = (wantsMeat ? 1 : 0) + (wantsDairy ? 1 : 0);
    if (wantsMeat) w.meat += give / n;
    if (wantsDairy) w.dairy += give / n;
  }
  return w;
};
Board.prototype.rollFood = function () {
  var lv = this.level;
  if (lv.treif && chance(lv.treif)) return pick(foodsOfCat('treif'));
  if (lv.mixed && chance(lv.mixed)) return pick(foodsOfCat('mixed'));
  var w = this.foodWeights();
  var total = (w.meat || 0) + (w.dairy || 0) + (w.fish || 0) + (w.pareve || 0);
  var roll = Math.random() * total;
  var cat = 'pareve';
  if ((roll -= (w.meat || 0)) < 0) cat = 'meat';
  else if ((roll -= (w.dairy || 0)) < 0) cat = 'dairy';
  else if ((roll -= (w.fish || 0)) < 0) cat = 'fish';
  return pick(foodsOfCat(cat));
};

Board.prototype.makeTile = function (gx, gy, food, fromAbove) {
  var t = {
    id: this.nextId++,
    f: food || this.rollFood(),
    gx: gx, gy: gy,
    px: this.cx(gx),
    py: fromAbove ? this.by - this.cell * (1 + Math.random() * 2) : this.cy(gy),
    vy: 0,
    covered: false,
    pop: 0, popMax: 0,
    born: 0,
    seed: this.nextId * 7919
  };
  t.born = 0;
  return t;
};

Board.prototype.fill = function () {
  this.cells.length = 0;
  for (var gy = 0; gy < this.rows; gy++) {
    for (var gx = 0; gx < this.cols; gx++) {
      this.cells[this.idx(gx, gy)] = this.makeTile(gx, gy, null, false);
    }
  }
  /* covered dishes, scattered, never in the bottom row so a chain can start */
  var lids = this.level.lids || 0;
  var spots = [];
  for (var y = 0; y < this.rows - 1; y++) for (var x = 0; x < this.cols; x++) spots.push([x, y]);
  shuffle(spots);
  for (var i = 0; i < Math.min(lids, spots.length); i++) {
    var tile = this.get(spots[i][0], spots[i][1]);
    if (tile) tile.covered = true;
  }
};

/* can this tile ever be part of a plate? */
Board.prototype.joinable = function (tile) {
  if (!tile) return false;
  if (tile.covered) return false;
  if (tile.f.cat === 'treif' || tile.f.cat === 'mixed') return false;
  return true;
};
Board.prototype.binnable = function (tile) {
  return !!tile && !tile.covered && (tile.f.cat === 'treif' || tile.f.cat === 'mixed');
};

/* which cell is under this logical point, if the finger is close enough */
Board.prototype.cellAt = function (p, radiusK) {
  var gx = Math.floor((p.x - this.bx) / this.cell);
  var gy = Math.floor((p.y - this.by) / this.cell);
  if (gx < 0 || gy < 0 || gx >= this.cols || gy >= this.rows) return null;
  var r = this.cell * (radiusK == null ? 0.46 : radiusK);
  var dx = p.x - this.cx(gx), dy = p.y - this.cy(gy);
  if (dx * dx + dy * dy > r * r) return null;
  return { gx: gx, gy: gy };
};

/* gravity: everything above a hole slides down, new food drops in on top */
Board.prototype.collapse = function () {
  for (var gx = 0; gx < this.cols; gx++) {
    var write = this.rows - 1;
    for (var gy = this.rows - 1; gy >= 0; gy--) {
      var t = this.get(gx, gy);
      if (t) {
        if (write !== gy) {
          t.gy = write;
          this.set(gx, write, t);
          this.set(gx, gy, null);
        }
        write--;
      }
    }
    for (var y = write; y >= 0; y--) {
      this.set(gx, y, this.makeTile(gx, y, null, true));
    }
  }
};

Board.prototype.update = function (dt) {
  this.t += dt;
  for (var i = 0; i < this.cells.length; i++) {
    var t = this.cells[i];
    if (!t) continue;
    t.born += dt;
    var tx = this.cx(t.gx), ty = this.cy(t.gy);
    /* falls with a little weight, then settles - no bounce jitter */
    var dy = ty - t.py;
    if (Math.abs(dy) > 0.4) {
      t.vy += 3600 * dt;
      t.py += t.vy * dt;
      if (t.py > ty) { t.py = ty; t.vy = 0; }
    } else { t.py = ty; t.vy = 0; }
    t.px = lerp(t.px, tx, Math.min(1, dt * 18));
    if (t.pop > 0) t.pop = Math.max(0, t.pop - dt);
  }
};

Board.prototype.settled = function () {
  for (var i = 0; i < this.cells.length; i++) {
    var t = this.cells[i];
    if (!t) return false;
    if (Math.abs(t.py - this.cy(t.gy)) > 1.5) return false;
  }
  return true;
};
</script>
<script>
'use strict';
/* ================================================================== PLAY */
function Play(levelIndex) {
  this.li = levelIndex;
  this.level = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
  Scene.setWeek(this.level.week || 0);
  this.board = new Board(this.level);

  this.score = 0;
  /* A table that orders both fish and dairy still needs all the dairy it
     can get, so Edot HaMizrach's rinse between them (and Chabad's lost
     liquid milk) is made up in moves instead of a thinner board - see
     Board.foodWeights for the tables where thinning the board is safe
     instead. */
  var bonus = (this.level.moveBonus && this.level.moveBonus[Nusach.id]) || 0;
  this.totalMoves = this.level.moves + bonus;
  this.moves = this.totalMoves;
  this.orders = this.level.orders.map(function (o) {
    return { kind: o.kind, need: o.need, got: 0 };
  });

  this.chain = [];
  this.plate = emptyPlate();
  this.loop = false;
  this.loopSide = null;
  this.finger = null;

  /* The camp clock. Serving a plate is two hours of camp, which is what makes
     the six hours between fleishig and milchig into six hours you can see. */
  this.day = this.level.week * 3 + (this.level.day || 1);
  this.clock = 7 * 60;        /* minutes past midnight, breakfast time */

  this.waitLeft = 0;          /* minutes still owed after fleishig, before milchig */
  this.waitMoves = 0;         /* the same wait counted in plates, for the HUD */
  this.needWash = false;      /* hands, after milchig and before fleishig */
  this.needDrink = false;     /* a drink, after milchig or fish and before fleishig */
  this.needPareve = false;    /* something pareve, after milchig and before fleishig */
  /* fish and meat go both ways round: whichever came first, everyone rinses
     before the other one is served */
  this.needFishDrink = false; /* a drink, after fleishig and before fish */
  /* Edot HaMizrach never share a plate with fish and dairy, and many also
     rinse between them the rest of the way round - the same as fish and
     meat. Everyone else's nusach lets the two ride together, so these two
     flags never turn on outside of mizrach. */
  this.needFishRinse = false;  /* a drink, after dairy and before fish (mizrach) */
  this.needDairyRinse = false; /* a drink, after fish and before dairy (mizrach) */
  this.needRinse = false;     /* any of the above is still owed */
  /* One netilas yadayim covers the whole meal - all the challah of that meal,
     not just the first piece. It only lapses when the boys bentch. */
  this.washed = false;

  /* The meal on the table now. Fleishig and milchig are not only a question of
     six hours: they may not be eaten at one meal at all. To turn a fleishig
     meal into a milchig one the boys bentch, the table is cleared, and a new
     meal begins. */
  this.mealSide = null;       /* 'meat' | 'dairy' | null - what this meal is */
  this.mealAte = 0;           /* plates served since the last bentching */
  this.meals = 0;             /* meals bentched this week, for the scoring */

  /* the boys. They get hungry while you stand there and happy when they eat,
     and the hunger runs on the wall clock, not on your moves. */
  this.simcha = 68;
  this.simchaFlash = 0;
  this.drain = drainOf(this.level);
  this.grace = 2.2;           /* a moment to read the board before it drains */
  this.flashKey = null;       /* a rule card waiting to be shown */

  this.reason = null;         /* { why, x, y, age } */
  this.pops = [];
  this.busy = 0;
  this.hint = null;
  this.hintT = 0;             /* how much longer the hinted path glows */
  this.hintCooldown = 0;      /* seconds until the hint button can be used again */
  this.explainKind = null;    /* order kind whose card is open, if any */
  this._ord = [];             /* order-card rects, laid out once per relayout */
  this.over = null;           /* 'win' | 'lose' */
  this.overT = 0;
  this.t = 0;

  this.pauseBtn = new Button({
    x: CFG.W - 96 - 22, y: 0, w: 96, h: 62, label: '',
    color: PAL.slate, size: 24,
    onTap: (function (self) { return function () { Game.pause(self); }; })(this)
  });
  this.hintBtn = new Button({
    x: 0, y: 0, w: 92, h: 62, label: 'HINT', color: PAL.gold, size: 16,
    onTap: (function (self) { return function () { self.useHint(); }; })(this)
  });
  this.orderBtns = this.orders.map((function (self) {
    return function (o, i) {
      return new Button({
        x: 0, y: 0, w: 0, h: 0, label: '',
        onTap: function () { self.explainKind = o.kind; }
      });
    };
  })(this));
  /* the three things the boys can do without a plate leaving the kitchen */
  this.washBtn = new Button({
    x: 0, y: 0, w: 0, h: 84, label: 'WASH', color: PAL.teal, size: 20,
    onTap: (function (self) { return function () { self.doWash(); }; })(this)
  });
  this.rinseBtn = new Button({
    x: 0, y: 0, w: 0, h: 84, label: 'RINSE', color: PAL.dairy, size: 20,
    onTap: (function (self) { return function () { self.doRinse(); }; })(this)
  });
  this.bentchBtn = new Button({
    x: 0, y: 0, w: 0, h: 84, label: 'BENTCH', color: PAL.gold, size: 20,
    onTap: (function (self) { return function () { self.doBentch(); }; })(this)
  });
  Kids.build(this);
}

Play.prototype.relayout = function () {
  this.board.layout();
  this.pauseBtn.x = View.colX() + View.colW() - 96 - 18;
  this.pauseBtn.y = 18 + View.safe.t;
  this.pauseBtn.h = 58;
  this.hintBtn.y = this.pauseBtn.y;
  this.hintBtn.h = this.pauseBtn.h;
  this.hintBtn.x = this.pauseBtn.x - 14 - this.hintBtn.w;
  this.layoutOrders();
  /* the hall along the bottom, and WASH and RINSE sitting on the table */
  Kids.layout(this);
};

/* order-card geometry, shared between drawHUD (what is drawn) and the
   tap targets (what can be tapped) so an explanation always opens under
   the finger and never drifts from the card the eye is reading */
Play.prototype.layoutOrders = function () {
  var safe = View.safe, top = 18 + safe.t;
  var colX = View.colX(), colW = View.colW();
  /* below the banner writing, which lives in the lower half of the cloth */
  var oy = top + 122;
  var n = this.orders.length;
  var gap = 9;
  var availW = colW - 36;
  var cw = Math.min(154, (availW - gap * (n - 1)) / n);
  var totalW = cw * n + gap * (n - 1);
  var ox = colX + (colW - totalW) / 2;
  this._ord.length = 0;
  for (var i = 0; i < n; i++) {
    var x = ox + i * (cw + gap);
    this._ord.push({ x: x, y: oy, w: cw, h: 72 });
    var b = this.orderBtns[i];
    b.x = x; b.y = oy; b.w = cw; b.h = 72;
  }
};

/* ------------------------------------------------------------ chain rules */
/* the wait, the washing and the drink are kitchen order rather than plate law,
   so they live here and not in plateAccepts */
Play.prototype.gate = function (food) {
  if (food.cat === 'dairy') {
    /* the hours come first, because bentching on its own will not help until
       they are up, and then the meal itself has to end */
    if (this.waitLeft > 0) return 'Still waiting after the meat';
    if (this.mealSide === 'meat') return 'Bentch first - milchig needs its own meal';
    if (this.needDairyRinse) return 'Rinse between fish and dairy';
  }
  if (food.cat === 'meat') {
    if (this.needWash || this.needPareve) {
      return 'After milchig: wash, drink, then something pareve';
    }
    if (this.needDrink) return 'Rinse between fish and meat';
  }
  if (food.cat === 'fish' && this.needFishDrink) return 'Rinse between meat and fish';
  if (food.cat === 'fish' && this.needFishRinse) return 'Rinse between dairy and fish';
  if (food.bread && !this.washed) return 'Wash your hands before challah';
  return null;
};

Play.prototype.canJoin = function (tile) {
  if (!tile) return { ok: false, why: 'Not touching' };
  if (tile.covered) return { ok: false, why: 'Lift the lid first' };
  if (tile.f.cat === 'treif') return { ok: false, why: 'This is never kosher - throw it out' };
  if (tile.f.cat === 'mixed') return { ok: false, why: 'Meat cooked with cheese - throw it out' };
  var held = this.gate(tile.f);
  if (held) return { ok: false, why: held };
  return plateAccepts(this.plate, tile.f, Nusach.id);
};

Play.prototype.blocked = function (tile) {
  if (!tile || tile.covered) return false;
  if (tile.f.cat === 'treif' || tile.f.cat === 'mixed') return false;
  return !!this.gate(tile.f);
};

/* keep the one-word summary the HUD and the tests read in step with the flags */
Play.prototype.syncGates = function () {
  this.waitMoves = Math.ceil(this.waitLeft / 120);
  this.needRinse = this.needWash || this.needDrink || this.needPareve ||
    this.needFishDrink || this.needFishRinse || this.needDairyRinse;
};

/* ------------------------------------------------------- the free actions */
/* None of them costs a move. They are things the boys do at the table in a
   minute, and they are the halacha that lets the next plate go out. */
Play.prototype.doWash = function () {
  if (this.over) return false;
  var mattered = !this.washed || this.needWash;
  this.washed = true;
  this.needWash = false;
  this.syncGates();
  if (mattered) this.simchaAdd(1);
  Kids.order(this, 'wash');
  FX.text(CFG.W / 2, this.board.by + this.board.bh + 30, 'HANDS WASHED', PAL.teal, 26, 1.0);
  Sound.tone({ f: 520, f2: 880, dur: 0.22, vol: 0.15, type: 'triangle' });
  Haptics.light();
  return mattered;
};

/* Bentching ends the meal. The table is cleared, the boys sing, and the next
   sitting comes in - which is the only way milchig follows fleishig. */
Play.prototype.doBentch = function () {
  if (this.over) return false;
  if (this.mealAte <= 0) {
    this.reason = {
      why: 'Nothing has been eaten yet', age: 0, at: this.t, calm: true,
      x: CFG.W / 2, y: this.board.by + this.board.bh - 20
    };
    return false;
  }
  /* a real meal ends with a niggun. Bentching after a single plate is just
     clearing the table, so it pays nothing - no farming the boys' mood. */
  if (this.mealAte >= 2) { this.score += 30; this.simchaAdd(3); }
  this.mealSide = null;
  this.mealAte = 0;
  this.washed = false;        /* the next meal needs its own washing */
  this.meals++;
  /* bentching is not instant, and the clock knows it */
  this.advance(30);
  Kids.order(this, 'bentch');
  FX.text(CFG.W / 2, this.board.by + this.board.bh + 30, 'BENTCHED - NEW MEAL', PAL.gold, 24, 1.2);
  FX.flash(PAL.gold, 0.16);
  Sound.bentch();
  Haptics.light();
  this.checkOver();
  return true;
};

Play.prototype.doRinse = function () {
  if (this.over) return false;
  var mattered = this.needDrink || this.needFishDrink ||
    this.needFishRinse || this.needDairyRinse;
  this.needDrink = false;
  this.needFishDrink = false;
  this.needFishRinse = false;
  this.needDairyRinse = false;
  this.syncGates();
  if (mattered) this.simchaAdd(2);
  Kids.order(this, 'drink');
  FX.text(CFG.W / 2, this.board.by + this.board.bh + 30, 'EVERYONE DRINKS', PAL.dairy, 26, 1.0);
  Sound.tone({ f: 700, f2: 460, dur: 0.2, vol: 0.14, type: 'sine' });
  Haptics.light();
  return mattered;
};

/* The boys' mood, which is the other way to lose a week. A plate lifts a room
   that is already fed much less than it lifts a hungry one, so the bar settles
   where your pace puts it instead of parking at the top and staying there. */
Play.prototype.simchaAdd = function (n) {
  var before = this.simcha;
  if (n > 0) n *= 1 - this.simcha / 140;
  this.simcha = clamp(this.simcha + n, 0, 100);
  if (this.simcha > before) this.simchaFlash = 0.5;
};

/* push the camp clock along, and run the fleishig wait down with it. It is the
   same boys at the table all day: a fresh group would mean a fresh stomach,
   and then none of the waiting would mean anything. */
Play.prototype.advance = function (mins) {
  this.clock += mins;
  while (this.clock >= 24 * 60) { this.clock -= 24 * 60; this.day++; }
  if (this.waitLeft > 0) this.waitLeft = Math.max(0, this.waitLeft - mins);
  this.syncGates();
};

Play.prototype.inChain = function (gx, gy) {
  for (var i = 0; i < this.chain.length; i++) {
    if (this.chain[i].gx === gx && this.chain[i].gy === gy) return i;
  }
  return -1;
};

Play.prototype.rebuildPlate = function () {
  this.plate = emptyPlate();
  for (var i = 0; i < this.chain.length; i++) {
    addToPlate(this.plate, this.chain[i].tile.f);
  }
};

Play.prototype.startChain = function (tile) {
  this.chain = [{ gx: tile.gx, gy: tile.gy, tile: tile }];
  this.plate = addToPlate(emptyPlate(), tile.f);
  this.loop = false; this.loopSide = null;
  Sound.link(0);
  Haptics.tick();
};

Play.prototype.pushChain = function (tile) {
  this.chain.push({ gx: tile.gx, gy: tile.gy, tile: tile });
  addToPlate(this.plate, tile.f);
  Sound.link(this.chain.length - 1);
  Haptics.tick();
  FX.ring(tile.px, tile.py, plateColor(this.plate), this.board.cell * 0.36);
};

Play.prototype.popChain = function () {
  this.chain.pop();
  this.rebuildPlate();
  Sound.tone({ f: 300, dur: 0.05, vol: 0.1, type: 'triangle' });
};

Play.prototype.refuse = function (why, tile) {
  var now = this.t;
  /* The first time a rule stops a plate, the card that teaches that rule comes
     out - with the source on it. update() opens it once the finger is off. */
  var card = WHY_CARD[why];
  if (card && !Progress.seenTeach[card]) this.flashKey = card;
  if (this.reason && this.reason.why === why && now - this.reason.at < 0.5) return;
  this.reason = {
    why: why, age: 0, at: now,
    x: tile ? tile.px : CFG.W / 2,
    y: tile ? tile.py : CFG.H / 2
  };
  Sound.nope();
  Haptics.nope();
  if (tile) {
    FX.burst(tile.px, tile.py, { n: 6, color: PAL.red, rMin: 2, rMax: 5, spdMax: 110 });
    tile.shakeT = 0.25;
  }
};

/* ---------------------------------------------------------------- input */
Play.prototype.onDown = function (p) {
  if (this.explainKind) { this.explainKind = null; return; }
  if (this.busy > 0 || this.over) return;
  this.hint = null;
  var c = this.board.cellAt(p, 0.5);
  /* a poke at one of the boys gets an answer out of him */
  if (!c && Kids.tap(this, p.x, p.y)) return;
  if (!c) return;
  var tile = this.board.get(c.gx, c.gy);
  if (!tile) return;

  if (tile.covered) { this.liftLid(tile); return; }
  if (this.board.binnable(tile)) { this.bin(tile); return; }

  var gate = this.canJoin(tile);
  if (!gate.ok) { this.refuse(gate.why, tile); return; }
  this.startChain(tile);
  this.finger = { x: p.x, y: p.y };
};

Play.prototype.onMove = function (p) {
  if (this.busy > 0 || this.over || !this.chain.length) return;
  this.finger = { x: p.x, y: p.y };
  if (this.loop) return;                 /* loop is closed - nothing more joins */

  var c = this.board.cellAt(p, 0.46);
  if (!c) return;
  var last = this.chain[this.chain.length - 1];
  if (c.gx === last.gx && c.gy === last.gy) return;

  /* only orthogonal neighbours count as touching */
  var d = Math.abs(c.gx - last.gx) + Math.abs(c.gy - last.gy);
  if (d !== 1) return;

  /* dragging back one step takes the last food off the plate */
  if (this.chain.length >= 2) {
    var prev = this.chain[this.chain.length - 2];
    if (prev.gx === c.gx && prev.gy === c.gy) { this.popChain(); return; }
  }

  var at = this.inChain(c.gx, c.gy);
  if (at >= 0) {
    /* back onto an earlier link: a closed loop sweeps the board */
    if (this.chain.length - at >= 4) {
      this.loop = true;
      this.loopSide = plateSide(this.plate);
      Sound.tone({ f: 660, f2: 1320, dur: 0.25, vol: 0.2, type: 'triangle' });
      Haptics.light();
      FX.shake(6, 0.25);
      FX.flash(plateColor(this.plate), 0.2);
    }
    return;
  }

  var tile = this.board.get(c.gx, c.gy);
  if (!tile) return;
  var gate = this.canJoin(tile);
  if (!gate.ok) { this.refuse(gate.why, tile); return; }
  this.pushChain(tile);
};

Play.prototype.onUp = function () {
  this.finger = null;
  if (this.busy > 0 || this.over) { this.chain = []; return; }
  if (this.chain.length >= 3 || this.loop) this.serve();
  else this.cancelChain();
};

Play.prototype.cancelChain = function () {
  this.chain = [];
  this.plate = emptyPlate();
  this.loop = false; this.loopSide = null;
};

/* ------------------------------------------------------------- the serve */
Play.prototype.serve = function () {
  var side = plateSide(this.plate);
  var len = this.chain.length;
  var color = plateColor(this.plate);
  var cleared = [];
  var i, tile;

  if (this.loop) {
    /* every food of this side leaves the board at once - the ring only has
       to be four foods that may join each other, so most of what actually
       goes out was never dragged through and never individually checked */
    var seen = {};
    for (i = 0; i < this.chain.length; i++) seen[this.chain[i].tile.id] = true;
    for (i = 0; i < this.board.cells.length; i++) {
      tile = this.board.cells[i];
      if (!tile || tile.covered) continue;
      if (tile.f.cat === this.loopSide || seen[tile.id]) cleared.push(tile);
    }
  } else {
    for (i = 0; i < this.chain.length; i++) cleared.push(this.chain[i].tile);
  }

  /* the kitchen may still say no, and it costs nothing to be told - checked
     against everything that is actually about to leave the board. A pareve
     loop can easily sweep in a challah the ring itself never touched, and
     unwashed hands still may not take it. */
  var held = null;
  for (var g = 0; g < cleared.length && !held; g++) {
    held = this.gate(cleared[g].f);
  }
  if (held) {
    this.refuse(held, cleared[cleared.length - 1]);
    this.cancelChain();
    return;
  }

  if (this.loop) {
    FX.shake(14, 0.5);
    FX.flash(color, 0.3);
    FX.text(CFG.W / 2, this.board.by + this.board.bh / 2, 'LOOP! WHOLE BOARD', PAL.violet, 42, 1.5);
  }

  /* points ramp with the plate so a long chain is worth the routing */
  var gained = 0;
  for (i = 0; i < cleared.length; i++) gained += 10 + i * 4;
  if (this.loop) gained = Math.round(gained * 1.6);
  this.score += gained;

  for (i = 0; i < cleared.length; i++) {
    tile = cleared[i];
    this.pops.push({
      x: tile.px, y: tile.py, f: tile.f, seed: tile.seed,
      age: -i * 0.028, life: 0.42, size: this.board.cell * 0.78, color: color
    });
    this.board.set(tile.gx, tile.gy, null);
  }

  /* fish riding with dairy is only possible at all when the nusach permits
     it (plateAccepts already turned back anything Edot HaMizrach could not
     join), so seeing both on one plate here means it is a legal double -
     two orders filled at once, and the boys are extra pleased about it */
  var dual = !!(this.plate.dairy && this.plate.fish);

  var midIdx = Math.floor(cleared.length / 2);
  var mx = cleared[midIdx].px, my = cleared[midIdx].py;
  var callName = this.loop ? 'THE WHOLE TRAY!' : (len >= 8 ? 'FULL PLATE!' : (len >= 6 ? 'BIG PLATE' : plateName(this.plate)));
  FX.text(mx, my - 10, callName, color, len >= 6 ? 36 : 28, 1.2);
  FX.text(mx, my + 34, '+' + gained, PAL.gold, 26, 1.0);
  if (dual) FX.text(mx, my + 64, 'DUAL BONUS', PAL.dual, 20, 0.9);
  FX.burst(mx, my, { n: 16 + cleared.length * 2, color: color, spdMax: 300, rMax: 9 });
  Sound.serve(cleared.length);
  Haptics.light();

  /* orders */
  this.credit(dual ? ['fish', 'dairy'] : [side], len, this.loop);

  /* The boys ate: two hours of camp go by, and they are that much happier.
     A plate only just beats the drain, so a short plate served slowly loses
     ground and the room has to be fed properly, not just fed. A plate that
     is really two orders at once is worth a little extra simcha too. */
  this.advance(120);
  this.simchaAdd(1.2 + cleared.length * 1.15 + (dual ? 2.5 : 0));
  Kids.order(this, 'eat', { big: len >= 6 || this.loop, color: color });
  /* a boy who davens Ashkenaz or Sefard is happy to say so */
  if (dual && (Nusach.id === 'ashkenaz' || Nusach.id === 'sefard') && chance(0.4)) {
    Kids.sayDual(this);
  }

  /* halacha between courses - checked on what is actually on the plate, not
     on whichever single label just got called out loud. Dairy and fish may
     ride the same plate under a lenient nusach, and if so both sets of
     rules land: the mouth gets rinsed for the fish and the hands wait for
     the dairy, whichever one the FX text happened to name it after. */
  if (this.plate.meat) {
    /* six hours before anything milchig, which is three more plates - and not
       at this meal at all, however long the boys sit there. Fish after meat
       needs a rinse, the same as meat after fish. */
    this.waitLeft = 360;
    this.needDrink = false; this.needWash = false; this.needPareve = false;
    this.needFishDrink = true;
  }
  if (this.plate.dairy) {
    /* hands and mouth before any meat. The washing for challah still holds:
       eating does not undo a netilas yadayim, only bentching does. */
    this.needWash = true; this.needDrink = true; this.needPareve = true;
    this.needDairyRinse = false;
    /* Edot HaMizrach never got this far with fish already on the plate -
       plateAccepts would have refused it - so this is milchig alone, and
       now fish is owed its own rinse before it may come out */
    if (Nusach.id === 'mizrach') this.needFishRinse = true;
  }
  if (this.plate.fish) {
    this.needDrink = true;
    this.needFishDrink = false;
    this.needFishRinse = false;
    if (Nusach.id === 'mizrach') this.needDairyRinse = true;
  }
  if (!this.plate.meat && !this.plate.dairy && !this.plate.fish && this.needPareve) {
    this.needPareve = false;
    FX.text(CFG.W / 2, this.board.by - 22, 'PAREVE', PAL.pareve, 26, 1.0);
  }
  /* what is on the table now decides what may still come out of the kitchen -
     again by what is really on the plate, not by whichever name won it */
  this.mealAte++;
  if (this.plate.meat) this.mealSide = 'meat';
  else if (this.plate.dairy) this.mealSide = 'dairy';
  this.syncGates();

  this.moves--;

  this.cancelChain();
  /* a board-wide sweep must not lock the player out for a second and a half */
  this.busy = Math.min(0.45, 0.1 + cleared.length * 0.02);
  this.board.collapse();
  this.checkOver();
};

/* sides is normally just [the plate's one side], but a fish-and-dairy plate
   under a nusach that allows the two together fills both orders at once -
   one pass, so a long or looped plate still only ticks big/loop the once */
Play.prototype.credit = function (sides, chainLen, wasLoop) {
  for (var i = 0; i < this.orders.length; i++) {
    var o = this.orders[i];
    if (o.got >= o.need) continue;
    var hit = false;
    if (sides.indexOf(o.kind) !== -1) hit = true;
    else if (o.kind === 'big' && chainLen >= 6) hit = true;
    else if (o.kind === 'loop' && wasLoop) hit = true;
    if (hit) {
      o.got++;
      o.flash = 0.6;
      Sound.tone({ f: 880, f2: 1200, dur: 0.14, vol: 0.16, type: 'sine' });
    }
  }
};

/* --------------------------------------------------------- taps, not drags */
Play.prototype.bin = function (tile) {
  var why = tile.f.cat === 'mixed'
    ? 'Meat cooked with cheese - throw it out'
    : 'This is never kosher - throw it out';
  this.board.set(tile.gx, tile.gy, null);
  this.pops.push({
    x: tile.px, y: tile.py, f: tile.f, seed: tile.seed,
    age: 0, life: 0.5, size: this.board.cell * 0.78, color: PAL.treif, spin: 1
  });
  FX.burst(tile.px, tile.py, { n: 14, color: PAL.treif, spdMax: 240 });
  FX.text(tile.px, tile.py, 'THROWN OUT', PAL.treif, 24, 1.0);
  FX.ring(tile.px, tile.py, PAL.treif, this.board.cell * 0.4);
  Sound.bin();
  Haptics.light();
  this.score += 25;
  for (var i = 0; i < this.orders.length; i++) {
    var o = this.orders[i];
    if (o.kind === 'treif' && o.got < o.need) { o.got++; o.flash = 0.6; }
  }
  this.reason = { why: why, age: 0, at: this.t, x: tile.px, y: tile.py, calm: true };
  this.busy = 0.12;
  this.board.collapse();
  this.checkOver();
};

Play.prototype.liftLid = function (tile) {
  tile.covered = false;
  tile.born = 0;
  FX.burst(tile.px, tile.py - 6, { n: 10, color: PAL.cream, spdMax: 170, grav: 260 });
  FX.ring(tile.px, tile.py, PAL.cream, this.board.cell * 0.38);
  FX.text(tile.px, tile.py, 'LID OFF', PAL.cream, 22, 0.8);
  Sound.lid();
  Haptics.tick();
};

/* ------------------------------------------------------------------ flow */
Play.prototype.checkOver = function () {
  var done = true;
  for (var i = 0; i < this.orders.length; i++) {
    if (this.orders[i].got < this.orders[i].need) { done = false; break; }
  }
  if (done) {
    this.over = 'win'; this.overT = 0;
    Sound.win(); Haptics.win();
    FX.flash(PAL.gold, 0.4);
    return;
  }
  if (this.simcha <= 0) {
    this.over = 'lose'; this.overWhy = 'simcha'; this.overT = 0;
    Sound.lose();
    return;
  }
  if (this.moves <= 0) {
    this.over = 'lose'; this.overWhy = 'moves'; this.overT = 0;
    Sound.lose();
    return;
  }
  if (!this.hasMove()) this.reshuffle();
};

Play.prototype.update = function (dt) {
  this.t += dt;
  this.board.update(dt);

  if (this.busy > 0) this.busy -= dt;
  for (var i = this.pops.length - 1; i >= 0; i--) {
    this.pops[i].age += dt;
    if (this.pops[i].age >= this.pops[i].life) this.pops.splice(i, 1);
  }
  for (i = 0; i < this.orders.length; i++) {
    if (this.orders[i].flash > 0) this.orders[i].flash -= dt;
  }
  for (i = 0; i < this.board.cells.length; i++) {
    var t = this.board.cells[i];
    if (t && t.shakeT > 0) t.shakeT -= dt;
  }
  if (this.reason) {
    this.reason.age += dt;
    if (this.reason.age > 2.2) this.reason = null;
  }

  if (this.hintCooldown > 0) {
    this.hintCooldown = Math.max(0, this.hintCooldown - dt);
  }
  this.hintBtn.enabled = this.hintCooldown <= 0;
  this.hintBtn.sub = this.hintCooldown > 0 ? fmtClock(this.hintCooldown) : '';

  if (this.hint) {
    this.hintT -= dt;
    if (this.hintT <= 0 || this.chain.length) this.hint = null;
  }

  if (this.simchaFlash > 0) this.simchaFlash -= dt;
  Kids.update(dt, this);

  /* a rule just refused a plate for the first time. Explain why, as soon as
     the finger is off the glass and the board has settled. */
  if (this.flashKey && !this.finger && !this.chain.length && Game.screen === this &&
      this.busy <= 0 && !this.over && !this.explainKind) {
    var card = this.flashKey;
    this.flashKey = null;
    Game.teach(card, this);
    return;
  }

  /* The room gets restless in real time. Feeding them is the only thing that
     fills the bar, so a plate that takes too long to find costs simcha even
     though it costs no move. The order card pauses it - reading is not
     dawdling. */
  if (!this.over && !this.explainKind) {
    if (this.grace > 0) this.grace -= dt;
    else {
      this.simcha = Math.max(0, this.simcha - this.drain * dt);
      if (this.simcha <= 0) this.checkOver();
    }
  }

  if (this.over) {
    this.overT += dt;
    if (this.overT > 0.9) Game.finish(this);
    return;
  }
};

/* the hint button: one free look at a legal plate, then a real cooldown so
   it stays a nudge and not a way to skip thinking */
Play.prototype.useHint = function () {
  if (this.hintCooldown > 0 || this.over || this.busy > 0) return;
