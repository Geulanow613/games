<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Mitzvah Dash</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;-ms-touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #stage{display:block;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
  #safeprobe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);}
  #fatal{position:fixed;inset:0;display:none;padding:24px;background:#12060a;color:#ffb4b4;
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;z-index:10;}
</style>

<body>
<canvas id="stage"></canvas>
<div id="safeprobe"></div>
<pre id="fatal"></pre>
<script>
"use strict";
/* ==========================================================================
   MITZVAH DASH  v1.0.0
   Four-in-one mobile arcade suite with an embedded Halacha learning engine.
   Single self-contained file. Canvas2D renderer, fixed-timestep 60fps loop,
   full multi-touch gesture stack, procedural WebAudio, no external assets.
   Runs as a mobile web app or inside a Capacitor / WKWebView / Android
   WebView native shell for iOS + Android (see README.md).
   ========================================================================== */

/* ---------------------------------------------------------------- 0. BOOT */
window.addEventListener('error', function (e) {
  try {
    var f = document.getElementById('fatal');
    f.style.display = 'block';
    f.textContent = 'Mitzvah Dash hit an error:\n\n' + (e.message || e) +
      '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n' +
      (e.error && e.error.stack ? e.error.stack : '');
  } catch (_) {}
});

/* ------------------------------------------------------- 1. CONFIG / MATH */
var CFG = {
  W: 720, H: 1280,           // logical design resolution (locked 9:16)
  STEP: 1 / 60,              // fixed simulation step
  MAX_FRAME: 0.25,           // clamp for tab-switch spikes
  VERSION: '1.0.0',
  SAVE_KEY: 'mitzvahdash.profile.v1'
};

var C = {
  sky0:'#05070f', sky1:'#0b1026', sky2:'#1a2450', sky3:'#2b3a72',
  gold:'#ffcf5c', gold2:'#ffab26', gold3:'#7a5411',
  flame:'#ff8a3d', flameHot:'#fff2b0',
  cream:'#f6ecd6', parch:'#f3e3bd', ink:'#241d12',
  teal:'#35d6c4', blue:'#4aa3ff', red:'#ff5b5b', redDark:'#8d2020',
  green:'#52e08a', purple:'#a883ff', grey:'#93a0b5', greyDark:'#39415a',
  meat:'#e2604f', dairy:'#7fc8ff', pareve:'#8ee06a', trash:'#8a7f95',
  road:'#2b2f3d', roadLine:'#e9e2c9', grass:'#2f7d4f', grass2:'#3b8f5b',
  water:'#2f6fa8', shul:'#c9a86a'
};

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function chance(p) { return Math.random() < p; }
function dist2(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function distance(x1, y1, x2, y2) { return Math.sqrt(dist2(x1, y1, x2, y2)); }
function approach(v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t * t; }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function pulse(t, speed) { return 0.5 + 0.5 * Math.sin(t * (speed || 1) * TAU); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = randInt(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
/* shortest distance from a point to a line segment */
function segDist(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 === 0 ? 0 : clamp(((px - x1) * dx + (py - y1) * dy) / len2, 0, 1);
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function fmt(n) { n = Math.floor(n); return n >= 1000 ? n.toLocaleString('en-US') : String(n); }
function pad2(n) { return (n < 10 ? '0' : '') + Math.floor(n); }
function mmss(sec) { sec = Math.max(0, sec); return Math.floor(sec / 60) + ':' + pad2(sec % 60); }

/* ------------------------------------------------------------ 2. STORAGE */
/* Memory-first store; localStorage is a best-effort mirror only, so the game
   stays fully playable inside sandboxed webviews and private-mode browsers. */
var Store = (function () {
  var memory = {};
  var usable = false;
  try {
    var k = '__md_probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    usable = true;
  } catch (e) { usable = false; }
  return {
    available: function () { return usable; },
    read: function (key) {
      if (key in memory) return memory[key];
      if (usable) { try { return window.localStorage.getItem(key); } catch (e) {} }
      return null;
    },
    write: function (key, value) {
      memory[key] = value;
      if (usable) { try { window.localStorage.setItem(key, value); } catch (e) {} }
    }
  };
})();

/* ------------------------------------------------------- 3. PLAYER PROFILE */
var Profile = {
  data: null,
  blank: function () {
    return {
      v: 1,
      mitzvahPoints: 0,
      badges: {},
      cardsSeen: {},
      high: { menorah: 0, shul: 0, kosher: 0, kitchen: 0, matzah: 0, tzedaka: 0 },
      /* the furthest chapter you have unlocked in each game - finish one and
         the next opens, so you never have to walk the whole run again */
      reached: { menorah: 1, tzedaka: 1, matzah: 1, shul: 1, kosher: 1, kitchen: 1 },
      best: { nights: 0, blocks: 0, streak: 0, crossings: 0, sliced: 0 },
      plays: 0,
      opts: { sound: true, music: true, haptics: true },
      /* web / Fourthwall / GitHub: kitchen fish+dairy follows this pick.
         Mitz Mode injects window.MITZ_NUSACH and locks the picker.
         window.MITZ_LANG locks the games to the app UI language. */
      nusach: 'ashkenaz',
      lang: 'en',
      /* set the first time Night 8 turns into Jelly-Zilla, so the intro can
         offer a skip back to the fake gift without replaying the half hour */
      jellyZilla: false
    };
  },
  load: function () {
    var raw = Store.read(CFG.SAVE_KEY);
    var d = null;
    if (raw) { try { d = JSON.parse(raw); } catch (e) { d = null; } }
    var base = Profile.blank();
    if (d && typeof d === 'object') {
      base.mitzvahPoints = d.mitzvahPoints | 0;
      if (d.badges) base.badges = d.badges;
      if (d.cardsSeen) base.cardsSeen = d.cardsSeen;
      if (d.high) for (var k in base.high) if (d.high[k] != null) base.high[k] = d.high[k] | 0;
      if (d.reached) for (var rk in base.reached) if (d.reached[rk] != null) base.reached[rk] = Math.max(1, d.reached[rk] | 0);
      if (d.best) for (var b in base.best) if (d.best[b] != null) base.best[b] = d.best[b] | 0;
      base.plays = d.plays | 0;
      if (d.opts) {
        base.opts.sound = d.opts.sound !== false;
        base.opts.music = d.opts.music !== false;
        base.opts.haptics = d.opts.haptics !== false;
      }
      if (d.nusach) base.nusach = d.nusach;
      if (d.lang) base.lang = d.lang === 'he' ? 'he' : 'en';
      if (d.jellyZilla) base.jellyZilla = true;
      if (d.badges && d.badges.b_boss) base.jellyZilla = true;
    }
    Profile.data = base;
    return base;
  },
  save: function () { try { Store.write(CFG.SAVE_KEY, JSON.stringify(Profile.data)); } catch (e) {} },
  addPoints: function (n) { Profile.data.mitzvahPoints += Math.max(0, Math.floor(n)); Profile.save(); },
  reached: function (game) {
    var r = Profile.data && Profile.data.reached;
    return Math.max(1, (r && r[game]) | 0);
  },
  /* finishing chapter n opens n+1, and nothing ever closes again */
  unlockLevel: function (game, n) {
    if (!Profile.data.reached) Profile.data.reached = {};
    var was = Profile.reached(game);
    if (n <= was) return false;
    Profile.data.reached[game] = n;
    Profile.save();
    return true;
  },
  hasBadge: function (id) { return !!Profile.data.badges[id]; },
  unlockBadge: function (id) {
    if (!id || Profile.data.badges[id]) return false;
    Profile.data.badges[id] = Date.now();
    Profile.save();
    return true;
  },
  badgeCount: function () { var n = 0; for (var k in Profile.data.badges) n++; return n; },
  seeCard: function (id) {
    if (Profile.data.cardsSeen[id]) return false;
    Profile.data.cardsSeen[id] = true;
    Profile.save();
    return true;
  },
  cardSeenCount: function () { var n = 0; for (var k in Profile.data.cardsSeen) n++; return n; },
  submitScore: function (gameId, score) {
    var d = Profile.data.high;
    if (d[gameId] === undefined) d[gameId] = 0;
    var isBest = score > d[gameId];
    if (isBest) d[gameId] = Math.floor(score);
    Profile.data.plays++;
    Profile.save();
    return isBest;
  },
  noteBest: function (key, value) {
    if (value > (Profile.data.best[key] || 0)) { Profile.data.best[key] = Math.floor(value); Profile.save(); }
  },
  sawJellyZilla: function () {
    return !!(Profile.data && (Profile.data.jellyZilla || (Profile.data.badges && Profile.data.badges.b_boss)));
  },
  markJellyZilla: function () {
    if (!Profile.data || Profile.data.jellyZilla) return false;
    Profile.data.jellyZilla = true;
    Profile.save();
    return true;
  }
};

/* ---------------------------------------------- 3a. LANGUAGE (en + he) */
/* Every user-facing string goes through Lang.t. English is the key.
   Write the Hebrew yourself - the way a kid in the game would hear it.
   Never machine-translate, never paste a dictionary line. If you cannot
   hear it out loud in the kitchen, rewrite it. Add both sides together. */
var Lang = {
  lockedFromHost: false,
  parse: function (v) { return v === 'he' ? 'he' : 'en'; },
  parseHost: function (v) {
    if (v == null || v === '') return '';
    var s = String(v).trim().toLowerCase().replace(/_/g, '-');
    if (s === 'he' || s === 'iw' || s.indexOf('he-') === 0 || s.indexOf('iw-') === 0) return 'he';
    return 'en';
  },
  id: function () { return Lang.parse(Profile.data && Profile.data.lang); },
  rtl: function () { return Lang.id() === 'he'; },
  locked: function () { return !!Lang.lockedFromHost; },
  hasHe: function (s) { return /[\u0590-\u05FF]/.test(String(s || '')); },
  apply: function (id) {
    id = Lang.parse(id);
    if (Profile.data) { Profile.data.lang = id; Profile.save(); }
    try { document.documentElement.lang = id === 'he' ? 'he' : 'en'; } catch (e) {}
    return id;
  },
  set: function (id) {
    if (Lang.lockedFromHost && window.MITZ_MODE === true) return Lang.id();
    return Lang.apply(id);
  },
  boot: function () {
    var fromHost = Lang.parseHost(window.MITZ_LANG);
    if (window.MITZ_MODE === true && fromHost) {
      Lang.lockedFromHost = true;
      Lang.apply(fromHost);
      return fromHost;
    }
    Lang.lockedFromHost = false;
    return Lang.apply(Lang.id());
  },
  t: function (s) {
    if (s == null || s === '') return s;
    s = String(s);
    if (Lang.id() !== 'he') return s;
    if (Lang.he[s] != null) return Lang.he[s];
    var m = /^BEST\s+(.*)$/.exec(s);
    if (m) return 'שיא  ' + m[1];
    m = /^x(\d+) COMBO$/.exec(s);
    if (m) return 'x' + m[1] + ' רצף';
    m = /^NIGHT (\d+)$/.exec(s);
    if (m) return 'לילה ' + m[1];
    m = /^SHIFT (\d+)$/.exec(s);
    if (m) return 'משמרת ' + m[1];
    m = /^ROUTE (\d+)$/.exec(s);
    if (m) return 'מסלול ' + m[1];
    m = /^STREET (\d+)$/.exec(s);
    if (m) return 'רחוב ' + m[1];
    m = /^(SHIFT|NIGHT|WALK|ROUTE|STREET)S  -  (\d+) OF (\d+) OPEN$/.exec(s);
    if (m) {
      var words = { SHIFT: 'משמרות', NIGHT: 'לילות', WALK: 'הליכות', ROUTE: 'מסלולים', STREET: 'רחובות' };
      return words[m[1]] + '  -  ' + m[2] + ' מתוך ' + m[3] + ' פתוחים';
    }
    m = /^(\d+) of (\d+) still burning - the mitzvah was kept\.$/.exec(s);
    if (m) return m[1] + ' מתוך ' + m[2] + ' עדיין דולקים - המצווה התקיימה.';
    m = /^(\d+)\/(\d+) badges$/.exec(s);
    if (m) return m[1] + '/' + m[2] + ' אותות';
    m = /^(\d+) \/ (\d+) badges/.exec(s);
    if (m) return m[1] + ' / ' + m[2] + ' אותות' + s.slice(m[0].length);
    m = /^(.*) MP$/.exec(s);
    if (m) return m[1] + ' נק״מ';
    m = /^Badge unlocked: (.*)$/.exec(s);
    if (m) return 'אות חדש: ' + Lang.t(m[1]);
    m = /^napkin combo x(\d+)$/.exec(s);
    if (m) return 'רצף מפיות x' + m[1];
    m = /^NAPKIN FRENZY x2\s+([\d.]+)s$/.exec(s);
    if (m) return 'טירוף מפיות x2  ' + m[1] + 'ש׳';
    m = /^MEHADRIN STREAK x(\d+)\s+\+(\d+)$/.exec(s);
    if (m) return 'רצף מהדרין x' + m[1] + '  +' + m[2];
    m = /^NIGHT (\d+) UNLOCKED$/.exec(s);
    if (m) return 'לילה ' + m[1] + ' נפתח';
    m = /^SHIFT (\d+) UNLOCKED$/.exec(s);
    if (m) return 'משמרת ' + m[1] + ' נפתחה';
    m = /^ROUTE (\d+) UNLOCKED$/.exec(s);
    if (m) return 'מסלול ' + m[1] + ' נפתח';
    m = /^STREET (\d+) UNLOCKED$/.exec(s);
    if (m) return 'רחוב ' + m[1] + ' נפתח';
    m = /^Night (\d+)\s+\+(\d+)$/.exec(s);
    if (m) return 'לילה ' + m[1] + '  +' + m[2];
    m = /^SHIFT (\d+)\s+\+(\d+)$/.exec(s);
    if (m) return 'משמרת ' + m[1] + '  +' + m[2];
    m = /^YOU MADE IT!\s+\+(\d+)$/.exec(s);
    if (m) return 'הגעתם!  +' + m[1];
    m = /^DELIVERED!\s+\+(\d+)$/.exec(s);
    if (m) return 'המשלוח הגיע!  +' + m[1];
    m = /^Finish one and the next opens\. Tap any open (\w+) to start there\.$/.exec(s);
    if (m) {
      var chap = { night: 'לילה', shift: 'משמרת', walk: 'הליכה', route: 'מסלול', street: 'רחוב' };
      return 'סיימתם אחד - הבא נפתח. לחצו על ' + (chap[m[1]] || m[1]) + ' פתוח כדי להתחיל משם.';
    }
    m = /^Wrong way - swipe (.*)$/.exec(s);
    if (m) return 'הכיוון ההפוך - החליקו ' + Lang.t(m[1]);
    m = / \(session save only\)$/.exec(s);
    if (m) return s.slice(0, m.index) + '  (נשמר רק בסשן הזה)';
    m = /^(KOSHER L'MEHADRIN|KOSHER|ME'IKKAR HADIN|NOT FULFILLED) - (.*)$/.exec(s);
    if (m) return Lang.t(m[1]) + ' - ' + Lang.t(m[2]);
    m = /^Total  (.+) MP  •  (.+)$/.exec(s);
    if (m) return 'סה״כ  ' + m[1] + ' נק״מ  •  ' + Lang.t(m[2]);
    m = /^Mitzvah Multiplier x([\d.]+)$/.exec(s);
    if (m) return 'מכפיל מצווה x' + m[1];
    m = /^FIRE OUT \+(\d+)$/.exec(s);
    if (m) return 'האש כבתה +' + m[1];
    m = /^STREET COMPLETE \+(\d+)$/.exec(s);
    if (m) return 'הרחוב הושלם +' + m[1];
    return s;
  },
  he: {
    'MITZVAH': 'מצווה',
    'DASH': 'דאש',
    'Six arcade minigames. Real halacha.': 'שש משחקים. הלכה אמיתית.',
    'Seven arcade minigames. Real halacha.': 'שבע משחקים. הלכה אמיתית.',
    'Eight arcade minigames. Real halacha.': 'שמונה משחקים. הלכה אמיתית.',
    'Camp Kosh': 'קעמפ כשר',
    'Feed the boys, keep it kosher': 'תאכיל את הבחורים, תשמור על כשרות',

    'BACK TO MENU': 'לתפריט',
    'PAUSED': 'הפסקה',
    'RESUME': 'המשך',

    'SOUND': 'קול',

    'Menorah Keeper': 'שומר המנורה',
    'Chanukah survival': 'חנוכה',
    'Shul Crossing': 'לבית הכנסת',
    'Twelve-walk dash': 'שלושים הליכות',
    'Thirty-walk dash': 'שלושים הליכות',
    'Kosher Sort': 'כשרות',
    'Dual-belt dash': 'שתי מסועות',
    'Kitchen Match': 'במטבח',
    'Make a kosher plate': 'צלחת כשרה',

    'Matzah Delivery Havoc': 'משלוח מצה',

    'Tefillah & Zmanim': 'תפילה וזמנים',
    'Kashrus': 'כשרות',
    'Pesach': 'פסח',
    'Tzedakah': 'צדקה',
    'General': 'כללי',
    'Ashkenaz': 'אשכנז',
    'Sefard': 'ספרד',
    'Edot Hamizrach': 'עדות המזרח',
    'Chabad': 'חב״ד',
    'Halacha cards appear as you progress.': 'כרטיס הלכה בסוף כל שלב.',
    'When you say the first line of Shema - Hear Israel, Hashem is our God, Hashem is One - lots of kids (and grown-ups) cover their eyes with a hand. It shuts out the room for a second so you can really mean the words. The mitzvah is saying Shema with your heart in it. Covering your eyes is the trick that helps you get there.': 'כשאומרים את השורה הראשונה של שמע - שמע ישראל, ה׳ אלוקינו, ה׳ אחד - הרבה ילדים (וגם גדולים) מכסים את העיניים ביד. זה סוגר את החדר לשנייה כדי באמת להתכוון למילים. המצווה היא לומר שמע עם הלב. כיסוי העיניים הוא הטריק שעוזר להגיע לשם.',
    'The best time for Shacharis Shemoneh Esrei is by the end of the fourth hour of the day. If you missed that, you can still daven until chatzos - midday. After midday it is a makeup, not the morning tefillah. And "hour" here is not sixty minutes: you take the daylight and chop it into twelve equal pieces, so the deadline moves all year. Families also argue about when that clock STARTS - sunrise, or a bit earlier at dawn - so two shuls on the same street can post different times. Follow yours.': 'לכתחילה אומרים שמונה עשרה של שחרית עד סוף השעה הרביעית של היום. מי שפספס עדיין יכול להתפלל עד חצות. אחרי חצות זו תשלומין, לא תפילת הבוקר. ו״שעה״ כאן אינה שישים דקות: מחלקים את האור לשניים-עשר חלקים שווים, והזמן זז כל השנה. משפחות גם חולקות מתי השעון מתחיל - בזריחה, או קצת קודם בשחר - אז שני בתי כנסת באותו רחוב יכולים לפרסם זמנים שונים. לכו לפי שלכם.',
    'the ideal last time for morning Shemoneh Esrei': 'הזמן האידיאלי האחרון לשמונה עשרה של שחרית',
    '"Hear Israel" - the first line of Shema': '״שמע ישראל״ - השורה הראשונה של שמע',

    'Beef is fleishig - swipe LEFT to the meat bin.': 'בקר זה בשרי. שמאלה.',

    'Fruit is pareve - swipe DOWN.': 'פרי זה פרווה. למטה.',

    'Fish with fins and scales is pareve - swipe DOWN.': 'דג עם סנפיר וקשקשת זה פרווה. למטה.',
    'Pareve bread goes DOWN to the pareve bin.': 'לחם פרווה. למטה.',
    'Oil is pareve - swipe DOWN.': 'שמן זה פרווה. למטה.',
    'Basar b’chalav! Flick it UP to the disposal chute.': 'בשר בחלב! למעלה, לפח.',
    'Meat on a cheese pizza is a forbidden mixture - flick UP.': 'פיצה עם בשר וגבינה? למעלה.',
    'Meat baked together with cheese - flick UP. A pareve meat lasagna would be fine; this one is not.': 'לזניה עם בשר וגבינה - למעלה. בלי גבינה הייתה בסדר.',
    'No fins, no scales - never kosher. Flick UP.': 'בלי סנפיר ובלי קשקשת - לא כשר. למעלה.',
    'Shellfish are not kosher - flick UP.': 'פירות ים לא כשרים. למעלה.',
    'A pig has split hooves but does not chew its cud - flick UP.': 'חזיר? פרסה שסועה, לא מעלה גרה. למעלה.',
    'Insects are forbidden - flick UP.': 'חרק - אסור. למעלה.',
    'No reliable certification - flick UP.': 'בלי הכשר. למעלה.',
    'A beef taco with no cheese is fleishig - swipe LEFT.': 'טאקו בקר בלי גבינה זה בשרי. שמאלה.',
    'Salt is pareve - swipe DOWN.': 'מלח זה פרווה. למטה.',
    'A milk-chocolate truffle is milchig - swipe RIGHT.': 'טראפל שוקולד חלב זה חלבי. ימינה.',
    'Starfruit is pareve - swipe DOWN.': 'קרמבולה זה פרווה. למטה.',
    'Mango is pareve - swipe DOWN.': 'מנגו זה פרווה. למטה.',
    'Falafel is pareve - swipe DOWN.': 'פלאפל זה פרווה. למטה.',
    'Every light has its own little oil jug right underneath it. Tap the jug (or the light) to top it up.': 'לכל נר יש פך שמן מתחת. לחצו על הפך ומלאו.',
    'A gust blowing in? Swipe ACROSS THE FLAMES against it and the window slams shut. Wind that gets in drinks the oil and leaves a flame SPUTTERING - pour fresh oil in fast or it dies on its own.': 'רוח? החליקו על הלהבות נגדה, והחלון נסגר. אם היא נכנסת היא שותה את השמן והנר רועד - תמזגו מהר, או שהוא כבה לבד.',
    'Wipe sufganiyah jelly off the glass. Three blobs over one light and it drips down and drowns the flame. Swipe flying latkes off fast too, or the glass cracks and that light is finished.': 'נגבו ריבה של סופגנייה מהזכוכית. שלוש טיפות על נר אחד - והן מטפטפות ומכבות. גם לביבה מעופפת, תעיפו אותה מהר, או שהכוס נסדקת והנר נגמר.',
    'A dark light can only be relit from the shamash - the helper candle that does the lighting. TAP it to pick it up, drag it onto the dark wick and hold. Fill the cup first: a flame will not catch on a dry wick.': 'נר כבוי מדליקים רק מהשמש. לחצו עליו, גררו לפתיל הכבוי והחזיקו. קודם תמלאו שמן: על פתיל יבש זה לא נתפס.',
    'Tap to hop forward. Swipe left, right or down to switch lanes.': 'לחצו כדי לקפוץ קדימה. החליקו שמאלה, ימינה או אחורה.',
    'Land on a KOSHER FOOD truck and ride it. A NOT KOSHER truck flattens you. Read the label!': 'משאית אוכל כשר - תעלו. לא כשר - דורסת. תסתכלו על הכתוב!',
    'Hop onto walkers on a minyan row. Miss the gap and they bump you back - no life lost.': 'בשורת מניין תקפצו על מישהו. פספסתם? דוחפים אחורה. לא יורדים חיים.',
    'Stalls and cones block a square. Pushkas on the grass are free points. Keep the hat dry.': 'דוכן או קונוס חוסמים משבצת. קופה על הדשא זה נקודות. שהכובע יישאר יבש.',
    'Swipe LEFT for meat (fleishig), RIGHT for dairy (milchig), DOWN for pareve - food that is neither one nor the other.': 'שמאלה בשרי, ימינה חלבי, למטה פרווה.',
    'Anything that mixes meat and milk together - basar b’chalav - or is not kosher at all gets flicked UP into the chute.': 'בשר וחלב ביחד, או משהו לא כשר - למעלה, לפח.',
    'Some dishes turn up hidden under a lid. TAP to lift it, because you cannot decide about food you cannot see. A dish that reaches the end still covered counts as a strike.': 'יש מנות תחת מכסה. לחצו להרים - אי אפשר להחליט על מה שלא רואים. אם זה מגיע לסוף מכוסה, זה פסילה.',
    'Nothing may fall off the end of the belt unsorted. When the KASHRUS RUSH starts the belts speed right up and every call is worth double.': 'כלום לא נופל מסוף המסוע בלי מיון. כשהכל מאיץ - כל אחד שווה כפול.',
    'DRAG a dish onto a neighbour to swap. Or tap one, then the next. Three that can share a plate vanish.': 'גררו מנה על השכנה. או לחצו אחת ואז את השנייה. שלוש שיכולות לחלוק צלחת נעלמות.',
    'Pareve can sit with meat or dairy. Meat and milk never plate together.': 'פרווה יכולה לשבת עם בשרי או חלבי. בשר וחלב לא עולים יחד לצלחת.',
    'Fish matches fish, never meat. Flick UP treif or mixed. TAP a lid first.': 'דג עם דג, לא עם בשר. טרף או תערובת - למעלה. קודם המכסה.',
    'Hit the red top shelf and the kitchen overloads - a life gone. Twelve kitchens, each one stays open once you finish it.': 'המדף האדום למעלה התמלא? יורדים חיים. שנים עשר מטבחים, וכל אחד נשאר פתוח אחרי שסיימתם.',
    'Steer with the slider (or grab the truck). Slash flying bread with your other hand.': 'ההגה למטה (או תפסו את המשאית). ביד השנייה חתכו לחם שעף.',
    'Bread that rose is chametz - it cannot touch the shemura cargo.': 'לחם שתפח זה חמץ. אסור שייגע במצה השמורה.',
    'Tap yeast clouds to blow them away. Grab the golden Afikoman for a shield.': 'לחצו על ענן שמרים ופזרו אותו. האפיקומן הזהוב זה מגן.',
    'Twelve routes. Finish one and the next stays open. Each street is a new job.': 'שנים עשר מסלולים. סיימתם אחד - הבא פתוח. כל רחוב זו עבודה חדשה.',
    'Pull BACK like a slingshot. Drag sideways from the window to aim - it stays.': 'משכו אחורה כמו גומי. הצידה מהחלון זה הכוונת - זה נשאר.',
    'Pull UP for a hard drop. Pull DOWN to lob the coin up in the air.': 'למעלה זה נפילה חזקה. למטה זורקים את המטבע לאוויר.',
    'Fancy coat + no hand out = he already ate. Save it for an open palm!': 'מעיל יפה בלי יד פתוחה? הוא כבר אכל. שמרו לכף פתוחה.',
    'People walk. Throw where he is GOING, not where he is.': 'אנשים הולכים. זרקו לאן שהוא הולך, לא איפה שהוא עכשיו.',
    'Toss too fast and you overheat. Chill a sec and the bar climbs back.': 'מהר מדי - מתחמם. חכו רגע, והמחוון עולה בחזרה.',

    'Here is the deal with Chanukah lights: they have a job to do, and the job takes half an hour. So before you light, put in enough oil (or use a long enough candle) to burn for a full half hour after dark. Light a stubby little candle that fizzles out in ten minutes and you have not done the mitzvah - even if you lit at exactly the right second.': 'לנרות חנוכה יש עבודה, והעבודה לוקחת חצי שעה. לפני שמדליקים שמים מספיק שמן (או נר ארוך) שידלק חצי שעה אחרי החשיכה. נר קטן שכבה אחרי עשר דקות? לא קיימתם את המצווה - גם אם הדלקתם בדיוק בזמן.',
    'Surprising one: the mitzvah happens at the moment you light. If you lit properly - good oil, enough of it, in a safe spot where it could have burned the whole half hour - then you are done. Finished. If the flame later blows out on its own, you are not obligated to relight it. The Mishnah Berurah says it is a lovely thing to relight anyway (no new bracha), just to keep the miracle on show. Lovely, not required.': 'הפתעה: המצווה קורה ברגע ההדלקה. הדלקתם כמו שצריך - שמן טוב, מספיק ממנו, במקום בטוח שיכול לדלוק חצי שעה - סיימתם. אם אחר כך כבה לבד, אין חובה להדליק שוב. המשנה ברורה אומרת שזה יפה להדליק בכל זאת (בלי ברכה חדשה), כדי שהנס יישאר נראה. יפה, לא חובה.',
    'You may not light somewhere the wind is definitely going to blow it out. And this is not "oops, try again" - the lighting does not count at all, because it was never a light that had a chance. That is the whole reason outdoor menorahs live inside a glass box.': 'אסור להדליק במקום שהרוח בטוח תכבה. וזה לא ״אופס, ננסה שוב״ - ההדלקה לא נחשבת בכלל, כי זה אף פעם לא היה נר שהיה לו סיכוי. לכן מנורה בחוץ יושבת בקופסת זכוכית.',
    'Any oil works. Any wick works. Wax candles work. But olive oil is the champion, because the miracle in the Beis HaMikdash happened with one little sealed jug of pure olive oil - so when you use it, you are using the same stuff the story is about.': 'כל שמן עובד. כל פתיל עובד. נרות שעווה עובדים. אבל שמן זית זה האלוף, כי הנס בבית המקדש היה עם פך קטן חתום של שמן זית טהור - אז כשמשתמשים בו, זה אותו דבר שהסיפור מדבר עליו.',
    'The lights are not decoration and they are not for you - they are an announcement. That is why they go by the doorway or in a window facing the street, low enough that somebody walking past actually notices and thinks: something happened here.': 'הנרות לא לקישוט ולא בשבילכם - הם הודעה. לכן שמים ליד הדלת או בחלון לרחוב, מספיק נמוך שמי שעובר באמת ישים לב ויחשוב: משהו קרה פה.',
    'There was a real argument about this. Beis Shammai said start with eight and count down. Beis Hillel said start with one and add one every night, because when it comes to holy things you go UP, you do not go down. Beis Hillel won - which is why night eight is the big one.': 'היתה מחלוקת אמיתית. בית שמאי אמרו להתחיל משמונה ולרדת. בית הלל אמרו להתחיל מאחד ולהוסיף כל לילה, כי בקדושה עולים, לא יורדים. בית הלל ניצחו - לכן לילה שמונה זה הגדול.',
    'Strictly speaking? A single light per household, per night. That is the whole mitzvah, done. Then people started making it more beautiful: one light for every person in the house. Then even more beautiful: adding one every night. That last version is what nearly everybody does now - but the basic rule underneath is still one single flame.': 'מעיקר הדין? נר אחד למשפחה, ללילה. זו כל המצווה. אחר כך התחילו לייפות: נר לכל אחד בבית. ואחר כך עוד יותר יפה: מוסיפים אחד כל לילה. ככה כמעט כולם עושים עכשיו - אבל מתחת לכל זה עדיין נר אחד.',
    'The lights need a spot where they can burn quietly for their whole half hour without anyone knocking them, spilling them or setting the tablecloth on fire. Glass holders, away from the edge, away from flying elbows. A menorah you had to rescue halfway through was never set up right in the first place.': 'הנרות צריכים מקום שידלקו בשקט חצי שעה בלי שיפילו אותם, ישפכו או ידליקו את המפה. מעמדי זכוכית, רחוק מהקצה, רחוק ממרפקים. מנורה שהייתם צריכים להציל באמצע - לא הונחה כמו שצריך מההתחלה.',
    'When the Chashmonaim finally took the Beis HaMikdash back, the place was wrecked. They dug through the mess looking for oil and found exactly one small jug still sealed with the seal of the Kohen Gadol - untouched. Enough for one day. It burned for eight. The next year, those eight days became Chanukah.': 'כשהחשמונאים החזירו את בית המקדש, המקום היה הרוס. חיפשו שמן ומצאו פך אחד קטן חתום בחותם של הכהן הגדול - לא נגע בו. מספיק ליום אחד. הוא דלק שמונה. בשנה שאחרי זה, שמונת הימים האלה נהיו חנוכה.',
    'Can you light one Chanukah candle straight off another one? The Shulchan Aruch says yes - but not by lighting a stick first and carrying the flame over on that. The Rema records the custom to just avoid the whole question. Which is exactly what the shamash is for: it is the flame you carry from wick to wick.': 'אפשר להדליק נר חנוכה מנר חנוכה? השולחן ערוך אומר כן - אבל לא על ידי קיסם שמעבירים איתו. הרמ״א כותב את המנהג פשוט לא להיכנס לשאלה. בשביל זה יש שמש: זו האש שמעבירים מפתיל לפתיל.',
    'Light at nightfall (some families light right at sunset), and do not start a meal or get stuck into something in the half hour before - you will forget. Erev Shabbos (Friday afternoon) is different: we light BEFORE the Shabbos candles and before sunset, because you cannot light once Shabbos has started. And since the lights still have to last half an hour past nightfall, Friday needs extra oil.': 'מדליקים עם חשיכה (יש שמדליקים בשקיעה), ואל תתחילו ארוחה או משהו בחצי השעה שלפני - תשכחו. ערב שבת זה אחרת: מדליקים לפני נרות שבת ולפני השקיעה, כי אחרי כניסת שבת אי אפשר להדליק. והנרות עדיין צריכים לדלוק חצי שעה אחרי צאת הכוכבים, אז בשישי שמים יותר שמן.',
    'One extra candle sits off to the side, usually a bit higher. Why? Because you are not allowed to USE the Chanukah lights for anything - not to read by, not to find your shoe, not to count your gelt. So the shamash stands there and says: whatever light you just used, you used mine. Its name literally means "servant".': 'נר נוסף בצד, בדרך כלל קצת יותר גבוה. למה? אסור להשתמש בנרות חנוכה לכלום - לא לקרוא, לא לחפש נעל, לא לספור דמי חנוכה. השמש עומד ואומר: האור שהשתמשתם בו עכשיו היה שלי. השם שלו ממש אומר ״משרת״.',
    'People who are keen do a mitzvah at the FIRST chance, not the last one. Leaving for shul early is not just being sensible about the clock - the eagerness is itself part of how the mitzvah is supposed to be done.': 'מי שזריז עושה מצווה בהזדמנות הראשונה, לא באחרונה. לצאת מוקדם לבית הכנסת זה לא רק חכם עם השעון - הזריזות עצמה היא חלק מהמצווה.',
    'The Gemara says: hurry on the way TO shul, but walk home calmly. Why? Because if you sprint out afterwards it looks like you could not wait to escape. Running toward something says you wanted to be there.': 'הגמרא אומרת: ממהרים בדרך אל בית הכנסת, ובחזרה הולכים רגוע. למה? אם רצים החוצה אחר כך נראה שלא יכולתם לחכות לברוח. לרוץ אל משהו אומר שרציתם להיות שם.',
    'Living far from shul is not bad luck - the Gemara counts the steps. Each one on the way to a mitzvah gets its own reward. So the long way round is worth more, not less.': 'לגור רחוק מבית הכנסת זה לא חוסר מזל - הגמרא סופרת את הצעדים. כל אחד בדרך למצווה מקבל שכר. אז הדרך הארוכה שווה יותר, לא פחות.',
    'Hashem never turns away the prayer of a whole community. So try hard to daven with a minyan - and to daven in the same regular spot, rather than wherever you happen to land.': 'השם לא מחזיר תפילה של ציבור. אז תשתדלו להתפלל במניין - ובאותו מקום קבוע, לא איפה שנחתתם.',
    'Shabbos is supposed to look different from Tuesday - nicer clothes, not the same old weekday outfit. A hat you keep looking sharp for shul is how lots of families do that honour. It is not a rule that every Jew must own a hat worn only on Shabbos. Still: turning up with a soaking wet hat is a sloppy look for the day. Watch the sprinklers.': 'שבת אמורה להיראות אחרת מיום שלישי - בגדים יותר יפים, לא אותה חול. כובע שמורים יפה לבית הכנסת זה איך הרבה משפחות עושות את הכבוד. זה לא כלל שכל יהודי חייב כובע רק לשבת. ובכל זאת: להגיע עם כובע ספוג זה מראה מרושל ליום. שימו לב לממטרות.',
    'Meat and milk together is not one rule, it is three. You may not COOK them together. You may not EAT the mixture. And you may not get any BENEFIT from it at all - you cannot sell it, and you cannot even give it to your dog.': 'בשר וחלב זה לא כלל אחד, זה שלושה. אסור לבשל ביחד. אסור לאכול את התערובת. ואסור ליהנות מזה בכלל - אי אפשר למכור, ואי אפשר אפילו לתת לכלב.',
    '"Do not cook a kid in its mother\'s milk" shows up three separate times in the Torah. The Sages asked the obvious question - why three? - and answered: one for cooking, one for eating, one for benefit. Nothing in the Torah is repeated for no reason.': '״לא תבשל גדי בחלב אמו״ מופיע שלוש פעמים בתורה. חכמים שאלו את השאלה הברורה - למה שלוש? - וענו: אחת לבישול, אחת לאכילה, אחת להנאה. כלום בתורה לא חוזר סתם.',
    'Eggs, fruit, vegetables and grains are neither meat nor milk. They are pareve, which means they can go with either side. Fish is pareve too, but it has extra rules: nobody eats fish and meat on the same plate. Fish with dairy depends on your family - lots of Ashkenazim do, Sephardim usually do not, and Chabad skip fish with milk. Ask at home.': 'ביצים, פרי, ירק ודגן הם לא בשר ולא חלב. הם פרווה - יכולים לשבת עם כל צד. דג גם פרווה, אבל יש לו כללים נוספים: אף אחד לא אוכל דג ובשר באותה צלחת. דג עם חלבי תלוי במשפחה - הרבה אשכנזים כן, ספרדים בדרך כלל לא, ובחב״ד מדלגים על דג עם חלב. תשאל בבית.',
    'After meat you wait before having anything dairy. Six hours is the most common custom; some families wait three, some one - it depends where your family is from, so ask. Going the other way (milk then meat) is much quicker. And hard cheese is the exception: many treat it like meat and wait the full time.': 'אחרי בשר מחכים לפני חלבי. שש שעות זה המנהג הכי נפוץ; יש משפחות שמחכות שלוש, יש שעה - תלוי מאיפה המשפחה, תשאל. הפוך (חלב ואז בשר) הרבה יותר מהר. וגבינה קשה היא החריג: הרבה מתייחסים אליה כמו בשר ומחכים את כל הזמן.',
    'A fish is kosher only if it has BOTH fins and scales. Shrimp, lobster, crab, squid and octopus have neither, so no cooking trick in the world makes them kosher. Salmon and tuna have both. Easy test.': 'דג כשר רק אם יש לו גם סנפיר וגם קשקשת. שרימפס, לובסטר, סרטן, דיונון ותמנון אין להם כלום, אז אין טריק בישול בעולם שהופך אותם לכשרים. לסלמון ולטונה יש שניהם. בדיקה פשוטה.',
    'A kosher land animal must chew its cud AND have fully split hooves. Both. The pig is the famous trap: split hooves, ticks one box, looks kosher from underneath - but it does not chew its cud, so it is not. One sign is never enough.': 'חיה כשרה חייבת להעלות גרה וגם פרסה שסועה לגמרי. שניהם. החזיר הוא המלכודת המפורסמת: פרסה שסועה, נראה כשר מלמטה - אבל לא מעלה גרה, אז לא. סימן אחד אף פעם לא מספיק.',
    'On a factory snack, reading the ingredients is often not enough. What machine was it made on? What was made on that machine yesterday? What is hiding inside the word "flavouring"? A hechsher is somebody whose job is to go and actually look. Food from a kosher kitchen at home does not need a stamp on the bowl.': 'על חטיף מהמפעל, לקרוא רכיבים לעתים קרובות לא מספיק. על איזו מכונה זה נעשה? מה עשו עליה אתמול? מה מתחבא בתוך המילה ״טעם״? הכשר זה מישהו שהעבודה שלו היא ללכת באמת לראות. אוכל ממטבח כשר בבית לא צריך חותמת על הקערה.',
    'Swallowing one tiny bug can break several Torah prohibitions at the same time - which is a lot of trouble for something you did not even taste. That is why leafy greens, berries, and grains get washed and checked, usually against the light.': 'לבלוע חרק קטן יכול לשבור כמה איסורים בבת אחת - הרבה צרות על משהו שלא טעמתם. לכן עלים, פירות יער ודגנים שוטפים ובודקים, בדרך כלל מול האור.',
    'Pots and pans soak up the taste of whatever was cooked in them - invisibly, but really. So meat and dairy get their own pots, plates and cutlery. Lots of kitchens also keep two sinks or two counters - that is extra care, not the basic rule. The must-have is two sets of the things that touch the food.': 'סירים סופגים את הטעם של מה שבישלו בהם - בלי לראות, אבל באמת. אז לבשר ולחלבי יש סירים, צלחות וסכו״ם משלהם. בהרבה מטבחים גם שני כיורים או שני שיש - זה זהירות נוספת, לא הדין הבסיסי. מה שחייבים זה שתי מערכות של מה שנוגע באוכל.',
    'On Erev Pesach the clock runs out in two stages. You may EAT chametz until the end of the fourth halachic hour. You may still own it for one more hour. After that it has to be gone - burned, sold or destroyed. Your shul publishes the exact minutes every year, because they move.': 'בערב פסח השעון נגמר בשני שלבים. אפשר לאכול חמץ עד סוף השעה הרביעית. אפשר עוד להחזיק אותו שעה נוספת. אחר כך הוא צריך להיעלם - שרוף, מכור או מחוסל. בית הכנסת מפרסם את הדקות כל שנה, כי הן זזות.',
    'The night before Erev Pesach you search the house for chametz - every pocket, every shelf, anywhere a crumb could have travelled during the year. The classic way is by the light of a candle, so you look at one small place at a time. Some families dim the big lights; a flashlight is fine too if that is what you use to see.': 'בלילה לפני ערב פסח מחפשים חמץ בבית - כל כיס, כל מדף, כל מקום שפירור יכול היה לטייל בשנה. הדרך הקלאסית היא לאור נר, כדי להסתכל על מקום קטן כל פעם. יש משפחות שמעמעמות את האורות הגדולים; פנס גם בסדר אם ככה רואים.',
    'After the search - and again after the burning the next morning - you say a declaration: any chametz I did not find is not mine, it is like the dust of the ground. Because the problem on Pesach is not only eating chametz, it is OWNING it. So you stop owning it out loud.': 'אחרי החיפוש - ושוב אחרי הביעור בבוקר - אומרים: כל חמץ שלא מצאתי אינו שלי, הוא כעפר הארץ. כי הבעיה בפסח היא לא רק לאכול חמץ, אלא להחזיק אותו. אז מפסיקים להחזיק אותו בקול.',
    'Flour and water start turning into chametz once dough sits around unworked for the time it takes to walk a mil - which we hold is about eighteen minutes. That is why a matzah bakery is a sprint: mix, roll, bake, then stop everything and scrub every surface before the next batch.': 'קמח ומים מתחילים להיות חמץ כשהבצק יושב בלי עבודה כמה שלוקח ללכת מיל - אצלנו בערך שמונה עשרה דקות. לכן מאפיית מצה זה ספרינט: לשים, לרדד, לאפות, לעצור ולשפשף כל משטח לפני המנה הבאה.',
    'Shemura matzah is watched to keep it away from water - from the moment the wheat is cut, or at the latest from when it is ground. The point is that at no moment along the way could that grain have quietly started rising without anyone noticing.': 'מצה שמורה שומרים מהמים - מרגע שקוצרים את החיטה, או לפחות מהטחינה. הנקודה היא שבשום רגע בדרך התבואה לא יכלה להתחיל לתפוח בשקט בלי שאף אחד ישים לב.',
    'On the first night of Pesach there is a Torah obligation to eat a kezayis of matzah at the Seder. Outside Israel we do a second Seder the next night too, and eat matzah then as well. Here is what surprises people: for the rest of Pesach there is no obligation to eat matzah at all. There is only the rule against chametz. You eat matzah the other days because, well, what else is there.': 'בלילה הראשון של פסח יש חיוב מהתורה לאכול כזית מצה בסדר. מחוץ לישראל עושים סדר שני בלילה הבא, ואוכלים מצה גם שם. מה שמפתיע: בשאר פסח אין חיוב לאכול מצה בכלל. יש רק את האיסור על חמץ. אוכלים מצה בשאר הימים כי... מה עוד יש.',
    'If a Jew owned chametz right through Pesach, that chametz stays forbidden forever afterwards. The Sages made this rule as a deterrent - so nobody would think "I will just hide the crates for eight days and sell them on the ninth". Now the crates are worthless. Problem solved.': 'אם יהודי החזיק חמץ כל פסח, החמץ הזה נשאר אסור לעולם. חכמים תיקנו את זה כדי שאף אחד לא יחשוב ״אחביא את הארגזים לשמונה ימים ואמכור בתשיעי״. עכשיו הארגזים שווים אפס. הבעיה נפתרה.',
    'Two separate rules, both about simply HAVING chametz: it must not be seen in your space, and it must not be found there. Every other forbidden food you just do not eat - you can own it all day. Chametz on Pesach is the one where keeping it is itself the problem.': 'שני כללים, שניהם על עצם זה שיש לכם חמץ: אסור שיראו אותו אצלכם, ואסור שימצאו אותו. כל אוכל אסור אחר פשוט לא אוכלים - אפשר להחזיק כל היום. חמץ בפסח הוא היחיד שההחזקה עצמה היא הבעיה.',
    'The Sages had a whole debate: which is greater, learning or doing? They landed on learning - but only for one reason: learning is what leads you to do it right. A game is a small thing. But knowing WHY a mitzvah works the way it does is what makes it stay with you.': 'לחכמים היתה מחלוקת: מה גדול יותר, ללמוד או לעשות? הם נחתו על לימוד - אבל רק בגלל סיבה אחת: הלימוד הוא מה שמוביל לעשות נכון. משחק זה דבר קטן. אבל לדעת למה מצווה עובדת ככה - זה מה שנשאר איתכם.',
    'Ben Azzai said: run to an easy mitzvah the same way you run to a hard one, because one mitzvah pulls the next one along behind it. And do not do it for the prize - the reward for a mitzvah IS the mitzvah.': 'בן עזאי אמר: רצים למצווה קלה כמו לקשה, כי מצווה אחת מושכת את הבאה אחריה. ואל תעשו בשביל הפרס - השכר של מצווה הוא המצווה.',
    'The Torah does not say "give some money". It says open your hand and give him dei machsoro - enough for what HE is missing. Not a fixed amount. What this person is short of. The Gemara pushes it to an extreme: someone who used to be rich and is now embarrassed to walk everywhere might need a horse - so you get him a horse.': 'התורה לא אומרת ״תנו קצת כסף״. היא אומרת לפתוח את היד ולתת די מחסורו - מה שהוא חסר. לא סכום קבוע. מה שחסר לאדם הזה. הגמרא דוחפת לקיצון: מי שהיה עשיר ועכשיו מתבייש ללכת ברגל אולי צריך סוס - אז משיגים לו סוס.',
    'Tzedakah is measured by what it does to the person getting it. A coin that lands in the dirt and has to be picked up in front of a street full of people has taken more from him than it gave. Get it into his hand.': 'צדקה נמדדת במה שהיא עושה למי שמקבל. מטבע שנפל לבוץ וצריך להרים מול רחוב מלא אנשים לקח ממנו יותר ממה שנתן. תכניסו ליד.',
    'Rambam lists eight levels of giving, worst to best. Near the very top: the giver does not know who got it, and the receiver does not know who gave it. In the Beis HaMikdash there was a room for exactly this - the Chamber of Secrets. Quiet people put money in. Poor people from good families took money out. Nobody ever saw anybody.': 'הרמב״ם מונה שמונה מדרגות של נתינה, מהגרוע לטוב. קרוב לראש: הנותן לא יודע מי קיבל, והמקבל לא יודע מי נתן. בבית המקדש היה חדר בדיוק לזה - לשכת חשאים. אנשים שקטים שמו כסף. עניים ממשפחות טובות לקחו. אף אחד לא ראה אף אחד.',
    'You cannot help everybody, so there is an order. Your own poor relatives come before other poor people. The poor of your own city come before the poor of somewhere else. This is not playing favourites - it is the opposite. If everyone is equally your job, then nobody actually is.': 'אי אפשר לעזור לכולם, אז יש סדר. העניים של המשפחה לפני עניים אחרים. עניי העיר לפני עניי מקום אחר. זה לא משחק מועדפים - זה ההפך. אם כולם באותה מידה התפקיד שלכם, אז אף אחד לא באמת.',
    'On Rambam\'s ladder, giving before someone asks ranks higher than giving after. Think about why. By the time a person has put his hand out and said the words, something has already been taken from him - and your money does not give that part back.': 'בסולם של הרמב״ם, לתת לפני שמבקשים זה גבוה יותר מאחרי. תחשבו למה. עד שאדם הוציא יד ואמר את המילים, כבר לקחו ממנו משהו - והכסף שלכם לא מחזיר את החלק הזה.',
    'The highest of the eight levels is not a gift at all. It is a loan, a job, a partnership - a hand under someone\'s arm before he falls. Anything that ends with him not needing to ask again. Giving him money helps today. Giving him work means there is no tomorrow to worry about.': 'המדרגה הכי גבוהה משמונה היא בכלל לא מתנה. זה הלוואה, עבודה, שותפות - יד מתחת לזרוע לפני שנופל. כל דבר שנגמר בזה שהוא לא צריך לבקש שוב. כסף עוזר היום. עבודה אומרת שאין מחר לדאוג ממנו.',
    'A town fund is collected by two people and handed out by three. And its collectors have to be so trustworthy that nobody audits them - just like the Temple treasurers, about whom the verse says they did not check the accounts of the men they gave the money to. Give through an honest gabbai and you reach people you will never meet.': 'קופה של עיר אוספים שניים ומחלקים שלושה. והגבאים צריכים להיות כל כך נאמנים שאף אחד לא בודק אותם - כמו גזברי המקדש, שהפסוק אומר שלא בדקו את החשבון של מי שנתנו להם את הכסף. תנו דרך גבאי ישר ומגיעים לאנשים שלא תפגשו אף פעם.',
    'The Torah never tells a farmer to hand out food. It tells him to leave the corner of his field standing, leave whatever falls while harvesting, leave the sheaf he forgot - and walk away. The poor come and take it themselves. Nobody gives, nobody receives, and nobody has to say thank you.': 'התורה אף פעם לא אומרת לחקלאי לחלק אוכל. היא אומרת להשאיר את פינת השדה, להשאיר מה שנפל בקציר, להשאיר אלומה ששכח - וללכת. העניים באים ולוקחים לבד. אף אחד לא נותן, אף אחד לא מקבל, ואף אחד לא צריך להגיד תודה.',
    'Someone asks and your pockets are genuinely empty. You still do not walk past. Rambam says: settle him with words. And the Gemara counts it up - give a coin and you get six blessings, speak kindly to him and you get eleven. The one thing you may never do is nothing.': 'מישהו מבקש והכיסים באמת ריקים. עדיין לא עוברים ליד. הרמב״ם אומר: פייסו בדברים. והגמרא סופרת - מטבע אחד זה שש ברכות, מילה טובה זה אחת עשרה. הדבר היחיד שאסור זה כלום.',
    'Normally you can look into a claim before handing over money (though never before handing over food). On Purim that stops completely: whoever puts out a hand, you give, no questions asked. Two gifts to two poor people is the actual obligation - and Rambam says this is the better place to spend your Purim money than on the party.': 'רגיל אפשר לבדוק טענה לפני שנותנים כסף (אבל אף פעם לא לפני שנותנים אוכל). בפורים זה נעצר לגמרי: מי שמושיט יד, נותנים, בלי שאלות. שתי מתנות לשני עניים זה החיוב - והרמב״ם אומר שזה המקום הטוב יותר לכסף של פורים מאשר המסיבה.',
    'The usual measure is a tenth of what you earn. A fifth is the generous upper limit for most people - so someone who is giving today does not end up needing to receive tomorrow. Very wealthy people, or someone writing a will, can go past that. Ask if you are not sure.': 'המידה הרגילה היא עשירית ממה שמרוויחים. חומש זה הגבול הנדיב למעלה לרוב האנשים - כדי שמי שנותן היום לא יצטרך לקבל מחר. עשירים מאוד, או מי שכותב צוואה, יכולים לעבור את זה. תשאל אם לא בטוח.',
    'Here is a question worth asking: is tzedaka money for ANYBODY? No. The Torah says achicha ha\'evyon - your brother who is in need. That is who the money is for. The man strolling past in the fine coat with a silver-topped stick is not asking you for anything and is not short of anything, and a coin thrown at him is simply a coin you no longer have for the person who is. How do you tell? Usually you do not have to work very hard: the one who needs it is the one with his hand out.': 'שאלה ששווה לשאול: כסף צדקה זה לכל אחד? לא. התורה אומרת אחיך האביון - האח שצריך. זה למי הכסף. האיש שטייל במעיל יפה עם מקל כסף לא מבקש כלום ולא חסר לו כלום, ומטבע שנזרק עליו הוא פשוט מטבע שכבר אין למי שכן צריך. איך יודעים? בדרך כלל לא צריך לעבוד קשה: מי שצריך זה מי עם היד בחוץ.',
    'So really you were finished the second you lit. Mitzvah Dash does not roll like that - here you fight for every last flame until the clock runs out.': 'אז בעצם סיימתם בשנייה שהדלקתם. מצווה דאש לא עובד ככה - פה נלחמים על כל להבה עד שהשעון נגמר.',
    'Purim is the one day this changes - everyone who asks gets something, no checking needed. Every other day, look for the hand.': 'בפורים זה משתנה - כל מי שמושיט יד מקבל, בלי לבדוק. בכל יום אחר, מחפשים את היד.',

/* ---------------------------------------------- 3b. NUSACH (fish + dairy) */
/* Ashkenaz and Nusach Sefard: fish with any dairy is fine.
   Edot HaMizrach: no fish with any dairy. The in-game note says Sephardim.
   Chabad: the warning is only liquid milk (chalav) - cheese, butter, cream stay ok.
   Mitz Mode locks this to the app profile. Web / GitHub / Fourthwall pick it in-game. */
var Nusach = {
  CHOICES: [
    { id: 'ashkenaz',  label: 'Ashkenaz' },
    { id: 'sefard',    label: 'Sefard' },
    { id: 'sephardi',  label: 'Edot Hamizrach' },
    { id: 'chabad',    label: 'Chabad' }
  ],
  current: 'ashkenaz',
  lockedFromHost: false,

  parse: function (raw) {
    var s = String(raw || '').trim().toLowerCase().replace(/[-\s]+/g, '_');
    if (s === 'ashkenaz' || s === 'ashkenazi') return 'ashkenaz';
    if (s === 'sefard' || s === 'nusach_sefard' || s === 'sefarad') return 'sefard';
    if (s === 'sephardi' || s === 'sephardim' || s === 'edot' ||
        s === 'edot_hamizrach' || s === 'edot_hamizrah' || s === 'mizrachi') return 'sephardi';
    if (s === 'chabad' || s === 'ari' || s === 'lubavitch') return 'chabad';
    if (s === 'other' || s === 'not_sure' || s === 'notsure') return 'ashkenaz';
    return '';
  },

  inMitzMode: function () {
    return window.MITZ_MODE === true;
  },

  locked: function () {
    return !!Nusach.lockedFromHost;
  },

  id: function () {
    return Nusach.current || 'ashkenaz';
  },

  kitchenNote: function () {
    var n = Nusach.id();
    if (n === 'chabad') return "Chabad don't eat fish with milk";
    if (n === 'sephardi') return "Sephardim don't eat dairy and fish together";
    return '';
  },

  queryValue: function () {
    try {
      if (typeof URLSearchParams === 'function' && location.search) {
        var sp = new URLSearchParams(location.search);
        var q = sp.get('nusach');
        if (q) return q;
      }
      if (location.hash) {
        var m = /(?:^|[?#&])nusach=([a-z_]+)/i.exec(location.hash);
        if (m) return m[1];
      }
    } catch (e) {}
    return '';
  },

  boot: function () {
    var fromHost = Nusach.parse(window.MITZ_NUSACH);
    if (Nusach.inMitzMode() && fromHost) {
      Nusach.lockedFromHost = true;
      Nusach.current = fromHost;
      return Nusach.current;
    }
    Nusach.lockedFromHost = false;
    var fromQ = Nusach.parse(Nusach.queryValue());
    if (fromQ) {
      Nusach.current = fromQ;
      if (Profile.data) { Profile.data.nusach = fromQ; Profile.save(); }
      return Nusach.current;
    }
    var saved = Nusach.parse(Profile.data && Profile.data.nusach);
    Nusach.current = saved || 'ashkenaz';
    return Nusach.current;
  },

  set: function (id) {
    var n = Nusach.parse(id) || 'ashkenaz';
    if (Nusach.lockedFromHost && Nusach.inMitzMode()) return Nusach.current;
    Nusach.current = n;
    if (Profile.data) { Profile.data.nusach = n; Profile.save(); }
    return n;
  }
};
