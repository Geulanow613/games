  var shopY = A.PAVE - 104;
  ctx.save();
  for (i = 0; i < A.TOWERS.length; i++) {
    var b = A.TOWERS[i];
    var mine = (b.x <= A.AX && b.x + b.w > A.AX);
    /* the roofline height belongs to the place, not to the layout: a frontier
       main street is two storeys under a big sky, a city is not */
    var top = S.tops[i];
    if (mine) top = Math.min(top, A.WIN.y - 34);
    var w = b.w - 4;

    /* the roofline is what tells you where you are before anything else */
    ctx.fillStyle = mine ? S.mine : (i % 2 ? S.wallA : S.wallB);
    if (S.roof === 'dome') {
      ctx.beginPath();
      ctx.moveTo(b.x, top + 26);
      ctx.quadraticCurveTo(b.x + w / 2, top - 20, b.x + w, top + 26);
      ctx.lineTo(b.x + w, A.PAVE); ctx.lineTo(b.x, A.PAVE);
      ctx.closePath(); ctx.fill();
    } else if (S.roof === 'gable') {
      ctx.beginPath();
      ctx.moveTo(b.x, top + 30);
      ctx.lineTo(b.x + w / 2, top - 6);
      ctx.lineTo(b.x + w, top + 30);
      ctx.lineTo(b.x + w, A.PAVE); ctx.lineTo(b.x, A.PAVE);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(b.x, top, w, A.PAVE - top);
    }
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(b.x, S.roof === 'flat' ? top : top + 26, w, 5);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(b.x + w - 4, top + 26, 4, A.PAVE - top - 26);

    /* a false front, the flat billboard parapet of a frontier town */
    if (S.roof === 'false') {
      ctx.fillStyle = mine ? S.mine : S.wallA;
      Draw.rr(ctx, b.x - 6, top - 46, w + 12, 60, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
      Draw.rr(ctx, b.x - 6, top - 46, w + 12, 60, 4); ctx.stroke();
      /* the painted board every frontier storefront has across its top */
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      Draw.rr(ctx, b.x + 4, top - 36, w - 8, 20, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,206,120,.34)';
      for (var lt = 0; lt < 5; lt++) ctx.fillRect(b.x + 14 + lt * ((w - 32) / 5), top - 30, 9, 8);
      /* vertical planking down the front */
      ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
      for (var pl = 1; pl < 5; pl++) {
        ctx.beginPath();
        ctx.moveTo(b.x + (w / 5) * pl, top + 16);
        ctx.lineTo(b.x + (w / 5) * pl, A.PAVE - 108);
        ctx.stroke();
      }
    }

    /* windows */
    var cols = Math.max(2, Math.floor((w - 22) / 34));
    var pad = (w - cols * 26) / (cols + 1);
    for (r = 0; ; r++) {
      var wy = top + 40 + r * 44;
      if (wy + 30 > shopY - 12 || r >= S.rows) break;
      for (q = 0; q < cols; q++) {
        var wx = b.x + pad + q * (26 + pad);
        var seed = (i * 31 + r * 17 + q * 7) % 11;
        var on = seed < 6;
        var wh2 = S.win === 'tall' ? 34 : 30;
        ctx.fillStyle = on ? (seed % 3 === 0 ? S.lit : S.lit2) : S.dark;
        if (S.win === 'arch') {
          ctx.beginPath();
          ctx.moveTo(wx, wy + wh2);
          ctx.lineTo(wx, wy + 12);
          ctx.quadraticCurveTo(wx + 13, wy - 8, wx + 26, wy + 12);
          ctx.lineTo(wx + 26, wy + wh2);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.42)'; ctx.lineWidth = 3; ctx.stroke();
        } else {
          Draw.rr(ctx, wx, wy, 26, wh2, S.win === 'tall' ? 2 : 3); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3.5;
          Draw.rr(ctx, wx, wy, 26, wh2, S.win === 'tall' ? 2 : 3); ctx.stroke();
          if (on) {
            ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(wx, wy + wh2 / 2); ctx.lineTo(wx + 26, wy + wh2 / 2);
            if (S.win !== 'tall') { ctx.moveTo(wx + 13, wy); ctx.lineTo(wx + 13, wy + wh2); }
            ctx.stroke();
          }
        }
      }
    }

    /* the shopfront at street level */
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(b.x, shopY, w, A.PAVE - shopY);
    ctx.fillStyle = i % 2 ? S.sign : S.sign2;
    Draw.rr(ctx, b.x + 8, shopY + 6, w - 16, 20, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,207,92,.34)';
    for (var g = 0; g < 4; g++) ctx.fillRect(b.x + 18 + g * ((w - 38) / 4), shopY + 13, 11, 6);
    ctx.fillStyle = S.lit2;
    ctx.globalAlpha = 0.5;
    Draw.rr(ctx, b.x + 12, shopY + 34, w * 0.42, A.PAVE - shopY - 40, 3); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(8,12,24,.85)';
    Draw.rr(ctx, b.x + w - 46, shopY + 32, 32, A.PAVE - shopY - 34, 3); ctx.fill();

    /* one prop per building, so each place has something of its own */
    this.drawSceneProp(ctx, S, b, i, shopY, t);
  }
  ctx.restore();
};

/* the small things that make a frontier street a frontier street */
TzedakaBlast.prototype.drawSceneProp = function (ctx, S, b, i, shopY, t) {
  var A = TzedakaBlast, w = b.w - 4;
  ctx.save();
  if (S.id === 'west') {
    /* hitching rail along the boardwalk */
    ctx.strokeStyle = '#5a4028'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + 14, A.PAVE + 16); ctx.lineTo(b.x + w - 14, A.PAVE + 16);
    ctx.moveTo(b.x + 20, A.PAVE + 16); ctx.lineTo(b.x + 20, A.PAVE + 34);
    ctx.moveTo(b.x + w - 20, A.PAVE + 16); ctx.lineTo(b.x + w - 20, A.PAVE + 34);
    ctx.stroke();
    if (i === 3) {
      /* a water tower on stilts */
      var wt = S.tops[i] - 120;
      ctx.fillStyle = '#4a3320';
      Draw.rr(ctx, b.x + w / 2 - 30, wt, 60, 46, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2.5;
      Draw.rr(ctx, b.x + w / 2 - 30, wt, 60, 46, 6); ctx.stroke();
      ctx.fillStyle = '#5c4128';
      ctx.beginPath();
      ctx.moveTo(b.x + w / 2 - 36, wt); ctx.lineTo(b.x + w / 2, wt - 22);
      ctx.lineTo(b.x + w / 2 + 36, wt); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(b.x + w / 2 - 20, wt + 46); ctx.lineTo(b.x + w / 2 - 26, wt + 78);
      ctx.moveTo(b.x + w / 2 + 20, wt + 46); ctx.lineTo(b.x + w / 2 + 26, wt + 78);
      ctx.stroke();
    }
  } else if (S.id === 'stone') {
    /* a shallow arch over each shop door, and a cypress or two */
    ctx.strokeStyle = 'rgba(255,226,168,.16)'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(b.x + 12 + w * 0.21, shopY + 34, w * 0.21, Math.PI, 0);
    ctx.stroke();
    if (i % 3 === 1) {
      ctx.fillStyle = '#1d3326';
      ctx.beginPath();
      ctx.moveTo(b.x + w - 26, A.PAVE + 4);
      ctx.quadraticCurveTo(b.x + w - 40, S.tops[i] + 60, b.x + w - 26, S.tops[i] + 30);
      ctx.quadraticCurveTo(b.x + w - 12, S.tops[i] + 60, b.x + w - 26, A.PAVE + 4);
      ctx.closePath(); ctx.fill();
    }
  } else if (S.id === 'port') {
    /* masts and rigging behind the warehouses */
    if (i % 2 === 0) {
      ctx.strokeStyle = 'rgba(180,210,230,.35)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x + w * 0.5, S.tops[i] - 76); ctx.lineTo(b.x + w * 0.5, S.tops[i] + 4);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + w * 0.5, S.tops[i] - 74); ctx.lineTo(b.x + w * 0.5 - 34, S.tops[i] + 2);
      ctx.moveTo(b.x + w * 0.5, S.tops[i] - 74); ctx.lineTo(b.x + w * 0.5 + 34, S.tops[i] + 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200,90,70,.5)';
      ctx.beginPath();
      ctx.moveTo(b.x + w * 0.5 + 3, S.tops[i] - 72);
      ctx.lineTo(b.x + w * 0.5 + 24, S.tops[i] - 58);
      ctx.lineTo(b.x + w * 0.5 + 3, S.tops[i] - 44);
      ctx.closePath(); ctx.fill();
    }
    /* crates on the quay */
    ctx.fillStyle = '#3a3226';
    Draw.rr(ctx, b.x + 16, A.PAVE + 10, 26, 22, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
    Draw.rr(ctx, b.x + 16, A.PAVE + 10, 26, 22, 2); ctx.stroke();

  } else if (S.id === 'narrow') {
    /* iron fire ladders and downpipes bolted to the brick */
    ctx.strokeStyle = 'rgba(24,14,12,.85)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x + w - 12, S.tops[i] + 40); ctx.lineTo(b.x + w - 12, A.PAVE - 110);
    ctx.stroke();
    if (i % 2 === 0) {
      ctx.lineWidth = 2.5;
      for (var lr = 0; lr < 8; lr++) {
        var ly = S.tops[i] + 70 + lr * 56;
        if (ly > A.PAVE - 120) break;
        ctx.beginPath();
        ctx.moveTo(b.x + 12, ly); ctx.lineTo(b.x + 40, ly); ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(b.x + 12, S.tops[i] + 60); ctx.lineTo(b.x + 12, A.PAVE - 116);
      ctx.moveTo(b.x + 40, S.tops[i] + 60); ctx.lineTo(b.x + 40, A.PAVE - 116);
      ctx.stroke();
    }

  } else if (S.id === 'village') {
    /* a picket fence running the length of the lane */
    ctx.fillStyle = '#6a5c44';
    for (var pk = 0; pk < 7; pk++) {
      var px2 = b.x + 8 + pk * ((w - 16) / 7);
      ctx.beginPath();
      ctx.moveTo(px2, A.PAVE + 34);
      ctx.lineTo(px2, A.PAVE + 8);
      ctx.lineTo(px2 + 5, A.PAVE + 2);
      ctx.lineTo(px2 + 10, A.PAVE + 8);
      ctx.lineTo(px2 + 10, A.PAVE + 34);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(b.x + 6, A.PAVE + 16, w - 12, 4);
    /* a chimney with a curl of smoke */
    if (i % 2 === 1) {
      ctx.fillStyle = S.wallA;
      ctx.fillRect(b.x + w - 34, S.tops[i] - 20, 18, 34);
      ctx.strokeStyle = 'rgba(210,220,230,.16)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x + w - 25, S.tops[i] - 24);
      ctx.quadraticCurveTo(b.x + w - 40, S.tops[i] - 52, b.x + w - 18, S.tops[i] - 74);
      ctx.stroke();
    }

  } else if (S.id === 'snow') {
    /* snow lying on every ledge, and a ridge of it along the kerb */
    ctx.fillStyle = 'rgba(236,246,255,.9)';
    Draw.rr(ctx, b.x, S.tops[i] + 22, w, 9, 4); ctx.fill();
    Draw.rr(ctx, b.x + 10, A.PAVE - 106, w - 20, 7, 3); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b.x, A.PAVE + 30);
    ctx.quadraticCurveTo(b.x + w / 2, A.PAVE + 16, b.x + w, A.PAVE + 30);
    ctx.lineTo(b.x + w, A.PAVE + 40); ctx.lineTo(b.x, A.PAVE + 40);
    ctx.closePath(); ctx.fill();

  } else if (S.id === 'adobe') {
    /* roof beams poking through the parapet, and a ladder up one wall */
    ctx.fillStyle = 'rgba(60,36,20,.9)';
    for (var bm = 0; bm < 4; bm++) {
      ctx.fillRect(b.x + 10 + bm * ((w - 20) / 4), S.tops[i] + 16, 9, 14);
    }
    if (i % 3 === 0) {
      ctx.strokeStyle = 'rgba(70,44,24,.9)'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(b.x + 18, A.PAVE); ctx.lineTo(b.x + 24, S.tops[i] + 18);
      ctx.moveTo(b.x + 38, A.PAVE); ctx.lineTo(b.x + 42, S.tops[i] + 18);
      ctx.stroke();
      ctx.lineWidth = 3;
      for (var rg = 0; rg < 6; rg++) {
        var ry2 = A.PAVE - 22 - rg * ((A.PAVE - S.tops[i] - 40) / 6);
        ctx.beginPath();
        ctx.moveTo(b.x + 19, ry2); ctx.lineTo(b.x + 40, ry2); ctx.stroke();
      }
    }

  } else if (S.id === 'canal') {
    /* iron railings along the water, and a mooring ring */
    ctx.strokeStyle = 'rgba(190,225,210,.5)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x, A.PAVE + 12); ctx.lineTo(b.x + w, A.PAVE + 12);
    ctx.moveTo(b.x, A.PAVE + 30); ctx.lineTo(b.x + w, A.PAVE + 30);
    ctx.stroke();
    ctx.lineWidth = 2.5;
    for (var rl = 0; rl < 6; rl++) {
      var rx = b.x + 8 + rl * ((w - 16) / 6);
      ctx.beginPath();
      ctx.moveTo(rx, A.PAVE + 6); ctx.lineTo(rx, A.PAVE + 34); ctx.stroke();
    }
    if (i % 3 === 2) {
      ctx.strokeStyle = 'rgba(190,225,210,.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x + w - 20, A.PAVE + 22, 8, 0, TAU); ctx.stroke();
    }

  } else if (S.id === 'market') {
    /* shutters pulled down over every stall, and a keystone in each arch */
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
    for (var sh = 0; sh < 7; sh++) {
      var sy = shopY + 44 + sh * 12;
      if (sy > A.PAVE - 8) break;
      ctx.beginPath();
      ctx.moveTo(b.x + 12, sy); ctx.lineTo(b.x + 12 + w * 0.42, sy); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(236,200,255,.2)';
    ctx.beginPath();
    ctx.moveTo(b.x + w / 2 - 8, shopY + 6);
    ctx.lineTo(b.x + w / 2 + 8, shopY + 6);
    ctx.lineTo(b.x + w / 2 + 5, shopY + 26);
    ctx.lineTo(b.x + w / 2 - 5, shopY + 26);
    ctx.closePath(); ctx.fill();

  } else if (S.id === 'hill') {
    /* stone steps climbing between the terraces */
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (var st = 0; st < 6; st++) {
      ctx.fillRect(b.x + w - 30 - st * 4, A.PAVE - 100 + st * 16, 30 + st * 4, 8);
    }
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,206,132,.5)';
      ctx.beginPath(); ctx.arc(b.x + 16, A.PAVE - 118, 6, 0, TAU); ctx.fill();
    }

  } else if (S.id === 'purim') {
    /* a wire of little lanterns strung from roof to roof, and a magen david
       over the doorway - the one mark this game is allowed to draw */
    ctx.strokeStyle = 'rgba(255,214,160,.45)'; ctx.lineWidth = 2;
    var y0 = S.tops[i] + 40, y1 = S.tops[(i + 1) % 7] + 40;
    ctx.beginPath();
    ctx.moveTo(b.x, y0);
    ctx.quadraticCurveTo(b.x + w / 2, Math.max(y0, y1) + 34, b.x + w, y1);
    ctx.stroke();
    for (var ln = 1; ln < 5; ln++) {
      var k2 = ln / 5;
      var lxp = b.x + w * k2;
      var lyp = (1 - k2) * (1 - k2) * y0 + 2 * (1 - k2) * k2 * (Math.max(y0, y1) + 34) + k2 * k2 * y1;
      ctx.fillStyle = ln % 2 ? 'rgba(255,206,120,.85)' : 'rgba(255,168,206,.8)';
      ctx.beginPath(); ctx.arc(lxp, lyp + 8, 5, 0, TAU); ctx.fill();
    }
    if (i % 2 === 1) Draw.magenDavid(ctx, b.x + w / 2, shopY + 18, 11, 'rgba(255,222,140,.6)', 2.5);
  }
  ctx.restore();
};

TzedakaBlast.prototype.drawPave = function (ctx) {
  var A = TzedakaBlast;
  ctx.save();
  ctx.fillStyle = this.scene().pave;
  ctx.fillRect(0, A.PAVE, CFG.W, 40);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(0, A.PAVE, CFG.W, 5);
  ctx.restore();
};

TzedakaBlast.prototype.drawStreet = function (ctx, t) {
  var A = TzedakaBlast;
  ctx.save();
  var S = this.scene();
  Draw.vGradient(ctx, 0, A.PAVE + 36, CFG.W, A.BAND - A.PAVE - 36, S.road);
  /* pools of light spilling out of the shopfronts, and nothing but dark
     between them - this is why a dropped coin is not noticed */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var b2 = 0; b2 < A.TOWERS.length; b2++) {
    var tw = A.TOWERS[b2];
    var lx = tw.x + tw.w * 0.34;
    var lg3 = ctx.createRadialGradient(lx, A.PAVE + 30, 8, lx, A.PAVE + 30, 210);
    lg3.addColorStop(0, S.lamp);
    lg3.addColorStop(0.55, S.lamp.replace(/[\d.]+\)$/, '.05)'));
    lg3.addColorStop(1, S.lamp.replace(/[\d.]+\)$/, '0)'));
    ctx.fillStyle = lg3;
    ctx.fillRect(lx - 210, A.PAVE + 20, 420, A.BAND - A.PAVE);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 2;
  for (var r = 0; r < 3; r++) {
    var y = A.LANES[r] + 12;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CFG.W, y); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, A.GROUND + 2, CFG.W, A.BAND - A.GROUND - 2);
  ctx.restore();
};

TzedakaBlast.prototype.drawMote = function (ctx, m) {
  var a = clamp(m.t / 2, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(m.x + 2, m.y + 7, 13, 4, 0, 0, TAU); ctx.fill();
  var g = ctx.createLinearGradient(m.x - 11, m.y, m.x + 11, m.y);
  g.addColorStop(0, m.gold ? '#a97f22' : '#8a6a20');
  g.addColorStop(0.45, m.gold ? '#fff0b8' : '#f6e6b4');
  g.addColorStop(1, m.gold ? '#a97f22' : '#8a6a20');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(m.x, m.y, 11, 5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(m.x, m.y, 11, 5, 0, 0, TAU); ctx.stroke();
  /* a slow glint, so a coin on the cobbles is something you notice */
  ctx.globalAlpha = a * (0.3 + 0.7 * pulse(this.elapsed + m.spin, 1.4));
  ctx.fillStyle = '#fffbe8';
  ctx.beginPath(); ctx.ellipse(m.x - 3, m.y - 1, 3.5, 1.6, 0, 0, TAU); ctx.fill();
  ctx.restore();
};

/* Two eyes, always. A single dark dot reads as a cyclops at this size. */
TzedakaBlast.prototype.drawEyes = function (ctx, cx, cy) {
  var i, ex;
  for (i = -1; i <= 1; i += 2) {
    ex = cx + i * 6.4;
    ctx.fillStyle = '#f4efe4';
    ctx.beginPath(); ctx.ellipse(ex, cy, 3.3, 3.7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a1c12';
    ctx.beginPath(); ctx.arc(ex, cy + 0.3, 1.65, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(ex - 0.7, cy - 0.8, 0.7, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(30,22,16,.45)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 9.4, cy - 5.2); ctx.lineTo(cx - 3.4, cy - 6.4);
  ctx.moveTo(cx + 3.4, cy - 6.4); ctx.lineTo(cx + 9.4, cy - 5.2);
  ctx.stroke();
};

/* --------------------------------------------------------------- people */
/* Everyone on this street is dressed: long coat, long sleeves, hat. Only
   the face and the hands show. */
TzedakaBlast.prototype.drawPerson = function (ctx, p, t) {
  var A = TzedakaBlast, ch = A.PEOPLE[p.ch];
  var swing = Math.sin(p.phase) * 11;
  /* the ONE lift, the same number the hit box is built from */
  var lift = p.lift == null ? this.personLift(p) : p.lift;
  var z = this.personSize(p);
  ctx.save();
  ctx.translate(p.x, p.y - lift);
  ctx.scale(p.dir * z, z);

  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0, 4 + lift, 27, 7, 0, 0, TAU); ctx.fill();

  ctx.strokeStyle = '#232636'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-3, -38); ctx.lineTo(swing * 0.7 - 3, -5);
  ctx.moveTo(3, -38); ctx.lineTo(-swing * 0.7 + 3, -5);
  ctx.stroke();
  ctx.fillStyle = '#14161f';
  ctx.beginPath(); ctx.ellipse(swing * 0.7 + 1, -2, 12, 5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-swing * 0.7 + 5, -2, 12, 5, 0, 0, TAU); ctx.fill();

  /* a long coat, sleeves to the wrist - nobody on this street is uncovered */
  ctx.fillStyle = ch.coat;
  ctx.beginPath();
  ctx.moveTo(-21, -96);
  ctx.lineTo(21, -96);
  ctx.quadraticCurveTo(26, -66, 25, -30);
  ctx.lineTo(-25, -30);
  ctx.quadraticCurveTo(-26, -66, -21, -96);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(1, -92); ctx.lineTo(1, -32); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-8, -95); ctx.lineTo(0, -87); ctx.lineTo(8, -95); ctx.stroke();

  ctx.strokeStyle = ch.coat; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-13, -88); ctx.lineTo(-22 - swing * 0.4, -60); ctx.stroke();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(-23 - swing * 0.4, -57, 5.5, 0, TAU); ctx.fill();

  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(2, -112, 17, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.beard;
  ctx.beginPath();
  ctx.moveTo(-12, -111);
  ctx.quadraticCurveTo(-7, -89, 6, -91);
  ctx.quadraticCurveTo(14, -96, 15, -111);
  ctx.quadraticCurveTo(3, -102, -12, -111);
  ctx.closePath(); ctx.fill();
  this.drawEyes(ctx, 2, -116);
  if (p.slip > 0) {
    ctx.strokeStyle = 'rgba(210,230,255,.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-18, 2); ctx.lineTo(-34, 8);
    ctx.moveTo(10, 2); ctx.lineTo(-6, 10);
    ctx.stroke();
  }
  /* every man his own hat: wider or narrower brim, and a crown that is a
     cap, a homburg or a tall black hat */
  ctx.fillStyle = ch.hat;
  ctx.beginPath(); ctx.ellipse(2, -126, 24 * ch.brim, 5.5, 0, 0, TAU); ctx.fill();
  if (ch.tall === 2) {
    Draw.rr(ctx, -11, -152, 27, 27, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(-11, -134, 27, 4);
  } else if (ch.tall === 1) {
    Draw.rr(ctx, -11, -145, 27, 20, 5); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath();
    ctx.moveTo(-11, -140); ctx.quadraticCurveTo(2, -147, 16, -140);
    ctx.lineTo(16, -137); ctx.lineTo(-11, -137); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-11, -125);
    ctx.quadraticCurveTo(2, -144, 16, -125);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();

  this.drawHolding(ctx, p, t, swing, lift);
  this.drawPersonState(ctx, p, t);
};

TzedakaBlast.prototype.drawHolding = function (ctx, p, t, swing, lift) {
  var d = p.dir, b = this.targetBox(p);
  var cy = b.y + b.h / 2, cx = b.x + b.w / 2;
  var ch = TzedakaBlast.PEOPLE[p.ch];
  var f;
  /* where his feet are drawn this instant, and how big he is - everything
     here hangs off those two, exactly as the hit box does */
  var py = p.y - (p.lift == null ? this.personLift(p) : p.lift);
  var z = this.personSize(p);
  ctx.save();
  /* NO translate here. The box already carries the lift, so shifting the art
     on top of it would put the opening back where the coin is not. */

  /* THE RULE FOR EVERYTHING BELOW: whatever is drawn as the opening is drawn at
     exactly the size of the box the coin is tested against. If the art is any
     smaller than the hitbox the game feels magnetic - a coin that visibly
     missed still counts - and that is what reads as a lock-on. */

  /* the reaching arm: shoulder, elbow, wrist. Straight segments with round
     caps, so it is an arm and not a tapering blob. */
  if (p.kind === 'hand' || p.kind === 'pushka') {
    var wrX = cx - d * (b.w / 2 + 5), wrY = cy;
    ctx.strokeStyle = ch.coat;
    ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.lineWidth = 11 * z;
    ctx.moveTo(p.x + d * 13 * z, py - 88 * z);
    ctx.lineTo(p.x + d * 30 * z, py - 80 * z);
    ctx.lineTo(wrX, wrY);
    ctx.stroke();
    /* the cuff, so the sleeve visibly ends and the hand begins */
    ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wrX, wrY - 7); ctx.lineTo(wrX, wrY + 7);
    ctx.stroke();
  }

  /* a plain open hand, filling its own hitbox exactly */
  if (p.kind === 'hand') {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = ch.skin;
    Draw.rr(ctx, -b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.5;
    Draw.rr(ctx, -b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.stroke();
    /* three fingertips just past the far edge, and a thumb on the near side */
    ctx.strokeStyle = ch.skin; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    for (f = 0; f < 3; f++) {
      var fy = -b.h / 2 + 3 + f * ((b.h - 6) / 2);
      ctx.beginPath();
      ctx.moveTo(b.w / 2 - 3, fy);
      ctx.lineTo(b.w / 2 + 5, fy - 1);
      ctx.stroke();
    }
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-b.w / 2 + 5, -b.h / 2 + 2);
    ctx.lineTo(-b.w / 2 + 13, -b.h / 2 - 5);
    ctx.stroke();
    /* the shallow cup of the palm */
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-b.w / 2 + 7, 1); ctx.lineTo(b.w / 2 - 7, 1);
    ctx.stroke();
    ctx.restore();
  }

  /* a tin. The slot in the lid is the opening, drawn at hitbox size. */
  if (p.kind === 'pushka') {
    var tx = cx - 25, ty = b.y - 3, tw = 50, th = 48;
    ctx.fillStyle = '#8d99b0';
    Draw.rr(ctx, tx, ty + 12, tw, th - 12, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.42)'; ctx.lineWidth = 2.5;
    Draw.rr(ctx, tx, ty + 12, tw, th - 12, 5); ctx.stroke();
    Draw.magenDavid(ctx, cx, ty + 34, 9, C.gold, 2);
    ctx.fillStyle = '#c3ccdd';
    Draw.rr(ctx, tx - 3, ty, tw + 6, 16, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.42)'; ctx.lineWidth = 2.5;
    Draw.rr(ctx, tx - 3, ty, tw + 6, 16, 4); ctx.stroke();
    ctx.fillStyle = '#05070d';
    Draw.rr(ctx, b.x, b.y, b.w, b.h, 3); ctx.fill();
  }

  /* a sack. The mouth is the opening, drawn at hitbox size. */
  if (p.kind === 'basket') {
    var sy = b.y + b.h / 2;
    ctx.fillStyle = '#b08a52';
    ctx.beginPath();
    ctx.moveTo(cx - b.w / 2 - 2, sy);
    ctx.quadraticCurveTo(cx - b.w / 2 - 14, sy + 46, cx, sy + 50);
    ctx.quadraticCurveTo(cx + b.w / 2 + 14, sy + 46, cx + b.w / 2 + 2, sy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 10, sy + 12); ctx.quadraticCurveTo(cx - 16, sy + 36, cx - 4, sy + 44);
    ctx.stroke();
    ctx.fillStyle = '#05070d';
    Draw.rr(ctx, b.x, b.y, b.w, b.h, b.h / 2); ctx.fill();
    ctx.strokeStyle = '#8c6a3a'; ctx.lineWidth = 4;
    Draw.rr(ctx, b.x, b.y, b.w, b.h, b.h / 2); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx + d * 16, b.y + 4); ctx.lineTo(p.x - d * 4 * z, py - 92 * z);
    ctx.stroke();
  }

  /* a cart, with its slot or its tray as the opening. */
  if (p.kind === 'kupah' || p.kind === 'loan') {
    var cartX = cx - b.w / 2 - 16, cartW = b.w + 32;
    var cartY = b.y + b.h + 8, cartH = Math.max(30, py - 22 * z - cartY);
    ctx.fillStyle = p.kind === 'loan' ? '#6b4a2a' : '#2f4a6e';
    Draw.rr(ctx, cartX, cartY, cartW, cartH, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5;
    Draw.rr(ctx, cartX, cartY, cartW, cartH, 6); ctx.stroke();
    ctx.fillStyle = '#20242f';
    ctx.beginPath(); ctx.arc(cartX + 16, py - 18 * z, 13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cartX + cartW - 16, py - 18 * z, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5c6478';
    ctx.beginPath(); ctx.arc(cartX + 16, py - 18 * z, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cartX + cartW - 16, py - 18 * z, 5, 0, TAU); ctx.fill();
    if (p.kind === 'loan' && !p.served) {
      ctx.strokeStyle = C.red; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cartX + cartW - 26, py - 28 * z); ctx.lineTo(cartX + cartW - 6, py - 8 * z);
      ctx.moveTo(cartX + cartW - 6, py - 28 * z); ctx.lineTo(cartX + cartW - 26, py - 8 * z);
      ctx.stroke();
    }
    ctx.fillStyle = p.kind === 'loan' ? '#c9a24a' : '#8d99b0';
    Draw.rr(ctx, b.x - 9, b.y - 5, b.w + 18, b.h + 14, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5;
    Draw.rr(ctx, b.x - 9, b.y - 5, b.w + 18, b.h + 14, 4); ctx.stroke();
    ctx.fillStyle = '#05070d';
    Draw.rr(ctx, b.x, b.y, b.w, b.h, 3); ctx.fill();
  }
  ctx.restore();
};

/* The badge sits tight above the target; everything wordy goes BELOW the feet,
   where it cannot collide with whoever is walking in the lane behind. */
TzedakaBlast.prototype.drawPersonState = function (ctx, p, t) {
  var b = this.targetBox(p);
  var cx = b.x + b.w / 2, top = p.y - 184;   /* clear of the hat, whatever he holds */
  var footY = p.y + 22;

  if (p.served) {
    Draw.textSafe(ctx, p.thanks || 'THANKS!', cx, footY, {
      size: 19, maxW: 220, color: '#8ee06a', weight: '900',
      stroke: 'rgba(0,0,0,.7)', strokeW: 4
    });
    return;
  }

  var name = p.def.label;
  var w = Math.max(62, Draw.measure(ctx, name, 14, '900') + 22);
  ctx.save();
  Draw.panel(ctx, cx - w / 2, top, w, 21, {
    fill: 'rgba(8,12,26,.82)', radius: 7, stroke: 'rgba(255,255,255,.34)', strokeW: 2
  });
  Draw.text(ctx, name, cx, top + 15, { size: 14, color: 'rgba(255,255,255,.85)', align: 'center', weight: '900' });
  ctx.restore();

  var pk = clamp(p.patience / p.maxPat, 0, 1);
  Draw.meter(ctx, cx - w / 2, top + 24, w, 6, pk, {
    fg: pk > 0.55 ? C.teal : C.gold, gloss: false
  });

  var note = null, nc = null;
  if (p.kind === 'loan')  { note = 'TOSS HIM THE GOLD!'; nc = C.gold; }
  else if (p.hint && p.patience < p.maxPat * 0.32) {
    note = p.def.cry || '...'; nc = 'rgba(255,207,92,.95)';
  }
  if (note) {
    ctx.save();
    if (p.kind !== 'loan') ctx.globalAlpha = 0.6 + 0.4 * pulse(t, 2.6);
    Draw.textSafe(ctx, note, cx, footY, {
      size: 17, maxW: 250, color: nc, weight: '900', stroke: 'rgba(0,0,0,.75)', strokeW: 4
    });
    ctx.restore();
  }
};

/* ---------------------------------------------------------------- coins */
/* ------------------------------------------------------- the gentlemen */
/* Same rules as everybody else on this street: long coat, sleeves to the
   wrist, collar, hat. Only his face and his hands show. The difference is
   that both his hands are busy - one on his stick, one behind his back - so
   there is nothing held out and nothing to aim into. */
TzedakaBlast.prototype.drawGent = function (ctx, g, t) {
  var A = TzedakaBlast, ch = A.GENTS[g.ch];
  var swing = Math.sin(g.phase) * 12;
  var bob = Math.abs(Math.cos(g.phase)) * 3;
  var bump = g.bump > 0 ? Math.sin(g.bump * 22) * 4 : 0;
  /* he does not bob. The top of his hat has to sit exactly on the top of the
     box that stops a coin, and a bobbing figure cannot promise that. */
  var lift = 0, z = g.sz || 1;
  ctx.save();
  ctx.translate(g.x + bump, g.y - lift);
  ctx.scale(g.dir * z, z);

  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0, 4, 26 - bob, 7, 0, 0, TAU); ctx.fill();

  /* trousers and polished shoes */
  ctx.strokeStyle = '#1a1d28'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-3, -42); ctx.lineTo(swing * 0.7 - 3, -6);
  ctx.moveTo(3, -42); ctx.lineTo(-swing * 0.7 + 3, -6);
  ctx.stroke();
  ctx.fillStyle = '#0b0d14';
  ctx.beginPath(); ctx.ellipse(swing * 0.7 + 2, -3, 13, 5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-swing * 0.7 + 6, -3, 13, 5, 0, 0, TAU); ctx.fill();

  /* a long tailed coat */
  ctx.fillStyle = ch.coat;
  ctx.beginPath();
  ctx.moveTo(-20, -104);
  ctx.lineTo(20, -104);
  ctx.quadraticCurveTo(26, -72, 24, -34);
  ctx.lineTo(14, -34);
  ctx.lineTo(10, -56);
  ctx.lineTo(-10, -56);
  ctx.lineTo(-14, -34);
  ctx.lineTo(-24, -34);
  ctx.quadraticCurveTo(-26, -72, -20, -104);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5; ctx.stroke();
  /* waistcoat and watch chain - this is a man who is doing well */
  ctx.fillStyle = ch.trim;
  ctx.beginPath();
  ctx.moveTo(-9, -100); ctx.lineTo(9, -100);
  ctx.lineTo(7, -58); ctx.lineTo(-7, -58);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-6, -84); ctx.quadraticCurveTo(0, -76, 6, -82); ctx.stroke();

  /* the arm on the stick, and the stick reaching the pavement */
  ctx.strokeStyle = ch.coat; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(14, -96); ctx.lineTo(23, -62); ctx.stroke();
  ctx.strokeStyle = '#2a1c12'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(25, -58); ctx.lineTo(31, -4); ctx.stroke();
  ctx.fillStyle = ch.trim;
  ctx.beginPath(); ctx.arc(25, -60, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(24, -58, 5.5, 0, TAU); ctx.fill();
  /* and the other hand tucked behind his back */
  ctx.strokeStyle = ch.coat; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-14, -96); ctx.lineTo(-20, -68); ctx.stroke();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(-20, -65, 5, 0, TAU); ctx.fill();

  /* collar, face, beard */
  ctx.fillStyle = '#f2efe6';
  ctx.beginPath();
  ctx.moveTo(-11, -104); ctx.lineTo(0, -94); ctx.lineTo(11, -104);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(2, -120, 16, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(30,22,16,.85)';
  ctx.beginPath();
  ctx.moveTo(-9, -118);
  ctx.quadraticCurveTo(2, -96, 13, -117);
  ctx.quadraticCurveTo(4, -110, -9, -118);
  ctx.closePath(); ctx.fill();
  this.drawEyes(ctx, 2, -124);

  /* a silk top hat - the top of it is the top of his blocker box */
  ctx.fillStyle = ch.hat;
  ctx.beginPath(); ctx.ellipse(2, -134, 22, 6, 0, 0, TAU); ctx.fill();
  Draw.rr(ctx, -11, -156, 26, 24, 3); ctx.fill();
  ctx.fillStyle = ch.trim;
  ctx.fillRect(-11, -138, 26, 4);
  if (g.umb) {
    ctx.fillStyle = ch.trim;
    ctx.beginPath();
    ctx.moveTo(-28, -168);
    ctx.quadraticCurveTo(2, -196, 32, -168);
    ctx.lineTo(2, -164);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1c12'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(2, -164); ctx.lineTo(2, -156); ctx.stroke();
  }
  ctx.restore();
};

/* ------------------------------------------------------------ the wagon */
TzedakaBlast.prototype.drawWagon = function (ctx, S, w) {
  var A = TzedakaBlast, cx = w.x + w.w / 2, base = A.GROUND;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(cx, base + 4, w.w * 0.52, 9, 0, 0, TAU); ctx.fill();

  /* wheels, turning with the distance travelled */
  var wr = 27, wy = base - wr + 2;
  for (var k = 0; k < 2; k++) {
    var wx = w.x + (k ? w.w - 34 : 34);
    ctx.fillStyle = '#1a1208';
    ctx.beginPath(); ctx.arc(wx, wy, wr, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(226,196,132,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(wx, wy, wr - 4, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.4;
    for (var sp = 0; sp < 6; sp++) {
      var an = w.roll + sp * (TAU / 6);
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(an) * (wr - 5), wy + Math.sin(an) * (wr - 5));
      ctx.stroke();
    }
  }

  /* the bed, planked */
  ctx.fillStyle = S.cart;
  Draw.rr(ctx, w.x, w.y + 50, w.w, base - w.y - 74, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
  Draw.rr(ctx, w.x, w.y + 50, w.w, base - w.y - 74, 5); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 2;
  for (var pl = 1; pl < 4; pl++) {
    ctx.beginPath();
    ctx.moveTo(w.x + 6, w.y + 50 + pl * ((base - w.y - 74) / 4));
    ctx.lineTo(w.x + w.w - 6, w.y + 50 + pl * ((base - w.y - 74) / 4));
    ctx.stroke();
  }

  /* The canvas hood. Its top edge IS the top of the blocker box - a coin is
     stopped exactly where you can see something to stop it, and nowhere else. */
  ctx.fillStyle = 'rgba(226,218,198,.94)';
  Draw.rr(ctx, w.x, w.y, w.w, 58, 8); ctx.fill();
  ctx.fillStyle = S.cart;
  ctx.globalAlpha = 0.3;
  Draw.rr(ctx, w.x, w.y, w.w, 58, 8); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = 3;
  Draw.rr(ctx, w.x, w.y, w.w, 58, 8); ctx.stroke();
  /* the ribs under the canvas */
  ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 2.5;
  for (var rb = 1; rb < 5; rb++) {
    var fx = w.x + rb * (w.w / 5);
    ctx.beginPath();
    ctx.moveTo(fx, w.y + 6); ctx.lineTo(fx, w.y + 52); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(w.x + 8, w.y + 5, w.w - 16, 4);

  /* a lantern hung on the corner, because every street here is night */
  var lx = w.dir > 0 ? w.x + w.w - 10 : w.x + 10;
  ctx.fillStyle = 'rgba(255,206,120,.9)';
  Draw.rr(ctx, lx - 6, w.y + 56, 12, 16, 3); ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var gr = ctx.createRadialGradient(lx, w.y + 64, 2, lx, w.y + 64, 54);
  gr.addColorStop(0, 'rgba(255,206,120,.35)');
  gr.addColorStop(1, 'rgba(255,206,120,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(lx, w.y + 64, 54, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
};

/* ----------------------------------------------------------- the weather */
TzedakaBlast.prototype.drawWeather = function (ctx, S) {
  if (!S.weather || !this.flakes.length) return;
  var i, f;
  ctx.save();
  if (S.weather === 'snow') {
    ctx.fillStyle = 'rgba(232,242,255,.72)';
    for (i = 0; i < this.flakes.length; i++) {
      f = this.flakes[i];
      ctx.beginPath();
      ctx.arc(f.x + Math.sin(f.sw) * 16, f.y, f.r, 0, TAU);
      ctx.fill();
    }
  } else {
    ctx.strokeStyle = 'rgba(186,226,240,.42)';
    ctx.lineCap = 'round';
    for (i = 0; i < this.flakes.length; i++) {
      f = this.flakes[i];
      ctx.lineWidth = f.r;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x - 7, f.y + 26);
      ctx.stroke();
    }
  }
  ctx.restore();
};

TzedakaBlast.prototype.drawCoin = function (ctx, c) {
  var i;
  ctx.save();
  if (c.trail.length > 3) {
    ctx.strokeStyle = c.gold ? 'rgba(240,214,122,.30)' : 'rgba(201,162,74,.24)';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(c.trail[0], c.trail[1]);
    for (i = 2; i < c.trail.length; i += 2) ctx.lineTo(c.trail[i], c.trail[i + 1]);
    ctx.stroke();
  }
  ctx.translate(c.x, c.y);
  var sq = Math.abs(Math.cos(c.spin));
  ctx.scale(Math.max(0.22, sq), 1);
  var g = ctx.createRadialGradient(-4, -5, 2, 0, 0, c.r);
  if (c.gold) { g.addColorStop(0, '#fff0b8'); g.addColorStop(0.6, '#f0d67a'); g.addColorStop(1, '#a97f22'); }
  else { g.addColorStop(0, '#f6e6b4'); g.addColorStop(0.6, '#d9b45c'); g.addColorStop(1, '#8a6a20'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, TAU); ctx.stroke();
  if (sq > 0.5) {
    ctx.strokeStyle = 'rgba(90,60,10,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, c.r * 0.58, 0, TAU); ctx.stroke();
  }
  ctx.restore();
  if (c.gold) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 7, 0, TAU); ctx.stroke();
    ctx.restore();
  }
};

TzedakaBlast.prototype.drawPigeon = function (ctx, g) {
  var wing = Math.sin(g.flap) * 16;
  ctx.save();
  ctx.translate(g.x, g.y);
  if (g.dive) ctx.rotate(-0.28 * g.dir);
  ctx.scale(g.dir, 1);
  ctx.fillStyle = g.dive ? '#8a6a78' : '#6f7a90';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 13, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8d97ab';
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.quadraticCurveTo(-16, -14 - wing, 6, -10 - wing * 0.5);
  ctx.quadraticCurveTo(10, -2, -4, -4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6f7a90';
  ctx.beginPath(); ctx.arc(18, -8, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0a03a';
  ctx.beginPath(); ctx.moveTo(25, -8); ctx.lineTo(33, -6); ctx.lineTo(25, -4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#141822';
  ctx.beginPath(); ctx.arc(20, -10, 2, 0, TAU); ctx.fill();
  ctx.restore();
  Draw.textSafe(ctx, g.dive ? 'DIVING!' : 'TAP!', g.x, g.y - 34, {
    size: 17, maxW: 140, color: g.dive ? '#ffb07a' : C.teal, weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 4
  });
};

/* ------------------------------------------------------- you, at the window */
/* One small lit window up in the skyline with somebody leaning out of it. No
   frame, no sill, no shutters - just a window and an arm. */
TzedakaBlast.WIN = { x: 318, y: 196, w: 84, h: 86 };

TzedakaBlast.prototype.drawSelf = function (ctx, t) {
  var A = TzedakaBlast, W = A.WIN;
  ctx.save();

  /* the lit room behind the glass */
  ctx.fillStyle = '#2b1c10';
  Draw.rr(ctx, W.x, W.y, W.w, W.h, 4); ctx.fill();
  var rg = ctx.createLinearGradient(0, W.y, 0, W.y + W.h);
  rg.addColorStop(0, 'rgba(255,204,120,.55)');
  rg.addColorStop(1, 'rgba(255,168,72,.28)');
  ctx.fillStyle = rg;
  Draw.rr(ctx, W.x, W.y, W.w, W.h, 4); ctx.fill();

  /* him, head and shoulders, leaning on the ledge of his own window */
  ctx.save();
  Draw.rr(ctx, W.x, W.y, W.w, W.h, 4); ctx.clip();
  var cx = W.x + W.w / 2;
  ctx.fillStyle = '#3f5f8c';
  ctx.beginPath();
  ctx.moveTo(cx - 30, W.y + W.h);
  ctx.quadraticCurveTo(cx - 26, W.y + 52, cx, W.y + 50);
  ctx.quadraticCurveTo(cx + 26, W.y + 52, cx + 30, W.y + W.h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f0c39a';
  ctx.beginPath(); ctx.arc(cx, W.y + 38, 15, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a3524';
  ctx.beginPath();
  ctx.moveTo(cx - 11, W.y + 40);
  ctx.quadraticCurveTo(cx - 7, W.y + 60, cx + 3, W.y + 58);
  ctx.quadraticCurveTo(cx + 11, W.y + 53, cx + 12, W.y + 40);
  ctx.quadraticCurveTo(cx + 1, W.y + 48, cx - 11, W.y + 40);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#20242f';
  ctx.beginPath(); ctx.arc(cx - 5, W.y + 34, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 5, W.y + 34, 2.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1d2436';
  ctx.beginPath(); ctx.ellipse(cx, W.y + 24, 20, 5, 0, 0, TAU); ctx.fill();
  Draw.rr(ctx, cx - 10, W.y + 8, 20, 17, 4); ctx.fill();
  ctx.restore();

  /* glazing bars, and the frame as a thin line rather than a slab of timber */
  ctx.strokeStyle = 'rgba(20,26,40,.75)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W.x, W.y + W.h * 0.5); ctx.lineTo(W.x + W.w, W.y + W.h * 0.5);
  ctx.stroke();
  ctx.strokeStyle = '#6c5946'; ctx.lineWidth = 4;
  Draw.rr(ctx, W.x, W.y, W.w, W.h, 4); ctx.stroke();
  ctx.restore();

  /* his arm, out of the window and down - thin, and the size of an arm */
  ctx.save();
  /* one forearm's worth, in proportion to the head in the window above it */
  ctx.strokeStyle = '#3f5f8c'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(A.AX + 12, W.y + W.h - 12);
  ctx.quadraticCurveTo(A.AX + 11, A.AY - 26, A.AX + 1, A.AY - 15);
  ctx.stroke();
  ctx.fillStyle = '#f0c39a';
  ctx.beginPath(); ctx.arc(A.AX, A.AY - 11, 8.5, 0, TAU); ctx.fill();
  ctx.restore();

  if (this.pouchCount() > 0) {
    var gold = this.goldWanted() && this.pouchReserve >= 3;
    ctx.save();
    ctx.translate(A.AX, A.AY);
    var g = ctx.createRadialGradient(-3, -3, 1, 0, 0, 10);
    if (gold) { g.addColorStop(0, '#fff0b8'); g.addColorStop(1, '#a97f22'); }
    else { g.addColorStop(0, '#f6e6b4'); g.addColorStop(1, '#8a6a20'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
    ctx.restore();
    if (gold) {
      Draw.textSafe(ctx, 'GOLD! costs 3', A.AX, A.AY + 34, {
        size: 16, maxW: 260, color: C.gold, weight: '900', stroke: 'rgba(0,0,0,.75)', strokeW: 4
      });
    }
  } else {
    Draw.textSafe(ctx, 'WAITING FOR COINS...', A.AX, A.AY + 34, {
      size: 17, maxW: 420, color: C.gold, weight: '900', stroke: 'rgba(0,0,0,.8)', strokeW: 4
    });
  }
};

/* ------------------------------------------------------------ aiming UI */
TzedakaBlast.prototype.drawAim = function (ctx, t) {
  var A = TzedakaBlast, i, v, x, y, vx, vy, sdt, power;
  if (!this.aim) return;
  if (this.pouchCount() < 1) return;

  v = this.aimVel(this.aim);
  power = v.power;
  x = A.AX; y = A.AY; vx = v.vx; vy = v.vy; sdt = 1 / 90;
  ctx.save();

  /* THE FORCE METER. It sits right under the window where you are looking, it
     fills as you pull, and it never moves on its own - what you see is what
     the coin gets. */
  var pw = 128, ph = 13, px = A.AX - pw / 2, pyy = A.AY + 40;
  Draw.rr(ctx, px, pyy, pw, ph, 6);
  ctx.fillStyle = 'rgba(6,10,24,.82)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.stroke();
  if (power > 0.002) {
    ctx.save();
    Draw.rr(ctx, px, pyy, pw, ph, 6); ctx.clip();
    var pg = ctx.createLinearGradient(px, 0, px + pw, 0);
    pg.addColorStop(0, '#5ed6b8');
    pg.addColorStop(0.55, '#ffcf5c');
    pg.addColorStop(1, '#ff8a5c');
    ctx.fillStyle = pg;
    ctx.fillRect(px, pyy, pw * power, ph);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for (var nk = 1; nk < 4; nk++) {
    ctx.beginPath();
    ctx.moveTo(px + (pw / 4) * nk, pyy + 2);
    ctx.lineTo(px + (pw / 4) * nk, pyy + ph - 2);
    ctx.stroke();
  }
  Draw.text(ctx, power < 0.02 ? 'PULL BACK TO THROW' : Math.round(power * 100) + '%',
    A.AX, pyy + ph + 15, {
      size: 16, color: power > 0.6 ? '#ffb07a' : 'rgba(255,255,255,.72)',
      align: 'center', weight: '900'
    });

  /* rubber band from the window to your finger */
  if (power > 0.02 || Math.abs(this.aim.x - A.AX) > 4 || Math.abs(this.aim.y - A.AY) > 4) {
    ctx.strokeStyle = 'rgba(255,207,92,.55)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(A.AX, A.AY);
    ctx.lineTo(this.aim.x, this.aim.y);
    ctx.stroke();
  }

  /* the real slingshot arc - same integrator the coin flies on */
  ctx.strokeStyle = 'rgba(255,255,255,.34)';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.setLineDash([7, 12]);
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (i = 0; i < 500 && y < A.GROUND && x > -40 && x < CFG.W + 40; i++) {
    vx += this.wind * sdt * 0.55;
    vy += A.GRAV * sdt;
    x += vx * sdt;
    y += vy * sdt;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, Math.min(y, A.GROUND), 26, 9, 0, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.ellipse(x, Math.min(y, A.GROUND), 14, 5, 0, 0, TAU); ctx.stroke();
  ctx.restore();
};

/* run the real integrator forward so the preview cannot lie to the player */

TzedakaBlast.prototype.drawWind = function (ctx, t) {
  var A = TzedakaBlast, w = this.wind, i;
  if (Math.abs(w) < 5) return;
  var dir = w > 0 ? 1 : -1;
  var k = clamp(Math.abs(w) / 150, 0.1, 1);

  /* From the windier streets on, the gusts are wide translucent bands that
     sweep the whole window - you can watch one coming and wait it out. */
  if (this.level >= this.cfg.gustFrom && k > 0.45) {
    ctx.save();
    for (i = 0; i < 3; i++) {
      var bh = 74 + i * 26;
      var by = 360 + i * 210;
      var span = CFG.W + 520;
      var bp = ((t * (150 + k * 300) + i * 340) % span) - 260;
      var bx = dir > 0 ? bp : CFG.W - bp;
      var lg = ctx.createLinearGradient(bx - dir * 170, 0, bx + dir * 170, 0);
      lg.addColorStop(0, 'rgba(190,220,255,0)');
      lg.addColorStop(0.5, 'rgba(190,220,255,' + (0.10 + k * 0.13) + ')');
      lg.addColorStop(1, 'rgba(190,220,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(bx - dir * 190, by);
      ctx.quadraticCurveTo(bx, by - 22, bx + dir * 190, by);
      ctx.quadraticCurveTo(bx, by + bh - 22, bx - dir * 190, by + bh);
      ctx.quadraticCurveTo(bx, by + bh + 14, bx - dir * 190, by);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.lineCap = 'round';
  for (i = 0; i < 11; i++) {
    var y = 330 + i * 68 + ((i * 37) % 23);
    if (y > A.GROUND - 24) break;
    var len = 34 + k * 96;
    var ph = (t * (120 + k * 320) + i * 118) % (CFG.W + 300) - 150;
    var x = dir > 0 ? ph : CFG.W - ph;
    var lg2 = ctx.createLinearGradient(x, 0, x + dir * len, 0);
    lg2.addColorStop(0, 'rgba(214,230,255,0)');
    lg2.addColorStop(0.4, 'rgba(214,230,255,' + (0.10 + k * 0.26) + ')');
    lg2.addColorStop(1, 'rgba(214,230,255,0)');
    ctx.strokeStyle = lg2;
    ctx.lineWidth = 2 + k * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + dir * len * 0.5, y - 7, x + dir * len, y);
    ctx.stroke();
  }
  ctx.restore();
};

TzedakaBlast.prototype.drawWindGauge = function (ctx, t) {
  var w = this.wind, A = TzedakaBlast;
  var max = Math.max(40, this.cfg.windMax);
  var k = clamp(Math.abs(w) / max, 0, 1);
  var gx = 22, gy = 150, gw = 176, gh = 52;
  var hot = k > 0.62;
  Draw.panel(ctx, gx, gy, gw, gh, {
    fill: 'rgba(6,10,22,.82)', radius: 12,
    stroke: hot ? 'rgba(150,205,255,.75)' : 'rgba(255,255,255,.18)', strokeW: hot ? 3 : 2
  });
  Draw.text(ctx, 'WIND', gx + 13, gy + 20, { size: 14, color: 'rgba(255,255,255,.55)', weight: '900' });

  /* the needle: a centre line with the bar running out to whichever side */
  var bx = gx + 13, by = gy + 30, bw = gw - 26, mid = bx + bw / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  Draw.rr(ctx, bx, by, bw, 10, 5); ctx.fill();
  if (Math.abs(w) >= 5) {
    var len = (bw / 2) * k;
    var dir = w > 0 ? 1 : -1;
    ctx.fillStyle = hot ? '#8fc4ff' : 'rgba(150,205,255,.8)';
    Draw.rr(ctx, dir > 0 ? mid : mid - len, by, len, 10, 5); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(mid, by - 3); ctx.lineTo(mid, by + 13); ctx.stroke();
  ctx.restore();

  if (Math.abs(w) < 5) {
    Draw.text(ctx, 'still', gx + gw - 13, gy + 20, {
      size: 14, color: 'rgba(255,255,255,.4)', align: 'right', weight: '800'
    });
  } else {
    var arrow = w > 0 ? '→' : '←';
    Draw.text(ctx, arrow + (hot ? ' strong' : ''), gx + gw - 13, gy + 20, {
      size: 15, color: hot ? '#8fc4ff' : 'rgba(150,205,255,.85)', align: 'right', weight: '900'
    });
  }
};

TzedakaBlast.prototype.drawBanner = function (ctx) {
  var b = this.banner;
  if (!b) return;
  var a = clamp(b.t / Math.min(0.45, b.max), 0, 1);
  ctx.save();
  ctx.globalAlpha = a * (b.soft ? 0.94 : 1);
  Draw.panel(ctx, 40, 296, CFG.W - 80, b.sub ? 84 : 56, {
    fill: b.soft ? 'rgba(10,16,32,.9)' : 'rgba(6,10,26,.92)', radius: 16,
    stroke: b.soft ? 'rgba(255,255,255,.22)' : b.color, strokeW: b.soft ? 2 : 3,
    glow: b.soft ? null : b.color, glowBlur: 22
  });
  Draw.textSafe(ctx, b.title, CFG.W / 2, 332, { size: b.soft ? 25 : 28, maxW: CFG.W - 130, color: b.color, weight: '900' });
  if (b.sub) Draw.textSafe(ctx, b.sub, CFG.W / 2, 362, { size: 18, maxW: CFG.W - 130, color: 'rgba(255,255,255,.78)', weight: '800' });
  ctx.restore();
};

/* ------------------------------------------------------------------ HUD */
TzedakaBlast.prototype.renderHud = function (ctx, y) {
  var A = TzedakaBlast, i;
  var top = A.BAND + 6;
  ctx.save();
  ctx.fillStyle = 'rgba(4,7,16,.9)';
  ctx.fillRect(0, A.BAND, CFG.W, CFG.H - A.BAND);
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, A.BAND); ctx.lineTo(CFG.W, A.BAND); ctx.stroke();
  ctx.restore();

  /* row 1 - the street and the clock */
  var late = this.left < 14;
  Draw.panel(ctx, 22, top, 330, 58, { fill: 'rgba(10,15,30,.9)', radius: 13, stroke: 'rgba(255,255,255,.14)' });
  Draw.text(ctx, this.cfg.purim ? 'PURIM' : ('STREET ' + this.level), 40, top + 24, {
    size: 19, color: this.cfg.purim ? '#c9adff' : C.gold, weight: '900'
  });
  Draw.text(ctx, mmss(Math.max(0, this.left)), 334, top + 24, {
    size: 20, color: late ? C.red : 'rgba(255,255,255,.75)', align: 'right', weight: '800'
  });
  Draw.text(ctx, 'HELPED ' + this.served + '/' + this.need, 40, top + 48, {
    size: 16, color: 'rgba(255,255,255,.6)', weight: '800'
  });
  Draw.meter(ctx, 178, top + 38, 156, 12, clamp(this.served / this.need, 0, 1), { fg: C.teal, gloss: false });

  /* row 1 right - the purse (smooth reserve bar like an overheating gun) */
  Draw.panel(ctx, 368, top, 330, 58, { fill: 'rgba(10,15,30,.9)', radius: 13, stroke: 'rgba(255,255,255,.14)' });
  var pFill = this.pouchFill();
  var pCount = this.pouchCount();
  var pLow = pFill <= 0.35;
  var pDry = this.dryLock || this.pouchReserve < 1;
  Icons.draw(ctx, 'coin', 400, top + 28, 30, pDry ? 'rgba(255,255,255,.25)' : (pLow ? '#ffb07a' : C.gold));
  Draw.text(ctx, pCount + ' / ' + this.pouchMax, 426, top + 26, {
    size: 23, color: pDry ? C.red : (pLow ? '#ffb07a' : C.gold), weight: '900'
  });
  if (this.combo > 1) {
    Draw.text(ctx, 'STREAK x' + this.combo + (this.fever > 0 ? ' !' : ''), 682, top + 26, {
      size: 18, color: this.fever > 0 ? C.teal : C.gold, align: 'right', weight: '900'
    });
  }
  if (pDry) {
    Draw.text(ctx, 'RELOAD ' + Math.ceil(Math.max(0, this.refillT)) + 's', 426, top + 48, {
      size: 13, color: C.red, weight: '800'
    });
    Draw.meter(ctx, 540, top + 40, 142, 8, 1 - clamp(this.refillT / this.cfg.refillDry, 0, 1),
      { fg: C.red, gloss: false });
  } else if (pFill < 1) {
    Draw.text(ctx, pLow ? 'PACE YOURSELF...' : 'catching breath', 426, top + 48, {
      size: 13, color: pLow ? '#ffb07a' : 'rgba(255,255,255,.55)', weight: '800'
    });
    Draw.meter(ctx, 540, top + 40, 142, 8, pFill, {
      fg: pLow ? '#ffb07a' : C.teal, gloss: false
    });
  } else if (this.fever > 0) {
    Draw.text(ctx, 'DOUBLE POINTS!', 682, top + 48, {
      size: 13, color: C.teal, align: 'right', weight: '800'
    });
  }

  /* row 2 - how fast the coin falls, which sets how far ahead you must aim */
  var bw = CFG.W - 96, bx = 48, by = top + 84;
  var charging = !!(this.aim && this.pouchCount() > 0);
  Draw.panel(ctx, bx - 14, by - 12, bw + 28, 58, {
    fill: 'rgba(10,15,30,.9)', radius: 13,
    stroke: charging ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.12)', strokeW: charging ? 3 : 2
  });
  ctx.save();
  ctx.globalAlpha = charging ? 0.9 : 0.35;
  var pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, 'rgba(53,214,196,.35)');
  pg.addColorStop(1, 'rgba(255,207,92,.45)');
  ctx.fillStyle = pg;
  Draw.rr(ctx, bx, by, bw, 20, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
  Draw.rr(ctx, bx, by, bw, 20, 6); ctx.stroke();
  ctx.restore();
  if (charging) {
    var hx = bx + bw * clamp(this.charge, 0, 1);
    ctx.save();
    ctx.fillStyle = '#ffffff';
    Draw.rr(ctx, hx - 3, by - 7, 6, 34, 3); ctx.fill();
    ctx.restore();
    Draw.text(ctx, 'GENTLE', bx + 6, by + 38, { size: 13, color: 'rgba(53,214,196,.9)', weight: '900' });
    Draw.text(ctx, 'HARD', bx + bw - 6, by + 38, { size: 13, color: 'rgba(255,207,92,.9)', align: 'right', weight: '900' });
  } else {
    Draw.text(ctx, 'PULL BACK TO THROW   -   DOWN LOBS UP', bx + bw / 2, by + 38, {
      size: 15, color: 'rgba(255,255,255,.55)', align: 'center', weight: '800'
    });
  }
};

TzedakaBlast.prototype.renderPrompts = function () {};

/* ==========================================================================
   18. BOOT
   ========================================================================== */
function bootMitzvahDash() {
  Game.init();
  /* first user gesture unlocks WebAudio on iOS/Android */
  var unlock = function () {
    Sound.resume();
    if (Game.state === 'MENU' || Game.state === 'GALLERY') Sound.playMusic('menu');
    window.removeEventListener('touchstart', unlock);
    window.removeEventListener('pointerdown', unlock);
    window.removeEventListener('keydown', unlock);
  };
  window.addEventListener('touchstart', unlock, { passive: true });
  window.addEventListener('pointerdown', unlock, { passive: true });
  window.addEventListener('keydown', unlock, { passive: true });

  /* keep layouts glued to the safe area after rotation / keyboard / resize */
  var relayout = function () {
    View.resize();
    Screens.buildMenu();
    var keepScroll = Screens.gallery.scroll;
    Screens.buildGallery();
    Screens.gallery.scroll = clamp(keepScroll, 0, Screens.gallery.maxScroll);
    if (Game.state === 'PAUSED') Screens.buildPause();
    if (Game.state === 'GAME_OVER') Screens.buildGameOver();
    if (Game.state === 'INTRO' && Game.scene) Screens.buildIntro(Game.scene);
    Screens.buildPopup();
  };
  window.addEventListener('resize', relayout, false);
  window.addEventListener('orientationchange', function () { setTimeout(relayout, 160); }, false);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(bootMitzvahDash, 0);
} else {
  document.addEventListener('DOMContentLoaded', bootMitzvahDash, false);
}

/* Expose a tiny surface for native shells / QA harnesses. */
window.MitzvahDash = {
  version: CFG.VERSION,
  game: Game,
  profile: Profile,
  halacha: Halacha,
  nusach: Nusach,
  start: function (id) { Game.startGame(id); Game.beginPlay(); },
  menu: function () { Game.quitToMenu(); },
  resetProfile: function () {
    Store.write(CFG.SAVE_KEY, JSON.stringify(Profile.blank()));
    Profile.load();
  }
};
