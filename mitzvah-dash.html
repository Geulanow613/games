/* ==========================================================================
   GAME 5 - TZEDAKA BLAST  (Get it into their hands)
   You lean out of your window over a market street. Pull BACK like a
   slingshot - drag left or right to aim, pull up for zip - and let go.
   Gravity draws a real arc, so somebody off to the side is still reachable.
   The dotted line is that arc, wind and all.

   Nothing here costs a life and nothing flashes red at you. Missing is just
   missing. Every target is a real opening you can see - a palm, the slot in a
   pushka, the mouth of a sack, a cart tray. Nothing invisible, nothing to
   judge. The halacha lives in what scores well and on the cards afterwards;
   the banners during play stay short and plain.
   ========================================================================== */
function TzedakaBlast() {
  MiniGame.call(this, 'tzedaka', 'Tzedaka Blast');
  this.tips = [
    'Pull BACK like a slingshot. Drag sideways from the window to aim - it stays.',
    'Pull UP for a hard drop. Pull DOWN to lob the coin up in the air.',
    'Fancy coat + no hand out = he already ate. Save it for an open palm!',
    'People walk. Throw where he is GOING, not where he is.',
    'Toss too fast and you overheat. Chill a sec and the bar climbs back.'
  ];
}
TzedakaBlast.prototype = Object.create(MiniGame.prototype);
TzedakaBlast.prototype.constructor = TzedakaBlast;

/* Chapters: the streets you can jump straight to once you have walked them.
   Street 1 is always open; finishing a street opens the next one for good. */
TzedakaBlast.prototype.chapters = function () {
  return { count: TzedakaBlast.STREETS, word: 'STREET', key: 'tzedaka' };
};
TzedakaBlast.prototype.startAt = function (n) {
  this.level = clamp(n | 0, 1, TzedakaBlast.STREETS);
  this.setupStreet();
};

/* -------------------------------------------------- per-street difficulty */
/* Twelve streets. Everything below is a straight line in the street number, so
   the curve is readable and every step is provable in the audit. */
TzedakaBlast.STREETS = 12;

TzedakaBlast.prototype.tune = function () {
  var n = clamp(this.level, 1, TzedakaBlast.STREETS);
  var purim = n >= TzedakaBlast.STREETS;
  var late = Math.max(0, n - 4);                       /* 0 until street 5  */
  return {
    /* The street is not a crowd of poor people any more. There are only ever
       two or three walking at once, so every one of them counts and the quota
       has to come down to match - what makes it hard is landing the coin, not
       finding somebody to land it on. */
    /* One poor man crossing at a time from street 5 on, two before that and
       two again on Purim. He is the only one who needs you, so he is the whole
       point of the street, and the quota comes down to match. */
    goal:      Math.round(2.5 + n * 0.28) + (purim ? 2 : 0),             /* people to help     */
    maxPoor:   (n <= 4 || purim || n >= 11) ? 2 : 1,
    gentMax:   n >= 10 ? 8 : (n >= 7 ? 7 : (n >= 4 ? 5 : 4)),
    /* the clock ramps up to the old flat 74s by street 6 - the early streets
       have a low goal and do not need a full 74 seconds to clear it */
    dur:       Math.min(74, 46 + n * 5) + (n > 6 ? 8 : 0) + (n >= 10 ? 4 : 0),
    spawnEvery: Math.max(1.05, 3.4 - n * 0.19),
    /* They get properly quick, and by a step every single street. From street 5
       the cobbles pick up a bit extra; the audit still holds the street-8
       throw window above a fifth of a second. */
    walkMin:   46 + n * 6.0 + late * 2.2,
    walkMax:   72 + n * 7.6 + late * 2.8,
    patience:  Math.max(6.2, 15.5 - n * 0.72),
    /* Hold one direction for a long stretch. Strength can puff up and down;
       flipping left-to-right is rare and only starts later. */
    windEvery: Math.max(12, 22 - n * 0.7),
    windMax:   34 + n * 11 + late * 3,
    gustFrom:  5,                                      /* visible wave bands  */
    /* Heavy-duty gun pacing: chill between throws and coins drip back in.
       Spam until empty, then six seconds for a full reload. */
    pouchMax:  purim ? 12 : (n >= 8 ? 10 : 8),
    refillDry: 6,
    refillTick: 2.6,
    pigeon:    n >= 5 ? Math.max(5.2, 20 - n * 1.15) : 999,
    pigeonMax: n >= 10 ? 3 : (n >= 7 ? 2 : 1),
    pigeonDive: n >= 8,
    /* a big wagon standing in the near road. It rolls, so it is a thing to
       time rather than a wall - and it is IN the street, which is the only
       kind of obstacle that makes any sense from a window above one. */
    wagon:     n >= 2 ? Math.max(8.5, 26 - n * 1.15) : 999,
    wagonMax:  n >= 8 ? 2 : 1,
    ice:       n === 7,
    umbrellas: n >= 9,
    /* Regular people walk every street, including the first. Finding the open
       hand in a pavement of good coats IS the early game - easy on street 1
       because they stroll, and they still bounce a coin if you hit the near lane. */
    gentEvery: Math.max(0.62, 2.55 - n * 0.16),
    kinds:     TzedakaBlast.prototype.kindsFor(n),
    purim:     purim,
    mult:      purim ? 2 : 1
  };
};

/* one new way of giving per street - nothing ever gets taken away */
TzedakaBlast.prototype.kindsFor = function (n) {
  var k = ['hand', 'hand', 'pushka'];
  if (n >= 2) k.push('pushka', 'basket');
  if (n >= 3) k.push('hand');
  if (n >= 4) k.push('pushka', 'basket');
  if (n >= 5) k.push('basket', 'hand');
  if (n >= 6) k.push('kupah');
  if (n >= 7) k.push('loan');
  if (n >= 8) k.push('kupah', 'hand');
  if (n >= 9) k.push('loan', 'basket');
  if (n >= 10) k.push('hand', 'pushka');
  if (n >= 11) k.push('basket', 'kupah');
  if (n >= 12) k = k.concat(['hand', 'pushka', 'hand', 'basket', 'pushka']);
  return k;
};
/* --------------------------------------------------------------- new run */
TzedakaBlast.prototype.reset = function () {
  this.score = 0; this.combo = 0;
  /* Nothing in Tzedaka Blast costs a life. The only thing that ends a run is
     the clock running out before you land enough coins. */
  this.lives = 1; this.maxLives = 0;
  this.level = 1; this.elapsed = 0; this.mult = 1;
  this.helped = 0; this.handed = 0; this.seterGiven = 0; this.unasked = 0;
  this.kupahGiven = 0; this.loansMade = 0; this.wordsSaid = 0;
  this.clutchSaves = 0; this.stoops = 0; this.streets = 0; this.windGiven = 0;
  this.hungry = false; this.drySaid = false;
  this.gentHits = 0; this.cleanStreets = 0;
  this.missed = 0; this.missedTotal = 0;
  this.purimClean = false;
  this.introduced = {};
  this.setupStreet();
};

TzedakaBlast.prototype.setupStreet = function () {
  var t = this.tune();
  this.cfg = t;
  this.left = t.dur;
  this.need = t.goal;
  this.served = 0;
  this.people = [];
  this.coins = [];
  this.pigeons = [];
  this.gents = [];
  this.wagons = [];
  this.flakes = [];
  this.motes = [];
  this.pouchMax = t.pouchMax;
  this.pouchReserve = t.pouchMax;
  this.refillT = t.refillTick;
  this.dryLock = false;
  this.windDir = chance(0.5) ? 1 : -1;
  this.windTarget = this.windDir * rand(t.windMax * 0.4, t.windMax * 0.85);
  this.wind = this.windTarget;
  this.windT = rand(t.windEvery * 0.75, t.windEvery * 1.1);
  this.missed = 0;   /* per street - the Purim bonus asks about THIS street */
  this.charge = 0; this.chargeDir = 1;
  this.aim = null;
  this.fever = 0;
  this.banner = null;
  this.walkCycle = 0;
  this.personId = 0;
  this.mult = t.mult;
  if (t.purim) this.purimTotal = 0;
  this.seeding = true;
  this.spawnPerson();
  this.spawnT = rand(0.9, 1.6);
  this.pigeonT = t.pigeon;
  this.wagonT = rand(t.wagon * 0.45, t.wagon);
  var gi, wantGents = this.level <= 2 ? 2 : 3;
  for (gi = 0; gi < wantGents; gi++) this.spawnGent();
  this.gentT = rand(0.7, 1.4);
  this.seeding = false;
  this.streetGentHits = 0;
  var wt = this.scene().weather;
  if (wt) {
    for (var f = 0; f < (wt === 'snow' ? 140 : 90); f++) {
      this.flakes.push({ x: rand(-40, CFG.W + 40), y: rand(0, CFG.H),
        sp: wt === 'snow' ? rand(26, 62) : rand(420, 700),
        sw: rand(0, TAU), r: wt === 'snow' ? rand(1.6, 3.4) : rand(0.9, 1.6) });
    }
  }
  this.hungry = false;
  this.drySaid = false;
  if (this.gents.length) this.metGent = true;
};

/* Nothing hangs over the road. An awning on a shopfront cannot stop a coin
   thrown into the street, and pretending otherwise was only ever a way of
   making the throw harder without making it more interesting.

   What CAN be in the way is whatever is genuinely standing in the street with
   you: the wind, the birds, a big wagon rolling through the near lane, and the
   gentlemen in good coats who are walking the same pavement as everybody else.
   All four move. None of them is a wall. */

/* ==========================================================================
   SPAWNING
   ========================================================================== */
TzedakaBlast.prototype.spawnPerson = function () {
  var t = this.cfg;
  var kind = pick(t.kinds);
  if (kind === 'loan' && this.people.filter(function (p) { return p.kind === 'loan'; }).length) kind = 'pushka';
  if (kind === 'kupah' && this.people.filter(function (p) { return p.kind === 'kupah'; }).length) kind = 'basket';
  var def = TzedakaBlast.KINDS[kind];
  var dir = chance(0.5) ? 1 : -1;
  var lane = this.freeLane(dir);
  if (lane < 0) return null;
  var sp = rand(t.walkMin, t.walkMax) * (kind === 'kupah' ? 1.35 : 1);
  var p = {
    id: ++this.personId,
    kind: kind, def: def,
    lane: lane, y: TzedakaBlast.LANES[lane],
    dir: dir,
    x: dir > 0 ? -90 : CFG.W + 90,
    sp: sp,
    ch: randInt(0, TzedakaBlast.PEOPLE.length - 1),
    sz: rand(TzedakaBlast.SIZE_MIN, TzedakaBlast.SIZE_MAX),
    phase: rand(0, TAU),
    patience: t.patience, maxPat: t.patience,
    served: false, gone: false, shamed: false,
    flash: 0, joy: 0, pending: 0, hint: 0,
    ice: !!t.ice, slip: 0, slipT: t.ice ? rand(0.7, 2.2) : 999
  };
  if (kind === 'loan') { p.sp *= 0.55; p.patience = p.maxPat = t.patience * 1.7; }
  this.people.push(p);
  if (!this.introduced[kind]) {
    this.introduced[kind] = true;
    this.introduce(kind);
  }
  return p;
};

/* pick the lane whose entry side is clearest, so nobody walks into a pile-up */
TzedakaBlast.prototype.freeLane = function (dir, need) {
  var A = TzedakaBlast, best = -1, bestGap = -1;
  /* gentlemen walk the same pavement, so they count for spacing too */
  var walking = this.people.concat(this.gents || []);
  for (var l = 0; l < A.LANES.length; l++) {
    var gap = 1e9;
    for (var i = 0; i < walking.length; i++) {
      var p = walking[i];
      if (p.lane !== l) continue;
      var d = dir > 0 ? p.x + 90 : CFG.W + 90 - p.x;
      if (d < gap) gap = d;
    }
    if (gap > bestGap) { bestGap = gap; best = l; }
  }
  return bestGap < (need || 190) ? -1 : best;
};

TzedakaBlast.prototype.introduce = function (kind) {
  var lines = {
    hand:   ['OPEN HAND!', 'that is the jackpot - drop it in the palm'],
    pushka: ['A PUSHKA!', 'tiny slot. clink!'],
    basket: ['GIANT SACK!', 'wide open. dunk it!'],
    kupah:  ['TOWN CART!'],
    loan:   ['BROKEN CART!', 'lend him GOLD. he pays you back. top move!']
  };
  var l = lines[kind];
  if (l) this.say(l[0], l[1], C.gold, 3);
};

/* A quiet, warm aside. Never red, never shaken onto the screen - this game
   teaches by explaining, not by startling you. */
TzedakaBlast.prototype.note = function (title, sub, color) {
  this.banner = { title: title, sub: sub || '', color: color || C.teal, t: 3.0, max: 3.0, soft: true };
};

TzedakaBlast.prototype.say = function (title, sub, color, dur) {
  this.banner = { title: title, sub: sub || '', color: color || C.gold, t: dur || 3, max: dur || 3 };
};

/* The one thing that gets between your window and his hand. Deliberately slow:
   you are meant to see it coming, count it, and throw around it - not be
   ambushed by it. Higher streets only. */
TzedakaBlast.prototype.spawnPigeon = function () {
  var t = this.cfg || this.tune();
  var dir = chance(0.5) ? 1 : -1;
  var fast = t.pigeonDive ? rand(64, 96) : rand(52, 84);
  this.pigeons.push({
    x: dir > 0 ? -70 : CFG.W + 70, y: rand(470, 760),
    dir: dir, sp: fast, flap: rand(0, TAU),
    carrying: null, dead: false, dive: false
  });
  if (!this.metPigeon) {
    this.metPigeon = true;
    this.say('PIGEON ALERT!', 'tap him or he eats your coin for lunch', C.gold, 3);
  } else if (t.pigeonDive && !this.metDive) {
    this.metDive = true;
    this.say('DIVE BOMB!', 'now they swoop - tap fast!', C.gold, 3);
  }
};

/* --------------------------------------------------------- the gentlemen */
/* Not everybody walking the street needs your coin. These men are doing fine:
   good coat, silk hat, stick, both hands busy. They never put a hand out, so
   there is nothing on them to aim into - and a coin that hits one bounces off
   and is gone. They make the street crowded, which is the point of them. */
TzedakaBlast.GENTS = [
  { coat:'#20263a', hat:'#0e1220', skin:'#f0c39a', trim:'#c9a24a' },
  { coat:'#33202c', hat:'#180d14', skin:'#f6d3ae', trim:'#b9903c' },

  var pull = Math.sqrt(pullX * pullX + dragUp * dragUp + dragDown * dragDown);

   you first touched). Pull up = zip downward. Pull down = lob upward. */
TzedakaBlast.prototype.aimVel = function (a) {
  var A = TzedakaBlast;
  if (!a) return { vx: 0, vy: A.VY_MIN, power: 0 };
  var pullX = a.x - A.AX;
  var dragUp = a.sy - a.y, dragDown = a.y - a.sy;
  var power = this.aimPower(a);
  var hPow = Math.max(power, Math.abs(pullX) / A.PULL_SPAN);

TzedakaBlast.prototype.dropTime = function (speed, y) {

TzedakaBlast.prototype.handle = function (ev) {
  var A = TzedakaBlast;

    this.aim = { id: ev.id, x: ev.x, y: ev.y, sx: ev.x, sy: ev.y, mode: 'charge', t: 0 };

  if (ev.type === 'move' && this.aim && this.aim.id === ev.id) {
    this.aim.x = ev.x; this.aim.y = ev.y;
    /* One gesture, no modes to flip between: sideways aims it, up powers it. */
    this.charge = this.aimPower(this.aim);

    var a = this.aim;
    this.aim = null;
    /* a quick flick of the finger at a pigeon is a shoo, not a throw */
    if (a.t < 0.24 && this.aimPower(a) < 0.1 && this.scarePigeon(ev.x, ev.y)) return;

    var gold = this.goldWanted();
    if (gold && this.pouchReserve < 3) gold = false;
    var v = this.aimVel(a);
    this.charge = v.power;
    this.throwCoin(v.vx, v.vy, 'sling', gold);
    if (this.charge > 0.6) Sound.sfx('whoosh');

/* ==========================================================================
   TARGETS
   ========================================================================== */
/* The target is the opening itself - the palm of his hand, the slot in the tin,
   the mouth of the sack. Not his coat, not his hat.

   p.lift is how far off the ground the whole man is drawn this instant: he bobs
   as he walks, he jumps a little when you reach him, and he bends right down
   when a coin lands in the dust beside him. The box HAS to carry that with him.
   It used to not, and a man stooping for a dropped coin had his hand drawn
   fourteen pixels away from the thing the coin was actually tested against - so
   you could watch a coin go straight through his open palm and score nothing.
   One number, in one place, used by both the drawing and the hit test. */
TzedakaBlast.prototype.personLift = function (p) {
  var bob = Math.abs(Math.cos(p.phase || 0)) * 3;
  var stoop = p.stoop > 0 ? Math.sin((1.2 - p.stoop) * 6) * 14 : 0;
  var joy = p.joy > 0 ? Math.abs(Math.sin(p.joy * 9)) * 6 : 0;
  return bob + joy - stoop;
};

TzedakaBlast.prototype.targetBox = function (p) {
  var d = p.dir, z = this.personSize(p);
  var y = p.y - (p.lift == null ? this.personLift(p) : p.lift);
  var box = function (ox, oy, w, h) {
    return { x: p.x + d * ox * z - (w * z) / 2, y: y - oy * z, w: w * z, h: h * z };
  };
  switch (p.kind) {
    case 'hand':   return box(46, 81, 38, 14);
    case 'pushka': return box(46, 124, 34, 16);
    case 'basket': return box(-32, 130, 38, 16);
    case 'kupah':  return box(-54, 129, 38, 14);
    case 'loan':   return box(-50, 116, 48, 20);
  }
  return box(0, 89, 36, 18);
};

/* How close the coin itself has to be. Four pixels, measured from the middle
   of the coin - it has to go IN, not merely brush past him. */
TzedakaBlast.CATCH = 4;

/* the furthest a coin may travel between two hit tests. Must stay well under
   the height of the smallest opening in the game, which is 14. */
TzedakaBlast.STEP_PX = 3;
TzedakaBlast.POP_LIFE = 3;

/* floating street chatter - holds long enough to read the funny lines */
TzedakaBlast.prototype.pop = function (x, y, str, color, size) {

/* ==========================================================================
   UPDATE
   ========================================================================== */
TzedakaBlast.prototype.update = function (dt) {
  var A = TzedakaBlast, t = this.cfg, i;
  this.elapsed += dt;
  this.walkCycle += dt;
  if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
  if (this.fever > 0) { this.fever -= dt; if (this.fever <= 0) this.mult = t.mult; }

  /* No ping-pong meter any more. The power is wherever your finger is, so a
     throw is never a matter of catching a bar at the right instant. */
  if (this.aim) {
    this.aim.t += dt;
    this.charge = this.aimPower(this.aim);
  }

  /* Purse regen: drip back while you chill; six-second full reload if you overheat */
  if (this.dryLock || this.pouchReserve < 1) {
    if (!this.dryLock) this.refillT = t.refillDry;
    this.dryLock = true;
    this.refillT -= dt;
    if (this.refillT <= 0) {
      this.pouchReserve = this.pouchMax;
      this.dryLock = false;
      this.refillT = t.refillTick;
      this.drySaid = false;
      this.hungry = true;
      Sound.sfx('coin');
      Haptics.light();
      FX.burst(TzedakaBlast.AX, TzedakaBlast.AY, { n: 10, color: C.gold, spdMax: 180 });
      this.say('POCKET\'S FULL!', 'go go go!', C.gold, 3);
    }
  } else if (this.pouchReserve < this.pouchMax) {
    this.pouchReserve = Math.min(this.pouchMax, this.pouchReserve + dt / t.refillTick);
  } else {
    this.refillT = t.refillTick;
  }

  /* Wind stays one way for a long stretch. Strength puffs; reverse is rare. */
  this.windT -= dt;
  if (this.windT <= 0) {
    this.windT = rand(t.windEvery * 0.85, t.windEvery * 1.25);
    if (this.level >= 5 && chance(0.22)) this.windDir *= -1;
    if (!this.windDir) this.windDir = chance(0.5) ? 1 : -1;
    this.windTarget = this.windDir * rand(t.windMax * 0.35, t.windMax);
    if (Math.abs(this.windTarget) > t.windMax * 0.55) Sound.sfx('wind');
  }
  this.wind += (this.windTarget - this.wind) * Math.min(1, dt * 0.55);

  /* Move the street first, THEN the coin through it. The other way round
     tested every coin against where everybody stood a frame ago, which on a
     bobbing target is a pixel or three of pure unfairness. */
  this.updatePeople(dt);
  this.updateGents(dt);
  this.updateWagons(dt);
  this.updatePigeons(dt);
  this.updateCoins(dt);
  this.updateWeather(dt);

  /* spawns */
  this.spawnT -= dt;
  if (this.spawnT <= 0) {
    this.spawnT = rand(t.spawnEvery * 0.75, t.spawnEvery * 1.3);
    /* The poor man's slot is his own. Nothing else can take it. */
    if (this.people.length < t.maxPoor) this.spawnPerson();
  }
  /* and when the street has nobody on it who needs you, the next one is
     already on his way in - a long empty pavement is just dead time */
  if (this.people.length === 0 && this.spawnT > 0.55) this.spawnT = 0.55;
  this.gentT -= dt;
  if (this.gentT <= 0) {
    this.gentT = rand(t.gentEvery * 0.7, t.gentEvery * 1.35);
    if (this.gents.length < t.gentMax) this.spawnGent();
  }
  this.pigeonT -= dt;
  if (this.pigeonT <= 0) {
    this.pigeonT = rand(t.pigeon * 0.8, t.pigeon * 1.5);
    if (this.pigeons.length < (t.pigeonMax || 1)) this.spawnPigeon();
  }
  this.wagonT -= dt;
  if (this.wagonT <= 0) {
    this.wagonT = rand(t.wagon * 0.85, t.wagon * 1.5);
    if (this.wagons.length < (t.wagonMax || 1)) this.spawnWagon();
  }

  /* the street closes */
  this.left -= dt;
  if (this.left <= 0 && this.lives > 0) this.closeStreet();
};

TzedakaBlast.prototype.updateCoins = function (dt) {
  var A = TzedakaBlast, i, s;
  for (i = this.coins.length - 1; i >= 0; i--) {
    var c = this.coins[i];
    if (c.held) continue;
    c.life += dt;
    c.spin += c.spinV * dt;
    /* The hit test is a point test, so a coin may never move further in one
       step than the thing it is aimed at is tall. The smallest opening in the
       game is 14px; step no more than STEP_PX and it cannot be jumped over.
       At full charge that is sixteen steps a frame, which is nothing. */
    var travel = Math.abs(c.vy) * dt + Math.abs(c.vx) * dt;
    var steps = clamp(Math.ceil(travel / A.STEP_PX), 4, 24), sdt = dt / steps;
    for (s = 0; s < steps && !c.dead; s++) {
      c.px = c.x; c.py = c.y;
      c.vx += this.wind * sdt * (c.mode === 'drop' ? 1 : 0.55);
      if (c.mode === 'drop') c.x += this.wind * A.WIND_PUSH * sdt;
      if (c.mode === 'sling') c.vy += A.GRAV * sdt;
      c.x += c.vx * sdt;
      c.y += c.vy * sdt;
      this.coinHits(c);
    }
    if (!c.dead) {
      c.trail.push(c.x, c.y);
      if (c.trail.length > 16) c.trail.splice(0, 2);
    }
    if (c.dead || c.x < -80 || c.x > CFG.W + 80 || c.life > 8) this.coins.splice(i, 1);
  }
};

/* one coin against everything solid, in the order it would actually meet them */
TzedakaBlast.prototype.coinHits = function (c) {
  var A = TzedakaBlast, i;

  /* a pigeon on the wing will take it right out of the air */
  for (i = 0; i < this.pigeons.length; i++) {
    var g = this.pigeons[i];
    if (g.dead || g.carrying) continue;
    if (distance(c.x, c.y, g.x, g.y) < 34) {
      /* mark it dead and let the owning loop remove it - splicing the array
         from in here deletes whichever coin shifts into the freed index */
      g.carrying = c; c.held = true; c.dead = true; c.stolen = true;
      this.pop(g.x, g.y - 30, 'BIRD SNACK!', 'rgba(255,190,120,.95)', 24);
      Sound.sfx('bad');
      this.breakCombo();
      return;
    }
  }

  /* the wagon standing in the near lane - a coin that lands on its roof is
     on the roof, and that is that */
  for (i = 0; i < this.wagons.length; i++) {
    if (MatzahHavoc.circleRect(c.x, c.y, c.r, this.wagonBox(this.wagons[i]))) {
      this.pop(c.x, A.WAGON_TOP - 34, 'BONK!', 'rgba(255,255,255,.5)', 22);
      Sound.sfx('tap');
      this.breakCombo();
      c.dead = true;
      return;
    }
  }

  /* People first, ALWAYS. If a coin can land in somebody's hand it lands in
     it - no bystander gets to steal a throw that was on target. */
  for (i = 0; i < this.people.length; i++) {
    var p = this.people[i];
    if (p.served || p.gone) continue;
    var b = this.targetBox(p);
    if (MatzahHavoc.circleRect(c.x, c.y, A.CATCH, b)) {
      this.landPerson(p, c);
      c.dead = true;
      return;
    }
  }

  /* A gentleman in a good coat. He only gets in the way when he is walking the
     NEAREST lane - the one between you and everybody else. A man further up
     the street is further away, so the coin passes in front of him however
     much of the screen he happens to be standing on. */
  if (!c.offGent) {
    for (i = 0; i < this.gents.length; i++) {
      var gt = this.gents[i];
      if (!this.blocksHere(gt)) continue;
      if (MatzahHavoc.circleRect(c.x, c.y, c.r, this.gentBox(gt))) {
        c.offGent = true;
        c.mode = 'sling';
        c.vy = -Math.abs(c.vy) * 0.16 - 40;
        c.vx = (c.x < gt.x ? -1 : 1) * rand(80, 170);
        gt.bump = 0.5;
        this.gentHits++;
        this.streetGentHits++;
        var gLine = this.gentBounceLine();
        this.pop(gt.x, gt.y - 176 * (gt.sz || 1), gLine, 'rgba(220,206,255,.85)',
          gLine.length > 16 ? 18 : 22);
        Sound.sfx('back');
        this.breakCombo();
        return;
      }
    }
  }

  /* the street itself */
  if (c.y > A.GROUND) {
    this.landStreet(c);
    c.dead = true;
  }
};

/* ==========================================================================
   WHAT HAPPENS WHEN A COIN ARRIVES
   ========================================================================== */
TzedakaBlast.prototype.landPerson = function (p, c) {
  /* the loan wants the gold, not a coin off the top */
  if (p.kind === 'loan' && !c.gold) {
    this.addScore(60, p.x, p.y - 150, 'GOLD ONLY +60', C.teal);
    p.flash = 0.4;
    Sound.sfx('good');
    return;
  }

  if (!p.def) return;
  var pts = p.def.pts;
  var clutch = !!(p.hint || p.patience < p.maxPat * 0.32);

  /* the sack still counts for the silent-giving badge - no lecture mid-throw */
  if (p.kind === 'basket') {
    this.seterGiven++;
    if (this.seterGiven >= 10) this.award('b_seter');
  }

  p.served = true;
  p.joy = 1.4;
  p.flash = 0.5;
  this.served++;
  this.helped++;
  this.handed++;
  if (this.handed >= 25) this.award('b_hand');
  /* landed it with the street blowing - the hard version of the same throw */
  if (Math.abs(this.wind) > this.cfg.windMax * 0.55) {
    this.windGiven++;
    if (this.windGiven >= 12) this.award('b_gale');
  }

  this.hitCombo();
  if (this.combo === 3) this.pop(p.x, p.y - 214, 'NICE!', C.teal, 28);
  else if (this.combo === 5) this.pop(p.x, p.y - 214, 'STREAK!', C.gold, 30);
  else if (this.combo === 8) this.pop(p.x, p.y - 214, 'UNSTOPPABLE!', C.gold, 32);
  if (clutch) {
    pts = Math.round(pts * 1.35);
    this.clutchSaves++;
    if (this.clutchSaves >= 8) this.award('b_kedimah');
    this.pop(p.x, p.y - 186, 'JUST IN TIME!', C.teal, 24);
  }
  if (this.hungry) {
    this.hungry = false;
    this.wordsSaid++;
    if (this.wordsSaid >= 10) this.award('b_words');
  }
  if (this.combo >= 20) this.award('b_ribui');
  if (this.combo > 0 && this.combo % 10 === 0) this.feverUp();
  Sound.sfx('coin');
  Haptics.light();

  /* he had not started calling out yet - you got there first */
  if (!p.hint) {
    this.unasked++;
    if (this.unasked >= 15) this.award('b_before');
  }
  if (p.kind === 'kupah') {
    this.kupahGiven++;
    if (this.kupahGiven >= 15) this.award('b_kupah');
  }
  if (p.kind === 'loan') {
    p.repay = 7.0;
    this.loansMade++;
    if (this.loansMade >= 5) this.award('b_loan');
    this.note('HE\'S BACK IN BUSINESS!', 'you lent him gold - he can fix the cart himself', C.gold);
  }

  p.thanks = pick(['THANKS!', 'YASHAR KOACH!', 'WHAT A MENSCH!', 'YOU ROCK!']);
  this.addScore(pts, p.x, p.y - 150, '+' + Math.round(pts * this.mult), C.gold);
  FX.ring(c.x, c.y, C.gold, 34);
  FX.burst(c.x, c.y, { n: 12, color: C.gold, spdMax: 200 });
};

TzedakaBlast.prototype.landStreet = function (c) {
  var near = null, nd = 1e9;
  for (var i = 0; i < this.people.length; i++) {
    var p = this.people[i];
    if (p.gone || p.served) continue;
    var d = Math.abs(p.x - c.x);
    if (d < 130 && d < nd) { nd = d; near = p; }
  }
  this.motes.push({ x: c.x, y: TzedakaBlast.GROUND - 4, t: 1.4, gold: c.gold, spin: rand(0, TAU) });
  this.breakCombo();
  Sound.sfx('tap');
  if (near) {
    this.stoops++;
    near.stoop = 1.0;
    this.pop(c.x, TzedakaBlast.GROUND - 54, 'ON THE STREET!', 'rgba(255,255,255,.45)', 22);
  }
};

TzedakaBlast.prototype.feverUp = function () {
  this.fever = 8;
  this.mult = this.cfg.mult * 2;
  this.say('COMBO PARTY!', 'keep going keep going!', C.teal, 3);
  Sound.sfx('badge');
  Haptics.win();
  FX.flash(C.teal, 0.22);
};

/* ==========================================================================
   THE STREET
   ========================================================================== */
TzedakaBlast.prototype.updatePeople = function (dt) {
  for (var i = this.people.length - 1; i >= 0; i--) {
    var p = this.people[i];
    p.phase += dt * (p.sp / 26);
    p.x += p.dir * p.sp * dt;
    if (p.ice) {
      p.slipT -= dt;
      if (p.slipT <= 0 && p.slip <= 0 && !p.served) {
        p.slip = 0.62;
        p.slipT = rand(1.6, 3.2);
        if (!this.metIce) {
          this.metIce = true;
          this.say('WHOOPS, ICE!', 'he is sliding - throw AHEAD of him', C.gold, 3);
        }
      }
      if (p.slip > 0) {
        p.x += p.dir * p.sp * 2.15 * dt;
        p.slip -= dt;
      }
    }
    if (p.flash > 0) p.flash -= dt;
    if (p.joy > 0) p.joy -= dt;
    if (p.stoop > 0) p.stoop -= dt;
    /* settle where he is standing THIS frame, once, before anything asks */
    p.lift = this.personLift(p);
    if (!p.served) {
      p.patience -= dt;
      if (p.patience < p.maxPat * 0.3) p.hint = 1;
    }
    if (p.repay > 0) {
      p.repay -= dt;
      if (p.repay <= 0) {
        this.pouchReserve = Math.min(this.pouchMax, this.pouchReserve + 3);
        if (this.pouchReserve >= 1) this.dryLock = false;
        this.addScore(300, p.x, p.y - 170, 'PAID YOU BACK +300', '#8ee06a');
        FX.burst(p.x, p.y - 90, { n: 18, color: '#8ee06a', spdMax: 240 });
        Sound.sfx('badge');
      }
    }

    var off = p.dir > 0 ? p.x > CFG.W + 120 : p.x < -120;
    if (off || (p.patience <= 0 && !p.served)) {
      this.people.splice(i, 1);
      if (p.served) continue;
      /* somebody who never put a hand out was never sent away - you simply
         missed the higher rung. Everyone else is a real failure. */
      this.missed++;
      this.missedTotal++;
      this.breakCombo();
      if (this.missedTotal === 3) {
        this.note('HE GOT AWAY!', 'next one - you got this', C.teal);
      }
    }
  }
};

TzedakaBlast.prototype.updatePigeons = function (dt) {
  var t = this.cfg, i, c, best, bd, dx, dy;
  for (i = this.pigeons.length - 1; i >= 0; i--) {
    var g = this.pigeons[i];
    g.flap += dt * (g.dive ? 16 : 12);
    g.x += g.dir * g.sp * dt;
    g.y += Math.sin(g.flap * 0.28) * 22 * dt;
    g.dive = false;
    if (t && t.pigeonDive && !g.carrying && !g.dead) {
      best = null; bd = 210;
      for (var k = 0; k < this.coins.length; k++) {
        c = this.coins[k];
        if (c.dead || c.held) continue;
        dx = c.x - g.x; dy = c.y - g.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < bd) { bd = d; best = c; }
      }
      if (best) {
        g.dive = true;
        g.x += clamp(best.x - g.x, -90, 90) * dt * 1.35;
        g.y += clamp(best.y - g.y, -70, 70) * dt * 1.7;
      }
    }
    if (g.carrying) { g.carrying.x = g.x; g.carrying.y = g.y + 16; }
    if (g.dead || g.x < -110 || g.x > CFG.W + 110) {
      if (g.carrying && !g.dead) this.breakCombo();
      this.pigeons.splice(i, 1);
    }
  }
  /* a coin in the road is a miss, and it fades. Nobody picks it up: pe'ah is
     the corner of a field, not something you can do by throwing at cobbles. */
  for (i = this.motes.length - 1; i >= 0; i--) {
    this.motes[i].t -= dt;
    if (this.motes[i].t <= 0) this.motes.splice(i, 1);
  }
};

TzedakaBlast.prototype.updateGents = function (dt) {
  for (var i = this.gents.length - 1; i >= 0; i--) {
    var g = this.gents[i];
    g.phase += dt * (g.sp / 26);
    g.x += g.dir * g.sp * dt;
    if (g.bump > 0) g.bump -= dt;
    if (g.dir > 0 ? g.x > CFG.W + 130 : g.x < -130) this.gents.splice(i, 1);
  }
};

TzedakaBlast.prototype.updateWagons = function (dt) {
  for (var i = this.wagons.length - 1; i >= 0; i--) {
    var w = this.wagons[i];
    w.x += w.dir * w.sp * dt;
    w.roll += w.dir * w.sp * dt / 26;
    if (w.dir > 0 ? w.x > CFG.W + 30 : w.x + w.w < -30) this.wagons.splice(i, 1);
  }
};

/* Snow and rain are weather, not physics. They tell you which street you are
   on; they never move a coin. Anything that changes where a coin lands in this
   game has a meter on it. */
TzedakaBlast.prototype.updateWeather = function (dt) {
  for (var i = 0; i < this.flakes.length; i++) {
    var f = this.flakes[i];
    f.y += f.sp * dt;
    f.x += this.wind * 0.14 * dt;
    f.sw += dt * 1.6;
    if (f.y > CFG.H + 12) { f.y = -12; f.x = rand(-40, CFG.W + 40); }
    if (f.x < -50) f.x = CFG.W + 40;
    if (f.x > CFG.W + 50) f.x = -40;
  }
};

TzedakaBlast.prototype.closeStreet = function () {
  var self = this;
  var made = this.served >= this.need;
  this.streets++;
  if (this.cfg.purim && this.missed === 0) {
    this.purimClean = true;
    this.award('b_purim');
  }
  if (!made) {
    this.left = 0;
    this.failReason = 'Time ran out - ' + this.served + ' of ' + this.need + ' coins landed';
    Sound.sfx('back');
    this.finish(this.failReason);
    return;
  } else {
    /* walked it - the next street is yours to jump to whenever you like */
    if (Profile.unlockLevel('tzedaka', this.level + 1) && this.level + 1 <= TzedakaBlast.STREETS) {
      FX.text(CFG.W / 2, 560, 'STREET ' + (this.level + 1) + ' UNLOCKED', C.teal, 30);
    }
    var bonus = 400 + this.served * 60 + Math.round(this.score * 0.05);
    this.addScore(bonus, CFG.W / 2, 640, 'STREET COMPLETE +' + Math.round(bonus * this.mult), C.gold);
    Sound.sfx('levelup');
    Haptics.win();
  }
  /* a street where you never wasted a coin on somebody who did not need it */
  if (this.streetGentHits === 0 && this.cfg.gentEvery < 100) {
    this.cleanStreets++;
    if (this.cleanStreets >= 5) this.award('b_ani');
  }
  if (this.level >= TzedakaBlast.STREETS) {
    this.victory = true;
    this.finish('You helped all twelve!');
    return;
  }
  this.level++;
  this.interstitial(function () {
    self.setupStreet();
    Game.setState('PLAYING');
    Input.clear();
  });
};

/* ==========================================================================
   RENDER
   ========================================================================== */
TzedakaBlast.prototype.render = function (ctx) {
  var A = TzedakaBlast, t = this.elapsed, i;
  /* Every street is night. That is the point: a coin that misses his hand is
     gone in the dark, and only the one walking with his eyes down finds it. */
  var S = this.scene();
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, S.sky);
  Clouds.render(ctx, t, 'rgba(150,172,210,1)', 0.10);

  this.drawFar(ctx, t);
  this.drawPave(ctx);
  this.drawStreet(ctx, t);

  for (i = 0; i < this.motes.length; i++) this.drawMote(ctx, this.motes[i]);
  var order = this.people.concat(this.gents).sort(function (a, b) { return a.y - b.y; });
  for (i = 0; i < order.length; i++) {
    if (order[i].kind) this.drawPerson(ctx, order[i], t);
    else this.drawGent(ctx, order[i], t);
  }
  for (i = 0; i < this.pigeons.length; i++) this.drawPigeon(ctx, this.pigeons[i]);
  for (i = 0; i < this.coins.length; i++) this.drawCoin(ctx, this.coins[i]);
  /* the wagon stands nearer than anybody, so it draws over them */
  for (i = 0; i < this.wagons.length; i++) this.drawWagon(ctx, S, this.wagons[i]);

  this.drawSelf(ctx, t);
  this.drawWeather(ctx, S);
  this.drawAim(ctx, t);
  this.drawWind(ctx, t);
  this.drawWindGauge(ctx, t);
  this.drawBanner(ctx);
};
