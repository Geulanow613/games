/* ----------------------------------------------- 5. AUDIO (procedural) */
var Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  ready: false, musicTimer: null, musicStep: 0, currentTune: null,
  init: function () {
    if (Sound.ready) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      Sound.ctx = new AC();
      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = 0.9;
      Sound.master.connect(Sound.ctx.destination);
      Sound.sfxGain = Sound.ctx.createGain();
      Sound.sfxGain.gain.value = 0.55;
      Sound.sfxGain.connect(Sound.master);
      Sound.musicGain = Sound.ctx.createGain();
      Sound.musicGain.gain.value = 0.15;
      Sound.musicGain.connect(Sound.master);
      Sound.ready = true;
    } catch (e) { Sound.ready = false; }
  },
  resume: function () {
    if (!Sound.ready) Sound.init();
    if (Sound.ready && Sound.ctx.state === 'suspended') { try { Sound.ctx.resume(); } catch (e) {} }
  },
  on: function () { return Sound.ready && Profile.data && Profile.data.opts.sound; },
  tone: function (opt) {
    if (!Sound.on()) return;
    try {
      var ctx = Sound.ctx, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = opt.type || 'square';
      o.frequency.setValueAtTime(Math.max(20, opt.f || 440), t);
      var dur = opt.dur || 0.15;
      if (opt.f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f2), t + dur);
      var vol = (opt.vol == null ? 0.3 : opt.vol);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(opt.bus === 'music' ? Sound.musicGain : Sound.sfxGain);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise: function (dur, vol, filterFreq, sweep) {
    if (!Sound.on()) return;
    try {
      var ctx = Sound.ctx, t = ctx.currentTime;
      dur = dur || 0.2;
      var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource(); src.buffer = buf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(filterFreq || 1200, t);
      if (sweep) bp.frequency.exponentialRampToValueAtTime(Math.max(60, sweep), t + dur);
      var g = ctx.createGain();
      g.gain.setValueAtTime(vol == null ? 0.3 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(g); g.connect(Sound.sfxGain);
      src.start(t); src.stop(t + dur + 0.02);
    } catch (e) {}
  },
  seq: function (freqs, gap, dur, vol, type) {
    freqs.forEach(function (f, i) {
      setTimeout(function () { Sound.tone({ f: f, dur: dur, vol: vol, type: type }); }, i * gap);
    });
  },
  sfx: function (name) {
    if (!Sound.ready) Sound.init();
    switch (name) {
      case 'tap':     Sound.tone({ f: 660, f2: 880, dur: 0.07, vol: 0.18, type: 'triangle' }); break;
      case 'ui':      Sound.tone({ f: 520, f2: 700, dur: 0.09, vol: 0.22, type: 'square' }); break;
      case 'back':    Sound.tone({ f: 420, f2: 260, dur: 0.10, vol: 0.20, type: 'square' }); break;
      case 'pour':    Sound.tone({ f: 300, f2: 620, dur: 0.22, vol: 0.22, type: 'sine' });
                      Sound.noise(0.18, 0.10, 900, 2200); break;
      case 'light':   Sound.tone({ f: 880, f2: 1320, dur: 0.18, vol: 0.22, type: 'triangle' }); break;
      case 'whoosh':  Sound.noise(0.26, 0.22, 500, 2600); break;
      case 'wind':    Sound.noise(0.70, 0.16, 380, 160); break;
      case 'slice':   Sound.noise(0.14, 0.28, 2600, 700);
                      Sound.tone({ f: 1400, f2: 500, dur: 0.10, vol: 0.12, type: 'sawtooth' }); break;
      case 'splat':   Sound.noise(0.30, 0.28, 420, 120); break;
      case 'hop':     Sound.tone({ f: 520, f2: 780, dur: 0.09, vol: 0.20, type: 'square' }); break;
      case 'coin':    Sound.seq([990, 1320], 60, 0.09, 0.20, 'square'); break;
      case 'good':    Sound.tone({ f: 700, f2: 1050, dur: 0.12, vol: 0.22, type: 'triangle' }); break;
      case 'bad':     Sound.tone({ f: 240, f2: 90, dur: 0.28, vol: 0.28, type: 'sawtooth' }); break;
      case 'hurt':    Sound.tone({ f: 180, f2: 60, dur: 0.40, vol: 0.32, type: 'square' });
                      Sound.noise(0.30, 0.22, 300, 90); break;
      case 'shield':  Sound.tone({ f: 420, f2: 1200, dur: 0.35, vol: 0.22, type: 'sine' }); break;
      case 'levelup': Sound.seq([523, 659, 784, 1047], 90, 0.16, 0.22, 'triangle'); break;
      case 'lose':    Sound.seq([392, 311, 233], 150, 0.30, 0.24, 'square'); break;
      case 'badge':   Sound.seq([659, 784, 988, 1175, 1568], 70, 0.14, 0.20, 'triangle'); break;
    }
  },
  /* Original chiptune loops with a freylach / niggun flavour. MIDI numbers, 0 = rest. */
  tunes: {
    menu:  { bpm: 108, notes: [69,0,72,74,76,0,74,72,69,0,71,72,74,0,72,71,
                               69,0,72,74,76,77,76,74,72,0,71,69,69,0,0,0] },
    play:  { bpm: 132, notes: [57,64,60,64,57,64,60,64,55,62,58,62,55,62,58,62,
                               53,60,57,60,53,60,57,60,55,62,59,62,64,62,59,55] },
    tense: { bpm: 152, notes: [50,57,53,57,50,57,53,57,48,55,51,55,48,55,51,55] }
  },
  playMusic: function (name) {
    if (!Sound.ready) Sound.init();
    if (!Sound.ready) return;
    if (Sound.currentTune === name) return;
    Sound.stopMusic();
    Sound.currentTune = name;
    var tune = Sound.tunes[name];
    if (!tune) return;
    Sound.musicStep = 0;
    var interval = 60000 / tune.bpm / 2;
    Sound.musicTimer = setInterval(function () {
      if (!Profile.data || !Profile.data.opts.music || !Profile.data.opts.sound) return;
      if (!Sound.ctx || Sound.ctx.state === 'suspended') return;
      var n = tune.notes[Sound.musicStep % tune.notes.length];
      Sound.musicStep++;
      if (!n) return;
      var f = 440 * Math.pow(2, (n - 69) / 12);
      Sound.tone({ f: f, dur: interval / 1000 * 0.9, vol: 0.20, type: 'square', bus: 'music' });
      if (Sound.musicStep % 4 === 1) {
        Sound.tone({ f: f / 4, dur: interval / 1000 * 1.6, vol: 0.16, type: 'triangle', bus: 'music' });
      }
    }, interval);
  },
  stopMusic: function () {
    if (Sound.musicTimer) { clearInterval(Sound.musicTimer); Sound.musicTimer = null; }
    Sound.currentTune = null;
  }
};

/* ------------------------------------------ 6. VIEWPORT / LETTERBOX VIEW */
var View = {
  canvas: null, ctx: null,
  dpr: 1, scale: 1, ox: 0, oy: 0,
  cssW: 0, cssH: 0,
  safe: { t: 0, r: 0, b: 0, l: 0 },
  init: function () {
    View.canvas = document.getElementById('stage');
    /* Do not pass desynchronized:true — Android Chromium then logs
       "Frame latency is negative" every present and the compositor can die. */
    View.ctx = View.canvas.getContext('2d', { alpha: false }) || View.canvas.getContext('2d');
    View.resize();
    window.addEventListener('resize', View.resize, false);
    window.addEventListener('orientationchange', function () { setTimeout(View.resize, 120); }, false);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', View.resize, false);
  },
  resize: function () {
    var cw = Math.max(1, window.innerWidth);
    var ch = Math.max(1, window.innerHeight);
    if (window.visualViewport) {
      cw = Math.max(1, Math.round(window.visualViewport.width));
      ch = Math.max(1, Math.round(window.visualViewport.height));
    }
    View.cssW = cw; View.cssH = ch;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var area = cw * ch;
    if (area > 0 && area * dpr * dpr > 2200000) {
      dpr = Math.max(1, Math.sqrt(2200000 / area));
    }
    View.dpr = dpr;
    View.canvas.width = Math.round(cw * View.dpr);
    View.canvas.height = Math.round(ch * View.dpr);
    View.canvas.style.width = cw + 'px';
    View.canvas.style.height = ch + 'px';
    View.scale = Math.min(cw / CFG.W, ch / CFG.H);
    View.ox = (cw - CFG.W * View.scale) / 2;
    View.oy = (ch - CFG.H * View.scale) / 2;
    /* safe-area insets, expressed in game units inside the letterboxed stage */
    var t = 0, r = 0, b = 0, l = 0;
    var probe = document.getElementById('safeprobe');
    if (probe) {
      var cs = window.getComputedStyle(probe);
      t = parseFloat(cs.paddingTop) || 0;
      r = parseFloat(cs.paddingRight) || 0;
      b = parseFloat(cs.paddingBottom) || 0;
      l = parseFloat(cs.paddingLeft) || 0;
    }
    var s = View.scale || 1;
    View.safe.t = Math.max(0, (t - View.oy) / s);
    View.safe.b = Math.max(0, (b - View.oy) / s);
    View.safe.l = Math.max(0, (l - View.ox) / s);
    View.safe.r = Math.max(0, (r - View.ox) / s);
  },
  /* client (CSS px) -> game space */
  toGame: function (clientX, clientY) {
    var rect = View.canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - View.ox) / View.scale,
      y: (clientY - rect.top - View.oy) / View.scale
    };
  },
  begin: function () {
    var ctx = View.ctx;
    ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, View.cssW, View.cssH);
    ctx.save();
    ctx.translate(View.ox, View.oy);
    ctx.scale(View.scale, View.scale);
    ctx.beginPath();
    ctx.rect(0, 0, CFG.W, CFG.H);
    ctx.clip();
  },
  end: function () { View.ctx.restore(); }
};

/* --------------------------------------------- 7. INPUT / GESTURE ENGINE */
var Input = {
  pointers: {},          // id -> pointer record (live, for drag / steering)
  count: 0,
  events: [],            // consumed once per frame by the active scene
  lastSwipeAt: -10,
  lastSwipe: null,
  /* anything that travelled further than a tap is a swipe - there must be no
     dead band in between, or short deliberate flicks do nothing at all */
  SWIPE_MIN: 22,
  TAP_MAX_MOVE: 22,
  TAP_MAX_TIME: 0.42,
  init: function () {
    var el = View.canvas;
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', Input._down, { passive: false });
      el.addEventListener('pointermove', Input._move, { passive: false });
      el.addEventListener('pointerup', Input._up, { passive: false });
      el.addEventListener('pointercancel', Input._up, { passive: false });
      el.addEventListener('pointerleave', Input._up, { passive: false });
    } else {
      el.addEventListener('touchstart', Input._touch(Input._down), { passive: false });
      el.addEventListener('touchmove', Input._touch(Input._move), { passive: false });
      el.addEventListener('touchend', Input._touch(Input._up), { passive: false });
      el.addEventListener('touchcancel', Input._touch(Input._up), { passive: false });
      el.addEventListener('mousedown', Input._down, { passive: false });
      el.addEventListener('mousemove', Input._move, { passive: false });
      el.addEventListener('mouseup', Input._up, { passive: false });
    }
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
    /* Desktop keyboard shim, handy for QA and for playing in a browser. */
    window.addEventListener('keydown', Input._key, false);
  },
  _touch: function (fn) {
    return function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        fn({ pointerId: t.identifier, clientX: t.clientX, clientY: t.clientY, preventDefault: function () {} });
      }
    };
  },
  _key: function (e) {
    var k = e.key;
    var cx = CFG.W / 2, cy = CFG.H / 2;
    var map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
    if (map[k]) {
      e.preventDefault();
      var dir = map[k];
      var v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
      Input.events.push({
        type: 'swipe', id: -1, dir: dir, x: cx, y: cy,
        x2: cx + v[0] * 160, y2: cy + v[1] * 160,
        dx: v[0] * 160, dy: v[1] * 160, len: 160, speed: 1600, keyboard: true
      });
    } else if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      Input.events.push({ type: 'tap', id: -1, x: cx, y: cy, keyboard: true });
    } else if (k === 'Escape' || k === 'p' || k === 'P') {
      Input.events.push({ type: 'escape' });
    }
  },
  _down: function (e) {
    if (e.preventDefault) e.preventDefault();
    Sound.resume();
    var p = View.toGame(e.clientX, e.clientY);
    var rec = {
      id: e.pointerId == null ? 0 : e.pointerId,
      sx: p.x, sy: p.y, x: p.x, y: p.y, px: p.x, py: p.y,
      t0: Game.time, tLast: Game.time,
      vx: 0, vy: 0, moved: false, maxMove: 0,
      trail: [{ x: p.x, y: p.y, t: Game.time }]
    };
    Input.pointers[rec.id] = rec;
    Input.count++;
    Input.events.push({ type: 'down', id: rec.id, x: p.x, y: p.y });
  },
  _move: function (e) {
    if (e.preventDefault) e.preventDefault();
    var id = e.pointerId == null ? 0 : e.pointerId;
    var rec = Input.pointers[id];
    if (!rec) return;
    var p = View.toGame(e.clientX, e.clientY);
    var dt = Math.max(0.001, Game.time - rec.tLast);
    rec.px = rec.x; rec.py = rec.y;
    rec.x = p.x; rec.y = p.y;
    var dx = rec.x - rec.px, dy = rec.y - rec.py;
    rec.vx = lerp(rec.vx, dx / dt, 0.5);
    rec.vy = lerp(rec.vy, dy / dt, 0.5);
    rec.tLast = Game.time;
    var moveTotal = distance(rec.sx, rec.sy, rec.x, rec.y);
    if (moveTotal > rec.maxMove) rec.maxMove = moveTotal;
    if (moveTotal > Input.TAP_MAX_MOVE) rec.moved = true;
    rec.trail.push({ x: rec.x, y: rec.y, t: Game.time });
    if (rec.trail.length > 24) rec.trail.shift();
    Input.events.push({
      type: 'move', id: id, x: rec.x, y: rec.y, px: rec.px, py: rec.py,
      dx: dx, dy: dy, speed: Math.hypot(rec.vx, rec.vy)
    });
  },
  _up: function (e) {
    if (e.preventDefault) e.preventDefault();
    var id = e.pointerId == null ? 0 : e.pointerId;
    var rec = Input.pointers[id];
    if (!rec) return;
    delete Input.pointers[id];
    Input.count = Math.max(0, Input.count - 1);
    var dur = Game.time - rec.t0;
    var dx = rec.x - rec.sx, dy = rec.y - rec.sy;
    var len = Math.hypot(dx, dy);
    Input.events.push({ type: 'up', id: id, x: rec.x, y: rec.y, dur: dur, len: len });
    if (!rec.moved && dur <= Input.TAP_MAX_TIME) {
      Input.events.push({ type: 'tap', id: id, x: rec.x, y: rec.y });
      return;
    }
    if (len >= Input.SWIPE_MIN) {
      var dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      var ev = {
        type: 'swipe', id: id, dir: dir,
        x: rec.sx, y: rec.sy, x2: rec.x, y2: rec.y,
        dx: dx, dy: dy, len: len, dur: dur, speed: len / Math.max(0.03, dur),
        trail: rec.trail.slice()
      };
      Input.events.push(ev);
      var near = Input.lastSwipe && distance(Input.lastSwipe.x, Input.lastSwipe.y, ev.x, ev.y) < 340;
      if (Input.lastSwipe && near && Game.time - Input.lastSwipeAt < 0.25) {
        Input.events.push({
          type: 'multiswipe', count: 2, a: Input.lastSwipe, b: ev,
          x: (Input.lastSwipe.x2 + ev.x2) / 2, y: (Input.lastSwipe.y2 + ev.y2) / 2
        });
        Input.lastSwipeAt = -10; Input.lastSwipe = null;
      } else {
        Input.lastSwipeAt = Game.time; Input.lastSwipe = ev;
      }
    }
  },
  /* Returns and clears this frame's gesture queue. */
  drain: function () { var e = Input.events; Input.events = []; return e; },
  /* Live helpers */
  anyPointerIn: function (x, y, w, h) {
    for (var id in Input.pointers) {
      var p = Input.pointers[id];
      if (p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h) return p;
    }
    return null;
  },
  first: function () { for (var id in Input.pointers) return Input.pointers[id]; return null; },
  clear: function () { Input.pointers = {}; Input.count = 0; Input.events.length = 0; }
};

/* --------------------------------------------------- 8. FX / PARTICLES */
var FX = {
  parts: [], texts: [], slashes: [],
  shakeAmt: 0, shakeT: 0, flashColor: null, flashT: 0, flashDur: 0.3,
  reset: function () { FX.parts.length = 0; FX.texts.length = 0; FX.slashes.length = 0; FX.shakeAmt = 0; FX.flashT = 0; },
  burst: function (x, y, opts) {
    opts = opts || {};
    if (FX.parts.length > 90) return;
    var n = opts.n || 12;
    if (FX.parts.length + n > 110) n = Math.max(0, 110 - FX.parts.length);
    for (var i = 0; i < n; i++) {
      var a = opts.angle != null ? opts.angle + rand(-0.6, 0.6) : rand(0, TAU);
      var sp = rand(opts.spdMin || 60, opts.spdMax || 320);
      FX.parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opts.lift || 0),
        life: rand(opts.lifeMin || 0.3, opts.lifeMax || 0.9), age: 0,
        r: rand(opts.rMin || 3, opts.rMax || 9),
        color: opts.color || C.gold, grav: opts.grav == null ? 520 : opts.grav,
        shape: opts.shape || 'circle', spin: rand(-8, 8), rot: rand(0, TAU),
        fade: opts.fade !== false
      });
    }
  },
  ring: function (x, y, color, radius) {
    FX.parts.push({ x: x, y: y, vx: 0, vy: 0, life: 0.45, age: 0, r: radius || 20,
      color: color || C.gold, grav: 0, shape: 'ring', spin: 0, rot: 0, fade: true, grow: (radius || 20) * 3 });
  },
  text: function (x, y, str, color, size, life) {
    var span = life == null ? 1.1 : life;
    FX.texts.push({ x: x, y: y, str: str, color: color || C.gold, size: size || 34, age: 0, life: span });
  },
  slash: function (pts, color) {
    if (!pts || pts.length < 2) return;
    if (FX.slashes.length >= 8) FX.slashes.shift();
    FX.slashes.push({ pts: pts.slice(-12), color: color || '#ffffff', age: 0, life: 0.28 });
  },
  shake: function (amt, dur) { FX.shakeAmt = Math.max(FX.shakeAmt, amt); FX.shakeT = Math.max(FX.shakeT, dur || 0.3); },
  flash: function (color, dur) { FX.flashColor = color; FX.flashT = dur || 0.3; FX.flashDur = dur || 0.3; },
  update: function (dt) {
    var i, p;
    for (i = FX.parts.length - 1; i >= 0; i--) {
      p = FX.parts[i];
      p.age += dt;
      if (p.age >= p.life) { FX.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.grav * dt;
      p.vx *= (1 - 1.2 * dt);
      p.rot += p.spin * dt;
    }
    for (i = FX.texts.length - 1; i >= 0; i--) {
      var t = FX.texts[i];
      t.age += dt;
      if (t.age >= t.life) { FX.texts.splice(i, 1); continue; }
      t.y -= 70 * (1.1 / Math.max(t.life, 1.1)) * dt;
    }
    for (i = FX.slashes.length - 1; i >= 0; i--) {
      var s = FX.slashes[i];
      s.age += dt;
      if (s.age >= s.life) FX.slashes.splice(i, 1);
    }
    if (FX.shakeT > 0) { FX.shakeT -= dt; if (FX.shakeT <= 0) FX.shakeAmt = 0; }
    if (FX.flashT > 0) FX.flashT -= dt;
  },
  applyShake: function (ctx) {
    if (FX.shakeT > 0 && FX.shakeAmt > 0) {
      var k = FX.shakeAmt * (FX.shakeT / 0.3);
      ctx.translate(rand(-k, k), rand(-k, k));
    }
  },
  render: function (ctx) {
    var i, p;
    for (i = 0; i < FX.parts.length; i++) {
      p = FX.parts[i];
      var k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = p.fade ? clamp(k, 0, 1) : 1;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;
      if (p.shape === 'ring') {
        ctx.lineWidth = 5 * k + 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, lerp(p.r, p.grow, 1 - k), 0, TAU);
        ctx.stroke();
      } else if (p.shape === 'square') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      } else if (p.shape === 'spark') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r * 2, -p.r * 0.35, p.r * 4, p.r * 0.7);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * clamp(k + 0.25, 0.2, 1.2), 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    for (i = 0; i < FX.slashes.length; i++) {
      var s = FX.slashes[i];
      var a = 1 - s.age / s.life;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = s.color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = 14 * a + 2;
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (var j = 1; j < s.pts.length; j++) ctx.lineTo(s.pts[j].x, s.pts[j].y);
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < FX.texts.length; i++) {
      var t2 = FX.texts[i];
      var k2 = 1 - t2.age / t2.life;
      ctx.save();
      ctx.globalAlpha = clamp(k2 * 1.6, 0, 1);
      Draw.textSafe(ctx, t2.str, t2.x, t2.y, {
        size: t2.size * (1 + (1 - k2) * 0.15), color: t2.color,
        weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 6
      });
      ctx.restore();
    }
  },
  renderFlash: function (ctx) {
    if (FX.flashT > 0 && FX.flashColor) {
      ctx.save();
      ctx.globalAlpha = clamp(FX.flashT / FX.flashDur, 0, 1) * 0.55;
      ctx.fillStyle = FX.flashColor;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.restore();
    }
  }
};

/* ------------------------------------------------------ 9. DRAW HELPERS */
var Draw = {
  font: function (size, weight) {
    return (weight || '700') + ' ' + Math.round(size) + 'px "Segoe UI","Arial Hebrew",Tahoma,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif';
  },
  rr: function (ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  },
  text: function (ctx, str, x, y, o) {
    o = o || {};
    str = Lang.t(str);
    ctx.save();
    if (Lang.hasHe(str)) ctx.direction = 'rtl';
    ctx.font = o.font || Draw.font(o.size || 28, o.weight || '700');
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'middle';
    if (o.shadow) {
      ctx.shadowColor = o.shadow;
      ctx.shadowBlur = o.shadowBlur || 12;
      ctx.shadowOffsetY = o.shadowY || 2;
    }
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = o.stroke;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || C.cream;
    ctx.fillText(str, x, y);
    ctx.restore();
  },
  /* draw a single line, shrinking the type until it fits maxW */
  textFit: function (ctx, str, x, y, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var w = Draw.measure(ctx, str, size, o.weight || '700');
    if (w > maxW && w > 0) size = Math.max(size * 0.5, size * (maxW / w));
    var oo = {};
    for (var k in o) oo[k] = o[k];
    oo.size = size;
    Draw.text(ctx, str, x, y, oo);
    return size;
  },
  /* centred text that shrinks if it is too wide and slides inward so it can
     never run off the edge of the stage */
  textSafe: function (ctx, str, x, y, o) {
    o = o || {};
    var size = o.size || 24;
    var maxW = o.maxW || (CFG.W - 40);
    var w = Draw.measure(ctx, str, size, o.weight || '700');
    if (w > maxW && w > 0) { size = Math.max(size * 0.5, size * (maxW / w)); w = maxW; }
    var half = w / 2;
    var oo = {};
    for (var k in o) oo[k] = o[k];
    oo.size = size;
    oo.align = 'center';
    Draw.text(ctx, str, clamp(x, 20 + half, CFG.W - 20 - half), y, oo);
    return size;
  },
  measure: function (ctx, str, size, weight) {
    ctx.save();
    str = Lang.t(str);
    ctx.font = Draw.font(size, weight);
    if (Lang.hasHe(str)) ctx.direction = 'rtl';
    var w = ctx.measureText(str).width;
    ctx.restore();
    return w;
  },
  wrap: function (ctx, str, maxW, size, weight) {
    ctx.save();
    str = Lang.t(str);
    ctx.font = Draw.font(size, weight || '600');
    if (Lang.hasHe(str)) ctx.direction = 'rtl';
    var paras = String(str).split('\n');
    var out = [];
    for (var p = 0; p < paras.length; p++) {
      var words = paras[p].split(' ');
      var line = '';
      for (var i = 0; i < words.length; i++) {
        var test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = words[i]; }
        else line = test;
      }
      out.push(line);
    }
    ctx.restore();
    return out;
  },
  para: function (ctx, str, x, y, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var lh = o.lineHeight || size * 1.38;
    var lines = Draw.wrap(ctx, str, maxW, size, o.weight || '600');
    for (var i = 0; i < lines.length; i++) {
      Draw.text(ctx, lines[i], x, y + i * lh, o);
    }
    return y + lines.length * lh;
  },
  paraHeight: function (ctx, str, maxW, o) {
    o = o || {};
    var size = o.size || 24;
    var lh = o.lineHeight || size * 1.38;
    return Draw.wrap(ctx, str, maxW, size, o.weight || '600').length * lh;
  },
  panel: function (ctx, x, y, w, h, o) {
    o = o || {};
    ctx.save();
    if (o.glow) {
      ctx.shadowColor = o.glow;
      ctx.shadowBlur = o.glowBlur || 26;
    }
    Draw.rr(ctx, x, y, w, h, o.radius == null ? 22 : o.radius);
    ctx.fillStyle = o.fill || 'rgba(12,17,38,.94)';
    ctx.fill();
    ctx.shadowBlur = 0;
    if (o.stroke) {
      ctx.lineWidth = o.strokeW || 3;
      ctx.strokeStyle = o.stroke;
      ctx.stroke();
    }
    ctx.restore();
  },
  meter: function (ctx, x, y, w, h, pct, o) {
    o = o || {};
    pct = clamp(pct, 0, 1);
    ctx.save();
    Draw.rr(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = o.bg || 'rgba(0,0,0,.55)';
    ctx.fill();
    if (pct > 0.001) {
      ctx.save();
      Draw.rr(ctx, x, y, w, h, h / 2);
      ctx.clip();
      ctx.fillStyle = o.fg || C.gold;
      ctx.fillRect(x, y, w * pct, h);
      if (o.gloss !== false) {
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.fillRect(x, y, w * pct, h * 0.42);
      }
      ctx.restore();
    }
    ctx.lineWidth = o.borderW || 2.5;
    ctx.strokeStyle = o.border || 'rgba(255,255,255,.32)';
    Draw.rr(ctx, x, y, w, h, h / 2);
    ctx.stroke();
    ctx.restore();
  },
  heart: function (ctx, x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 20, s / 20);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-14, -6, -9, -18, 0, -10);
    ctx.bezierCurveTo(9, -18, 14, -6, 0, 6);
    ctx.closePath();
    ctx.fillStyle = filled ? C.red : 'rgba(255,255,255,.16)';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = filled ? '#ffd0d0' : 'rgba(255,255,255,.35)';
    ctx.stroke();
    ctx.restore();
  },
  hearts: function (ctx, x, y, cur, max, size) {
    size = size || 30;
    for (var i = 0; i < max; i++) Draw.heart(ctx, x + i * (size + 8), y, size, i < cur);
  },
  star: function (ctx, x, y, r, points, inner) {
    points = points || 5;
    inner = inner || r * 0.46;
    ctx.beginPath();
    for (var i = 0; i < points * 2; i++) {
      var rad = i % 2 === 0 ? r : inner;
      var a = (i / (points * 2)) * TAU - Math.PI / 2;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  },
  magenDavid: function (ctx, x, y, r, color, lw) {
    ctx.save();
    ctx.strokeStyle = color || C.gold;
    ctx.lineWidth = lw || 4;
    ctx.lineJoin = 'round';
    for (var t = 0; t < 2; t++) {
      ctx.beginPath();
      for (var i = 0; i < 3; i++) {
        var a = -Math.PI / 2 + t * Math.PI / 3 + i * TAU / 3;
        var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  },
  flame: function (ctx, x, y, size, t, alive) {
    if (!alive) return;
    var w = size * (0.85 + 0.15 * Math.sin(t * 9 + x));
    var h = size * (1.9 + 0.28 * Math.sin(t * 7.3 + x * 0.4));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x, y - h * 0.35, 1, x, y - h * 0.3, h * 1.5);
    g.addColorStop(0, 'rgba(255,240,180,.95)');
    g.addColorStop(0.35, 'rgba(255,150,50,.55)');
    g.addColorStop(1, 'rgba(255,110,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - h * 0.3, h * 1.4, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.quadraticCurveTo(x + w, y - h * 0.42, x + w * 0.55, y);
    ctx.quadraticCurveTo(x, y + size * 0.22, x - w * 0.55, y);
    ctx.quadraticCurveTo(x - w, y - h * 0.42, x, y - h);
    ctx.closePath();
    ctx.fillStyle = C.flame;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.66);
    ctx.quadraticCurveTo(x + w * 0.44, y - h * 0.24, x, y - size * 0.05);
    ctx.quadraticCurveTo(x - w * 0.44, y - h * 0.24, x, y - h * 0.66);
    ctx.closePath();
    ctx.fillStyle = C.flameHot;
    ctx.fill();
    ctx.restore();
  },
  vGradient: function (ctx, x, y, w, h, stops) {
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  },
  scrim: function (ctx, alpha) {
    ctx.save();
    ctx.fillStyle = 'rgba(3,5,12,' + (alpha == null ? 0.72 : alpha) + ')';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.restore();
  }
};

/* ------------------------------------------ 10. CLOUDS (shared backdrop) */
/* The sky in this game is deliberately plain: no sun, moon or stars anywhere.
   Drifting cloud banks give the backdrops depth instead. */
var Clouds = {
  list: null,
  ensure: function () {
    if (Clouds.list) return;
    Clouds.list = [];
    for (var i = 0; i < 9; i++) {
      var puffs = [];
      var n = randInt(4, 6);
      for (var p = 0; p < n; p++) {
        puffs.push({ dx: rand(-76, 76), dy: rand(-13, 13), r: rand(24, 46) });
      }
      Clouds.list.push({
        x: rand(-180, CFG.W + 180),
        y: rand(70, 560),
        sp: rand(4, 13) * (chance(0.5) ? 1 : -1),
        scale: rand(0.65, 1.45),
        alpha: rand(0.5, 1),
        puffs: puffs
      });
    }
  },
  render: function (ctx, t, color, alphaMul) {
    Clouds.ensure();
    var span = CFG.W + 460;
    ctx.save();
    for (var i = 0; i < Clouds.list.length; i++) {
      var c = Clouds.list[i];
      var x = ((c.x + t * c.sp) % span + span) % span - 230;
      ctx.globalAlpha = c.alpha * (alphaMul == null ? 1 : alphaMul);
      ctx.fillStyle = color || 'rgba(206,220,244,1)';
      /* one compound path, one fill - overlapping puffs must not darken */
      ctx.beginPath();
      for (var p = 0; p < c.puffs.length; p++) {
        var pu = c.puffs[p];
        var px = x + pu.dx * c.scale, py = c.y + pu.dy * c.scale, pr = pu.r * c.scale;
        ctx.moveTo(px + pr, py);
        ctx.arc(px, py, pr, 0, TAU);
      }
      ctx.fill();
    }
    ctx.restore();
  }
};

/* -------------------------------------------------------- 11. UI BUTTONS */
function Button(x, y, w, h, label, onTap, opts) {
  this.x = x; this.y = y; this.w = w; this.h = h;
  this.label = label; this.onTap = onTap;
  opts = opts || {};
  this.fill = opts.fill || 'rgba(255,207,92,.96)';
  this.textColor = opts.textColor || C.ink;
  this.stroke = opts.stroke || 'rgba(255,255,255,.5)';
  this.size = opts.size || 30;
  this.radius = opts.radius == null ? 18 : opts.radius;
  this.icon = opts.icon || null;
  this.sub = opts.sub || null;
  this.disabled = !!opts.disabled;
  this.press = 0;
  this.data = opts.data || null;
  this.pad = opts.pad == null ? 14 : opts.pad;   // extra touch slop
  /* a hit target the screen draws for itself - the button is only the tap */
  this.invisible = !!opts.invisible;
}
Button.prototype.contains = function (x, y) {
  return x >= this.x - this.pad && x <= this.x + this.w + this.pad &&
         y >= this.y - this.pad && y <= this.y + this.h + this.pad;
};
Button.prototype.draw = function (ctx, t) {
  var k = this.press;
  var x = this.x + k * 2, y = this.y + k * 3, w = this.w - k * 4, h = this.h - k * 4;
  ctx.save();
  ctx.globalAlpha = this.disabled ? 0.45 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  Draw.rr(ctx, this.x + 3, this.y + 6, this.w, this.h, this.radius);
  ctx.fill();
  Draw.rr(ctx, x, y, w, h, this.radius);
  ctx.fillStyle = this.fill;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = this.stroke;
  ctx.stroke();
  ctx.save();
  Draw.rr(ctx, x, y, w, h, this.radius);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fillRect(x, y, w, h * 0.4);
  ctx.restore();
  var cy = y + h / 2 + (this.sub ? -10 : 0);
  var label = (this.icon ? this.icon + '  ' : '') + this.label;
  Draw.text(ctx, label, x + w / 2, cy, {
    size: this.size, color: this.textColor, align: 'center', weight: '900'
  });
  if (this.sub) {
    Draw.text(ctx, this.sub, x + w / 2, cy + 26, {
      size: this.size * 0.55, color: this.textColor, align: 'center', weight: '700'
    });
  }
  ctx.restore();
};
Button.prototype.update = function (dt) {
  this.press = approach(this.press, 0, dt * 8);
};

var UI = {
  handle: function (list, ev) {
    if (!list) return false;
    if (ev.type === 'down') {
      for (var i = 0; i < list.length; i++) {
        if (!list[i].disabled && list[i].contains(ev.x, ev.y)) { list[i].press = 1; }
      }
      return false;
    }
    if (ev.type !== 'tap') return false;
    for (var j = 0; j < list.length; j++) {
      var b = list[j];
      if (b.disabled) continue;
      if (b.contains(ev.x, ev.y)) {
        b.press = 1;
        Sound.sfx('ui');
        Haptics.light();
        if (b.onTap) b.onTap(b);
        return true;
      }
    }
    return false;
  },
  drawAll: function (ctx, list, t, dt) {
    for (var i = 0; i < list.length; i++) {
      list[i].update(dt || 0);
      if (!list[i].invisible) list[i].draw(ctx, t);
    }
  }
};

      hebrew:'מָקוֹם שֶׁהָרוּחַ שׁוֹלֶטֶת',
      body:'You may not light somewhere the wind is definitely going to blow it out. And this is not "oops, try again" - the lighting does not count at all, because it was never a light that had a chance. That is the whole reason outdoor menorahs live inside a glass box.',
      terms:[['menorah','the eight-branched lamp we light on Chanukah'],
             ['halacha','Jewish law - the rules for how to do things']],
      source:'Shulchan Aruch OC 673:2 with Mishnah Berurah 673:25' },
    { id:'m4', game:'menorah', icon:'oil', title:'Why Olive Oil Wins',
      hebrew:'שֶׁמֶן זַיִת',
      body:'Any oil works. Any wick works. Wax candles work. But olive oil is the champion, because the miracle in the Beis HaMikdash happened with one little sealed jug of pure olive oil - so when you use it, you are using the same stuff the story is about.',
      terms:[['Shemen zayis','olive oil'],
             ['Beis HaMikdash','the Temple in Jerusalem']],
      source:'Shabbos 23a; OC 673:1; Rambam Hilchos Chanukah 4:6' },
    { id:'m5', game:'menorah', icon:'lamp', title:'The Shamash Is the Helper',
      hebrew:'שַׁמָּשׁ',
      body:'One extra candle sits off to the side, usually a bit higher. Why? Because you are not allowed to USE the Chanukah lights for anything - not to read by, not to find your shoe, not to count your gelt. So the shamash stands there and says: whatever light you just used, you used mine. Its name literally means "servant".',
      terms:[['Shamash','the helper candle - it serves the others'],
             ['gelt','Yiddish for money; the coins kids get on Chanukah']],
      source:'Shabbos 21b; OC 673:1' },
    { id:'m6', game:'menorah', icon:'window', title:'Put It Where People Can See',
      hebrew:'פִּרְסוּמֵי נִיסָּא',
      body:'The lights are not decoration and they are not for you - they are an announcement. That is why they go by the doorway or in a window facing the street, low enough that somebody walking past actually notices and thinks: something happened here.',
      terms:[['Pirsumei nisa','"publicising the miracle" - making sure people know about it']],
      source:'Shabbos 21b-22a; OC 671:5-7' },
    { id:'m7', game:'menorah', icon:'lamp', title:'Up, Never Down',
      hebrew:'מוֹסִיף וְהוֹלֵךְ',
      body:'There was a real argument about this. Beis Shammai said start with eight and count down. Beis Hillel said start with one and add one every night, because when it comes to holy things you go UP, you do not go down. Beis Hillel won - which is why night eight is the big one.',
      terms:[['Mosif v\'holech','"adding as you go" - one more light each night'],
             ['Beis Shammai / Beis Hillel','two great schools of Sages who often disagreed; the halacha almost always follows Hillel']],
      source:'Shabbos 21b' },
    { id:'m10', game:'menorah', icon:'lamp', title:'One Light Is Already Enough',
      hebrew:'נֵר אִישׁ וּבֵיתוֹ',
      body:'Strictly speaking? A single light per household, per night. That is the whole mitzvah, done. Then people started making it more beautiful: one light for every person in the house. Then even more beautiful: adding one every night. That last version is what nearly everybody does now - but the basic rule underneath is still one single flame.',
      terms:[['Ner ish u\'beiso','"a light for a man and his household" - one per family'],
             ['Me\'ikkar hadin','"by the basic law" - the minimum that actually counts'],
             ['Mehadrin','"the beautifiers" - people who do a mitzvah in the fanciest way']],
      source:'Shabbos 21b; OC 671:1-2' },
    { id:'m11', game:'menorah', icon:'oil', title:'Set It Up Somewhere Safe',
      hebrew:'מְקוֹם הַנָּחָה',
      body:'The lights need a spot where they can burn quietly for their whole half hour without anyone knocking them, spilling them or setting the tablecloth on fire. Glass holders, away from the edge, away from flying elbows. A menorah you had to rescue halfway through was never set up right in the first place.',
      terms:[['Mekom hanacha','"the place of setting down" - where the menorah stands']],
      source:'OC 673:2; Mishnah Berurah 673:25' },
    { id:'m12', game:'menorah', icon:'oil', title:'The One Sealed Jug',
      hebrew:'פַּךְ שֶׁמֶן',
      body:'When the Chashmonaim finally took the Beis HaMikdash back, the place was wrecked. They dug through the mess looking for oil and found exactly one small jug still sealed with the seal of the Kohen Gadol - untouched. Enough for one day. It burned for eight. The next year, those eight days became Chanukah.',
      terms:[['Pach shemen','a small jug of oil'],
             ['Chashmonaim','the Maccabees - the family who led the fight'],
             ['Kohen Gadol','the High Priest; his seal proved the oil was pure']],
      source:'Shabbos 21b' },
    { id:'m9', game:'menorah', icon:'candle', title:'Lighting One From Another',
      hebrew:'מַדְלִיקִין נֵר מִנֵּר',
      body:'Can you light one Chanukah candle straight off another one? The Shulchan Aruch says yes - but not by lighting a stick first and carrying the flame over on that. The Rema records the custom to just avoid the whole question. Which is exactly what the shamash is for: it is the flame you carry from wick to wick.',
      terms:[['Shulchan Aruch','the main code of Jewish law, written by Rav Yosef Karo'],
             ['Rema','Rav Moshe Isserles, who added the Ashkenazi customs to it']],
      source:'Shabbos 22a; OC 674:1 with Rema' },
    { id:'m8', game:'menorah', icon:'clock', title:'When to Light',
      hebrew:'זְמַן הַהַדְלָקָה',
      body:'Light at nightfall (some families light right at sunset), and do not start a meal or get stuck into something in the half hour before - you will forget. Erev Shabbos (Friday afternoon) is different: we light BEFORE the Shabbos candles and before sunset, because you cannot light once Shabbos has started. And since the lights still have to last half an hour past nightfall, Friday needs extra oil.',
      terms:[['Zman hadlakah','the time for lighting'],
             ['Erev Shabbos','Friday - the day before Shabbos']],
      source:'OC 672:1, 679:1; Mishnah Berurah 672:1' },

    /* ---- Zmanim / Shul Crossing ---------------------------------------- */
    { id:'s1', game:'shul', icon:'clock', title:'The Morning Deadline',
      hebrew:'סוֹף זְמַן תְּפִלָּה',
      body:'The best time for Shacharis Shemoneh Esrei is by the end of the fourth hour of the day. If you missed that, you can still daven until chatzos - midday. After midday it is a makeup, not the morning tefillah. And "hour" here is not sixty minutes: you take the daylight and chop it into twelve equal pieces, so the deadline moves all year. Families also argue about when that clock STARTS - sunrise, or a bit earlier at dawn - so two shuls on the same street can post different times. Follow yours.',
      terms:[['Sof zman tefillah','the ideal last time for morning Shemoneh Esrei'],
             ['Chatzos','halachic midday'],
             ['Shacharis','the morning prayers'],
             ['Shemoneh Esrei','the central standing prayer, said quietly'],
             ['Sha\'ah zmanis','a "halachic hour" - one twelfth of the daylight, not sixty minutes']],
      source:'Berachos 26a; OC 89:1' },
    { id:'s2', game:'shul', icon:'people', title:'Cover Your Eyes',
      hebrew:'שְׁמַע יִשְׂרָאֵל',
      body:'When you say the first line of Shema - Hear Israel, Hashem is our God, Hashem is One - lots of kids (and grown-ups) cover their eyes with a hand. It shuts out the room for a second so you can really mean the words. The mitzvah is saying Shema with your heart in it. Covering your eyes is the trick that helps you get there.',
      terms:[['Shema Yisrael','"Hear Israel" - the first line of Shema'],
             ['kavanah','meaning the words, not just saying them']],
      source:'Berachos 13b; OC 61:4-5' },
    { id:'s3', game:'shul', icon:'run', title:'Do It Early',
      hebrew:'זְרִיזִין מַקְדִּימִין לְמִצְוֹת',
      body:'People who are keen do a mitzvah at the FIRST chance, not the last one. Leaving for shul early is not just being sensible about the clock - the eagerness is itself part of how the mitzvah is supposed to be done.',
      terms:[['Zerizin makdimin l\'mitzvos','"the eager get an early start on mitzvos"'],
             ['shul','synagogue (Yiddish)']],
      source:'Pesachim 4a' },
    { id:'s4', game:'shul', icon:'run', title:'Run There, Stroll Back',
      hebrew:'לָרוּץ לְבֵית הַכְּנֶסֶת',
      body:'The Gemara says: hurry on the way TO shul, but walk home calmly. Why? Because if you sprint out afterwards it looks like you could not wait to escape. Running toward something says you wanted to be there.',
      terms:[['Gemara','the discussions of the Sages that make up the Talmud'],
             ['Beis haknesses','synagogue - literally "house of gathering"']],
      source:'Berachos 6b' },
    { id:'s5', game:'shul', icon:'steps', title:'Every Step Counts',
      hebrew:'שְׂכַר פְּסִיעוֹת',
      body:'Living far from shul is not bad luck - the Gemara counts the steps. Each one on the way to a mitzvah gets its own reward. So the long way round is worth more, not less.',
      terms:[['Schar pesios','"the reward of the steps" - you get credit for the walk itself']],
      source:'Berachos 6b; Sotah 22a' },
    { id:'s6', game:'shul', icon:'people', title:'Daven With Everyone Else',
      hebrew:'תְּפִלָּה בְּצִבּוּר',
      body:'Hashem never turns away the prayer of a whole community. So try hard to daven with a minyan - and to daven in the same regular spot, rather than wherever you happen to land.',
      terms:[['Tefillah b\'tzibbur','praying together with the community'],
             ['minyan','a group of ten Jewish adults - the quorum needed for public prayer'],
             ['daven','Yiddish for pray']],
      source:'Berachos 8a; OC 90:9' },
    { id:'s7', game:'shul', icon:'clothes', title:'Your Shabbos Hat',
      hebrew:'כְּבוֹד שַׁבָּת',
      body:'Shabbos is supposed to look different from Tuesday - nicer clothes, not the same old weekday outfit. A hat you keep looking sharp for shul is how lots of families do that honour. It is not a rule that every Jew must own a hat worn only on Shabbos. Still: turning up with a soaking wet hat is a sloppy look for the day. Watch the sprinklers.',
      terms:[['Kavod Shabbos','honouring Shabbos - treating it like the special day it is'],
             ['Shul','the place people go to daven (pray) together']],
      source:'Shabbos 113a; OC 262:2-3' },

    /* ---- Kashrus / Kosher Sort ------------------------------------------ */
    { id:'k1', game:'kosher', icon:'split', title:'Meat and Milk: Three Rules',
      hebrew:'בָּשָׂר בְחָלָב',
      body:'Meat and milk together is not one rule, it is three. You may not COOK them together. You may not EAT the mixture. And you may not get any BENEFIT from it at all - you cannot sell it, and you cannot even give it to your dog.',
      terms:[['Basar b\'chalav','meat in milk'],
             ['hana\'ah','benefit - getting anything useful out of something']],
      source:'Chullin 115b; YD 87:1' },
    { id:'k2', game:'kosher', icon:'book', title:'Written Three Times',
      hebrew:'לֹא תְבַשֵּׁל גְּדִי בַּחֲלֵב אִמּוֹ',
      body:'"Do not cook a kid in its mother\'s milk" shows up three separate times in the Torah. The Sages asked the obvious question - why three? - and answered: one for cooking, one for eating, one for benefit. Nothing in the Torah is repeated for no reason.',
      terms:[['Lo sevashel gedi ba\'chalev imo','"do not cook a kid in its mother\'s milk"'],
             ['gedi','a young goat or lamb']],
      source:'Shemos 23:19, 34:26; Devarim 14:21; Chullin 115b' },
    { id:'k3', game:'kosher', icon:'leaf', title:'Pareve: The Neutral Team',
      hebrew:'פַּרְוֶה',
      body:'Eggs, fruit, vegetables and grains are neither meat nor milk. They are pareve, which means they can go with either side. Fish is pareve too, but it has extra rules: nobody eats fish and meat on the same plate. Fish with dairy depends on your family - lots of Ashkenazim do, Sephardim usually do not, and Chabad skip fish with milk. Ask at home.',
      terms:[['Pareve','neutral - neither meat nor dairy (a Yiddish word)']],
      source:'YD 87:3; OC 173:2' },
    { id:'k4', game:'kosher', icon:'clock', title:'The Wait In Between',
      hebrew:'הַמְתָּנָה בֵּין בָּשָׂר לְחָלָב',
      body:'After meat you wait before having anything dairy. Six hours is the most common custom; some families wait three, some one - it depends where your family is from, so ask. Going the other way (milk then meat) is much quicker. And hard cheese is the exception: many treat it like meat and wait the full time.',
      terms:[['Hamtanah','the waiting period'],
             ['minhag','a custom - something a family or community has always done']],
      source:'Chullin 105a; YD 89:1-2 with Rema' },
    { id:'k5', game:'kosher', icon:'fish', title:'Fins and Scales',
      hebrew:'סְנַפִּיר וְקַשְׂקֶּשֶׂת',
      body:'A fish is kosher only if it has BOTH fins and scales. Shrimp, lobster, crab, squid and octopus have neither, so no cooking trick in the world makes them kosher. Salmon and tuna have both. Easy test.',
      terms:[['Snapir v\'kaskeses','fins and scales']],
      source:'Vayikra 11:9-12' },
    { id:'k6', game:'kosher', icon:'hoof', title:'You Need Both Signs',
      hebrew:'מַפְרֶסֶת פַּרְסָה וּמַעֲלַת גֵּרָה',
      body:'A kosher land animal must chew its cud AND have fully split hooves. Both. The pig is the famous trap: split hooves, ticks one box, looks kosher from underneath - but it does not chew its cud, so it is not. One sign is never enough.',
      terms:[['Mafreses parsah','having split hooves'],
             ['Ma\'alas gerah','chewing the cud - bringing food back up to chew again']],
      source:'Vayikra 11:3-7; Chullin 59a' },
    { id:'k7', game:'kosher', icon:'stamp', title:'Why a Hechsher',
      hebrew:'הֶכְשֵּׁר',
      body:'On a factory snack, reading the ingredients is often not enough. What machine was it made on? What was made on that machine yesterday? What is hiding inside the word "flavouring"? A hechsher is somebody whose job is to go and actually look. Food from a kosher kitchen at home does not need a stamp on the bowl.',
      terms:[['Hechsher','a kosher certification - the symbol on the packet'],
             ['mashgiach','the person who supervises and checks the food']],
      source:'YD 118; and the laws of absorbed taste, YD 92-99' },
    { id:'k8', game:'kosher', icon:'bug', title:'Check the Lettuce',
      hebrew:'תּוֹלָעִים',
      body:'Swallowing one tiny bug can break several Torah prohibitions at the same time - which is a lot of trouble for something you did not even taste. That is why leafy greens, berries, and grains get washed and checked, usually against the light.',
      terms:[['Tola\'im','worms or insects'],
             ['aveirah','a transgression - doing something the Torah says not to']],
      source:'Vayikra 11:41-43; YD 84' },
    { id:'k9', game:'kosher', icon:'split', title:'Two Sets of Everything',
      hebrew:'כֵּלִים נִפְרָדִים',
      body:'Pots and pans soak up the taste of whatever was cooked in them - invisibly, but really. So meat and dairy get their own pots, plates and cutlery. Lots of kitchens also keep two sinks or two counters - that is extra care, not the basic rule. The must-have is two sets of the things that touch the food.',
      terms:[['Keilim','vessels - pots, pans, plates, cutlery'],
             ['bli\'ah','absorption - the taste soaked into a pot wall']],
      source:'YD 88-89, 93' },

    /* ---- Pesach / Matzah Delivery Havoc --------------------------------- */
    { id:'p1', game:'matzah', icon:'clock', title:'The Morning It All Stops',
      hebrew:'עֶרֶב פֶּסַח',
      body:'On Erev Pesach the clock runs out in two stages. You may EAT chametz until the end of the fourth halachic hour. You may still own it for one more hour. After that it has to be gone - burned, sold or destroyed. Your shul publishes the exact minutes every year, because they move.',
      terms:[['Erev Pesach','the day before Pesach begins'],
             ['chametz','anything leavened - bread, cake, pasta, beer'],
             ['sha\'ah zmanis','a "halachic hour" - one twelfth of the daylight']],
      source:'Pesachim 11b; OC 443:1' },
    { id:'p2', game:'matzah', icon:'candle', title:'The Search by Candlelight',
      hebrew:'בְּדִיקַת חָמֵץ',
      body:'The night before Erev Pesach you search the house for chametz - every pocket, every shelf, anywhere a crumb could have travelled during the year. The classic way is by the light of a candle, so you look at one small place at a time. Some families dim the big lights; a flashlight is fine too if that is what you use to see.',
      terms:[['Bedikas chametz','the search for chametz'],
             ['Nissan','the Jewish month Pesach falls in']],
      source:'Pesachim 2a; OC 431:1, 433:1' },
    { id:'p3', game:'matzah', icon:'scroll', title:'Saying It Is Not Mine',
      hebrew:'בִּיטּוּל חָמֵץ',
      body:'After the search - and again after the burning the next morning - you say a declaration: any chametz I did not find is not mine, it is like the dust of the ground. Because the problem on Pesach is not only eating chametz, it is OWNING it. So you stop owning it out loud.',
      terms:[['Bittul','nullifying - declaring something worthless and not yours'],
             ['Kol chamira','the opening words of that declaration']],
      source:'Pesachim 6b; OC 434:2' },
    { id:'p4', game:'matzah', icon:'clock', title:'Eighteen Minutes',
      hebrew:'שִׁיעוּר מִיל',
      body:'Flour and water start turning into chametz once dough sits around unworked for the time it takes to walk a mil - which we hold is about eighteen minutes. That is why a matzah bakery is a sprint: mix, roll, bake, then stop everything and scrub every surface before the next batch.',
      terms:[['Mil','an old distance measure; the time to walk it is about 18 minutes'],
             ['matzah','flat unleavened bread - flour and water, baked fast']],
      source:'Pesachim 46a; OC 459:2 with Mishnah Berurah' },
    { id:'p5', game:'matzah', icon:'matzah', title:'Guarded Matzah',
      hebrew:'מַצָּה שְׁמוּרָה',
      body:'Shemura matzah is watched to keep it away from water - from the moment the wheat is cut, or at the latest from when it is ground. The point is that at no moment along the way could that grain have quietly started rising without anyone noticing.',
      terms:[['Shemura','"guarded" or "watched"'],
             ['Matzah shemura','matzah made from grain watched from harvest or grinding']],
      source:'Pesachim 40a; OC 453:4' },
    { id:'p6', game:'matzah', icon:'matzah', title:'One Kezayis',
      hebrew:'כְּזַיִת מַצָּה',
      body:'On the first night of Pesach there is a Torah obligation to eat a kezayis of matzah at the Seder. Outside Israel we do a second Seder the next night too, and eat matzah then as well. Here is what surprises people: for the rest of Pesach there is no obligation to eat matzah at all. There is only the rule against chametz. You eat matzah the other days because, well, what else is there.',
      terms:[['Kezayis','"like an olive" - a measure of food, roughly an olive\'s volume'],
             ['Seder','the Pesach night meal with the Haggadah']],
      source:'Pesachim 120a; OC 475:1' },
    { id:'p7', game:'matzah', icon:'ban', title:'Chametz After Pesach',
      hebrew:'חָמֵץ שֶׁעָבַר עָלָיו הַפֶּסַח',
      body:'If a Jew owned chametz right through Pesach, that chametz stays forbidden forever afterwards. The Sages made this rule as a deterrent - so nobody would think "I will just hide the crates for eight days and sell them on the ninth". Now the crates are worthless. Problem solved.',
      terms:[['Chametz she\'avar alav haPesach','chametz that "Pesach passed over" while a Jew owned it'],
             ['Chazal','the Sages of the Talmud']],
      source:'Pesachim 29a; OC 448:3' },
    { id:'p8', game:'matzah', icon:'ban', title:'Not Seen, Not Found',
      hebrew:'בַּל יֵרָאֶה וּבַל יִמָּצֵא',
      body:'Two separate rules, both about simply HAVING chametz: it must not be seen in your space, and it must not be found there. Every other forbidden food you just do not eat - you can own it all day. Chametz on Pesach is the one where keeping it is itself the problem.',
      terms:[['Bal yeira\'eh','"it shall not be seen"'],
             ['Bal yimatzei','"it shall not be found"']],
      source:'Shemos 12:19, 13:7; Pesachim 5b' },

    /* ---- General -------------------------------------------------------- */
    { id:'g1', game:'general', icon:'book', title:'Learning Beats Doing (Because)',
      hebrew:'תַּלְמוּד גָּדוֹל',
      body:'The Sages had a whole debate: which is greater, learning or doing? They landed on learning - but only for one reason: learning is what leads you to do it right. A game is a small thing. But knowing WHY a mitzvah works the way it does is what makes it stay with you.',
      terms:[['Talmud gadol','"study is greater" - the conclusion of that debate'],
             ['Chazal','the Sages of the Talmud']],
      source:'Kiddushin 40b' },
    { id:'g2', game:'general', icon:'rosette', title:'One Mitzvah Drags Another',
      hebrew:'מִצְוָה גוֹרֶרֶת מִצְוָה',
      body:'Ben Azzai said: run to an easy mitzvah the same way you run to a hard one, because one mitzvah pulls the next one along behind it. And do not do it for the prize - the reward for a mitzvah IS the mitzvah.',
      terms:[['Mitzvah goreres mitzvah','"a mitzvah drags a mitzvah" - one leads to another'],
             ['Pirkei Avos','a book of the Mishnah full of advice about how to live']],
      source:'Pirkei Avos 4:2' },

    /* ---- Tzedakah / Tzedaka Blast -------------------------------------- */
    { id:'t1', game:'tzedaka', icon:'coin', title:'Enough for What He Is Missing',
      hebrew:'דֵּי מַחְסֹרוֹ',
      body:'The Torah does not say "give some money". It says open your hand and give him dei machsoro - enough for what HE is missing. Not a fixed amount. What this person is short of. The Gemara pushes it to an extreme: someone who used to be rich and is now embarrassed to walk everywhere might need a horse - so you get him a horse.',
      terms:[['Dei machsoro','"enough for what he lacks" - you fill THIS person\'s gap'],
             ['Tzedakah','giving to someone in need; the word means "justice", not "charity"'],
             ['Rambam','Rav Moshe ben Maimon (Maimonides), who wrote a huge code of Jewish law']],
      source:'Devarim 15:8; Kesubos 67b; Rambam Hilchos Matnos Aniyim 7:3' },
    { id:'t2', game:'tzedaka', icon:'hand', title:'Into His Hand, Not the Dust',
      hebrew:'אַל יָשֹׁב דַּךְ נִכְלָם',
      body:'Tzedakah is measured by what it does to the person getting it. A coin that lands in the dirt and has to be picked up in front of a street full of people has taken more from him than it gave. Get it into his hand.',
      terms:[['Al yashuv dach nichlam','"let not the crushed one turn away ashamed"'],
             ['Ani','a poor person']],
      source:'Tehillim 74:21; Rambam Matnos Aniyim 10:4-5' },
    { id:'t3', game:'tzedaka', icon:'seter', title:'So Neither One Knows',
      hebrew:'מַתָּן בַּסֵּתֶר',
      body:'Rambam lists eight levels of giving, worst to best. Near the very top: the giver does not know who got it, and the receiver does not know who gave it. In the Beis HaMikdash there was a room for exactly this - the Chamber of Secrets. Quiet people put money in. Poor people from good families took money out. Nobody ever saw anybody.',
      terms:[['Matan b\'seter','giving in secret'],
             ['Lishkas chasha\'im','"the Chamber of the Secret Ones" - that room in the Temple']],
      source:'Rambam Matnos Aniyim 10:7-9; Shekalim 5:6; Bava Basra 10b' },
    { id:'t5', game:'tzedaka', icon:'people', title:'Who Comes First',
      hebrew:'עֲנִיֵּי עִירְךָ קוֹדְמִין',
      body:'You cannot help everybody, so there is an order. Your own poor relatives come before other poor people. The poor of your own city come before the poor of somewhere else. This is not playing favourites - it is the opposite. If everyone is equally your job, then nobody actually is.',
      terms:[['Aniyei ircha kodmin','"the poor of your city come first"'],
             ['kedimah','priority - who goes first']],
      source:'Bava Metzia 71a; Shulchan Aruch YD 251:3' },
    { id:'t6', game:'tzedaka', icon:'hand', title:'Before He Has to Ask',
      hebrew:'קֹדֶם שֶׁיִּשְׁאַל',

  byId: function (id) {
    for (var i = 0; i < Halacha.cards.length; i++) if (Halacha.cards[i].id === id) return Halacha.cards[i];
    return null;
  },
  badgeById: function (id) {
    for (var i = 0; i < Halacha.badges.length; i++) if (Halacha.badges[i].id === id) return Halacha.badges[i];
    return null;
  },
  forGame: function (game) {
    return Halacha.cards.filter(function (c) { return c.game === game; });
  },
  /* Prefer a card the player has not read yet, otherwise cycle. */
  next: function (game, index) {
    var pool = Halacha.forGame(game === 'kitchen' ? 'kosher' : game);
    if (!pool.length) pool = Halacha.cards;
    for (var i = 0; i < pool.length; i++) {
      if (!Profile.data.cardsSeen[pool[i].id]) return pool[i];
    }
    return pool[(index | 0) % pool.length];
  },
  totalCards: function () { return Halacha.cards.length; }
};

        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    },
    pushka: function (ctx) {
      ctx.lineWidth = 8;
      ctx.strokeRect(-34, -8, 68, 50);
      ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(16, -8); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -34, 13, 0, TAU); ctx.fill();
    },
    hand: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-34, 6);
      ctx.quadraticCurveTo(-40, 34, -6, 42);
      ctx.quadraticCurveTo(30, 46, 36, 18);
      ctx.lineTo(36, 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-34, 6); ctx.lineTo(-34, -12);
      ctx.moveTo(-11, 4); ctx.lineTo(-11, -26);
      ctx.moveTo(12, 4); ctx.lineTo(12, -22);
      ctx.moveTo(34, 6); ctx.lineTo(34, -8);
      ctx.stroke();
    },
    seter: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-42, 0);
      ctx.quadraticCurveTo(0, -34, 42, 0);
      ctx.quadraticCurveTo(0, 34, -42, 0);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-38, 30); ctx.lineTo(38, -30); ctx.stroke();
    },
    lift: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-40, 30); ctx.quadraticCurveTo(-14, 30, -6, 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(40, 30); ctx.quadraticCurveTo(14, 30, 6, 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(0, -36); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-20, -18); ctx.lineTo(0, -40); ctx.lineTo(20, -18); ctx.stroke();
    },
    sling: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(0, 4); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(-28, -26);
      ctx.moveTo(0, 6); ctx.lineTo(28, -26);
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-28, -26); ctx.quadraticCurveTo(0, 6, 28, -26); ctx.stroke();
    },
    heart: function (ctx) {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(0, 40);
      ctx.quadraticCurveTo(-44, 8, -44, -12);
      ctx.arc(-22, -12, 22, Math.PI, 0);
      ctx.arc(22, -12, 22, Math.PI, 0);
      ctx.quadraticCurveTo(44, 8, 0, 40);
      ctx.closePath(); ctx.stroke();
    },
    rosette: function (ctx) {
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, TAU);
      ctx.fill();
      for (var i = 0; i < 6; i++) {
        var a = i * TAU / 6;
        ctx.save();
        ctx.translate(Math.cos(a) * 24, Math.sin(a) * 24);
        ctx.rotate(a);
        ctx.beginPath();
        ctx.ellipse(0, 0, 17, 10, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, TAU);
      ctx.stroke();
    }
  }
};

/* ==========================================================================
   14. GAME CORE - STATE MACHINE, LOOP, HUD, POPUPS, BADGE AWARDS
   States: MENU / GALLERY / INTRO / PLAYING / PAUSED / HALACHA_POPUP / GAME_OVER
   ========================================================================== */
var Game = {
  time: 0, dt: 0, fps: 60,
  state: 'MENU', prevState: null,
  scene: null,
  popup: null,
  gameover: null,
  toasts: [],
  accum: 0, lastTs: 0, running: false,
  pauseBtn: null,
  stateT: 0,

  /* ------------------------------------------------------------- setup */
  init: function () {
    Profile.load();
    Lang.boot();
    Nusach.boot();
    View.init();
    Input.init();
    Clouds.ensure();
    Screens.init();
    Game.pauseBtn = new Button(0, 0, 68, 68, '', function () { Game.pause(); },
      { fill: 'rgba(10,16,36,.85)', stroke: 'rgba(255,255,255,.45)', radius: 20, icon: null });
    Game.setState('MENU');
    Game.running = true;
    Game.lastTs = performance.now();
    requestAnimationFrame(Game.loop);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (Game.state === 'PLAYING') Game.pause();
        Sound.stopMusic();
      } else if (Game.state === 'MENU' || Game.state === 'GALLERY') {
        Sound.playMusic('menu');
      }
    }, false);
  },

  setState: function (s) {
    Game.prevState = Game.state;
    Game.state = s;
    Game.stateT = 0;
    if (s === 'MENU' || s === 'GALLERY') Sound.playMusic('menu');
    if (s === 'PLAYING') Sound.playMusic('play');
    if (s === 'GAME_OVER') Sound.stopMusic();
  },

  /* ------------------------------------------------------ game lifecycle */
  startGame: function (id) {
    if (id === 'chain') {
      MitzHost.open('kosher-chain');
      return;
    }
    if (id === 'sukkah') {
      MitzHost.open('sukkah');
      return;
    }
    FX.reset();
    Input.clear();
    var ctor = { menorah: MenorahKeeper, shul: ShulCrossing, kosher: KosherSort,
                 kitchen: KitchenMatch, matzah: MatzahHavoc, tzedaka: TzedakaBlast }[id];
    if (!ctor) return;
    Game.scene = new ctor();
    Game.scene.reset();
    Game.gameover = null;
    Screens.buildIntro(Game.scene);
    Game.setState('INTRO');
  },

  beginPlay: function () {
    Input.clear();
    /* start wherever the picker was left - chapter 1 unless you chose another
       one you have already earned */
    var s = Game.scene;
    if (s && s.startAt && s.chapters) {
      var ch = s.chapters();
      if (ch && ch.count) {
        if (s.skipToGift && typeof s.startBoss === 'function') {
          s.startLevel = 8;
          s.startAt(8);
          s.startBoss({ fromSkip: true });
          s.skipToGift = false;
        } else {
          var n = clamp(s.startLevel || 1, 1, Math.min(ch.count, Profile.reached(ch.key)));
          s.startLevel = n;
          s.startAt(n);
        }
      }
    }
    Game.setState('PLAYING');
  },

  pause: function () {
    if (Game.state !== 'PLAYING') return;
    Game.setState('PAUSED');
    Sound.sfx('back');
    Screens.buildPause();
  },
  resume: function () {
    if (Game.state !== 'PAUSED') return;
    Input.clear();
    Game.setState('PLAYING');
  },
  quitToMenu: function () {
    Sound.stopMusic();
    Game.scene = null;
    Game.popup = null;
    FX.reset();
    Input.clear();
    Screens.buildMenu();
    Game.setState('MENU');
  },

  endGame: function (scene, reason, cardId) {
    if (!scene || Game.state === 'GAME_OVER') return;
    var isBest = Profile.submitScore(scene.id, scene.score);
    var earned = Math.max(1, Math.round(scene.score / 10) + scene.level * 5);
    Profile.addPoints(earned);
    if (Profile.data.mitzvahPoints >= 1000) Game.award('b_1000');
    if (Profile.cardSeenCount() >= Halacha.totalCards()) Game.award('b_scholar');
    Game.gameover = {
      id: scene.id, name: scene.name, score: Math.floor(scene.score),
      best: Profile.data.high[scene.id], isBest: isBest, points: earned,
      reason: reason || scene.failReason || 'Run complete',
      victory: !!scene.victory,
      level: scene.level, stats: scene.stats ? scene.stats() : [],
      helped: scene.helped || 0,
      sliced: scene.sliced || 0,
      deliveries: scene.deliveries || 0,
      hops: scene.hops || 0,
      plates: scene.platesTotal || scene.plates || 0,
      sorted: scene.sortedTotal || 0
    };
    if (scene.victory) { Sound.seq([784, 988, 1175, 1568], 130, 0.3, 0.28, 'triangle'); Haptics.win(); }
    else { Sound.sfx('lose'); Haptics.fail(); }
    if (scene.victory && (scene.id === 'tzedaka' || scene.id === 'matzah' || scene.id === 'shul' || scene.id === 'kosher' || scene.id === 'kitchen')) {
      Screens.buildGameOver();
      Game.setState('GAME_OVER');
      return;
    }
    var card = (cardId && Halacha.byId(cardId)) || Halacha.next(scene.id, scene.level);
    Game.showCard(card, function () {
      Screens.buildGameOver();
      Game.setState('GAME_OVER');
    });
  },

  /* ------------------------------------------------- halacha flash cards */
  showCard: function (card, onClose) {
    if (typeof card === 'string') card = Halacha.byId(card);
    if (!card) { if (onClose) onClose(); return; }
    var isNew = Profile.seeCard(card.id);
    Game.popup = { card: card, onClose: onClose || null, t: 0, isNew: isNew,
      scroll: 0, dragging: false, vel: 0, maxScroll: 0 };
    Screens.buildPopup();
    Game.prevPlayState = Game.state;
    Game.setState('HALACHA_POPUP');
    Sound.sfx('levelup');
    Haptics.medium();
    if (Profile.cardSeenCount() >= Halacha.totalCards()) Game.award('b_scholar');
  },
  closeCard: function () {
    var cb = Game.popup ? Game.popup.onClose : null;
    Game.popup = null;
    Input.clear();
    if (cb) cb();
    else Game.setState(Game.prevPlayState === 'HALACHA_POPUP' ? 'PLAYING' : (Game.prevPlayState || 'PLAYING'));
  },

  /* ------------------------------------------------------------- badges */
  award: function (badgeId) {
    if (!badgeId) return false;
    if (!Profile.unlockBadge(badgeId)) return false;
    var b = Halacha.badgeById(badgeId);
    Game.toast('Badge unlocked: ' + (b ? b.name : badgeId), b ? b.icon : 'rosette', C.gold);
    Sound.sfx('badge');
    Haptics.win();
    return true;
  },
  toast: function (text, icon, color) {
    Game.toasts.push({ text: text, icon: icon || 'rosette', color: color || C.gold, age: 0, life: 3.0 });
    if (Game.toasts.length > 3) Game.toasts.shift();
  },

  /* --------------------------------------------------------------- input */
  handle: function (ev) {
    if (ev.type === 'escape') {
      if (Game.state === 'PLAYING') Game.pause();
      else if (Game.state === 'PAUSED') Game.resume();
      else if (Game.state === 'GALLERY') { Screens.buildMenu(); Game.setState('MENU'); }
      return;
    }
    switch (Game.state) {
      case 'MENU':          Screens.menu.handle(ev); break;
      case 'GALLERY':       Screens.gallery.handle(ev); break;
      case 'INTRO':         UI.handle(Screens.introBtns, ev); break;
      case 'PAUSED':        UI.handle(Screens.pauseBtns, ev); break;
      case 'HALACHA_POPUP': Screens.popupHandle(ev); break;
      case 'GAME_OVER':     UI.handle(Screens.overBtns, ev); break;
      case 'PLAYING':
        if (ev.type === 'tap' && Game.pauseBtn.contains(ev.x, ev.y)) {
          Sound.sfx('ui'); Haptics.light(); Game.pause(); return;
        }
        if (ev.type === 'down' && Game.pauseBtn.contains(ev.x, ev.y)) { Game.pauseBtn.press = 1; return; }
        if (Game.scene) Game.scene.handle(ev);
        break;
    }
  },

  /* -------------------------------------------------------------- update */
  update: function (dt) {
    Game.stateT += dt;
    var evs = Input.drain();
    for (var i = 0; i < evs.length; i++) Game.handle(evs[i]);
    if (Game.state === 'PLAYING' && Game.scene) Game.scene.update(dt);
    if (Game.state === 'MENU') Screens.menu.update(dt);
    if (Game.state === 'GALLERY') Screens.gallery.update(dt);
    if (Game.state === 'HALACHA_POPUP') Screens.popupUpdate(dt);
    if (Game.popup) Game.popup.t += dt;
    Game.pauseBtn.update(dt);
    FX.update(dt);
    for (var j = Game.toasts.length - 1; j >= 0; j--) {
      Game.toasts[j].age += dt;
      if (Game.toasts[j].age >= Game.toasts[j].life) Game.toasts.splice(j, 1);
    }
  },

  /* -------------------------------------------------------------- render */
  render: function () {
    var ctx = View.ctx;
    View.begin();
    ctx.save();
    if (Game.state === 'PLAYING' || Game.state === 'PAUSED' ||
        Game.state === 'HALACHA_POPUP' || Game.state === 'INTRO' || Game.state === 'GAME_OVER') {
      ctx.save();
      FX.applyShake(ctx);
      if (Game.scene) Game.scene.render(ctx);
      FX.render(ctx);
      ctx.restore();
      FX.renderFlash(ctx);
      if (Game.state === 'PLAYING' || Game.state === 'PAUSED') Game.renderHud(ctx);
      if (Game.state === 'INTRO') Screens.renderIntro(ctx);
      if (Game.state === 'PAUSED') Screens.renderPause(ctx);
      if (Game.state === 'HALACHA_POPUP') Screens.renderPopup(ctx);
      if (Game.state === 'GAME_OVER') Screens.renderGameOver(ctx);
    } else if (Game.state === 'MENU') {
      Screens.menu.render(ctx);
    } else if (Game.state === 'GALLERY') {
      Screens.gallery.render(ctx);
    }
    Game.renderToasts(ctx);
    ctx.restore();
    View.end();
  },

  renderHud: function (ctx) {
    var s = Game.scene;
    if (!s) return;
    var top = View.safe.t;
    var lx = 26 + View.safe.l;
    ctx.save();
    /* soft top scrim so the HUD stays readable over any scene */
    var g = ctx.createLinearGradient(0, 0, 0, top + 260);
    g.addColorStop(0, 'rgba(3,5,12,.88)');
    g.addColorStop(0.55, 'rgba(3,5,12,.55)');
    g.addColorStop(1, 'rgba(3,5,12,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, top + 260);

    Draw.text(ctx, fmt(s.score), lx, top + 44, { size: 52, color: C.gold, weight: '900', stroke: 'rgba(0,0,0,.65)', strokeW: 6 });
    Draw.text(ctx, 'BEST ' + fmt(Profile.data.high[s.id] || 0), lx + 2, top + 82, { size: 21, color: 'rgba(255,255,255,.62)', weight: '700' });
    Draw.hearts(ctx, lx + 8, top + 118, s.lives, s.maxLives, 26);

    /* pause button */
    Game.pauseBtn.x = CFG.W - 94 - View.safe.r;
    Game.pauseBtn.y = top + 16;
    Game.pauseBtn.draw(ctx, Game.time);
    var px = Game.pauseBtn.x + 34, py = Game.pauseBtn.y + 34;
    ctx.fillStyle = C.cream;
    ctx.fillRect(px - 12, py - 15, 8, 30);
    ctx.fillRect(px + 4, py - 15, 8, 30);

    if (s.combo >= 3) {
      var cw = 1 + 0.1 * pulse(Game.time, 3);
      ctx.save();
      ctx.translate(CFG.W / 2, top + 52);
      ctx.scale(cw, cw);
      Draw.text(ctx, 'x' + s.combo + ' COMBO', 0, 0, {
        size: 30, color: C.teal, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.6)', strokeW: 5
      });
      ctx.restore();
    }
    ctx.restore();
    if (s.renderHud) s.renderHud(ctx, top + 150);
  },

  renderToasts: function (ctx) {
    var baseY = CFG.H - 130 - View.safe.b;
    var stackY = baseY;
    for (var i = 0; i < Game.toasts.length; i++) {
      var t = Game.toasts[i];
      var k = t.age < 0.3 ? easeOut(t.age / 0.3) : (t.age > t.life - 0.4 ? (t.life - t.age) / 0.4 : 1);
      var w = 640, x = (CFG.W - w) / 2;
      var textX = x + 84, textW = w - 108;
      var lines = Draw.wrap(ctx, t.text, textW, 22, '800');
      if (lines.length > 3) lines = lines.slice(0, 3);
      var h = Math.max(68, 28 + lines.length * 28);
      var top = stackY - h;
      stackY = top - 12;
      ctx.save();
      ctx.globalAlpha = clamp(k, 0, 1);
      Draw.panel(ctx, x, top, w, h, { fill: 'rgba(14,20,44,.96)', stroke: t.color, radius: 18, glow: t.color, glowBlur: 20 });
      Icons.draw(ctx, t.icon, x + 46, top + h / 2, 38, t.color);
      for (var L = 0; L < lines.length; L++) {
        Draw.text(ctx, lines[L], textX, top + h / 2 - (lines.length - 1) * 14 + L * 28, {
          size: 22, color: C.cream, weight: '800'
        });
      }
      ctx.restore();
    }
  },

  /* ---------------------------------------------------------------- loop */
  loop: function (ts) {
    if (!Game.running) return;
    requestAnimationFrame(Game.loop);
    try {
      var raw = (ts - Game.lastTs) / 1000;
      Game.lastTs = ts;
      if (!isFinite(raw) || raw < 0) raw = 0;
      if (raw > CFG.MAX_FRAME) raw = CFG.MAX_FRAME;
      Game.fps = lerp(Game.fps, 1 / Math.max(0.001, raw), 0.05);
      Game.accum += raw;
      var steps = 0;
      while (Game.accum >= CFG.STEP && steps < 5) {
        Game.time += CFG.STEP;
        Game.dt = CFG.STEP;
        Game.update(CFG.STEP);
        Game.accum -= CFG.STEP;
        steps++;
      }
      if (steps === 0) { Game.time += raw; }
      Game.render();
    } catch (err) {
      try { if (typeof console !== 'undefined' && console.error) console.error(err); } catch (_) {}
    }
  }
};

/* ==========================================================================
   15. MINIGAME BASE CLASS
   ========================================================================== */
function MiniGame(id, name) {
  this.id = id;
  this.name = name;
  this.score = 0;
  this.lives = 3;
  this.maxLives = 3;
  this.combo = 0;
  this.bestCombo = 0;
  this.level = 1;
  this.elapsed = 0;
  this.mult = 1;
  this.failReason = '';
  this.tips = [];
  this.cardIndex = 0;
}
MiniGame.prototype.reset = function () {};
MiniGame.prototype.update = function (dt) { this.elapsed += dt; };
MiniGame.prototype.render = function (ctx) {};
MiniGame.prototype.handle = function (ev) {};
MiniGame.prototype.stats = function () { return []; };

MiniGame.prototype.award = function (badgeId) { return Game.award(badgeId); };
MiniGame.prototype.addScore = function (n, x, y, label, color) {
  n = Math.round(n * this.mult);
  this.score += n;
  if (x != null) FX.text(x, y, (label || '+' + n), color || C.gold, label ? 32 : 34);
  return n;
};
MiniGame.prototype.hitCombo = function () {
  this.combo++;
  if (this.combo > this.bestCombo) this.bestCombo = this.combo;
};
MiniGame.prototype.breakCombo = function () { this.combo = 0; };
MiniGame.prototype.damage = function (reason, x, y) {
  this.lives--;
  this.breakCombo();
  this.failReason = reason || this.failReason;
  FX.shake(16, 0.35);
  FX.flash(C.red, 0.25);
  Sound.sfx('hurt');
  Haptics.heavy();
  if (x != null) FX.text(x, y, reason || 'Oops', C.red, 30);
  if (this.lives <= 0) { this.lives = 0; this.finish(reason); }
};
MiniGame.prototype.finish = function (reason, cardId) {
  Game.endGame(this, reason, cardId);
};
/* Interstitial Halacha flash card between levels. */
MiniGame.prototype.interstitial = function (cb) {
  var card = Halacha.next(this.id, this.cardIndex++);
  Game.showCard(card, cb || function () { Game.setState('PLAYING'); Input.clear(); });
};

var Screens = {
  introBtns: [], pauseBtns: [], overBtns: [], popupBtns: [],
  init: function () {
    Screens.buildMenu();
    Screens.buildGallery();
  },

  /* ------------------------------------------------------------ backdrop */
  backdrop: function (ctx, t) {
    Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, [
      [0, '#04060e'], [0.35, '#0a1128'], [0.72, '#16204a'], [1, '#251a3c']
    ]);
    Clouds.render(ctx, t, 'rgba(188,205,238,1)', 0.15);
    /* skyline silhouette */
    ctx.save();
    ctx.fillStyle = '#070a18';
    ctx.beginPath();
    ctx.moveTo(0, CFG.H);
    var seed = 0;
    for (var x = 0; x <= CFG.W; x += 60) {
      seed = (x * 9301 + 49297) % 233280;
      var h = 120 + (seed / 233280) * 190;
      ctx.lineTo(x, CFG.H - h);
      ctx.lineTo(x + 60, CFG.H - h);
    }
    ctx.lineTo(CFG.W, CFG.H);
    ctx.closePath();
    ctx.fill();
    /* lit windows */
    ctx.fillStyle = 'rgba(255,207,92,.30)';
    for (var i = 0; i < 40; i++) {
      var wx = ((i * 137) % 700) + 10;
      var wy = CFG.H - 40 - ((i * 53) % 210);
      if ((i * 7) % 3 === 0) ctx.fillRect(wx, wy, 8, 12);
    }
    ctx.restore();
  },

  /* ---------------------------------------------------------- MAIN MENU */
  menu: {
    t: 0,
    btns: [],
    update: function (dt) { Screens.menu.t += dt; },
    handle: function (ev) { UI.handle(Screens.menu.btns, ev); },
    render: function (ctx) {
      var t = Screens.menu.t;
      Screens.backdrop(ctx, t);
      var top = View.safe.t;

  drawMiniMenorah: function (ctx, cx, cy, w, t) {
    ctx.save();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    var arm = w / 8;
    for (var i = -4; i <= 4; i++) {
      if (i === 0) continue;
      var x = cx + i * arm;
      var hgt = 90 - Math.abs(i) * 6;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(x, cy - Math.abs(i) * 22, x, cy - hgt);
      ctx.stroke();
      Draw.flame(ctx, x, cy - hgt - 6, 9, t + i, true);
    }
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 130);
    ctx.stroke();
    Draw.flame(ctx, cx, cy - 136, 11, t, true);
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + 40);
    ctx.moveTo(cx - 48, cy + 44); ctx.lineTo(cx + 48, cy + 44);
    ctx.stroke();
    ctx.restore();
  },
