ShulCrossing.prototype.scene = function () {
  var S = ShulCrossing.SCENES;
  return S[(clamp(this.level, 1, ShulCrossing.WALKS) - 1) % S.length];
};
ShulCrossing.prototype.tune = function () { return this.scene(); };
ShulCrossing.prototype.say = function (title, sub, color, dur) {
  this.banner = { title: title, sub: sub || '', color: color || C.gold, t: dur || 3, max: dur || 3 };
};

ShulCrossing.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.level = 1; this.elapsed = 0; this.mult = 1;
  this.hops = 0; this.arrivals = 0; this.rides = 0; this.dry = 0; this.pushkas = 0;
  this.closeCalls = 0;
  this.metStall = false; this.metMinyan = false; this.metBus = false;
  this.setupWalk(true);
};

ShulCrossing.prototype.setupWalk = function (fresh) {
  var t = this.tune();
  this.cfg = t;
  if (fresh) {
    this.col = 4; this.row = 0;
    this.px = 4; this.py = 0;
    this.fromCol = 4; this.fromRow = 0;
    this.hopT = 0; this.hopDur = 0.10;
    this.camRow = 0; this.maxRow = 0;
    this.rows = {}; this.generatedTo = -1; this.prunedTo = 0;
    this.goalRow = t.len;
  } else {
    this.goalRow = Math.round(this.py) + t.len;
    var here = Math.round(this.py);
    this.rows[here] = { type: 'safe', r: here, decor: [], blocked: [] };
    for (var r = here + 1; r <= this.generatedTo; r++) delete this.rows[r];
    this.generatedTo = here;
  }
  this.zmanMax = t.zman; this.zman = t.zman;
  this.hat = 1;
  this.invuln = 0;
  this.riding = null;
  this.rideOffset = 0;
  this.remountCool = 0;
  this.facing = 1;
  this.stun = 0;
  this.flashGoal = 0;
  this.banner = null;
  this.landT = 0;
  this.rideTick = 0;
  this._justLanded = false;
  this._zmanCeil = -1;
  this.flakes = [];
  if (t.rain) {
    for (var f = 0; f < 80; f++) {
      this.flakes.push({ x: rand(-40, CFG.W + 40), y: rand(0, CFG.H), sp: rand(380, 640) });
    }
  }
  this.ensureRows();
  this.say(t.name, t.sub, C.gold, 3);
};

ShulCrossing.prototype.rowY = function (r) {
  return ShulCrossing.BASE_Y - (r - this.camRow) * ShulCrossing.CELL;
};

ShulCrossing.prototype.ensureRows = function () {
  var need = Math.ceil(this.camRow) + 16;
  while (this.generatedTo < need) {
    this.generatedTo++;
    this.rows[this.generatedTo] = this.makeRow(this.generatedTo);
  }
  var cutoff = Math.floor(this.camRow) - 24;
  if (cutoff > this.prunedTo) {
    for (var r = this.prunedTo; r < cutoff; r++) delete this.rows[r];
    this.prunedTo = cutoff;
  }
};

ShulCrossing.prototype.makeRow = function (r) {
  var t = this.tune();
  if (r <= 2) return { type: 'safe', r: r, decor: this.decor(r), blocked: [] };
  if (r === this.goalRow) return { type: 'shul', r: r, decor: [] };
  if (r > this.goalRow) return { type: 'safe', r: r, decor: this.decor(r), blocked: [] };
  if (r === this.goalRow - 1) return { type: 'safe', r: r, decor: this.decor(r), blocked: [] };

  var prev = this.rows[r - 1], prev2 = this.rows[r - 2], prev3 = this.rows[r - 3];
  var roadRun = 0;
  if (prev && prev.type === 'road') roadRun++;
  if (prev2 && prev2.type === 'road') roadRun++;
  if (prev3 && prev3.type === 'road') roadRun++;
  var maxRoad = t.roadRun || 2;
  var roll = Math.random();
  var type;
  if (roadRun >= maxRoad) {
    type = chance(0.5) ? (t.puddle > 0.2 ? 'puddle' : 'safe') : (t.minyan > 0.05 && chance(0.45) ? 'minyan' : 'safe');
  } else if (roll < t.roadP) type = 'road';
  else if (roll < t.roadP + t.puddle) type = 'puddle';
  else if (roll < t.roadP + t.puddle + (t.minyan || 0)) type = 'minyan';
  else type = 'safe';

  if (type === 'road') {
    var isFood = chance(t.food);
    var isBus = !isFood && t.bus && chance(0.32);
    var isScoot = !isFood && !isBus && t.scooter && chance(0.4);
    var dir = chance(0.5) ? 1 : -1;
    var speed = rand(95, 160) * t.spd * (1 + Math.min(this.level, 8) * 0.08);
    if (isFood) speed *= 0.62;
    if (isBus) speed *= 0.72;
    if (isScoot) speed *= 1.35;
    var kind = isFood ? 'truck' : (isBus ? 'bus' : (isScoot ? 'scooter' : pick(['car', 'car', 'van', 'taxi'])));
    var w = isFood ? 176 : (kind === 'bus' ? 200 : (kind === 'van' ? 150 : (kind === 'taxi' ? 128 : (kind === 'scooter' ? 78 : 118))));
    var minGap = w + Math.max(140, 175 - Math.min(this.level, 8) * 8);
    var count = Math.max(2, Math.floor(ShulCrossing.TRACK / minGap));
    var gap = ShulCrossing.TRACK / count;
    var items = [];
    for (var n = 0; n < count; n++) {
      var kosher = isFood ? chance(0.45) : false;
      items.push({
        x: -200 + n * gap, w: w, kind: kind, kosher: kosher,
        color: isFood ? (kosher ? '#f2d24b' : '#8d3a3a') : ShulCrossing.paint(kind)
      });
    }
    return { type: 'road', r: r, dir: dir, speed: speed, items: items, food: isFood, zebra: chance(0.28) };
  }
  if (type === 'minyan') {
    var dirM = chance(0.5) ? 1 : -1;
    var wM = 70;
    var minGapM = wM + 140;
    var countM = Math.max(3, Math.floor(ShulCrossing.TRACK / minGapM));
    var gapM = ShulCrossing.TRACK / countM;
    var walkers = [];
    for (var m = 0; m < countM; m++) {
      walkers.push({
        x: -200 + m * gapM, w: wM, kind: 'walker',
        coat: pick(['#2f5fbf', '#8a2f3f', '#1c5c40', '#4a3f7a', '#37707c']),
        hat: pick(['#1a2540', '#2a1218', '#14281e', '#241a3a']),
        skin: pick(['#f0c39a', '#f6d3ae', '#c98d63', '#e8b489'])
      });
    }
    return { type: 'minyan', r: r, dir: dirM, speed: rand(70, 110) * t.spd, items: walkers };
  }
  if (type === 'puddle') {
    var pud = [];
    var countP = randInt(2, 4);
    var cols = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, countP);
    for (var i = 0; i < cols.length; i++) {
      pud.push({ col: cols[i], phase: rand(0, TAU), period: rand(2.2, 3.6) });
    }
    return { type: 'puddle', r: r, puddles: pud };
  }
  var blocked = [];
  if (t.stall && chance(0.55)) {
    var nB = randInt(1, 2);
    var bcols = shuffle([0, 1, 2, 3, 5, 6, 7, 8]).slice(0, nB);
    for (var b = 0; b < bcols.length; b++) blocked.push(bcols[b]);
  }
  var pushka = (!blocked.length && chance(0.16)) ? randInt(0, 8) : -1;
  var blockKind = (t.id === 'market' || t.id === 'stone') ? 'stall' : 'cone';
  return { type: 'safe', r: r, decor: this.decor(r), blocked: blocked, blockKind: blockKind, pushka: pushka };
};

ShulCrossing.paint = function (kind) {
  if (kind === 'truck') return '#f2d24b';
  if (kind === 'bus') return pick(['#3a6ea8', '#c45a3a', '#4a8a5a']);
  if (kind === 'van') return pick(['#e8e4d8', '#8fb8e0', '#d9a05b']);
  if (kind === 'taxi') return '#f0c43a';
  if (kind === 'scooter') return pick(['#5fe0b0', '#ff9d5c']);
  return pick(['#e2604f', '#4aa3ff', '#a883ff', '#52e08a', '#f5f0e2']);
};

ShulCrossing.prototype.decor = function (r) {
  var d = [], t = this.cfg || this.tune();
  var n = randInt(t.night ? 1 : 0, 3);
  for (var i = 0; i < n; i++) {
    d.push({
      col: randInt(0, 8),
      kind: t.night ? (chance(0.55) ? 'lamp' : (chance(0.5) ? 'tree' : 'bench'))
                    : (chance(0.5) ? 'tree' : 'bench'),
      off: rand(-16, 16)
    });
  }
  return d;
};

ShulCrossing.prototype.isBlocked = function (r, c) {
  var row = this.rows[r];
  if (!row || !row.blocked) return false;
  for (var i = 0; i < row.blocked.length; i++) if (row.blocked[i] === c) return true;
  return false;
};

/* ------------------------------------------------------------- movement */
ShulCrossing.prototype.hop = function (dc, dr) {
  if (this.stun > 0) return;
  var nc = clamp(this.col + dc, 0, ShulCrossing.COLS - 1);
  var nr = Math.max(0, this.row + dr);
  if (nc === this.col && nr === this.row) return;
  if (this.isBlocked(nr, nc)) {
    Sound.sfx('back');
    FX.text(nc * ShulCrossing.CELL + ShulCrossing.CELL / 2, this.rowY(nr) - 20, 'BLOCKED!', 'rgba(255,255,255,.7)', 20, 1.2);
    if (!this.metStall) {
      this.metStall = true;
      this.say('WEAVE!', 'stalls and cones close a square', C.gold, 2.2);
    }
    return;
  }
  if (this.riding) { this.col = Math.round(this.px); this.riding = null; }
  this.fromCol = this.px; this.fromRow = this.py;
  this.col = nc; this.row = nr;
  this.hopT = this.hopDur;
  if (dc !== 0) this.facing = dc > 0 ? 1 : -1;
  Sound.sfx('hop');
  Haptics.light();
  if (dr > 0) {
    this.hops++;
    Profile.noteBest('crossings', this.hops);
    if (this.hops >= 50) this.award('b_steps');
  }
  if (nr > this.maxRow) {
    var gain = (nr - this.maxRow) * 10;
    this.maxRow = nr;
    this.addScore(gain, null);
    this.hitCombo();
    if (this.combo === 4) FX.text(this.px * ShulCrossing.CELL + 40, this.rowY(this.py) - 70, 'NICE!', C.teal, 26, 2.4);
    else if (this.combo === 8) FX.text(this.px * ShulCrossing.CELL + 40, this.rowY(this.py) - 70, 'STREAK!', C.gold, 28, 2.4);
    else if (this.combo === 12) FX.text(this.px * ShulCrossing.CELL + 40, this.rowY(this.py) - 70, 'KEEP GOING!', C.gold, 30, 2.4);
    else if (this.combo === 16) FX.text(this.px * ShulCrossing.CELL + 40, this.rowY(this.py) - 70, 'ZERIZUS!', C.gold, 32, 2.6);
  } else if (dr <= 0) {
    this.breakCombo();
  }
};

ShulCrossing.prototype.handle = function (ev) {
  if (ev.type === 'tap') { this.hop(0, 1); return; }
  if (ev.type === 'swipe') {
    if (ev.dir === 'left') this.hop(-1, 0);
    else if (ev.dir === 'right') this.hop(1, 0);
    else if (ev.dir === 'down') this.hop(0, -1);
    else this.hop(0, 1);
  }
};

/* --------------------------------------------------------------- update */
ShulCrossing.prototype.update = function (dt) {
  this.elapsed += dt;
  if (this.stun > 0) this.stun -= dt;
  if (this.invuln > 0) this.invuln -= dt;
  if (this.flashGoal > 0) this.flashGoal -= dt;
  if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

  /* hop animation */
  if (this.hopT > 0) {
    this.hopT -= dt;
    var k = 1 - clamp(this.hopT / this.hopDur, 0, 1);
    this.px = lerp(this.fromCol, this.col, easeOut(k));
    this.py = lerp(this.fromRow, this.row, easeOut(k));
    if (this.hopT <= 0) {
      this.px = this.col; this.py = this.row;
      this.landT = 0.12;
      this._justLanded = true;
      FX.burst(this.px * ShulCrossing.CELL + ShulCrossing.CELL / 2, this.rowY(this.py) + 18,
        { n: 4, color: 'rgba(255,255,255,.35)', spdMax: 80, grav: 200 });
    }
  }
  if (this.landT > 0) this.landT -= dt;

  /* camera looks a little ahead while you hop forward */
  var look = (this.row > this.fromRow && this.hopT > 0) ? 0.65 : 0.12;
  this.camRow = lerp(this.camRow, this.py + look, clamp(dt * 12, 0, 1));
  if (this.camRow < this.maxRow - 4) this.camRow = this.maxRow - 4;
  this.ensureRows();

  /* rain */
  if (this.flakes && this.flakes.length) {
    for (var f = 0; f < this.flakes.length; f++) {
      var fl = this.flakes[f];
      fl.y += fl.sp * dt;
      fl.x -= 40 * dt;
      if (fl.y > CFG.H + 12) { fl.y = -12; fl.x = rand(-40, CFG.W + 40); }
    }
  }

  /* traffic + minyan - streets hurry a little when the zman is tight */
  var haste = (this.zman / this.zmanMax < 0.28 || this.level >= 12) ? 1.18 : 1;
  var lo = Math.floor(this.camRow) - 12, hi = Math.ceil(this.camRow) + 16;
  for (var r = lo; r <= hi; r++) {
    var row = this.rows[r];
    if (!row || (row.type !== 'road' && row.type !== 'minyan')) continue;
    for (var i = 0; i < row.items.length; i++) {
      var it = row.items[i];
      it.x += row.dir * row.speed * haste * dt;
      if (it.x > ShulCrossing.TRACK - 200) it.x -= ShulCrossing.TRACK;
      if (it.x < -200) it.x += ShulCrossing.TRACK;
    }
  }

  /* riding a kosher food truck or a walker */
  if (this.remountCool > 0) this.remountCool -= dt;
  if (this.riding) {
    var t = this.riding;
    this.rideTick += dt;
    if (this.rideTick >= 0.55) {
      this.rideTick = 0;
      this.score += Math.round(6 * this.mult);
    }
    this.px = clamp((t.x + this.rideOffset) / ShulCrossing.CELL - 0.5, -1, ShulCrossing.COLS);
    if (this.px < -0.4 || this.px > ShulCrossing.COLS - 0.6) {
      var edge = this.px < 1;
      var rideKind = t.kind;
      this.col = clamp(Math.round(this.px) + (edge ? 1 : -1), 0, ShulCrossing.COLS - 1);
      this.px = this.col;
      this.riding = null;
      this.rideTick = 0;
      this.remountCool = 1.1;
      this.invuln = Math.max(this.invuln, 1.1);
      FX.text(this.px * ShulCrossing.CELL + 40, this.rowY(this.py) - 60,
        rideKind === 'walker' ? 'whoa!' : 'off the truck!', C.gold, 24);
    }
  } else {
    this.rideTick = 0;
  }

  /* collisions on the current row */
  var cur = this.rows[Math.round(this.py)];
  var playerX = this.px * ShulCrossing.CELL + ShulCrossing.CELL / 2;
  if (cur && cur.type === 'road' && this.hopT <= 0) {
    var onTruck = null, hit = null;
    for (var j = 0; j < cur.items.length; j++) {
      var v = cur.items[j];
      if (playerX > v.x - v.w / 2 - 20 && playerX < v.x + v.w / 2 + 20) {
        if (v.kind === 'truck' && v.kosher) onTruck = v; else hit = v;
      }
    }
    if (onTruck && this.remountCool <= 0) {
      if (this.riding !== onTruck) {
        this.riding = onTruck;
        this.rideOffset = playerX - onTruck.x;
        this.invuln = Math.max(this.invuln, 3);
        this.rides++;
        this.award('b_tank');
        this.addScore(40, playerX, this.rowY(this.py) - 70, 'KOSHER FOOD RIDE!', C.gold);
        Sound.sfx('shield'); Haptics.medium();
        FX.ring(playerX, this.rowY(this.py), C.gold, 40);
      }
    } else if (hit && this.invuln <= 0) {
      this.damage(hit.kind === 'truck' ? 'Flattened by a treif truck' : 'Hit by traffic',
        playerX, this.rowY(this.py) - 60);
      if (this.lives > 0) {
        this.invuln = 2.2;
        this.row = Math.max(0, this.row - 1);
        this.col = clamp(Math.round(this.px), 0, ShulCrossing.COLS - 1);
        this.px = this.col; this.py = this.row;
        this.riding = null;
      }
      this._justLanded = false;
      return;
    } else if (this._justLanded) {
      this.tryCloseCall(cur, playerX);
    }
    if (!this.metBus && cur.items[0] && cur.items[0].kind === 'bus') {
      this.metBus = true;
      this.say('BUS!', 'wide and slow - hop the gap', C.gold, 2.2);
    }
  } else if (cur && cur.type === 'minyan' && this.hopT <= 0) {
    var onWalk = null;
    for (var w = 0; w < cur.items.length; w++) {
      var wk = cur.items[w];
      if (playerX > wk.x - wk.w / 2 - 12 && playerX < wk.x + wk.w / 2 + 12) onWalk = wk;
    }
    if (onWalk && this.remountCool <= 0) {
      if (this.riding !== onWalk) {
        this.riding = onWalk;
        this.rideOffset = playerX - onWalk.x;
        if (!this.metMinyan) {
          this.metMinyan = true;
          this.say('HOP ON!', 'ride with them across', C.teal, 2.4);
        }
      }
    } else if (!onWalk && !this.riding && this.invuln <= 0) {
      this.stun = 0.28;
      this.breakCombo();
      this.row = Math.max(0, this.row - 1);
      this.col = clamp(Math.round(this.px), 0, ShulCrossing.COLS - 1);
      this.px = this.col; this.py = this.row;
      this.invuln = 0.45;
      Sound.sfx('back');
      FX.text(playerX, this.rowY(this.py) - 50, 'EXCUSE ME!', C.cream, 22, 1.6);
    }
  } else if (cur && cur.type === 'puddle' && this.hopT <= 0) {
    for (var p = 0; p < cur.puddles.length; p++) {
      var pd = cur.puddles[p];
      var on = Math.sin(this.elapsed * TAU / pd.period + pd.phase) > 0.15;
      if (on && pd.col === Math.round(this.px) && !pd.hitRecently) {
        pd.hitRecently = 1.4;
        var wasDry = this.hat >= 0.999;
        this.hat = clamp(this.hat - 0.25, 0, 1);
        this.stun = 0.35;
        this.breakCombo();
        Sound.sfx('splat'); Haptics.double();
        FX.burst(playerX, this.rowY(this.py), { n: 14, color: '#7fc8ff', spdMax: 240 });
        FX.text(playerX, this.rowY(this.py) - 60, wasDry ? 'WET HAT!' : 'WETTER!', C.blue, 26);
      }
    }
  } else if (cur && cur.type === 'safe' && this.hopT <= 0 && cur.pushka >= 0 && Math.round(this.px) === cur.pushka) {
    cur.pushka = -1;
    this.pushkas++;
    this.addScore(80, playerX, this.rowY(this.py) - 60, 'PUSHKA +80', C.gold);
    Sound.sfx('coin'); Haptics.light();
    FX.burst(playerX, this.rowY(this.py) - 20, { n: 12, color: C.gold, spdMax: 220 });
  }
  if (cur && cur.puddles) {
    for (var q = 0; q < cur.puddles.length; q++) {
      if (cur.puddles[q].hitRecently > 0) cur.puddles[q].hitRecently -= dt;
    }
  }

  /* arrival at the shul */
  if (Math.round(this.py) >= this.goalRow && this.hopT <= 0) {
    this.arrive();
    return;
  }

  /* the zman clock */
  this.zman -= dt;
  if (this.zman < 10 && this.zman > 0) {
    var ceilZ = Math.ceil(this.zman);
    if (ceilZ !== this._zmanCeil) {
      this._zmanCeil = ceilZ;
      if (ceilZ <= 8) Sound.sfx('ui');
    }
  }
  if (this.zman <= 0) {
    this.zman = this.zmanMax * 0.7;
    this.damage('Missed the zman', playerX, this.rowY(this.py) - 60);
  }
  this._justLanded = false;
};

ShulCrossing.prototype.tryCloseCall = function (row, playerX) {
  if (!row || row.type !== 'road' || this.riding) return;
  var best = 1e9;
  for (var i = 0; i < row.items.length; i++) {
    var d = Math.abs(playerX - row.items[i].x) - row.items[i].w / 2;
    if (d < best) best = d;
  }
  if (best >= 6 && best < 48) {
    this.closeCalls++;
    this.addScore(25, playerX, this.rowY(this.py) - 72, 'CLOSE!', C.teal);
    Sound.sfx('whoosh');
    Haptics.light();
  }
};

ShulCrossing.prototype.arrive = function () {
  var self = this;
  this.arrivals++;
  var inTime = this.zman > 0;
  var bonus = 300 + this.level * 120;
  if (inTime) { this.mult = Math.min(4, this.mult + 0.5); this.award('b_zman'); }
  if (this.hat >= 0.999) { bonus += 250; this.dry++; this.award('b_dry'); }
  if (this.arrivals >= 3) this.award('b_minyan');
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.gold, 0.45);
  FX.text(CFG.W / 2, 620, 'YOU MADE IT!  +' + bonus, C.gold, 40, 3);
  if (this.mult > 1) FX.text(CFG.W / 2, 690, 'Mitzvah Multiplier x' + this.mult.toFixed(1), C.teal, 30, 3);
  for (var i = 0; i < 30; i++) FX.burst(rand(100, 620), rand(500, 800), { n: 1, color: pick([C.gold, C.teal, C.cream]), spdMax: 300 });

  if (this.level >= ShulCrossing.WALKS) {
    this.victory = true;
    this.award('b_walks');
    this.finish('You made it all thirty!');
    return;
  }
  this.level++;
  this.interstitial(function () {
    self.setupWalk(false);
    Input.clear();
    Game.setState('PLAYING');
  });
};

/* --------------------------------------------------------------- render */
ShulCrossing.prototype.render = function (ctx) {
  var CELL = ShulCrossing.CELL, S = this.scene();
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, S.sky);
  var lo = Math.floor(this.camRow) - 12, hi = Math.ceil(this.camRow) + 15;
  var r, row, y, i;

  var groundY = this.rowY(-1) + CELL / 2;
  if (groundY < CFG.H) {
    ctx.fillStyle = S.grass;
    ctx.fillRect(0, groundY, CFG.W, CFG.H - groundY);
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.fillRect(0, groundY, CFG.W, 8);
  }

  for (r = hi; r >= lo; r--) {
    row = this.rows[r];
    if (!row) continue;
    y = this.rowY(r);
    if (y < -CELL * 2 || y > CFG.H + CELL * 2) continue;
    this.drawRow(ctx, row, y, S);
  }
  for (r = hi; r >= lo; r--) {
    row = this.rows[r];
    if (!row || (row.type !== 'road' && row.type !== 'minyan')) continue;
    y = this.rowY(r);
    if (y < -CELL * 2 || y > CFG.H + CELL * 2) continue;
    if (row.type === 'road') {
      for (i = 0; i < row.items.length; i++) this.drawVehicle(ctx, row.items[i], y, row.dir);
    } else {
      for (i = 0; i < row.items.length; i++) this.drawWalker(ctx, row.items[i], y);
    }
  }
  this.drawPlayer(ctx);
  if (this.flakes && this.flakes.length) {
    ctx.save();
    ctx.strokeStyle = 'rgba(180,210,230,.5)';
    ctx.lineWidth = 1.5;
    for (i = 0; i < this.flakes.length; i++) {
      var fl = this.flakes[i];
      ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(fl.x - 4, fl.y + 11); ctx.stroke();
    }
    ctx.restore();
  }
  this.drawBanner(ctx);
};

ShulCrossing.prototype.drawRow = function (ctx, row, y, S) {
  var CELL = ShulCrossing.CELL, i;
  S = S || this.scene();
  ctx.save();
  if (row.type === 'safe' || row.type === 'minyan') {
    ctx.fillStyle = (row.r % 2 === 0) ? S.grass : S.grass2;
    ctx.fillRect(0, y - CELL / 2, CFG.W, CELL);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    ctx.fillRect(0, y + CELL / 2 - 6, CFG.W, 6);
    if (row.type === 'minyan') {
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.fillRect(0, y - 6, CFG.W, 12);
    }
    if (row.decor) {
      for (i = 0; i < row.decor.length; i++) {
        var d = row.decor[i];
        var dx = d.col * CELL + CELL / 2 + d.off;
        if (d.kind === 'lamp') {
          ctx.fillStyle = '#2a2418';
          ctx.fillRect(dx - 3, y - 8, 6, 36);
          ctx.fillStyle = 'rgba(255,196,110,.22)';
          ctx.beginPath(); ctx.arc(dx, y - 16, 18, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgba(255,214,140,.85)';
          ctx.beginPath(); ctx.arc(dx, y - 16, 5, 0, TAU); ctx.fill();
        } else if (d.kind === 'tree') {
          var sway = Math.sin(this.elapsed * 1.4 + d.col) * 3;
          ctx.fillStyle = '#5a3d22';
          ctx.fillRect(dx - 6 + sway * 0.3, y - 4, 12, 26);
          ctx.fillStyle = '#1f6b3f';
          ctx.beginPath(); ctx.arc(dx + sway, y - 18, 26, 0, TAU); ctx.fill();
          ctx.fillStyle = '#2b8a52';
          ctx.beginPath(); ctx.arc(dx - 7 + sway, y - 24, 18, 0, TAU); ctx.fill();
        } else {
          ctx.fillStyle = '#8b6236';
          Draw.rr(ctx, dx - 26, y - 4, 52, 12, 4); ctx.fill();
          ctx.fillRect(dx - 22, y + 8, 7, 14);
          ctx.fillRect(dx + 15, y + 8, 7, 14);
        }
      }
    }
    if (row.blocked) {
      for (i = 0; i < row.blocked.length; i++) {
        var bx = row.blocked[i] * CELL + CELL / 2;
        if (row.blockKind === 'stall') {
          ctx.fillStyle = '#6a3a22';
          Draw.rr(ctx, bx - 22, y - 4, 44, 22, 4); ctx.fill();
          ctx.fillStyle = '#c45a3a';
          ctx.beginPath();
          ctx.moveTo(bx - 26, y - 4); ctx.lineTo(bx, y - 28); ctx.lineTo(bx + 26, y - 4);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f2d24b';
          ctx.fillRect(bx - 10, y + 2, 8, 8);
          ctx.fillStyle = '#e2604f';
          ctx.fillRect(bx + 2, y + 2, 8, 8);
        } else {
          ctx.fillStyle = '#c45a28';
          ctx.beginPath();
          ctx.moveTo(bx, y - 22);
          ctx.lineTo(bx + 18, y + 18);
          ctx.lineTo(bx - 18, y + 18);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f4ead4';
          ctx.fillRect(bx - 10, y - 2, 20, 7);
        }
      }
    }
    if (row.pushka >= 0) {
      var px = row.pushka * CELL + CELL / 2;
      var glow = 0.55 + 0.45 * pulse(this.elapsed, 2.2);
      ctx.save();
      ctx.globalAlpha = glow;
      ctx.fillStyle = '#c9a24a';
      Draw.rr(ctx, px - 16, y - 8, 32, 28, 6); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#6a4a18';
      ctx.fillRect(px - 10, y - 4, 20, 6);
      Draw.text(ctx, 'PUSHKA', px, y + 28, { size: 11, color: '#6a4a18', align: 'center', weight: '900' });
    }
  } else if (row.type === 'road') {
    ctx.fillStyle = S.road || C.road;
    ctx.fillRect(0, y - CELL / 2, CFG.W, CELL);
    ctx.strokeStyle = 'rgba(233,226,201,.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([26, 22]);
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(CFG.W, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(0, y - CELL / 2, CFG.W, 4);
    if (row.zebra) {
      ctx.fillStyle = 'rgba(233,226,201,.22)';
      for (i = 0; i < 9; i++) ctx.fillRect(i * CELL + 18, y - 22, 14, 44);
    }
  } else if (row.type === 'puddle') {
    ctx.fillStyle = '#6b6f7d';
    ctx.fillRect(0, y - CELL / 2, CFG.W, CELL);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (i = 0; i < 9; i++) ctx.fillRect(i * CELL, y - CELL / 2, 2, CELL);
    for (i = 0; i < row.puddles.length; i++) {
      var p = row.puddles[i];
      var on = Math.sin(this.elapsed * TAU / p.period + p.phase) > 0.15;
      var px = p.col * CELL + CELL / 2;
      ctx.save();
      ctx.globalAlpha = on ? 0.92 : 0.32;
      ctx.fillStyle = on ? C.water : 'rgba(80,110,140,.6)';
      ctx.beginPath();
      ctx.ellipse(px, y + 6, 32, 16, 0, 0, TAU);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = 'rgba(200,235,255,.9)';
        ctx.lineWidth = 3;
        for (var k = 0; k < 3; k++) {
          ctx.beginPath();
          ctx.arc(px, y + 6, 10 + k * 9 + (this.elapsed * 26 % 9), Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  } else if (row.type === 'shul') {
    ctx.fillStyle = S.plaza || '#c9b184';
    ctx.fillRect(0, y - CELL / 2, CFG.W, CELL);
    ctx.fillStyle = '#e8d9b4';
    Draw.rr(ctx, 110, y - CELL / 2 - 150, 500, 200, 10); ctx.fill();
    ctx.fillStyle = '#b79a63';
    ctx.fillRect(110, y - CELL / 2 - 24, 500, 24);
    /* dome */
    ctx.fillStyle = '#d9c48e';
    ctx.beginPath();
    ctx.arc(360, y - CELL / 2 - 150, 96, Math.PI, 0);
    ctx.fill();
    Draw.magenDavid(ctx, 360, y - CELL / 2 - 262, 26, '#8a6a2f', 5);
    /* doors + windows */
    ctx.fillStyle = '#6c4a25';
    Draw.rr(ctx, 310, y - CELL / 2 - 100, 100, 100, 10); ctx.fill();
    var near = this.goalRow - this.py < 6;
    ctx.save();
    ctx.globalAlpha = near ? 0.55 + 0.45 * pulse(this.elapsed, 2.4) : 0.8;
    ctx.fillStyle = 'rgba(255,220,140,.9)';
    [170, 230, 490, 550].forEach(function (wx) {
      Draw.rr(ctx, wx - 22, y - CELL / 2 - 120, 44, 62, 20); ctx.fill();
    });
    ctx.restore();
    Draw.text(ctx, 'BEIS KNESSES', 360, y - CELL / 2 - 14, {
      size: 22, color: '#4a3417', align: 'center', weight: '900'
    });
    /* a few people already there - coats and hats, faces and hands only */
    var crowd = [
      { x: 150, coat: '#2f5fbf', hat: '#1a2540' },
      { x: 200, coat: '#8a2f3f', hat: '#2a1218' },
      { x: 520, coat: '#1c5c40', hat: '#14281e' },
      { x: 570, coat: '#4a3f7a', hat: '#241a3a' }
    ];
    for (i = 0; i < crowd.length; i++) {
      var cf = crowd[i];
      ctx.fillStyle = cf.coat;
      Draw.rr(ctx, cf.x - 12, y - 18, 24, 32, 6); ctx.fill();
      ctx.fillStyle = '#f6f4ee';
      Draw.rr(ctx, cf.x - 5, y - 16, 10, 14, 3); ctx.fill();
      ctx.fillStyle = '#e8bb92';
      ctx.beginPath(); ctx.arc(cf.x, y - 26, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = cf.hat;
      Draw.rr(ctx, cf.x - 13, y - 32, 26, 5, 2); ctx.fill();
      Draw.rr(ctx, cf.x - 8, y - 40, 16, 10, 3); ctx.fill();
    }
  }
  ctx.restore();
};

ShulCrossing.prototype.drawVehicle = function (ctx, v, y, dir) {
  var w = v.w, h = 54;
  var x = v.x;
  if (x + w / 2 < -40 || x - w / 2 > CFG.W + 40) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  Draw.rr(ctx, x - w / 2 + 6, y - h / 2 + 12, w, h, 12); ctx.fill();
  if (v.kind === 'truck') {
    var ko = v.kosher;
    ctx.fillStyle = v.color;
    Draw.rr(ctx, x - w / 2, y - h / 2 - 12, w, h + 12, 12); ctx.fill();
    ctx.fillStyle = ko ? '#fff6d6' : '#2a1414';
    Draw.rr(ctx, x - w / 2 + 10, y - h / 2 - 6, w - 20, 30, 7); ctx.fill();
    Draw.text(ctx, ko ? 'KOSHER FOOD' : 'NOT KOSHER', x, y - h / 2 + 9, {
      size: 16, color: ko ? '#6b4f0c' : '#ffb0b0', align: 'center', weight: '900'
    });
    /* the badge on the side: a hechsher, or a crossed-out one */
    var bx = x + (dir > 0 ? w / 2 - 26 : -w / 2 + 26);
    ctx.save();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = ko ? '#4a3a10' : '#ffb0b0';
    ctx.beginPath(); ctx.arc(bx, y + 18, 12, 0, TAU); ctx.stroke();
    if (ko) {
      Draw.text(ctx, 'K', bx, y + 18, { size: 15, color: '#4a3a10', align: 'center', weight: '900' });
    } else {
      ctx.beginPath(); ctx.moveTo(bx - 8, y + 10); ctx.lineTo(bx + 8, y + 26); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#20242f';
    ctx.beginPath(); ctx.arc(x - w / 3, y + h / 2 - 2, 10, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 3, y + h / 2 - 2, 10, 0, TAU); ctx.fill();
  } else if (v.kind === 'bus') {
    ctx.fillStyle = v.color;
    Draw.rr(ctx, x - w / 2, y - h / 2 - 8, w, h + 14, 10); ctx.fill();
    ctx.fillStyle = 'rgba(20,30,55,.7)';
    for (var b = -2; b <= 2; b++) {
      Draw.rr(ctx, x + b * 32 - 12, y - h / 2 + 2, 22, 18, 4); ctx.fill();
    }
    ctx.fillStyle = '#20242f';
    ctx.beginPath(); ctx.arc(x - w / 3, y + h / 2 - 2, 11, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 3, y + h / 2 - 2, 11, 0, TAU); ctx.fill();
    Draw.text(ctx, 'BUS', x, y + 6, { size: 14, color: '#fff', align: 'center', weight: '900' });
  } else if (v.kind === 'scooter') {
    ctx.fillStyle = v.color;
    Draw.rr(ctx, x - w / 2, y - 14, w, 26, 10); ctx.fill();
    ctx.fillStyle = '#2b2f3d';
    ctx.beginPath(); ctx.arc(x - w / 4, y + 16, 12, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 4, y + 16, 12, 0, TAU); ctx.fill();
    var rx = x + (dir > 0 ? 6 : -6);
    ctx.fillStyle = '#20233a';
    Draw.rr(ctx, rx - 10, y - 28, 20, 22, 5); ctx.fill();
    ctx.fillStyle = '#f6f4ee';
    Draw.rr(ctx, rx - 4, y - 26, 8, 10, 2); ctx.fill();
    ctx.fillStyle = '#e8bb92';
    ctx.beginPath(); ctx.arc(rx, y - 34, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111320';
    Draw.rr(ctx, rx - 11, y - 40, 22, 5, 2); ctx.fill();
    Draw.rr(ctx, rx - 7, y - 48, 14, 10, 3); ctx.fill();
  } else if (v.kind === 'taxi') {
    ctx.fillStyle = v.color;
    Draw.rr(ctx, x - w / 2, y - h / 2, w, h, 12); ctx.fill();
    ctx.fillStyle = 'rgba(20,30,55,.75)';
    Draw.rr(ctx, x - w / 2 + (dir > 0 ? 14 : w * 0.35), y - h / 2 + 8, w * 0.4, h - 26, 7); ctx.fill();
    ctx.fillStyle = '#111320';
    Draw.rr(ctx, x - 18, y - h / 2 - 10, 36, 12, 3); ctx.fill();
    Draw.text(ctx, 'TAXI', x, y - h / 2 - 4, { size: 11, color: '#f0c43a', align: 'center', weight: '900' });
    ctx.fillStyle = '#20242f';
    ctx.beginPath(); ctx.arc(x - w / 3, y + h / 2 - 4, 11, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 3, y + h / 2 - 4, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.9)';
    ctx.fillRect(dir > 0 ? x + w / 2 - 8 : x - w / 2 + 2, y - 8, 6, 12);
  } else {
    ctx.fillStyle = v.color;
    Draw.rr(ctx, x - w / 2, y - h / 2, w, h, 12); ctx.fill();
    ctx.fillStyle = 'rgba(20,30,55,.75)';
    Draw.rr(ctx, x - w / 2 + (dir > 0 ? 14 : w * 0.35), y - h / 2 + 8, w * 0.4, h - 26, 7); ctx.fill();
    ctx.fillStyle = '#20242f';
    ctx.beginPath(); ctx.arc(x - w / 3, y + h / 2 - 4, 11, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 3, y + h / 2 - 4, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.9)';
    ctx.fillRect(dir > 0 ? x + w / 2 - 8 : x - w / 2 + 2, y - 8, 6, 12);
  }
  if (this.cfg && this.cfg.night && v.kind !== 'scooter') {
    var hx = dir > 0 ? x + w / 2 - 4 : x - w / 2 + 4;
    ctx.fillStyle = 'rgba(255,220,140,.55)';
    ctx.beginPath();
    ctx.moveTo(hx, y - 4);
    ctx.lineTo(hx + dir * 46, y - 16);
    ctx.lineTo(hx + dir * 46, y + 16);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
};

ShulCrossing.prototype.drawWalker = function (ctx, v, y) {
  var x = v.x;
  if (x + 40 < -20 || x - 40 > CFG.W + 20) return;
  var bob = Math.sin(this.elapsed * 8 + x * 0.04) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(0, 24, 16, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#181a2c';
  ctx.fillRect(-11, 16, 8, 12);
  ctx.fillRect(3, 16, 8, 12);
  ctx.fillStyle = v.coat || '#2f5fbf';
  Draw.rr(ctx, -14, -16, 28, 36, 7); ctx.fill();
  ctx.fillStyle = '#f6f4ee';
  Draw.rr(ctx, -6, -14, 12, 16, 3); ctx.fill();
  ctx.fillStyle = v.skin || '#f0c39a';
  ctx.beginPath(); ctx.arc(0, -26, 11, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-16, 2, 4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 2, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = v.hat || '#1a2540';
  Draw.rr(ctx, -16, -34, 32, 6, 3); ctx.fill();
  Draw.rr(ctx, -10, -44, 20, 12, 4); ctx.fill();
  ctx.restore();
};

ShulCrossing.prototype.drawBanner = function (ctx) {
  var b = this.banner;
  if (!b) return;
  var a = clamp(b.t / Math.min(0.45, b.max), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  Draw.panel(ctx, 40, 296, CFG.W - 80, b.sub ? 84 : 56, {
    fill: 'rgba(6,10,26,.92)', radius: 16, stroke: b.color, strokeW: 3, glow: b.color, glowBlur: 22
  });
  Draw.textSafe(ctx, b.title, CFG.W / 2, 332, { size: 28, maxW: CFG.W - 130, color: b.color, weight: '900' });
  if (b.sub) Draw.textSafe(ctx, b.sub, CFG.W / 2, 362, { size: 18, maxW: CFG.W - 130, color: 'rgba(255,255,255,.78)', weight: '800' });
  ctx.restore();
};

ShulCrossing.prototype.drawPlayer = function (ctx) {
  var CELL = ShulCrossing.CELL;
  var x = this.px * CELL + CELL / 2;
  var y = this.rowY(this.py);
  var hopK = this.hopT > 0 ? Math.sin((1 - this.hopT / this.hopDur) * Math.PI) : 0;
  var landK = this.landT > 0 ? this.landT / 0.12 : 0;
  var lift = hopK * 28;
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y + 24, 22 - hopK * 6 + landK * 6, 8, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (hopK > 0.35) {
    ctx.save();
    ctx.globalAlpha = hopK * 0.45;
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 22, y + 10); ctx.lineTo(x - 8, y + 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 22, y + 10); ctx.lineTo(x + 8, y + 22); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(x, y - lift);
  ctx.scale(1 + hopK * 0.08 - landK * 0.08, 1 - hopK * 0.1 + landK * 0.12);
  if (this.invuln > 0 && Math.floor(this.elapsed * 14) % 2 === 0) ctx.globalAlpha = 0.55;
  if (this.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * pulse(this.elapsed, 2);
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -8, 40, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  /* coat */
  ctx.fillStyle = '#20233a';
  Draw.rr(ctx, -20, -22, 40, 46, 8); ctx.fill();
  /* white shirt */
  ctx.fillStyle = '#f6f4ee';
  Draw.rr(ctx, -8, -20, 16, 26, 4); ctx.fill();
  /* legs */
  ctx.fillStyle = '#181a2c';
  ctx.fillRect(-14, 22, 11, 12);
  ctx.fillRect(3, 22, 11, 12);
  /* head */
  ctx.fillStyle = '#e8bb92';
  ctx.beginPath(); ctx.arc(0, -36, 15, 0, TAU); ctx.fill();
  /* The hat, and whether it is still dry. A soaked one goes dark and shiny
     and drips off the brim - you can see the bonus you just lost. */
  var wet = 1 - this.hat;
  ctx.fillStyle = wet > 0.001 ? '#0a0c16' : '#111320';
  Draw.rr(ctx, -22, -46, 44, 8, 4); ctx.fill();
  Draw.rr(ctx, -14, -60, 28, 16, 5); ctx.fill();
  if (wet > 0.001) {
    ctx.save();
    ctx.globalAlpha = 0.35 + wet * 0.4;
    ctx.fillStyle = '#7fc8ff';
    Draw.rr(ctx, -12, -58, 24, 5, 3); ctx.fill();
    Draw.rr(ctx, -20, -45, 40, 3, 2); ctx.fill();
    ctx.globalAlpha = 0.55 + wet * 0.35;
    var drips = wet > 0.6 ? 3 : (wet > 0.3 ? 2 : 1);
    for (var dp = 0; dp < drips; dp++) {
      var dx = -16 + dp * 16;
      var dy = -38 + Math.abs(Math.sin(this.elapsed * 3 + dp * 1.7)) * 5;
      ctx.beginPath();
      ctx.moveTo(dx, dy - 3);
      ctx.quadraticCurveTo(dx + 3, dy + 2, dx, dy + 6);
      ctx.quadraticCurveTo(dx - 3, dy + 2, dx, dy - 3);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
};

ShulCrossing.prototype.renderHud = function (ctx, y) {
  var w = CFG.W - 100, x = 50;
  /* zman bar - the clock climbing over and dropping down the far side */
  Draw.panel(ctx, x, y - 4, w, 66, { fill: 'rgba(6,10,26,.78)', radius: 18, stroke: 'rgba(255,255,255,.14)' });
  var barX = x + 54, barW = w - 108;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(barX, y + 44);
  ctx.quadraticCurveTo(barX + barW / 2, y - 8, barX + barW, y + 44);
  ctx.stroke();
  ctx.restore();
  var k = clamp(1 - this.zman / this.zmanMax, 0, 1);
  var sx = barX + barW * k;
  var sy = y + 44 - Math.sin(k * Math.PI) * 52 * 0.92;
  var clockS = k > 0.8 ? 32 + pulse(this.elapsed, 6) * 6 : 32;
  Icons.draw(ctx, 'clock', sx, sy, clockS, k > 0.8 ? C.red : C.gold);
  Icons.draw(ctx, 'people', x + 28, y + 30, 30, 'rgba(255,255,255,.5)');
  Draw.magenDavid(ctx, x + w - 28, y + 30, 14, C.gold, 3);
  Draw.text(ctx, mmss(this.zman), x + w / 2, y + 52, {
    size: 20, color: k > 0.8 ? C.red : 'rgba(255,255,255,.7)', align: 'center', weight: '800'
  });

  /* the hat + distance */
  var by = y + 76;
  var dryHat = this.hat >= 0.999;
  Draw.text(ctx, dryHat ? 'DRY HAT' : 'WET HAT', x, by, {
    size: 17, color: dryHat ? 'rgba(255,255,255,.6)' : '#7fc8ff', weight: '800'
  });
  Draw.meter(ctx, x + 190, by - 9, 180, 18, this.hat, {
    fg: dryHat ? C.cream : (this.hat > 0.3 ? '#7fc8ff' : C.red)
  });
  var togo = Math.max(0, this.goalRow - Math.round(this.py));
  Draw.text(ctx, togo + ' to shul', x + w, by, { size: 19, color: C.gold, align: 'right', weight: '900' });
  Draw.textFit(ctx, this.cfg ? this.cfg.name : '', x, by + 26, 280, {
    size: 16, color: 'rgba(255,255,255,.5)', weight: '800'
  });
  if (this.mult > 1) {
    Draw.text(ctx, 'x' + this.mult.toFixed(1) + ' mitzvah multiplier', x + w, by + 26,
      { size: 17, color: C.teal, align: 'right', weight: '800' });
  }
};

ShulCrossing.prototype.stats = function () {
  return [
    ['Arrivals at shul', this.arrivals],
    ['Forward hops', this.hops],
    ['Kosher truck rides', this.rides],
    ['Spotless arrivals', this.dry],
    ['Pushkas dropped in', this.pushkas],
    ['Close calls', this.closeCalls]
  ];
};

    { k:'pareve', name:'Olive Oil',    shape:'oilbottle',hint:'Oil is pareve - swipe DOWN.' },
    { k:'meat',   name:'Taco',         shape:'taco',     hint:'A beef taco with no cheese is fleishig - swipe LEFT.' },
    { k:'dairy',  name:'Truffle',      shape:'truffle',  hint:'A milk-chocolate truffle is milchig - swipe RIGHT.' },
    { k:'pareve', name:'Salt',         shape:'salt',     hint:'Salt is pareve - swipe DOWN.' },

  this.spawnT = 0.7;
  this.rushT = 0;
  this.rushTimer = t.rush ? 14 : 18;
  this.mult = 1;
  this.grabs = {};
  this.hint = null;
  this.banner = null;
  this.say(t.name, t.sub, C.gold, 3);
};

KosherSort.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.level = 1; this.elapsed = 0;
  this.sortedTotal = 0;
  this.correct = 0; this.wrong = 0; this.missed = 0;
  this.pareveOk = 0; this.mixedOk = 0; this.treifOk = 0;
  this.beltPhase = 0;
  this.uncovered = 0;
  this.rushes = 0;
  this.binFlash = { left: 0, right: 0, down: 0, up: 0 };
  this.setupShift();
};

KosherSort.prototype.rushEvery = function () { return Math.max(13, 26 - this.level * 1.3); };

KosherSort.prototype.speed = function () {
  return (100 + Math.min(this.level, 14) * 24) * (this.rushT > 0 ? 1.55 : 1);
};
KosherSort.prototype.interval = function () {
  return Math.max(0.55, 1.55 - this.level * 0.085) * (this.rushT > 0 ? 0.6 : 1);
};

KosherSort.prototype.spawn = function () {
  var t = this.scene();
  var pool = Foods.list;
  var weights = { meat: 1, dairy: 1, pareve: 1, mixed: t.mixed || 0, treif: t.junk || 0 };
  var candidates = [];
  for (var i = 0; i < pool.length; i++) {
    var w = weights[pool[i].k];
    if (w == null) w = 1;
    if (w <= 0) continue;
    if (w >= 1 || Math.random() < w) candidates.push(pool[i]);
  }
  if (!candidates.length) {
    candidates = pool.filter(function (f) { return f.k === 'meat' || f.k === 'dairy' || f.k === 'pareve'; });
  }
  var f = pick(candidates.length ? candidates : pool);
  var belt = randInt(0, 1);
  this.items.push({
    food: f, belt: belt, x: KosherSort.BELT_X[belt] + rand(-24, 24),
    y: KosherSort.TOP - 30, r: 52, rot: rand(-0.2, 0.2), spin: rand(-0.5, 0.5), wob: rand(0, TAU),
    covered: !!(t.lids && chance(t.lids)),
    reveal: 0, warned: false
  });
};

/* Direction of a sorting swipe.

   The bins are LEFT and RIGHT of a conveyor that runs DOWNWARD, so a flick
   toward a side bin almost always drifts down on the way - the thumb arcs,
   and the player is chasing an item that is itself moving down. Deciding by
   "whichever axis is bigger" therefore turns honest left-flicks into pareve.
   Horizontal gets a wider sector: it wins unless the stroke is clearly
   vertical (steeper than about 56 degrees). */
KosherSort.HORIZONTAL_BIAS = 1.5;
KosherSort.MIN_SWIPE = 12;

/* The item under your finger when the stroke STARTED is the item that moves.
   Nothing else can steal it - a downward flick sweeps over every item below
   the one you grabbed, so scoring by the path picked the wrong dish. */
KosherSort.GRAB_RADIUS = 120;

KosherSort.prototype.itemAt = function (x, y, backSeconds) {
  var lift = (backSeconds || 0) * this.speed();
  var best = null, bd = 1e9;
  for (var i = 0; i < this.items.length; i++) {
    var it = this.items[i];
    var d = distance(x, y, it.x, it.y - lift);
    if (d < bd) { bd = d; best = it; }
  }
  return bd <= KosherSort.GRAB_RADIUS ? best : null;
};

KosherSort.prototype.dirFromSwipe = function (item, dx, dy) {
  if (Math.hypot(dx, dy) < KosherSort.MIN_SWIPE) return null;
  if (Math.abs(dx) * KosherSort.HORIZONTAL_BIAS >= Math.abs(dy)) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'down' : 'up';
};

KosherSort.prototype.correctDir = function (kind) {
  return kind === 'meat' ? 'left' : kind === 'dairy' ? 'right' : kind === 'pareve' ? 'down' : 'up';
};

KosherSort.prototype.sortItem = function (item, dir) {
  var want = this.correctDir(item.food.k);
  var idx = this.items.indexOf(item);
  if (idx >= 0) this.items.splice(idx, 1);
  var target = { left: { x: -60, y: item.y }, right: { x: CFG.W + 60, y: item.y },
                 down: { x: 360, y: CFG.H + 60 }, up: { x: 360, y: -60 } }[dir];
  this.flying.push({
    food: item.food, x: item.x, y: item.y, tx: target.x, ty: target.y,
    t: 0, dur: 0.34, ok: dir === want, r: item.r
  });
  this.binFlash[dir] = 0.4;
  if (dir === want) {
    this.correct++; this.sortedTotal++; this.sortedThisLevel++;
    this.hitCombo();
    if (this.combo >= 20) this.award('b_streak');
    if (item.food.k === 'pareve') { this.pareveOk++; if (this.pareveOk >= 30) this.award('b_pareve'); }
    if (item.food.k === 'mixed') { this.mixedOk++; if (this.mixedOk >= 10) this.award('b_bbc'); }
    if (item.food.k === 'treif') { this.treifOk++; if (this.treifOk >= 15) this.award('b_treif'); }
    var base = (item.food.k === 'mixed' || item.food.k === 'treif') ? 40 : 25;
    var pts = base + Math.min(this.combo, 20) * 2;
    this.addScore(pts, item.x, item.y - 40, '+' + pts, Foods.colorFor(item.food.k));
    /* the pitch climbs with the streak - the whole loop lives on this */
    Sound.tone({ f: 560 + Math.min(this.combo, 16) * 46, dur: 0.10, vol: 0.22, type: 'triangle' });
    Haptics.light();
    if (this.combo > 0 && this.combo % 10 === 0) {
      var streakBonus = this.combo * 12;
      this.score += streakBonus;
      FX.text(CFG.W / 2, 620, 'MEHADRIN STREAK x' + this.combo + '  +' + streakBonus, C.gold, 34);
      FX.flash(C.gold, 0.25);
      Sound.sfx('badge'); Haptics.win();
    }
    FX.burst(item.x, item.y, { n: 8, color: Foods.colorFor(item.food.k), spdMax: 200, lifeMax: 0.5 });
    Profile.noteBest('streak', this.combo);
    if (this.combo === 3) FX.text(CFG.W / 2, 560, 'NICE!', C.teal, 28);
    else if (this.combo === 5) FX.text(CFG.W / 2, 560, 'STREAK!', C.gold, 30);
    else if (this.combo === 8) FX.text(CFG.W / 2, 560, 'MEHADRIN!', C.gold, 32);
    if (this.sortedThisLevel >= (this.need || 12)) this.levelUp();
  } else {
    this.wrong++;
    this.showHint(item.food);
    this.damage('Wrong bin', item.x, item.y - 40);
  }
};

KosherSort.prototype.showHint = function (food) {
  this.hint = { text: food.name + ': ' + food.hint, t: 0, life: 3.2 };
};

KosherSort.prototype.levelUp = function () {
  var self = this;
  if (this.level >= 5) this.award('b_mash');
  if (Profile.unlockLevel('kosher', this.level + 1) && this.level + 1 <= KosherSort.SHIFTS) {
    FX.text(CFG.W / 2, 540, 'SHIFT ' + (this.level + 1) + ' UNLOCKED', C.teal, 28, 3);
  }
  if (this.level >= KosherSort.SHIFTS) {
    this.victory = true;
    this.award('b_belts');
    this.finish('You kept every belt clear!');
    return;
  }
  this.sortedThisLevel = 0;
  this.level++;
  var bonus = 120 * this.level;
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.green, 0.35);
  FX.text(CFG.W / 2, 620, 'SHIFT ' + this.level + '  +' + bonus, C.green, 36);
  this.interstitial(function () {
    self.setupShift();
    Input.clear();
    Game.setState('PLAYING');
  });
};

/* ---------------------------------------------------------------- input */
KosherSort.prototype.handle = function (ev) {
  var i, it;
  if (ev.type === 'down') {
    var grabbed = this.itemAt(ev.x, ev.y, 0);
    if (grabbed) this.grabs[ev.id] = grabbed;
    else delete this.grabs[ev.id];
    return;
  }
  if (ev.type === 'tap') {
    for (i = this.items.length - 1; i >= 0; i--) {
      it = this.items[i];
      if (it.covered && distance(ev.x, ev.y, it.x, it.y) < 76) {
        it.covered = false;
        it.reveal = 0.35;
        this.uncovered++;
        this.addScore(10, it.x, it.y - 62, 'UNCOVERED', C.cream);
        Sound.sfx('ui'); Haptics.light();
        FX.burst(it.x, it.y - 20, { n: 10, color: '#cfd8e8', spdMax: 200, grav: 260 });
        return;
      }
    }
    return;
  }
  if (ev.type !== 'swipe') return;
  var best = this.grabs[ev.id];
  delete this.grabs[ev.id];
  if (best && this.items.indexOf(best) < 0) best = null;
  if (!best) {
    /* no recorded touch (keyboard shim, or the grab expired): fall back to the
       stroke's start point, rewound by however far the belt moved meanwhile */
    best = this.itemAt(ev.x, ev.y, ev.dur || 0);
  }
  if (!best) return;
  if (best.covered) {
    FX.text(best.x, best.y - 62, 'TAP TO UNCOVER IT', C.gold, 26);
    Sound.sfx('back');
    return;
  }
  var dir = this.dirFromSwipe(best, ev.x2 - ev.x, ev.y2 - ev.y);
  if (!dir) return;
  this.sortItem(best, dir);
};

/* --------------------------------------------------------------- update */
KosherSort.prototype.update = function (dt) {
  this.elapsed += dt;
  this.beltPhase = (this.beltPhase + this.speed() * dt) % 40;
  var i;
  for (var key in this.binFlash) if (this.binFlash[key] > 0) this.binFlash[key] -= dt;
  if (this.hint) { this.hint.t += dt; if (this.hint.t > this.hint.life) this.hint = null; }
  if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

  /* the Kashrus Rush: belts surge and every call counts double */
  if (this.rushT > 0) {
    this.rushT -= dt;
    if (this.rushT <= 0) { this.rushT = 0; this.mult = 1; Sound.sfx('back'); }
  } else {
    this.rushTimer -= dt;
    if (this.rushTimer <= 0) {
      this.rushTimer = this.rushEvery() + rand(-2, 4);
      this.rushT = 8;
      this.rushes++;
      this.mult = 2;
      Sound.sfx('levelup'); Haptics.double();
      FX.flash(C.gold, 0.3);
      this.say('KASHRUS RUSH!', 'the belts surge - every call is worth double', C.gold, 2.6);
    }
  }

  for (var gid in this.grabs) {
    if (this.items.indexOf(this.grabs[gid]) < 0) delete this.grabs[gid];
  }

  this.spawnT -= dt;
  if (this.spawnT <= 0) { this.spawnT = this.interval() * rand(0.85, 1.2); this.spawn(); }

  var sp = this.speed();
  for (i = this.items.length - 1; i >= 0; i--) {
    var it = this.items[i];
    it.y += sp * dt;
    it.rot += it.spin * dt;
    it.wob += dt * 3;
    if (it.reveal > 0) it.reveal -= dt;
    if (!it.warned && it.y > KosherSort.END - 110) {
      it.warned = true;
      FX.text(it.x, it.y - 56, 'END OF BELT!', C.red, 22);
      Haptics.medium();
    }
    if (it.y > KosherSort.END) {
      this.items.splice(i, 1);
      this.missed++;
      if (it.covered) {
        this.hint = { text: 'You never looked under that lid - it was ' + it.food.name + '. ' + it.food.hint, t: 0, life: 3.4 };
        this.damage('Left covered to the end', it.x, KosherSort.END - 40);
      } else {
        this.showHint(it.food);
        this.damage('Reached the end unsorted', it.x, KosherSort.END - 40);
      }
      if (this.lives <= 0) return;
    }
  }
  for (i = this.flying.length - 1; i >= 0; i--) {
    var fl = this.flying[i];
    fl.t += dt;
    if (fl.t >= fl.dur) this.flying.splice(i, 1);
  }
};

/* --------------------------------------------------------------- render */
KosherSort.prototype.render = function (ctx) {
  var i, t = this.elapsed;
  var S = this.scene();
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, S.sky || [
    [0, '#101728'], [0.5, '#18213a'], [1, '#0d1322']
  ]);
  /* tiled kitchen wall */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 2;
  for (i = 0; i < CFG.W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CFG.H); ctx.stroke(); }
  for (i = 0; i < CFG.H; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CFG.W, i); ctx.stroke(); }
  ctx.restore();

  /* bins */
  this.drawSideBin(ctx, 8, 430, 98, 420, C.meat, 'MEAT', 'left');
  this.drawSideBin(ctx, CFG.W - 106, 430, 98, 420, C.dairy, 'DAIRY', 'right');
  this.drawChute(ctx, 300, KosherSort.END + 26 - View.safe.b, 120, 130, C.pareve, 'PAREVE', 'down');
  this.drawChute(ctx, 300, KosherSort.TOP - 114, 120, 106, C.trash, 'DISPOSAL', 'up');

  /* belts */
  for (var b = 0; b < 2; b++) {
    var bx = KosherSort.BELT_X[b] - KosherSort.BELT_W / 2;
    ctx.save();
    ctx.fillStyle = '#232a3f';
    Draw.rr(ctx, bx - 8, KosherSort.TOP - 10, KosherSort.BELT_W + 16, KosherSort.END - KosherSort.TOP + 30, 18);
    ctx.fill();
    ctx.fillStyle = '#39415a';
    Draw.rr(ctx, bx, KosherSort.TOP, KosherSort.BELT_W, KosherSort.END - KosherSort.TOP + 10, 12);
    ctx.fill();
    ctx.save();
    Draw.rr(ctx, bx, KosherSort.TOP, KosherSort.BELT_W, KosherSort.END - KosherSort.TOP + 10, 12);
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 6;
    for (var y = KosherSort.TOP - 40 + this.beltPhase; y < KosherSort.END + 20; y += 40) {
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + KosherSort.BELT_W, y); ctx.stroke();
    }
    ctx.restore();
    /* danger line */
    ctx.strokeStyle = 'rgba(255,91,91,.75)';
    ctx.lineWidth = 5;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(bx, KosherSort.END); ctx.lineTo(bx + KosherSort.BELT_W, KosherSort.END);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* the rush surge - tint and streaks over the belts */
  if (this.rushT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.05 * pulse(t, 4);
    ctx.fillStyle = C.gold;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,207,92,.7)';
    ctx.lineWidth = 3;
    for (var q = 0; q < 14; q++) {
      var sy = KosherSort.TOP - 40 + ((q * 97 + this.beltPhase * 6) % (KosherSort.END - KosherSort.TOP + 120));
      var sx = (q % 2) ? KosherSort.BELT_X[0] : KosherSort.BELT_X[1];
      ctx.beginPath();
      ctx.moveTo(sx - 70, sy); ctx.lineTo(sx - 70, sy + 46);
      ctx.moveTo(sx + 70, sy + 30); ctx.lineTo(sx + 70, sy + 76);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* items */
  for (i = 0; i < this.items.length; i++) {
    var it = this.items[i];
    this.drawItem(ctx, it.food, it.x, it.y + Math.sin(it.wob) * 2, it.r, it.rot, 1, it);
  }
  for (i = 0; i < this.flying.length; i++) {
    var fl = this.flying[i];
    var k = fl.t / fl.dur;
    var fx = lerp(fl.x, fl.tx, easeIn(k));
    var fy = lerp(fl.y, fl.ty, easeIn(k));
    ctx.save();
    ctx.globalAlpha = 1 - k * 0.6;
    this.drawItem(ctx, fl.food, fx, fy, fl.r * (1 - k * 0.4), k * 6 * (fl.ok ? 1 : -1), fl.ok ? 1 : 0.6);
    ctx.restore();
  }

  /* rush banner */
  if (this.rushT > 0) {
    var ba = clamp(Math.min(this.rushT / 0.4, (8 - this.rushT) / 0.3), 0, 1);
    ctx.save();
    ctx.globalAlpha = ba;
    /* sits beside the shift panel and clear of the disposal chute */
    var bx = 296, bw = CFG.W - bx - 24, by = View.safe.t + 144;
    var bcx = bx + bw / 2;
    ctx.translate(bcx, by + 28);
    ctx.rotate(Math.sin(t * 6) * 0.02);
    ctx.translate(-bcx, -(by + 28));
    Draw.panel(ctx, bx, by, bw, 56, {
      fill: 'rgba(60,38,6,.95)', stroke: C.gold, strokeW: 3, radius: 16,
      glow: 'rgba(255,207,92,.6)', glowBlur: 26
    });
    Draw.textSafe(ctx, 'KASHRUS RUSH  x2', bcx, by + 24, {
      size: 25, maxW: bw - 26, color: C.gold, weight: '900'
    });
    Draw.meter(ctx, bx + 16, by + 42, bw - 32, 7, this.rushT / 8, { fg: C.gold, gloss: false });
    ctx.restore();
  }

  if (this.banner) {
    var bn = this.banner;
    var ba2 = clamp(bn.t / Math.min(0.45, bn.max), 0, 1);
    ctx.save();
    ctx.globalAlpha = ba2;
    Draw.panel(ctx, 40, 250, CFG.W - 80, bn.sub ? 80 : 52, {
      fill: 'rgba(6,10,26,.92)', radius: 16, stroke: bn.color, strokeW: 3, glow: bn.color, glowBlur: 18
    });
    Draw.textSafe(ctx, bn.title, CFG.W / 2, 282, { size: 26, maxW: CFG.W - 130, color: bn.color, weight: '900' });
    if (bn.sub) Draw.textSafe(ctx, bn.sub, CFG.W / 2, 310, { size: 16, maxW: CFG.W - 130, color: 'rgba(255,255,255,.78)', weight: '800' });
    ctx.restore();
  }

  /* hint ribbon */
  if (this.hint) {
    var a = clamp(Math.min(this.hint.t / 0.25, (this.hint.life - this.hint.t) / 0.4), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    var lines = Draw.wrap(ctx, this.hint.text, 560, 22, '700');
    var hh = 30 + lines.length * 28;
    var hy = KosherSort.END - hh - 26;
    Draw.panel(ctx, 60, hy, 600, hh, { fill: 'rgba(6,9,22,.98)', stroke: C.gold, strokeW: 3, radius: 18, glow: 'rgba(255,207,92,.55)', glowBlur: 26 });
    for (var L = 0; L < lines.length; L++) {
      Draw.text(ctx, lines[L], 360, hy + 24 + L * 28, { size: 22, color: C.cream, align: 'center', weight: '700' });
    }
    ctx.restore();
  }
};

KosherSort.prototype.drawItem = function (ctx, food, x, y, r, rot, alpha, item) {
  if (item && item.covered) { this.drawCovered(ctx, x, y, r); return; }
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.72, r * 0.75, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, TAU); ctx.fill();
  ctx.strokeStyle = Foods.colorFor(food.k);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, TAU); ctx.stroke();
  ctx.restore();
  Foods.draw(ctx, food.shape, x, y - 2, r * 2.15);
  Draw.textSafe(ctx, food.name, x, y + r + 16, {
    size: 18, maxW: 230, color: C.cream, weight: '800', stroke: 'rgba(0,0,0,.75)', strokeW: 5
  });
  /* the lid flying off, right after you uncover it */
  if (item && item.reveal > 0) {
    var k = 1 - item.reveal / 0.35;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    this.drawDome(ctx, x, y - k * 70, r, 1 + k * 0.25);
    ctx.restore();
  }
};

KosherSort.prototype.drawDome = function (ctx, x, y, r, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale || 1, scale || 1);
  var g = ctx.createLinearGradient(0, -r, 0, r * 0.4);
  g.addColorStop(0, '#e8eef7');
  g.addColorStop(0.5, '#aab6c8');
  g.addColorStop(1, '#7c8899');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, r * 0.28, r * 0.98, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.stroke();
  ctx.fillStyle = '#cfd8e8';
  Draw.rr(ctx, -r * 0.16, -r * 0.92, r * 0.32, r * 0.2, r * 0.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.34, -r * 0.24, r * 0.16, r * 0.34, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
};

KosherSort.prototype.drawCovered = function (ctx, x, y, r) {
  var t = this.elapsed;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.72, r * 0.8, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.restore();
  /* the tray it sits on */
  ctx.save();
  ctx.fillStyle = '#59637a';
  Draw.rr(ctx, x - r, y + r * 0.24, r * 2, r * 0.24, r * 0.12); ctx.fill();
  ctx.restore();
  this.drawDome(ctx, x, y, r, 1);
  Draw.text(ctx, '?', x, y - r * 0.12, {
    size: r * 0.8, color: 'rgba(40,50,66,.75)', align: 'center', weight: '900'
  });
  Draw.text(ctx, 'TAP TO UNCOVER', x, y + r + 16, {
    size: 17, color: 'rgba(255,207,92,' + (0.5 + 0.5 * pulse(t, 2.2)) + ')',
    align: 'center', weight: '900', stroke: 'rgba(0,0,0,.75)', strokeW: 5
  });
};

KosherSort.prototype.drawSideBin = function (ctx, x, y, w, h, color, label, dir) {
  ctx.save();
  var fl = clamp(this.binFlash[dir] / 0.4, 0, 1);
  Draw.rr(ctx, x, y, w, h, 18);
  ctx.fillStyle = 'rgba(10,14,28,.9)';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = color;
  ctx.stroke();
  if (fl > 0) {
    ctx.save();
    ctx.globalAlpha = fl;
