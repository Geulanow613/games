    ctx.globalAlpha = c.pourT / 0.45;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(c.x, c.y + 14, 42 * (1.4 - c.pourT), 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (this.sham.target === c && this.sham.progress > 0) {
    var p = clamp(this.sham.progress / MenorahKeeper.RELIGHT_HOLD, 0, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(c.x, c.y - 20, 44, 0, TAU); ctx.stroke();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(c.x, c.y - 20, 44, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke();
    ctx.restore();
    Draw.text(ctx, (MenorahKeeper.RELIGHT_HOLD - this.sham.progress).toFixed(1) + 's', c.x, c.y - 92, {
      size: 20, color: C.gold, align: 'center', weight: '900'
    });
  }
};

/* ------------------------------------------------------ latkes on fire */
MenorahKeeper.drawLatke = function (ctx, x, y, r, rot, big) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(r / 34, r / 34);
  ctx.fillStyle = '#c98432';
  ctx.beginPath();
  ctx.ellipse(0, 0, 34, 24, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#8f5a1c';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = '#e8a94c';
  for (var i = 0; i < 7; i++) {
    var a = i * 0.9;
    ctx.save();
    ctx.translate(Math.cos(a) * 16, Math.sin(a) * 10);
    ctx.rotate(a);
    ctx.fillRect(-9, -2.5, 18, 5);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,225,150,.55)';
  ctx.beginPath(); ctx.ellipse(-10, -8, 11, 6, -0.4, 0, TAU); ctx.fill();
  if (big) {
    ctx.strokeStyle = '#6f4413';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 17, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
};

MenorahKeeper.prototype.drawLatkes = function (ctx, t) {
  var i;
  for (i = 0; i < this.flyingLatkes.length; i++) {
    var f = this.flyingLatkes[i];
    var k = f.t / f.dur;
    var fx = lerp(f.x, f.tx, k);
    var fy = lerp(f.y, f.ty, k) - Math.sin(k * Math.PI) * 90;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#e8a03c';
    ctx.beginPath(); ctx.ellipse(f.tx, f.ty, 34, 12, 0, 0, TAU); ctx.fill();
    ctx.restore();
    MenorahKeeper.drawLatke(ctx, fx, fy, f.big ? 44 : 32, f.rot, f.big);
    Draw.textSafe(ctx, f.big ? 'BIG FLYING LATKE!' : 'FLYING LATKE!', fx, fy - (f.big ? 62 : 50), {
      size: 18, color: '#ffb04a', weight: '900', stroke: 'rgba(0,0,0,.8)', strokeW: 5
    });
    /* oil dripping off it in flight */
    ctx.save();
    ctx.fillStyle = 'rgba(240,200,110,.7)';
    for (var q = 0; q < 3; q++) {
      ctx.beginPath();
      ctx.ellipse(fx + (q - 1) * 12, fy + 22 + ((t * 220 + q * 30) % 40), 3.5, 7, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  for (i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (!c.active || !c.latke) continue;
    var L = c.latke;
    var jitter = Math.sin(L.wob) * 3;
    /* grease flames licking up */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var g = 0; g < 5; g++) {
      var fx2 = c.x + Math.sin(t * 6 + g * 1.4) * 20;
      var h = 34 + Math.sin(t * 9 + g) * 18 + L.heat * 34;
      var grd = ctx.createRadialGradient(fx2, c.y - h * 0.4, 2, fx2, c.y - h * 0.4, h);
      grd.addColorStop(0, 'rgba(255,230,150,.75)');
      grd.addColorStop(0.4, 'rgba(255,130,40,.45)');
      grd.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(fx2, c.y - h * 0.4, h, 0, TAU); ctx.fill();
    }
    ctx.restore();
    MenorahKeeper.drawLatke(ctx, c.x + jitter, c.y + 16, L.big ? 40 : 30, Math.sin(L.wob * 0.5) * 0.2, L.big);
    /* heat ring around the cup, sized to the column so it never bleeds into a neighbour */
    var hp = clamp(L.heat, 0, 1);
    var rr = Math.min(46, this.colWidth() / 2 - 2);
    ctx.save();
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.arc(c.x, c.y + 16, rr, 0, TAU); ctx.stroke();
    ctx.strokeStyle = hp > 0.7 ? C.red : '#ff8a3d';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(c.x, c.y + 16, rr, -Math.PI / 2, -Math.PI / 2 + hp * TAU); ctx.stroke();
    ctx.restore();
    if (L.stuck < L.max) {
      Draw.meter(ctx, c.x - 30, c.y + 76, 60, 8, 1 - L.stuck / L.max, { fg: C.teal, gloss: false });
    }
    Draw.textSafe(ctx, hp > 0.7 ? 'GLASS IS CRACKING!' : 'SWIPE IT OFF!', c.x, c.y - 116, {
      size: 17, maxW: 300, color: hp > 0.7 ? C.red : '#ffcf5c', weight: '900',
      stroke: 'rgba(0,0,0,.75)', strokeW: 5
    });
    if (L.big) {
      Draw.textSafe(ctx, 'big one - keep swiping', c.x, c.y - 96, {
        size: 14, maxW: 300, color: 'rgba(255,255,255,.7)', weight: '800',
        stroke: 'rgba(0,0,0,.7)', strokeW: 4
      });
    }
  }
};

MenorahKeeper.prototype.drawJugs = function (ctx, t) {
  var jy = this.jugY();
  for (var i = 0; i < this.jugs.length; i++) {
    var j = this.jugs[i];
    var c = this.candles[j.ci];
    var dead = c.broken;
    var sc = (j.w / 86) * (1 + Math.max(0, j.pop) * 0.12);
    ctx.save();
    ctx.globalAlpha = dead ? 0.4 : 1;
    ctx.translate(j.x, jy);
    ctx.scale(sc, sc);
    ctx.beginPath();
    ctx.moveTo(-30, -44); ctx.lineTo(30, -44); ctx.lineTo(44, 6);
    ctx.quadraticCurveTo(44, 56, 0, 56);
    ctx.quadraticCurveTo(-44, 56, -44, 6);
    ctx.closePath();
    ctx.fillStyle = (j.spill > 0 || dead) ? '#4a3a2c' : '#7d5a33';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = (j.spill > 0 || dead) ? '#6b5340' : '#b98a4a';
    ctx.stroke();
    ctx.save();
    ctx.clip();
    var fh = 100 * j.fill;
    ctx.fillStyle = j.spill > 0 ? 'rgba(120,100,70,.5)' : '#f0c353';
    ctx.fillRect(-46, 56 - fh, 92, fh);
    ctx.restore();
    ctx.fillStyle = '#5f4426';
    Draw.rr(ctx, -36, -54, 72, 14, 6); ctx.fill();
    ctx.restore();

    var label = jy + j.w * 0.86;
    if (this.boss) { /* no pouring during the fight - keep the shelf quiet */ }
    else if (dead) {
      Draw.text(ctx, 'CRACKED', j.x, label, { size: 14, color: 'rgba(200,214,236,.55)', align: 'center', weight: '900' });
    } else if (j.spill > 0) {
      Draw.text(ctx, 'SPILLED', j.x, label, { size: 16, color: C.red, align: 'center', weight: '900' });
    } else if (j.fill < 0.99) {
      Draw.meter(ctx, j.x - j.w * 0.42, label - 6, j.w * 0.84, 10, j.fill, { fg: C.gold, gloss: false });
    } else if (c.lit && c.gutter > 0) {
      Draw.text(ctx, 'POUR!', j.x, label, {
        size: 19, color: 'rgba(255,171,38,' + (0.5 + 0.5 * pulse(t, 3)) + ')', align: 'center', weight: '900'
      });
    } else if (c.lit && c.oil < 0.45) {
      Draw.text(ctx, 'TAP', j.x, label, {
        size: 18, color: 'rgba(255,207,92,' + (0.45 + 0.55 * pulse(t, 1.6)) + ')', align: 'center', weight: '900'
      });
    } else {
      Draw.text(ctx, 'READY', j.x, label, { size: 14, color: 'rgba(255,255,255,.35)', align: 'center', weight: '800' });
    }
  }
};

MenorahKeeper.prototype.drawJelly = function (ctx, t) {
  for (var i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (!c.active) continue;
    if (c.dripT > 0) {
      var k = 1 - c.dripT / 0.8;
      var top = c.jelly.length ? c.jelly[0].y : c.y - 96;
      var tipY = lerp(top, c.y - 24, k);
      ctx.save();
      ctx.fillStyle = '#c8203f';
      ctx.beginPath();
      ctx.moveTo(c.x - 14, top);
      ctx.quadraticCurveTo(c.x, tipY, c.x + 14, top);
      ctx.lineTo(c.x + 5, tipY);
      ctx.lineTo(c.x - 5, tipY);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath(); ctx.arc(c.x, tipY, 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
    for (var q = 0; q < c.jelly.length; q++) {
      var g = c.jelly[q];
      ctx.save();
      ctx.globalAlpha = clamp(g.wipe, 0, 1) * 0.95;
      ctx.translate(g.x, g.y);
      var grd = ctx.createRadialGradient(0, 0, 4, 0, 0, g.r);
      grd.addColorStop(0, '#e0405f');
      grd.addColorStop(0.7, '#b5203f');
      grd.addColorStop(1, 'rgba(150,20,50,.75)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, 0, g.r * (0.6 + 0.4 * g.wipe), 0, TAU); ctx.fill();
      for (var b = 0; b < g.blobs.length; b++) {
        var bl = g.blobs[b];
        ctx.beginPath();
        ctx.arc(Math.cos(bl.a) * g.r * bl.d, Math.sin(bl.a) * g.r * bl.d, g.r * bl.s * g.wipe, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha *= 0.6;
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(-g.r * 0.3, -g.r * 0.32, g.r * 0.17, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (c.jelly.length === 1 && c.jelly[0].born < 1.6) {
      Draw.textSafe(ctx, 'SWIPE TO WIPE', c.x, c.jelly[0].y + c.jelly[0].r + 22, {
        size: 17, color: 'rgba(255,255,255,' + (1 - c.jelly[0].born / 1.6) + ')', weight: '900',
        stroke: 'rgba(0,0,0,.6)', strokeW: 4
      });
    }
    if (c.jelly.length === 2) {
      Draw.textSafe(ctx, 'THE JELLY IS ABOUT TO DRIP!', c.x, this.globSlotY(c, 2) + 6, {
        size: 16, maxW: 320, color: 'rgba(255,91,91,' + (0.5 + 0.5 * pulse(t, 2.2)) + ')', weight: '900',
        stroke: 'rgba(0,0,0,.7)', strokeW: 4
      });
    }
  }
};

MenorahKeeper.prototype.drawBoys = function (ctx, t) {
  var i;
  for (i = 0; i < this.boys.length; i++) {
    var b = this.boys[i];
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1.35, 1.35);
    MenorahKeeper.drawBoy(ctx, MenorahKeeper.BOYS[b.ch], 0, 0, b.phase, b.dir, Math.max(0, b.squeeze));
    ctx.restore();
  }
  for (i = 0; i < this.shots.length; i++) {
    var s = this.shots[i];
    var k = s.t / s.dur;
    var sx = lerp(s.x, s.tx, k);
    var sy = lerp(s.y, s.ty, k) - Math.sin(k * Math.PI) * 70;
    ctx.save();
    ctx.fillStyle = '#d4304f';
    ctx.beginPath(); ctx.ellipse(sx, sy, 16, 12, k * 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
};

MenorahKeeper.drawBoy = function (ctx, ch, x, y, phase, dir, squeeze) {
  var swing = Math.sin(phase) * 14;
  var bob = Math.abs(Math.cos(phase)) * 4;
  ctx.save();
  ctx.translate(x, y - bob);
  ctx.scale(dir, 1);
  ctx.strokeStyle = '#2b2f45';
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 24); ctx.lineTo(swing * 0.9, 54);
  ctx.moveTo(0, 24); ctx.lineTo(-swing * 0.9, 54);
  ctx.stroke();
  ctx.fillStyle = '#15182a';
  ctx.beginPath(); ctx.ellipse(swing * 0.9 + 4, 58, 12, 6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-swing * 0.9 + 4, 58, 12, 6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#f2f0e4';
  ctx.lineWidth = 2.5;
  for (var f = -1; f <= 1; f++) {
    ctx.beginPath();
    ctx.moveTo(f * 7, 22); ctx.lineTo(f * 9 - swing * 0.15, 38);
    ctx.stroke();
  }
  ctx.fillStyle = ch.shirt;
  Draw.rr(ctx, -18, -15, 36, 42, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 2.5;
  Draw.rr(ctx, -18, -15, 36, 42, 10); ctx.stroke();
  ctx.fillStyle = ch.vest;
  Draw.rr(ctx, -20, -17, 13, 44, 6); ctx.fill();
  Draw.rr(ctx, 7, -17, 13, 44, 6); ctx.fill();
  /* collar */
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-8, -14); ctx.lineTo(0, -6); ctx.lineTo(8, -14);
  ctx.stroke();
  /* back arm - long sleeve, hand only at the wrist */
  ctx.strokeStyle = ch.shirt;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-11, -7); ctx.lineTo(-24 - swing * 0.5, 11);
  ctx.stroke();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(-26 - swing * 0.5, 14, 5.5, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(2, -34, 20, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.hair;
  ctx.beginPath();
  ctx.arc(2, -42, 20, Math.PI * 1.16, Math.PI * 1.9);
  ctx.fill();
  ctx.strokeStyle = ch.hair;
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(-15, -40); ctx.quadraticCurveTo(-21, -31, -16, -23);
  ctx.moveTo(18, -40); ctx.quadraticCurveTo(24, -31, 19, -23);
  ctx.stroke();
  ctx.fillStyle = ch.kippah;
  ctx.beginPath();
  ctx.ellipse(2, -50, 17, 9, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(2, -50, 17, 9, 0, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-5, -37, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -37, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-4, -37, 3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, -37, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a1520';
  ctx.beginPath();
  ctx.moveTo(-9, -26);
  ctx.quadraticCurveTo(3, -12, 15, -26);
  ctx.quadraticCurveTo(3, -22, -9, -26);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-7, -26); ctx.lineTo(13, -26); ctx.lineTo(12, -23); ctx.lineTo(-6, -23);
  ctx.closePath(); ctx.fill();
  /* front arm - long sleeve too, with the hand holding the sufganiyah */
  ctx.strokeStyle = ch.shirt;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(11, -7); ctx.lineTo(28, 1 - squeeze * 6);
  ctx.stroke();
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(31, 2 - squeeze * 6, 6, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(40, 4 - squeeze * 6);
  ctx.scale(1 + squeeze * 0.25, 1 - squeeze * 0.3);
  ctx.fillStyle = '#d99b4d';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#a86f2c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#f4e3c0';
  ctx.beginPath(); ctx.ellipse(0, -3, 12, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c8203f';
  ctx.beginPath(); ctx.arc(6, 2, 5, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
};

/* ------------------------------------------------- gusts + swipe prompt */
MenorahKeeper.prototype.drawGusts = function (ctx, t) {
  for (var i = 0; i < this.gusts.length; i++) {
    var g = this.gusts[i];
    var laneY = 690 + g.lane * 76;
    ctx.save();
    if (g.warn > 0) {
      var wa = pulse(t, 5);
      var wx = g.dir > 0 ? 84 : CFG.W - 84;
      ctx.globalAlpha = 0.6 + wa * 0.4;
      ctx.save();
      ctx.translate(wx, laneY);
      ctx.scale(g.dir * (1 + wa * 0.08), 1 + wa * 0.08);
      Icons.draw(ctx, 'wind', 0, 0, 84, '#9fd0ff');
      ctx.fillStyle = '#9fd0ff';
      ctx.beginPath();
      ctx.moveTo(52 + wa * 10, 0); ctx.lineTo(24, -18); ctx.lineTo(24, 18);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
      Draw.text(ctx, 'WIND!', wx, laneY + 72, {
        size: 26, color: '#9fd0ff', align: 'center', weight: '900', stroke: 'rgba(0,0,0,.8)', strokeW: 6
      });
    } else if (!g.reversed) {
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = 'rgba(190,225,255,.9)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (var k = 0; k < 7; k++) {
        var yy = laneY - 90 + k * 30 + g.y;
        var len = 90 + (k % 3) * 70;
        ctx.beginPath();
        ctx.moveTo(g.x - g.dir * len, yy);
        ctx.lineTo(g.x, yy);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = 'rgba(150,200,255,.16)';
      ctx.beginPath();
      ctx.ellipse(g.x - g.dir * 60, laneY + g.y, 90, 120, 0, 0, TAU);
      ctx.fill();
    } else {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = 'rgba(120,235,215,.85)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (var m = 0; m < 6; m++) {
        var y2 = laneY - 76 + m * 30 + g.y;
        ctx.beginPath();
        ctx.moveTo(g.x - g.dir * (70 + (m % 3) * 60), y2);
        ctx.lineTo(g.x, y2);
        ctx.stroke();
      }
      /* the big floating callout already says it - no need to say it twice */
    }
    ctx.restore();
  }
  /* one lane at a time: the unreversed gust nearest the menorah */
  var primary = null, bd = 1e9;
  for (var q = 0; q < this.gusts.length; q++) {
    var gg = this.gusts[q];
    if (gg.reversed) continue;
    var d = gg.warn > 0 ? 1e6 + Math.abs(gg.x - MenorahKeeper.CX) : Math.abs(gg.x - MenorahKeeper.CX);
    if (d < bd) { bd = d; primary = gg; }
  }
  if (primary) this.drawSwipeLane(ctx, primary, 690 + primary.lane * 76, t);
};

/* the explicit "swipe exactly like this" band */
MenorahKeeper.prototype.drawSwipeLane = function (ctx, g, laneY, t) {
  var leftward = g.need === 'left';
  var x0 = 70, x1 = CFG.W - 70;
  var cycle = (t * 0.75) % 1;
  var handX = leftward ? lerp(x1, x0, cycle) : lerp(x0, x1, cycle);
  var urgent = g.warn <= 0;
  ctx.save();
  ctx.globalAlpha = urgent ? 0.95 : 0.6;
  /* no lane outline - the chevrons, the gliding hand and the wind waves say it */
  /* chevrons pointing the way to swipe */
  ctx.strokeStyle = '#9fd0ff';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < 7; i++) {
    var p = (i / 7 + cycle) % 1;
    var cx = lerp(x0 + 30, x1 - 30, leftward ? 1 - p : p);
    var a = 1 - Math.abs(p - 0.5) * 1.4;
    ctx.globalAlpha = clamp(a, 0, 1) * (urgent ? 0.95 : 0.5);
    var s = leftward ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(cx - s * 14, laneY - 20);
    ctx.lineTo(cx + s * 14, laneY);
    ctx.lineTo(cx - s * 14, laneY + 20);
    ctx.stroke();
  }
  /* ghost hand gliding along */
  ctx.globalAlpha = urgent ? 0.75 : 0.4;
  ctx.fillStyle = 'rgba(255,224,168,.85)';
  ctx.strokeStyle = 'rgba(255,240,210,.9)';
  ctx.lineWidth = 3;
  Draw.rr(ctx, handX - 30, laneY - 6, 60, 44, 18);
  ctx.fill(); ctx.stroke();
  for (var f = 0; f < 4; f++) {
    Draw.rr(ctx, handX - 26 + f * 14, laneY - 34, 11, 32, 6);
    ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  var lbl = g.maxStrength > 1 ? ('SWIPE x' + g.strength) : 'SWIPE';
  var ly = laneY - 74;
  var lw = Draw.measure(ctx, lbl, 27, '900');
  var col = urgent ? '#cfe8ff' : 'rgba(207,232,255,.75)';
  Draw.text(ctx, lbl, CFG.W / 2 + (leftward ? 22 : -22), ly, {
    size: 27, color: col, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.85)', strokeW: 6
  });
  /* a drawn arrow, so it renders the same on every device */
  var ax = CFG.W / 2 + (leftward ? -lw / 2 - 16 : lw / 2 + 16);
  var sgn = leftward ? -1 : 1;
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var pass = 0; pass < 2; pass++) {
    if (pass === 1) { ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.fillStyle = col; }
    ctx.beginPath();
    ctx.moveTo(ax - sgn * 20, ly);
    ctx.lineTo(ax + sgn * 8, ly);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax + sgn * 22, ly);
    ctx.lineTo(ax + sgn * 4, ly - 12);
    ctx.lineTo(ax + sgn * 4, ly + 12);
    ctx.closePath();
    if (pass === 0) ctx.stroke(); else ctx.fill();
  }
  ctx.restore();
  ctx.restore();
};

MenorahKeeper.prototype.drawHand = function (ctx) {
  var h = this.handSweep;
  if (!h) return;
  var k = 1 - h.t / 0.5;
  var x0 = h.dir === 'left' ? CFG.W - 90 : 90;
  var x1 = h.dir === 'left' ? 90 : CFG.W - 90;
  var hx = lerp(x0, x1, easeOut(k));
  ctx.save();
  ctx.globalAlpha = clamp(h.t * 2.2, 0, 1);
  ctx.fillStyle = h.wrong ? 'rgba(255,120,120,.6)' : 'rgba(255,214,160,.72)';
  ctx.strokeStyle = h.wrong ? '#ffb0b0' : '#ffe0a8';
  ctx.lineWidth = 5;
  Draw.rr(ctx, hx - 78, h.y - 12, 156, 86, 40);
  ctx.fill(); ctx.stroke();
  for (var i = 0; i < 4; i++) {
    Draw.rr(ctx, hx - 68 + i * 34, h.y - 62, 26, 58, 13);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
};

MenorahKeeper.prototype.drawCats = function (ctx, t) {
  for (var i = 0; i < this.cats.length; i++) {
    var c = this.cats[i];
    var step = Math.sin(c.phase) * 3;
    ctx.save();
    ctx.translate(c.x, c.y + step);
    ctx.scale(c.dir * 1.22, 1.22);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(0, 34, 44, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2436';
    /* body */
    Draw.rr(ctx, -42, -8, 78, 34, 17); ctx.fill();
    /* legs */
    ctx.fillRect(-32, 20, 11, 14);
    ctx.fillRect(14, 20, 11, 14);
    ctx.fillRect(-14 + Math.sin(c.phase) * 5, 20, 10, 14);
    /* tail */
    ctx.strokeStyle = '#2a2436';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-40, 2);
    ctx.quadraticCurveTo(-72, -6 + Math.sin(c.phase * 0.7) * 12, -62, -34);
    ctx.stroke();
    /* head */
    ctx.fillStyle = '#332c42';
    ctx.beginPath(); ctx.arc(40, -6, 20, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(28, -20); ctx.lineTo(26, -40); ctx.lineTo(44, -26); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(50, -22); ctx.lineTo(58, -40); ctx.lineTo(60, -18); ctx.closePath(); ctx.fill();
    /* eyes */
    ctx.fillStyle = c.state === 'flee' ? '#9fd0ff' : '#ffd94a';
    ctx.beginPath(); ctx.ellipse(38, -8, 4.5, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(50, -8, 4.5, 6, 0, 0, TAU); ctx.fill();
    /* whiskers */
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(56, 0); ctx.lineTo(72, -4);
    ctx.moveTo(56, 4); ctx.lineTo(72, 8);
    ctx.stroke();
    ctx.restore();
    if (c.state === 'creep') {
      Draw.textSafe(ctx, 'SWIPE IT AWAY', c.x, c.y - 76, {
        size: 17, color: 'rgba(200,180,255,' + (0.5 + 0.5 * pulse(t, 2.2)) + ')',
        weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 5
      });
    }
  }
};

MenorahKeeper.prototype.drawMoths = function (ctx, t) {
  for (var i = 0; i < this.moths.length; i++) {
    var m = this.moths[i];
    var flap = 0.35 + 0.65 * Math.abs(Math.sin(m.phase));
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = 'rgba(216,224,238,.9)';
    ctx.beginPath(); ctx.ellipse(-11, -2, 13, 9 * flap, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, -2, 13, 9 * flap, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(150,160,180,.9)';
    ctx.beginPath(); ctx.ellipse(-8, 7, 9, 6 * flap, -0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, 7, 9, 6 * flap, 0.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a4a56';
    Draw.rr(ctx, -3.5, -8, 7, 22, 3.5); ctx.fill();
    ctx.strokeStyle = '#4a4a56';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -8); ctx.lineTo(-8, -18);
    ctx.moveTo(2, -8); ctx.lineTo(8, -18);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * pulse(t, 3);
    ctx.strokeStyle = '#cfd8e8';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(m.x, m.y, 34, 0, TAU); ctx.stroke();
    ctx.restore();
  }
};

MenorahKeeper.prototype.drawDreidels = function (ctx) {
  for (var i = 0; i < this.dreidels.length; i++) {
    var d = this.dreidels[i];
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.rot) * 0.35);
    ctx.fillStyle = '#6f5bd0';
    ctx.strokeStyle = '#c9bcff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-28, -22); ctx.lineTo(28, -22); ctx.lineTo(28, 6);
    ctx.lineTo(0, 38); ctx.lineTo(-28, 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -42); ctx.stroke();
    Draw.text(ctx, d.letter, 0, -6, { size: 26, color: '#efeaff', align: 'center', weight: '900' });
    ctx.restore();
  }
};

MenorahKeeper.prototype.drawCarriedShamash = function (ctx, t) {
  var sh = this.sham;
  if (!sh.out) return;
  var c = this.shamash();
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(Math.sin(sh.wobble * 4) * 0.06);
  ctx.shadowColor = 'rgba(255,180,60,.6)';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#c99a31';
  Draw.rr(ctx, -9, 44, 18, 26, 5); ctx.fill();
  ctx.shadowBlur = 0;
  this.drawCup(ctx, 0, 0, 54, c.oil);
  ctx.strokeStyle = c.lit ? '#3a2a16' : '#59564f';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, -22); ctx.stroke();
  ctx.restore();
  Draw.flame(ctx, sh.x, sh.y - 24, 15, t, c.lit);
  Draw.meter(ctx, sh.x - 29, sh.y + 56, 58, 9, c.oil, {
    fg: c.oil > 0.35 ? C.gold : (c.oil > 0.15 ? '#ff9d3d' : C.red),
    bg: 'rgba(0,0,0,.6)', border: 'rgba(255,255,255,.2)', borderW: 1.5, gloss: false
  });
  Draw.text(ctx, 'SHAMASH', sh.x, sh.y + 84, {
    size: 15, color: C.gold, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.6)', strokeW: 4
  });
  if (!sh.held) {
    Draw.text(ctx, 'drag me', sh.x, sh.y + 106, {
      size: 15, color: 'rgba(255,255,255,' + (0.4 + 0.5 * pulse(t, 2)) + ')', align: 'center', weight: '800'
    });
  }
};

MenorahKeeper.prototype.drawPrompts = function (ctx, t) {
  var i, c, darkC = null;
  for (i = 0; i < this.candles.length; i++) {
    c = this.candles[i];
    if (c.active && !c.sham && !c.lit && !c.broken) { darkC = c; break; }
  }
  var shc = this.shamash();
  if (darkC && !this.sham.out && !shc.lit && !shc.broken) {
    var ga = 0.5 + 0.5 * pulse(t, 1.8);
    Draw.textSafe(ctx, 'light the shamash first', shc.x, shc.y - 88, {
      size: 17, maxW: 300, color: 'rgba(255,207,92,' + ga + ')', weight: '900',
      stroke: 'rgba(0,0,0,.7)', strokeW: 5
    });
  }
  if (darkC && !this.sham.out && shc.lit) {
    var a = 0.5 + 0.5 * pulse(t, 1.8);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 4;
    ctx.setLineDash([7, 7]);
    ctx.beginPath();
    ctx.moveTo(shc.x + 26, shc.y + 20);
    ctx.quadraticCurveTo((shc.x + darkC.x) / 2, shc.y - 90, darkC.x, darkC.y - 58);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.ellipse(shc.x, shc.y + 18, 40, 46, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
    Draw.text(ctx, 'TAP TO CARRY', shc.x, shc.y + 78, {
      size: 19, color: 'rgba(255,207,92,' + a + ')', align: 'center', weight: '900',
      stroke: 'rgba(0,0,0,.75)', strokeW: 5
    });
  }

  /* the cup you are trying to light has nothing in it */
  var dry = this.sham.dry;
  if (this.sham.out && dry) {
    var dp = 0.55 + 0.45 * pulse(t, 3.4);
    Draw.textSafe(ctx, 'FILL THIS CUP FIRST', dry.x, dry.y - 92, {
      size: 20, maxW: 260, color: 'rgba(255,90,90,' + dp + ')', weight: '900',
      stroke: 'rgba(0,0,0,.75)', strokeW: 5
    });
    var jy = this.jugY();
    ctx.save();
    ctx.globalAlpha = dp;
    ctx.strokeStyle = C.red; ctx.lineWidth = 4;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(dry.x, dry.y + 40); ctx.lineTo(dry.x, jy - 40); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(dry.x - 12, jy - 54); ctx.lineTo(dry.x, jy - 38); ctx.lineTo(dry.x + 12, jy - 54);
    ctx.stroke();
    ctx.restore();
  }

  if (this.prompt) {
    var k = clamp(this.prompt.t / 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    var maxW = CFG.W - 120;
    var lines = Draw.wrap(ctx, this.prompt.text, maxW, 22, '800');
    if (lines.length > 2) lines = lines.slice(0, 2);
    var longest = 0;
    for (var L = 0; L < lines.length; L++) longest = Math.max(longest, Draw.measure(ctx, lines[L], 22, '800'));
    var w = Math.min(CFG.W - 60, longest + 56);
    var h = 22 + lines.length * 30;
    /* sits in the gap under the HUD, never on top of it */
    var py = View.safe.t + 244;
    Draw.panel(ctx, (CFG.W - w) / 2, py, w, h, {
      fill: 'rgba(8,12,28,.94)', stroke: C.teal, radius: 16, glow: 'rgba(53,214,196,.35)'
    });
    for (var L2 = 0; L2 < lines.length; L2++) {
      Draw.text(ctx, lines[L2], CFG.W / 2, py + 11 + 15 + L2 * 30, {
        size: 22, color: C.cream, align: 'center', weight: '800'
      });
    }
    ctx.restore();
  }
};

MenorahKeeper.prototype.renderHud = function (ctx, y) {
  if (this.boss) { this.renderBossHud(ctx, y); return; }
  var w = 360, x = (CFG.W - w) / 2;
  var remain = Math.max(0, (1 - this.nightTime / this.nightDuration) * 1800);
  var low = remain < 300;
  var lights = this.candles.filter(function (c) { return c.active && !c.sham; });
  var burning = lights.filter(function (c) { return c.lit && !c.broken; }).length;
  Draw.panel(ctx, x, y - 6, w, 74, { fill: 'rgba(6,10,26,.82)', radius: 16, stroke: 'rgba(255,255,255,.14)' });
  Draw.text(ctx, 'NIGHT ' + this.night, x + 16, y + 18, { size: 22, color: C.gold, weight: '900' });
  Draw.text(ctx, burning + '/' + lights.length + ' burning', x + w - 16, y + 18, {
    size: 18, color: burning === lights.length ? C.gold : (burning >= 2 ? C.teal : C.red),
    align: 'right', weight: '800'
  });
  Draw.text(ctx, mmss(remain), x + w / 2, y + 46, {
    size: 30, color: low ? C.teal : C.cream, align: 'center', weight: '900'
  });
  Draw.text(ctx, 'LEFT TO BURN', x + w / 2, y + 66, {
    size: 13, color: 'rgba(255,255,255,.45)', align: 'center', weight: '800'
  });
  Draw.meter(ctx, x + 16, y + 78, w - 32, 8, this.nightTime / this.nightDuration, { fg: C.teal, gloss: false });
};

/* ==========================================================================
   NIGHT 8 BOSS - "THE JELLY-POCALYPSE"
   The eighth night runs its full half hour like any other. The timer reaches
   zero, the lights are burning, the fanfare plays - and then one of the boys
   walks in with a present. It is not a present.
   ========================================================================== */
MenorahKeeper.BOSS = {
  VICTORY: 3.6, GIFT: 3.4, REVEAL: 2.9, BURN: 3.8, RELIGHT: 4.2,
  HP: 100, Y: 545
};

MenorahKeeper.prototype.startBoss = function (opts) {
  opts = opts || {};
  Profile.markJellyZilla();
  var i;
  for (i = 0; i < this.candles.length; i++) {
    var c = this.candles[i];
    if (c.active && !c.broken) { c.lit = true; c.oil = 1; c.gutter = 0; c.jelly.length = 0; c.latke = null; }
  }
  this.boys.length = 0; this.shots.length = 0; this.dreidels.length = 0;
  this.flyingLatkes.length = 0; this.gusts.length = 0;
  this.cats.length = 0; this.moths.length = 0;
  this.sham.out = false; this.prompt = null;
  this.boss = {
    phase: 'victory', t: 0,
    hp: MenorahKeeper.BOSS.HP, maxHp: MenorahKeeper.BOSS.HP,
    x: CFG.W / 2, y: MenorahKeeper.BOSS.Y, bob: 0, hurt: 0, rise: 0, rage: 0,
    shots: [], halves: [], blobs: [], sugar: 0,
    chomp: null, next: 2.4, combo: 0, best: 0, frenzy: 0,
    sliced: 0, scrubbed: 0, repelled: 0, splats: 0,
    boy: { ch: randInt(0, MenorahKeeper.BOYS.length - 1), x: -140, phase: 0, lift: 0 },
    flaskT: 0, flaskTaken: false, burnT: 0, relit: 0, relitT: 0,
    banner: null
  };
  if (opts.fromSkip) {
    this.bossPhase('gift');
    return;
  }
  Sound.playMusic('menu');
  Sound.seq([523, 659, 784, 1047, 1319], 130, 0.24, 0.26, 'triangle');
  Haptics.win();
  FX.flash(C.gold, 0.5);
  for (i = 0; i < 60; i++) {
    FX.burst(rand(60, 660), rand(380, 900), { n: 1, color: pick([C.gold, C.flame, C.cream, C.teal]), spdMax: 320, lifeMax: 1.6 });
  }
  this.bossBanner('NIGHT 8 COMPLETE!', 'every light still burning', C.gold, 3.2);
};

MenorahKeeper.prototype.bossBanner = function (big, small, color, life) {
  this.boss.banner = { big: big, small: small, color: color, t: 0, life: life || 2.6 };
};

MenorahKeeper.prototype.bossPhase = function (name) {
  var b = this.boss;
  b.phase = name;
  b.t = 0;
  if (name === 'gift') {
    this.bossBanner('a present?', 'one of the boys has something for you', C.cream, 3.0);
    Sound.sfx('ui');
  } else if (name === 'reveal') {
    Sound.stopMusic();
    Sound.sfx('hurt');
    Sound.seq([196, 165, 147, 123], 140, 0.4, 0.3, 'sawtooth');
    Haptics.fail();
    FX.shake(26, 0.9);
    FX.flash('#c8203f', 0.6);
    /* it blows every light out on the way up - you cannot even reach the menorah */
    for (var i = 0; i < this.candles.length; i++) {
      var c = this.candles[i];
      if (c.active && c.lit) {
        c.lit = false;
        FX.burst(c.x, c.y - 24, { n: 10, color: '#8e99b5', spdMax: 180, grav: -60 });
      }
    }
    this.bossBanner('JELLY-ZILLA', 'the Great Sufganiyah rises', '#ff5b7a', 2.8);
  } else if (name === 'fight') {
    Sound.playMusic('tense');
    this.bossBanner('SLICE THE SUFGANIYOT', 'the halves fly back at him', C.gold, 3.0);
  } else if (name === 'flask') {
    Sound.stopMusic();
    Sound.seq([784, 988, 1319], 120, 0.3, 0.28, 'triangle');
    FX.flash(C.gold, 0.5);
    this.bossBanner('THE PACH SHEMEN', 'tap the sealed flask', C.gold, 3.4);
  } else if (name === 'burn') {
    Sound.sfx('shield');
    Sound.seq([1319, 1047, 880, 1319], 110, 0.26, 0.26, 'square');
    Haptics.win();
    FX.flash(C.flame, 0.6);
    FX.shake(20, 0.8);
    this.bossBanner('OUT THE WINDOW!', 'and not a drop of jam on the glass', C.flame, 3.2);
  } else if (name === 'relight') {
    Sound.playMusic('menu');
    this.bossBanner('EVERY LIGHT BACK ON', 'the miracle held', C.gold, 2.6);
  }
};

/* ------------------------------------------------------------------ update */
MenorahKeeper.prototype.updateBoss = function (dt) {
  var b = this.boss, i;
  b.t += dt;
  b.bob += dt * 2.2;
  if (b.hurt > 0) b.hurt -= dt;
  if (b.rage > 0) b.rage -= dt;
  if (b.banner) { b.banner.t += dt; if (b.banner.t > b.banner.life) b.banner = null; }

  if (b.phase === 'victory') {
    if (b.t > MenorahKeeper.BOSS.VICTORY) this.bossPhase('gift');
    return;
  }
  if (b.phase === 'gift') {
    b.boy.phase += dt * 9;
    b.boy.x = lerp(-140, CFG.W / 2, clamp(b.t / 1.6, 0, 1));
    b.boy.lift = clamp((b.t - 1.8) / 0.8, 0, 1);
    if (b.t > MenorahKeeper.BOSS.GIFT) this.bossPhase('reveal');
    return;
  }
  if (b.phase === 'reveal') {
    b.rise = clamp(b.t / 1.5, 0, 1);
    if (b.t > MenorahKeeper.BOSS.REVEAL) this.bossPhase('fight');
    return;
  }
  if (b.phase === 'fight') { this.updateBossFight(dt); return; }
  if (b.phase === 'flask') {
    b.flaskT += dt;
    if (b.flaskT > 9) this.bossPhase('burn');    // never leaves you stuck
    return;
  }
  if (b.phase === 'burn') {
    b.burnT += dt;
    if (Math.random() < dt * 30) {
      FX.burst(b.x + rand(-90, 90), b.y + rand(-80, 80),
        { n: 1, color: pick([C.flame, C.gold, '#fff2b0']), spdMax: 220, grav: -180, lifeMax: 0.9 });
    }
    if (b.burnT > MenorahKeeper.BOSS.BURN) this.bossPhase('relight');
    return;
  }
  if (b.phase === 'relight') {
    b.relitT += dt;
    /* the shamash first - every other light is taken from it */
    var order = [4].concat(MenorahKeeper.ORDER.slice(0, 8));
    var want = Math.min(order.length, Math.floor(b.relitT / 0.34));
    while (b.relit < want) {
      var c = this.candles[order[b.relit]];
      b.relit++;
      if (!c || !c.active || c.broken) continue;
      c.lit = true; c.oil = 1; c.dark = 0; c.gutter = 0; c.justLit = 0.8;
      Sound.tone({ f: 520 + b.relit * 48, dur: 0.16, vol: 0.24, type: 'triangle' });
      FX.ring(c.x, c.y - 20, C.gold, 26);
      FX.burst(c.x, c.y - 24, { n: 10, color: C.flame, spdMax: 180 });
    }
    if (b.relitT > MenorahKeeper.BOSS.RELIGHT) this.bossWin();
    return;
  }
};

MenorahKeeper.prototype.updateBossFight = function (dt) {
  var b = this.boss, i;
  if (b.frenzy > 0) b.frenzy -= dt;
  if (b.sugar > 0) b.sugar = Math.max(0, b.sugar - dt * 0.04);

  /* ---- pick an attack ---- */
  b.next -= dt;
  if (b.next <= 0 && !b.chomp) {
    var hurtK = 1 - b.hp / b.maxHp;                 /* angrier as it weakens */
    b.next = Math.max(1.35, 2.7 - hurtK * 1.2) + rand(-0.2, 0.4);
    var roll = Math.random();
    if (roll < 0.50) this.bossVolley(2 + Math.round(hurtK * 2));
    else if (roll < 0.74) this.bossWave(2 + Math.round(hurtK * 1.5));
    else if (roll < 0.87) { b.sugar = 1; Sound.sfx('whoosh');
      this.bossBanner('POWDERED SUGAR BLIZZARD', 'swipe it away', '#e8eef7', 2.0); }
    else { b.chomp = { t: 1.7, taps: 0, need: 7 };
      this.bossBanner('HE IS LUNGING', 'tap him fast!', '#ff5b7a', 1.6); }
  }

  /* ---- the chomp ---- */
  if (b.chomp) {
    b.chomp.t -= dt;
    if (b.chomp.t <= 0) {
      if (b.chomp.taps >= b.chomp.need) {
        this.bossHurt(9, b.x, b.y);
        b.repelled++;
        this.addScore(120, b.x, b.y - 150, 'SHOVED BACK!', C.teal);
        Sound.sfx('shield'); Haptics.medium();
      } else {
        FX.shake(20, 0.5);
        FX.flash(C.red, 0.4);
        Sound.sfx('hurt'); Haptics.fail();
        this.damage('Jelly-Zilla got you', CFG.W / 2, 800);
        b.combo = 0;
        if (this.lives <= 0) return;
      }
      b.chomp = null;
    }
  }

  /* ---- flying sufganiyot ---- */
  for (i = b.shots.length - 1; i >= 0; i--) {
    var sh = b.shots[i];
    sh.x += sh.vx * dt;
    sh.y += sh.vy * dt;
    sh.vy += 210 * dt;
    sh.rot += sh.spin * dt;
    if (sh.y > MenorahKeeper.BASE_Y - 30) {
      b.shots.splice(i, 1);
      b.splats++;
      b.combo = 0;
      this.bossAddBlob(sh.x, rand(500, 860));
      Sound.sfx('splat'); Haptics.double();
      FX.shake(7, 0.22);
      FX.text(sh.x, sh.y - 40, 'SPLAT!', '#ef5a78', 26);
    } else if (sh.x < -120 || sh.x > CFG.W + 120) b.shots.splice(i, 1);
  }

  /* ---- sliced halves flying home ---- */
  for (i = b.halves.length - 1; i >= 0; i--) {
    var hv = b.halves[i];
    hv.t += dt;
    hv.rot += hv.spin * dt;
    var k = clamp(hv.t / hv.dur, 0, 1);
    hv.x = lerp(hv.x0, b.x + hv.off, k);
    hv.y = lerp(hv.y0, b.y, k) - Math.sin(k * Math.PI) * 90;
    if (k >= 1) {
      b.halves.splice(i, 1);
      this.bossHurt(b.frenzy > 0 ? 6 : 3, hv.x, hv.y);
    }
  }

  /* ---- jelly on the glass ---- */
  for (i = b.blobs.length - 1; i >= 0; i--) {
    var bl = b.blobs[i];
    bl.born += dt;
    if (bl.scrub <= 0) {
      b.blobs.splice(i, 1);
      b.scrubbed++;
      this.addScore(35, bl.x, bl.y, 'WIPED +35', C.cream);
      Sound.sfx('whoosh'); Haptics.light();
      FX.burst(bl.x, bl.y, { n: 14, color: '#c8324f', spdMax: 220 });
    }
  }
  if (b.blobs.length >= 5) {
    b.blobs.length = 0;
    b.combo = 0;
    Sound.sfx('hurt'); Haptics.fail();
    FX.flash('#c8203f', 0.5);
    FX.shake(18, 0.5);
    this.damage('Smothered in jam', CFG.W / 2, 700);
    if (this.lives <= 0) return;
  }

  if (b.hp <= 0) { b.hp = 0; this.bossPhase('flask'); }
};

MenorahKeeper.prototype.bossVolley = function (n) {
  var b = this.boss;
  Sound.sfx('bad');
  this.bossBanner('SUFGANIYOT VOLLEY', 'slice them out of the air', '#ffb04a', 1.6);
  for (var i = 0; i < n; i++) {
    var tx = rand(120, CFG.W - 120);
    b.shots.push({
      x: b.x + rand(-60, 60), y: b.y + 60,
      vx: (tx - b.x) / 1.05 + rand(-40, 40),
      vy: rand(-120, -40),
      r: 34, rot: rand(0, TAU), spin: rand(-5, 5)
    });
  }
};

MenorahKeeper.prototype.bossWave = function (n) {
  var b = this.boss;
  Sound.sfx('splat');
  this.bossBanner('JELLY TIDAL WAVE', 'scrub it off in circles', '#ef5a78', 1.8);
  FX.shake(9, 0.3);
  for (var i = 0; i < n; i++) {
    this.bossAddBlob(rand(120, CFG.W - 120), rand(460, 900));
  }
};

MenorahKeeper.prototype.bossAddBlob = function (x, y) {
  var seeds = [];
  for (var q = 0; q < 7; q++) seeds.push({ a: rand(0, TAU), d: rand(0.3, 0.8), s: rand(0.3, 0.55) });
  this.boss.blobs.push({
    x: clamp(x, 90, CFG.W - 90), y: clamp(y, 420, 940),
    r: rand(78, 104), scrub: 1, born: 0, seeds: seeds
  });
};

MenorahKeeper.prototype.bossHurt = function (amount, x, y) {
  var b = this.boss;
  b.hp = Math.max(0, b.hp - amount);
  b.hurt = 0.22;
  Sound.sfx('slice');
  FX.burst(x, y, { n: 12, color: '#e0405f', spdMax: 240 });
  this.addScore(amount * 12, x, y - 30, '-' + amount, C.teal);
};

MenorahKeeper.prototype.bossWin = function () {
  var b = this.boss;
  this.victory = true;
  this.award('b_boss');
  this.award('b_night8');
  var bonus = 5000 + b.sliced * 40 + b.scrubbed * 30 + this.lives * 500;
  this.score += bonus;
  Profile.noteBest('nights', 8);
  this.nightsDone++;
  this.grades.mehadrin++;
  Sound.seq([523, 659, 784, 1047, 1319, 1568], 120, 0.26, 0.26, 'triangle');
  Haptics.win();
  FX.flash(C.gold, 0.7);
  FX.text(CFG.W / 2, 470, 'THE LIGHTS BURN ON', C.gold, 42);
  FX.text(CFG.W / 2, 530, '+' + bonus, C.cream, 34);
  for (var i = 0; i < 70; i++) {
    FX.burst(rand(60, 660), rand(360, 940), { n: 1, color: pick([C.gold, C.flame, C.cream, C.teal]), spdMax: 340, lifeMax: 1.8 });
  }
  Game.toast('Jelly-Zilla is out the window and all eight lights are burning.', 'lamp', C.gold);
  var self = this;
  this.bossSliced = b.sliced;
  this.boss = null;
  Game.endGame(self, 'Jelly-Zilla defeated - all eight lights burning', 'm12');
};

/* ------------------------------------------------------------------- input */
MenorahKeeper.prototype.handleBoss = function (ev) {
  var b = this.boss, i;
  if (ev.type === 'tap') {
    if (b.phase === 'flask') {
      if (distance(ev.x, ev.y, CFG.W / 2, 980) < 150) {
        b.flaskTaken = true;
        this.bossPhase('burn');
      }
      return;
    }
    if (b.phase === 'fight' && b.chomp) {
      b.chomp.taps++;
      Sound.sfx('tap'); Haptics.light();
      FX.burst(ev.x, ev.y, { n: 5, color: C.teal, spdMax: 160 });
      return;
    }
    return;
  }
  if (b.phase !== 'fight') return;
  if (ev.type !== 'move' && ev.type !== 'swipe') return;

  var x1 = ev.type === 'move' ? ev.px : ev.x;
  var y1 = ev.type === 'move' ? ev.py : ev.y;
  var x2 = ev.x2 == null ? ev.x : ev.x2;
  var y2 = ev.y2 == null ? ev.y : ev.y2;
  var moved = Math.hypot(x2 - x1, y2 - y1);
  if (moved < 4) return;

  /* powdered sugar wipes away as you sweep through it */
  if (b.sugar > 0) b.sugar = Math.max(0, b.sugar - moved / 2400);

  /* scrub the jelly */
  for (i = 0; i < b.blobs.length; i++) {
    var bl = b.blobs[i];
    if (distance(x2, y2, bl.x, bl.y) < bl.r) {
      bl.scrub -= moved / 520;
      return;
    }
  }

  /* slice a sufganiyah out of the air */
  for (i = b.shots.length - 1; i >= 0; i--) {
    var sh = b.shots[i];
    if (!MatzahHavoc.segCircle(x1, y1, x2, y2, sh.x, sh.y, sh.r + 14)) continue;
    b.shots.splice(i, 1);
    b.sliced++;
    b.combo++;
    if (b.combo > b.best) b.best = b.combo;
    if (b.combo > 0 && b.combo % 8 === 0) {
      b.frenzy = 5;
      Sound.sfx('badge'); Haptics.win();
      FX.flash(C.gold, 0.3);
      this.bossBanner('NAPKIN FRENZY x2', 'every half hits twice as hard', C.gold, 2.2);
    }
    Sound.sfx('slice'); Haptics.light();
    FX.burst(sh.x, sh.y, { n: 14, color: '#e0405f', spdMax: 260 });
    for (var h = 0; h < 2; h++) {
      b.halves.push({
        x0: sh.x, y0: sh.y, x: sh.x, y: sh.y, off: h ? 34 : -34,
        t: 0, dur: 0.42, rot: rand(0, TAU), spin: rand(-9, 9), side: h
      });
    }
    return;
  }
};

/* ------------------------------------------------------------------ render */
MenorahKeeper.drawSufganiyah = function (ctx, x, y, r, rot, angry) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.scale(r / 34, r / 34);
  var g = ctx.createRadialGradient(-10, -12, 4, 0, 0, 38);
  g.addColorStop(0, '#e8b063');
  g.addColorStop(1, '#c07f33');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#9c6427'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
  /* powdered sugar cap */
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.ellipse(0, -12, 26, 12, 0, 0, TAU); ctx.fill();
  /* jam welling out of the slit */
  ctx.fillStyle = '#c8203f';
  ctx.beginPath();
  ctx.ellipse(6, 12, 13, 7, 0.3, 0, TAU); ctx.fill();
  if (angry) {
    ctx.fillStyle = '#2a1016';
    ctx.beginPath(); ctx.arc(-11, -4, 4, 0, TAU); ctx.arc(11, -4, 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
};

MenorahKeeper.prototype.drawBossBody = function (ctx, t) {
  var b = this.boss;
  var scale = b.phase === 'reveal' ? easeOut(b.rise) : 1;
  if (b.phase === 'burn') scale = 1 - easeIn(clamp(b.burnT / MenorahKeeper.BOSS.BURN, 0, 1)) * 0.35;
  var bob = Math.sin(b.bob) * 12;
  var burnK = b.phase === 'burn' ? clamp(b.burnT / MenorahKeeper.BOSS.BURN, 0, 1) : 0;
  var bx = b.x + (b.phase === 'burn' ? easeIn(burnK) * 420 : 0) + (b.hurt > 0 ? rand(-6, 6) : 0);
  var by = b.y + bob - (b.phase === 'burn' ? easeIn(burnK) * 300 : 0);
  var lunge = (b.chomp ? (1 - b.chomp.t / 1.7) * 26 : 0);
  var chomp = !!b.chomp;
  var wiggle = Math.sin(t * 4.4);

  ctx.save();
  ctx.translate(bx, by + lunge);
  ctx.scale(scale, scale);
  ctx.rotate(Math.sin(t * 1.7) * 0.04 + (chomp ? 0.08 : 0));
  if (b.hurt > 0) { ctx.globalAlpha = 0.85; }

  /* stubby jam feet, kicking like a toddler kaiju */
  ctx.fillStyle = '#b81f3c';
  for (var ft = -1; ft <= 1; ft += 2) {
    var kick = Math.sin(t * 5.2 + ft) * 18;
    ctx.beginPath();
    ctx.ellipse(ft * 48 + kick * 0.2, 118 + Math.abs(kick) * 0.15, 28, 16, ft * 0.35, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#8e0f28';
    ctx.beginPath(); ctx.ellipse(ft * 62 + kick * 0.2, 122, 10, 7, 0.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b81f3c';
  }

  /* extra jam tentacles behind the body, then two fat arms with dough fists */
  ctx.strokeStyle = '#c8203f';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  for (var tn = -1; tn <= 1; tn += 2) {
    ctx.beginPath();
    ctx.moveTo(tn * 70, 40);
    ctx.quadraticCurveTo(tn * (190 + Math.sin(t * 2.6 + tn) * 28), 80 + Math.cos(t * 3.1) * 22,
      tn * (170 + Math.sin(t * 1.8 + tn) * 30), 168);
    ctx.stroke();
    ctx.fillStyle = '#e0405f';
    ctx.beginPath();
    ctx.arc(tn * (170 + Math.sin(t * 1.8 + tn) * 30), 168, 14, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = '#b81f3c';
  ctx.lineWidth = 30;
  for (var side = -1; side <= 1; side += 2) {
    var ax = side * (152 + Math.sin(t * 2.2 + side) * 24);
    var ay = 128 + Math.cos(t * 2.8 + side) * 18;
    ctx.beginPath();
    ctx.moveTo(side * 96, 8);
    ctx.quadraticCurveTo(side * (174 + Math.sin(t * 3 + side) * 20), 40 + Math.cos(t * 2.4) * 18, ax, ay);
    ctx.stroke();
    /* dough fist, too small for the arm */
    var fg = ctx.createRadialGradient(ax - 6, ay - 6, 2, ax, ay, 22);
    fg.addColorStop(0, '#f0bd72');
    fg.addColorStop(1, '#c07f33');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(ax, ay, 20, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a5620'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ax, ay, 20, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#b81f3c'; ctx.lineWidth = 30;
  }

  /* squishy donut body - a little wider than tall */
  var g = ctx.createRadialGradient(-36, -52, 12, 8, 8, 138);
  g.addColorStop(0, '#f6c882');
  g.addColorStop(0.55, '#d1913f');
  g.addColorStop(1, '#a86e28');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 6, 128, 108, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5620'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.ellipse(0, 6, 128, 108, 0, 0, TAU); ctx.stroke();

  /* dough rolls like extra chins */
  ctx.strokeStyle = 'rgba(138,86,32,.45)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(0, 78, 70, 18, 0, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 92, 52, 12, 0, 0.2, Math.PI - 0.2); ctx.stroke();

  /* powdered sugar, dumped on crooked */
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 6, 128, 108, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.78)';
  ctx.beginPath(); ctx.ellipse(-12, -70, 118, 44, -0.18, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  for (var d = 0; d < 14; d++) {
    ctx.beginPath();
    ctx.arc(-108 + d * 16, -28 + Math.sin(d * 1.9 + t) * 10, 5 + (d % 4) * 3, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  /* a sugar puff and a jam blob sliding around on top of his head */
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.ellipse(-18 + Math.sin(t * 1.9) * 16, -108 + Math.cos(t * 2.3) * 4, 32, 16, 0.15, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#c8203f';
  ctx.beginPath();
  ctx.arc(54 + Math.sin(t * 2.1) * 10, -88, 14, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,220,.55)';
  ctx.beginPath(); ctx.arc(50 + Math.sin(t * 2.1) * 10, -92, 5, 0, TAU); ctx.fill();

  /* rosy dough cheeks */
  ctx.fillStyle = 'rgba(232,90,110,.38)';
  ctx.beginPath(); ctx.ellipse(-78, 18, 22, 14, -0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(78, 22, 24, 15, 0.25, 0, TAU); ctx.fill();

  /* googly eyes - left huge, right smaller and higher, they do not agree */
  var blink = (Math.sin(t * 0.7) > 0.92) ? 0.12 : 1;
  var hurtSq = b.hurt > 0 ? 0.45 : blink;
  var Lx = -46, Ly = -28, Rx = 50, Ry = -40;
  ctx.fillStyle = '#fffdf6';
  ctx.beginPath(); ctx.ellipse(Lx, Ly, 36, 32 * hurtSq, -0.12, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(Rx, Ry, 24, 22 * hurtSq, 0.18, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2a1016'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(Lx, Ly, 36, 32 * hurtSq, -0.12, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(Rx, Ry, 24, 22 * hurtSq, 0.18, 0, TAU); ctx.stroke();
  if (hurtSq > 0.2) {
    var pL = Math.sin(t * 2.4) * 10;
    var pR = Math.cos(t * 3.1) * 7;
    ctx.fillStyle = '#241016';
    ctx.beginPath(); ctx.arc(Lx + pL, Ly + 6, 13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(Rx - pR, Ry + 4, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(Lx + pL - 4, Ly + 1, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(Rx - pR - 3, Ry, 3.5, 0, TAU); ctx.fill();
  } else if (b.hurt > 0) {
    ctx.strokeStyle = '#241016'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(Lx - 14, Ly - 10); ctx.lineTo(Lx + 14, Ly + 10);
    ctx.moveTo(Lx - 14, Ly + 10); ctx.lineTo(Lx + 14, Ly - 10);
    ctx.moveTo(Rx - 10, Ry - 8); ctx.lineTo(Rx + 10, Ry + 8);
    ctx.moveTo(Rx - 10, Ry + 8); ctx.lineTo(Rx + 10, Ry - 8);
    ctx.stroke();
  }

  /* one huge unibrow that hops */
  ctx.strokeStyle = '#2a1016';
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-78, Ly - 38 + wiggle * 3);
  ctx.quadraticCurveTo(0, Ly - 8 + (chomp ? -10 : 6), 78, Ry - 22 - wiggle * 4);
  ctx.stroke();

  /* handlebar moustache, too big, one tip dripping jam */
  ctx.save();
  ctx.translate(0, 8 + Math.sin(t * 3.2) * 3);
  ctx.rotate(Math.sin(t * 2.6) * 0.06);
  ctx.fillStyle = '#1a0c10';
  ctx.beginPath();
  ctx.moveTo(0, 22);
  ctx.quadraticCurveTo(-48, -4, -102, 8);
  ctx.quadraticCurveTo(-138, 16, -118, 52);
  ctx.quadraticCurveTo(-86, 78, -44, 46);
  ctx.quadraticCurveTo(-16, 28, 0, 38);
  ctx.quadraticCurveTo(16, 28, 44, 46);
  ctx.quadraticCurveTo(86, 78, 118, 52);
  ctx.quadraticCurveTo(138, 16, 102, 8);
  ctx.quadraticCurveTo(48, -4, 0, 22);
  ctx.closePath();
  ctx.fill();
  /* jam hanging off the left curl */
  var drip = 18 + Math.abs(Math.sin(t * 2.8)) * 16;
  ctx.fillStyle = '#a8152f';
  ctx.beginPath();
  ctx.moveTo(-108, 48);
  ctx.quadraticCurveTo(-118, 48 + drip * 0.5, -110, 48 + drip);
  ctx.quadraticCurveTo(-102, 48 + drip * 0.5, -108, 48);
  ctx.fill();
  ctx.beginPath(); ctx.arc(-110, 48 + drip, 7, 0, TAU); ctx.fill();
  ctx.restore();

  /* jam mouth - gap-toothed grin, tongue out on a lunge */
  var mw = 38 + (chomp ? 28 : 0);
  var mh = 16 + (chomp ? 22 : 6 + Math.sin(t * 2) * 3);
  ctx.fillStyle = '#6a0c1e';
  ctx.beginPath(); ctx.ellipse(0, 62, mw, mh, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0405f';
  ctx.beginPath(); ctx.ellipse(0, 58, mw * 0.62, mh * 0.42, 0, 0, TAU); ctx.fill();
  /* two square dough teeth with a goofy gap */
  ctx.fillStyle = '#fff6e4';
  ctx.fillRect(-16, 50, 11, 14);
  ctx.fillRect(8, 48, 12, 16);
  if (chomp) {
    ctx.fillStyle = '#ff6b88';
    ctx.beginPath();
    ctx.ellipse(6, 78, 16, 12, 0.4, 0, TAU);
    ctx.fill();
  }

  /* more jam leaking from the sides */
  ctx.fillStyle = '#a8152f';
  for (var dr = -1; dr <= 1; dr += 2) {
    var dl = 30 + Math.abs(Math.sin(t * 1.3 + dr)) * 28;
    ctx.beginPath();
    ctx.moveTo(dr * 26, 78);
    ctx.quadraticCurveTo(dr * 40, 78 + dl * 0.6, dr * 28, 78 + dl);
    ctx.quadraticCurveTo(dr * 14, 78 + dl * 0.6, dr * 26, 78);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(dr * 28, 78 + dl, 9, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(168,21,47,.9)';
  ctx.beginPath(); ctx.ellipse(-104, 28, 22, 14, -0.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(108, 14, 18, 12, 0.45, 0, TAU); ctx.fill();

  if (burnK > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (var f = 0; f < 7; f++) {
      var fg2 = ctx.createRadialGradient(rand(-90, 90), rand(-90, 90), 2, 0, 0, 150);
      fg2.addColorStop(0, 'rgba(255,230,150,.8)');
      fg2.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = fg2;
      ctx.beginPath(); ctx.arc(rand(-70, 70), rand(-70, 70), 120, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
};

MenorahKeeper.prototype.renderBoss = function (ctx, t) {
  var b = this.boss, i;

  if (b.phase === 'gift') {
    ctx.save();
    ctx.translate(b.boy.x, 700);
    ctx.scale(1.5, 1.5);
    MenorahKeeper.drawBoy(ctx, MenorahKeeper.BOYS[b.boy.ch], 0, 0, b.boy.phase, 1, 0);
    ctx.restore();
    /* the box, held up */
    var boxY = 700 - 40 - b.boy.lift * 70;
    ctx.save();
    ctx.translate(b.boy.x + 66, boxY);
    ctx.rotate(Math.sin(t * 5) * 0.05 * b.boy.lift);
    ctx.fillStyle = '#c8203f';
    Draw.rr(ctx, -46, -40, 92, 80, 8); ctx.fill();
    ctx.fillStyle = '#f0d67a';
    ctx.fillRect(-8, -40, 16, 80);
    ctx.fillRect(-46, -8, 92, 16);
    ctx.fillStyle = '#f0d67a';
    ctx.beginPath(); ctx.arc(-14, -46, 13, 0, TAU); ctx.arc(14, -46, 13, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  if (b.phase === 'reveal') {
    ctx.save();
    ctx.globalAlpha = 1 - b.rise;
    ctx.fillStyle = '#c8203f';
    Draw.rr(ctx, CFG.W / 2 - 60, 700 - 50, 120, 100, 10); ctx.fill();
    ctx.restore();
  }

  /* by the relight he is already out the window - do not draw him back in */
  if (b.phase !== 'victory' && b.phase !== 'gift' && b.phase !== 'relight') this.drawBossBody(ctx, t);

  /* flying sufganiyot */
  for (i = 0; i < b.shots.length; i++) {
    var sh = b.shots[i];
    MenorahKeeper.drawSufganiyah(ctx, sh.x, sh.y, sh.r, sh.rot, true);
  }
  for (i = 0; i < b.halves.length; i++) {
    var hv = b.halves[i];
    ctx.save();
    ctx.translate(hv.x, hv.y);
    ctx.rotate(hv.rot);
    ctx.beginPath();
    ctx.arc(0, 0, 26, hv.side ? -Math.PI / 2 : Math.PI / 2, hv.side ? Math.PI / 2 : -Math.PI / 2);
    ctx.closePath();
    ctx.fillStyle = '#d99b4d';
    ctx.fill();
    ctx.strokeStyle = '#c8203f'; ctx.lineWidth = 5; ctx.stroke();
    ctx.restore();
  }

  /* jelly stuck to the glass */
  for (i = 0; i < b.blobs.length; i++) {
    var bl = b.blobs[i];
    ctx.save();
    ctx.globalAlpha = clamp(bl.scrub, 0, 1) * 0.95;
    ctx.translate(bl.x, bl.y);
    var gg = ctx.createRadialGradient(0, 0, 6, 0, 0, bl.r);
    gg.addColorStop(0, '#e0405f');
    gg.addColorStop(0.7, '#b5203f');
    gg.addColorStop(1, 'rgba(150,20,50,.8)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, bl.r * (0.62 + 0.38 * bl.scrub), 0, TAU); ctx.fill();
    for (var q = 0; q < bl.seeds.length; q++) {
      var sd = bl.seeds[q];
      ctx.beginPath();
      ctx.arc(Math.cos(sd.a) * bl.r * sd.d, Math.sin(sd.a) * bl.r * sd.d, bl.r * sd.s * bl.scrub, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(120,12,38,' + (clamp(bl.scrub, 0, 1) * 0.9) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, bl.r * (0.62 + 0.38 * bl.scrub), 0, TAU); ctx.stroke();
    ctx.restore();
  }
  /* the hint goes on top of every blob, never underneath one */
  if (b.blobs.length && b.blobs[0].born < 2.2) {
    var b0 = b.blobs[0];
    Draw.textSafe(ctx, 'SCRUB IN CIRCLES', b0.x, b0.y + b0.r + 26, {
      size: 18, maxW: 260, color: 'rgba(255,255,255,' + (1 - b0.born / 2.2) + ')', weight: '900',
      stroke: 'rgba(0,0,0,.75)', strokeW: 5
    });
  }

  /* powdered sugar blizzard */
  if (b.sugar > 0.01) {
    var sg = clamp(b.sugar, 0, 1);
    ctx.save();
    /* frost creeps in from the edges - the middle stays fightable */
    var vg = ctx.createRadialGradient(CFG.W / 2, 640, 120, CFG.W / 2, 640, 700);
    vg.addColorStop(0, 'rgba(244,247,252,' + (sg * 0.20) + ')');
    vg.addColorStop(0.55, 'rgba(244,247,252,' + (sg * 0.52) + ')');
    vg.addColorStop(1, 'rgba(250,252,255,' + (sg * 0.86) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.globalAlpha = sg * 0.85;
    ctx.fillStyle = '#ffffff';
    for (var p = 0; p < 90; p++) {
      var px = ((p * 137 + t * (70 + (p % 5) * 26)) % (CFG.W + 80)) - 40;
      var py = ((p * 313 + t * (110 + (p % 7) * 30)) % (CFG.H + 80)) - 40;
      var pr = 2 + (p % 4) * 1.6;
      ctx.beginPath(); ctx.ellipse(px, py, pr, pr * 1.5, 0.3, 0, TAU); ctx.fill();
    }
    ctx.restore();
    Draw.textSafe(ctx, 'SWIPE THE SUGAR AWAY', CFG.W / 2, 420, {
      size: 26, maxW: 520, color: '#3f4a5c', weight: '900',
      stroke: 'rgba(255,255,255,.85)', strokeW: 5
    });
  }

  /* the lunge QTE */
  if (b.chomp) {
    var need = b.chomp.need, got = Math.min(b.chomp.taps, need);
    Draw.panel(ctx, 120, 320, 480, 74, { fill: 'rgba(60,6,16,.94)', stroke: '#ff5b7a', strokeW: 3, radius: 16,
      glow: 'rgba(255,91,122,.6)', glowBlur: 26 });
    Draw.textSafe(ctx, 'TAP! TAP! TAP!', CFG.W / 2, 344, { size: 26, maxW: 440, color: '#ff9fb2', weight: '900' });
    Draw.meter(ctx, 140, 362, 440, 14, got / need, { fg: C.teal });
  }

  /* the sealed flask */
  if (b.phase === 'flask') {
    var fy = 980 - Math.sin(t * 3) * 10;
    ctx.save();
    ctx.translate(CFG.W / 2, fy);
    ctx.shadowColor = C.gold; ctx.shadowBlur = 36;
    ctx.fillStyle = '#e8c86a';
    ctx.beginPath();
    ctx.moveTo(-30, -46); ctx.lineTo(30, -46); ctx.lineTo(42, 4);
    ctx.quadraticCurveTo(42, 54, 0, 54);
    ctx.quadraticCurveTo(-42, 54, -42, 4);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#a5822c'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = '#8a6a2f';
    Draw.rr(ctx, -34, -58, 68, 16, 6); ctx.fill();
    /* the Kohen Gadol's seal */
    ctx.fillStyle = '#c8203f';
    ctx.beginPath(); ctx.arc(0, -50, 15, 0, TAU); ctx.fill();
    Draw.magenDavid(ctx, 0, -50, 9, '#f4e3c0', 2.5);
    ctx.restore();
    Draw.textSafe(ctx, 'TAP THE PACH SHEMEN', CFG.W / 2, fy + 96, {
      size: 26, maxW: 560, color: 'rgba(255,207,92,' + (0.6 + 0.4 * pulse(t, 2)) + ')', weight: '900',
      stroke: 'rgba(0,0,0,.75)', strokeW: 6
    });
  }

  /* banner */
  if (b.banner) {
    var k = clamp(Math.min(b.banner.t / 0.28, (b.banner.life - b.banner.t) / 0.4), 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    var by2 = View.safe.t + 250;
    Draw.panel(ctx, 40, by2, CFG.W - 80, b.banner.small ? 92 : 66, {
      fill: 'rgba(8,10,26,.94)', stroke: b.banner.color, strokeW: 3, radius: 18,
      glow: b.banner.color, glowBlur: 26
    });
    Draw.textSafe(ctx, b.banner.big, CFG.W / 2, by2 + 34, {
      size: 32, maxW: CFG.W - 120, color: b.banner.color, weight: '900'
    });
    if (b.banner.small) {

        size: 20, maxW: CFG.W - 120, color: 'rgba(255,255,255,.8)', weight: '700'
      });
    }
    ctx.restore();
  }
};

MenorahKeeper.prototype.renderBossHud = function (ctx, y) {
  var b = this.boss;

  var w = 380, x = (CFG.W - w) / 2;
  Draw.panel(ctx, x, y - 6, w, 66, { fill: 'rgba(40,6,14,.85)', radius: 16, stroke: '#ff5b7a' });

    size: 22, maxW: w - 24, color: '#ff9fb2', weight: '900'
  });

};
