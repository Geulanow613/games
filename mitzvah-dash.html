/* a dish that would match on spawn is a freebie - reshuffle a few times */
KitchenMatch.prototype.untangle = function (tries) {
  var n = tries || 8;
  while (n-- > 0 && this.findMatches().length) {
    var cells = this.findMatches();
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      this.makeSafeTile(c.c, c.r, false);
    }
  }
  /* last resort: lift one dish off each leftover plate so the board never
     shouts FULL PLATE before the player has touched anything */
  if (this.findMatches().length) {
    var groups = this.findMatchGroups(), g, cell;
    for (g = 0; g < groups.length; g++) {
      cell = groups[g][0];
      this.grid[cell.r][cell.c] = null;
    }
  }
};

KitchenMatch.prototype.pool = function (allowJunk) {
  var t = this.cfg || this.tune();
  var out = [], i, f;
  for (i = 0; i < Foods.list.length; i++) {
    f = Foods.list[i];
    if (f.k === 'meat' || f.k === 'dairy') out.push(f);
    else if (f.k === 'pareve' && (t.mixPareve || f.shape !== 'fish')) out.push(f);
    else if (allowJunk && f.k === 'treif' && t.junk) out.push(f);
    else if (allowJunk && f.k === 'mixed' && t.mixed) out.push(f);
  }
  if (!t.mixPareve) {
    out = out.filter(function (x) { return x.k !== 'pareve'; });
    if (!out.length) out = Foods.list.filter(function (x) { return x.k === 'meat' || x.k === 'dairy'; });
  }
  return out.length ? out : Foods.list.filter(function (x) { return x.k === 'meat' || x.k === 'dairy' || x.k === 'pareve'; });
};

KitchenMatch.prototype.makeTile = function (allowJunk) {
  var t = this.cfg || this.tune();
  var food;
  if (allowJunk && t.junk && chance(t.junk)) food = pick(Foods.list.filter(function (f) { return f.k === 'treif'; }));
  else if (allowJunk && t.mixed && chance(t.mixed)) food = pick(Foods.list.filter(function (f) { return f.k === 'mixed'; }));
  else food = pick(this.pool(false));
  if (!food) food = Foods.list[0];
  return {
    food: food, id: ++this.tileId,
    covered: !!(t.lids && chance(t.lids)),
    reveal: 0, pop: 0, fall: 0
  };
};

KitchenMatch.prototype.cellCompletesMatch = function (c, r) {
  var hits = this.findMatches(), i;
  for (i = 0; i < hits.length; i++) {
    if (hits[i].c === c && hits[i].r === r) return true;
  }
  return false;
};

/* Place a dish that does not already complete a plate - otherwise the board
   clears itself and shouts FULL PLATE before you have touched anything. */
KitchenMatch.prototype.makeSafeTile = function (c, r, allowJunk) {
  var n = 24, tile, p, pool;
  while (n--) {
    tile = this.makeTile(!!allowJunk);
    this.grid[r][c] = tile;
    if (!this.cellCompletesMatch(c, r)) return tile;
  }
  pool = this.pool(false);
  for (p = 0; p < pool.length; p++) {
    tile = { food: pool[p], id: ++this.tileId, covered: false, reveal: 0, pop: 0, fall: 0 };
    this.grid[r][c] = tile;
    if (!this.cellCompletesMatch(c, r)) return tile;
  }
  /* empty is better than gifting a plate the player never swapped for */
  this.grid[r][c] = null;
  return null;
};

/* A neighbour-swap that would plate, or null if the board is stuck.
   Any two uncovered neighbours can trade - kashrus only decides the plate. */
KitchenMatch.prototype.findSwap = function () {
  var C = KitchenMatch.COLS, R = KitchenMatch.ROWS;
  var dirs = [[1, 0], [0, 1]];
  var c, r, d, c2, r2, a, b, hits, used, i;
  for (r = 0; r < R; r++) {
    for (c = 0; c < C; c++) {
      for (d = 0; d < 2; d++) {
        c2 = c + dirs[d][0]; r2 = r + dirs[d][1];
        if (c2 >= C || r2 >= R) continue;
        a = this.grid[r][c]; b = this.grid[r2][c2];
        if (!a || !b || a.covered || b.covered) continue;
        this.grid[r][c] = b; this.grid[r2][c2] = a;
        hits = this.findMatches(this.swapPrefer(c, r, c2, r2));
        used = false;
        for (i = 0; i < hits.length; i++) {
          if ((hits[i].c === c && hits[i].r === r) || (hits[i].c === c2 && hits[i].r === r2)) {
            used = true; break;
          }
        }
        this.grid[r][c] = a; this.grid[r2][c2] = b;
        if (used) return { c1: c, r1: r, c2: c2, r2: r2 };
      }
    }
  }
  return null;
};

KitchenMatch.prototype.hasCovered = function () {
  var r, c, t;
  for (r = 0; r < KitchenMatch.ROWS; r++) {
    for (c = 0; c < KitchenMatch.COLS; c++) {
      t = this.grid[r][c];
      if (t && t.covered) return true;
    }
  }
  return false;
};

/* After a fill or a rise, the player must still have something to do. */
KitchenMatch.prototype.ensurePlayable = function () {
  var n = 48, filled, pickCell, p;
  while (n-- && !this.findSwap()) {
    filled = [];
    for (p = 0; p < KitchenMatch.ROWS; p++) {
      for (var c = 0; c < KitchenMatch.COLS; c++) {
        if (this.grid[p][c] && !this.grid[p][c].covered) filled.push({ c: c, r: p });
      }
    }
    if (!filled.length) break;
    pickCell = filled[(Math.random() * filled.length) | 0];
    this.makeSafeTile(pickCell.c, pickCell.r, false);
    this.untangle(6);
  }
  if (this.findSwap() || this.hasCovered()) return true;
  this.plantMove();
  return !!this.findSwap() || this.hasCovered();
};

/* Last resort: dairy blocking three meat, with a meat above it to swap in. */
KitchenMatch.prototype.plantMove = function () {
  var meat = null, dairy = null, i, c, t, row;
  for (i = 0; i < Foods.list.length; i++) {
    if (!meat && Foods.list[i].k === 'meat') meat = Foods.list[i];
    if (!dairy && Foods.list[i].k === 'dairy') dairy = Foods.list[i];
  }
  if (!meat || !dairy) return;
  row = KitchenMatch.ROWS - 1;
  if (row < 1) return;
  var foods = [meat, dairy, meat, meat];
  for (c = 0; c < 4; c++) {
    t = this.grid[row][c];
    if (!t) {
      t = { food: foods[c], id: ++this.tileId, covered: false, reveal: 0, pop: 0, fall: 0 };
      this.grid[row][c] = t;
    } else {
      t.food = foods[c];
      t.covered = false;
    }
  }
  t = this.grid[row - 1][1];
  if (!t) {
    this.grid[row - 1][1] = { food: meat, id: ++this.tileId, covered: false, reveal: 0, pop: 0, fall: 0 };
  } else {
    t.food = meat;
    t.covered = false;
  }
};

KitchenMatch.prototype.put = function (c, r, kind, opts) {
  opts = opts || {};
  var food = kind;
  if (typeof kind === 'string') {
    food = null;
    for (var i = 0; i < Foods.list.length; i++) {
      var f = Foods.list[i];
      if (f.name === kind) { food = f; break; }
      if (f.k === kind && opts.shape && f.shape === opts.shape) { food = f; break; }
      if (f.k === kind && !food) food = f;
    }
  }
  if (!food) food = Foods.list[0];
  var tile = { food: food, id: ++this.tileId, covered: !!opts.covered, reveal: 0, pop: 0, fall: 0 };
  this.grid[r][c] = tile;
  return tile;
};

KitchenMatch.kindOf = function (food) {
  if (!food) return '';
  var f = food.food || food;
  if (f.k === 'pareve' && f.shape === 'fish') return 'fish';
  return f.k || '';
};

/* Side for match-3 colour: meat / dairy / pareve / fish. Pareve may ride on
   a meat or dairy plate, but it is not a bridge that joins those two sides. */
KitchenMatch.matchKind = function (food) {
  var k = KitchenMatch.kindOf(food);
  if (k === 'meat' || k === 'dairy' || k === 'pareve' || k === 'fish') return k;
  return '';
};

/* One plate has at most one main side. Meat + dairy in the same group is
   never a plate, even if pareve sits between them. */
KitchenMatch.plateSide = function (tiles) {
  var stats = KitchenMatch.plateStats(tiles);
  return stats ? stats.side : '';
};

/* A plate is three or more dishes in a line that can all be eaten together.
   That is the whole rule. There is no quota of sides or garnishes - kashrus is
   checked dish against dish in canTogether, which is where the nusach lives, so
   meat and milk can never land on one plate however much pareve sits between
   them, and salmon beside cheese depends who you ask.
   `side` is only what the plate gets called on its way up. */
KitchenMatch.plateStats = function (tiles) {
  var i, k, main = '', mains = 0, pareve = 0, fish = 0;
  if (!tiles || tiles.length < 3) return null;
  if (!KitchenMatch.mixOk(tiles)) return null;
  for (i = 0; i < tiles.length; i++) {
    k = KitchenMatch.kindOf(tiles[i]);
    if (k === 'fish') fish++;
    else if (k === 'pareve') pareve++;
    else { main = k; mains++; }
  }
  if (main) return { side: main, mains: mains, pareve: pareve, fish: fish };
  return { side: fish ? 'fish' : 'pareve', mains: 0, pareve: pareve, fish: fish };
};

KitchenMatch.isLiquidMilk = function (food) {
  var f = food && (food.food || food);
  if (!f) return false;
  return f.shape === 'milk' || f.name === 'Milk';
};

/* Edot HaMizrach: no fish with any dairy. The play note says Sephardim.
   Chabad: only liquid milk (chalav) with fish. Cheese, butter, cream stay ok.
   Ashkenaz / Nusach Sefard: fish with dairy is fine. */
KitchenMatch.fishDairyClash = function (a, b) {
  var ka = KitchenMatch.kindOf(a), kb = KitchenMatch.kindOf(b);
  var dairy = ka === 'dairy' ? a : (kb === 'dairy' ? b : null);
  var fish = ka === 'fish' ? a : (kb === 'fish' ? b : null);
  if (!dairy || !fish) return false;
  var n = Nusach.id();
  if (n === 'sephardi') return true;
  if (n === 'chabad') return KitchenMatch.isLiquidMilk(dairy);
  return false;
};

KitchenMatch.sideLabel = function (food) {
  var k = KitchenMatch.kindOf(food);
  if (k === 'meat') return 'MEAT';
  if (k === 'dairy') return 'DAIRY';
  if (k === 'fish') return 'FISH';
  if (k === 'pareve') return 'PAREVE';
  if (k === 'mixed') return 'MIXED';
  if (k === 'treif') return 'TREIF';
  return '';
};

KitchenMatch.sideColor = function (food) {
  var k = KitchenMatch.kindOf(food);
  if (k === 'meat') return C.meat;
  if (k === 'dairy') return C.dairy;
  if (k === 'fish') return '#5ee0c0';
  if (k === 'pareve') return C.pareve;
  return C.trash;
};

/* Two dishes may share a plate only when the kitchen allows it.
   Any two neighbours can still swap places - kashrus is the plate, not the shuffle. */
KitchenMatch.canTogether = function (a, b) {
  if (!a || !b) return false;
  if (a.covered || b.covered) return false;
  var ka = KitchenMatch.kindOf(a), kb = KitchenMatch.kindOf(b);
  if (!ka || !kb) return false;
  if (ka === 'treif' || kb === 'treif' || ka === 'mixed' || kb === 'mixed') return false;
  if ((ka === 'meat' && kb === 'dairy') || (ka === 'dairy' && kb === 'meat')) return false;
  if ((ka === 'meat' && kb === 'fish') || (ka === 'fish' && kb === 'meat')) return false;
  if (KitchenMatch.fishDairyClash(a, b)) return false;
  return true;
};

KitchenMatch.prototype.canTogether = function (a, b) { return KitchenMatch.canTogether(a, b); };

KitchenMatch.prototype.tilesOf = function (cells) {
  var i, t, out = [];
  for (i = 0; i < cells.length; i++) {
    t = cells[i].t || (this.grid[cells[i].r] && this.grid[cells[i].r][cells[i].c]);
    out.push(t);
  }
  return out;
};

/* Every dish gets on with every other dish, nothing is treif or basar b'chalav,
   and nothing is still hidden under a lid. A run being scanned may be shorter
   than a plate - this is all it has to pass until it is long enough to be one. */
KitchenMatch.mixOk = function (tiles) {
  var i, j;
  if (!tiles || !tiles.length) return false;
  for (i = 0; i < tiles.length; i++) {
    if (!tiles[i] || tiles[i].covered) return false;
    if (!KitchenMatch.matchKind(tiles[i])) return false;
  }
  for (i = 0; i < tiles.length; i++) {
    for (j = i + 1; j < tiles.length; j++) {
      if (!KitchenMatch.canTogether(tiles[i], tiles[j])) return false;
    }
  }
  return true;
};

KitchenMatch.prototype.runFits = function (tiles) {
  return !!KitchenMatch.plateStats(tiles);
};

KitchenMatch.prototype.runPrefixOk = function (tiles) {
  return KitchenMatch.mixOk(tiles);
};

KitchenMatch.prototype.groupOk = function (tiles) {
  return !!KitchenMatch.plateStats(tiles);
};

KitchenMatch.prototype.groupSide = function (cells) {
  var stats = KitchenMatch.plateStats(this.tilesOf(cells));
  return stats ? stats.side : '';
};

/* The one match colour every dish in the run shares, or '' when it is mixed. */
KitchenMatch.prototype.runColour = function (run) {
  var i, k, colour = '';
  for (i = 0; i < run.length; i++) {
    k = KitchenMatch.matchKind(run[i].t || (this.grid[run[i].r] && this.grid[run[i].r][run[i].c]));
    if (!k) return '';
    if (colour && colour !== k) return '';
    colour = k;
  }
  return colour;
};

KitchenMatch.prototype.findMatchGroups = function () {
  var C = KitchenMatch.COLS, R = KitchenMatch.ROWS, r, c, groups = [], self = this;
  var scan = function (cells) {
    var run = [], i, cell, k, colour;
    var flush = function () {
      if (run.length >= 3 && self.groupOk(self.tilesOf(run))) groups.push(run.slice());
      run = [];
    };
    for (i = 0; i < cells.length; i++) {
      cell = cells[i];
      if (!cell.t || cell.t.covered || !KitchenMatch.matchKind(cell.t)) {
        flush();
        continue;
      }
      k = KitchenMatch.matchKind(cell.t);
      /* A finished plate of one colour must not swallow the next colour, so
         three apples beside three salmon stay two plates. */
      if (run.length >= 3) {
        colour = self.runColour(run);
        if (colour && colour !== k && KitchenMatch.plateStats(self.tilesOf(run))) flush();
      }
      run.push(cell);
      if (!self.runPrefixOk(self.tilesOf(run))) {
        run.pop();
        flush();
        run = [cell];
        if (!self.runPrefixOk(self.tilesOf(run))) run = [];
      }
    }
    flush();
  };
  for (r = 0; r < R; r++) {
    var row = [];
    for (c = 0; c < C; c++) row.push({ c: c, r: r, t: this.grid[r][c] });
    scan(row);
  }
  for (c = 0; c < C; c++) {
    var col = [];
    for (r = 0; r < R; r++) col.push({ c: c, r: r, t: this.grid[r][c] });
    scan(col);
  }
  return groups;
};

/* A plate is one connected set of lines that can share. An L of five meat is
   one plate. Meat and dairy never join, even if they sit next to pareve. */
KitchenMatch.prototype.groupAxis = function (g) {
  if (!g || g.length < 2) return '';
  return g[0].r === g[1].r ? 'row' : 'col';
};

KitchenMatch.prototype.groupsShare = function (a, b) {
  var i, seen = {};
  for (i = 0; i < a.length; i++) seen[a[i].c + ',' + a[i].r] = true;
  for (i = 0; i < b.length; i++) {
    if (seen[b[i].c + ',' + b[i].r]) return true;
  }
  return false;
};

KitchenMatch.prototype.cellsUnion = function (groups) {
  var seen = {}, out = [], g, i, cell, key;
  for (g = 0; g < groups.length; g++) {
    for (i = 0; i < groups[g].length; i++) {
      cell = groups[g][i];
      key = cell.c + ',' + cell.r;
      if (!seen[key]) { seen[key] = true; out.push(cell); }
    }
  }
  return out;
};

KitchenMatch.prototype.unionGroupOk = function (groups) {
  return this.groupOk(this.tilesOf(this.cellsUnion(groups)));
};

KitchenMatch.prototype.swapPrefer = function (c1, r1, c2, r2) {
  var keys = {};
  keys[c1 + ',' + r1] = true;
  keys[c2 + ',' + r2] = true;
  return { keys: keys, axis: r1 === r2 ? 'row' : 'col' };
};

KitchenMatch.prototype.selectPlates = function (groups, prefer) {
  if (!groups || !groups.length) return [];
  var n = groups.length, i, j, adj = [], seen = [], selected = [];
  var keys = prefer && prefer.keys;
  var self = this;
  /* Two line-groups become one plate only if they share a cell and everything
     in the union can still be eaten together. So pareve may ride inside a meat
     run, but it never bridges meat to dairy (M-M-P linked to P-D-D). */
  for (i = 0; i < n; i++) {
    adj[i] = [];
    seen[i] = false;
    if (!this.groupOk(this.tilesOf(groups[i]))) continue;
    for (j = 0; j < n; j++) {
      if (i === j) continue;
      if (!this.groupsShare(groups[i], groups[j])) continue;
      if (!this.unionGroupOk([groups[i], groups[j]])) continue;
      adj[i].push(j);
    }
  }
  var preferHit = function (g) {
    var k, key;
    if (!keys) return 1;
    for (k = 0; k < g.length; k++) {
      key = g[k].c + ',' + g[k].r;
      if (keys[key]) return 1;
    }
    return 0;
  };
  /* A plate is one line plus the lines that cross it - an L, a T, a plus.
     It does not go on chaining line to line across the board, which is how a
     single swap used to lift half the kitchen. */
  var grow = function (start) {
    var bucket = [start], used = {}, k, next, trial, bi;
    used[start] = true;
    for (k = 0; k < adj[start].length; k++) {
      next = adj[start][k];
      if (used[next]) continue;
      trial = [];
      for (bi = 0; bi < bucket.length; bi++) trial.push(groups[bucket[bi]]);
      trial.push(groups[next]);
      if (!self.unionGroupOk(trial)) continue;
      used[next] = true;
      bucket.push(next);
    }
    return bucket;
  };
  for (i = 0; i < n; i++) {
    if (seen[i] || !this.groupOk(this.tilesOf(groups[i]))) continue;
    var comp = grow(i), raw = [], hit = 0, plate;
    for (j = 0; j < comp.length; j++) {
      seen[comp[j]] = true;
      raw.push(groups[comp[j]]);
      hit += preferHit(groups[comp[j]]);
    }
    if (keys && !hit) continue;
    plate = self.cellsUnion(raw);
    if (!self.groupOk(self.tilesOf(plate))) continue;
    selected.push(plate);
  }
  if (selected.length < 2) return selected;
  var score = function (p) {
    var h = 0, k, key;
    if (keys) {
      for (k = 0; k < p.length; k++) {
        key = p[k].c + ',' + p[k].r;
        if (keys[key]) h += 10;
      }
    }
    return h * 1000 + p.length;
  };
  var order = selected.map(function (p, idx) { return { p: p, i: idx, s: score(p) }; });
  order.sort(function (a, b) { return b.s - a.s || a.i - b.i; });
  var kept = [], ok;
  for (i = 0; i < order.length; i++) {
    if (!self.groupOk(self.tilesOf(order[i].p))) continue;
    ok = true;
    for (j = 0; j < kept.length; j++) {
      if (self.groupsShare(order[i].p, kept[j])) { ok = false; break; }
    }
    if (ok) kept.push(order[i].p);
  }
  return kept;
};

KitchenMatch.prototype.findMatches = function (prefer) {
  var groups = this.selectPlates(this.findMatchGroups(), prefer), seen = {}, out = [], g, i, key, cell;
  for (g = 0; g < groups.length; g++) {
    for (i = 0; i < groups[g].length; i++) {
      cell = groups[g][i];
      key = cell.c + ',' + cell.r;
      if (!seen[key]) { seen[key] = true; out.push(cell); }
    }
  }
  return out;
};

KitchenMatch.prototype.gravity = function () {
  var C = KitchenMatch.COLS, R = KitchenMatch.ROWS, c, r, write, moved = false;
  /* where dishes landed - a cascade only counts where something actually fell */
  this.fell = {};
  for (c = 0; c < C; c++) {
    write = R - 1;
    for (r = R - 1; r >= 0; r--) {
      if (this.grid[r][c]) {
        if (write !== r) {
          this.grid[write][c] = this.grid[r][c];
          this.grid[write][c].fall = (write - r) * 0.06;
          this.grid[r][c] = null;
          this.fell[c + ',' + write] = true;
          moved = true;
        }
        write--;
      }
    }
  }
  return moved;
};

/* Everything this move sends up has to be servable together. Two meat plates
   go up side by side; a meat plate and a dairy plate never do - not in the
   same clear and not in a cascade a beat later. The plate the player just
   made wins, and the other side waits for its own move.
   `table` is what the move has served so far, so the rule holds all the way
   through the cascade. */
KitchenMatch.prototype.servableTogether = function (groups, prefer, table) {
  this.heldBack = null;
  if (!groups || !groups.length) return [];
  var keys = prefer && prefer.keys;
  var score = function (g) {
    var h = 0, i, key;
    if (keys) {
      for (i = 0; i < g.length; i++) {
        key = g[i].c + ',' + g[i].r;
        if (keys[key]) h++;
      }
    }
    return h * 1000 + g.length;
  };
  var order = groups.map(function (g, i) { return { g: g, i: i, s: score(g) }; });
  order.sort(function (a, b) { return b.s - a.s || a.i - b.i; });
  var served = table || [];
  var kept = [], i, j, k, tiles, ok;
  for (i = 0; i < order.length; i++) {
    tiles = this.tilesOf(order[i].g);
    ok = true;
    for (j = 0; ok && j < tiles.length; j++) {
      for (k = 0; k < served.length; k++) {
        if (!KitchenMatch.canTogether(tiles[j], served[k])) { ok = false; break; }
      }
    }
    if (!ok) {
      if (!this.heldBack) this.heldBack = order[i].g;
      continue;
    }
    kept.push(order[i].g);
    for (j = 0; j < tiles.length; j++) served.push(tiles[j]);
  }
  return kept;
};

KitchenMatch.prototype.resolve = function (opts) {
  opts = opts || {};
  var silent = !!opts.silent;
  var n = 0, plates = 0;
  var prefer = opts.prefer || null;
  /* one move serves one plate, cascade included - a board settling on its own
     has no move behind it, so each beat there stands alone */
  var served = opts.prefer ? [] : null;
  while (n < 12) {
    var groups = this.servableTogether(
      this.selectPlates(this.findMatchGroups(), prefer), prefer, served);
    if (!groups.length) break;
    n++;
    /* say out loud which side has to wait, before the board shifts under it */
    var held = (!silent && n === 1 && this.heldBack) ? this.plateKind(this.heldBack) : null;
    var seen = {}, g, i, key, p, cells, pk;
    for (g = 0; g < groups.length; g++) {
      cells = [];
      for (i = 0; i < groups[g].length; i++) {
        key = groups[g][i].c + ',' + groups[g][i].r;
        if (seen[key]) continue;
        seen[key] = true;
        cells.push(groups[g][i]);
      }
      if (!cells.length) continue;
      /* Hard stop: never lift a plate that mixes forbidden sides. */
      if (!this.groupOk(this.tilesOf(cells))) continue;
      plates++;
      if (!silent) {
        p = this.cellCenter(cells[0].c, cells[0].r);
        pk = this.plateKind(cells);
        if (cells.length >= 5) this.popFx(p.x, p.y - 56, 'FULL ' + pk.name + ' PLATE!', pk.color, 28);
        else if (cells.length >= 4) this.popFx(p.x, p.y - 56, 'BIG ' + pk.name + ' PLATE!', pk.color, 26);
        else this.popFx(p.x, p.y - 56, pk.name + ' PLATE', pk.color, 22);
      }
      this.clearCells(cells, n);
    }
    if (held) this.popFx(CFG.W / 2, 486, held.name + ' WAITS ITS TURN', held.color, 24);
    if (!silent) {
      if (n === 2) this.popFx(CFG.W / 2, 540, 'CASCADE!', C.teal, 30);
      else if (n === 3) this.popFx(CFG.W / 2, 540, 'TRIPLE!', C.gold, 32);
      else if (n >= 4) this.popFx(CFG.W / 2, 540, 'MEHADRIN!', C.gold, 34);
    }
    this.gravity();
    /* the next beat only looks where dishes fell, so a line the player never
       touched is not swept up as a bonus */
    prefer = { keys: this.fell || {}, axis: '' };
  }
  if (plates) {
    if (!silent) {
      this.hitCombo();
      if (this.combo >= 20) this.award('b_streak');
      Profile.noteBest('streak', this.combo);
      if (this.combo === 3) this.popFx(CFG.W / 2, 560, 'NICE!', C.teal, 28);
      else if (this.combo === 5) this.popFx(CFG.W / 2, 560, 'STREAK!', C.gold, 30);
      else if (this.combo === 8) this.popFx(CFG.W / 2, 560, 'MEHADRIN!', C.gold, 32);
      if (this.combo > 0 && this.combo % 10 === 0) {
        var bonus = this.combo * 12;
        this.score += bonus;
        this.popFx(CFG.W / 2, 620, 'MEHADRIN STREAK x' + this.combo + '  +' + bonus, C.gold, 34);
        FX.flash(C.gold, 0.25);
        Sound.sfx('badge'); Haptics.win();
      }
    }
  } else if (!silent) {
    this.breakCombo();
  }
  return plates;
};

KitchenMatch.prototype.clearCells = function (cells, cascade) {
  var pts = (40 + cells.length * 12 + (cascade - 1) * 20);
  pts = Math.round(pts * this.mult);
  var i, c, t, px = 0, py = 0, hasPareve = 0;
  for (i = 0; i < cells.length; i++) {
    c = cells[i];
    t = this.grid[c.r][c.c];
    if (!t) continue;
    var p = this.cellCenter(c.c, c.r);
    px += p.x; py += p.y;
    if (t.food.k === 'pareve') hasPareve++;
    FX.burst(p.x, p.y, { n: 8, color: Foods.colorFor(t.food.k), spdMax: 200, lifeMax: 0.5 });
    this.grid[c.r][c.c] = null;
  }
  px /= cells.length; py /= cells.length;
  this.correct += cells.length;
  this.sortedTotal = (this.sortedTotal || 0) + cells.length;
  this.plates++;
  this.platesTotal++;
  if (hasPareve) {
    this.pareveOk += hasPareve;
    if (this.pareveOk >= 30) this.award('b_pareve');
  }
  this.addScore(pts, px, py - 24, '+' + pts, C.gold);
  Sound.tone({ f: 560 + Math.min(this.combo + cascade, 16) * 46, dur: 0.10, vol: 0.22, type: 'triangle' });
  Haptics.light();
};

KitchenMatch.prototype.plateKind = function (cells) {
  var hasMeat = false, hasDairy = false, hasFish = false, i, t, k;
  for (i = 0; i < cells.length; i++) {
    t = cells[i].t || (this.grid[cells[i].r] && this.grid[cells[i].r][cells[i].c]);
    k = KitchenMatch.kindOf(t);
    if (k === 'meat') hasMeat = true;
    else if (k === 'dairy') hasDairy = true;
    else if (k === 'fish') hasFish = true;
  }
  if (hasMeat) return { name: 'FLEISHIG', color: C.meat };
  if (hasDairy) return { name: 'MILCHIG', color: C.dairy };
  if (hasFish) return { name: 'FISH', color: '#5ee0c0' };
  return { name: 'PAREVE', color: C.pareve };
};

KitchenMatch.prototype.popFx = function (x, y, str, color, size) {
  FX.text(x, y, str, color, size || 22, 2.4);
};

KitchenMatch.prototype.trySwap = function (c1, r1, c2, r2) {
  if (this.busy > 0) return { ok: false, reason: 'busy' };
  if (Math.abs(c1 - c2) + Math.abs(r1 - r2) !== 1) return { ok: false, reason: 'far' };
  var a = this.grid[r1][c1], b = this.grid[r2][c2];
  if (!a || !b) return { ok: false, reason: 'empty' };
  if (a.covered || b.covered) {
    this.popFx(this.cellCenter(c1, r1).x, this.cellCenter(c1, r1).y - 40, 'TAP TO UNCOVER', C.gold, 22);
    Sound.sfx('back');
    return { ok: false, reason: 'covered' };
  }
  this.grid[r1][c1] = b;
  this.grid[r2][c2] = a;
  var prefer = this.swapPrefer(c1, r1, c2, r2);
  var hits = this.findMatches(prefer);
  var used = false, i;
  if (hits.length) {
    for (i = 0; i < hits.length; i++) {
      if ((hits[i].c === c1 && hits[i].r === r1) || (hits[i].c === c2 && hits[i].r === r2)) {
        used = true; break;
      }
    }
  }
  if (!hits.length || !used) {
    Sound.sfx('ui');
    Haptics.light();
    return { ok: true, reason: 'moved', plates: this.plates };
  }
  this.busy = 0.18;
  this.resolve({ prefer: prefer });
  if (this.plates >= this.need) this.shiftUp();
  return { ok: true, plates: this.plates };
};

KitchenMatch.prototype.dispose = function (c, r) {
  var t = this.grid[r] && this.grid[r][c];
  if (!t || t.covered) return false;
  var k = t.food.k;
  if (k !== 'treif' && k !== 'mixed') return false;
  var p = this.cellCenter(c, r);
  this.grid[r][c] = null;
  this.gravity();
  this.correct++;
  if (k === 'mixed') { this.mixedOk++; if (this.mixedOk >= 10) this.award('b_bbc'); }
  if (k === 'treif') { this.treifOk++; if (this.treifOk >= 15) this.award('b_treif'); }
  this.addScore(40, p.x, p.y - 30, k === 'mixed' ? 'NOT TOGETHER +40' : 'NOT KOSHER +40', C.trash);
  Sound.sfx('whoosh'); Haptics.medium();
  FX.burst(p.x, p.y, { n: 10, color: C.trash, spdMax: 220 });
  this.binFlash = 0.4;
  return true;
};

KitchenMatch.prototype.doRise = function () {
  var C = KitchenMatch.COLS, c, r;
  for (c = 0; c < C; c++) {
    if (this.grid[0][c]) {
      this.overload();
      return false;
    }
  }
  for (r = 0; r < KitchenMatch.ROWS - 1; r++) {
    for (c = 0; c < C; c++) this.grid[r][c] = this.grid[r + 1][c];
  }
  for (c = 0; c < C; c++) this.makeSafeTile(c, KitchenMatch.ROWS - 1, true);
  this.untangle(12);
  this.ensurePlayable();
  if (this.plates >= this.need) this.shiftUp();
  return true;
};

KitchenMatch.prototype.overload = function () {
  this.overloads++;
  this.missed++;
  this.breakCombo();
  this.damage('Kitchen overloaded', CFG.W / 2, 520);
  if (this.lives <= 0) return;
  /* knock the top two rows off so there is room to breathe */
  var c, r;
  for (r = 0; r < 2; r++) {
    for (c = 0; c < KitchenMatch.COLS; c++) this.grid[r][c] = null;
  }
  this.gravity();
  this.riseT = this.riseMax;
  this.popFx(CFG.W / 2, 500, 'CLEARED THE TOP', C.teal, 26);
};

KitchenMatch.prototype.shiftUp = function () {
  var self = this;
  if (this._shifting) return;
  this._shifting = true;
  var bonus = 120 * this.level;
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.green, 0.35);
  FX.text(CFG.W / 2, 620, 'SHIFT ' + this.level + '  +' + bonus, C.green, 36);
  if (Profile.unlockLevel('kitchen', this.level + 1) && this.level + 1 <= KitchenMatch.SHIFTS) {
    FX.text(CFG.W / 2, 540, 'SHIFT ' + (this.level + 1) + ' UNLOCKED', C.teal, 28, 3);
  }
  if (this.level >= KitchenMatch.SHIFTS) {
    this.victory = true;
    this.award('b_plates');
    this.finish('You plated all twelve!');
    this._shifting = false;
    return;
  }
  this.level++;
  this.interstitial(function () {
    self._shifting = false;
    self.setupShift(false);
    Input.clear();
    Game.setState('PLAYING');
  });
};

KitchenMatch.prototype.rushEvery = function () { return Math.max(12, 22 - this.level); };
KitchenMatch.prototype.speed = function () {
  return (this.rushT > 0 ? 1.7 : 1);
};
KitchenMatch.prototype.interval = function () {
  return this.riseMax * (this.rushT > 0 ? 0.55 : 1);
};

/* ---------------------------------------------------------------- input */
KitchenMatch.prototype.neighbourOf = function (a, b) {
  if (!a || !b) return false;
  return Math.abs(a.c - b.c) + Math.abs(a.r - b.r) === 1;
};

KitchenMatch.prototype.handle = function (ev) {
  var cell, t, p, from, to, dx, dy, dc, dr, res, origin;
  if (ev.type === 'down') {
    this.dragSwapped = false;
    cell = this.cellAt(ev.x, ev.y);
    if (this.selected && cell && this.neighbourOf(this.selected, cell) && this.grid[cell.r][cell.c]) {
      res = this.trySwap(this.selected.c, this.selected.r, cell.c, cell.r);
      this.dragSwapped = true;
      this.hold = null;
      if (res.reason !== 'far') this.selected = null;
      return;
    }
    if (cell && this.grid[cell.r][cell.c]) {
      t = this.grid[cell.r][cell.c];
      this.grabs[ev.id] = cell;
      if (t.covered) { this.hold = null; return; }
      this.selected = { c: cell.c, r: cell.r };
      this.hold = { id: ev.id, c: cell.c, r: cell.r, x: ev.x, y: ev.y, follow: true };
      Sound.sfx('ui'); Haptics.light();
    } else {
      delete this.grabs[ev.id];
      this.hold = null;
      this.selected = null;
    }
    return;
  }
  if (ev.type === 'move') {
    if (!this.hold || this.hold.id !== ev.id || this.dragSwapped || !this.hold.follow) return;
    this.hold.x = ev.x; this.hold.y = ev.y;
    origin = this.cellCenter(this.hold.c, this.hold.r);
    dx = ev.x - origin.x; dy = ev.y - origin.y;
    t = this.grid[this.hold.r][this.hold.c];
    if (t && dy < -48 && Math.abs(dy) > Math.abs(dx) * 1.1) {
      if (this.dispose(this.hold.c, this.hold.r)) {
        this.dragSwapped = true; this.hold = null; this.selected = null;
      }
      return;
    }
    if (Math.max(Math.abs(dx), Math.abs(dy)) < KitchenMatch.CELL * 0.35) return;
    dc = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : 0;
    dr = Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? 1 : -1) : 0;
    to = { c: this.hold.c + dc, r: this.hold.r + dr };
    if (to.c < 0 || to.r < 0 || to.c >= KitchenMatch.COLS || to.r >= KitchenMatch.ROWS) return;
    res = this.trySwap(this.hold.c, this.hold.r, to.c, to.r);
    if (res.reason === 'empty' || res.reason === 'far') return;
    this.dragSwapped = true;
    this.hold.follow = false;
    if (res.ok) { this.hold = null; this.selected = null; }
    return;
  }
  if (ev.type === 'up') {
    if (this.hold && this.hold.id === ev.id) this.hold = null;
    delete this.grabs[ev.id];
    return;
  }
  if (ev.type === 'tap') {
    if (this.dragSwapped) return;
    cell = this.cellAt(ev.x, ev.y);
    if (!cell) { this.selected = null; return; }
    t = this.grid[cell.r][cell.c];
    if (t && t.covered) {
      t.covered = false;
      t.reveal = 0.35;
      this.uncovered++;
      this.selected = null;
      p = this.cellCenter(cell.c, cell.r);
      this.addScore(10, p.x, p.y - 40, 'UNCOVERED', C.cream);
      Sound.sfx('ui'); Haptics.light();
      FX.burst(p.x, p.y - 16, { n: 10, color: '#cfd8e8', spdMax: 200, grav: 260 });
      return;
    }
    if (!t) { this.selected = null; return; }
    if (this.selected && this.selected.c === cell.c && this.selected.r === cell.r) return;
    if (this.selected) {
      res = this.trySwap(this.selected.c, this.selected.r, cell.c, cell.r);
      if (res.reason === 'far') this.selected = { c: cell.c, r: cell.r };
      else this.selected = null;
      return;
    }
    this.selected = { c: cell.c, r: cell.r };
    return;
  }
  if (ev.type !== 'swipe') return;
  if (this.dragSwapped) return;
  from = this.grabs[ev.id];
  if (!from && this.selected) from = this.selected;
  if (!from) from = this.cellAt(ev.x, ev.y);
  delete this.grabs[ev.id];
  if (!from) return;
  t = this.grid[from.r] && this.grid[from.r][from.c];
  if (!t) return;
  dx = ev.x2 - ev.x; dy = ev.y2 - ev.y;
  if (dy < -40 && Math.abs(dy) > Math.abs(dx) * 1.1) {
    if (this.dispose(from.c, from.r)) { this.selected = null; return; }
  }
  dc = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : 0;
  dr = Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? 1 : -1) : 0;
  to = { c: from.c + dc, r: from.r + dr };
  if (to.c < 0 || to.r < 0 || to.c >= KitchenMatch.COLS || to.r >= KitchenMatch.ROWS) return;
  this.selected = null;
  this.trySwap(from.c, from.r, to.c, to.r);
};

/* --------------------------------------------------------------- update */
KitchenMatch.prototype.update = function (dt) {
  this.elapsed += dt;
  if (this.busy > 0) this.busy -= dt;
  if (this.binFlash > 0) this.binFlash -= dt;
  if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
  if (this.hint) { this.hint.t += dt; if (this.hint.t > this.hint.life) this.hint = null; }

  var r, c, t;
  for (r = 0; r < KitchenMatch.ROWS; r++) {
    for (c = 0; c < KitchenMatch.COLS; c++) {
      t = this.grid[r][c];
      if (!t) continue;
      if (t.reveal > 0) t.reveal -= dt;
      if (t.fall > 0) t.fall -= dt;
    }
  }

  if (this.rushT > 0) {
    this.rushT -= dt;
    if (this.rushT <= 0) { this.rushT = 0; this.mult = 1; Sound.sfx('back'); }
  } else if ((this.cfg && this.cfg.rush) || this.level >= 7) {
    this.rushTimer -= dt;
    if (this.rushTimer <= 0) {
      this.rushTimer = this.rushEvery() + rand(-2, 3);
      this.rushT = 8;
      this.rushes++;
      this.mult = 2;
      Sound.sfx('levelup'); Haptics.double();
      FX.flash(C.gold, 0.3);
      this.say('KASHRUS RUSH!', 'the stack rises faster - plates are worth double', C.gold, 2.6);
    }
  }

  if (this.busy <= 0 && !this._shifting) {
    this.riseT -= dt * (this.rushT > 0 ? 1.7 : 1);
    if (this.riseT <= 0) {
      this.riseT = this.riseMax;
      this.doRise();
    }
  }
};

/* --------------------------------------------------------------- render */
KitchenMatch.prototype.render = function (ctx) {
  var t = this.elapsed, S = this.scene(), o = this.origin(), CELL = KitchenMatch.CELL;
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, S.sky || [
    [0, '#101728'], [0.5, '#18213a'], [1, '#0d1322']
  ]);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  ctx.lineWidth = 2;
  var i;
  for (i = 0; i < CFG.W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CFG.H); ctx.stroke(); }
  for (i = 0; i < CFG.H; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CFG.W, i); ctx.stroke(); }
  ctx.restore();

  var bw = KitchenMatch.COLS * CELL, bh = KitchenMatch.ROWS * CELL;
  Draw.panel(ctx, o.x - 10, o.y - 10, bw + 20, bh + 28, {
    fill: 'rgba(8,12,22,.78)', radius: 18, stroke: 'rgba(255,255,255,.12)'
  });

  /* danger strip at the top shelf */
  ctx.fillStyle = 'rgba(255,91,91,' + (0.10 + 0.08 * pulse(t, 2.2)) + ')';
  ctx.fillRect(o.x, o.y, bw, CELL);
  ctx.strokeStyle = 'rgba(255,91,91,.7)';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(o.x, o.y + 4); ctx.lineTo(o.x + bw, o.y + 4); ctx.stroke();
  ctx.setLineDash([]);

  var r, col, tile, p, lift;
  var held = this.hold && this.hold.follow && !this.dragSwapped
    ? this.grid[this.hold.r] && this.grid[this.hold.r][this.hold.c]
    : null;
  for (r = 0; r < KitchenMatch.ROWS; r++) {
    for (col = 0; col < KitchenMatch.COLS; col++) {
      tile = this.grid[r][col];
      p = this.cellCenter(col, r);
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      ctx.lineWidth = 2;
      Draw.rr(ctx, p.x - CELL / 2 + 4, p.y - CELL / 2 + 4, CELL - 8, CELL - 8, 12); ctx.stroke();
      if (!tile) continue;
      if (held && col === this.hold.c && r === this.hold.r) {
        ctx.save();
        ctx.globalAlpha = 0.28;
        this.drawItem(ctx, tile.food, p.x, p.y, 30, 0, 0.35, tile);
        ctx.restore();
        continue;
      }
      lift = tile.fall > 0 ? -tile.fall * 90 : 0;
      this.drawItem(ctx, tile.food, p.x, p.y + lift, 30, 0, 1, tile);
      if (this.selected && this.selected.c === col && this.selected.r === r) {
        ctx.save();
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 5;
        ctx.shadowColor = C.gold; ctx.shadowBlur = 16;
        Draw.rr(ctx, p.x - CELL / 2 + 3, p.y - CELL / 2 + 3 + lift, CELL - 6, CELL - 6, 14); ctx.stroke();
        ctx.restore();
      }
    }
  }
  if (held) {
    this.drawItem(ctx, held.food, this.hold.x, this.hold.y, 34, 0, 1, held);
    ctx.save();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 5;
    ctx.shadowColor = C.gold; ctx.shadowBlur = 18;
    Draw.rr(ctx, this.hold.x - CELL / 2 + 2, this.hold.y - CELL / 2 + 2, CELL - 4, CELL - 4, 16); ctx.stroke();
    ctx.restore();
  }

  /* disposal chute */
  var fl = clamp((this.binFlash || 0) / 0.4, 0, 1);
  Draw.panel(ctx, o.x + bw - 168, o.y - 86, 168, 64, {
    fill: 'rgba(10,14,28,.92)', radius: 14, stroke: fl > 0 ? C.trash : 'rgba(255,255,255,.18)', strokeW: 3
  });
  Draw.text(ctx, 'DISPOSAL  ↑', o.x + bw - 84, o.y - 54, {
    size: 16, color: C.trash, align: 'center', weight: '900'
  });

  /* colour key: what can share a plate */
  var keyY = o.y - 54;
  var keys = [
    { label: 'MEAT', color: C.meat },
    { label: 'PAREVE', color: C.pareve },
    { label: 'DAIRY', color: C.dairy }
  ];
  Draw.text(ctx, 'SHARE A PLATE', o.x + 18, keyY - 18, {
    size: 12, color: 'rgba(255,255,255,.45)', weight: '800'
  });
  for (i = 0; i < keys.length; i++) {
    var kx = o.x + 18 + i * 108;
    ctx.fillStyle = keys[i].color;
    ctx.beginPath(); ctx.arc(kx, keyY, 8, 0, TAU); ctx.fill();
    Draw.text(ctx, keys[i].label, kx + 14, keyY + 1, {
      size: 14, color: 'rgba(255,255,255,.78)', weight: '800'
    });
  }

  /* rise meter */
  var riseK = 1 - clamp(this.riseT / this.riseMax, 0, 1);
  Draw.panel(ctx, o.x, o.y + bh + 20, bw, 18, { fill: 'rgba(6,10,26,.8)', radius: 8 });
  Draw.meter(ctx, o.x + 6, o.y + bh + 24, bw - 12, 10, riseK, {
    fg: riseK > 0.8 ? C.red : (this.rushT > 0 ? C.gold : C.green), gloss: false
  });

  if (this.rushT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.05 * pulse(t, 4);
    ctx.fillStyle = C.gold;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.restore();
    var ba = clamp(Math.min(this.rushT / 0.4, (8 - this.rushT) / 0.3), 0, 1);
    ctx.save();
    ctx.globalAlpha = ba;
    Draw.panel(ctx, 80, 268, CFG.W - 160, 44, {
      fill: 'rgba(60,38,6,.95)', stroke: C.gold, strokeW: 3, radius: 14,
      glow: 'rgba(255,207,92,.5)', glowBlur: 20
    });
    Draw.textSafe(ctx, 'KASHRUS RUSH  x2', CFG.W / 2, 290, {
      size: 22, maxW: CFG.W - 200, color: C.gold, weight: '900'
    });
    ctx.restore();
  }

  if (this.banner) {
    var b = this.banner;
    var a = clamp(b.t / Math.min(0.45, b.max), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    Draw.panel(ctx, 40, 250, CFG.W - 80, b.sub ? 80 : 52, {
      fill: 'rgba(6,10,26,.92)', radius: 16, stroke: b.color, strokeW: 3, glow: b.color, glowBlur: 18
    });
    Draw.textSafe(ctx, b.title, CFG.W / 2, 282, { size: 26, maxW: CFG.W - 130, color: b.color, weight: '900' });
    if (b.sub) Draw.textSafe(ctx, b.sub, CFG.W / 2, 310, { size: 16, maxW: CFG.W - 130, color: 'rgba(255,255,255,.78)', weight: '800' });
    ctx.restore();
  }
};

KitchenMatch.prototype.drawItem = function (ctx, food, x, y, r, rot, alpha, item) {
  if (item && item.covered) { this.drawCovered(ctx, x, y, r); return; }
  var col = KitchenMatch.sideColor(food);
  var label = KitchenMatch.sideLabel(food);
  var S = KitchenMatch.CELL;
  var hw = S / 2 - 8;
  var a = alpha == null ? 1 : alpha;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, hw - 1, hw * 0.8, 5, 0, 0, TAU); ctx.fill();
  Draw.rr(ctx, -hw, -hw, hw * 2, hw * 2, 16);
  ctx.fillStyle = col;
  ctx.globalAlpha = a * 0.28;
  ctx.fill();
  ctx.globalAlpha = a;
  ctx.strokeStyle = col;
  ctx.lineWidth = 4;
  Draw.rr(ctx, -hw, -hw, hw * 2, hw * 2, 16);
  ctx.stroke();

  var pillH = 15, pillY = -hw + 6;
  var pillW = Math.min(hw * 2 - 18, Draw.measure(ctx, label, 10, '900') + 14);
  ctx.fillStyle = col;
  Draw.rr(ctx, -pillW / 2, pillY, pillW, pillH, 7); ctx.fill();
  Draw.text(ctx, label, 0, pillY + pillH / 2, {
    size: 10, color: '#0a1018', align: 'center', weight: '900'
  });

  Foods.draw(ctx, food.shape, 0, -2, 32);

  var nameSize = 11, maxW = hw * 2 - 28;
  var nw = Draw.measure(ctx, food.name, nameSize, '800');
  if (nw > maxW) nameSize = Math.max(8, nameSize * (maxW / nw));
  Draw.text(ctx, food.name, 0, hw - 17, {
    size: nameSize, color: C.cream, align: 'center', weight: '800', stroke: 'rgba(0,0,0,.85)', strokeW: 3
  });
  ctx.restore();
  if (item && item.reveal > 0) {
    var k = 1 - item.reveal / 0.35;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    this.drawDome(ctx, x, y - k * 50, r, 1 + k * 0.25);
    ctx.restore();
  }
};

KitchenMatch.prototype.drawDome = function (ctx, x, y, r, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale || 1, scale || 1);
  var g = ctx.createLinearGradient(0, -r, 0, r * 0.4);
  g.addColorStop(0, '#e8eef7');
  g.addColorStop(0.5, '#aab6c8');
  g.addColorStop(1, '#7c8899');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, r * 0.28, r * 0.98, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.stroke();
  ctx.fillStyle = '#cfd8e8';
  Draw.rr(ctx, -r * 0.16, -r * 0.92, r * 0.32, r * 0.2, r * 0.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.34, -r * 0.24, r * 0.16, r * 0.34, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
};

KitchenMatch.prototype.drawCovered = function (ctx, x, y, r) {
  var t = this.elapsed;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.72, r * 0.8, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.fillStyle = '#59637a';
  Draw.rr(ctx, x - r, y + r * 0.24, r * 2, r * 0.24, r * 0.12); ctx.fill();
  ctx.restore();
  this.drawDome(ctx, x, y, r, 1);
  Draw.text(ctx, '?', x, y - r * 0.12, {
    size: r * 0.8, color: 'rgba(40,50,66,.75)', align: 'center', weight: '900'
  });
  Draw.text(ctx, 'TAP', x, y + KitchenMatch.CELL / 2 - 18, {
    size: 11, color: 'rgba(255,207,92,' + (0.5 + 0.5 * pulse(t, 2.2)) + ')',
    align: 'center', weight: '900', stroke: 'rgba(0,0,0,.75)', strokeW: 3
  });
};

KitchenMatch.prototype.renderHud = function (ctx, y) {
  var w = 250, x = 26 + View.safe.l;
  Draw.panel(ctx, x, y - 6, w, 56, { fill: 'rgba(6,10,26,.8)', radius: 16, stroke: 'rgba(255,255,255,.14)' });
  Draw.textFit(ctx, this.cfg ? this.cfg.name : ('SHIFT ' + this.level), x + 16, y + 22, 150, {
    size: 18, color: this.rushT > 0 ? C.gold : C.green, weight: '900'

  Draw.text(ctx, this.plates + '/' + this.need, x + w - 16, y + 22, {
    size: 20, color: 'rgba(255,255,255,.7)', align: 'right', weight: '800'
  });
  Draw.meter(ctx, x + 16, y + 36, w - 32, 8, this.need ? this.plates / this.need : 0, { fg: C.green, gloss: false });
  var note = Nusach.kitchenNote();
  if (note) {
    var nw = Math.min(520, CFG.W - x - 110 - View.safe.r);
    Draw.panel(ctx, x, y + 58, nw, 40, {
      fill: 'rgba(6,10,26,.82)', radius: 12, stroke: 'rgba(94,224,192,.45)'
    });
    Draw.textFit(ctx, note, x + 14, y + 78, nw - 28, {
      size: 16, color: '#c8fff0', weight: '800'
    });
  }
};

KitchenMatch.prototype.stats = function () {

};

MatzahHavoc.prototype.scene = function () {
  var S = MatzahHavoc.SCENES;
  return S[(clamp(this.level, 1, MatzahHavoc.ROUTES) - 1) % S.length];
};
MatzahHavoc.prototype.tune = function () { return this.scene(); };

MatzahHavoc.prototype.say = function (title, sub, color, dur) {
  this.banner = { title: title, sub: sub || '', color: color || C.gold, t: dur || 3, max: dur || 3 };
};

MatzahHavoc.prototype.reset = function () {
  this.score = 0; this.lives = 3; this.maxLives = 3; this.combo = 0;
  this.level = 1; this.elapsed = 0;
  this.sliced = 0; this.giants = 0; this.cloudsBusted = 0; this.shieldsTaken = 0; this.deliveries = 0;
  this.metYeast = false; this.metGiant = false; this.metDough = false;
  this.metSlick = false; this.metWind = false; this.metDump = false; this.metBlock = false;
  this.setupRoute();
};

MatzahHavoc.prototype.setupRoute = function (keepCargo) {
  var t = this.tune();
  this.cfg = t;
  this.truckX = 360; this.targetX = 360; this.slideV = 0;
  this.dist = 0;
  this.goal = t.goal;
  this.hourMax = t.hour; this.hour = t.hour;
  this.cargo = keepCargo ? Math.min(1, (this.cargo || 0.6) + 0.3) : 1;
  this.shield = 0;
  this.chametz = [];
  this.obstacles = [];
  this.clouds = [];
  this.pickups = [];
  this.flakes = [];
  this.roadPhase = 0;
  this.spawnAir = t.air;
  this.spawnRoad = t.road;
  this.spawnCloud = t.yeast ? t.cloud : 99;
  this.spawnPickup = t.pickup;
  this.steer = null;
  this.tornado = t.tornado ? 3.2 : 0;
  this.tornadoLeft = t.tornado ? 1 : 0;
  this.trails = {};
  this.hitFlash = 0;
  this.dumpT = t.dump ? rand(3.5, 6.5) : 99;
  this.dumpFlash = 0;
  this.dumpSide = 1;
  this.wind = 0;
  this.windDir = chance(0.5) ? 1 : -1;
  this.windT = rand(2.5, 4.5);
  this.banner = null;
  this.closedLane = t.block ? randInt(0, 3) : -1;
  var wt = t.weather;
  if (wt) {
    var n = wt === 'rain' ? 36 : 40;
    for (var f = 0; f < n; f++) {
      this.flakes.push({
        x: rand(-40, CFG.W + 40), y: rand(0, CFG.H),
        sp: wt === 'rain' ? rand(420, 720) : rand(40, 90),
        sw: rand(0, TAU), r: wt === 'rain' ? rand(0.8, 1.5) : rand(1.8, 3.4)
      });
    }
  }
  this.say(t.name, t.sub, C.gold, 3);
  if (t.yeast && !this.metYeast) { this.metYeast = true; }
  if (t.giants && !this.metGiant) { this.metGiant = true; }
  if (t.dough && !this.metDough) { this.metDough = true; }
  if (t.slick && !this.metSlick) { this.metSlick = true; }
  if (t.wind && !this.metWind) { this.metWind = true; }
  if (t.dump && !this.metDump) { this.metDump = true; }
  if (t.block && !this.metBlock) { this.metBlock = true; }
};

MatzahHavoc.prototype.speed = function () {
  return (this.cfg && this.cfg.speed) || (300 + Math.min(this.level, 10) * 45);
};

/* The truck's actual body, pulled in slightly so a near miss stays a miss.
   The drawn box is x +/-82 and y -118..+106; this is a touch smaller. */
MatzahHavoc.prototype.truckRect = function () {
  return { x: this.truckX - 68, y: MatzahHavoc.TRUCK_Y - 104, w: 136, h: 196 };
};
MatzahHavoc.circleRect = function (cx, cy, r, R) {
  var nx = clamp(cx, R.x, R.x + R.w);
  var ny = clamp(cy, R.y, R.y + R.h);
  return dist2(cx, cy, nx, ny) < r * r;
};
MatzahHavoc.rectRect = function (a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
};
MatzahHavoc.prototype.sliderRect = function () {
  var y = CFG.H - 96 - View.safe.b;
  return { x: 44, y: y - 40, w: 300, h: 80, cy: y };
};

/* ---------------------------------------------------------------- input */
MatzahHavoc.prototype.handle = function (ev) {
  var sl = this.sliderRect();
  var i;
  if (ev.type === 'down') {
    var inSlider = ev.x >= sl.x - 30 && ev.x <= sl.x + sl.w + 30 && ev.y >= sl.y - 30 && ev.y <= sl.y + sl.h + 40;
    var onTruck = Math.abs(ev.x - this.truckX) < 90 && Math.abs(ev.y - MatzahHavoc.TRUCK_Y) < 110;
    if (inSlider) { this.steer = { id: ev.id, mode: 'slider' }; this.setSlider(ev.x); return; }
    if (onTruck) { this.steer = { id: ev.id, mode: 'direct' }; this.targetX = ev.x; return; }
    /* tap on a yeast cloud */
    for (i = this.clouds.length - 1; i >= 0; i--) {
      var cl = this.clouds[i];
      if (distance(ev.x, ev.y, cl.x, cl.y) < cl.r + 24) {
        cl.taps++;
        cl.shake = 0.2;
        Sound.sfx('tap'); Haptics.light();
        FX.burst(ev.x, ev.y, { n: 5, color: '#e6dfd0', spdMax: 130, grav: 40 });
        if (cl.taps >= cl.need) {
          this.clouds.splice(i, 1);
          this.cloudsBusted++;
          if (this.cloudsBusted >= 10) this.award('b_yeast');
          this.addScore(60, cl.x, cl.y, 'DISPERSED +60', C.cream);
          this.hitCombo();
          Sound.sfx('whoosh'); Haptics.medium();
          FX.burst(cl.x, cl.y, { n: 22, color: '#efe7d6', spdMax: 300, grav: 60 });
        }
        return;
      }
    }
    return;
  }

  if (ev.type === 'up') {
    if (this.steer && this.steer.id === ev.id) this.steer = null;
    delete this.trails[ev.id];
    return;
  }

  if (ev.type === 'move') {
    if (this.steer && this.steer.id === ev.id) {
      if (this.steer.mode === 'slider') this.setSlider(ev.x);
      else this.targetX = clamp(ev.x, MatzahHavoc.MIN_X, MatzahHavoc.MAX_X);
      return;
    }
    /* slicing */
    var sp = Math.hypot(ev.dx, ev.dy);
    if (sp < 6) return;
    var tr = this.trails[ev.id] || (this.trails[ev.id] = []);
    tr.push({ x: ev.x, y: ev.y });
    if (tr.length > 10) tr.shift();
    if (tr.length > 1) FX.slash(tr, 'rgba(255,255,255,.95)');
    var power = Input.count >= 2 ? 2 : 1;
    this.sliceSegment(ev.px, ev.py, ev.x, ev.y, power);
    return;
  }

  if (ev.type === 'multiswipe') {
    /* two-finger combo: heavy damage in a radius */
    for (i = this.chametz.length - 1; i >= 0; i--) {
      var c = this.chametz[i];
      if (distance(ev.x, ev.y, c.x, c.y) < 220) this.cutChametz(c, 3, true);
    }
    FX.ring(ev.x, ev.y, C.gold, 60);
    Sound.sfx('slice');
    return;
  }

  if (ev.type === 'swipe') {
    this.sliceSegment(ev.x, ev.y, ev.x2, ev.y2, ev.speed > 1400 ? 2 : 1);
  }
};

MatzahHavoc.prototype.setSlider = function (x) {
  var sl = this.sliderRect();
  var k = clamp((x - sl.x) / sl.w, 0, 1);
  this.targetX = lerp(MatzahHavoc.MIN_X, MatzahHavoc.MAX_X, k);
};

MatzahHavoc.prototype.sliceSegment = function (x1, y1, x2, y2, power) {
  for (var i = this.chametz.length - 1; i >= 0; i--) {
    var c = this.chametz[i];
    if (MatzahHavoc.segCircle(x1, y1, x2, y2, c.x, c.y, c.r + 10)) {
      this.cutChametz(c, power || 1, false);
    }
  }
};

MatzahHavoc.segCircle = function (x1, y1, x2, y2, cx, cy, r) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 === 0 ? 0 : clamp(((cx - x1) * dx + (cy - y1) * dy) / len2, 0, 1);
  var px = x1 + dx * t, py = y1 + dy * t;
  return dist2(px, py, cx, cy) <= r * r;
};

MatzahHavoc.prototype.cutChametz = function (c, power, combo) {
  if (c.dead) return;
  /* one cut per stroke: a single swipe generates many move samples, so a
     short cooldown keeps a giant croissant from dying to one flick */
  if (!combo && c.cool > 0) return;
  c.cool = 0.22;
  c.hp -= power;
  c.flash = 0.16;
  if (c.hp > 0) {
    Sound.sfx('slice');
    FX.burst(c.x, c.y, { n: 6, color: '#e6c58a', spdMax: 180 });
    return;
  }
  c.dead = true;
  var idx = this.chametz.indexOf(c);
  if (idx >= 0) this.chametz.splice(idx, 1);
  this.sliced++;
  Profile.noteBest('sliced', this.sliced);
  if (this.sliced >= 50) this.award('b_slice');
  if (c.giant) {
    this.giants++;
    if (this.giants >= 10) this.award('b_giant');
  }
  var pts = c.giant ? 120 : (c.kind === 'dough' ? 50 : 30);
  if (combo) pts += 40;
  this.hitCombo();
  if (this.combo === 3) FX.text(c.x, c.y - 50, 'NICE!', C.teal, 28, 3);
  else if (this.combo === 5) FX.text(c.x, c.y - 50, 'STREAK!', C.gold, 30, 3);
  else if (this.combo === 8) FX.text(c.x, c.y - 50, 'UNSTOPPABLE!', C.gold, 32, 3);
  this.addScore(pts + Math.min(this.combo, 15) * 2, c.x, c.y, '+' + pts, c.giant ? C.gold : C.cream);
  Sound.sfx('slice');
  Haptics.light();
  FX.burst(c.x, c.y, { n: c.giant ? 26 : 14, color: '#e8c68d', spdMax: c.giant ? 420 : 260, shape: 'square', rMax: 7 });
  FX.ring(c.x, c.y, 'rgba(255,255,255,.8)', c.r * 0.6);
};

/* --------------------------------------------------------------- update */
MatzahHavoc.prototype.update = function (dt) {
  this.elapsed += dt;
  var i, t = this.cfg, sp = this.speed();
  this.roadPhase = (this.roadPhase + sp * dt) % 120;
  this.dist += sp * dt;
  this.hour -= dt;
  if (this.hitFlash > 0) this.hitFlash -= dt;
  if (this.shield > 0) this.shield -= dt;
  if (this.tornado > 0) this.tornado -= dt;
  if (this.dumpFlash > 0) this.dumpFlash -= dt;
  if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

  if (t.slick) {
    var want = this.targetX - this.truckX;
    this.slideV = approach(this.slideV, want * 3.4, 640 * dt);
    this.truckX += this.slideV * dt;
    this.slideV *= Math.max(0, 1 - 1.8 * dt);
  } else {
    this.slideV = 0;
    this.truckX = approach(this.truckX, this.targetX, 900 * dt);
  }
  this.truckX = clamp(this.truckX, MatzahHavoc.MIN_X, MatzahHavoc.MAX_X);

  this.score += dt * 6;

  if (t.wind) {
    this.windT -= dt;
    if (this.windT <= 0) {
      if (chance(0.18)) this.windDir *= -1;
      this.windT = rand(3.2, 6.5);
    }
    this.wind = approach(this.wind, this.windDir * t.wind, 90 * dt);
  } else {
    this.wind = approach(this.wind, 0, 80 * dt);
  }

  this.updateWeather(dt);

  /* ---- spawn flying chametz ---- */
  this.spawnAir -= dt;
  if (this.spawnAir <= 0) {
    this.spawnAir = Math.max(0.38, t.air) * rand(0.75, 1.2);
    this.spawnChametz();
    if (this.tornado > 0 || (t.giants && chance(0.22))) this.spawnChametz();
  }
  if (t.tornado && this.tornadoLeft && this.elapsed > 2.6) {
    this.tornadoLeft = 0;
    this.tornado = 5.4;
    this.say('CHAMETZ TWISTER!', 'slash everything!', C.gold, 3);
    Sound.sfx('wind');
    for (i = 0; i < 6; i++) this.spawnChametz();
  } else if (this.tornado <= 0 && t.tornado && chance(dt * 0.022) && this.elapsed > 8) {
    this.tornado = 4.2;
    this.say('ANOTHER TWISTER!', 'here they come', C.gold, 2.4);
    Sound.sfx('wind');
    for (i = 0; i < 4; i++) this.spawnChametz();
  }

  if (t.dump) {
    this.dumpT -= dt;
    if (this.dumpT <= 0) {
      this.dumpT = rand(5.2, 8.4);
      this.dumpSide = chance(0.5) ? -1 : 1;
      this.dumpFlash = 0.75;
      Sound.sfx('whoosh');
      this.say('BAKERY BURST!', 'slash the flying batch', C.gold, 2.4);
      for (i = 0; i < 3; i++) this.spawnChametz(this.dumpSide);
    }
  }

  for (i = this.chametz.length - 1; i >= 0; i--) {
    var c = this.chametz[i];
    if (c.flash > 0) c.flash -= dt;
    if (c.cool > 0) c.cool -= dt;
    if (c.kind === 'dough' && !c.giant) {
      c.r += 16 * dt;
      if (c.r >= 72) { c.giant = true; c.hp = 3; }
    }
    c.x += (c.vx + this.wind * 0.55) * dt;
    c.y += c.vy * dt;
    c.vy += 130 * dt;
    c.rot += c.spin * dt;
    if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx); }
    if (c.x > CFG.W - c.r) { c.x = CFG.W - c.r; c.vx = -Math.abs(c.vx); }
    if (this.shield > 0) {
      /* the aura disintegrates anything that reaches it, and while it is up
         nothing can touch the cargo at all */
      if (distance(c.x, c.y, this.truckX, MatzahHavoc.TRUCK_Y) < 150 + c.r * 0.6) {
        c.cool = 0;
        this.cutChametz(c, 99, false);
        continue;
      }
    } else if (MatzahHavoc.circleRect(c.x, c.y, c.r * 0.78, this.truckRect())) {
      this.chametz.splice(i, 1);
      this.cargoHit(0.2, 'Chametz on the cargo!', c.x, c.y);
      if (this.lives <= 0) return;
      continue;
    }
    if (c.y > CFG.H + 120 || c.y < -400) this.chametz.splice(i, 1);
  }

  /* ---- road obstacles ---- */
  this.spawnRoad -= dt;
  if (this.spawnRoad <= 0) {
    this.spawnRoad = Math.max(0.55, t.road) * rand(0.8, 1.2);
    this.spawnObstacle();
  }
  for (i = this.obstacles.length - 1; i >= 0; i--) {
    var o = this.obstacles[i];
    o.y += sp * o.rel * dt;
    if (o.y > CFG.H + 200) { this.obstacles.splice(i, 1); continue; }
    var oBox = { x: o.x - o.w / 2 + 14, y: o.y - o.h / 2 + 14, w: o.w - 28, h: o.h - 28 };
    if (this.shield > 0 && MatzahHavoc.rectRect(oBox, this.truckRect())) {
      this.obstacles.splice(i, 1);
      this.addScore(o.kind === 'car' ? 60 : 25, o.x, o.y, 'SHIELDED', C.gold);
      Sound.sfx('shield');
      FX.burst(o.x, o.y, { n: 18, color: C.gold, spdMax: 300 });
      continue;
    }
    if (this.shield <= 0 && MatzahHavoc.rectRect(oBox, this.truckRect())) {
      this.obstacles.splice(i, 1);
      var crash = o.kind === 'car' ? 'Crashed into traffic'
        : o.kind === 'pothole' ? 'Hit a pothole'
        : o.kind === 'crate' ? 'Hit a crate'
        : o.kind === 'cart' ? 'Hit a cart' : 'Hit a cone';
      this.damage(crash, this.truckX, MatzahHavoc.TRUCK_Y - 90);
      this.hitFlash = 0.4;
      if (this.lives <= 0) return;
    }
  }

  /* ---- yeast dust clouds ---- */
  if (t.yeast) this.spawnCloud -= dt;
  if (t.yeast && this.spawnCloud <= 0) {
    this.spawnCloud = Math.max(3.6, t.cloud) * rand(0.85, 1.2);
    if (this.clouds.length < 4) {
      this.clouds.push({
        x: rand(140, CFG.W - 140), y: -90, r: 74,
        vy: rand(70, 105) + this.level * 5, taps: 0, need: 4 + Math.min(3, (this.level / 2) | 0),
        wob: rand(0, TAU), shake: 0
      });
    }
  }
  for (i = this.clouds.length - 1; i >= 0; i--) {
    var cl = this.clouds[i];
    cl.y += cl.vy * dt;
    cl.wob += dt * 2;
    if (cl.shake > 0) cl.shake -= dt;
    if (this.shield > 0) {
      if (distance(cl.x, cl.y, this.truckX, MatzahHavoc.TRUCK_Y) < 210) {
        this.clouds.splice(i, 1);
        this.addScore(40, cl.x, cl.y, '+40', C.gold);
        continue;
      }
    } else if (MatzahHavoc.circleRect(cl.x, cl.y, 52, this.truckRect())) {
      this.clouds.splice(i, 1);
      this.cargoHit(0.3, 'Yeast on the shemura!', cl.x, cl.y);
      if (this.lives <= 0) return;
      continue;
    }
    if (cl.y > CFG.H + 120 || cl.y < -400) this.clouds.splice(i, 1);
  }

  /* ---- Afikoman golden shield ---- */
  this.spawnPickup -= dt;
  if (this.spawnPickup <= 0) {
    this.spawnPickup = rand(11, 18);
    this.pickups.push({ x: rand(MatzahHavoc.ROAD_L + 70, MatzahHavoc.ROAD_R - 70), y: -80, r: 40, rot: 0 });
  }
  for (i = this.pickups.length - 1; i >= 0; i--) {
    var pk = this.pickups[i];
    pk.y += sp * 0.75 * dt;
    pk.rot += dt * 2;
    if (distance(pk.x, pk.y, this.truckX, MatzahHavoc.TRUCK_Y) < 100) {
      this.pickups.splice(i, 1);
      this.shield = 6.5;
      this.shieldsTaken++;
      if (this.shieldsTaken >= 5) this.award('b_afik');
      this.addScore(80, pk.x, pk.y, 'AFIKOMAN SHIELD!', C.gold);
      Sound.sfx('shield'); Haptics.win();
      FX.ring(this.truckX, MatzahHavoc.TRUCK_Y, C.gold, 60);
      continue;
    }
    if (pk.y > CFG.H + 120) this.pickups.splice(i, 1);
  }

  /* ---- the fourth hour ---- */
  if (this.hour <= 0) {
    this.hour = this.hourMax * 0.65;
    if (this.shield > 0) {
      FX.text(this.truckX, MatzahHavoc.TRUCK_Y - 120, 'THE AFIKOMAN HELD THE HOUR', C.gold, 26, 3);
    } else {
      this.damage('The fourth hour passed', this.truckX, MatzahHavoc.TRUCK_Y - 120);
      if (this.lives <= 0) return;
    }
  }

  /* ---- delivery complete ---- */
  if (this.dist >= this.goal) this.deliver();
};

MatzahHavoc.prototype.updateWeather = function (dt) {
  var wt = this.cfg && this.cfg.weather;
  if (!wt || !this.flakes) return;
  for (var i = 0; i < this.flakes.length; i++) {
    var f = this.flakes[i];
    f.y += f.sp * dt;
    f.x += (this.wind * 0.12 + (wt === 'rain' ? -40 : 18)) * dt;
    f.sw += dt * 1.6;
    if (f.y > CFG.H + 12) { f.y = -12; f.x = rand(-40, CFG.W + 40); }
    if (f.x < -50) f.x = CFG.W + 40;
    if (f.x > CFG.W + 50) f.x = -40;
  }
};

MatzahHavoc.prototype.spawnObstacle = function () {
  if (this.obstacles.length >= 8) return;
  var t = this.cfg, lane = randInt(0, 3), kind;
  if (t.block && this.closedLane >= 0 && chance(0.5)) lane = this.closedLane;
  if (t.block && lane === this.closedLane && chance(0.6)) kind = 'cone';
  else if (t.id === 'harbor' && chance(0.42)) kind = 'crate';
  else if ((t.id === 'market' || t.id === 'city') && chance(0.28)) kind = 'cart';
  else if (chance(1 - t.cars)) kind = 'pothole';
  else kind = 'car';
  var sizes = {
    car: { w: 118, h: 190, rel: rand(0.35, 0.6) },
    pothole: { w: 96, h: 60, rel: 1 },
    crate: { w: 100, h: 92, rel: 0.85 },
    cart: { w: 110, h: 140, rel: 0.55 },
    cone: { w: 86, h: 70, rel: 1 }
  };
  var sz = sizes[kind] || sizes.car;
  this.obstacles.push({
    x: MatzahHavoc.ROAD_L + 72 + lane * 143, y: -120,
    w: sz.w, h: sz.h, kind: kind, color: ShulCrossing.paint('car'), rel: sz.rel, lane: lane
  });
};

MatzahHavoc.prototype.cargoHit = function (amount, msg, x, y) {
  this.cargo -= amount;
  this.breakCombo();
  FX.shake(12, 0.3);
  Sound.sfx('bad');
  Haptics.double();
  FX.text(x, y, msg, C.red, 26);
  FX.burst(x, y, { n: 16, color: '#d8c9a8', spdMax: 240 });
  if (this.cargo <= 0) {
    this.cargo = 0.6;
    this.damage('Shemura matzah ruined', this.truckX, MatzahHavoc.TRUCK_Y - 90);
  }
};

MatzahHavoc.prototype.deliver = function () {
  var self = this;
  this.deliveries++;
  var inTime = this.hour > 0;
  if (inTime) this.award('b_deliver');
  var bonus = 400 + this.level * 150 + Math.round(this.hour * 8) + Math.round(this.cargo * 200);
  this.score += bonus;
  Sound.sfx('levelup'); Haptics.win();
  FX.flash(C.gold, 0.45);
  FX.text(CFG.W / 2, 560, 'DELIVERED!  +' + bonus, C.gold, 40, 3);
  for (var i = 0; i < 30; i++) FX.burst(rand(100, 620), rand(400, 800), { n: 1, color: pick([C.gold, C.cream]), spdMax: 320 });
  if (Profile.unlockLevel('matzah', this.level + 1) && this.level + 1 <= MatzahHavoc.ROUTES) {
    FX.text(CFG.W / 2, 500, 'ROUTE ' + (this.level + 1) + ' UNLOCKED', C.teal, 28, 3);
  }
  if (this.level >= MatzahHavoc.ROUTES) {
    this.victory = true;
    this.award('b_routes');
    this.finish('You delivered all twelve!');
    return;
  }
  this.level++;
  this.interstitial(function () {
    self.setupRoute(true);
    Input.clear();
    Game.setState('PLAYING');
  });
};

MatzahHavoc.prototype.spawnChametz = function (sideForce) {
  if (this.chametz.length >= 22) return;
  var giant = !!(this.cfg && this.cfg.giants) && chance(0.12 + this.level * 0.012);
  var side = sideForce || (chance(0.5) ? -1 : 1);
  var kinds = giant ? ['croissant'] : ['loaf', 'challah', 'bagel', 'pretzel', 'baguette'];
  var kind = pick(kinds);
  var dough = !giant && this.cfg && this.cfg.dough && chance(0.22);
  if (dough) kind = 'dough';
  this.chametz.push({
    kind: kind, giant: giant,
    x: side < 0 ? rand(-40, 120) : rand(CFG.W - 120, CFG.W + 40),
    y: rand(View.safe.t + 220, 520),
    vx: side < 0 ? rand(90, 210) : -rand(90, 210),
    vy: rand(-40, 40),
    r: giant ? 78 : (dough ? 30 : 44),
    rot: rand(0, TAU), spin: rand(-3, 3),
    hp: giant ? 3 : 1, flash: 0, cool: 0, dead: false
  });
};

/* --------------------------------------------------------------- render */
MatzahHavoc.prototype.render = function (ctx) {
  var i, t = this.elapsed, S = this.scene();
  this.drawWorld(ctx, S, t);

  /* obstacles */
  for (i = 0; i < this.obstacles.length; i++) this.drawObstacle(ctx, this.obstacles[i]);

  /* pickups */
  for (i = 0; i < this.pickups.length; i++) {
    var pk = this.pickups[i];
    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(Math.sin(pk.rot) * 0.3);
    ctx.fillStyle = '#f6d97a';
    Draw.rr(ctx, -38, -38, 76, 76, 10); ctx.fill();
    ctx.strokeStyle = '#c79a2f'; ctx.lineWidth = 4;
    Draw.rr(ctx, -38, -38, 76, 76, 10); ctx.stroke();
    ctx.setLineDash([5, 7]); ctx.lineWidth = 3;
    for (var q = -2; q <= 2; q++) {
      ctx.beginPath(); ctx.moveTo(q * 14, -32); ctx.lineTo(q * 14, 32); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
    Draw.text(ctx, 'AFIKOMAN', pk.x, pk.y + 58, { size: 17, color: '#7a5411', align: 'center', weight: '900' });
  }

  /* yeast clouds */
  for (i = 0; i < this.clouds.length; i++) {
    var cl = this.clouds[i];
    var jitter = cl.shake > 0 ? rand(-4, 4) : 0;
    ctx.save();
    ctx.translate(cl.x + jitter, cl.y + jitter);
    ctx.fillStyle = 'rgba(238,231,214,.92)';
    var puffs = [[-38, 6, 34], [0, -16, 42], [38, 6, 34], [-14, 22, 28], [18, 22, 28]];
    for (var pI = 0; pI < puffs.length; pI++) {
      ctx.beginPath();
      ctx.arc(puffs[pI][0], puffs[pI][1] + Math.sin(cl.wob + pI) * 3, puffs[pI][2], 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(150,132,96,.5)';
    for (var d = 0; d < 8; d++) {
      var a = cl.wob + d;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 30, Math.sin(a * 1.4) * 18, 4, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    var left = cl.need - cl.taps;
    Draw.text(ctx, 'TAP x' + left, cl.x, cl.y + 4, {
      size: 26, color: '#6b5a38', align: 'center', weight: '900'
    });
  }

  /* flying chametz */
  for (i = 0; i < this.chametz.length; i++) this.drawChametz(ctx, this.chametz[i]);

  /* truck */
  this.drawTruck(ctx);

  /* shield aura */
  if (this.shield > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(this.shield / 6.5, 0.2, 1) * (0.5 + 0.3 * pulse(t, 2));
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(this.truckX, MatzahHavoc.TRUCK_Y, 150, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (this.hitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = this.hitFlash;
    ctx.strokeStyle = C.red; ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, CFG.W - 12, CFG.H - 12);
    ctx.restore();
  }

  /* steering slider */
  this.drawSlider(ctx);
  this.drawWeather(ctx, S);
  this.drawBanner(ctx);
};

MatzahHavoc.prototype.drawChametz = function (ctx, c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  var s = c.r / 44;
  ctx.scale(s, s);
  ctx.lineJoin = 'round';
  if (c.kind === 'loaf') {
    ctx.fillStyle = '#c98d4a';
    ctx.beginPath();
    ctx.moveTo(-44, 18);
    ctx.quadraticCurveTo(-48, -30, 0, -32);
    ctx.quadraticCurveTo(48, -30, 44, 18);
    ctx.quadraticCurveTo(44, 32, 0, 32);
    ctx.quadraticCurveTo(-44, 32, -44, 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9c6a2f'; ctx.lineWidth = 5; ctx.stroke();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-22, -16); ctx.lineTo(-12, 0);
    ctx.moveTo(-2, -22); ctx.lineTo(8, -6);
    ctx.moveTo(18, -18); ctx.lineTo(28, -2);
    ctx.stroke();
  } else if (c.kind === 'challah') {
    ctx.fillStyle = '#d99b4d';
    for (var i = -1; i <= 1; i++) {
      ctx.save();
      ctx.rotate(i * 0.25);
      ctx.beginPath(); ctx.ellipse(0, i * 12, 44, 15, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#a86f2c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 44, 26, 0, 0, TAU); ctx.stroke();
  } else if (c.kind === 'bagel') {
    ctx.fillStyle = '#cf9a55';
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, TAU, false);
    ctx.arc(0, 0, 13, 0, TAU, true);
    ctx.fill('evenodd');
    ctx.strokeStyle = '#a06f30'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.stroke();
  } else if (c.kind === 'pretzel') {
    ctx.strokeStyle = '#b8802f'; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-16, 4, 18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(16, 4, 18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22, -14); ctx.quadraticCurveTo(0, -34, 22, -14); ctx.stroke();
  } else if (c.kind === 'baguette') {
    ctx.fillStyle = '#d5a05a';
    ctx.beginPath(); ctx.ellipse(0, 0, 52, 17, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8752f'; ctx.lineWidth = 4;
    for (var j = -3; j <= 3; j++) {
      ctx.beginPath(); ctx.moveTo(j * 12 - 5, -9); ctx.lineTo(j * 12 + 5, 3); ctx.stroke();
    }
  } else if (c.kind === 'dough') {
    ctx.fillStyle = '#efe4c8';
    ctx.beginPath(); ctx.arc(-12, 6, 22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(14, 4, 20, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -12, 24, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c8b48a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(180,150,100,.35)';
    ctx.beginPath(); ctx.arc(-6, -4, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 8, 5, 0, TAU); ctx.fill();
  } else { /* croissant */
    ctx.fillStyle = '#e0aa5b';
    ctx.beginPath();
    ctx.arc(0, 10, 46, Math.PI * 1.05, Math.PI * 1.95);
    ctx.quadraticCurveTo(0, 44, -44, -6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#b07a2c'; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-18, -22); ctx.lineTo(-12, 6);
    ctx.moveTo(4, -28); ctx.lineTo(4, 4);
    ctx.moveTo(24, -20); ctx.lineTo(18, 6);
    ctx.stroke();
  }
  ctx.restore();
  if (c.giant) {
    var hpw = 90;
    Draw.meter(ctx, c.x - hpw / 2, c.y + c.r + 12, hpw, 10, c.hp / 3, { fg: C.red, gloss: false });
    Draw.text(ctx, 'COMBO SWIPE', c.x, c.y + c.r + 38, {
      size: 16, color: '#5c4318', align: 'center', weight: '900'
    });
  }
};

MatzahHavoc.prototype.drawTruck = function (ctx) {
  var x = this.truckX, y = MatzahHavoc.TRUCK_Y;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  Draw.rr(ctx, x - 76, y - 108, 156, 216, 18); ctx.fill();
  /* box */
  ctx.fillStyle = '#f4ead4';
  Draw.rr(ctx, x - 82, y - 118, 164, 200, 16); ctx.fill();
  ctx.strokeStyle = '#b9a87f'; ctx.lineWidth = 5;
  Draw.rr(ctx, x - 82, y - 118, 164, 200, 16); ctx.stroke();
  /* matzah pattern on the box */
  ctx.save();
  ctx.strokeStyle = 'rgba(160,130,80,.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([5, 8]);
  for (var i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(x + i * 30, y - 104); ctx.lineTo(x + i * 30, y + 22); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
  Draw.text(ctx, 'SHEMURA', x, y - 44, { size: 20, color: '#8a6a2f', align: 'center', weight: '900' });
  Draw.text(ctx, 'MATZAH', x, y - 20, { size: 20, color: '#8a6a2f', align: 'center', weight: '900' });
  /* cab */
  ctx.fillStyle = '#2f6fa8';
  Draw.rr(ctx, x - 74, y + 30, 148, 76, 14); ctx.fill();
  ctx.fillStyle = 'rgba(180,225,255,.85)';
  Draw.rr(ctx, x - 58, y + 42, 116, 34, 8); ctx.fill();
  /* wheels */
  ctx.fillStyle = '#191c26';
  Draw.rr(ctx, x - 96, y - 70, 20, 60, 8); ctx.fill();
  Draw.rr(ctx, x + 76, y - 70, 20, 60, 8); ctx.fill();
  Draw.rr(ctx, x - 90, y + 40, 20, 56, 8); ctx.fill();
  Draw.rr(ctx, x + 70, y + 40, 20, 56, 8); ctx.fill();
  ctx.restore();
  /* cargo meter above the truck */
  Draw.meter(ctx, x - 84, y - 152, 168, 18, this.cargo, {
    fg: this.cargo > 0.6 ? C.cream : (this.cargo > 0.3 ? C.gold : C.red)
  });
  Draw.text(ctx, 'SHEMURA CARGO', x, y - 174, { size: 17, color: C.cream, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.7)', strokeW: 5 });
};

MatzahHavoc.prototype.drawSlider = function (ctx) {
  var sl = this.sliderRect();
  ctx.save();
  ctx.globalAlpha = 0.92;
  Draw.rr(ctx, sl.x, sl.cy - 26, sl.w, 52, 26);
  ctx.fillStyle = 'rgba(10,14,28,.8)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.3)';
  ctx.stroke();
  var k = (this.targetX - MatzahHavoc.MIN_X) / (MatzahHavoc.MAX_X - MatzahHavoc.MIN_X);
  var kx = sl.x + clamp(k, 0, 1) * sl.w;
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(kx, sl.cy, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(kx - 9, sl.cy - 11, 4, 22);
  ctx.fillRect(kx - 1, sl.cy - 11, 4, 22);
  ctx.fillRect(kx + 7, sl.cy - 11, 4, 22);
  ctx.restore();
  Draw.text(ctx, 'STEER', sl.x + sl.w / 2, sl.cy - 44, {
    size: 17, color: 'rgba(255,255,255,.7)', align: 'center', weight: '900'
  });
  Draw.text(ctx, 'SLASH THE CHAMETZ', CFG.W - 40, sl.cy - 44, {
    size: 17, color: 'rgba(255,255,255,.7)', align: 'right', weight: '900'
  });
};

MatzahHavoc.prototype.renderHud = function (ctx, y) {
  var w = 300, x = (CFG.W - w) / 2;
  Draw.panel(ctx, x, y - 6, w, 76, { fill: 'rgba(6,10,26,.8)', radius: 16, stroke: 'rgba(255,255,255,.14)' });
  var late = this.hour / this.hourMax < 0.28;
  Draw.text(ctx, '4TH HOUR', x + 16, y + 18, { size: 19, color: late ? C.red : C.gold, weight: '900' });
  Draw.text(ctx, mmss(this.hour), x + w - 16, y + 18, {
    size: 20, color: late ? C.red : 'rgba(255,255,255,.75)', align: 'right', weight: '800'
  });
  Draw.meter(ctx, x + 16, y + 32, w - 32, 12, clamp(this.hour / this.hourMax, 0, 1), {
    fg: late ? C.red : C.teal, gloss: false
  });
  Draw.textFit(ctx, this.cfg ? this.cfg.name : ('ROUTE ' + this.level), x + 16, y + 58, 148, {
    size: 16, color: 'rgba(255,255,255,.6)', weight: '800'
  });
  Draw.meter(ctx, x + 168, y + 50, w - 184, 12, clamp(this.dist / this.goal, 0, 1), { fg: C.gold, gloss: false });
};

MatzahHavoc.prototype.stats = function () {
  return [
    ['Deliveries made', this.deliveries],
    ['Chametz sliced', this.sliced],
    ['Giant croissants', this.giants],
    ['Yeast clouds cleared', this.cloudsBusted]
  ];
};

MatzahHavoc.prototype.drawWorld = function (ctx, S, t) {
  var i, A = MatzahHavoc;
  Draw.vGradient(ctx, 0, 0, CFG.W, CFG.H, S.sky);
  ctx.fillStyle = S.sand;
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.fillStyle = S.curb;
  ctx.fillRect(0, 0, A.ROAD_L, CFG.H);
  ctx.fillRect(A.ROAD_R, 0, CFG.W - A.ROAD_R, CFG.H);

  /* roadside scenery - beside the road, never over it */
  for (i = 0; i < 10; i++) {
    var ry = ((i * 190 + this.roadPhase * 1.15) % (CFG.H + 240)) - 120;
    this.drawRoadside(ctx, S, 36, ry, i, 1);
    this.drawRoadside(ctx, S, CFG.W - 36, ry + 70, i + 3, -1);
  }

  if (S.dump && this.dumpFlash > 0) {
    var dx = this.dumpSide < 0 ? 28 : CFG.W - 28;
    ctx.save();
    ctx.globalAlpha = this.dumpFlash;
    ctx.fillStyle = 'rgba(255,180,80,.55)';
    ctx.beginPath(); ctx.arc(dx, 340, 46, 0, TAU); ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = S.asphalt;
  ctx.fillRect(A.ROAD_L, 0, A.ROAD_R - A.ROAD_L, CFG.H);
  ctx.fillStyle = S.night ? 'rgba(255,214,140,.75)' : 'rgba(255,255,255,.85)';
  ctx.fillRect(A.ROAD_L, 0, 6, CFG.H);
  ctx.fillRect(A.ROAD_R - 6, 0, 6, CFG.H);
  ctx.save();
  ctx.strokeStyle = S.line;
  ctx.lineWidth = 6;
  ctx.setLineDash([56, 64]);
  ctx.lineDashOffset = -this.roadPhase;
  for (i = 1; i < 4; i++) {
    var lx = A.ROAD_L + i * (A.ROAD_R - A.ROAD_L) / 4;
    ctx.beginPath(); ctx.moveTo(lx, -50); ctx.lineTo(lx, CFG.H + 50); ctx.stroke();
  }
  ctx.restore();

  if (this.dist > this.goal * 0.78) {
    var near = clamp((this.dist - this.goal * 0.78) / (this.goal * 0.22), 0, 1);
    var dy = lerp(-80, 220, near);
    this.drawDestination(ctx, S, dy);
  }
};

MatzahHavoc.prototype.drawRoadside = function (ctx, S, x, y, i, dir) {
  ctx.save();
  if (S.id === 'harbor') {
    ctx.fillStyle = 'rgba(40,110,130,.55)';
    ctx.fillRect(dir > 0 ? 0 : CFG.W - 28, y - 40, 28, 90);
    ctx.fillStyle = '#8a6a40';
    ctx.fillRect(x - 4, y - 30, 8, 54);
  } else if (S.night) {
    ctx.fillStyle = '#2a2418';
    ctx.fillRect(x - 4, y - 10, 8, 70);
    ctx.fillStyle = 'rgba(255,196,110,.22)';
    ctx.beginPath(); ctx.arc(x, y - 18, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,214,140,.85)';
    ctx.beginPath(); ctx.arc(x, y - 18, 7, 0, TAU); ctx.fill();
  } else if (S.id === 'bakery' || S.id === 'market' || S.id === 'city' || S.id === 'erev') {
    ctx.fillStyle = i % 2 ? '#6a4a32' : '#4a3a4a';
    Draw.rr(ctx, x - 22, y - 8, 44, 56, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,196,96,.55)';
    ctx.fillRect(x - 12, y + 6, 10, 12);
    ctx.fillRect(x + 2, y + 6, 10, 12);
  } else if (S.id === 'stone') {
    ctx.fillStyle = '#6a6454';
    ctx.fillRect(x - 18, y, 36, 40);
  } else {
    ctx.fillStyle = 'rgba(90,70,48,.4)';
    ctx.beginPath(); ctx.arc(x, y + 20, 12 + (i % 3) * 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
};

MatzahHavoc.prototype.drawDestination = function (ctx, S, y) {
  var cx = CFG.W / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  Draw.rr(ctx, cx - 70, y + 8, 140, 70, 12); ctx.fill();
  ctx.fillStyle = S.night ? '#3a2a18' : '#d8c49a';
  Draw.rr(ctx, cx - 64, y - 10, 128, 72, 10); ctx.fill();
  ctx.fillStyle = S.night ? 'rgba(255,196,110,.7)' : 'rgba(80,50,24,.55)';
  ctx.fillRect(cx - 18, y + 18, 36, 40);
  ctx.fillStyle = C.gold;
  Draw.magenDavid(ctx, cx, y + 8, 12, C.gold, 2.5);
  Draw.text(ctx, 'DELIVERY', cx, y - 22, { size: 16, color: C.cream, align: 'center', weight: '900', stroke: 'rgba(0,0,0,.55)', strokeW: 4 });
  ctx.restore();
};

MatzahHavoc.prototype.drawObstacle = function (ctx, o) {
  if (o.kind === 'pothole') {
    ctx.save();
    ctx.fillStyle = '#1a1d26';
    ctx.beginPath(); ctx.ellipse(o.x, o.y, o.w / 2, o.h / 2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
    return;
  }
  if (o.kind === 'cone') {
    ctx.save();
    ctx.fillStyle = '#e07030';
    ctx.beginPath();
    ctx.moveTo(o.x, o.y - o.h / 2);
    ctx.lineTo(o.x + o.w / 2, o.y + o.h / 2);
    ctx.lineTo(o.x - o.w / 2, o.y + o.h / 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4ead4';
    ctx.fillRect(o.x - o.w / 4, o.y - 4, o.w / 2, 10);
    ctx.restore();
    return;
  }
  if (o.kind === 'crate') {
    ctx.save();
    ctx.fillStyle = '#8a6234';
    Draw.rr(ctx, o.x - o.w / 2, o.y - o.h / 2, o.w, o.h, 8); ctx.fill();

    ctx.restore();
    return;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  Draw.rr(ctx, o.x - o.w / 2 + 6, o.y - o.h / 2 + 10, o.w, o.h, 16); ctx.fill();

  Draw.rr(ctx, o.x + o.w / 2 - 9, o.y - o.h / 2 + 24, 18, 46, 7); ctx.fill();
  Draw.rr(ctx, o.x - o.w / 2 - 9, o.y + o.h / 2 - 70, 18, 46, 7); ctx.fill();
  Draw.rr(ctx, o.x + o.w / 2 - 9, o.y + o.h / 2 - 70, 18, 46, 7); ctx.fill();
  ctx.fillStyle = o.color;
  Draw.rr(ctx, o.x - o.w / 2, o.y - o.h / 2, o.w, o.h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  Draw.rr(ctx, o.x - o.w / 2 + 8, o.y - o.h / 2 + 6, o.w - 16, o.h - 12, 14); ctx.fill();
  ctx.fillStyle = 'rgba(20,30,55,.78)';
  Draw.rr(ctx, o.x - o.w / 2 + 14, o.y - o.h / 2 + 16, o.w - 28, 40, 9); ctx.fill();
  Draw.rr(ctx, o.x - o.w / 2 + 14, o.y + o.h / 2 - 60, o.w - 28, 40, 9); ctx.fill();

};

MatzahHavoc.prototype.drawWeather = function (ctx, S) {
  if (!this.flakes || !this.flakes.length) return;
  ctx.save();
  var rain = S.weather === 'rain';
  ctx.fillStyle = rain ? 'rgba(180,210,230,.55)' : 'rgba(245,236,214,.7)';
